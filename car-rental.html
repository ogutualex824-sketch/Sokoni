<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Rental — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#58a6ff}
.hero{background:linear-gradient(135deg,#0d1117,#091020);padding:40px 16px 28px;text-align:center}
.hero h1{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:8px}
.hero p{color:#8b949e;font-size:14px;max-width:480px;margin:0 auto 20px}
.fbar{background:#161b22;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar select,.fbar input{padding:8px 12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px}
.pill{padding:6px 13px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.pill.active,.pill:hover{background:#1f6feb;border-color:#1f6feb;color:#fff}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:#58a6ff;transform:translateY(-2px)}
.cimg{height:165px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}
.cbody{padding:14px}
.cmake{font-size:17px;font-weight:700;margin-bottom:2px}
.cmeta{font-size:12px;color:#8b949e;margin-bottom:8px}
.cchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:3px 8px;background:#21262d;border-radius:4px;font-size:12px;color:#8b949e}
.cprice{font-size:18px;font-weight:700;color:#58a6ff}
.cloc{font-size:12px;color:#8b949e;margin-top:3px}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-b{background:#1f6feb;color:#fff}.btn-b:hover{background:#388bfd}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:560px;margin:auto}
.mhdr{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.mhdr h2{font-size:16px;font-weight:600}.xbtn{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
.mbody{padding:20px}
.stbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
.stbl tr:nth-child(even){background:#0d1117}
.stbl td{padding:7px 10px;border-bottom:1px solid #30363d}
.stbl td:first-child{color:#8b949e;width:38%}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px}
.fg input,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg textarea{resize:vertical;min-height:70px}
.empty{text-align:center;padding:60px;color:#8b949e}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">🚗 Car Rental</div>
  <div style="margin-left:auto"><a href="/car-hub" style="color:#8b949e;font-size:13px">All Vehicles →</a></div>
</div>
<div class="hero">
  <h1>Rent a Vehicle in Kenya</h1>
  <p>Browse cars, SUVs, minibuses and more available for daily rental across Kenya.</p>
</div>
<div class="fbar">
  <div id="vTypeF" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <select id="fuelF" onchange="filter()"><option value="">Any Fuel</option><option value="petrol">Petrol</option><option value="diesel">Diesel</option><option value="electric">Electric</option></select>
  <input type="number" id="maxP" placeholder="Max/day (KES)" style="width:130px" oninput="filter()">
  <input type="text" id="countyF" placeholder="County…" style="width:100px" oninput="filter()">
</div>
<div class="container">
  <div id="listArea"><div class="empty"><div class="spinner"></div></div></div>
  <div style="text-align:center;margin-top:16px;display:none" id="moreBtn"><button class="btn btn-out" onclick="loadMore()">Load More</button></div>
</div>

<div class="overlay" id="vModal">
  <div class="modal">
    <div class="mhdr"><h2 id="mTitle"></h2><button class="xbtn" onclick="close('vModal')">×</button></div>
    <div class="mbody">
      <div style="height:160px;background:#21262d;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:14px;overflow:hidden" id="mImg"></div>
      <div style="font-size:20px;font-weight:700;color:#58a6ff;margin-bottom:8px" id="mPrice"></div>
      <table class="stbl" id="mSpec"></table>
      <p id="mDesc" style="font-size:14px;color:#8b949e;line-height:1.6;margin-bottom:14px"></p>
      <hr style="border:none;border-top:1px solid #30363d;margin:14px 0">
      <h4 style="margin-bottom:12px">Contact Owner</h4>
      <div class="fg"><label>Message</label><textarea id="enqMsg" placeholder="I'd like to rent this vehicle. Is it available?"></textarea></div>
      <div class="fg"><label>Rental Dates</label><input type="text" id="enqDates" placeholder="e.g. 15 Dec – 18 Dec 2026"></div>
      <div class="fg"><label>Phone (optional)</label><input type="tel" id="enqPh" placeholder="+254…"></div>
      <button class="btn btn-b" style="width:100%" onclick="sendEnq()">Send Rental Enquiry</button>
    </div>
  </div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,all=[],sel=null,cursor=null;
const VT=['sedan','suv','pickup','van','bus','motorbike','other'];
const VE={sedan:'🚗',suv:'🚙',pickup:'🛻',van:'🚐',bus:'🚌',motorbike:'🏍️',other:'🚘'};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
function open(id){document.getElementById(id).classList.add('open');}
function close(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
try{app=firebase.initializeApp(firebaseConfig,'rental');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

let activeVT=new Set();
function buildF(){document.getElementById('vTypeF').innerHTML=VT.map(t=>`<div class="pill" onclick="toggleT('${t}',this)">${VE[t]} ${t}</div>`).join('');}
function toggleT(t,el){activeVT.has(t)?(activeVT.delete(t),el.classList.remove('active')):(activeVT.add(t),el.classList.add('active'));filter();}
function filter(){
  const fuel=document.getElementById('fuelF').value;
  const maxP=parseFloat(document.getElementById('maxP').value)||Infinity;
  const county=document.getElementById('countyF').value.toLowerCase();
  let list=[...all];
  if(activeVT.size) list=list.filter(v=>activeVT.has(v.vehicleType));
  if(fuel) list=list.filter(v=>v.fuelType===fuel);
  if(maxP<Infinity) list=list.filter(v=>v.price<=maxP);
  if(county) list=list.filter(v=>(v.county||'').toLowerCase().includes(county));
  render(list);
}

async function load(){
  const r=await call('listVehicles',{listingType:'for_rent',limit:24});
  if(!r.ok){document.getElementById('listArea').innerHTML='<div class="empty">Could not load rentals.</div>';return;}
  all=r.data.listings||[];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}
async function loadMore(){
  if(!cursor)return;
  const r=await call('listVehicles',{listingType:'for_rent',limit:24,cursor});
  if(!r.ok)return;
  all=[...all,...(r.data.listings||[])];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}
function render(list){
  if(!list.length){document.getElementById('listArea').innerHTML='<div class="empty">No rentals available.</div>';return;}
  document.getElementById('listArea').innerHTML='<div class="grid">'+list.map(v=>`
    <div class="card" onclick="openV('${esc(v.listingId)}')">
      <div class="cimg">${v.images?.[0]?`<img src="${esc(v.images[0])}" loading="lazy">`:VE[v.vehicleType]||'🚗'}</div>
      <div class="cbody">
        <div class="cmake">${esc(v.make)} ${esc(v.model)}</div>
        <div class="cmeta">${v.year} · ${v.color||''} · ${v.seats||'—'} seats</div>
        <div class="cchips"><span class="chip">${v.fuelType||''}</span><span class="chip">${v.transmission||''}</span>${v.negotiable?'<span class="chip">Negotiable</span>':''}</div>
        <div class="cprice">KES ${(v.price||0).toLocaleString()}/day</div>
        <div class="cloc">📍 ${esc(v.county||'Kenya')}</div>
      </div>
    </div>`).join('')+'</div>';
}
async function openV(id){
  sel=all.find(v=>v.listingId===id)||{};
  if(!sel.description){const r=await call('getVehicle',{listingId:id});if(r.ok)sel=r.data;}
  const v=sel;
  document.getElementById('mTitle').textContent=`${v.year||''} ${v.make||''} ${v.model||''}`;
  document.getElementById('mPrice').textContent=`KES ${(v.price||0).toLocaleString()} / day${v.negotiable?' (Negotiable)':''}`;
  document.getElementById('mImg').innerHTML=v.images?.[0]?`<img src="${esc(v.images[0])}" style="width:100%;height:100%;object-fit:cover">`:VE[v.vehicleType]||'🚗';
  document.getElementById('mSpec').innerHTML=[['Make',v.make],['Model',v.model],['Year',v.year],['Fuel',v.fuelType],['Transmission',v.transmission],['Seats',v.seats||'—'],['Color',v.color],['County',v.county]].filter(([,val])=>val!=null).map(([k,val])=>`<tr><td>${k}</td><td><strong>${esc(String(val))}</strong></td></tr>`).join('');
  document.getElementById('mDesc').textContent=v.description||'';
  open('vModal');
}
async function sendEnq(){
  if(!cu){toast('Sign in to contact the owner',false);return;}
  const msg=document.getElementById('enqMsg').value.trim();
  if(!msg){toast('Write a message',false);return;}
  const r=await call('submitVehicleEnquiry',{listingId:sel.listingId,message:msg+'\nRental dates: '+document.getElementById('enqDates').value,phone:document.getElementById('enqPh').value.trim()});
  if(r.ok){toast('Enquiry sent!');close('vModal');}else toast(r.err||'Failed',false);
}
buildF();load();
</script>
</body>
</html>
