<!DOCTYPE html>
<html lang="en" style="background:#050505">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script src="security.js"></script>
<!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
     through SokoniCart; without this tag the pip cannot render a count. -->
<script src="sokoni-cart.js"></script>
<script src="shared-header.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — SOKONI</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="sokoni-tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Premium dark by default (was light + gated behind prefers-color-scheme:dark, which
   left it light on light-OS devices while the platform forces data-theme="dark"). */
:root{--c-bg:#050505;--c-surface:#111115;--c-border:rgba(255,255,255,0.08);--c-primary:#71ff00;--c-primary-light:rgba(113,255,0,0.07);--c-text:rgba(255,255,255,0.9);--c-sub:rgba(255,255,255,0.42);--c-red:#f87171;--radius:12px}
body{font-family:'Inter',sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;padding-bottom:80px}

/* Sticks BELOW the shared header, not at viewport top. shared-header.js injects a
   position:fixed nav and publishes its measured height as --sk-header-h; a sticky bar
   pinned at top:0 scrolls straight underneath it (z-index 100 vs 100001) and the
   "Messages" title disappears behind the header. Same contract .sk-sub-nav uses. */
.topbar{position:sticky;top:var(--sk-header-h,58px);z-index:100;background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:0 16px;height:60px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:20px;font-weight:700;flex:1}
.icon-btn{width:40px;height:40px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-sub)}
.icon-btn:hover{background:var(--c-bg)}

.search-wrap{padding:12px 16px;background:var(--c-surface);border-bottom:1px solid var(--c-border)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:10px;padding:0 12px;height:42px}
.search-box input{flex:1;border:none;background:none;font-size:14px;color:var(--c-text);outline:none}
.search-box .material-icons{font-size:20px;color:var(--c-sub)}

.filters{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:var(--c-surface);border-bottom:1px solid var(--c-border)}
.filters::-webkit-scrollbar{display:none}
.filter-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--c-border);background:var(--c-surface);cursor:pointer;color:var(--c-sub);transition:.15s}
.filter-chip.active{background:rgba(113,255,0,0.12);border-color:rgba(113,255,0,0.35);color:#71ff00}

.conv-list{padding:8px 0}
.conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--c-border);background:var(--c-surface);transition:.1s;text-decoration:none;color:inherit}
.conv-item:hover{background:rgba(255,255,255,0.04)}
.conv-item.unread{background:var(--c-primary-light)}
.conv-avatar{width:48px;height:48px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;color:#000;font-size:20px;flex-shrink:0;overflow:hidden}
.conv-avatar img{width:100%;height:100%;object-fit:cover}
.conv-body{flex:1;min-width:0}
.conv-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-subtitle{font-size:12px;color:var(--c-sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview{font-size:13px;color:var(--c-sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.unread .conv-preview{color:var(--c-text);font-weight:500}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-time{font-size:11px;color:var(--c-sub)}
.unread-badge{background:var(--c-primary);color:#000;font-size:11px;font-weight:700;border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center}
.empty .material-icons{font-size:64px;color:rgba(255,255,255,0.18);margin-bottom:16px}
.empty h3{font-size:18px;font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;color:var(--c-sub);max-width:280px;line-height:1.5}

.skeleton{background:linear-gradient(90deg,#1a1a1e 25%,#222226 50%,#1a1a1e 75%);background-size:200%;animation:shimmer 1.2s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-conv{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--c-border);background:var(--c-surface)}
.sk-avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0}
.sk-body{flex:1}
.sk-line{height:13px;margin-bottom:7px;border-radius:4px}
.sk-line.w80{width:80%}.sk-line.w60{width:60%}.sk-line.w40{width:40%}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--c-surface);border-top:1px solid var(--c-border);display:flex;height:calc(64px + env(safe-area-inset-bottom,0px));z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
/* .bnav-item tabs are styled by the canonical fallback in sokoni-platform-override.css */

@media(min-width:769px){
  .bottom-nav{display:none}
  body{padding-bottom:0;max-width:640px;margin:0 auto}
}

/* Dark is now the single default (folded into the base rules above), so the platform's
   forced data-theme="dark" is honoured on every device regardless of OS colour scheme. */
</style>
</head>
<body>

<div class="topbar">
  <h1>Messages</h1>
  <button class="icon-btn" onclick="location.href='/'"><span class="material-icons" aria-hidden="true">&#xe88a;</span></button>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="material-icons" aria-hidden="true">&#xe8b6;</span>
    <input type="text" id="searchInput" placeholder="Search conversations…" autocomplete="off">
  </div>
</div>

<div class="filters">
  <button class="filter-chip active" data-filter="all">All</button>
  <button class="filter-chip" data-filter="order">Orders</button>
  <button class="filter-chip" data-filter="service_booking">Services</button>
  <button class="filter-chip" data-filter="food_order">Food</button>
  <button class="filter-chip" data-filter="property_inquiry">Property</button>
  <button class="filter-chip" data-filter="vehicle_inquiry">Vehicles</button>
  <button class="filter-chip" data-filter="job_application">Jobs</button>
  <button class="filter-chip" data-filter="healthcare_appointment">Healthcare</button>
  <button class="filter-chip" data-filter="legal_consultation">Legal</button>
  <button class="filter-chip" data-filter="hotel_reservation">Hotels</button>
  <button class="filter-chip" data-filter="logistics_request">Delivery</button>
  <button class="filter-chip" data-filter="rfq">Quotes</button>
  <button class="filter-chip" data-filter="support_ticket">Support</button>
</div>

<div id="convList" class="conv-list">
  <div class="sk-conv"><div class="skeleton sk-avatar"></div><div class="sk-body"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
  <div class="sk-conv"><div class="skeleton sk-avatar"></div><div class="sk-body"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
  <div class="sk-conv"><div class="skeleton sk-avatar"></div><div class="sk-body"><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w40"></div></div></div>
</div>

<!-- Canonical bottom nav — matches sokoni-nav-engine _CANONICAL_TABS so first paint
     equals the hydrated state (the engine overwrites this at runtime). Styled by the
     nav-unification fallback in sokoni-platform-override.css. -->
<nav class="bottom-nav" data-workspace="buyer" aria-label="Primary navigation">
  <a href="/" class="bnav-item" role="link"><span class="bnav-emoji" aria-hidden="true">🏠</span><span>Home</span></a>
  <a href="category.html?cat=all" class="bnav-item" role="link"><span class="bnav-emoji" aria-hidden="true">🛍️</span><span>Shop</span></a>
  <a href="services.html" class="bnav-item" role="link"><span class="bnav-emoji" aria-hidden="true">🛠️</span><span>Services</span></a>
  <a href="my-orders.html" class="bnav-item" role="link"><span class="bnav-emoji" aria-hidden="true">📦</span><span>Orders</span></a>
  <a href="profile.html" class="bnav-item" role="link"><span class="bnav-emoji" aria-hidden="true">👤</span><span>Profile</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-check-compat.js"></script>
<script type="module" src="firebase.js"></script>
<script src="sokoni-appcheck.js"></script>
<script src="sokoni-chat-engine.js"></script>
<script>
(function(){
'use strict';
var _unsub=null,_all=[],_filter='all',_search='';

firebase.auth().onAuthStateChanged(function(user){
  if(!user){location.href='login.html?redirect=messages.html';return;}
  _subscribe();
});

function _subscribe(){
  if(_unsub)_unsub();
  _unsub=SokoniChat.onConversationsChanged(function(err,convs){
    if(err){_renderErr();return;}
    _all=convs||[];_render();
  });
}

document.querySelectorAll('.filter-chip').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-chip').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');_filter=btn.dataset.filter;_render();
  });
});

var _st;
document.getElementById('searchInput').addEventListener('input',function(e){
  clearTimeout(_st);_st=setTimeout(function(){_search=e.target.value.toLowerCase().trim();_render();},220);
});

function _render(){
  var list=_all;
  if(_filter!=='all')list=list.filter(function(c){return c.transactionType===_filter;});
  if(_search)list=list.filter(function(c){
    return(c.title+' '+c.participantName+' '+(c.lastMessageText||'')).toLowerCase().includes(_search);
  });
  var el=document.getElementById('convList');
  if(!list.length){
    el.innerHTML='<div class="empty"><span class="material-icons" aria-hidden="true">&#xe0cb;</span><h3>No conversations</h3><p>'+
      (_filter!=='all'||_search?'No matching conversations found.':
       'Your conversations appear here when you place an order, make a booking, or submit an inquiry.')+
      '</p></div>';return;
  }
  el.innerHTML=list.map(_convHtml).join('');
}

function _renderErr(){
  document.getElementById('convList').innerHTML=
    '<div class="empty"><span class="material-icons" aria-hidden="true">&#xe001;</span><h3>Could not load messages</h3><p>Check your connection and try again.</p></div>';
}

function _convHtml(c){
  var ctx=SokoniChat.getContext(c.transactionType);
  var unread=(c.unreadCount||0)>0;
  var preview=c.lastMessageText||'No messages yet';
  var t=c.lastMessageAt?SokoniChat.timeStr(c.lastMessageAt):'';
  var avatar=c.participantAvatar
    ?'<img src="'+SokoniChat.esc(c.participantAvatar)+'" alt="">'
    :'<span class="material-icons">'+ctx.icon+'</span>';
  return '<a class="conv-item'+(unread?' unread':'')+'" href="chat.html?id='+encodeURIComponent(c.conversationId)+'">'+
    '<div class="conv-avatar">'+avatar+'</div>'+
    '<div class="conv-body">'+
      '<div class="conv-title">'+SokoniChat.esc(c.participantName||'Unknown')+'</div>'+
      '<div class="conv-subtitle">'+SokoniChat.esc(c.title||'')+'</div>'+
      '<div class="conv-preview">'+SokoniChat.esc(preview)+'</div>'+
    '</div>'+
    '<div class="conv-meta">'+
      '<span class="conv-time">'+SokoniChat.esc(t)+'</span>'+
      (unread?'<span class="unread-badge">'+Math.min(c.unreadCount,99)+'</span>':'')+
    '</div>'+
  '</a>';
}

window.addEventListener('beforeunload',function(){if(_unsub)_unsub();});
})();
</script>
<script src="sokoni-merchant-diag.js" defer></script>
</body>
</html>
