<!DOCTYPE html>
<html lang="en" style="background:#050505">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <script src="security.js"></script>
<script type="module" src="firebase.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOKONI — Universal Search</title>
  <meta name="description" content="Search products, services, jobs, properties, vehicles, businesses and professionals on SOKONI Kenya marketplace.">
  <meta property="og:title" content="SOKONI — Universal Search">
  <meta property="og:description" content="Find anything on SOKONI — Kenya's premier marketplace.">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/logosokoni.png">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sokoni-desktop.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#71ff00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOKONI">

  <style>
    /* ===== BASE ===== */
    :root {
      --accent: #71ff00;
      --accent-dim: rgba(113,255,0,0.12);
      --accent-border: rgba(113,255,0,0.22);
      --bg: #050505;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.45);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ===== SEARCH HERO ===== */
    .search-hero {
      padding: 28px 20px 20px;
      background: linear-gradient(180deg, rgba(113,255,0,0.04) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    .search-hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: .8;
    }

    .search-box-wrap {
      position: relative;
      max-width: 720px;
    }

    .search-box-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
      opacity: .5;
    }

    #searchInput {
      width: 100%;
      padding: 16px 128px 16px 52px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    #searchInput:focus {
      border-color: var(--accent-border);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(113,255,0,0.08), 0 6px 28px rgba(0,0,0,0.4);
    }

    #searchInput::placeholder { color: var(--text-muted); }

    .search-clear-btn,
    .search-voice-btn,
    .search-img-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    .search-clear-btn { right: 14px; display: none; }
    .search-clear-btn.visible { display: flex; }
    .search-voice-btn { right: 52px; }
    .search-img-btn   { right: 90px; }
    .search-clear-btn:hover,
    .search-voice-btn:hover,
    .search-img-btn:hover { background: rgba(255,255,255,0.13); color: var(--text); border-color: rgba(255,255,255,0.18); }
    .search-voice-btn.listening {
      background: rgba(255,50,50,0.12);
      border-color: rgba(255,50,50,0.4);
      color: #ff4d4d;
      animation: voice-pulse 1.2s ease-in-out infinite;
    }
    .search-voice-btn.unsupported { opacity: .35; cursor: not-allowed; }
    @keyframes voice-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,50,50,0.35); }
      50%      { box-shadow: 0 0 0 8px rgba(255,50,50,0); }
    }

    /* ===== TABS ===== */
    .tab-bar-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 14px 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 58px; /* shared header height */
      z-index: 100;
    }
    @media (max-width: 600px) {
      .tab-bar-wrap { top: 112px; } /* two-row header on mobile */
    }
    .tab-bar-wrap::-webkit-scrollbar { display: none; }

    .tab-bar {
      display: flex;
      gap: 4px;
      min-width: max-content;
      padding-bottom: 0;
    }

    .tab-btn {
      padding: 9px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px 10px 0 0;
      white-space: nowrap;
      transition: color .15s, background .15s;
      border-bottom: 2.5px solid transparent;
      position: relative;
      bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); background: var(--surface-hover); }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(113,255,0,0.05);
    }

    .tab-count {
      display: inline-block;
      background: rgba(113,255,0,0.14);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      border-radius: 20px;
      padding: 1px 6px;
      margin-left: 5px;
      min-width: 18px;
      text-align: center;
      transition: opacity .2s;
    }
    .tab-count.hidden { opacity: 0; }

    /* ===== RESULTS AREA ===== */
    .results-area {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .results-meta strong { color: var(--accent); font-weight: 800; }
    .results-meta-count { flex: 1; min-width: 0; }
    .results-sort-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .sort-label { font-size: 11px; color: var(--text-muted); }
    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--accent-border); }

    .price-filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .price-chip {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .price-chip:hover, .price-chip--active {
      border-color: var(--accent-border);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .recent-searches-wrap {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .recent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .recent-clear-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    .recent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .recent-chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .recent-chip:hover {
      border-color: var(--accent-border);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .vbadge { font-size: 12px; vertical-align: middle; margin-left: 4px; }

    /* ===== SKELETON ===== */
    .skeleton-wrap {
      display: grid;
      gap: 10px;
    }

    .skeleton-card {
      height: 80px;
      border-radius: var(--radius);
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.08) 50%,
        rgba(255,255,255,0.04) 75%
      );
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    /* ===== RESULT CARDS ===== */
    .results-grid {
      display: grid;
      gap: 10px;
    }

    .result-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background .15s, border-color .15s, transform .12s;
    }

    .result-card:hover {
      background: var(--surface-hover);
      border-color: rgba(113,255,0,0.18);
      transform: translateY(-1px);
    }

    .result-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    /* Selector is intentionally specific — .result-card > img.result-thumb
       (0,2,1). A global responsive rule ([class*="-card"] > img, specificity
       0,1,1) in sokoni-responsive.css matches this thumbnail because
       "result-card" contains "-card", and it forces width:100%/height:auto,
       stretching the 48px thumb across the whole card and pushing the details
       off the right edge of the screen. This higher-specificity rule reclaims
       the fixed 48x48 size. */
    .result-card > img.result-thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    mark {
      background: transparent;
      color: var(--accent);
      font-weight: 600;
    }

    .result-body {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .result-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .result-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
    }

    .result-location {
      font-size: 11px;
      color: var(--text-muted);
    }

    .result-price {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin-left: auto;
      flex-shrink: 0;
    }

    .result-view-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
      text-decoration: none;
    }
    .result-view-btn:hover { background: rgba(113,255,0,0.22); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
      opacity: .6;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      font-family: inherit;
    }

    .chip:hover {
      background: var(--accent-dim);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    /* ===== PROMPT STATE (no query yet) ===== */
    .prompt-state {
      text-align: center;
      padding: 50px 20px 40px;
    }
    .prompt-state .big-icon { font-size: 64px; display: block; margin-bottom: 18px; opacity: .35; }
    .prompt-state h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .prompt-state p  { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    .category-quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 28px;
      text-align: left;
    }

    .quick-tile {
      padding: 14px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: background .15s, border-color .15s;
    }
    .quick-tile:hover { background: var(--surface-hover); border-color: var(--accent-border); }
    .quick-tile .tile-icon { font-size: 24px; display: block; margin-bottom: 6px; }
    .quick-tile .tile-label { font-size: 12px; font-weight: 700; color: var(--text); display: block; }
    .quick-tile .tile-sub   { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

    /* ===== INFINITE SCROLL SPINNER ===== */
    @keyframes sk-spin { to { transform: rotate(360deg); } }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 500;
      padding: 6px 0 max(6px, env(safe-area-inset-bottom, 6px));
    }
    @media (max-width: 768px) {
      .bottom-nav { display: flex; justify-content: space-around; align-items: center; }
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted); text-decoration: none;
      font-size: 9px; font-weight: 600; gap: 3px; padding: 4px 10px;
      border-radius: 10px; transition: color .15s;
    }
    .bottom-nav a.active, .bottom-nav a:hover { color: var(--accent); }
    .bottom-nav a span:first-child { font-size: 20px; }

    /* ===== TRENDING SECTION ===== */
    .trending-wrap {
      margin-bottom: 24px;
      text-align: left;
    }
    .trending-hd {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 10px;
    }
    .trending-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .trending-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .trending-chip:hover {
      border-color: rgba(255,152,0,0.4);
      background: rgba(255,152,0,0.08);
      color: #ff9800;
    }
    .trending-rank {
      font-size: 9px;
      font-weight: 900;
      color: #ff9800;
      min-width: 14px;
    }

    /* ===== DESKTOP: wider cards ===== */
    @media (min-width: 640px) {
      .results-area { padding: 24px 24px 60px; }
      .result-card { padding: 16px 20px; }
    }
  </style>
</head>

<script src="splash.js"></script>

<!-- Shared header (auto-injected) -->

     through SokoniCart; without this tag the pip cannot render a count. -->

<script src="shared-header.js"></script>

<!-- ===== SEARCH HERO ===== -->
<div class="search-hero">
  <div class="search-hero-label">Universal Search</div>
  <div class="search-box-wrap">
    <span class="search-box-icon">🔍</span>
    <input
      id="searchInput"
      type="search"
      placeholder="Search products, services, jobs, properties…"

    <button class="search-img-btn" id="imgBtn" aria-label="Image search" title="Image search">📷</button>
    <button class="search-clear-btn" id="clearBtn" aria-label="Clear search" title="Clear">✕</button>
  </div>
</div>

<!-- ===== TABS ===== -->

  </div>

<div class="results-area" id="resultsArea">

<nav class="bottom-nav" aria-label="Main navigation">

<script src="sokoni-recommendations.js"></script>

<!-- ===== FIREBASE + SEARCH LOGIC ===== -->
<script type="module">
/* ── Firestore handle ──
   This page used to call initializeApp(FB, "search-page") and read through that
   private app. App Check is configured in exactly one place — firebase.js:111 —
   and it attaches to the DEFAULT app, so a second app carries no attestation.
   With App Check enforced on firestore.googleapis.com, every read from the
   "search-page" app was rejected: one 403 on the shared channel failed all 14
   collection queries at once, which surfaced as "Missing or insufficient
   permissions" for `products` even though its rule is `allow read: if true`.
   The home page never hit this because it does not create its own app.

   firebase.js is already loaded by this page (line 10); ES modules are
   singletons, so this import reuses that instance rather than adding a second.
   Other pages that still spin up private apps (b2b-fee, bos-sync, ch-rt,
   lh-lead, hs-write, th-read, revenue-dash, adm-flags, …) have the same latent
   defect — tracked separately, not changed here. */
import { db } from "./firebase.js";

/* Firestore fallback search — the single implementation shared with
   sokoni-search-engine.js. It carries the where() clauses firestore.rules
   requires for each collection (a list query without them is denied outright),
   searches sellers so a store is findable by name, and applies the platform
   visibility contract. See sokoni-firestore-search.js for the full rationale. */
import { firestoreSearch, warm as warmCatalogue } from "./sokoni-firestore-search.js";

/* Preload the catalogue the moment the page starts, in parallel with everything
   else. By the time a query is typed the data is usually already in memory, so
   the search is a local match rather than a round trip. Fire-and-forget: a
   failure here costs nothing, the search path fetches on demand as before. */
warmCatalogue(db).catch(() => {});

/* Pre-warm the Algolia engine's secured key the moment the engine object exists,
   NOT on the first query. The key comes from a Cloud Function that cold-starts in
   several seconds; deferring it to the first search meant the very first query on
   a fresh session raced that cold start and, when it lost, was issued without a
   key — no results, ~1 in 6 cold loads. Kicking init off here runs the cold start
   during page load and the time the user spends typing, so the key is almost
   always ready by search time. Fire-and-forget and idempotent: doSearch still
   awaits init, so a slow warm-up simply falls back to the same path as before —
   this only removes dead time, it never adds any. */
(function prewarmSearchEngine() {
  let waited = 0;
  const poll = setInterval(function () {
    waited += 100;
    if (window.sokoniSearch && typeof window.sokoniSearch.init === "function") {
      clearInterval(poll);
      window.sokoniSearch.init().catch(() => {});
    } else if (waited >= 5000) {
      clearInterval(poll); /* engine script never loaded — nothing to warm */
    }
  }, 100);
})();

/* ── Session circuit breakers ──
   A search engine that has already failed once with a credential or transport
   error will fail the same way for every keystroke that follows. Measured on
   the live site: a dead Algolia attempt cost 4.1s and an unreachable Typesense
   1.6s — on EVERY query, ahead of the Firestore pass that actually answers.
   One failure per session is diagnosis; repeating it is just latency, so each
   engine is skipped for the rest of the session after it throws.
   A zero-hit result never trips a breaker: an index can legitimately miss one
   query and answer the next. Only a thrown error does. */
const _BREAKER_KEY = "sokoni_search_engine_down_v1";
const _BREAKER_TTL = 6 * 60 * 60 * 1000;   /* re-probe a failed engine every 6h */

/* The breaker is persisted, not just per session. A credential fault — which is
   what Algolia returns today — does not heal between page loads, so re-probing
   it on every fresh page costs the user seconds and can never succeed. Six hours
   is short enough that fixing the key restores Algolia on its own, without a
   deploy, and long enough that nobody pays for the dead path twice in a visit.
   Clear it immediately with: localStorage.removeItem("sokoni_search_engine_down_v1") */
function _breakerRead() {
  try {
    const raw = localStorage.getItem(_BREAKER_KEY);
    if (!raw) return {};
    const v = JSON.parse(raw);
    return (Date.now() - (v.at || 0) < _BREAKER_TTL) ? v : {};
  } catch (_) { return {}; }
}
function _breakerTrip(engine, reason) {
  try {
    const v = _breakerRead();
    v[engine] = reason || true;
    v.at = Date.now();
    localStorage.setItem(_BREAKER_KEY, JSON.stringify(v));
  } catch (_) {}
}
const _breaker      = _breakerRead();
let _algoliaDown    = Boolean(_breaker.algolia);
let _typesenseDown  = Boolean(_breaker.typesense);
const _ALGOLIA_BUDGET_MS = 1500;      /* stop waiting on the Algolia QUERY after this */
/* Engine init is a cold-start Cloud Function call for the secured key and can take
   several seconds. It is bounded SEPARATELY and generously: racing it against the
   1.5s query budget meant a cold-start key fetch blew the budget, threw, and the
   Algolia query was never issued — search fell to a fallback that can itself be
   unavailable, rendering zero results over a live catalogue. */
const _ALGOLIA_INIT_BUDGET_MS = 6000;
const _TS_BUDGET_MS = 1200;           /* cap on the Typesense attempt */

if (_algoliaDown || _typesenseDown) {
  console.info("[SOKONI Search] skipping previously failed engine(s):",
    [_algoliaDown && "algolia", _typesenseDown && "typesense"].filter(Boolean).join(", "));
}

function _predictCategory(q) {
  const s = q.toLowerCase();
  if (/toyota|honda|subaru|suzuki|mazda|nissan|mercedes|bmw|audi|lexus|isuzu|mitsubishi|hyundai|vitz|axio|fielder|probox|hiace|truck|van|pickup|lorry|motorbike|motorcycle|bodaboda|boda boda|piki piki|car for sale|automart/i.test(s)) return 'vehicles';
  if (/apartment|flat|bedsitter|studio|penthouse|villa|land for sale|plot|acre|property|rent house|to let|bedroom br|estate|real estate|office space|warehouse|shop to let|bungalow|maisonette|for rent/i.test(s)) return 'properties';
  if (/concert|festival|conference|seminar|workshop|wedding|birthday party|party venue|event venue|live music|stand.up comedy|comedy night|gala|rave|bash/i.test(s)) return 'events';
  if (/job vacancy|career|internship|attachment|employment|hiring|graduate trainee|recruit|work from home|remote job|sales agent|driver needed|urgent position|apply now/i.test(s)) return 'jobs';
  if (/plumber|electrician|painter|welder|carpenter|mason|fundi|mechanic|tailor|driver for hire|tutor|cleaner|chef|caterer|graphic design|photographer|videographer|it support/i.test(s)) return 'professionals';
  if (/doctor|physician|nurse|surgeon|dentist|hospital|clinic|pharmacy|dawa|specialist|dermatologist|gynecologist|physiotherapist|optician|vet|pediatric/i.test(s)) return 'services';
  if (/lawyer|advocate|solicitor|attorney|legal|litigation|conveyancing|law firm|notary/i.test(s)) return 'services';
  return null;
}

/* ── Sort helpers ── */
function _sortResults(results) {
  if (activeSort === "price_asc") {
    return [...results].sort((a, b) => _parsePrice(a.price) - _parsePrice(b.price));
  }
  if (activeSort === "price_desc") {
    return [...results].sort((a, b) => _parsePrice(b.price) - _parsePrice(a.price));
  }
  return results; /* relevance = original order */
}
function _parsePrice(str) {
  if (!str) return Infinity;
  return parseFloat(String(str).replace(/[^0-9.]/g, "")) || Infinity;
}
function _applyPriceFilter(results) {
  if (!priceFilter) return results;
  const [mn, mx] = priceFilter;
  return results.filter(r => {
    const p = _parsePrice(r.price);
    return p >= mn && p <= mx;
  });
}

  /* ── Infinite scroll sentinel ── */
  const oldSentinel = document.getElementById("scroll-sentinel");

    sentinel.innerHTML = '<div style="width:22px;height:22px;border:2px solid rgba(113,255,0,0.25);border-top-color:#71ff00;border-radius:50%;animation:sk-spin .8s linear infinite;"></div>';
    resultsArea.appendChild(sentinel);

    if (_scrollObserver) _scrollObserver.disconnect();
    _scrollObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && !isLoading) {
        _scrollObserver.disconnect();
        _scrollObserver = null;
        currentSearchPage++;
        doSearch(lastQuery);
      }
    }, { rootMargin: "200px" });
    _scrollObserver.observe(sentinel);
  }
}

/* ──────────────────────────────────────────
   SEARCH — Algolia primary · Firestore backs it up
   Policy (revised): fall through to Firestore whenever Algolia produces no
   hits, not only when it errors.

   The previous policy — "0 hits = empty state, NEVER fall through" — assumes
   the Algolia index is a complete mirror of Firestore. It is not. The secured
   search key comes from getAlgoliaSearchKey at runtime; when that call is
   unavailable the engine silently returns { fallback: true, totalHits: 0 },
   which is indistinguishable from a genuine miss under the old rule. Indexing
   also depends on Cloud Function triggers, so any product created while the
   indexer was down is absent from Algolia while sitting in Firestore. Under
   the old policy both cases rendered "No results" for goods that exist, which
   is the worst answer a marketplace can give a buyer.

   Cost: the extra Firestore pass runs only on zero-hit queries, and its
   collection scans are cached for the session.
────────────────────────────────────────── */
async function doSearch(rawQuery) {
  const q = rawQuery.trim().toLowerCase();
  if (!q) { renderPrompt(); renderTabs(); return; }

  _hideSearchRecs();
  isLoading = true;
  if (currentSearchPage === 0) renderSkeleton();

  /* ── Category prediction: auto-switch tab before first page ── */
  if (currentSearchPage === 0 && activeTab === "all") {
    const predicted = _predictCategory(q);
    if (predicted) activeTab = predicted;
  }

  /* ── Firestore starts NOW, in parallel with Algolia ──
     Measured cold on the live site: results appeared 15.5s after navigation
     because the paths ran in series — engine init (a cold-start Cloud Function
     call for the secured key) → the Algolia attempt → Typesense → only then
     Firestore, the one path that actually answers today. Firestore is ~1.7s
     cold and needs no key, so it runs alongside; Algolia still wins when it has
     hits. On later queries the session breaker skips Algolia entirely, so this
     costs nothing extra — and the reads are the same ones the next query would
     have made anyway, since the scans are session-cached.
     Page 0 only: infinite-scroll pages are an Algolia concern. */
  const fsPromise = (currentSearchPage === 0)
    ? firestoreSearch(db, q, { limit: 120 }).catch(fsErr => {
        console.warn("[SOKONI Search] Firestore search failed:", fsErr && fsErr.message);
        return [];
      })
    : null;

  /* ── Path A: Algolia (primary — falls through to Firestore on 0 hits) ──
     Budgeted. On a first visit the engine has to cold-start a Cloud Function to
     fetch its secured key before it can even attempt a query; measured at
     several seconds, during which the Firestore pass had already finished and
     was sitting on an answer the page refused to render. Past the budget we
     stop waiting and let Firestore answer. The Algolia request is not
     cancelled — if it succeeds it populates the engine's cache for the next
     query — we simply stop making the buyer wait for it. */
  let algoliaFailed = false;
  if (window.sokoniSearch && !_algoliaDown) {
    try {
      const eng       = window.sokoniSearch;
      /* Init on its OWN generous clock, and a slow init no longer ABORTS the
         query. The previous code raced init against the 1.5s query budget with a
         single shared promise, so on a cold page load the key fetch exceeded the
         budget, THREW here, and eng.search() below was never reached — Algolia
         was silently skipped on every fresh load. eng.init() resolves even on a
         handled key-fetch failure, so the only thing caught here is a genuine
         >6s hang; either way the query still runs and decides. */
      try {
        const _initBudget = new Promise((_, rej) =>
          setTimeout(() => rej(Object.assign(new Error("init budget"),
            { _budget: true })), _ALGOLIA_INIT_BUDGET_MS));
        await Promise.race([eng.init(), _initBudget]);
      } catch (_) { /* proceed — a keyless query degrades to the fallback path */ }

      /* Fresh budget scoped to the QUERY, so it runs with its full window instead
         of whatever a slow init left of a shared clock. A warm Algolia query is
         well under this; init (the slow part) is already done above. */
      const _budget   = new Promise((_, rej) =>
        setTimeout(() => rej(Object.assign(new Error("Algolia budget exceeded"),
          { _budget: true })), _ALGOLIA_BUDGET_MS));
      const userToken = eng.getUserToken();

      /* Geo params (present only when browser granted permission) */
      const geoParams = _userGeo ? { aroundLatLng: _userGeo, aroundRadius: 50_000 } : {};

      /* Tab ID → actual hub value stored in Algolia records */
      const _TAB_HUB_ALIAS = {
        products:   "shopping",
        businesses: "sellers",
        properties: "property",
      };
      /* Specialized index per tab */
      const _TAB_INDEX = {
        products:      "sokoni_products",
        businesses:    "sokoni_shops",
        services:      "sokoni_services",
        jobs:          "sokoni_jobs",
        properties:    "sokoni_properties",
        vehicles:      "sokoni_vehicles",
        events:        "sokoni_events",
        professionals: "sokoni_users",
      };

      let algoliaHits = [], nbHits = 0, nbPages = 1, degraded = false;

      if (activeTab === "all") {
        /* ── Single HTTP request to unified index — replaces 9 parallel queries ── */
        const res = await Promise.race([_budget, eng.search(q, {
          indexes:     [UNIFIED_INDEX],
          hitsPerPage: HITS_PER_PAGE,
          page:        currentSearchPage,
          userToken,
          ...geoParams,
          skipFirestoreFallback: true,
        })]);
        const ir   = res.results?.[UNIFIED_INDEX] || {};
        algoliaHits = (ir.hits || []).map(h => ({ ...h, _idx: UNIFIED_INDEX, _queryID: ir.queryID }));
        nbHits      = ir.nbHits  || 0;
        nbPages     = ir.nbPages || 1;
        /* The engine sets fallback:true when it never reached Algolia (no
           secured key, or getAlgoliaSearchKey unavailable). Without this the
           degraded response is indistinguishable from a genuine zero-hit. */
        degraded    = res.fallback === true;
      } else {
        /* ── Single HTTP request to the specialized index for this tab ── */
        const specIndex = _TAB_INDEX[activeTab] || "sokoni_products";
        const specOpts  = {
          indexes:     [specIndex],
          hitsPerPage: HITS_PER_PAGE,
          page:        currentSearchPage,
          userToken,
          ...geoParams,
          skipFirestoreFallback: true,
        };
        if (activeTab !== "professionals") {
          specOpts.filters = { hub: _TAB_HUB_ALIAS[activeTab] || activeTab };
        }
        const res  = await Promise.race([_budget, eng.search(q, specOpts)]);
        const ir   = res.results?.[specIndex] || {};
        algoliaHits = (ir.hits || []).map(h => ({ ...h, _idx: specIndex, _queryID: ir.queryID }));
        nbHits      = ir.nbHits  || 0;
        nbPages     = ir.nbPages || 1;
        degraded    = res.fallback === true;
      }

      /* ── Normalize hits into display objects ── */
      const mapped = algoliaHits.map((h, i) => {
        let tab, link, title, subtitle, location;
        if (h._idx === UNIFIED_INDEX) {
          tab      = _GLOBAL_TYPE_TAB[h.type] || "products";
          link     = h.url || "index.html";
          title    = h.title || "";
          subtitle = h.category || "";
          location = h.city || h.county || "";
        } else {
          tab      = _INDEX_TAB[h._idx] || h.tab || h.type || "products";
          const hi = h._highlightResult;
          title    = (hi?.name?.value || hi?.title?.value || h.name || h.title || "(Untitled)").replace(/<\/?mark>/g, "");
          subtitle = h.category || h.subcategory || "";
          location = h.location?.area || h.location?.city || h.city || "";
          link     = h.link || h.url || "index.html";
        }
        return {
          id:        h.objectID || "",
          tab,
          icon:      _TAB_ICON[tab] || "🔍",
          title,
          subtitle,
          location,
          price:     h.price != null ? "KES " + Number(h.price).toLocaleString() : null,
          link,
          thumbnail: h.thumbnail || h.image || null,
          verified:  Boolean(h.seller?.verified || h.verified),
          rating:    h.rating || null,
          _queryID:  h._queryID,
          _idx:      h._idx,
          _pos:      currentSearchPage * HITS_PER_PAGE + i + 1,
        };
      });

      const isAppend = currentSearchPage > 0;

      /* Zero hits on the first page is not proof the goods do not exist — it is
         equally the signature of a degraded key or an unindexed listing. Hand
         over to Typesense/Firestore rather than render an empty state over
         stock that is live in Firestore. Later pages keep what they have. */
      if (!isAppend && mapped.length === 0) {
        algoliaFailed = true;
        console.info("[SOKONI Search] Algolia returned 0 hits" +
          (degraded ? " (engine degraded — no secured key)" : "") +
          " — falling through to Firestore for \"" + q + "\"");
      } else {
        /* ── Accumulate results for infinite scroll ── */
        if (currentSearchPage === 0) {
          allResults = mapped;
        } else {
          allResults = [...allResults, ...mapped];
        }

        /* Build tab counts from all accumulated results */
        counts = {};
        TABS.slice(1).forEach(t => { counts[t.id] = 0; });
        allResults.forEach(r => { counts[r.tab] = (counts[r.tab] || 0) + 1; });

        totalAlgoliaHits = nbHits;
        hasMoreResults   = currentSearchPage < nbPages - 1;

        isLoading = false;
        if (!isAppend) renderTabs();
        renderResults(isAppend);

        /* Non-blocking analytics (first page only) */
        if (!isAppend && typeof firebase !== "undefined") {
          try { firebase.functions().httpsCallable("recordSearchEvent")({ type: "search", query: q, resultCount: nbHits }).catch(() => {}); } catch (_) {}
        }

        return;
      }

    } catch (e) {
      if (e.name === "AbortError") return; /* superseded by newer request */
      algoliaFailed = true;
      /* A thrown error is an engine fault (credentials, transport), not a miss
         — it will recur identically on every later query, so stop paying for it. */
      _algoliaDown = true;
      /* Only a real engine fault is worth remembering across page loads; a
         timeout may just be a cold start. */
      if (!e._budget) _breakerTrip("algolia", e.message);
      console.warn("[SOKONI Search] Algolia unavailable, skipping it:", e.message);
    }
  }

  /* ── Path C: Firestore — awaited here because it has been running all along.
     It is consulted BEFORE Typesense: it is the system of record, it is already
     in flight, and waiting on a secondary index that then has to be merged
     would only add latency to an answer we already hold. Typesense is tried
     below only if Firestore genuinely found nothing. */
  let fsRows = fsPromise ? await fsPromise : [];
  if (fsRows.length) {
    allResults = fsRows;
    counts = {};
    TABS.slice(1).forEach(t => { counts[t.id] = 0; });
    allResults.forEach(r => { counts[r.tab] = (counts[r.tab] || 0) + 1; });

    /* A wrong prediction (e.g. "kass shop" guessed as Products) would render an
       empty tab while results sit one tab away. Fall back to All in that case. */
    if (activeTab !== "all" && !counts[activeTab]) activeTab = "all";

    totalAlgoliaHits = 0;   /* Firestore returns one complete page */
    hasMoreResults   = false;
    isLoading        = false;
    renderTabs();
    renderResults();
    return;
  }

  /* ── Path B: Typesense (only when neither Algolia nor Firestore answered) ── */
  if (window.sokoniTypesenseSearch && algoliaFailed && !_typesenseDown) {
    try {
      const tsEng = window.sokoniTypesenseSearch;
      await tsEng._ensureReady();
      if (tsEng._ready) {
        const tsFilter = tsEng.buildFilterBy(activeTab !== "all" ? { hub: activeTab, _skipStatusFilter: false } : {});
        /* Budgeted: an unreachable Typesense host took 1.6s per query on the
           live site before failing, delaying the Firestore pass that answers. */
        const tsRes    = await Promise.race([
          tsEng.search(q, {
            collections: Object.values(_INDEX_TAB).filter((v, i, a) => a.indexOf(v) === i).map(
              tab => Object.entries(_INDEX_TAB).find(([, t]) => t === tab)?.[0]
            ).filter(Boolean).slice(0, 12),
            filterBy: tsFilter,
            perPage:  HITS_PER_PAGE,
          }),
          new Promise((_, rej) =>
            setTimeout(() => rej(new Error("Typesense budget exceeded")), _TS_BUDGET_MS)),
        ]);
        const tsHits = Object.entries(tsRes.results || {}).flatMap(([col, r]) =>
          (r.hits || []).map(h => ({ ...h.document, _highlights: h.highlights, _col: col }))
        );
        if (tsHits.length > 0) {
          allResults = tsHits.map(h => {
            const tab    = _INDEX_TAB[h._col] || "products";
            const hlName = h._highlights?.find(hl => hl.field === "name" || hl.field === "title")?.snippet || "";
            const title  = h.name || h.title || "(Untitled)";
            return {
              id: h.id || "", tab, icon: _TAB_ICON[tab] || "🔍",
              title, titleHtml: hlName || title,
              subtitle: h.category || "", location: h.location_area || h.location_city || "",
              price: h.price != null ? "KES " + Number(h.price).toLocaleString() : null,
              link: h.link || "index.html", thumbnail: h.thumbnail || null,
              verified: Boolean(h.sellerVerified || h.verified), _source: "typesense",
            };
          });
          counts = {};
          TABS.slice(1).forEach(t => { counts[t.id] = 0; });
          allResults.forEach(r => { counts[r.tab] = (counts[r.tab] || 0) + 1; });
          hasMoreResults = false;
          isLoading = false;
          renderTabs();
          renderResults();
          tsEng._emitAnalyticsEvent?.("search", { query: q, hitCount: tsHits.length })?.catch?.(() => {});
          return;
        }
      }
    } catch (tsErr) {
      if (tsErr.name !== "AbortError") {
        _typesenseDown = true;
        _breakerTrip("typesense", tsErr.message);
        console.warn("[SOKONI Search] Typesense unavailable, skipping it:", tsErr.message);
      }
    }
  }

  /* ── Nothing anywhere: genuine empty state ── */
  allResults = [];
  counts = {};
  TABS.slice(1).forEach(t => { counts[t.id] = 0; });
  totalAlgoliaHits = 0;
  hasMoreResults   = false;
  isLoading        = false;
  renderTabs();
  renderResults();
}

/* ──────────────────────────────────────────
   INPUT HANDLING (debounced)
────────────────────────────────────────── */
/* The side effects a search needs — URL sync, recent-search persistence,
   analytics, and the search itself. This used to run PER KEYSTROKE inside
   triggerSearch, which is what made typing lag: each character triggered a
   localStorage read+parse+write (_saveRecentSearch), a `new URL()` parse plus
   history.replaceState (updateUrlParam), and an analytics call. Typing "shoes"
   paid all of that five times over. None of it is needed until a search actually
   runs, so it now runs once per committed search (debounced, or on Enter). */
function _commitSearch(q) {
  updateUrlParam(q);
  if (q) {
    _saveRecentSearch(q);
    if (window.SokoniRecs) SokoniRecs.trackSearch(q);
  }
  doSearch(q);
}

function triggerSearch(val) {
  lastQuery = val.trim();
  currentSearchPage = 0;
  hasMoreResults    = false;
  if (_scrollObserver) { _scrollObserver.disconnect(); _scrollObserver = null; }
  updateClearBtn();                 /* cheap: one button visibility toggle */
  clearTimeout(debounceTimer);
  /* Per keystroke this is now just a few assignments + rescheduling the timer,
     so the input field renders characters without jank. */
  debounceTimer = setTimeout(() => _commitSearch(lastQuery), 200); /* search-as-you-type */
}

searchInput.addEventListener("input", () => triggerSearch(searchInput.value));

searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearTimeout(debounceTimer);
    lastQuery = searchInput.value.trim();
    updateClearBtn();
    _commitSearch(lastQuery);       /* Enter also now persists the recent search */
  }
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  lastQuery = "";
  allResults = [];
  counts = {};
  updateClearBtn();
  updateUrlParam("");
  renderTabs();
  renderPrompt();
  searchInput.focus();
});

function updateClearBtn() {
  if (searchInput.value.length > 0) {
    clearBtn.classList.add("visible");
  } else {
    clearBtn.classList.remove("visible");
  }
}

/* ──────────────────────────────────────────
   URL PARAM ?q=
────────────────────────────────────────── */
function updateUrlParam(q) {
  const url = new URL(window.location.href);
  if (q) {
    url.searchParams.set("q", q);
  } else {
    url.searchParams.delete("q");
  }
  history.replaceState(null, "", url.toString());
}

/* ──────────────────────────────────────────
   XSS-safe helper
────────────────────────────────────────── */
function escHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ──────────────────────────────────────────
   VOICE SEARCH
────────────────────────────────────────── */
(function _initVoice() {
  const btn = document.getElementById('voiceBtn');
  if (!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    btn.title = 'Voice search not supported in this browser';
    btn.classList.add('unsupported');
    return;
  }
  const rec = new SR();
  rec.lang = 'en-KE';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  let _live = false;

  btn.addEventListener('click', () => {
    if (_live) { rec.stop(); return; }
    try {
      rec.start();
      _live = true;
      btn.classList.add('listening');
      btn.title = 'Listening… tap to stop';
    } catch (e) { /* permission denied etc */ }
  });
  rec.onresult = e => {
    const q = e.results[0]?.[0]?.transcript?.trim() || '';
    if (q) { searchInput.value = q; triggerSearch(q); }
    _live = false; btn.classList.remove('listening'); btn.title = 'Voice search';
  };
  const _reset = () => { _live = false; btn.classList.remove('listening'); btn.title = 'Voice search'; };
  rec.onend = _reset;
  rec.onerror = _reset;
})();

/* ──────────────────────────────────────────
   IMAGE SEARCH PLACEHOLDER
────────────────────────────────────────── */
(function _initImgSearch() {
  const btn = document.getElementById('imgBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    let toast = document.getElementById('_imgToast');
    if (toast) return;
    toast = document.createElement('div');
    toast.id = '_imgToast';
    toast.setAttribute('role', 'status');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:#1c1c1c;border:1px solid rgba(255,152,0,.35);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200002;max-width:90vw;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s,transform .2s;';
    toast.textContent = '📷 Image search is coming soon — try describing what you see!';
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateX(-50%) translateY(0)'; });
    setTimeout(() => {
      toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(10px)';
      setTimeout(() => toast.remove(), 250);
    }, 3200);
  });
})();

/* ──────────────────────────────────────────
   INIT
────────────────────────────────────────── */
function init() {
  renderTabs();

  const urlQ = new URLSearchParams(window.location.search).get("q") || "";
  if (urlQ) {
    searchInput.value = urlQ;
    lastQuery = urlQ;
    updateClearBtn();

    // sokoni-search-engine.js is deferred and loads after this inline module.
    // Wait briefly for it so a direct ?q= link can still hit Algolia — but only
    // briefly: doSearch now starts its Firestore pass in parallel, so every
    // millisecond spent here is pure dead time before the path that answers.
    // The old 3s ceiling was a third of the measured 9s cold-start latency.
    if (window.sokoniSearch || _algoliaDown) {
      /* Nothing to wait for when the engine is known to be down — go straight
         to the path that will answer. */
      doSearch(urlQ);
    } else {
      let waited = 0;
      const poll = setInterval(function () {
        waited += 50;
        if (window.sokoniSearch || waited >= 800) {
          clearInterval(poll);
          doSearch(urlQ);
        }
      }, 50);
    }
  } else {
    renderPrompt();
  }
}

init();
</script>

  <script>
    /* Unified click tracking — handles both Algolia and Typesense results */
    document.addEventListener("click", function(e) {
      const link = e.target.closest("a[data-objectid], a[data-tsid]");
      if (!link) return;

      const name      = link.querySelector(".result-title")?.textContent || "";
      const thumbnail = link.dataset.thumbnail || null;
      const url       = link.href;

      /* Algolia click tracking */
      if (link.dataset.objectid && window.sokoniSearch) {
        const objectID  = link.dataset.objectid;
        const indexName = link.dataset.index || "sokoni_products";
        const queryID   = link.dataset.queryid || "";
        const pos       = parseInt(link.dataset.position || "1", 10);
        window.sokoniSearch.trackClick({ indexName, objectID, queryID, position: pos, userToken: window.sokoniSearch.getUserToken() });
        window.sokoniSearch.trackView({ id: objectID, name, thumbnail, url });
      }

      /* Typesense click tracking */
      if (window.sokoniTypesenseSearch) {
        const docId     = link.dataset.tsid || link.dataset.objectid || "";
        const col       = link.dataset.tscol || link.dataset.index || "sokoni_products";
        const pos       = parseInt(link.dataset.position || "1", 10);
        const query     = (typeof lastQuery !== "undefined" ? lastQuery : "") || "";
        if (docId) window.sokoniTypesenseSearch.trackClick(docId, col, pos, query);
        window.sokoniTypesenseSearch.trackView({ id: docId, name, thumbnail, url });
      }
    });
  </script>
