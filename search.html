<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="security.js"></script>
<script type="module" src="firebase.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOKONI — Universal Search</title>
  <meta name="description" content="Search products, services, jobs, properties, vehicles, businesses and professionals on SOKONI Kenya marketplace.">
  <meta property="og:title" content="SOKONI — Universal Search">
  <meta property="og:description" content="Find anything on SOKONI — Kenya's premier marketplace.">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/Sokoni%20Logo.png">
  <link rel="icon" type="image/png" href="assets/logosokoni.png">
  <link rel="apple-touch-icon" href="assets/logosokoni.png">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sokoni-desktop.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#71ff00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOKONI">

  <style>
    /* ===== BASE ===== */
    :root {
      --accent: #71ff00;
      --accent-dim: rgba(113,255,0,0.12);
      --accent-border: rgba(113,255,0,0.22);
      --bg: #050505;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.45);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ===== SEARCH HERO ===== */
    .search-hero {
      padding: 28px 20px 20px;
      background: linear-gradient(180deg, rgba(113,255,0,0.04) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    .search-hero-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: .8;
    }

    .search-box-wrap {
      position: relative;
      max-width: 720px;
    }

    .search-box-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
      opacity: .5;
    }

    #searchInput {
      width: 100%;
      padding: 16px 128px 16px 52px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    #searchInput:focus {
      border-color: var(--accent-border);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(113,255,0,0.08), 0 6px 28px rgba(0,0,0,0.4);
    }

    #searchInput::placeholder { color: var(--text-muted); }

    .search-clear-btn,
    .search-voice-btn,
    .search-img-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    .search-clear-btn { right: 14px; display: none; }
    .search-clear-btn.visible { display: flex; }
    .search-voice-btn { right: 52px; }
    .search-img-btn   { right: 90px; }
    .search-clear-btn:hover,
    .search-voice-btn:hover,
    .search-img-btn:hover { background: rgba(255,255,255,0.13); color: var(--text); border-color: rgba(255,255,255,0.18); }
    .search-voice-btn.listening {
      background: rgba(255,50,50,0.12);
      border-color: rgba(255,50,50,0.4);
      color: #ff4d4d;
      animation: voice-pulse 1.2s ease-in-out infinite;
    }
    .search-voice-btn.unsupported { opacity: .35; cursor: not-allowed; }
    @keyframes voice-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,50,50,0.35); }
      50%      { box-shadow: 0 0 0 8px rgba(255,50,50,0); }
    }

    /* ===== TABS ===== */
    .tab-bar-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 14px 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 58px; /* shared header height */
      z-index: 100;
    }
    @media (max-width: 600px) {
      .tab-bar-wrap { top: 112px; } /* two-row header on mobile */
    }
    .tab-bar-wrap::-webkit-scrollbar { display: none; }

    .tab-bar {
      display: flex;
      gap: 4px;
      min-width: max-content;
      padding-bottom: 0;
    }

    .tab-btn {
      padding: 9px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px 10px 0 0;
      white-space: nowrap;
      transition: color .15s, background .15s;
      border-bottom: 2.5px solid transparent;
      position: relative;
      bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); background: var(--surface-hover); }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(113,255,0,0.05);
    }

    .tab-count {
      display: inline-block;
      background: rgba(113,255,0,0.14);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      border-radius: 20px;
      padding: 1px 6px;
      margin-left: 5px;
      min-width: 18px;
      text-align: center;
      transition: opacity .2s;
    }
    .tab-count.hidden { opacity: 0; }

    /* ===== RESULTS AREA ===== */
    .results-area {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .results-meta strong { color: var(--accent); font-weight: 800; }
    .results-meta-count { flex: 1; min-width: 0; }
    .results-sort-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .sort-label { font-size: 11px; color: var(--text-muted); }
    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--accent-border); }

    .price-filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .price-chip {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .price-chip:hover, .price-chip--active {
      border-color: var(--accent-border);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .recent-searches-wrap {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .recent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .recent-clear-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    .recent-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .recent-chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .recent-chip:hover {
      border-color: var(--accent-border);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .vbadge { font-size: 12px; vertical-align: middle; margin-left: 4px; }

    /* ===== SKELETON ===== */
    .skeleton-wrap {
      display: grid;
      gap: 10px;
    }

    .skeleton-card {
      height: 80px;
      border-radius: var(--radius);
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.04) 25%,
        rgba(255,255,255,0.08) 50%,
        rgba(255,255,255,0.04) 75%
      );
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    /* ===== RESULT CARDS ===== */
    .results-grid {
      display: grid;
      gap: 10px;
    }

    .result-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background .15s, border-color .15s, transform .12s;
    }

    .result-card:hover {
      background: var(--surface-hover);
      border-color: rgba(113,255,0,0.18);
      transform: translateY(-1px);
    }

    .result-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .result-thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    mark {
      background: transparent;
      color: var(--accent);
      font-weight: 600;
    }

    .result-body {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .result-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .result-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
    }

    .result-location {
      font-size: 11px;
      color: var(--text-muted);
    }

    .result-price {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin-left: auto;
      flex-shrink: 0;
    }

    .result-view-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
      text-decoration: none;
    }
    .result-view-btn:hover { background: rgba(113,255,0,0.22); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
      opacity: .6;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      font-family: inherit;
    }

    .chip:hover {
      background: var(--accent-dim);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    /* ===== PROMPT STATE (no query yet) ===== */
    .prompt-state {
      text-align: center;
      padding: 50px 20px 40px;
    }
    .prompt-state .big-icon { font-size: 64px; display: block; margin-bottom: 18px; opacity: .35; }
    .prompt-state h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .prompt-state p  { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    .category-quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 28px;
      text-align: left;
    }

    .quick-tile {
      padding: 14px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: background .15s, border-color .15s;
    }
    .quick-tile:hover { background: var(--surface-hover); border-color: var(--accent-border); }
    .quick-tile .tile-icon { font-size: 24px; display: block; margin-bottom: 6px; }
    .quick-tile .tile-label { font-size: 12px; font-weight: 700; color: var(--text); display: block; }
    .quick-tile .tile-sub   { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 500;
      padding: 6px 0 max(6px, env(safe-area-inset-bottom, 6px));
    }
    @media (max-width: 768px) {
      .bottom-nav { display: flex; justify-content: space-around; align-items: center; }
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted); text-decoration: none;
      font-size: 9px; font-weight: 600; gap: 3px; padding: 4px 10px;
      border-radius: 10px; transition: color .15s;
    }
    .bottom-nav a.active, .bottom-nav a:hover { color: var(--accent); }
    .bottom-nav a span:first-child { font-size: 20px; }

    /* ===== TRENDING SECTION ===== */
    .trending-wrap {
      margin-bottom: 24px;
      text-align: left;
    }
    .trending-hd {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 10px;
    }
    .trending-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .trending-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .trending-chip:hover {
      border-color: rgba(255,152,0,0.4);
      background: rgba(255,152,0,0.08);
      color: #ff9800;
    }
    .trending-rank {
      font-size: 9px;
      font-weight: 900;
      color: #ff9800;
      min-width: 14px;
    }

    /* ===== DESKTOP: wider cards ===== */
    @media (min-width: 640px) {
      .results-area { padding: 24px 24px 60px; }
      .result-card { padding: 16px 20px; }
    }
  </style>
</head>
<body>
<script src="splash.js"></script>

<!-- Shared header (auto-injected) -->
<script src="shared-header.js"></script>

<!-- ===== SEARCH HERO ===== -->
<div class="search-hero">
  <div class="search-hero-label">Universal Search</div>
  <div class="search-box-wrap">
    <span class="search-box-icon">🔍</span>
    <input
      id="searchInput"
      type="search"
      placeholder="Search products, services, jobs, properties…"
      autocomplete="off"
      aria-label="Search SOKONI"
      inputmode="search"
    >
    <button class="search-voice-btn" id="voiceBtn" aria-label="Search by voice" title="Voice search">🎤</button>
    <button class="search-img-btn" id="imgBtn" aria-label="Image search" title="Image search">📷</button>
    <button class="search-clear-btn" id="clearBtn" aria-label="Clear search" title="Clear">✕</button>
  </div>
</div>

<!-- ===== TABS ===== -->
<div class="tab-bar-wrap" role="tablist" aria-label="Filter results by type">
  <div class="tab-bar" id="tabBar">
    <!-- rendered by JS -->
  </div>
</div>

<!-- ===== RESULTS ===== -->
<div class="results-area" id="resultsArea">
  <!-- prompt / skeleton / results rendered here -->
</div>

<!-- ===== RECOMMENDATIONS (shown when no query is active) ===== -->
<div id="sk-recs-search" style="max-width:900px;margin:0 auto;"></div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a href="index.html"><span>🏠</span><span>Home</span></a>
  <a href="category.html"><span>🛍️</span><span>Shop</span></a>
  <a href="search.html" class="active"><span>🔍</span><span>Search</span></a>
  <a href="services.html"><span>🛠️</span><span>Services</span></a>
  <a href="profile.html"><span>👤</span><span>Profile</span></a>
</nav>

<!-- ===== RECOMMENDATIONS ENGINE ===== -->
<script src="sokoni-recommendations.js"></script>

<!-- ===== FIREBASE + SEARCH LOGIC ===== -->
<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, limit, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Firebase config ── */
const FB = {
  apiKey:            "AIzaSyDt_FRoTdE5OpfPhLB0DApIm7p-I45hzVE",
  authDomain:        "sokoni-aeb26.firebaseapp.com",
  projectId:         "sokoni-aeb26",
  storageBucket:     "sokoni-aeb26.firebasestorage.app",
  messagingSenderId: "24799054989",
  appId:"1:24799054989:web:e1cf6ca8c281bf1abf26c4",measurementId:"G-QT32H65TJS",
};
const app = initializeApp(FB, "search-page");
const db  = getFirestore(app);

/* ── Tab definitions ── */
const TABS = [
  { id: "all",           label: "All",           icon: "✨" },
  { id: "products",      label: "Products",       icon: "🛍️" },
  { id: "services",      label: "Services",       icon: "🔧" },
  { id: "jobs",          label: "Jobs",           icon: "💼" },
  { id: "properties",    label: "Properties",     icon: "🏠" },
  { id: "vehicles",      label: "Vehicles",       icon: "🚗" },
  { id: "events",        label: "Events",         icon: "🎉" },
  { id: "businesses",    label: "Businesses",     icon: "🏪" },
  { id: "professionals", label: "Professionals",  icon: "👷" },
];

/* ── Per-collection Firestore query modifiers.
   Each returns a Firebase Query — limit(200) on all to prevent unbounded reads. ── */
const _q = (col, ...constraints) => query(col, ...constraints, limit(200));

/* ── Collection specs ── */
const COLLECTIONS = [
  {
    name: "products",
    tab: "products",
    icon: "🛍️",
    buildQuery: col => _q(col),
    getTitle:    d => d.title || d.name || "",
    getSubtitle: d => d.category || d.sellerName || "",
    getLocation: d => d.location || d.city || "",
    getPrice:    d => d.price != null ? "KES " + Number(d.price).toLocaleString() : null,
    getLink:     (d, id) => "product.html?id=" + id,
  },
  {
    name: "services",
    tab: "services",
    icon: "🔧",
    buildQuery: col => _q(col),
    getTitle:    d => d.name || d.title || "",
    getSubtitle: d => d.category || d.providerName || "",
    getLocation: d => d.location || d.city || "",
    getPrice:    d => d.price != null ? "KES " + Number(d.price).toLocaleString() : null,
    getLink:     (d, id) => "services.html?id=" + id,
  },
  {
    name: "digitalJobs",
    tab: "jobs",
    icon: "💼",
    buildQuery: col => _q(col),
    getTitle:    d => d.title || d.name || "",
    getSubtitle: d => d.category || d.posterName || "",

/* ── Recent Searches (localStorage) ── */
const _RS_KEY = "sokoniRecentSearches";
function _saveRecentSearch(q) {
  if (!q || q.length < 2) return;
  let list = _getRecentSearches();
  list = [q, ...list.filter(s => s.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  try { localStorage.setItem(_RS_KEY, JSON.stringify(list)); } catch(e) {}
}
function _getRecentSearches() {
  try { return JSON.parse(localStorage.getItem(_RS_KEY)) || []; } catch(e) { return []; }
}
function _clearRecentSearches() {
  try { localStorage.removeItem(_RS_KEY); } catch(e) {}
  renderPrompt();
}

/* ── Sort helpers ── */
function _sortResults(results) {
  if (activeSort === "price_asc") {
    return [...results].sort((a, b) => _parsePrice(a.price) - _parsePrice(b.price));
  }
  if (activeSort === "price_desc") {
    return [...results].sort((a, b) => _parsePrice(b.price) - _parsePrice(a.price));
  }
  return results; /* relevance = original order */
}
function _parsePrice(str) {
  if (!str) return Infinity;
  return parseFloat(String(str).replace(/[^0-9.]/g, "")) || Infinity;
}
function _applyPriceFilter(results) {
  if (!priceFilter) return results;
  const [mn, mx] = priceFilter;
  return results.filter(r => {
    const p = _parsePrice(r.price);
    return p >= mn && p <= mx;
  });
}

  sokoni_collections:"products",
};
const _TAB_ICON = {
  products: "🛍️", services: "🔧", jobs: "💼",
  properties: "🏠", vehicles: "🚗", events: "🎉",
  businesses: "🏪", professionals: "👷",

/* ──────────────────────────────────────────
   SEARCH — enterprise engine → Firestore fallback
────────────────────────────────────────── */
async function doSearch(rawQuery) {
  const q = rawQuery.trim().toLowerCase();
  if (!q) { renderPrompt(); renderTabs(); return; }

  _hideSearchRecs();
  isLoading = true;
  renderSkeleton();

  /* ── Path A: sokoni-search-engine.js (enterprise Algolia + Firestore fallback) ── */
  if (window.sokoniSearch) {
    try {
      const eng = window.sokoniSearch;
      await eng.init();
      const userToken = eng.getUserToken();
      const activeFilter = activeTab !== "all" ? { hub: activeTab } : {};
      const res = await eng.search(q, {
        hitsPerPage: 60,
        filters:     activeFilter,
        userToken,
      });
      const allHits = Object.entries(res.results || {}).flatMap(([idx, r]) =>
        (r.hits || []).map(h => ({ ...h, _idx: idx, _queryID: r.queryID }))
      );
      if (allHits.length > 0) {
        allResults = allHits.map(h => {
          const tab = _INDEX_TAB[h._idx] || h.tab || h.type || "products";
          const title = h._highlightResult?.name?.value || h._highlightResult?.title?.value || h.name || h.title || "(Untitled)";
          /* Track view for recently-viewed engine */
          return {
            id:       h.objectID || h.id || "",
            tab,
            icon:     _TAB_ICON[tab] || "🔍",
            title:    title.replace(/<\/?mark>/g, ""),      // strip Algolia highlight tags
            titleHtml: title,                               // keep for rendering with highlights
            subtitle: h.category || h.subcategory || "",
            location: h.location?.area || h.location?.city || h.city || "",
            price:    h.price != null ? "KES " + Number(h.price).toLocaleString() : null,
            link:     h.link || h.url || "index.html",
            thumbnail: h.thumbnail || h.image || null,
            verified: Boolean(h.seller?.verified || h.verified),
            _queryID: h._queryID,
            _idx:     h._idx,
          };
        });
        counts = {};
        TABS.slice(1).forEach(t => { counts[t.id] = 0; });
        allResults.forEach(r => { counts[r.tab] = (counts[r.tab] || 0) + 1; });
        isLoading = false;
        renderTabs();
        renderResults();
        /* Analytics: record search event */
        const fn = typeof firebase !== "undefined" && firebase.functions().httpsCallable("recordSearchEvent");
        if (fn) fn({ type: "search", query: q, resultCount: allHits.length }).catch(() => {});
        return;
      }
    } catch (e) {
      if (e.name !== "AbortError") console.warn("[SOKONI Search] Engine error, falling back to Firestore:", e.message);
    }
  }

  /* ── Path B: sokoni-typesense-engine.js (secondary enterprise engine) ── */
  if (window.sokoniTypesenseSearch) {
    try {
      const tsEng   = window.sokoniTypesenseSearch;
      await tsEng._ensureReady();
      if (tsEng._ready) {
        const tsFilter = tsEng.buildFilterBy(activeTab !== "all" ? { hub: activeTab, _skipStatusFilter: false } : {});
        const tsRes   = await tsEng.search(q, {
          collections: Object.values(_INDEX_TAB).filter((v, i, a) => a.indexOf(v) === i).map(
            tab => Object.entries(_INDEX_TAB).find(([, t]) => t === tab)?.[0]
          ).filter(Boolean).slice(0, 12),
          filterBy: tsFilter,
          perPage:  60,
        });
        const tsHits = Object.entries(tsRes.results || {}).flatMap(([col, r]) =>
          (r.hits || []).map(h => ({ ...h.document, _highlights: h.highlights, _col: col }))
        );
        if (tsHits.length > 0) {
          allResults = tsHits.map(h => {
            const tab   = _INDEX_TAB[h._col] || "products";
            const hlName = h._highlights?.find(hl => hl.field === "name" || hl.field === "title")?.snippet || "";
            const title = h.name || h.title || "(Untitled)";
            return {
              id:        h.id || "",
              tab,
              icon:      _TAB_ICON[tab] || "🔍",
              title:     title,
              titleHtml: hlName || title,
              subtitle:  h.category || h.subcategory || "",
              location:  h.location_area || h.location_city || "",
              price:     h.price != null ? "KES " + Number(h.price).toLocaleString() : null,
              link:      h.link || h.url || "index.html",
              thumbnail: h.thumbnail || h.image || null,
              verified:  Boolean(h.sellerVerified || h.verified),
              _col:      h._col,
              _source:   "typesense",
            };
          });
          counts = {};
          TABS.slice(1).forEach(t => { counts[t.id] = 0; });
          allResults.forEach(r => { counts[r.tab] = (counts[r.tab] || 0) + 1; });
          isLoading = false;
          renderTabs();
          renderResults();
          /* Analytics: record Typesense search event */
          tsEng._emitAnalyticsEvent("search", { query: q, hitCount: tsHits.length }).catch?.(() => {});
          return;
        }
      }
    } catch (tsErr) {
      if (tsErr.name !== "AbortError") console.warn("[SOKONI Search] Typesense engine error:", tsErr.message);
    }
  }

  /* ── Path C: Bounded Firestore client-side search (limit 200 per collection) ── */
  const fetches = COLLECTIONS.map(async spec => {
    try {
      const colRef = collection(db, spec.name);
      const fsQuery = spec.buildQuery ? spec.buildQuery(colRef) : query(colRef, limit(200));
      const snap = await getDocs(fsQuery);
      const rows = [];
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const haystack = [
          d.title, d.name, d.category, d.location, d.city,
          d.description, d.type, d.spec, d.sellerName, d.providerName,
          d.posterName, d.make, d.model, d.specialty, d.practice,
          d.venue, d.tags ? d.tags.join(" ") : null,
        ].filter(Boolean).join(" ").toLowerCase();

        if (haystack.includes(q)) {
          rows.push({
            id:       docSnap.id,
            tab:      spec.tab,
            icon:     spec.icon,
            title:    spec.getTitle(d) || "(Untitled)",
            subtitle: spec.getSubtitle(d) || "",
            location: spec.getLocation(d) || "",
            price:    spec.getPrice ? spec.getPrice(d) : null,
            link:     spec.getLink(d, docSnap.id),
          });
        }
      });
      return { tab: spec.tab, rows };
    } catch (err) {
      console.warn("[SOKONI Search] Collection", spec.name, "error:", err.message);
      return { tab: spec.tab, rows: [] };
    }
  });

  const results = await Promise.all(fetches);

  allResults = [];
  counts = {};
  TABS.slice(1).forEach(t => { counts[t.id] = 0; });

  results.forEach(({ tab, rows }) => {
    allResults.push(...rows);
    counts[tab] = (counts[tab] || 0) + rows.length;
  });

  isLoading = false;
  renderTabs();
  renderResults();
}

/* ──────────────────────────────────────────
   INPUT HANDLING (debounced)
────────────────────────────────────────── */
function triggerSearch(val) {
  lastQuery = val.trim();
  updateClearBtn();
  updateUrlParam(lastQuery);
  if (lastQuery) {
    _saveRecentSearch(lastQuery);
    if (window.SokoniRecs) SokoniRecs.trackSearch(lastQuery);
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => doSearch(lastQuery), 350);
}

searchInput.addEventListener("input", () => triggerSearch(searchInput.value));

searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearTimeout(debounceTimer);
    lastQuery = searchInput.value.trim();
    updateClearBtn();
    updateUrlParam(lastQuery);
    doSearch(lastQuery);
  }
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  lastQuery = "";
  allResults = [];
  counts = {};
  updateClearBtn();
  updateUrlParam("");
  renderTabs();
  renderPrompt();
  searchInput.focus();
});

function updateClearBtn() {
  if (searchInput.value.length > 0) {
    clearBtn.classList.add("visible");
  } else {
    clearBtn.classList.remove("visible");
  }
}

/* ──────────────────────────────────────────
   URL PARAM ?q=
────────────────────────────────────────── */
function updateUrlParam(q) {
  const url = new URL(window.location.href);
  if (q) {
    url.searchParams.set("q", q);
  } else {
    url.searchParams.delete("q");
  }
  history.replaceState(null, "", url.toString());
}

/* ──────────────────────────────────────────
   XSS-safe helper
────────────────────────────────────────── */
function escHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ──────────────────────────────────────────
   VOICE SEARCH
────────────────────────────────────────── */
(function _initVoice() {
  const btn = document.getElementById('voiceBtn');
  if (!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    btn.title = 'Voice search not supported in this browser';
    btn.classList.add('unsupported');
    return;
  }
  const rec = new SR();
  rec.lang = 'en-KE';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  let _live = false;

  btn.addEventListener('click', () => {
    if (_live) { rec.stop(); return; }
    try {
      rec.start();
      _live = true;
      btn.classList.add('listening');
      btn.title = 'Listening… tap to stop';
    } catch (e) { /* permission denied etc */ }
  });
  rec.onresult = e => {
    const q = e.results[0]?.[0]?.transcript?.trim() || '';
    if (q) { searchInput.value = q; triggerSearch(q); }
    _live = false; btn.classList.remove('listening'); btn.title = 'Voice search';
  };
  const _reset = () => { _live = false; btn.classList.remove('listening'); btn.title = 'Voice search'; };
  rec.onend = _reset;
  rec.onerror = _reset;
})();

/* ──────────────────────────────────────────
   IMAGE SEARCH PLACEHOLDER
────────────────────────────────────────── */
(function _initImgSearch() {
  const btn = document.getElementById('imgBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    let toast = document.getElementById('_imgToast');
    if (toast) return;
    toast = document.createElement('div');
    toast.id = '_imgToast';
    toast.setAttribute('role', 'status');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:#1c1c1c;border:1px solid rgba(255,152,0,.35);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200002;max-width:90vw;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s,transform .2s;';
    toast.textContent = '📷 Image search is coming soon — try describing what you see!';
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateX(-50%) translateY(0)'; });
    setTimeout(() => {
      toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(10px)';
      setTimeout(() => toast.remove(), 250);
    }, 3200);
  });
})();

/* ──────────────────────────────────────────
   INIT
────────────────────────────────────────── */
function init() {
  renderTabs();

  const urlQ = new URLSearchParams(window.location.search).get("q") || "";
  if (urlQ) {
    searchInput.value = urlQ;
    lastQuery = urlQ;
    updateClearBtn();
    doSearch(urlQ);
  } else {
    renderPrompt();
  }
}

init();

    document.addEventListener("click", function(e) {
      const link = e.target.closest("a[data-objectid], a[data-tsid]");
      if (!link) return;

      const name      = link.querySelector(".result-title")?.textContent || "";
      const thumbnail = link.dataset.thumbnail || null;
      const url       = link.href;

      /* Algolia click tracking */
      if (link.dataset.objectid && window.sokoniSearch) {
        const objectID  = link.dataset.objectid;
        const indexName = link.dataset.index || "sokoni_products";
        const queryID   = link.dataset.queryid || "";
        const pos       = parseInt(link.dataset.position || "1", 10);
        window.sokoniSearch.trackClick({ indexName, objectID, queryID, position: pos, userToken: window.sokoniSearch.getUserToken() });
        window.sokoniSearch.trackView({ id: objectID, name, thumbnail, url });
      }

      /* Typesense click tracking */
      if (window.sokoniTypesenseSearch) {
        const docId     = link.dataset.tsid || link.dataset.objectid || "";
        const col       = link.dataset.tscol || link.dataset.index || "sokoni_products";
        const pos       = parseInt(link.dataset.position || "1", 10);
        const query     = (typeof lastQuery !== "undefined" ? lastQuery : "") || "";
        if (docId) window.sokoniTypesenseSearch.trackClick(docId, col, pos, query);
        window.sokoniTypesenseSearch.trackView({ id: docId, name, thumbnail, url });
      }
    });
  </script>
