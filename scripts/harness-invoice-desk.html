<!doctype html>
<!-- SOKONI — Invoice desk harness. scripts/harness-invoice-desk.html
     AdminOS requires an authenticated admin, and the invoice read is shop-scoped, so the
     module is mounted here against a fixed result set to verify RENDERING only. Never linked.
     Carries the module's own CSS id so injectCss() does not add a page-relative duplicate. -->
<meta charset="utf-8"><title>Invoice desk harness</title>
<link id="sokoni-invoice-desk-css" rel="stylesheet" href="/sokoni-invoice-desk.css">
<style>
 :root{--aos-bg:#060a06;--aos-surface:rgba(255,255,255,0.03);--aos-border:rgba(255,255,255,.08);
 --aos-accent:#71ff00;--aos-warn:#ff9800;--aos-danger:#f44336;--aos-text:rgba(255,255,255,0.9);
 --aos-muted:rgba(255,255,255,0.4)}
 body{background:var(--aos-bg);color:var(--aos-text);font:14px/1.5 system-ui,sans-serif;margin:0;padding:22px}
</style>
<div id="invoicesRich"></div>
<script src="/sokoni-invoice-desk.js"></script>
