<!DOCTYPE html>
<html lang="en" data-splash="1" data-require-auth="true" data-require-role="admin" data-no-header="true">
<head>
  <script src="security.js"></script>
<script src="shared-header.js"></script>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOKONI — Dispatch Command Center</title>
  <script src="sokoni-permissions.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/logosokoni.png">
  <link rel="stylesheet" href="leaflet.min.css">
  <style>
    body { background: #0d0d0d; }
    .dc-layout { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
    @media(max-width:900px){ .dc-layout { grid-template-columns: 1fr; } }

    /* ── Sidebar ── */
    .dc-sidebar { background: #111; border-right: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .dc-sidebar-head { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .dc-sidebar-title { font-size: 17px; font-weight: 900; color: white; }
    .dc-sidebar-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }

    /* ── Stats strip ── */
    .dc-stats { display: grid; grid-template-columns: repeat(4,1fr); padding: 12px 14px; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .dc-stat { text-align: center; }
    .dc-stat-val { font-size: 18px; font-weight: 900; color: #71ff00; }
    .dc-stat-label { font-size: 10px; color: rgba(255,255,255,0.4); }

    /* ── Tabs ── */
    .dc-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .dc-tab { flex: 1; padding: 10px; text-align: center; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.4); cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; background: none; border-top: none; border-left: none; border-right: none; }
    .dc-tab.active { color: #71ff00; border-bottom-color: #71ff00; }

    /* ── List panels ── */
    .dc-list { flex: 1; overflow-y: auto; padding: 10px; }

    /* ── Delivery row in sidebar ── */
    .dc-row { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: .15s; }
    .dc-row:hover, .dc-row.selected { border-color: rgba(113,255,0,0.3); background: rgba(113,255,0,0.05); }
    .dc-row-top { display: flex; justify-content: space-between; align-items: center; }
    .dc-row-id { font-weight: 800; color: white; font-size: 13px; }
    .dc-row-status { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
    .dc-row-detail { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; line-height: 1.5; }

    /* ── Rider row in sidebar ── */
    .dc-rider-row { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.07); margin-bottom: 6px; cursor: default; }
    .dc-rider-row.online { border-color: rgba(113,255,0,0.2); background: rgba(113,255,0,0.03); }
    .dc-rider-row.offline { opacity: .5; }
    .dc-rider-name { font-weight: 700; color: white; font-size: 12px; }
    .dc-rider-info { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .dc-online-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #71ff00; margin-right: 5px; }
    .dc-offline-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25); margin-right: 5px; }

    /* ── Fraud alert row ── */
    .dc-fraud-row { padding: 10px 12px; border-radius: 10px; border-left: 3px solid #ff6b6b; background: rgba(255,61,61,0.06); margin-bottom: 8px; }
    .dc-fraud-type { font-weight: 800; color: #ff6b6b; font-size: 12px; }
    .dc-fraud-detail { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }

    /* ── Map pane ── */
    #dispatchMap { width: 100%; height: 100vh; }
    @media(max-width:900px){ #dispatchMap { height: 50vh; } }

    /* ── Detail panel (right side, overlays map on mobile) ── */
    .dc-detail-panel { position: absolute; top: 20px; right: 20px; width: 320px; background: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 20px; z-index: 1000; display: none; max-height: 80vh; overflow-y: auto; }
    .dc-detail-panel.open { display: block; }
    .dp-title { font-size: 15px; font-weight: 800; color: white; margin-bottom: 12px; }
    .dp-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px; }
    .dp-row:last-child { border-bottom: none; }
    .dp-key { color: rgba(255,255,255,0.45); }
    .dp-val { color: white; font-weight: 700; text-align: right; max-width: 55%; word-break: break-all; }
    .dp-actions { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .dp-btn { padding: 11px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 12px; font-family: inherit; border: none; text-align: center; }
    .dp-btn-primary { background: rgba(113,255,0,0.12); color: #71ff00; border: 1px solid rgba(113,255,0,0.25); }
    .dp-btn-danger  { background: rgba(255,61,61,0.1);  color: #ff6b6b; border: 1px solid rgba(255,61,61,0.2); }
    .dp-btn-orange  { background: rgba(255,140,0,0.1); color: #ff8c00; border: 1px solid rgba(255,140,0,0.2); }
    .dp-close { position: absolute; top: 12px; right: 14px; background: none; border: none; color: rgba(255,255,255,0.4); font-size: 18px; cursor: pointer; }

    /* ── Pulsing online indicator ── */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .dc-live-badge { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #71ff00; animation: pulse 2s infinite; margin-right: 6px; }

    /* ── Status badge colors ── */
    .st-assigned { background: rgba(0,170,255,0.15); color:#00aaff; }
    .st-transit   { background: rgba(255,140,0,0.15);  color:#ff8c00; }
    .st-delivered { background: rgba(113,255,0,0.12); color:#71ff00; }
    .st-failed    { background: rgba(255,61,61,0.12); color:#ff6b6b; }
    .st-pending   { background: rgba(255,255,255,0.08); color:rgba(255,255,255,0.5); }
  </style>
</head>
<body>
<div class="dc-layout">

  <!-- ── Sidebar ── -->
  <aside class="dc-sidebar">
    <div class="dc-sidebar-head">
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="dc-live-badge"></span>
        <span class="dc-sidebar-title">Dispatch Center</span>
      </div>
      <div class="dc-sidebar-sub" id="lastUpdate">Loading...</div>
    </div>

    <div class="dc-stats">
      <div class="dc-stat"><div class="dc-stat-val" id="stActive">—</div><div class="dc-stat-label">Active</div></div>
      <div class="dc-stat"><div class="dc-stat-val" id="stOnline">—</div><div class="dc-stat-label">Online</div></div>
      <div class="dc-stat"><div class="dc-stat-val" id="stPending">—</div><div class="dc-stat-label">Pending</div></div>
      <div class="dc-stat"><div class="dc-stat-val" id="stAlerts">—</div><div class="dc-stat-label">Alerts</div></div>
    </div>

    <div class="dc-tabs">
      <button class="dc-tab active" data-panel="active">Active</button>
      <button class="dc-tab" data-panel="riders">Riders</button>
      <button class="dc-tab" data-panel="fraud">Fraud</button>
      <button class="dc-tab" data-panel="queue">Queue</button>
      <button class="dc-tab" data-panel="analytics" onclick="_loadAnalyticsPanel()">Analytics</button>
    </div>

    <div class="dc-list" id="sidebarList"></div>
  </aside>

  <!-- ── Map pane ── -->
  <div style="position:relative;">
    <div id="dispatchMap"></div>

    <!-- Map layer controls -->
    <div style="position:absolute;top:14px;right:14px;z-index:1000;display:flex;flex-direction:column;gap:6px;">
      <button onclick="_toggleLayer('deliveries')" id="btnLayerDel" style="padding:7px 11px;background:rgba(20,20,20,0.92);border:1px solid rgba(113,255,0,0.35);color:#71ff00;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;">Deliveries ON</button>
      <button onclick="_toggleLayer('riders')"    id="btnLayerRid" style="padding:7px 11px;background:rgba(20,20,20,0.92);border:1px solid rgba(0,170,255,0.35);color:#00aaff;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;">Riders ON</button>
      <button onclick="_toggleHeatMap()"          id="btnHeat"     style="padding:7px 11px;background:rgba(20,20,20,0.92);border:1px solid rgba(255,140,0,0.35);color:#ff8c00;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;">Heat Map OFF</button>
    </div>

    <!-- Analytics panel overlay (hidden by default) -->
    <div id="analyticsPanel" style="display:none;position:absolute;inset:0;background:rgba(13,13,13,0.97);z-index:900;overflow-y:auto;padding:24px 20px;">
      <button onclick="document.getElementById('analyticsPanel').style.display='none'" style="position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;">&#x2715;</button>
      <div style="font-size:17px;font-weight:900;color:white;margin-bottom:18px;">Delivery Analytics</div>
      <div id="analyticsContent"><div style="color:rgba(255,255,255,0.4);font-size:13px;">Loading...</div></div>
    </div>

    <!-- Detail overlay -->
    <div class="dc-detail-panel" id="detailPanel">
      <button class="dp-close" onclick="document.getElementById('detailPanel').classList.remove('open')">&#x2715;</button>
      <div class="dp-title" id="dpTitle">Delivery Detail</div>
      <div id="dpBody"></div>
      <div class="dp-actions" id="dpActions"></div>
    </div>
  </div>
</div>

<script type="module" src="firebase.js"></script>
<script src="sokoni-dispatch.js"></script>
<script src="sokoni-logistics.js"></script>
<script src="leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
(function () {
  'use strict';

  var _map, _riderMarkers = {}, _deliveryMarkers = {};
  var _currentPanel = 'active';
  var _unsubDeliveries = null, _unsubRiders = null, _unsubFraud = null, _unsubQueue = null;
  var _deliveries = [], _riders = [], _fraudAlerts = [], _queueItems = [];
  var _selectedId = null;

  /* ── Init ── */
  firebase.auth().onAuthStateChanged(function (user) {
    if (!user) return;
    _initMap();
    _initTabs();
    _subscribeAll();
  });

  function _initMap() {
    var _el = document.getElementById('dispatchMap');
    if (typeof L === 'undefined') {
      if (_el) _el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:10px;color:rgba(255,255,255,0.45);font-size:13px;text-align:center;padding:20px;background:rgba(8,8,8,0.7)"><span style="font-size:32px">🗺️</span><div>Map could not load.<br><small style="color:rgba(255,255,255,0.25)">Check your connection and retry.</small></div><button onclick="location.reload()" style="margin-top:6px;padding:9px 22px;background:rgba(113,255,0,0.12);border:1px solid rgba(113,255,0,0.3);border-radius:10px;color:#71ff00;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit">Retry</button></div>';
      return;
    }
    _map = L.map('dispatchMap').setView([-1.286389, 36.817223], 12); /* Nairobi */
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(_map);
  }

  function _initTabs() {
    document.querySelectorAll('.dc-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.dc-tab').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        _currentPanel = btn.dataset.panel;
        _renderSidebar();
      });
    });
  }

  /* ── Real-time subscriptions ── */
  function _subscribeAll() {
    var fs = firebase.firestore();

    /* Active deliveries */
    _unsubDeliveries = fs.collection('packageRequests')
      .where('status', 'in', ['driver_assigned','driver_accepted','driver_at_seller','in_transit','arriving','order_placed','ready_for_pickup'])
      .limit(100)
      .onSnapshot(function (snap) {
        _deliveries = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        _renderSidebar();
        _updateStats();
        document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString('en-KE');
      });

    /* Online riders */
    _unsubRiders = fs.collection('rideDrivers')
      .where('isOnline', '==', true)
      .onSnapshot(function (snap) {
        _riders = snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); });
        _updateRiderMarkers();
        _renderSidebar();
        _updateStats();
      });

    /* Fraud alerts (open) */
    _unsubFraud = fs.collection('fraudAlerts')
      .where('status', '==', 'open')
      .limit(50)
      .onSnapshot(function (snap) {
        _fraudAlerts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        _renderSidebar();
        _updateStats();
      });

    /* Dispatch queue — exhausted or pending */
    _unsubQueue = fs.collection('dispatchQueue')
      .where('status', 'in', ['exhausted','pending'])
      .limit(30)
      .onSnapshot(function (snap) {
        _queueItems = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        _renderSidebar();
      });
  }

  /* ── Map markers ── */
  function _updateRiderMarkers() {
    var seen = {};
    _riders.forEach(function (r) {
      if (!r.lat || !r.lng) return;
      seen[r.uid] = true;
      var icon = L.divIcon({ html:'<div style="font-size:18px;line-height:1">🏍️</div>', iconSize:[24,24], iconAnchor:[12,12], className:'' });
      if (_riderMarkers[r.uid]) {
        _riderMarkers[r.uid].setLatLng([r.lat, r.lng]);
        _riderMarkers[r.uid].setTooltipContent((r.name||'Rider') + ' (' + (r.activeDeliveries||0) + ' active)');
      } else {
        _riderMarkers[r.uid] = L.marker([r.lat, r.lng], { icon })
          .bindTooltip((r.name||'Rider') + ' (' + (r.activeDeliveries||0) + ' active)')
          .addTo(_map);
      }
    });
    /* Remove offline riders from map */
    Object.keys(_riderMarkers).forEach(function (uid) {
      if (!seen[uid]) { _map.removeLayer(_riderMarkers[uid]); delete _riderMarkers[uid]; }
    });
  }

  /* ── Stats ── */
  function _updateStats() {
    var activeStatuses = ['driver_assigned','driver_accepted','driver_at_seller','in_transit','arriving'];
    var active = _deliveries.filter(function (d) { return activeStatuses.includes(d.status); }).length;
    var pending = _deliveries.filter(function (d) { return ['order_placed','ready_for_pickup'].includes(d.status); }).length;
    document.getElementById('stActive').textContent  = active;
    document.getElementById('stOnline').textContent  = _riders.length;
    document.getElementById('stPending').textContent = pending;
    document.getElementById('stAlerts').textContent  = _fraudAlerts.length;
  }

  /* ── Sidebar rendering ── */
  function _renderSidebar() {
    var el = document.getElementById('sidebarList');
    if (_currentPanel === 'active') {
      var activeStatuses = ['driver_assigned','driver_accepted','driver_at_seller','in_transit','arriving','order_placed','ready_for_pickup'];
      var items = _deliveries.filter(function (d) { return activeStatuses.includes(d.status); });
      el.innerHTML = items.length ? items.map(_deliveryRow).join('') : _empty('No active deliveries');
    } else if (_currentPanel === 'riders') {
      el.innerHTML = _riders.length ? _riders.map(_riderRow).join('') : _empty('No online riders');
    } else if (_currentPanel === 'fraud') {
      el.innerHTML = _fraudAlerts.length ? _fraudAlerts.map(_fraudRow).join('') : _empty('No open fraud alerts');
    } else if (_currentPanel === 'queue') {
      el.innerHTML = _queueItems.length ? _queueItems.map(_queueRow).join('') : _empty('No dispatch queue issues');
    }
    /* Re-attach click handlers */
    document.querySelectorAll('[data-delivery-id]').forEach(function (el) {
      el.addEventListener('click', function () { _selectDelivery(el.dataset.deliveryId); });
    });
    document.querySelectorAll('[data-fraud-id]').forEach(function (el) {
      el.addEventListener('click', function () { _selectFraudAlert(el.dataset.fraudId); });
    });
  }

  function _deliveryRow(d) {
    var statusMap = { order_placed:'Pending', ready_for_pickup:'Ready', driver_assigned:'Assigned', driver_accepted:'Accepted', driver_at_seller:'Collected', in_transit:'In Transit', arriving:'Arriving', delivered:'Delivered', failed:'Failed' };
    var stClass = { order_placed:'st-pending', ready_for_pickup:'st-pending', driver_assigned:'st-assigned', driver_accepted:'st-assigned', driver_at_seller:'st-transit', in_transit:'st-transit', arriving:'st-delivered', delivered:'st-delivered', failed:'st-failed' }[d.status] || 'st-pending';
    var sel = _selectedId === d.id ? 'selected' : '';
    return `<div class="dc-row ${sel}" data-delivery-id="${_esc(d.id)}">
      <div class="dc-row-top">
        <span class="dc-row-id">#${_esc(d.id.slice(-8).toUpperCase())}</span>
        <span class="dc-row-status ${stClass}">${statusMap[d.status]||d.status}</span>
      </div>
      <div class="dc-row-detail">
        ${_esc(d.deliveryAddress||d.dropoffAddress||'—')} · KES ${(d.deliveryFee||0).toLocaleString()}
        ${d.dispatchEtaMin ? ' · ETA '+d.dispatchEtaMin+'m' : ''}
      </div>
    </div>`;
  }

  function _riderRow(r) {
    return `<div class="dc-rider-row online">
      <div class="dc-rider-name"><span class="dc-online-dot"></span>${_esc(r.name||'Rider')}</div>
      <div class="dc-rider-info">${_esc(r.vehicleType||'moto')} · ${r.activeDeliveries||0} active · Rating ${r.rating||'—'} · Acc ${r.acceptanceRate!=null?Math.round(r.acceptanceRate*100)+'%':'—'}</div>
    </div>`;
  }

  function _fraudRow(f) {
    var ts = f.createdAt ? new Date(f.createdAt.seconds?f.createdAt.seconds*1000:f.createdAt).toLocaleTimeString('en-KE') : '—';
    return `<div class="dc-fraud-row" data-fraud-id="${_esc(f.id)}">
      <div class="dc-fraud-type">${_esc(f.type.replace(/_/g,' ').toUpperCase())} — ${f.severity||'high'}</div>
      <div class="dc-fraud-detail">Rider: ${_esc(f.riderId||'—')} · ${_esc(f.reason||'—')} · ${ts}</div>
    </div>`;
  }

  function _queueRow(q) {
    return `<div class="dc-row" data-delivery-id="${_esc(q.deliveryRef||q.id)}">
      <div class="dc-row-top">
        <span class="dc-row-id">#${_esc((q.deliveryRef||q.id).slice(-8).toUpperCase())}</span>
        <span class="dc-row-status st-failed">${q.status}</span>
      </div>
      <div class="dc-row-detail">Attempts: ${q.attempts?q.attempts.length:0} · Riders ranked: ${q.rankedRiders?q.rankedRiders.length:0}</div>
    </div>`;
  }

  function _empty(msg) {
    return '<div style="text-align:center;padding:40px 16px;color:rgba(255,255,255,0.25);font-size:12px;">'+_esc(msg)+'</div>';
  }

  /* ── Detail panel ── */
  function _selectDelivery(id) {
    _selectedId = id;
    _renderSidebar();
    var d = _deliveries.find(function (x) { return x.id === id; });
    if (!d) return;
    var panel = document.getElementById('detailPanel');
    document.getElementById('dpTitle').textContent = 'Order #' + d.id.slice(-8).toUpperCase();
    document.getElementById('dpBody').innerHTML = [
      _dpRow('Status', d.status),
      _dpRow('Buyer', d.buyerName||'—'),
      _dpRow('Buyer Phone', d.buyerPhone||'—'),
      _dpRow('Delivery To', d.deliveryAddress||d.dropoffAddress||'—'),
      _dpRow('Rider', d.assignedRiderName||d.riderName||'Unassigned'),
      _dpRow('Rider Phone', d.assignedRiderPhone||d.riderPhone||'—'),
      _dpRow('ETA', d.dispatchEtaMin ? d.dispatchEtaMin+' min' : '—'),
      _dpRow('Dist to Pickup', d.dispatchDistKm ? d.dispatchDistKm+' km' : '—'),
      _dpRow('Dispatch Score', d.dispatchScore ? (d.dispatchScore*100).toFixed(0)+'%' : '—'),
      _dpRow('Fee', 'KES '+(d.deliveryFee||0).toLocaleString()),
      _dpRow('Vehicle', d.vehicleType||'—'),
    ].join('');
    document.getElementById('dpActions').innerHTML = `
      <a class="dp-btn dp-btn-primary" href="delivery-tracking.html?ref=${_esc(id)}" target="_blank">Track Live</a>
      <button class="dp-btn dp-btn-orange" onclick="_manualRedispatch('${_esc(id)}')">Re-Dispatch</button>
      <button class="dp-btn dp-btn-danger" onclick="_cancelDelivery('${_esc(id)}')">Cancel</button>
    `;
    panel.classList.add('open');
  }

  function _selectFraudAlert(alertId) {
    var a = _fraudAlerts.find(function (x) { return x.id === alertId; });
    if (!a) return;
    var panel = document.getElementById('detailPanel');
    document.getElementById('dpTitle').textContent = 'Fraud Alert';
    document.getElementById('dpBody').innerHTML = [
      _dpRow('Type', a.type),
      _dpRow('Severity', a.severity||'high'),
      _dpRow('Rider', a.riderId||'—'),
      _dpRow('Reason', a.reason||'—'),
      _dpRow('Speed', a.speedKmH ? a.speedKmH+' km/h' : '—'),
    ].join('');
    document.getElementById('dpActions').innerHTML = `
      <button class="dp-btn dp-btn-danger" onclick="_suspendRider('${_esc(a.riderId)}','${_esc(alertId)}')">Suspend Rider</button>
      <button class="dp-btn dp-btn-orange" onclick="_dismissAlert('${_esc(alertId)}')">Dismiss Alert</button>
    `;
    panel.classList.add('open');
  }

  function _dpRow(k, v) {
    return `<div class="dp-row"><span class="dp-key">${_esc(k)}</span><span class="dp-val">${_esc(String(v))}</span></div>`;
  }

  /* ── Admin actions ── */
  window._manualRedispatch = function (deliveryRef) {
    if (!confirm('Re-dispatch this delivery to a new rider?')) return;
    firebase.functions().httpsCallable('dispatchDelivery')({ deliveryRef })
      .then(function (r) { alert('Re-dispatched. Status: ' + r.data.status); })
      .catch(function (e) { alert('Error: ' + e.message); });
  };

  window._cancelDelivery = function (deliveryRef) {
    if (!confirm('Cancel this delivery? This cannot be undone.')) return;
    firebase.firestore().collection('packageRequests').doc(deliveryRef).update({
      status: 'cancelled',
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      cancelledBy: 'admin',
    }).then(function () {
      document.getElementById('detailPanel').classList.remove('open');
    }).catch(function (e) { alert('Error: ' + e.message); });
  };

  window._suspendRider = function (riderId, alertId) {
    if (!riderId || !confirm('Suspend rider ' + riderId + '?')) return;
    var batch = firebase.firestore().batch();
    batch.update(firebase.firestore().collection('rideDrivers').doc(riderId), {
      isOnline: false, suspended: true, suspendedAt: firebase.firestore.FieldValue.serverTimestamp(), suspendReason: 'GPS fraud',
    });
    batch.update(firebase.firestore().collection('fraudAlerts').doc(alertId), {
      status: 'resolved', resolvedAt: firebase.firestore.FieldValue.serverTimestamp(), resolution: 'rider_suspended',
    });
    batch.commit().then(function () { alert('Rider suspended.'); document.getElementById('detailPanel').classList.remove('open'); })
      .catch(function (e) { alert('Error: ' + e.message); });
  };

  window._dismissAlert = function (alertId) {
    firebase.firestore().collection('fraudAlerts').doc(alertId).update({
      status: 'dismissed', resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(function () { document.getElementById('detailPanel').classList.remove('open'); })
      .catch(function (e) { alert('Error: ' + e.message); });
  };

  /* ── XSS escape ── */
  function _esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  }

  /* ── Map layer toggles ── */
  var _layerDeliveries = true, _layerRiders = true, _heatLayer = null, _heatVisible = false;

  window._toggleLayer = function(type) {
    if (type === 'deliveries') {
      _layerDeliveries = !_layerDeliveries;
      const btn = document.getElementById('btnLayerDel');
      Object.values(_deliveryMarkers).forEach(function(m) { _layerDeliveries ? m.addTo(_map) : m.remove(); });
      if (btn) btn.textContent = 'Deliveries ' + (_layerDeliveries ? 'ON' : 'OFF');
    } else {
      _layerRiders = !_layerRiders;
      const btn = document.getElementById('btnLayerRid');
      Object.values(_riderMarkers).forEach(function(m) { _layerRiders ? m.addTo(_map) : m.remove(); });
      if (btn) btn.textContent = 'Riders ' + (_layerRiders ? 'ON' : 'OFF');
    }
  };

  window._toggleHeatMap = function() {
    if (!window.L || !L.heatLayer) return;
    const btn = document.getElementById('btnHeat');
    if (_heatVisible && _heatLayer) {
      _map.removeLayer(_heatLayer);
      _heatVisible = false;
      if (btn) btn.textContent = 'Heat Map OFF';
      return;
    }
    /* Build heat points from delivery drop-off coords */
    var points = _deliveries
      .filter(function(d) { return d.dropoffLat && d.dropoffLng; })
      .map(function(d) { return [d.dropoffLat, d.dropoffLng, 0.5]; });
    /* Add rider positions with higher weight */
    _riders.forEach(function(r) {
      if (r.lat && r.lng) points.push([r.lat, r.lng, 1.0]);
    });
    if (!points.length) { alert('No location data for heat map.'); return; }
    if (_heatLayer) _map.removeLayer(_heatLayer);
    _heatLayer = L.heatLayer(points, { radius: 28, blur: 18, maxZoom: 17,
      gradient: { 0.2: '#00aaff', 0.5: '#ff8c00', 0.8: '#ff0000' } }).addTo(_map);
    _heatVisible = true;
    if (btn) btn.textContent = 'Heat Map ON';
  };

  /* ── Analytics panel ── */
  window._loadAnalyticsPanel = function() {
    const panel   = document.getElementById('analyticsPanel');
    const content = document.getElementById('analyticsContent');
    if (!panel) return;
    panel.style.display = 'block';
    if (!content) return;
    /* Load last 7 days of daily rollups */
    var rollups = [];
    var fetches = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = 'delivery_' + d.toISOString().slice(0,10).replace(/-/g,'');
      fetches.push(firebase.firestore().collection('analyticsRollup').doc(key).get().then(function(snap) {
        if (snap.exists) rollups.push(snap.data());
      }).catch(function(){}));
    }
    Promise.all(fetches).then(function() {
      rollups.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      if (!rollups.length) { content.innerHTML = '<p style="color:rgba(255,255,255,0.4);font-size:13px;">No analytics data yet. Rollups are generated daily at 01:00 EAT.</p>'; return; }
      var totalDeliveries = rollups.reduce(function(s,r){ return s + (r.total||0); }, 0);
      var totalRevenue    = rollups.reduce(function(s,r){ return s + (r.revenue||0); }, 0);
      var totalRiderPay   = rollups.reduce(function(s,r){ return s + (r.riderPay||0); }, 0);
      var avgSuccess      = rollups.length ? Math.round(rollups.reduce(function(s,r){ return s+(r.successRate||0); },0) / rollups.length) : 0;
      var avgTime         = rollups.length ? Math.round(rollups.reduce(function(s,r){ return s+(r.avgTimeMin||0); },0) / rollups.length) : 0;

      var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px;">' +
        _aCard('📦', totalDeliveries, '7-Day Deliveries') +
        _aCard('💰', 'KES '+totalRevenue.toLocaleString(), '7-Day Revenue') +
        _aCard('🏍️', 'KES '+totalRiderPay.toLocaleString(), '7-Day Rider Pay') +
        _aCard('✅', avgSuccess+'%', 'Avg Success Rate') +
        _aCard('⏱️', avgTime+' min', 'Avg Delivery Time') +
        _aCard('💹', 'KES '+(totalRevenue - totalRiderPay).toLocaleString(), 'Platform Cut') +
      '</div>';

      /* Daily trend table */
      html += '<div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:8px;">DAILY BREAKDOWN</div>';
      html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">' +
        '<tr style="color:rgba(255,255,255,0.4);"><th style="text-align:left;padding:6px 8px;">Date</th><th>Total</th><th>Done</th><th>Rate</th><th>Revenue</th><th>Avg Min</th></tr>';
      rollups.forEach(function(r) {
        var dateStr = r.date ? r.date.slice(0,4)+'-'+r.date.slice(4,6)+'-'+r.date.slice(6,8) : '—';
        html += '<tr style="border-top:1px solid rgba(255,255,255,0.05);">' +
          '<td style="padding:7px 8px;color:rgba(255,255,255,0.7);">'+_esc(dateStr)+'</td>' +
          '<td style="text-align:center;color:white;font-weight:700;">'+((r.total)||0)+'</td>' +
          '<td style="text-align:center;color:#71ff00;">'+((r.completed)||0)+'</td>' +
          '<td style="text-align:center;color:'+(r.successRate>=90?'#71ff00':r.successRate>=70?'#ff8c00':'#ff6b6b')+';">'+(r.successRate||0)+'%</td>' +
          '<td style="text-align:center;color:rgba(255,255,255,0.7);">KES '+((r.revenue||0).toLocaleString())+'</td>' +
          '<td style="text-align:center;color:rgba(255,255,255,0.5);">'+((r.avgTimeMin)||'—')+'</td></tr>';
      });
      html += '</table></div>';
      content.innerHTML = html;
    });
  };

  function _aCard(icon, val, label) {
    return '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;text-align:center;">' +
      '<div style="font-size:20px;margin-bottom:6px;">'+icon+'</div>' +
      '<div style="font-size:15px;font-weight:900;color:white;">'+_esc(String(val))+'</div>' +
      '<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;">'+_esc(label)+'</div></div>';
  }
})();
</script>
</body>
</html>
