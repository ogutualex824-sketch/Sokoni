<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Advocate profile · SOKONI Legal Hub</title>
  <meta name="description" content="A verified advocate or law firm on SOKONI Legal Hub: practice areas, consultation rates, availability, reviews and booking.">
  <meta property="og:title" content="SOKONI Legal Hub — advocate profile">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/logosokoni.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b10">
  <script src="security.js"></script>
  <style>
    /* Legal Hub storefront (L6). Premium dark / gold; every figure comes from the server. */
    :root { --bg:#0b0b10; --card:#13131b; --line:rgba(255,255,255,.08); --text:#f3f1ea; --muted:rgba(243,241,234,.62);
            --gold:#d4af37; --gold2:#f1d27a; --ok:#7ee787; --warn:#f0b429; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5; }
    a { color:var(--gold2); }
    .wrap { max-width:1040px; margin:0 auto; padding:16px 16px 96px; }
    .back { display:inline-flex; gap:6px; align-items:center; color:var(--muted); text-decoration:none; font-size:13px; margin:8px 0 14px; }
    .hero { position:relative; border:1px solid var(--line); border-radius:22px; overflow:hidden;
            background:radial-gradient(1200px 300px at 10% -10%, rgba(212,175,55,.18), transparent 60%), linear-gradient(160deg,#16141f,#0e0e14); padding:22px; }
    .hero-row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    .avatar { width:84px; height:84px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900;
              background:linear-gradient(135deg,var(--gold),#8a6d16); color:#14110a; flex-shrink:0; }
    .name { font-size:clamp(22px,4vw,30px); font-weight:900; letter-spacing:-.01em; margin:0; }
    .sub { color:var(--muted); font-size:14px; margin-top:2px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .chip { font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); }
    .chip.ok { border-color:rgba(126,231,135,.35); color:var(--ok); background:rgba(126,231,135,.08); }
    .chip.gold { border-color:rgba(212,175,55,.4); color:var(--gold2); background:rgba(212,175,55,.08); }
    .grid { display:grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap:16px; margin-top:16px; }
    @media (max-width:820px) { .grid { grid-template-columns: 1fr; } }
    .card { border:1px solid var(--line); background:var(--card); border-radius:18px; padding:18px; }
    .card h2 { font-size:15px; margin:0 0 12px; letter-spacing:.02em; text-transform:uppercase; color:var(--gold2); }
    .areas { display:grid; gap:12px; }
    .area-g { font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .svc { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
    .svc:first-child { border-top:0; }
    .svc-name { font-weight:800; }
    .svc-meta { color:var(--muted); font-size:12px; }
    .price { font-weight:900; color:var(--gold2); white-space:nowrap; }
    .btn { appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; border-radius:12px; padding:12px 16px; font-size:14px; }
    .btn-gold { background:linear-gradient(135deg,var(--gold),#b8901f); color:#14110a; }
    .btn-ghost { background:rgba(255,255,255,.05); color:var(--text); border:1px solid var(--line); }
    .btn:focus-visible, .back:focus-visible { outline:2px solid var(--gold2); outline-offset:2px; }
    .actions { display:grid; gap:10px; }
    .muted { color:var(--muted); font-size:13px; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
    .kv dt { color:var(--muted); }
    .kv dd { margin:0; }
    .state { text-align:center; padding:60px 16px; color:var(--muted); }
    .sticky-book { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(11,11,16,.94);
                   border-top:1px solid var(--line); display:none; }
    @media (max-width:820px) { .sticky-book.on { display:block; } }
    .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#1d1b26; border:1px solid var(--line); padding:10px 14px; border-radius:12px; font-size:13px; display:none; }
  </style>
</head>
<body>
<main class="wrap" id="main">
  <a class="back" href="legal-hub.html#lawyers">← Legal Hub</a>
  <div id="root" aria-live="polite"><div class="state">Loading profile…</div></div>
</main>
<div class="sticky-book" id="stickyBook"><button type="button" class="btn btn-gold" style="width:100%" id="stickyBookBtn">Book a consultation</button></div>
<div class="toast" id="toast" role="status"></div>

<script src="firebase.js" type="module"></script>
<script src="sokoni-legal-taxonomy.js"></script>
<script src="sokoni-intasend.js" defer></script>
<script src="sokoni-pay.js" defer></script>
<script src="sokoni-book-service.js" defer></script>
<script src="sokoni-inbox.js" defer></script>
<script src="sokoni-leads.js" defer></script>
<script src="sw-register.js" defer></script>
<script>
(function () {
  'use strict';
  /* Legal Hub L6 storefront. Data: getLegalProvider (the server lists ONLY eligible advocates — admin approval + current
     LSK — and never sends licence numbers or phones) + the advocate's ACTIVE providerServices rate cards. Booking is the
     canonical SokoniBookService (availability → bookingCreateService → IntaSend → held → PIN). Nothing here invents a
     rating, a fee, availability or a verification claim: unknown renders "—" or an honest sentence. */
  var T = window.SokoniLegalTaxonomy;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var kes = function (cents) { return 'KES ' + (Math.round(Number(cents) || 0) / 100).toLocaleString(); };
  var root = document.getElementById('root');
  var id = new URLSearchParams(location.search).get('id') || '';
  var P = null, SERVICES = [];

  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(function () { t.style.display = 'none'; }, 2600); }
  async function callable(name, data) {
    for (var i = 0; i < 80 && typeof window.sokoniCallable !== 'function'; i++) await new Promise(function (r) { setTimeout(r, 100); });
    if (window.__sokoniAppCheckReady) { try { await window.__sokoniAppCheckReady; } catch (_) {} }
    if (typeof window.sokoniCallable !== 'function') throw new Error('unavailable');
    return (await window.sokoniCallable(name)(data)).data;
  }
  async function loadServices() {
    for (var i = 0; i < 80 && !(window.firebase && window.firebase.firestore); i++) await new Promise(function (r) { setTimeout(r, 100); });
    if (!(window.firebase && window.firebase.firestore)) return null;
    try {
      var snap = await firebase.firestore().collection('providerServices').where('providerId', '==', id).limit(50).get();
      return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (s) { return s.active === true && Number(s.price) > 0; });
    } catch (_) { return null; }
  }
  function initials(n) { return String(n || '').replace(/^Advocate\s+/i, '').split(' ').filter(Boolean).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() || '⚖'; }

  function areasHtml(p) {
    var areas = (p.practiceAreas || []);
    if (!areas.length || !T) return '<p class="muted">Practice areas are not listed yet.</p>';
    var byG = {};
    areas.forEach(function (a) { var g = T.groupOf(a); if (!g) return; (byG[g] = byG[g] || []).push(a); });
    return '<div class="areas">' + T.GROUPS.filter(function (g) { return byG[g.id]; }).map(function (g) {
      return '<div><div class="area-g">' + esc(g.icon + ' ' + g.label) + '</div><div class="chips" style="margin-top:0">' +
        byG[g.id].map(function (a) { return '<span class="chip">' + esc(T.label(a)) + '</span>'; }).join('') + '</div></div>';
    }).join('') + '</div>';
  }

  function servicesHtml(list) {
    if (list === null) return '<p class="muted">Rates could not be loaded just now — this is not an empty list. Please refresh.</p>';
    if (!list.length) return '<p class="muted">No bookable services are published yet.</p>';
    return list.map(function (s) {
      return '<div class="svc"><div><div class="svc-name">' + esc(s.name || 'Legal service') + '</div><div class="svc-meta">' +
        esc((s.legalArea && T ? T.label(s.legalArea) + ' · ' : '') + (s.durationMins ? s.durationMins + ' min' : '')) + '</div></div>' +
        '<div style="display:flex;gap:10px;align-items:center"><span class="price">' + esc(kes(s.price)) + '</span>' +
        '<button type="button" class="btn btn-gold" data-book="' + esc(s.id) + '">Book</button></div></div>';
    }).join('');
  }

  function render() {
    var p = P, firm = p.entityType === 'firm';
    var title = firm ? (p.firmName || p.name) : p.name;
    document.title = title + ' · SOKONI Legal Hub';
    var verified = [];
    if (p.sokoniVerified) verified.push('<span class="chip ok">✓ SOKONI verified</span>');
    if (p.lskVerified) verified.push('<span class="chip gold">⚖ LSK practising' + (p.lskPractisingYear ? ' ' + esc(p.lskPractisingYear) : '') + '</span>');
    var rating = Number(p.ratingCount) > 0 && p.rating != null
      ? '<span class="chip">★ ' + esc(Number(p.rating).toFixed(1)) + ' · ' + esc(p.ratingCount) + ' review' + (p.ratingCount === 1 ? '' : 's') + '</span>'
      : '<span class="chip">No reviews yet</span>';
    var offices = firm && (p.offices || []).length
      ? '<div class="card"><h2>Offices</h2>' + p.offices.map(function (o) { return '<div style="padding:6px 0"><strong>' + esc(o.name || 'Office') + '</strong><div class="muted">' + esc([o.address, o.county].filter(Boolean).join(', ')) + '</div></div>'; }).join('') + '</div>'
      : '';
    root.innerHTML =
      '<section class="hero"><div class="hero-row"><div class="avatar" aria-hidden="true">' + esc(initials(title)) + '</div><div style="min-width:0">' +
        '<h1 class="name">' + esc(title) + '</h1>' +
        '<div class="sub">' + esc(firm ? 'Law firm' + (p.name ? ' · responsible advocate ' + p.name : '') : 'Advocate' + (p.firmName ? ' · ' + p.firmName : '')) + (p.county ? ' · ' + esc(p.county) : '') + '</div>' +
        '<div class="chips">' + verified.join('') + rating + (p.isOnline ? '<span class="chip">Online consultations</span>' : '') + '</div>' +
      '</div></div></section>' +
      '<div class="grid"><div style="display:grid;gap:16px">' +
        (p.bio ? '<div class="card"><h2>About</h2><p style="margin:0;white-space:pre-line">' + esc(p.bio) + '</p></div>' : '') +
        '<div class="card"><h2>Practice areas</h2>' + areasHtml(p) + '</div>' +
        '<div class="card"><h2>Services &amp; rates</h2><div id="svcList">' + servicesHtml(SERVICES) + '</div>' +
          '<p class="muted" style="margin-top:12px">Prices are set by SOKONI\'s server from the advocate\'s published rate card. You pay through SOKONI (IntaSend); the advocate is paid after you confirm the service with your completion PIN.</p></div>' +
        offices +
      '</div><aside style="display:grid;gap:16px;align-content:start">' +
        '<div class="card"><h2>Book</h2><div class="actions">' +
          '<button type="button" class="btn btn-gold" id="bookMain">Book a consultation</button>' +
          '<p class="muted" style="margin:0">Pick a time from this advocate\'s live availability. Messaging opens once you have a booking.</p>' +
          '<button type="button" class="btn btn-ghost" id="quoteMain">Request a quote for a larger matter</button>' +
          '<p class="muted" style="margin:0">Company work, contracts, due diligence or a dispute: describe it, and the advocate replies in SOKONI with a quote. If you accept, you book and pay that quoted amount through SOKONI — held until you confirm with your completion PIN.</p>' +
        '</div></div>' +
        '<div class="card"><h2>Details</h2><dl class="kv">' +
          '<dt>Consultation</dt><dd>' + (p.consultationFee ? esc('KES ' + Number(p.consultationFee).toLocaleString()) : '—') + '</dd>' +
          '<dt>Languages</dt><dd>' + esc((p.languages || []).join(', ') || '—') + '</dd>' +
          '<dt>Experience</dt><dd>' + (Number(p.yearsOfExperience) > 0 ? esc(p.yearsOfExperience + ' years') : '—') + '</dd>' +
          '<dt>Location</dt><dd>' + esc(p.county || '—') + '</dd>' +
        '</dl></div>' +
        '<div class="card"><h2>Share</h2><div class="actions">' +
          '<button type="button" class="btn btn-ghost" id="shareBtn">Share this profile</button>' +
          '<a class="btn btn-ghost" style="text-align:center;text-decoration:none" href="support.html?topic=report&ref=' + encodeURIComponent('legal_' + id) + '">Report this profile</a>' +
        '</div></div>' +
      '</aside></div>';
    document.getElementById('stickyBook').classList.add('on');
  }

  function book(serviceId) {
    var svc = SERVICES && SERVICES.filter(function (s) { return s.id === serviceId; })[0];
    if (!window.SokoniBookService) { toast('Booking is loading — try again in a moment.'); return; }
    var name = P.entityType === 'firm' ? (P.firmName || P.name) : P.name;
    SokoniBookService.open(Object.assign({ providerId: id, providerName: name }, svc ? { serviceId: svc.id, serviceName: svc.name } : {}));
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-book]'); if (b) { book(b.getAttribute('data-book')); return; }
    if (e.target.closest('#bookMain') || e.target.closest('#stickyBookBtn')) {
      var consult = (SERVICES || []).filter(function (s) { return s.legalConsultation; })[0];
      book(consult ? consult.id : null); return;
    }
    if (e.target.closest('#quoteMain')) {
      /* Legal Hub L9: the canonical leads → quote → booking engine (providerDispatch lead*); never a Legal quote system. */
      if (!window.SokoniLeads) { toast('Quote requests are loading — try again in a moment.'); return; }
      var nm = P.entityType === 'firm' ? (P.firmName || P.name) : P.name;
      SokoniLeads.ask({ providerId: id, providerName: nm, placeholder: 'e.g. Register a company with three directors and draft a shareholders\' agreement — scope, fee and timeline?' });
      return;
    }
    if (e.target.closest('#shareBtn')) {
      /* Shares the PUBLIC profile link only — never a booking, matter or payment detail. */
      var url = location.origin + '/legal-profile.html?id=' + encodeURIComponent(id);
      var title = (P.entityType === 'firm' ? (P.firmName || P.name) : P.name) + ' on SOKONI Legal Hub';
      if (navigator.share) navigator.share({ title: title, url: url }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Profile link copied'); }, function () { toast(url); });
      else toast(url);
    }
  });

  (async function () {
    if (!id || !/^[A-Za-z0-9_-]{6,128}$/.test(id)) { root.innerHTML = '<div class="state">This profile link is not valid.</div>'; return; }
    try { P = await callable('getLegalProvider', { providerId: id }); }
    catch (e) {
      var c = (e && e.code) || '';
      root.innerHTML = c.indexOf('not-found') > -1
        ? '<div class="state"><div style="font-size:42px">⚖️</div><p>This advocate isn’t available on SOKONI right now.</p><p><a href="legal-hub.html#lawyers">Browse verified advocates</a></p></div>'
        : '<div class="state"><p>We couldn’t load this profile just now. Please try again.</p></div>';
      return;
    }
    SERVICES = await loadServices();
    render();
  })();
})();
</script>
</body>
</html>
