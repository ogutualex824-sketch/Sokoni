<!DOCTYPE html>
<html lang="en" data-splash="1" data-require-auth="true">
<head><script src="security.js"></script>
<script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications — SOKONI</title>
  <meta name="description" content="Your SOKONI notifications — orders, deliveries, rides, appointments and more.">
  <link rel="icon" type="image/png" href="assets/logosokoni.png">
  <link rel="apple-touch-icon" href="assets/logosokoni.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#71ff00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOKONI">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="sokoni-premium-v2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding-bottom:90px;}

    /* ── HEADER ─────────────────────────────────────────────── */
    .notif-nav{
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 16px;height:58px;
      background:rgba(5,5,5,0.97);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(113,255,0,0.08);
    }
    .notif-nav-left{display:flex;align-items:center;gap:10px;}
    .notif-back{
      width:36px;height:36px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;
      transition:background .15s;
    }
    .notif-back:hover{background:rgba(255,255,255,0.1);}
    .notif-logo{height:26px;}
    .notif-title{font-size:15px;font-weight:900;color:#fff;}
    .notif-header-right{display:flex;align-items:center;gap:8px;}
    .unread-badge{
      min-width:20px;height:20px;padding:0 6px;
      background:#71ff00;border-radius:10px;
      font-size:11px;font-weight:900;color:#050f05;
      display:none;align-items:center;justify-content:center;
      line-height:1;
    }
    .unread-badge.visible{display:flex;}
    .mark-all-btn{
      font-size:12px;font-weight:700;color:#71ff00;
      background:rgba(113,255,0,0.08);border:1px solid rgba(113,255,0,0.2);
      border-radius:8px;cursor:pointer;padding:6px 11px;
      font-family:inherit;transition:all .15s;white-space:nowrap;
    }
    .mark-all-btn:hover{background:rgba(113,255,0,0.16);}

    /* ── FILTER TABS ─────────────────────────────────────────── */
    .notif-tabs{
      display:flex;gap:6px;padding:12px 16px 10px;
      overflow-x:auto;scrollbar-width:none;
      border-bottom:1px solid rgba(255,255,255,0.05);
      position:sticky;top:58px;z-index:90;
      background:#0a0a0a;
    }
    .notif-tabs::-webkit-scrollbar{display:none;}
    .notif-tab{
      flex-shrink:0;padding:7px 14px;border-radius:20px;
      border:1px solid rgba(255,255,255,0.1);
      background:transparent;color:rgba(255,255,255,0.5);
      font-size:12px;font-weight:700;cursor:pointer;
      font-family:inherit;transition:all .18s;
      display:flex;align-items:center;gap:5px;
    }
    .notif-tab.active{
      background:rgba(113,255,0,0.12);
      border-color:rgba(113,255,0,0.35);
      color:#71ff00;
    }
    .tab-dot{
      width:7px;height:7px;border-radius:50%;
      background:#71ff00;display:none;flex-shrink:0;
    }
    .notif-tab.has-unread .tab-dot{display:block;}

    /* ── NOTIFICATION FEED ───────────────────────────────────── */
    .notif-list{display:flex;flex-direction:column;gap:0;}
    .section-label{
      padding:10px 18px 6px;font-size:10px;
      text-transform:uppercase;letter-spacing:1px;
      color:rgba(255,255,255,0.28);font-weight:700;
    }
    .notif-item{
      display:flex;align-items:flex-start;gap:13px;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.04);
      cursor:pointer;transition:background .15s;position:relative;
    }
    .notif-item:hover{background:rgba(255,255,255,0.028);}
    .notif-item.unread{background:rgba(113,255,0,0.03);}
    .notif-item.unread::before{
      content:'';position:absolute;left:0;top:0;bottom:0;
      width:3px;background:#71ff00;border-radius:0 2px 2px 0;
    }
    .notif-dot-outer{
      display:flex;align-items:flex-start;padding-top:2px;flex-shrink:0;
    }
    .notif-dot{
      width:9px;height:9px;border-radius:50%;background:#71ff00;
      flex-shrink:0;margin-top:2px;
      box-shadow:0 0 6px #71ff00;
      opacity:0;transition:opacity .2s;
    }
    .notif-item.unread .notif-dot{opacity:1;}
    .notif-icon{
      width:44px;height:44px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex-shrink:0;
    }
    /* icon backgrounds by category */
    .notif-icon.orders    {background:rgba(113,255,0,0.10);}
    .notif-icon.deliveries{background:rgba(255,152,0,0.10);}
    .notif-icon.rides     {background:rgba(0,170,255,0.10);}
    .notif-icon.appointments{background:rgba(200,100,255,0.10);}
    .notif-icon.applications{background:rgba(255,220,0,0.10);}
    .notif-icon.community {background:rgba(255,80,160,0.10);}
    .notif-icon.promotions{background:rgba(255,80,80,0.10);}
    .notif-icon.wallet    {background:rgba(0,220,180,0.10);}
    .notif-icon.system    {background:rgba(255,255,255,0.06);}
    .notif-body{flex:1;min-width:0;}
    .notif-heading{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.35;}
    .notif-sub{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.45;margin-bottom:5px;}
    .notif-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .notif-time{font-size:10px;color:rgba(255,255,255,0.28);font-weight:600;}
    .notif-action{
      font-size:11px;font-weight:800;color:#71ff00;
      background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.25);
      border-radius:8px;padding:4px 10px;white-space:nowrap;
      text-decoration:none;cursor:pointer;font-family:inherit;
      transition:background .15s;flex-shrink:0;
    }
    .notif-action:hover{background:rgba(113,255,0,0.2);}

    /* ── EMPTY STATE ─────────────────────────────────────────── */
    .notif-empty{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:70px 20px;gap:14px;text-align:center;
    }
    .notif-empty-icon{font-size:56px;opacity:.22;}
    .notif-empty-title{font-size:17px;font-weight:800;color:rgba(255,255,255,0.4);}
    .notif-empty-sub{font-size:13px;color:rgba(255,255,255,0.22);line-height:1.5;max-width:260px;}
    .notif-enable-btn{
      margin-top:10px;padding:12px 26px;
      background:linear-gradient(135deg,#71ff00,#4fc800);
      color:#050f05;font-weight:900;font-size:13px;
      border:none;border-radius:14px;cursor:pointer;font-family:inherit;
      transition:opacity .15s;
    }
    .notif-enable-btn:hover{opacity:.88;}

    /* ── PUSH PERMISSION BANNER ─────────────────────────────── */
    .push-banner{
      margin:12px 16px;padding:14px 16px;
      background:rgba(113,255,0,0.06);border:1px solid rgba(113,255,0,0.18);
      border-radius:14px;display:flex;align-items:center;gap:12px;
    }
    .push-banner-text{flex:1;font-size:12px;color:rgba(255,255,255,0.6);line-height:1.45;}
    .push-banner-text strong{color:#fff;display:block;margin-bottom:2px;font-size:13px;}
    .push-banner-btn{
      font-size:12px;font-weight:800;color:#050f05;
      background:#71ff00;border:none;border-radius:10px;
      padding:8px 14px;cursor:pointer;font-family:inherit;
      flex-shrink:0;white-space:nowrap;
    }
    .push-banner-close{
      width:24px;height:24px;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,0.06);border:none;border-radius:6px;
      color:rgba(255,255,255,0.4);cursor:pointer;font-size:13px;font-family:inherit;
      flex-shrink:0;
    }

    /* ── SWIPE-TO-DELETE ─────────────────────────────────────── */
    .notif-item{
      position:relative;
      overflow:hidden;
      touch-action:pan-y;
    }
    .notif-item .swipe-delete-bg{
      position:absolute;inset:0;
      background:rgba(255,50,50,0.18);
      display:flex;align-items:center;justify-content:flex-end;
      padding-right:20px;
      opacity:0;transition:opacity .15s;
      pointer-events:none;
      font-size:18px;
      color:rgba(255,100,100,0.9);
    }
    .notif-item .swipe-inner{
      position:relative;z-index:1;
      display:contents;
      transition:transform .2s cubic-bezier(.4,0,.2,1);
    }
    .notif-item[data-deleting]{
      opacity:0;max-height:0;padding:0;margin:0;
      overflow:hidden;transition:opacity .25s,max-height .3s,padding .3s,margin .3s;
    }

    @media(min-width:769px){
      .bottom-nav{display:none!important;}
      body{padding-bottom:0;}
    }
  </style>
<script src="shared-header.js" defer></script>
  <link rel="stylesheet" href="sokoni-desktop.css">
</head>
<body>
<script src="splash.js"></script>

<!-- ── HEADER ──────────────────────────────────────────────────── -->
<nav class="notif-nav">
  <div class="notif-nav-left">
    <a href="javascript:history.back()" class="notif-back">&#8592;</a>

<!-- ── FILTER TABS ──────────────────────────────────────────────── -->
<div class="notif-tabs" id="notifTabs">
  <button class="notif-tab active" data-filter="all" onclick="SokoniNotifs.setFilter('all',this)">All <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="orders" onclick="SokoniNotifs.setFilter('orders',this)">&#128722; Orders <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="deliveries" onclick="SokoniNotifs.setFilter('deliveries',this)">&#128667; Deliveries <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="rides" onclick="SokoniNotifs.setFilter('rides',this)">&#128663; Rides <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="appointments" onclick="SokoniNotifs.setFilter('appointments',this)">&#128197; Appointments <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="applications" onclick="SokoniNotifs.setFilter('applications',this)">&#128232; Applications <span class="tab-dot"></span></button>
  <button class="notif-tab" data-filter="community" onclick="SokoniNotifs.setFilter('community',this)">&#128172; Community <span class="tab-dot"></span></button>

<!-- ── PUSH BANNER (shown if permission not granted) ─────────────── -->
<div class="push-banner" id="pushBanner" style="display:none;">

  <div class="push-banner-text">
    <strong>Stay in the loop</strong>
    Get real-time alerts for orders, rides &amp; deals.
  </div>
  <button class="push-banner-btn" onclick="SokoniNotifs.enablePush()">Enable</button>
  <button class="push-banner-close" onclick="SokoniNotifs.dismissPushBanner()" title="Dismiss">&#10005;</button>
</div>

<!-- ── NOTIFICATION FEED ────────────────────────────────────────── -->
<div id="notifContainer"></div>

<!-- ── BOTTOM NAV ───────────────────────────────────────────────── -->
<nav class="bottom-nav">

<!-- ── CORE SCRIPT ──────────────────────────────────────────────── -->
<script>
/* ============================================================
   SokoniNotifs — Universal Notification Centre v2
   ============================================================ */
var SokoniNotifs = (function(){
  var NOTIF_KEY   = 'sokoniNotifications';
  var BANNER_KEY  = 'sokoniNotifBannerDismissed';
  var activeFilter = 'all';

  /* ── NOTIFICATION TYPE DEFINITIONS ─────────────────────── */
  var TYPE_META = {
    order_placed:          {icon:'&#128722;',  category:'orders',       action:'Track Order',    link:'track.html'},
    order_shipped:         {icon:'&#128230;',  category:'orders',       action:'Track Order',    link:'track.html'},
    order_delivered:       {icon:'&#9989;',    category:'orders',       action:'Rate & Review',  link:'profile.html?tab=orders'},
    delivery_update:       {icon:'&#128667;',  category:'deliveries',   action:'Track Delivery', link:'track.html'},
    ride_accepted:         {icon:'&#128663;',  category:'rides',        action:'Track Ride',     link:'track.html'},
    ride_arrived:          {icon:'&#128205;',  category:'rides',        action:'Open Ride',      link:'track.html'},
    appointment_reminder:  {icon:'&#128197;',  category:'appointments', action:'View Booking',   link:'services.html'},
    appointment_confirmed: {icon:'&#9989;',    category:'appointments', action:'View Booking',   link:'services.html'},
    application_received:  {icon:'&#128232;',  category:'applications', action:'Review',         link:'seller.html?tab=applications'},
    application_accepted:  {icon:'&#127881;',  category:'applications', action:'View Offer',     link:'profile.html'},
    community_reply:       {icon:'&#128172;',  category:'community',    action:'Reply',          link:'community.html'},
    community_like:        {icon:'&#10084;&#65039;', category:'community', action:'View Post',  link:'community.html'},
    promotion:             {icon:'&#127873;',  category:'orders',       action:'Shop Now',       link:'category.html?cat=all'},
    wallet_credit:         {icon:'&#128179;',  category:'wallet',       action:'View Wallet',    link:'profile.html?tab=wallet'},
    wallet_debit:          {icon:'&#128183;',  category:'wallet',       action:'View Wallet',    link:'profile.html?tab=wallet'},
    wallet_cashout:        {icon:'&#128200;',  category:'wallet',       action:'View Wallet',    link:'profile.html?tab=wallet'},
    verification_approved: {icon:'&#9989;',    category:'system',       action:'View Profile',   link:'profile.html'},
    security_alert:        {icon:'&#128274;',  category:'system',       action:'Review',         link:'profile.html'},
    platform_update:       {icon:'&#128640;',  category:'system',       action:'Learn More',     link:'index.html'}
  };

  /* Legacy type aliases from old notification keys */
  var LEGACY_CATEGORY = {
    order:'orders', msg:'community', deal:'orders',
    alert:'system', system:'system'
  };

  /* ── STORAGE ─────────────────────────────────────────────── */
  function get(){ try{ return JSON.parse(localStorage.getItem(NOTIF_KEY)||'[]'); }catch(e){ return []; } }
  function save(arr){ localStorage.setItem(NOTIF_KEY, JSON.stringify(arr)); }

  /* ── HELPERS ─────────────────────────────────────────────── */
  function timeAgo(ts){
    if(!ts) return '';
    var diff = Math.floor((Date.now()-ts)/1000);
    if(diff<60)    return 'Just now';
    if(diff<3600)  return Math.floor(diff/60)+'m ago';
    if(diff<86400) return Math.floor(diff/3600)+'h ago';
    if(diff<172800) return 'Yesterday';
    return Math.floor(diff/86400)+'d ago';
  }

  function uid(){ try{ return (JSON.parse(localStorage.getItem('sokoniUser')||'{}')).uid||null; }catch(e){ return null; } }
  function userName(){ try{ var u=JSON.parse(localStorage.getItem('sokoniUser')||'{}'); return (u.name||u.displayName||'').split(' ')[0]||'there'; }catch(e){ return 'there'; } }

  function resolveCategory(n){
    if(n.category) return n.category;
    var meta = TYPE_META[n.type];
    if(meta) return meta.category;
    return LEGACY_CATEGORY[n.type] || 'system';
  }

  function resolveIcon(n){
    if(n.icon && !n.icon.match(/^[a-z]/i)) return n.icon; /* emoji already */
    var meta = TYPE_META[n.type];
    return meta ? meta.icon : '&#128276;';
  }

  /* ── SEED DATA ───────────────────────────────────────────── */
  function seed(){
    if(get().length) return;
    var now = Date.now();
    var name = userName();
    var items = [
      /* orders */
      {id:'N001',type:'order_placed',heading:'Order #ORD-7821 placed',sub:'Your order for 3 items has been confirmed. Payment received.',ts:now-4*60000,read:false,link:'track.html'},
      {id:'N002',type:'order_shipped',heading:'Order #ORD-7821 is on the way',sub:'Your package has been picked up by the courier and is heading to you.',ts:now-30*60000,read:false,link:'track.html'},
      {id:'N003',type:'order_delivered',heading:'Order #ORD-7788 delivered',sub:'Your order was delivered successfully. How was your experience?',ts:now-2*86400000,read:true,link:'profile.html?tab=orders'},
      /* deliveries */
      {id:'N004',type:'delivery_update',heading:'Driver is 2 km away',sub:'Brian is on a boda boda heading to your location. ETA: 6 minutes.',ts:now-8*60000,read:false,link:'track.html'},
      /* rides */
      {id:'N005',type:'ride_accepted',heading:'Driver accepted your ride',sub:'Peter (Toyota Corolla, KCG 421W) is on the way to pick you up.',ts:now-3*60000,read:false,link:'track.html'},
      {id:'N006',type:'ride_arrived',heading:'Your driver has arrived',sub:'Peter is at your pickup location. Please come out within 5 minutes.',ts:now-60000,read:false,link:'track.html'},
      /* appointments */
      {id:'N007',type:'appointment_reminder',heading:'Appointment reminder: Dr. Ouma',sub:'You have an appointment tomorrow at 10:00 AM at Aga Khan Hospital.',ts:now-3600000,read:false,link:'services.html'},
      {id:'N008',type:'appointment_confirmed',heading:'Booking confirmed: Plumber at 2 PM',sub:'John Mwangi (Licensed Plumber) confirmed your appointment for today.',ts:now-5*3600000,read:true,link:'services.html'},
      /* applications */
      {id:'N009',type:'application_received',heading:'New application for your job post',sub:'3 new applicants for "Delivery Driver — Nairobi CBD". Review them now.',ts:now-90*60000,read:false,link:'seller.html?tab=applications'},
      {id:'N010',type:'application_accepted',heading:'Your application was accepted!',sub:'Congratulations '+name+'! QuickMart has accepted your delivery driver application.',ts:now-4*3600000,read:false,link:'profile.html'},
      /* community */
      {id:'N011',type:'community_reply',heading:'Jane replied to your post',sub:'"I totally agree! The market in Gikomba has great deals..."',ts:now-45*60000,read:false,link:'community.html'},
      {id:'N012',type:'community_like',heading:'5 people liked your post',sub:'Your post "Best local mangoes in Nairobi?" is getting attention.',ts:now-2*3600000,read:true,link:'community.html'},
      /* promotions & wallet */
      {id:'N013',type:'promotion',heading:'Flash sale: 50% off Electronics today only',sub:'Samsung, Xiaomi, JBL and more — limited stock. Ends at midnight.',ts:now-15*60000,read:false,link:'category.html?cat=electronics'},
      {id:'N014',type:'wallet_credit',heading:'KES 500 added to your wallet',sub:'Referral bonus credited. Use it on your next order at checkout.',ts:now-6*3600000,read:true,link:'profile.html?tab=wallet'},
      {id:'N015',type:'verification_approved',heading:'Business verified!',sub:'Your SOKONI seller account is now verified. Display your badge with pride.',ts:now-86400000,read:true,link:'profile.html'}
    ];
    save(items);
  }

  /* ── RENDER ──────────────────────────────────────────────── */
  function unreadCount(arr, filter){
    var filtered = (filter && filter!=='all') ? arr.filter(function(n){ return resolveCategory(n)===filter; }) : arr;
    return filtered.filter(function(n){ return !n.read; }).length;
  }

  function updateBadge(arr){
    var count = unreadCount(arr,'all');
    var badge = document.getElementById('unreadBadge');
    if(!badge) return;
    badge.textContent = count > 99 ? '99+' : String(count);
    badge.className = 'unread-badge'+(count>0?' visible':'');
    /* Update tab dots */
    document.querySelectorAll('.notif-tab').forEach(function(tab){
      var f = tab.getAttribute('data-filter');
      var hasUnread = (f==='all') ? count>0 : unreadCount(arr,f)>0;
      tab.classList.toggle('has-unread', hasUnread);
    });
  }

  function buildCard(n){
    var cat  = resolveCategory(n);
    var icon = resolveIcon(n);
    var meta = TYPE_META[n.type] || {};
    var action = n.action || meta.action || null;
    var link   = n.link   || meta.link   || 'index.html';
    var ts     = n.ts || n.createdAt || Date.now();
    var timeStr = timeAgo(ts);

    var footerHtml = '<div class="notif-footer">'+
      '<span class="notif-time">'+timeStr+'</span>'+
      (action ? '<button class="notif-action" onclick="event.stopPropagation();SokoniNotifs.openNotif(\''+n.id+'\',\''+encodeURIComponent(link)+'\')">'+action+'</button>' : '')+
    '</div>';

    return '<div class="notif-item'+(n.read?'':' unread')+'" id="notif-'+n.id+'" onclick="SokoniNotifs.tapNotif(\''+n.id+'\',\''+encodeURIComponent(link)+'\')" role="button" tabindex="0">'+
      '<div class="notif-dot-outer"><div class="notif-dot"></div></div>'+
      '<div class="notif-icon '+cat+'">'+icon+'</div>'+
      '<div class="notif-body">'+
        '<div class="notif-heading">'+escHtml(n.heading||n.title||'')+'</div>'+
        '<div class="notif-sub">'+escHtml(n.sub||n.body||'')+'</div>'+
        footerHtml+
      '</div>'+
    '</div>';
  }

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function _dateGroup(ts){
    var now = Date.now();
    var diff = now - (ts || now);
    if(diff < 86400000)                          return 'Today';
    if(diff < 2*86400000)                        return 'Yesterday';
    if(diff < 7*86400000)                        return 'This Week';
    if(diff < 30*86400000)                       return 'This Month';
    return 'Older';
  }

  var _GROUP_ORDER = ['Today','Yesterday','This Week','This Month','Older'];

  function render(){
    var all = get();
    updateBadge(all);
    var f = activeFilter;
    var filtered = (f && f!=='all') ? all.filter(function(n){ return resolveCategory(n)===f; }) : all;
    /* sort newest first */
    filtered.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

    var c = document.getElementById('notifContainer');
    if(!c) return;

    if(!filtered.length){
      var emptyIcons = {wallet:'&#128179;',system:'&#9881;&#65039;',orders:'&#128722;',deliveries:'&#128667;',rides:'&#128663;',appointments:'&#128197;',applications:'&#128232;',community:'&#128172;'};
      var msg = f==='all' ? "You're all caught up! &#127881;" : 'No '+f+' notifications yet.';
      var sub = f==='all' ? "We'll alert you about orders, rides, deals and more." : "Switch to 'All' to see everything.";
      c.innerHTML =
        '<div class="notif-empty">'+
          '<div class="notif-empty-icon">'+(emptyIcons[f]||'&#128276;')+'</div>'+
          '<div class="notif-empty-title">'+msg+'</div>'+
          '<div class="notif-empty-sub">'+sub+'</div>'+
          ('Notification' in window && Notification.permission!=='granted' ?
            '<button class="notif-enable-btn" onclick="SokoniNotifs.enablePush()">&#128276; Enable Push Notifications</button>' : '')+
        '</div>';
      return;
    }

    /* Group by date bucket */
    var groups = {};
    filtered.forEach(function(n){
      var g = _dateGroup(n.ts || n.createdAt || Date.now());
      if(!groups[g]) groups[g] = [];
      groups[g].push(n);
    });

    var html = '<div class="notif-list">';
    _GROUP_ORDER.forEach(function(label){
      if(!groups[label] || !groups[label].length) return;
      html += '<div class="section-label">'+label+'</div>';
      html += groups[label].map(buildCard).join('');
    });
    html += '</div>';
    c.innerHTML = html;
    _attachSwipeHandlers(c);
  }

  /* ── SWIPE-TO-DELETE HANDLER ──────────────────────────────── */
  function dismiss(id){
    var all = get().filter(function(n){ return n.id !== id; });
    save(all);
    var el = document.getElementById('notif-'+id);
    if(el){ el.setAttribute('data-deleting','1'); setTimeout(function(){ el.remove(); updateBadge(get()); }, 320); }
    else { render(); }
  }

  function _attachSwipeHandlers(container){
    var items = container.querySelectorAll('.notif-item');
    items.forEach(function(item){
      /* Inject delete background layer */
      if(!item.querySelector('.swipe-delete-bg')){
        var bg = document.createElement('div');
        bg.className = 'swipe-delete-bg';
        bg.innerHTML = '🗑';
        item.insertBefore(bg, item.firstChild);
      }

      var startX=0, startY=0, curX=0, isSwipe=false, lockAxis=false;
      var THRESHOLD = 80; /* px to trigger delete */

      function onStart(clientX, clientY){
        startX=clientX; startY=clientY; curX=0; isSwipe=false; lockAxis=false;
        item.style.transition='none';
      }
      function onMove(clientX, clientY){
        var dx=clientX-startX, dy=clientY-startY;
        if(!lockAxis){ lockAxis=true; isSwipe=Math.abs(dx)>Math.abs(dy)*1.5; }
        if(!isSwipe) return;
        if(dx>0) dx=0; /* left only */
        curX=dx;
        item.style.transform='translateX('+dx+'px)';
        var ratio=Math.min(1,Math.abs(dx)/THRESHOLD);
        var bg=item.querySelector('.swipe-delete-bg');
        if(bg) bg.style.opacity=ratio;
      }
      function onEnd(){
        item.style.transition='';
        if(isSwipe && Math.abs(curX)>=THRESHOLD){
          item.style.transform='translateX(-100%)';
          var id=item.id.replace('notif-','');
          setTimeout(function(){ dismiss(id); },220);
        } else {
          item.style.transform='';
          var bg=item.querySelector('.swipe-delete-bg');
          if(bg) bg.style.opacity=0;
        }
      }

      /* Touch */
      item.addEventListener('touchstart',function(e){onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
      item.addEventListener('touchmove',function(e){onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
      item.addEventListener('touchend',onEnd,{passive:true});

      /* Mouse (desktop) */
      item.addEventListener('mousedown',function(e){
        if(e.button!==0) return;
        onStart(e.clientX,e.clientY);
        function mMove(e2){ onMove(e2.clientX,e2.clientY); e2.preventDefault(); }
        function mUp(){ onEnd(); window.removeEventListener('mousemove',mMove); window.removeEventListener('mouseup',mUp); }
        window.addEventListener('mousemove',mMove);
        window.addEventListener('mouseup',mUp);
      });
    });
  }

  /* ── PUSH BANNER ─────────────────────────────────────────── */
  function checkPushBanner(){
    if(localStorage.getItem(BANNER_KEY)) return;
    if(!('Notification' in window)) return;
    if(Notification.permission === 'granted') return;
    var banner = document.getElementById('pushBanner');
    if(banner) banner.style.display = 'flex';
  }

  /* ── PUBLIC API ──────────────────────────────────────────── */
  function setFilter(filter, btn){
    activeFilter = filter;
    document.querySelectorAll('.notif-tab').forEach(function(t){ t.classList.remove('active'); });
    if(btn) btn.classList.add('active');
    render();
  }

  function tapNotif(id, encodedLink){
    var all = get();
    var n = all.find(function(x){ return x.id===id; });
    if(n && !n.read){
      n.read=true;
      save(all);
      render();
      _fsMarkRead(id);  /* persist to Firestore so header badge clears */
    }
    setTimeout(function(){ window.location.href = decodeURIComponent(encodedLink); }, 120);
  }

  /* called from action button — mark read + navigate */
  function openNotif(id, encodedLink){
    var all = get();
    var n = all.find(function(x){ return x.id===id; });
    if(n && !n.read){
      n.read=true;
      save(all);
      _fsMarkRead(id);
    }
    window.location.href = decodeURIComponent(encodedLink);
  }

  function markAllRead(){
    var all = get();
    var unreadIds = all.filter(function(n){ return !n.read; }).map(function(n){ return n.id; });
    all.forEach(function(n){ n.read=true; });
    save(all);
    render();
    _fsMarkAllRead(unreadIds);  /* batch-update Firestore so header badge clears */
  }

  function enablePush(){
    if(!('Notification' in window)){ var b=document.getElementById('pushBanner'); if(b){ b.querySelector('.push-banner-text').innerHTML='<strong>Not supported</strong> Push notifications are not available in this browser.'; b.style.display='flex'; } return; }
    Notification.requestPermission().then(function(p){
      var banner = document.getElementById('pushBanner');
      if(banner) banner.style.display = 'none';
      if(p==='granted'){
        /* Sync with window.sokoniNotif if present */
        if(window.sokoniNotif && typeof window.sokoniNotif.sync === 'function'){
          window.sokoniNotif.sync();
        }
        new Notification('SOKONI Notifications Enabled!',{
          body:'You will now receive real-time alerts for orders, rides and deals.',
          icon:'assets/logosokoni.png'
        });
        render(); /* re-render to remove "Enable Push" button from empty state */
      }
    });
  }

  function dismissPushBanner(){
    localStorage.setItem(BANNER_KEY,'1');
    var banner = document.getElementById('pushBanner');
    if(banner) banner.style.display='none';
  }

  /* ── INGEST EXTERNAL NOTIFICATION (for push / Firestore) ── */
  function ingest(notifObj){
    var all = get();
    var exists = all.find(function(n){ return n.id===notifObj.id; });
    if(!exists){
      var ts = notifObj.ts || (notifObj.createdAt && notifObj.createdAt.seconds ? notifObj.createdAt.seconds*1000 : Date.now());
      all.unshift({
        id:      notifObj.id || ('fs-'+Date.now()),
        type:    notifObj.type    || 'system',
        heading: notifObj.heading || notifObj.title || '',
        sub:     notifObj.sub     || notifObj.body  || '',
        link:    notifObj.link    || 'index.html',
        action:  notifObj.action  || null,
        ts:      ts,
        read:    notifObj.read    || false,
        _fs:     true
      });
      save(all);
      render();
    }
  }

  /* ── FIRESTORE REAL-TIME LISTENER + READ WRITES ─────────── */
  var _fsUnsub  = null;
  var _fsDb     = null;  /* shared db ref for read-marking */
  var _fsUid    = null;  /* shared uid ref for read-marking */

  /* Mark a single notification doc as read in Firestore (best-effort) */
  function _fsMarkRead(id){
    if(!_fsDb || !id || id.startsWith('local-')) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      .then(function(fs){
        fs.updateDoc(fs.doc(_fsDb,'notifications',id),{read:true}).catch(function(){});
      }).catch(function(){});
  }

  /* Batch-mark all unread notifications as read in Firestore */
  function _fsMarkAllRead(ids){
    if(!_fsDb || !ids || !ids.length) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      .then(function(fs){
        var batch = fs.writeBatch(_fsDb);
        ids.forEach(function(id){
          if(!id || id.startsWith('local-')) return;
          batch.update(fs.doc(_fsDb,'notifications',id),{read:true});
        });
        batch.commit().catch(function(){});
      }).catch(function(){});
  }

  function _startFirestoreListener(userUid){
    if(_fsUnsub) return; /* already listening */
    _fsUid = userUid;
    (async function(){
      try{
        var {initializeApp,getApps} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        var {getFirestore,collection,query,where,orderBy,limit,onSnapshot} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
        var cfg = {apiKey:'AIzaSyDt_FRoTdE5OpfPhLB0DApIm7p-I45hzVE',authDomain:'sokoni-aeb26.firebaseapp.com',
          projectId:'sokoni-aeb26',storageBucket:'sokoni-aeb26.firebasestorage.app',
          messagingSenderId:'24799054989',appId:'1:24799054989:web:e1cf6ca8c281bf1abf26c4'};
        var app = getApps().length ? getApps()[0] : initializeApp(cfg);
        var db  = getFirestore(app);
        _fsDb = db;  /* store for read-marking */
        /* Listen to notifications collection for this user, newest 50 */
        var q = query(
          collection(db,'notifications'),
          where('targetUid','==',userUid),
          orderBy('createdAt','desc'),
          limit(50)
        );
        _fsUnsub = onSnapshot(q, function(snap){
          snap.docChanges().forEach(function(change){
            if(change.type === 'added' || change.type === 'modified'){
              var d = change.doc.data();
              ingest({
                id:      change.doc.id,
                type:    d.type    || 'system',
                heading: d.heading || d.title  || '',
                sub:     d.sub     || d.body   || '',
                link:    d.link    || 'index.html',
                action:  d.action  || null,
                ts:      d.createdAt && d.createdAt.seconds ? d.createdAt.seconds*1000 : Date.now(),
                read:    d.read    || false,
              });
            }
          });
        }, function(err){ console.warn('[SokoniNotifs] Firestore listener error:', err.message); });
      } catch(e){ console.warn('[SokoniNotifs] Could not start Firestore listener:', e.message); }
    })();
  }

  /* ── INIT ─────────────────────────────────────────────────── */
  function init(){
    seed();
    render();
    checkPushBanner();

    /* Sync push permission status */
    if(window.sokoniNotif && typeof window.sokoniNotif.permissionStatus === 'function'){
      window.sokoniNotif.permissionStatus();
    }

    /* Start real-time Firestore listener once auth is ready */
    function _tryStartListener(){
      try{
        var u = JSON.parse(localStorage.getItem('sokoniUser')||'{}');
        if(u && u.uid){ _startFirestoreListener(u.uid); return; }
      } catch(e){}
    }
    _tryStartListener();
    document.addEventListener('sokoniAuthReady', function(e){
      if(e.detail && e.detail.uid) _startFirestoreListener(e.detail.uid);
    });
  }

  return {
    init:              init,
    setFilter:         setFilter,
    tapNotif:          tapNotif,
    openNotif:         openNotif,
    markAllRead:       markAllRead,
    enablePush:        enablePush,
    dismissPushBanner: dismissPushBanner,
    ingest:            ingest,
    render:            render,
    dismiss:           dismiss
  };
})();

document.addEventListener('DOMContentLoaded', function(){ SokoniNotifs.init(); });
if(document.readyState !== 'loading'){ SokoniNotifs.init(); }

  });
});

})();
