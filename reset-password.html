<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Choose a new password — SOKONI</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- The reset token is in this page's URL. no-referrer stops it leaking to any other site
       through the Referer header; the script also removes it from the address bar at once. -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Choose a new password for your SOKONI account.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="theme-color" content="#71ff00">
  <script src="security.js"></script>
  <style>
    :root { --bg:#050f05; --card:rgba(255,255,255,0.04); --line:rgba(255,255,255,0.14); --text:#f2f5f2; --sub:rgba(255,255,255,0.72); --brand:#71ff00; --err:#ff8a80; --ok:#9dff6b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 22px; }
    h1 { font-size:1.35rem; margin:0 0 6px; }
    p { color:var(--sub); line-height:1.6; margin:0 0 14px; font-size:.95rem; }
    label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
    input[type=password] { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(0,0,0,0.35); color:var(--text); font-size:1rem; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
    .hint { font-size:.82rem; color:var(--sub); margin-top:6px; }
    .msg { margin-top:14px; padding:12px 14px; border-radius:12px; font-size:.92rem; line-height:1.5; display:none; }
    .msg.err { display:block; background:rgba(255,82,82,0.1); border:1px solid rgba(255,138,128,0.5); color:var(--err); }
    .msg.ok  { display:block; background:rgba(113,255,0,0.08); border:1px solid rgba(113,255,0,0.4); color:var(--ok); }
    button { width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px; background:linear-gradient(135deg,#71ff00,#4fc800); color:#061006; font-weight:800; font-size:1rem; cursor:pointer; min-height:48px; }
    button[disabled] { opacity:.6; cursor:progress; }
    a { color:var(--brand); }
    .row { margin-top:16px; font-size:.9rem; text-align:center; }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  </style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p id="intro">This link works once and expires 25 minutes after it was sent.</p>

  <form id="resetForm" novalidate>
    <label for="pw1">New password</label>
    <input id="pw1" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="pwHint formMsg">
    <div id="pwHint" class="hint">At least 8 characters, with at least one letter and one number.</div>

    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="formMsg">

    <button id="submitBtn" type="submit">Change password</button>
    <div id="formMsg" class="msg" role="alert" aria-live="assertive"></div>
  </form>

  <div class="row"><a href="login.html">Back to sign in</a></div>
</main>

<script type="module" src="firebase.js"></script>
<script>
(function () {
  'use strict';
  /* Read the token once, then take it out of the address bar and history so it is not left
     behind in the browser, a screenshot or a shared screen. */
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var form = document.getElementById('resetForm');
  var msg = document.getElementById('formMsg');
  var btn = document.getElementById('submitBtn');
  var pw1 = document.getElementById('pw1');
  var pw2 = document.getElementById('pw2');

  function show(kind, html, field) {
    msg.className = 'msg ' + kind;
    msg.innerHTML = html;
    [pw1, pw2].forEach(function (el) { el.removeAttribute('aria-invalid'); });
    if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
  }
  var REQUEST_NEW = ' <a href="login.html#forgot">Request a new link</a>.';

  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
    form.style.display = 'none';
    document.getElementById('intro').textContent = 'This reset link is invalid or incomplete.';
    show('err', 'Open the link from your most recent SOKONI reset email, or' + REQUEST_NEW);
    return;
  }

  function problem(p) {
    if (p.length < 8) return 'Use at least 8 characters.';
    if (p.length > 128) return 'Use at most 128 characters.';
    if (!/[A-Za-z]/.test(p) || !/[0-9]/.test(p)) return 'Use at least one letter and one number.';
    return null;
  }

  function callable(name) {
    return new Promise(function (resolve, reject) {
      var tries = 0;
      (function wait() {
        if (typeof window.sokoniCallable === 'function') return resolve(window.sokoniCallable(name));
        if (++tries > 50) return reject(Object.assign(new Error('not ready'), { code: 'unavailable' }));
        setTimeout(wait, 100);
      })();
    });
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var a = pw1.value, b = pw2.value;
    var p = problem(a);
    if (p) { show('err', p, pw1); return; }
    if (a !== b) { show('err', 'The two passwords do not match.', pw2); return; }
    btn.disabled = true; btn.textContent = 'Changing…';
    callable('authCompletePasswordReset')
      .then(function (fn) { return fn({ token: token, newPassword: a }); })
      .then(function () {
        token = ''; pw1.value = ''; pw2.value = '';
        form.style.display = 'none';
        document.getElementById('intro').textContent = 'Your password has been changed.';
        show('ok', 'Your other sessions were signed out. <a href="login.html">Sign in with your new password</a>.');
        try { if (window.firebaseAuth && window.firebaseAuth.currentUser) window.firebaseAuth.signOut(); } catch (e) {}
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Change password';
        var code = String((e && e.code) || '').replace(/^functions\//, '');
        if (code === 'failed-precondition') {
          form.style.display = 'none';
          document.getElementById('intro').textContent = 'This reset link is invalid or has expired.';
          show('err', 'Reset links work once and expire 25 minutes after they are sent.' + REQUEST_NEW);
        } else if (code === 'invalid-argument') {
          show('err', (e && e.message) ? String(e.message).replace(/[<>&]/g, '') : 'Choose a stronger password.', pw1);
        } else if (code === 'resource-exhausted') {
          show('err', 'Too many attempts. Please wait a few minutes and try again.');
        } else {
          show('err', 'We could not change your password right now. Check your connection and try again. Your link still works until it expires.');
        }
      });
  });
})();
</script>
<script src="sw-register.js" defer></script>
</body>
</html>
