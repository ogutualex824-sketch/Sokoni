<!DOCTYPE html>
<!-- ENTRY POINT ONLY. The verification reviewer that used to live in this file
     (921 lines, its own Firebase app "sokoni-va", the reviewer's identity taken
     from localStorage, and an approval whose badge write the served rules refuse
     for any applicant who had not created their own record) was replaced by the
     ONE shared reviewer, sokoni-verification-review.js, mounted on the canonical
     admin workspace:

         admin-os.html#applications/verification

     This page keeps its registered route (/verification-admin, sokoni-admin-nav.js,
     sokoni-permissions.js) so every old bookmark and link still lands on a
     reviewer — the canonical one. Nothing is reviewed here. -->
<html data-admin-guard="admin" lang="en" data-no-header="true">
<head>
<script src="/sokoni-admin-guard.js"></script>
<script src="/sokoni-admin-nav.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Verification — moved to AdminOS</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#71ff00">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <!-- The canonical route, in three ways: an immediate script redirect, a meta
       refresh for a page with scripting blocked, and a plain link for everyone. -->
  <meta http-equiv="refresh" content="0; url=admin-os.html#applications/verification">
  <script>
    (function () {
      try { location.replace('admin-os.html#applications/verification'); } catch (_) {}
    })();
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#060a06;color:rgba(255,255,255,.9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:520px;width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px}
    h1{font-size:18px;margin-bottom:8px}
    p{font-size:13.5px;color:rgba(255,255,255,.6);line-height:1.5;margin-bottom:14px}
    a.go{display:inline-block;padding:10px 16px;border-radius:10px;background:#71ff00;color:#000;font-weight:800;text-decoration:none}
    a.go:focus-visible{outline:2px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="h">
    <h1 id="h">Verification requests have moved</h1>
    <p>They are reviewed in the AdminOS workspace under <strong>Applications &amp; Verification → Verification requests</strong>. Taking you there now.</p>
    <a class="go" href="admin-os.html#applications/verification">Open the verification reviewer &rarr;</a>
  </main>
  <script src="/sw-register.js" defer></script>
</body>
</html>
