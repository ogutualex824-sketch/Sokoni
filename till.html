<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOKONI Till</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════
  SOKONI TILL  —  /till
  ══════════════════════════════════════════════════════════════════════════════
  A lightweight POS shell. It exists because /pos loads 69 scripts and ~1.9 MB
  before it knows who the merchant is, and that boot has repeatedly failed on a
  real iPhone while every individual layer underneath it measured healthy.

  IT REBUILDS NOTHING. Every part that already works is reused as-is:

    · SokoniMerchantSell   the certified till — search, cart, cash tendering,
                           automatic change, M-Pesa, fulfilment, receipt,
                           auto-print, idempotent sale (24/24 in-shell)
    · SokoniPosContext     server-resolved business / branch / device (13/0)
    · SokoniCash           the cash authority — this screen owns no arithmetic
    · SokoniReceiptDoc     the one receipt renderer
    · posCompleteCheckout  the existing sale callable, untouched

  What is NEW here is only the BOOT: seven scripts instead of sixty-nine,
  identity established BEFORE anything heavy loads, and nothing that can redirect
  a merchant into business registration.

  ORDER OF OPERATIONS
      paint a usable frame  ->  auth  ->  server-resolved scope  ->  mount the till

  Nothing blocks the first paint. If identity cannot be resolved the screen SAYS
  so instead of going white — the failure mode that started all of this.
  ══════════════════════════════════════════════════════════════════════════════
-->
<style>
  :root {
    color-scheme: dark;
    --bg:#07090c; --panel:#0d1218; --line:rgba(255,255,255,.10);
    --txt:#e8f2ff; --txt2:#8aa0b8; --acc:#71ff00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; overflow:hidden;      /* the shell never scrolls */
  }
  header {
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header .t { flex:1; min-width:0; }
  header .n { font-weight:800; font-size:15px; letter-spacing:.01em; }
  header .s { font-size:11.5px; color:var(--txt2); }
  header a { color:var(--txt2); text-decoration:none; font-size:12px; padding:8px; }
  /* THE SCROLL OWNER. One element scrolls; the shell does not. This is what keeps
     the till's own charge bar pinned instead of pushed below the fold. */
  #till { flex:1 1 auto; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
  #boot {
    flex:1 1 auto; min-height:0; overflow:auto;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:28px 20px; color:var(--txt2);
  }
  #boot .box { max-width:340px; }
  #boot .hd { color:var(--txt); font-weight:700; font-size:16px; margin-bottom:8px; }
  #boot .sp {
    width:22px; height:22px; margin:0 auto 14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.15); border-top-color:var(--acc);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .sp { animation:none; } }
  #boot a.btn {
    display:inline-block; margin-top:14px; padding:12px 18px; border-radius:11px;
    background:rgba(113,255,0,.12); border:1px solid rgba(113,255,0,.35);
    color:var(--acc); font-weight:700; text-decoration:none; font-size:14px;
  }
</style>
</head>
<body>

<header>
  <div class="t">
    <div class="n" id="h-name">SOKONI Till</div>
    <div class="s" id="h-sub">starting…</div>
  </div>
  <a href="/merchant-v2" id="h-back">Merchant</a>
</header>

<div id="till">
  <div id="boot">
    <div class="box">
      <div class="sp"></div>
      <div class="hd">Opening your till</div>
      <div id="boot-msg">Checking who you are…</div>
    </div>
  </div>
</div>

<!-- Seven scripts. Firebase is a MODULE, as it is in the real document. -->
<script type="module" src="firebase.js"></script>
<script src="sokoni-cash.js" defer></script>
<script src="sokoni-receipt-id.js" defer></script>
<script src="sokoni-receipt.js" defer></script>
<script src="sokoni-merchant-data.js" defer></script>
<script src="sokoni-merchant-sell.js" defer></script>
<script src="sokoni-pos-context.js" defer></script>

<script>
(function () {
  'use strict';

  var boot = document.getElementById('boot');
  var msg  = document.getElementById('boot-msg');
  var host = document.getElementById('till');

  function stage(n) { try { if (window.sokoniStage) window.sokoniStage('till:' + n); } catch (_) {} }

  /* Never a white screen: every terminal state SAYS something. */
  function show(title, body, linkLabel, linkHref) {
    boot.innerHTML = '';
    var b = document.createElement('div'); b.className = 'box';
    var h = document.createElement('div'); h.className = 'hd'; h.textContent = title;
    var p = document.createElement('div'); p.textContent = body || '';
    b.appendChild(h); b.appendChild(p);
    if (linkLabel && linkHref) {
      var a = document.createElement('a'); a.className = 'btn';
      a.href = linkHref; a.textContent = linkLabel; b.appendChild(a);
    }
    boot.appendChild(b);
    boot.style.display = 'flex';
  }

  function sub(t) { var e = document.getElementById('h-sub'); if (e) e.textContent = t; }

  /* ── READ THE UID FROM EVERY PLACE IT CAN LIVE ───────────────────────────
     firebase.js sets __sokoniCurrentUid inside the auth-state handler, but
     publishes `sokoniAuthReady` LATER, from a profile-loading path. So the till
     could time out while the uid was sitting in a different global — and then
     tell an already-signed-in merchant to sign in, which sent them round the
     loop reported from the phone.

     Checked in order of authority: the live SDK user first, then the values
     firebase.js published, then the cached profile. localStorage is used only
     to detect that a session EXISTS — never as the uid itself unless it carries
     one. */
  function readUid() {
    try { if (window.firebaseAuth && window.firebaseAuth.currentUser)
            return window.firebaseAuth.currentUser.uid; } catch (_) {}
    try { if (window.__sokoniCurrentUid) return window.__sokoniCurrentUid; } catch (_) {}
    try { if (window.__sokoniAuthReadyDetail && window.__sokoniAuthReadyDetail.uid)
            return window.__sokoniAuthReadyDetail.uid; } catch (_) {}
    try {
      var u = JSON.parse(localStorage.getItem('sokoniUser') || 'null');
      if (u && u.uid) return u.uid;
    } catch (_) {}
    return null;
  }

  /* Does a session appear to exist, even if the uid has not surfaced yet? */
  function sessionLooksPresent() {
    try {
      if (localStorage.getItem('loggedIn') === 'true') return true;
      if (JSON.parse(localStorage.getItem('sokoniUser') || 'null')) return true;
    } catch (_) {}
    return false;
  }

  /* Bounded wait — but it keeps LOOKING while it waits, rather than checking
     once at the start and once at the deadline. */
  function whenAuth() {
    return new Promise(function (res) {
      var done = false, timer = null, poll = null;
      var finish = function (u) {
        if (done) return; done = true;
        clearTimeout(timer); clearInterval(poll);
        res(u || null);
      };
      var look = function () { var u = readUid(); if (u) finish(u); };
      look();
      if (done) return;
      try {
        if (window.__sokoniAuthReadyPromise && window.__sokoniAuthReadyPromise.then) {
          window.__sokoniAuthReadyPromise.then(look).catch(function () {});
        }
        document.addEventListener('sokoniAuthReady', look, { once: true });
      } catch (_) {}
      poll  = setInterval(look, 250);
      timer = setTimeout(function () { finish(readUid()); }, 15000);
    });
  }

  /* SokoniPosContext is certified against a compat-shaped db; the app uses the
     modular SDK. The adapter bends, not the proven module. */
  function compatDb(fs, db) {
    var rows = function (s) {
      return { docs: s.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }) };
    };
    return { collection: function (n) { return {
      where: function (f, op, v) { return { get: function () {
        return fs.getDocs(fs.query(fs.collection(db, n), fs.where(f, op, v))).then(rows); } }; },
      doc: function (id) { return { get: function () {
        return fs.getDoc(fs.doc(db, n, id)).then(function (d) {
          return { exists: d.exists(), data: function () { return d.data(); } }; }); } }; }
    }; } };
  }

  function waitFor(name, ms) {
    return new Promise(function (res) {
      var t0 = Date.now();
      (function poll() {
        if (window[name]) return res(window[name]);
        if (Date.now() - t0 > (ms || 8000)) return res(null);
        setTimeout(poll, 60);
      })();
    });
  }

  async function run() {
    stage('begin');
    msg.textContent = 'Checking who you are…';
    var uid = await whenAuth();
    stage('auth:' + (uid ? 'yes' : 'no'));

    if (!uid) {
      /* A session that exists but has not surfaced a uid must NEVER be sent back
         to the login page — that is the loop reported from the phone: sign in,
         return, be told to sign in again. Offer a retry instead, and say plainly
         which of the two situations this is. */
      if (sessionLooksPresent()) {
        return show('Finishing sign-in',
          'You are signed in to SOKONI, but this till could not confirm it yet. ' +
          'This is usually a slow connection.', 'Try again', location.pathname + location.search);
      }
      return show('Please sign in',
        'Sign in to SOKONI to open your till.', 'Sign in',
        '/login?next=' + encodeURIComponent(location.pathname + location.search));
    }

    msg.textContent = 'Finding your shop…';
    stage('context:start');

    var CTX = await waitFor('SokoniPosContext', 8000);
    if (!CTX) return show('Could not start', 'The till could not load one of its parts. Reload to try again.');

    var fs, db, ctxResult;
    try {
      fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      db = window.firebaseDB || fs.getFirestore();
      ctxResult = await CTX.resolve({ db: compatDb(fs, db), uid: uid });
    } catch (e) {
      stage('context:failed');
      return show('Could not reach SOKONI',
        'Your till could not check your shop. Check the connection and reload.');
    }
    stage('context:' + (ctxResult && ctxResult.decision));

    if (!ctxResult || !ctxResult.ok) {
      return show('Could not open the till', 'SOKONI could not confirm your account.');
    }
    if (ctxResult.decision === 'no-owned-business') {
      return show('No shop on this account',
        'This account is not the owner of a shop yet. If you are an employee, shop access is being rolled out.');
    }
    if (ctxResult.decision === 'device-suspended') {
      return show('This device is suspended',
        'Selling is disabled on this device. An owner or manager can re-enable it.');
    }
    if (ctxResult.decision === 'paired-elsewhere') {
      return show('This device belongs to another business',
        'Ask an owner to release it before using it here.');
    }

    var biz = (ctxResult.businesses && ctxResult.businesses[0]) || null;
    document.getElementById('h-name').textContent = (biz && biz.name) || 'SOKONI Till';
    sub(ctxResult.decision === 'open-pos' ? 'Ready to sell' : 'This device is not paired yet');

    /* Selling does not wait for device pairing — pairing governs DEVICE
       management, and a merchant who owns the shop can still sell. The header
       says which state they are in rather than blocking the till. */
    msg.textContent = 'Loading your products…';
    stage('sell:waiting');
    var SELL = await waitFor('SokoniMerchantSell', 8000);
    var MD   = await waitFor('SokoniMerchantData', 8000);
    if (!SELL || !MD) {
      return show('Could not start selling',
        'The till module did not load. Reload to try again.');
    }

    /* ── THE SHOP ID FOR PRODUCTS IS NOT THE BUSINESS ID ──────────────────
       Measured: every product carries `shopId` = the OWNER'S UID
       (103 of 108 in production), and `shops` is keyed by uid too. The business
       id (SOK-…) keys `businesses`, `branches` and `posDevices` — a different
       axis entirely.

       The first version of this shell passed selected.merchantId as the scope,
       so productQuery asked `where shopId == 'SOK-…'` and matched NOTHING. The
       till opened and looked broken, when it was asking the right question about
       the wrong shop.

       The scope is now built by SokoniMerchantData.resolveScope — the same
       authority Sell and Inventory use — so this screen cannot drift from them.
       It also rejects placeholder ids like 'main', which is what previously made
       a correctly-provisioned merchant look like a broken account. */
    var scope = null;
    try {
      scope = MD.resolveScope ? MD.resolveScope({ uid: uid, activeShopId: uid, source: 'till' })
                              : { ok: true, sellerUid: uid, shopId: uid };
    } catch (_) { scope = { ok: true, sellerUid: uid, shopId: uid }; }

    if (!scope || !scope.ok) {
      stage('scope:' + ((scope && scope.reason) || 'unknown'));
      return show('Could not open your shop',
        'SOKONI could not resolve which shop this till belongs to (' +
        ((scope && scope.reason) || 'unknown') + ').');
    }
    stage('scope:ok');

    stage('sell:mount');
    boot.style.display = 'none';
    try {
      SELL.mount(host, {
        scope: scope,
        db: db,
        shopName: (biz && biz.name) || 'My shop',
        origin: location.origin,
        servedBy: null,
        callSale: (window.sokoniCallable ? window.sokoniCallable('posCompleteCheckout') : null),
        onToast: function (t) { sub(String(t || '')); },
        onPrint: function () { return Promise.resolve(); }
      });
      stage('sell:mounted');
    } catch (e) {
      boot.style.display = 'flex';
      show('The till could not open', String((e && e.message) || e));
      stage('sell:failed');
    }
  }

  /* ── ?diag=till — every boundary, on screen ──────────────────────────────
     Opt-in. Reports AUTH · BUSINESS · BRANCH · DEVICE · SCOPE · PRODUCT QUERY ·
     PRODUCT COUNT · the exact Firestore error, so a product failure is never
     again diagnosed by guessing which of seven things went wrong. It runs the
     SAME query the till runs — listProducts through the same scope — rather
     than a lookalike. */
  async function diag() {
    var L = [], t0 = Date.now();
    var line = function (k, v) { L.push(k.padEnd(16) + (v == null ? '—' : String(v))); };
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483646;overflow:auto;' +
      'white-space:pre-wrap;word-break:break-word;background:#04121a;color:#8fe;' +
      'font:12px/1.5 ui-monospace,Menlo,monospace;padding:14px';
    box.textContent = 'TILL DIAGNOSTIC — running…';
    box.addEventListener('click', function () { box.remove(); });
    document.documentElement.appendChild(box);

    var uid = await whenAuth();
    line('AUTH', uid ? 'OK  ' + String(uid).slice(0, 12) + '…' : (sessionLooksPresent() ? 'SESSION PRESENT but uid unresolved' : 'NO SESSION'));
    try {
      line('UID SOURCES', 'sdk=' + !!(window.firebaseAuth && window.firebaseAuth.currentUser) +
        '  currentUid=' + !!window.__sokoniCurrentUid +
        '  readyDetail=' + !!(window.__sokoniAuthReadyDetail && window.__sokoniAuthReadyDetail.uid) +
        '  cached=' + !!(JSON.parse(localStorage.getItem('sokoniUser')||'null')||{}).uid);
      line('AUTH READY', String(!!window.__sokoniAuthReady));
    } catch (_) {}
    if (!uid) { box.textContent = L.join('\n'); return; }

    var CTX = await waitFor('SokoniPosContext', 8000);
    var MD  = await waitFor('SokoniMerchantData', 8000);
    line('MODULES', 'context=' + !!CTX + '  data=' + !!MD);
    if (!CTX || !MD) { box.textContent = L.join('\n'); return; }

    var fs, db, r;
    try {
      fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      db = window.firebaseDB || fs.getFirestore();
      r = await CTX.resolve({ db: compatDb(fs, db), uid: uid });
    } catch (e) { line('CONTEXT', 'FAILED  ' + ((e && e.message) || e)); box.textContent = L.join('\n'); return; }

    line('DECISION', r && r.decision);
    line('BUSINESS', r && r.businesses && r.businesses.length
      ? r.businesses.map(function (b) { return b.id; }).join(', ') : 'NONE');
    line('BRANCH', r && r.branches && r.branches.length
      ? r.branches.map(function (b) { return b.id; }).join(', ') : 'none');
    line('DEVICE', r && r.device
      ? (r.device.registered ? 'registered  ' + (r.device.branchId || '') : 'not registered — ' + r.device.reason)
      : '—');

    var scope = null;
    try { scope = MD.resolveScope({ uid: uid, activeShopId: uid, source: 'diag' }); } catch (e) {}
    line('SCOPE', scope && scope.ok ? 'ok  shopId=' + String(scope.shopId).slice(0, 14) + '…'
                                    : 'FAILED  ' + ((scope && scope.reason) || 'unknown'));
    if (!scope || !scope.ok) { box.textContent = L.join('\n'); return; }

    /* the real query, through the real authority */
    var mdb = {
      queryProducts: function (spec) {
        var parts = (spec.where || []).map(function (w) { return fs.where(w[0], w[1], w[2]); });
        return fs.getDocs(fs.query.apply(null, [fs.collection(db, spec.collection)].concat(parts)))
          .then(function (s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); });
      }
    };
    try {
      var rows = await MD.listProducts({ scope: scope, db: mdb });
      line('PRODUCT QUERY', 'OK');
      line('PRODUCT COUNT', rows.length + (rows.length === 0 ? '   <-- query succeeded but matched nothing' : ''));
      if (rows.length) line('FIRST PRODUCT', (rows[0].name || '(no name)') + '  price=' + rows[0].price);
    } catch (e) {
      line('PRODUCT QUERY', 'FAILED');
      line('FIRESTORE ERROR', (e && (e.code || e.message)) || String(e));
    }
    line('ELAPSED', (Date.now() - t0) + ' ms');
    L.push('');
    L.push('(tap to close)');
    box.textContent = L.join('\n');
    try { navigator.clipboard && navigator.clipboard.writeText(L.join('\n')); } catch (_) {}
  }

  var WANT = /[?&]diag=till\b/.test(location.search);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(WANT ? diag : run, 50); });
  } else { setTimeout(WANT ? diag : run, 50); }
}());
</script>
</body>
</html>
