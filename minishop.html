  <style>
    /* ===================================================
       SOKONI MINISHOP — Premium Public Storefront
       Mobile-first, light theme, standalone SPA shell
       =================================================== */

    /* ---------- CSS Custom Properties ---------- */
    :root {
      --ms-accent:   #00bcd4;
      --ms-accent2:  #7c4dff;
      --ms-bg:       #f8f9fa;
      --ms-card:     #ffffff;
      --ms-text:     #1a1a2e;
      --ms-muted:    #666666;
      --ms-border:   #e8e8e8;
      --ms-radius:   12px;
      --ms-shadow:   0 2px 12px rgba(0,0,0,0.08);
      --ms-shadow-lg:0 8px 32px rgba(0,0,0,0.12);
      --ms-font:     system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --ms-transition: 0.18s ease;
    }

    /* ---------- Theme Overrides (set by JS on <body>) ---------- */
    body.theme-coral   { --ms-accent: #ff6b6b; }
    body.theme-green   { --ms-accent: #4caf50; }
    body.theme-purple  { --ms-accent: #9c27b0; }
    body.theme-orange  { --ms-accent: #ff9800; }
    body.theme-pink    { --ms-accent: #e91e63; }
    body.theme-teal    { --ms-accent: #009688; }
    body.theme-indigo  { --ms-accent: #3f51b5; }
    body.theme-gold    { --ms-accent: #ffc107; }
    body.theme-red     { --ms-accent: #f44336; }
    /* [data-theme] attribute alternative — JS sets inline var */
    [data-theme] { --ms-accent: var(--ms-theme-color, #00bcd4); }

    /* ---------- Reset ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--ms-font);
      background: var(--ms-bg);
      color: var(--ms-text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      /* Prevent horizontal overflow on mobile */
      overflow-x: hidden;
    }

    /* ---------- Utility ---------- */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    img { max-width: 100%; height: auto; display: block; }

    button {
      font-family: var(--ms-font);
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ---------- Announcement Banner ---------- */
    #ms-announcement {
      background: var(--ms-accent);
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      line-height: 1.4;
      position: relative;
      z-index: 20;
    }

    /* ---------- Loading Skeleton ---------- */
    .ms-loading-skeleton {
      background: var(--ms-bg);
    }

    @keyframes ms-shimmer {
      0%   { background-position: -468px 0; }
      100% { background-position: 468px 0; }
    }

    .ms-skeleton-block {
      background: linear-gradient(
        90deg,
        #e8e8e8 25%,
        #f5f5f5 50%,
        #e8e8e8 75%
      );
      background-size: 936px 100%;
      animation: ms-shimmer 1.4s linear infinite;
      border-radius: var(--ms-radius);
    }

    .ms-cover-skeleton {
      height: 260px;
      width: 100%;
      border-radius: 0;
    }

    .ms-cover-skeleton.ms-skeleton-block { border-radius: 0; }

    .ms-header-skeleton {
      background: #fff;
      padding: 56px 20px 20px;
    }

    .ms-header-skeleton .ms-sk-name {
      height: 28px;
      width: 55%;
      margin-bottom: 12px;
    }

    .ms-header-skeleton .ms-sk-tagline {
      height: 16px;
      width: 70%;
      margin-bottom: 20px;
    }

    .ms-header-skeleton .ms-sk-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ms-header-skeleton .ms-sk-chip {
      height: 24px;
      width: 80px;
      border-radius: 20px;
    }

    .ms-grid-skeleton {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .ms-grid-skeleton .ms-sk-card {
      height: 220px;
      border-radius: var(--ms-radius);
    }

    /* ---------- Cover / Hero ---------- */
    .ms-cover {
      position: relative;
      height: 260px;
      background: linear-gradient(135deg, var(--ms-accent) 0%, var(--ms-accent2) 100%);
      background-size: cover;
      background-position: center;
      overflow: visible;
    }

    .ms-cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0,0,0,0.35) 100%
      );
      pointer-events: none;
    }

    .ms-avatar {
      position: absolute;
      bottom: -40px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
      background: #fff;
      box-shadow: var(--ms-shadow);
      z-index: 5;
    }

    /* ---------- Shop Header Card ---------- */
    .ms-shop-header {
      background: var(--ms-card);
      padding: 52px 20px 16px;
      border-bottom: 1px solid var(--ms-border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .ms-shop-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .ms-shop-name-row h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ms-text);
      line-height: 1.2;
      flex: 1 1 auto;
    }

    .ms-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #e0f7fa;
      color: #00838f;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ms-follow-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 2px solid var(--ms-accent);
      color: var(--ms-accent);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 13px;
      font-weight: 700;
      transition: background var(--ms-transition), color var(--ms-transition);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ms-follow-btn:hover,
    .ms-follow-btn.following {
      background: var(--ms-accent);
      color: #fff;
    }

    .ms-follow-count {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.75;
    }

    .ms-tagline {
      color: var(--ms-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    /* ---------- Meta Row ---------- */
    .ms-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--ms-muted);
      margin-bottom: 12px;
    }

    .ms-meta-row > span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ms-stars {
      color: #f59e0b;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .ms-review-count {
      color: var(--ms-muted);
      font-size: 12px;
    }

    .ms-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: #9e9e9e;
    }

    .ms-status-dot.open  { background: #4caf50; }
    .ms-status-dot.closed { background: #9e9e9e; }

    /* ---------- Share Bar ---------- */
    .ms-share-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 4px;
    }

    .ms-share-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--ms-border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ms-text);
      transition: border-color var(--ms-transition), background var(--ms-transition);
      background: var(--ms-card);
    }

    .ms-share-btn:hover {
      border-color: var(--ms-accent);
      background: #f0f9fb;
    }

    .ms-share-btn.whatsapp:hover { border-color: #25d366; background: #f0fff4; }
    .ms-share-btn.facebook:hover { border-color: #1877f2; background: #f0f6ff; }
    .ms-share-btn.twitter:hover  { border-color: #1da1f2; background: #f0f8ff; }
    .ms-share-btn.copy:hover     { border-color: var(--ms-accent); }

    /* ---------- Tabs ---------- */
    .ms-tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--ms-card);
      display: flex;
      border-bottom: 2px solid var(--ms-border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .ms-tabs::-webkit-scrollbar { display: none; }

    .ms-tab {
      flex: 0 0 auto;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ms-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color var(--ms-transition), border-color var(--ms-transition);
      white-space: nowrap;
    }

    .ms-tab:hover {
      color: var(--ms-accent);
    }

    .ms-tab.active {
      color: var(--ms-accent);
      border-bottom-color: var(--ms-accent);
    }

    /* ---------- Tab Content Panels ---------- */
    .ms-tab-content {
      padding: 16px;
      min-height: 200px;
    }

    /* ---------- Product Grid ---------- */
    .ms-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    /* ---------- Product Card ---------- */
    .ms-product-card {
      background: var(--ms-card);
      border-radius: var(--ms-radius);
      overflow: hidden;
      box-shadow: var(--ms-shadow);
      transition: transform var(--ms-transition), box-shadow var(--ms-transition);
      cursor: pointer;
      position: relative;
    }

    .ms-product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--ms-shadow-lg);
    }

    .ms-product-card:active {
      transform: translateY(0);
    }

    .ms-product-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%; /* square */
      background: #f5f5f5;
      overflow: hidden;
    }

    .ms-product-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .ms-product-card:hover .ms-product-img-wrap img {
      transform: scale(1.04);
    }

    .ms-product-img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #ccc;
    }

    .ms-product-body {
      padding: 10px 12px 12px;
    }

    .ms-product-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ms-text);
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ms-product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--ms-accent);
      margin-bottom: 8px;
    }

    .ms-product-price .ms-price-was {
      font-size: 11px;
      color: var(--ms-muted);
      text-decoration: line-through;
      font-weight: 400;
      margin-left: 4px;
    }

    .ms-add-btn {
      width: 100%;
      background: var(--ms-accent);
      color: #fff;
      border-radius: 8px;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 700;
      transition: opacity var(--ms-transition), transform var(--ms-transition);
    }

    .ms-add-btn:hover  { opacity: 0.9; }
    .ms-add-btn:active { transform: scale(0.97); }
    .ms-add-btn:disabled {
      background: #ccc;
      cursor: default;
    }

    /* ---------- Badge Chips ---------- */
    .ms-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .ms-badge.new      { background: var(--ms-accent); color: #fff; }
    .ms-badge.sale     { background: #ff5722; color: #fff; }
    .ms-badge.popular  { background: #7c4dff; color: #fff; }
    .ms-badge.sold-out { background: rgba(0,0,0,0.55); color: #fff; }

    /* ---------- Services Panel ---------- */
    .ms-service-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ms-service-card {
      background: var(--ms-card);
      border-radius: var(--ms-radius);
      box-shadow: var(--ms-shadow);
      padding: 14px 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      cursor: pointer;
      transition: box-shadow var(--ms-transition);
    }

    .ms-service-card:hover {
      box-shadow: var(--ms-shadow-lg);
    }

    .ms-service-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #f0f9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .ms-service-body { flex: 1; min-width: 0; }

    .ms-service-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ms-text);
      margin-bottom: 3px;
    }

    .ms-service-desc {
      font-size: 12px;
      color: var(--ms-muted);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .ms-service-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--ms-accent);
    }

    .ms-service-book {
      flex-shrink: 0;
      align-self: center;
      border: 2px solid var(--ms-accent);
      color: var(--ms-accent);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      transition: background var(--ms-transition), color var(--ms-transition);
    }

    .ms-service-book:hover {
      background: var(--ms-accent);
      color: #fff;
    }

    /* ---------- About Section ---------- */
    .ms-about-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .ms-about-card {
      background: var(--ms-card);
      border-radius: var(--ms-radius);
      box-shadow: var(--ms-shadow);
      padding: 16px;
    }

    .ms-about-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--ms-text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ms-about-description {
      font-size: 14px;
      color: var(--ms-muted);
      line-height: 1.6;
    }

    /* Business hours table */
    .ms-hours-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .ms-hours-table tr {
      border-bottom: 1px solid var(--ms-border);
    }

    .ms-hours-table tr:last-child { border-bottom: none; }

    .ms-hours-table td {
      padding: 7px 0;
      color: var(--ms-muted);
    }

    .ms-hours-table td:first-child {
      font-weight: 600;
      color: var(--ms-text);
      width: 50%;
    }

    .ms-hours-today td {
      color: var(--ms-accent) !important;
      font-weight: 700 !important;
    }

    /* Social links */
    .ms-social-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ms-social-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--ms-border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ms-muted);
      transition: border-color var(--ms-transition), color var(--ms-transition);
    }

    .ms-social-link:hover {
      border-color: var(--ms-accent);
      color: var(--ms-accent);
    }

    /* Payment methods */
    .ms-payment-methods {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ms-payment-chip {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ms-text);
    }

    /* Policies */
    .ms-policy-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ms-border);
      font-size: 13px;
      color: var(--ms-muted);
    }

    .ms-policy-row:last-child { border-bottom: none; }

    .ms-policy-icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ---------- Reviews Panel ---------- */
    .ms-review-summary {
      background: var(--ms-card);
      border-radius: var(--ms-radius);
      box-shadow: var(--ms-shadow);
      padding: 16px;
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
    }

    .ms-review-score {
      text-align: center;
      flex-shrink: 0;
    }

    .ms-review-score .ms-score-num {
      font-size: 40px;
      font-weight: 900;
      color: var(--ms-text);
      line-height: 1;
    }

    .ms-review-score .ms-score-stars {
      color: #f59e0b;
      font-size: 14px;
      margin: 4px 0;
    }

    .ms-review-score .ms-score-count {
      font-size: 12px;
      color: var(--ms-muted);
    }

    .ms-rating-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ms-rating-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ms-muted);
    }

    .ms-rating-bar-row .ms-bar-label { width: 20px; text-align: right; flex-shrink: 0; }

    .ms-rating-bar-track {
      flex: 1;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .ms-rating-bar-fill {
      height: 100%;
      background: #f59e0b;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .ms-review-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ms-review-item {
      background: var(--ms-card);
      border-radius: var(--ms-radius);
      box-shadow: var(--ms-shadow);
      padding: 14px 16px;
    }

    .ms-review-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .ms-reviewer-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--ms-accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .ms-reviewer-info { flex: 1; min-width: 0; }

    .ms-reviewer-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--ms-text);
    }

    .ms-reviewer-date {
      font-size: 11px;
      color: var(--ms-muted);
    }

    .ms-review-stars {
      color: #f59e0b;
      font-size: 12px;
    }

    .ms-review-text {
      font-size: 13px;
      color: var(--ms-muted);
      line-height: 1.5;
    }

    .ms-review-images {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .ms-review-images img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ---------- Sticky CTA Bar (mobile) ---------- */
    .ms-cta-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ms-card);
      border-top: 1px solid var(--ms-border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }

    .ms-cta-bar button {
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid var(--ms-border);
      color: var(--ms-text);
      background: var(--ms-card);
      transition: border-color var(--ms-transition), background var(--ms-transition), color var(--ms-transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .ms-cta-bar button:hover {
      border-color: var(--ms-accent);
      color: var(--ms-accent);
    }

    .ms-cta-bar .ms-primary {
      background: var(--ms-accent);
      border-color: var(--ms-accent);
      color: #fff;
    }

    .ms-cta-bar .ms-primary:hover {
      opacity: 0.9;
      color: #fff;
    }

    /* Extra bottom padding on main content to clear CTA bar */
    #ms-app {
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    /* ---------- Empty State ---------- */
    .ms-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--ms-muted);
      text-align: center;
      grid-column: 1 / -1;
    }

    .ms-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .ms-empty h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--ms-text);
      margin-bottom: 6px;
    }

    .ms-empty p {
      font-size: 13px;
      line-height: 1.5;
    }

    /* ---------- Not Found State ---------- */
    .ms-not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      padding: 40px 24px;
      text-align: center;
    }

    .ms-nf-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .ms-not-found h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--ms-text);
      margin-bottom: 8px;
    }

    .ms-not-found p {
      font-size: 15px;
      color: var(--ms-muted);
      margin-bottom: 24px;
    }

    .ms-btn-primary {
      display: inline-block;
      background: var(--ms-accent);
      color: #fff;
      border-radius: 10px;
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 700;
      transition: opacity var(--ms-transition);
    }

    .ms-btn-primary:hover { opacity: 0.88; }

    /* ---------- QR Modal ---------- */
    .ms-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      backdrop-filter: blur(4px);
    }

    .ms-modal-box {
      background: var(--ms-card);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .ms-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f5f5f5;
      color: var(--ms-muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--ms-transition);
    }

    .ms-modal-close:hover { background: #e8e8e8; }

    .ms-modal-box h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--ms-text);
      margin-bottom: 20px;
    }

    #msQrCode {
      margin: 0 auto 12px;
      width: 180px;
      height: 180px;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #msQrCode canvas,
    #msQrCode img {
      width: 100%;
      height: 100%;
    }

    .ms-qr-url {
      font-size: 11px;
      color: var(--ms-muted);
      word-break: break-all;
      margin-bottom: 16px;
    }

    .ms-modal-box > button:last-child {
      background: var(--ms-accent);
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      transition: opacity var(--ms-transition);
    }

    .ms-modal-box > button:last-child:hover { opacity: 0.88; }

    /* ---------- Cart Drawer (slide-up) ---------- */
    .ms-cart-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--ms-card);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 75vh;
      display: flex;
      flex-direction: column;
    }

    .ms-cart-drawer.open {
      transform: translateY(0);
    }

    .ms-cart-handle {
      width: 36px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    .ms-cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
      border-bottom: 1px solid var(--ms-border);
      flex-shrink: 0;
    }

    .ms-cart-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ms-text);
    }

    .ms-cart-count {
      background: var(--ms-accent);
      color: #fff;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .ms-cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .ms-cart-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--ms-border);
    }

    .ms-cart-item:last-child { border-bottom: none; }

    .ms-cart-item-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: #f5f5f5;
    }

    .ms-cart-item-info { flex: 1; min-width: 0; }

    .ms-cart-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ms-text);
      margin-bottom: 4px;
    }

    .ms-cart-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--ms-accent);
    }

    .ms-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .ms-qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--ms-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--ms-text);
      transition: border-color var(--ms-transition), background var(--ms-transition);
    }

    .ms-qty-btn:hover {
      border-color: var(--ms-accent);
      background: #f0f9fb;
    }

    .ms-qty-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--ms-text);
      min-width: 20px;
      text-align: center;
    }

    .ms-cart-footer {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
    }

    .ms-cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--ms-text);
    }

    .ms-cart-total-amount { color: var(--ms-accent); }

    .ms-checkout-btn {
      width: 100%;
      background: var(--ms-accent);
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      transition: opacity var(--ms-transition);
    }

    .ms-checkout-btn:hover { opacity: 0.9; }

    /* ---------- Cart Overlay ---------- */
    .ms-cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .ms-cart-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---------- Floating Cart Bubble ---------- */
    .ms-cart-bubble {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom));
      right: 16px;
      background: var(--ms-accent);
      color: #fff;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0,188,212,0.4);
      z-index: 90;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ms-cart-bubble:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,188,212,0.5);
    }

    .ms-cart-bubble-count {
      position: absolute;
      top: 0;
      right: 0;
      background: #ff5722;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    /* ---------- Toast Notification ---------- */
    .ms-toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1a1a2e;
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 9999;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      text-align: center;
    }

    .ms-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- Powered By Footer ---------- */
    .ms-footer {
      text-align: center;
      padding: 20px 16px 8px;
      font-size: 12px;
      color: var(--ms-muted);
      border-top: 1px solid var(--ms-border);
      margin-top: 8px;
    }

    .ms-footer a {
      color: var(--ms-accent);
      font-weight: 600;
    }

    .ms-footer a:hover { text-decoration: underline; }

    /* ---------- Section headings inside panels ---------- */
    .ms-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .ms-section-head h2 {
      font-size: 15px;
      font-weight: 800;
      color: var(--ms-text);
    }

    .ms-section-head a {
      font-size: 13px;
      color: var(--ms-accent);
      font-weight: 600;
    }

    /* ---------- Search / Filter Bar ---------- */
    .ms-search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .ms-search-input {
      flex: 1;
      border: 1.5px solid var(--ms-border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: var(--ms-font);
      color: var(--ms-text);
      background: var(--ms-card);
      outline: none;
      transition: border-color var(--ms-transition);
      appearance: none;
    }

    .ms-search-input:focus {
      border-color: var(--ms-accent);
    }

    .ms-filter-btn {
      border: 1.5px solid var(--ms-border);
      border-radius: 10px;
      padding: 9px 12px;
      background: var(--ms-card);
      color: var(--ms-muted);
      font-size: 14px;
      transition: border-color var(--ms-transition);
    }

    .ms-filter-btn:hover {
      border-color: var(--ms-accent);
      color: var(--ms-accent);
    }

    /* ---------- Sort dropdown area ---------- */
    .ms-sort-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .ms-sort-label {
      font-size: 12px;
      color: var(--ms-muted);
    }

    .ms-sort-chip {
      border: 1px solid var(--ms-border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ms-muted);
      background: var(--ms-card);
      transition: border-color var(--ms-transition), color var(--ms-transition), background var(--ms-transition);
    }

    .ms-sort-chip.active,
    .ms-sort-chip:hover {
      border-color: var(--ms-accent);
      color: var(--ms-accent);
      background: #f0f9fb;
    }

    /* ---------- Load More Button ---------- */
    .ms-load-more {
      display: block;
      width: 100%;
      border: 2px solid var(--ms-border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--ms-muted);
      background: var(--ms-card);
      margin-top: 16px;
      grid-column: 1 / -1;
      transition: border-color var(--ms-transition), color var(--ms-transition);
    }

    .ms-load-more:hover {
      border-color: var(--ms-accent);
      color: var(--ms-accent);
    }

    /* ---------- Shimmer on product image load ---------- */
    .ms-img-loading {
      background: linear-gradient(
        90deg,
        #f0f0f0 25%,
        #fafafa 50%,
        #f0f0f0 75%
      );
      background-size: 200% 100%;
      animation: ms-shimmer 1.4s linear infinite;
    }

    /* ---------- Desktop Enhancements ---------- */
    @media (min-width: 600px) {
      .ms-cover { height: 320px; }

      .ms-avatar {
        width: 100px;
        height: 100px;
        bottom: -50px;
        left: 28px;
      }

      .ms-shop-header { padding: 62px 28px 20px; }

      .ms-shop-name-row h1 { font-size: 26px; }

      .ms-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }

      .ms-grid-skeleton {
        grid-template-columns: repeat(3, 1fr);
      }

      .ms-tab { padding: 14px 28px; }
    }

    @media (min-width: 768px) {
      .ms-cta-bar { display: none; }

      /* No bottom padding needed on desktop */
      #ms-app { padding-bottom: 0; }

      /* Larger grid on tablet+ */
      .ms-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }

      .ms-tab-content { padding: 20px 24px; }

      .ms-shop-header { padding: 70px 32px 24px; }

      .ms-cover { height: 360px; }

      .ms-avatar {
        width: 110px;
        height: 110px;
        bottom: -55px;
      }

      .ms-cart-bubble { display: none; }
    }

    @media (min-width: 1024px) {
      #ms-app {
        max-width: 960px;
        margin: 0 auto;
      }

      .ms-cover {
        border-radius: 0 0 var(--ms-radius) var(--ms-radius);
      }

      .ms-product-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }

      .ms-grid-skeleton {
        grid-template-columns: repeat(4, 1fr);
        max-width: 960px;
        margin: 0 auto;
      }

      .ms-cover-skeleton,
      .ms-header-skeleton {
        max-width: 960px;
        margin: 0 auto;
      }

      #ms-announcement { font-size: 14px; }
    }
  </style>
</head>

<body>

  <!-- ===== Announcement Banner ===== -->
  <div id="ms-announcement" hidden aria-live="polite"></div>

  <!-- ===== Loading Skeleton (shown immediately, hidden on load) ===== -->
  <div id="ms-skeleton" class="ms-loading-skeleton" role="status" aria-label="Loading shop...">
    <div class="ms-cover-skeleton ms-skeleton-block"></div>
    <div class="ms-header-skeleton">
      <div class="ms-sk-name ms-skeleton-block"></div>
      <div class="ms-sk-tagline ms-skeleton-block"></div>
      <div class="ms-sk-meta">
        <div class="ms-sk-chip ms-skeleton-block"></div>
        <div class="ms-sk-chip ms-skeleton-block"></div>
        <div class="ms-sk-chip ms-skeleton-block"></div>
      </div>
    </div>
    <div class="ms-grid-skeleton">
      <div class="ms-sk-card ms-skeleton-block"></div>
      <div class="ms-sk-card ms-skeleton-block"></div>
      <div class="ms-sk-card ms-skeleton-block"></div>
      <div class="ms-sk-card ms-skeleton-block"></div>
    </div>
  </div>

  <!-- ===== Main App (hidden until JS loads shop data) ===== -->
  <div id="ms-app" hidden>

    <!-- Cover image / hero -->
    <div class="ms-cover" id="msCover" role="img" aria-label="Shop cover">
      <img
        class="ms-avatar"
        id="msLogo"
        src=""
        alt="Shop logo"
        loading="eager"
        decoding="async"
        width="80"
        height="80"
      >
      <div class="ms-cover-overlay" aria-hidden="true"></div>
    </div>

    <!-- Shop header card -->
    <div class="ms-shop-header">
      <div class="ms-shop-name-row">
        <h1 id="msShopName">Shop Name</h1>
        <span class="ms-verified-badge" id="msVerified" hidden aria-label="Verified seller">
          &#10003; Verified
        </span>
        <button
          class="ms-follow-btn"
          id="msFollowBtn"
          aria-pressed="false"
          aria-label="Follow this shop"
        >
          Follow <span class="ms-follow-count" id="msFollowCount"></span>
        </button>
      </div>

      <p id="msTagline" class="ms-tagline"></p>

      <div class="ms-meta-row" id="msMetaRow" aria-label="Shop details">
        <span id="msRating" aria-label="Rating"></span>
        <span id="msCategory" aria-label="Category"></span>
        <span id="msLocation" aria-label="Location"></span>
        <span id="msStatus" aria-label="Open or closed status"></span>
        <span id="msResponseTime" aria-label="Response time"></span>
      </div>

      <!-- Share bar -->
      <div class="ms-share-bar" id="msShareBar" aria-label="Share shop"></div>
    </div>

    <!-- Tab navigation -->
    <nav class="ms-tabs" id="msTabs" aria-label="Shop sections" role="tablist">
      <button class="ms-tab active" data-tab="products" role="tab" aria-selected="true" aria-controls="msProducts">
        Products
      </button>
      <button class="ms-tab" data-tab="services" role="tab" aria-selected="false" aria-controls="msServices">
        Services
      </button>
      <button class="ms-tab" data-tab="about" role="tab" aria-selected="false" aria-controls="msAbout">
        About
      </button>
      <button class="ms-tab" data-tab="reviews" role="tab" aria-selected="false" aria-controls="msReviews">
        Reviews
      </button>
    </nav>

    <!-- Products panel -->
    <div id="msProducts" class="ms-tab-content" role="tabpanel" aria-label="Products">
      <!-- Search & filter row -->
      <div class="ms-search-bar">
        <input
          type="search"
          class="ms-search-input"
          id="msProductSearch"
          placeholder="Search products..."
          aria-label="Search products"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="ms-filter-btn" id="msFilterBtn" aria-label="Filter and sort">
          &#9776; Filter
        </button>
      </div>

      <!-- Sort chips row -->
      <div class="ms-sort-row" id="msSortRow" aria-label="Sort products">
        <span class="ms-sort-label">Sort:</span>
        <button class="ms-sort-chip active" data-sort="default">Featured</button>
        <button class="ms-sort-chip" data-sort="price-asc">Price &#9650;</button>
        <button class="ms-sort-chip" data-sort="price-desc">Price &#9660;</button>
        <button class="ms-sort-chip" data-sort="newest">Newest</button>
        <button class="ms-sort-chip" data-sort="popular">Popular</button>
      </div>

      <!-- Product grid — rendered by JS -->
      <div class="ms-product-grid" id="msProductGrid" aria-label="Products grid">
        <!-- Injected by sokoni-minishop.js -->
      </div>
    </div>

    <!-- Services panel -->
    <div id="msServices" class="ms-tab-content" role="tabpanel" aria-label="Services" hidden>
      <div class="ms-service-list" id="msServiceList">
        <!-- Injected by sokoni-minishop.js -->
      </div>
    </div>

    <!-- About panel -->
    <div id="msAbout" class="ms-tab-content" role="tabpanel" aria-label="About" hidden>
      <div class="ms-about-section" id="msAboutSection">
        <!-- Injected by sokoni-minishop.js -->
      </div>
    </div>

    <!-- Reviews panel -->
    <div id="msReviews" class="ms-tab-content" role="tabpanel" aria-label="Reviews" hidden>
      <!-- Review summary injected by JS -->
      <div id="msReviewSummary"></div>

      <!-- Review list injected by JS -->
      <div class="ms-review-list" id="msReviewList">
        <!-- Injected by sokoni-minishop.js -->
      </div>
    </div>

    <!-- Powered by footer -->
    <footer class="ms-footer" role="contentinfo">
      Powered by <a href="https://mysokoni.co.ke" target="_blank" rel="noopener">SOKONI</a>
      &mdash; Kenya's #1 Marketplace
    </footer>

    <!-- Sticky CTA bar (mobile only) -->
    <div class="ms-cta-bar" id="msCta" role="toolbar" aria-label="Quick actions">
      <button id="msChatBtn" aria-label="Chat with seller">
        &#128172; Chat
      </button>
      <button id="msOrderBtn" class="ms-primary" aria-label="View cart and order">
        &#128717; Order
      </button>
      <button id="msCallBtn" aria-label="Call seller">
        &#128222; Call
      </button>
    </div>

  </div><!-- /#ms-app -->

  <!-- ===== Shop Not Found State ===== -->
  <div id="ms-not-found" class="ms-not-found" hidden role="main" aria-label="Shop not found">
    <div class="ms-nf-icon" aria-hidden="true">&#127978;</div>
    <h2>Shop Not Found</h2>
    <p>This MiniShop doesn&rsquo;t exist yet.<br>The seller may not have set up their storefront.</p>
    <a href="/" class="ms-btn-primary">Browse SOKONI</a>
  </div>

  <!-- ===== Floating Cart Bubble (mobile, shown when cart has items) ===== -->
  <button
    class="ms-cart-bubble"
    id="msCartBubble"
    hidden
    aria-label="View cart"
    onclick="SokoniMiniShop.openCart()"
  >
    &#128717;
    <span class="ms-cart-bubble-count" id="msCartBubbleCount" aria-live="polite"></span>
  </button>

  <!-- ===== Cart Drawer ===== -->
  <div
    class="ms-cart-overlay"
    id="msCartOverlay"
    role="button"
    aria-label="Close cart"
    tabindex="0"
    onclick="SokoniMiniShop.closeCart()"
  ></div>

  <div
    class="ms-cart-drawer"
    id="msCartDrawer"
    role="dialog"
    aria-modal="true"
    aria-label="Shopping cart"
  >
    <div class="ms-cart-handle" aria-hidden="true"></div>
    <div class="ms-cart-header">
      <span class="ms-cart-title">
        Your Cart &mdash; <span id="msCartShopName"></span>
      </span>
      <span class="ms-cart-count" id="msCartCount" aria-live="polite"></span>
    </div>
    <div class="ms-cart-body" id="msCartBody">
      <!-- Cart items injected by sokoni-minishop.js -->
    </div>
    <div class="ms-cart-footer">
      <div class="ms-cart-total">
        <span>Total</span>
        <span class="ms-cart-total-amount" id="msCartTotal">KES 0</span>
      </div>
      <button
        class="ms-checkout-btn"
        id="msCheckoutBtn"
        onclick="SokoniMiniShop.proceedToCheckout()"
      >
        Proceed to Checkout
      </button>
    </div>
  </div>

  <!-- ===== QR Code Modal ===== -->
  <div
    class="ms-modal"
    id="msQrModal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-label="Shop QR code"
  >
    <div class="ms-modal-box">
      <button
        class="ms-modal-close"
        onclick="document.getElementById('msQrModal').hidden = true"
        aria-label="Close QR modal"
      >&#10005;</button>
      <h3>Scan to Visit Shop</h3>
      <div id="msQrCode" aria-label="QR code"></div>
      <p id="msQrUrl" class="ms-qr-url"></p>
      <button onclick="SokoniMiniShop.downloadQR()">
        &#8659; Download QR
      </button>
    </div>
  </div>

  <!-- ===== Toast Notification ===== -->
  <div class="ms-toast" id="msToast" role="alert" aria-live="assertive"></div>

  <!-- ===== Firebase SDK ===== -->
  <script src="/__/firebase/init.js" defer></script>

  <!-- ===== MiniShop JS Engine ===== -->
  <script src="sokoni-minishop.js" defer></script>

  <!-- ===== Boot ===== -->
  <script>
    // Boot as early as possible — fires after DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof SokoniMiniShop !== 'undefined' && typeof SokoniMiniShop.initPublic === 'function') {
        SokoniMiniShop.initPublic();
      } else {
        // sokoni-minishop.js may load slightly after DOMContentLoaded due to defer;
        // the script itself will call initPublic() at its own tail if needed.
        document.addEventListener('sokoni-minishop-ready', function () {
          SokoniMiniShop.initPublic();
        }, { once: true });
      }
    });

    // Close cart drawer on overlay keyboard activation
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var modal = document.getElementById('msQrModal');
        if (modal && !modal.hidden) { modal.hidden = true; return; }
        if (typeof SokoniMiniShop !== 'undefined') SokoniMiniShop.closeCart();
      }
    });
  </script>

</body>
</html>
