<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOKONI device test (SW active)</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:20px 16px; background:#07090c; color:#e8f2ff;
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:19px; margin:0 0 6px; }
  .k { color:#7f93ab; font-size:12.5px; margin-bottom:16px; }
  .big { font-size:15px; font-weight:700; padding:12px; border-radius:10px;
         background:#0b1017; border:1px solid rgba(255,255,255,.12); margin-bottom:14px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0b1017;
        border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:11px;
        font-size:11.5px; color:#a9c3dd; margin:0; }
</style>
</head>
<body>
<h1>SOKONI DEVICE TEST</h1>
<div class="k">Identical page, ordinary URL &mdash; the service worker MAY serve or substitute this document.</div>
<div class="big" id="v">page rendered</div>
<pre id="d">collecting&hellip;</pre>
<script>
/* Absolutely nothing external. No Firebase, no Firestore, no POS, no splash.js,
   no shared-header.js, no security.js, no service-worker registration, no CSS
   file, no redirect. If this page cannot stay open, the failure is outside the
   SOKONI application entirely.

   NL is built with fromCharCode rather than an escape, because this file is
   generated and re-generated by tooling and a mangled escape would break the
   page silently — which the predeploy syntax gate caught once already. */
(function () {
  var NL = String.fromCharCode(10);
  try { localStorage.setItem('sokoni_devtest_last', new Date().toISOString()); } catch (e) {}

  var sw = 'unsupported';
  try {
    sw = navigator.serviceWorker
      ? (navigator.serviceWorker.controller ? 'CONTROLLING this page' : 'not controlling')
      : 'unsupported';
  } catch (e) { sw = 'error'; }

  var standalone = false;
  try {
    standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone === true;
  } catch (e) {}

  var last = '';
  try { last = localStorage.getItem('sokoni_devtest_last') || ''; } catch (e) {}

  document.getElementById('v').textContent = 'THIS PAGE STAYED OPEN — no splash, no reload';
  document.getElementById('d').textContent = [
    'url           ' + location.href,
    'serviceWorker ' + sw,
    'standalone    ' + standalone,
    'viewport      ' + window.innerWidth + ' x ' + window.innerHeight +
      '  dpr ' + (window.devicePixelRatio || 1),
    'online        ' + navigator.onLine,
    'lastVisit     ' + last,
    'userAgent     ' + navigator.userAgent
  ].join(NL);
}());
</script>
</body>
</html>
