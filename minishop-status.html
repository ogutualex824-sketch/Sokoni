<!DOCTYPE html>
<html lang="en" data-no-header="true">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script src="security.js"></script>
<script src="shared-header.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>SOKONI</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="SOKONI MiniShop">
  <style>
    /* === Reset & Variables === */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:#050505; --sur:#0d0d0d; --sur2:#141414;
      --g:#71ff00; --ga:rgba(113,255,0,.12); --ga2:rgba(113,255,0,.06);
      --bor:#1a1a1a; --bor2:#222; --txt:#e8e8e8; --sub:#888; --radius:12px;
      --accent: #00bcd4;
      --text: #e8e8e8;
      --text2: rgba(255,255,255,0.7);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* === Skeleton === */
    .skeleton {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      background: #050505;
    }

    .sk-img {
      height: 300px;
      border-radius: var(--radius);
    }

    .sk-text {
      height: 40px;
      border-radius: 8px;
      width: 70%;
    }

    .sk-btn {
      height: 60px;
      border-radius: 14px;
    }

    .sk-img, .sk-text, .sk-btn {
      background: linear-gradient(90deg, #1e2030 25%, #2a2d42 50%, #1e2030 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* === Status Mode === */
    .status-mode {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .status-img-wrap {
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      min-height: 0;
    }

    .status-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);
      pointer-events: none;
    }

    .status-shop-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 99px;
      padding: 6px 14px 6px 6px;
      z-index: 3;
    }

    .status-shop-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.1);
    }

    .status-shop-name {
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
    }

    .status-shop-powered {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
    }

    .status-product-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px 8px;
      z-index: 2;
    }

    .status-product-name {
      color: #fff;
      font-weight: 700;
      font-size: 22px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .status-product-price {
      color: var(--accent);
      font-weight: 800;
      font-size: 28px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .status-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px;
      background: #000;
    }

    .status-btn {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.01em;
    }

    .status-btn:active {
      opacity: 0.85;
    }

    .status-btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .status-btn-chat {
      background: #25d366;
      color: #fff;
    }

    .status-btn-call {
      background: #333;
      color: #fff;
    }

    .status-footer {
      text-align: center;
      padding: 10px 20px 20px;
      background: #000;
    }

    .status-powered {
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      text-decoration: none;
    }

    .status-powered strong {
      color: rgba(255,255,255,0.55);
    }

    /* === Business Card Mode === */
    body.card-body {
      background: #050505;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-mode {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .bcard-wrap {
      width: 100%;
      max-width: 380px;
      margin-top: 16px;
    }

    .bcard {
      background: #0d0d0d;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    .bcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--accent);
    }

    .bcard-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
    }

    .bcard-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #141414;
      flex-shrink: 0;
      border: 2px solid #1a1a1a;
    }

    .bcard-identity {
      flex: 1;
      min-width: 0;
    }

    .bcard-name {
      font-size: 20px;
      font-weight: 700;
      color: #e8e8e8;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bcard-category {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }

    .bcard-divider {
      height: 1px;
      background: #1a1a1a;
      margin: 16px 0;
    }

    .bcard-contacts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bcard-contact {
      font-size: 14px;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bcard-url {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin: 16px 0 0;
      word-break: break-all;
    }

    .bcard-qr {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: #fff;
      border-radius: 8px;
      padding: 2px;
    }

    .bcard-qr img {
      display: block;
      border-radius: 6px;
    }

    .bcard-brand {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-align: center;
      margin-top: 16px;
      padding-bottom: 4px;
    }

    /* Extra right padding to avoid QR overlap */
    .bcard-contacts,
    .bcard-url {
      padding-right: 100px;
    }

    .bcard-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      width: 100%;
      max-width: 380px;
    }

    .bcard-btn {
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      display: block;
      transition: opacity 0.15s;
    }

    .bcard-btn:active {
      opacity: 0.85;
    }

    .bcard-btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .bcard-btn-outline {
      background: #141414;
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    .bcard-socials {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 380px;
      margin: 0 0 16px;
    }

    .bcard-social {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      background: #141414;
      border: 1px solid #1a1a1a;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      color: #e8e8e8;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .bcard-social:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bcard-footer {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 8px 0 24px;
      max-width: 380px;
    }

    .bcard-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* === Not Found === */
    .not-found {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: #050505;
      color: #e8e8e8;
    }

    .nf-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .not-found h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #fff;
    }

    .not-found p {
      color: rgba(255,255,255,0.55);
      margin: 0 0 28px;
      font-size: 15px;
    }

    .not-found .status-btn-primary {
      background: var(--accent);
      color: #fff;
      display: inline-block;
      padding: 16px 32px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    /* === Print === */
    @media print {
      .bcard-actions,
      .bcard-socials,
      .bcard-footer { display: none !important; }

      body {
        background: white;
        padding: 0;
      }

      .bcard {
        box-shadow: none;
        border: 1px solid #ddd;
        border-radius: 12px;
      }

      .bcard-wrap {
        max-width: 100%;
      }
    }

    /* === Utility === */
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- Skeleton (shown while loading) -->
  <div id="skeleton" class="skeleton">
    <div class="sk-img"></div>
    <div class="sk-text"></div>
    <div class="sk-btn"></div>
  </div>

  <!-- WhatsApp Status Mode -->
  <div id="status-mode" class="status-mode" hidden>

    <!-- Full-screen product/shop image -->
    <div id="status-img-wrap" class="status-img-wrap">

      <!-- Shop badge overlay (top-left) -->
      <div class="status-shop-badge" id="statusShopBadge">
        <img id="statusShopLogo" src="" alt="" class="status-shop-logo">
        <div>
          <div id="statusShopName" class="status-shop-name"></div>
          <div class="status-shop-powered">on SOKONI</div>
        </div>
      </div>

      <!-- Product info overlay (bottom) -->
      <div class="status-product-info" id="statusProductInfo">
        <div id="statusProductName" class="status-product-name"></div>
        <div id="statusProductPrice" class="status-product-price"></div>
      </div>

    </div>

    <!-- Action buttons -->
    <div class="status-actions" id="statusActions"></div>

    <!-- SOKONI branding footer -->
    <div class="status-footer">
      <a href="https://mysokoni.co.ke" class="status-powered">Shop more on <strong>mysokoni.co.ke</strong></a>
    </div>

  </div>

  <!-- Business Card Mode -->
  <div id="card-mode" class="card-mode" hidden>

    <!-- Card visual (printable) -->
    <div class="bcard-wrap" id="bcardWrap">
      <div class="bcard" id="bcard">
        <div class="bcard-top">
          <img id="bcardLogo" src="" alt="Shop logo" class="bcard-logo" onerror="this.style.display='none'">
          <div class="bcard-identity">
            <div id="bcardName" class="bcard-name"></div>
            <div id="bcardCategory" class="bcard-category"></div>
          </div>
        </div>
        <div class="bcard-divider"></div>
        <div class="bcard-contacts" id="bcardContacts"></div>
        <div class="bcard-url" id="bcardUrl"></div>
        <div class="bcard-qr" id="bcardQr">
          <img id="bcardQrImg" src="" alt="QR code" width="80" height="80">
        </div>
        <div class="bcard-brand">SOKONI</div>
      </div>
    </div>

    <!-- Card actions -->
    <div class="bcard-actions">
      <button id="saveContactBtn" class="bcard-btn bcard-btn-primary">&#11015; Save Contact</button>
      <button onclick="window.print()" class="bcard-btn bcard-btn-outline">&#128438; Print Card</button>
      <a id="visitShopBtn" href="#" class="bcard-btn bcard-btn-outline" aria-disabled="true" style="opacity:.45;pointer-events:none;" title="Shop URL not yet available">&#127978; Visit MiniShop</a>
    </div>

    <!-- Social links -->
    <div class="bcard-socials" id="bcardSocials"></div>

    <div class="bcard-footer">
      <a href="https://mysokoni.co.ke">Get your own MiniShop on <strong>SOKONI</strong></a>
    </div>

  </div>

  <!-- Not found -->
  <div id="not-found" class="not-found" hidden>
    <div class="nf-icon">&#127978;</div>
    <h2>Shop Not Found</h2>
    <p>This MiniShop doesn't exist or may have been removed.</p>
    <a href="https://mysokoni.co.ke" class="status-btn-primary">Browse SOKONI</a>
  </div>

  <script>
    (function () {
      'use strict';

      /* ── Constants ── */
      var CF = 'https://us-central1-sokoni-aeb26.cloudfunctions.net';

      /* ── Helpers ── */
      function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function qrUrl(url) {
        return 'https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=' + encodeURIComponent(url) + '&choe=UTF-8';
      }

      function getParam(k) {
        return new URLSearchParams(window.location.search).get(k) || '';
      }

      function parseHandle() {
        var path = window.location.pathname;
        var shopM = path.match(/\/shop\/([a-z0-9_-]+)/i);
        if (shopM) return shopM[1].toLowerCase();
        var atM = path.match(/\/@([a-z0-9_-]+)/i);
        if (atM) return atM[1].toLowerCase();
        return getParam('handle') || '';
      }

      function setAccent(color) {
        if (color && /^#[0-9a-fA-F]{3,8}$/.test(color)) {
          document.documentElement.style.setProperty('--accent', color);
        }
      }

      function showNotFound() {
        document.getElementById('skeleton').hidden = true;
        document.getElementById('not-found').hidden = false;
      }

      /* ── Status Mode ── */
      function renderStatus(data) {
        var shop = data.shop || {};
        var config = data.config || {};
        var products = data.products || [];

        setAccent(config.theme && config.theme.accentColor);

        var el = document.getElementById('status-mode');
        el.hidden = false;

        /* Background image — first product image, then cover, then logo */
        var prod = products[0] || null;
        var imgSrc = (prod && prod.imageUrl) || config.coverUrl || shop.logoUrl || '';
        var imgWrap = document.getElementById('status-img-wrap');
        if (imgSrc) {
          imgWrap.style.background = "url('" + imgSrc + "') center/cover no-repeat";
        } else {
          imgWrap.style.background = 'linear-gradient(135deg, #0f1117 0%, #1a1d2e 100%)';
        }

        /* Shop badge */
        var nameEl = document.getElementById('statusShopName');
        nameEl.textContent = shop.name || '';

        var logoEl = document.getElementById('statusShopLogo');
        if (config.logoUrl) {
          logoEl.src = config.logoUrl;
          logoEl.alt = esc(shop.name || 'Shop logo');
        } else if (shop.logoUrl) {
          logoEl.src = shop.logoUrl;
          logoEl.alt = esc(shop.name || 'Shop logo');
        } else {
          logoEl.style.display = 'none';
        }

        /* Product info */
        if (prod) {
          document.getElementById('statusProductName').textContent = prod.name || '';
          document.getElementById('statusProductPrice').textContent = prod.price
            ? 'KES ' + Number(prod.price).toLocaleString('en-KE')
            : '';
        } else {
          document.getElementById('statusProductInfo').hidden = true;
        }

        /* Action buttons */
        var handle = data.handle || shop.handle || parseHandle();
        var baseUrl = 'https://mysokoni.co.ke/shop/' + encodeURIComponent(handle);
        var raw = config.socialLinks && config.socialLinks.whatsapp
          ? config.socialLinks.whatsapp
          : (config.contactPhone || '');
        var whatsapp = raw.replace(/[^0-9]/g, '');
        var phone = config.contactPhone || '';
        var waMsg = encodeURIComponent('Hi, I saw your SOKONI store! ');

        var actionsHtml = '<a href="' + esc(baseUrl) + '?utm_source=whatsapp&amp;utm_medium=status" class="status-btn status-btn-primary">&#128722; Shop Now</a>';
        if (whatsapp) {
          actionsHtml += '<a href="https://wa.me/' + esc(whatsapp) + '?text=' + waMsg + '" class="status-btn status-btn-chat">&#128172; WhatsApp</a>';
        }
        if (phone) {
          actionsHtml += '<a href="tel:' + esc(phone) + '" class="status-btn status-btn-call">&#128222; Call</a>';
        }
        document.getElementById('statusActions').innerHTML = actionsHtml;

        /* Page title */
        if (shop.name) document.title = esc(shop.name) + ' — SOKONI';
      }

      /* ── Business Card Mode ── */
      function renderCard(data) {
        var shop = data.shop || {};
        var config = data.config || {};
        var handle = data.handle || shop.handle || parseHandle();
        var shopUrl = 'https://mysokoni.co.ke/shop/' + encodeURIComponent(handle);

        setAccent(config.theme && config.theme.accentColor);

        /* Switch body bg for card mode */
        document.body.classList.add('card-body');
        document.getElementById('card-mode').hidden = false;

        /* Logo */
        var logoEl = document.getElementById('bcardLogo');
        var logoSrc = config.logoUrl || shop.logoUrl || '';
        if (logoSrc) {
          logoEl.src = logoSrc;
          logoEl.alt = esc(shop.name || 'Logo');
        } else {
          logoEl.style.display = 'none';
        }

        /* Name & category */
        document.getElementById('bcardName').textContent = shop.name || 'Business Name';
        document.getElementById('bcardCategory').textContent = shop.category || '';

        /* Contacts */
        var contactLines = [];
        if (config.contactPhone) {
          contactLines.push('<div class="bcard-contact">&#128222; ' + esc(config.contactPhone) + '</div>');
        }
        if (config.contactEmail) {
          contactLines.push('<div class="bcard-contact">&#9993; ' + esc(config.contactEmail) + '</div>');
        }
        if (config.location) {
          contactLines.push('<div class="bcard-contact">&#128205; ' + esc(config.location) + '</div>');
        }
        document.getElementById('bcardContacts').innerHTML = contactLines.join('');

        /* Shop URL */
        document.getElementById('bcardUrl').textContent = shopUrl;

        /* QR code */
        document.getElementById('bcardQrImg').src = qrUrl(shopUrl);

        /* Visit shop button — re-enable once URL is known */
        var vsb = document.getElementById('visitShopBtn');
        vsb.href = shopUrl;
        vsb.removeAttribute('aria-disabled');
        vsb.style.opacity = '';
        vsb.style.pointerEvents = '';
        vsb.removeAttribute('title');

        /* Social links */
        var socials = config.socialLinks || {};
        var socialIcons = {
          whatsapp: '&#128172;',
          instagram: '&#128247;',
          facebook: '&#128077;',
          tiktok: '&#127925;',
          x: '&#10006;',
          youtube: '&#9654;',
          website: '&#127760;'
        };
        var socialUrlBuilders = {
          instagram: function (h) { return 'https://instagram.com/' + h; },
          x:         function (h) { return 'https://x.com/' + h; },
          tiktok:    function (h) { return 'https://tiktok.com/@' + h; },
          youtube:   function (h) { return h; },
          facebook:  function (h) { return h.startsWith('http') ? h : 'https://facebook.com/' + h; },
          website:   function (h) { return h.startsWith('http') ? h : 'https://' + h; },
          whatsapp:  function (h) { return 'https://wa.me/' + h.replace(/[^0-9]/g, ''); }
        };

        var socialHtml = Object.keys(socials).filter(function (k) { return socials[k]; }).map(function (k) {
          var val = socials[k];
          var builder = socialUrlBuilders[k] || function (h) { return h; };
          var url = builder(val);
          var icon = socialIcons[k] || '&#128279;';
          var label = k.charAt(0).toUpperCase() + k.slice(1);
          return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" class="bcard-social">' + icon + ' ' + esc(label) + '</a>';
        }).join('');
        document.getElementById('bcardSocials').innerHTML = socialHtml;

        /* Save contact (vCard) */
        document.getElementById('saveContactBtn').addEventListener('click', function () {
          var lines = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'FN:' + (shop.name || ''),
            'ORG:' + (shop.name || '')
          ];
          if (config.contactPhone) lines.push('TEL;TYPE=CELL:' + config.contactPhone);
          if (config.contactEmail) lines.push('EMAIL:' + config.contactEmail);
          lines.push('URL:' + shopUrl);
          if (config.location) lines.push('ADR:;;' + config.location + ';;;;KE');
          lines.push('NOTE:Find us on SOKONI - mysokoni.co.ke');
          lines.push('END:VCARD');

          var vcf = lines.join('\r\n');
          var blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (shop.name || 'contact').replace(/\s+/g, '-') + '.vcf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
        });

        /* Page title */
        if (shop.name) document.title = esc(shop.name) + ' — SOKONI';
      }

      /* ── Main init ── */
      async function init() {
        var handle = parseHandle();
        if (!handle) {
          showNotFound();
          return;
        }

        var mode = getParam('mode') || 'status'; /* 'status' or 'card' */

        try {
          var resp = await fetch(CF + '/getMinishopPublic?handle=' + encodeURIComponent(handle), {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });

          if (!resp.ok) {
            showNotFound();
            return;
          }

          var data = await resp.json();

          if (!data || (!data.shop && !data.handle)) {
            showNotFound();
            return;
          }

          document.getElementById('skeleton').hidden = true;

          if (mode === 'card') {
            renderCard(data);
          } else {
            renderStatus(data);
          }
        } catch (err) {
          /* Network or parse error — show not found gracefully */
          showNotFound();
        }
      }

      document.addEventListener('DOMContentLoaded', init);
    }());
  </script>
</body>
</html>
