<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Property Listing — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#f0883e}
.container{max-width:760px;margin:0 auto;padding:24px 16px}
.form-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px}
.form-card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#f0883e}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:5px}
.fg label .req{color:#f85149}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#f0883e}
.fg textarea{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.amen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.amen-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:13px;transition:.2s}
.amen-item:hover,.amen-item.on{border-color:#f0883e;background:#1a0f00}
.amen-item input[type=checkbox]{display:none}
.preview-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-top:8px;min-height:60px}
.img-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:8px}
.img-thumb{height:70px;background:#21262d;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;overflow:hidden}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.btn{padding:11px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-o{background:#f0883e;color:#fff}.btn-o:hover{background:#e0773d}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-out:hover{border-color:#8b949e}
.empty{text-align:center;padding:60px;color:#8b949e}
.success-box{background:#1a3a2a;border:1px solid #3fb950;border-radius:12px;padding:24px;text-align:center}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.row2{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">🏠 Create Listing</div>
</div>
<div class="container" id="main">
  <div class="empty"><div style="display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#f0883e;border-radius:50%;animation:sp .8s linear infinite"></div><style>@keyframes sp{to{transform:rotate(360deg)}}</style></div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,amenities=[],images=[];
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
try{app=firebase.initializeApp(firebaseConfig,'proplist');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;u?showForm():showSignIn();});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

function showSignIn(){document.getElementById('main').innerHTML='<div class="empty">Sign in to create property listings.</div>';}

const AMENITIES=['Parking','Swimming Pool','Gym','Garden','Security','Generator','Borehole','Solar','Fibre Internet','CCTV','Elevator','Balcony','DSQ','Store','Staff Quarters'];

function showForm(){
  amenities=[];images=[];
  document.getElementById('main').innerHTML=`
  <h1 style="font-size:22px;font-weight:700;margin-bottom:4px">Create Property Listing</h1>
  <p style="color:#8b949e;font-size:14px;margin-bottom:24px">Fill in the details below. You can publish immediately or save as a draft.</p>

  <div class="form-card">
    <h2>Basic Details</h2>
    <div class="fg"><label>Listing Title <span class="req">*</span></label><input id="title" placeholder="e.g. Modern 3BR Apartment in Kilimani"></div>
    <div class="row2">
      <div class="fg"><label>Property Type <span class="req">*</span></label><select id="ptype">
        <option value="apartment">Apartment</option><option value="house">House</option>
        <option value="townhouse">Townhouse</option><option value="villa">Villa</option>
        <option value="land">Land</option><option value="commercial">Commercial</option>
        <option value="studio">Studio</option><option value="other">Other</option>
      </select></div>
      <div class="fg"><label>Listing Type <span class="req">*</span></label><select id="ltype">
        <option value="for_sale">For Sale</option>
        <option value="for_rent">For Rent</option>
        <option value="short_let">Short Let</option>
      </select></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Price (KES) <span class="req">*</span></label><input type="number" id="price" placeholder="5000000"></div>
      <div class="fg"><label>Price Type</label><select id="priceType"><option value="total">Total / Fixed</option><option value="per_month">Per Month</option><option value="per_night">Per Night</option></select></div>
    </div>
    <div class="fg">
      <label>Negotiable?</label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;width:fit-content">
        <input type="checkbox" id="negotiable" style="width:auto;padding:0"><span>Yes, price is negotiable</span>
      </label>
    </div>
  </div>

  <div class="form-card">
    <h2>Location</h2>
    <div class="row2">
      <div class="fg"><label>County <span class="req">*</span></label><input id="county" placeholder="Nairobi"></div>
      <div class="fg"><label>City</label><input id="city" placeholder="Nairobi"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Neighborhood / Area</label><input id="hood" placeholder="Kilimani"></div>
      <div class="fg"><label>Street Address</label><input id="address" placeholder="Ngong Road"></div>
    </div>
  </div>

  <div class="form-card">
    <h2>Property Specifications</h2>
    <div class="row3">
      <div class="fg"><label>Bedrooms</label><input type="number" id="beds" min="0" placeholder="3"></div>
      <div class="fg"><label>Bathrooms</label><input type="number" id="baths" min="0" placeholder="2"></div>
      <div class="fg"><label>Parking Spaces</label><input type="number" id="parking" min="0" placeholder="1"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Size (m²)</label><input type="number" id="size" placeholder="120"></div>
      <div class="fg"><label>Year Built</label><input type="number" id="yearBuilt" placeholder="2020"></div>
    </div>
    <div class="fg">
      <label>Furnished?</label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;width:fit-content">
        <input type="checkbox" id="furnished" style="width:auto;padding:0"><span>Yes, furnished</span>
      </label>
    </div>
  </div>

  <div class="form-card">
    <h2>Amenities</h2>
    <div class="amen-grid" id="amenGrid">
      ${AMENITIES.map(a=>`<div class="amen-item" onclick="toggleAmen('${a}',this)">☐ ${a}</div>`).join('')}
    </div>
  </div>

  <div class="form-card">
    <h2>Description & Photos</h2>
    <div class="fg"><label>Description <span class="req">*</span></label><textarea id="desc" placeholder="Describe the property — key features, condition, proximity to amenities…"></textarea></div>
    <div class="fg">
      <label>Photos (paste image URLs)</label>
      <div style="display:flex;gap:8px">
        <input id="imgUrl" placeholder="https://…" style="flex:1;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px">
        <button class="btn btn-out" style="flex-shrink:0" onclick="addImg()">Add</button>
      </div>
      <div class="img-list" id="imgList"></div>
    </div>
    <div class="fg"><label>Agent Phone</label><input id="agentPhone" placeholder="+254…"></div>
    <div class="fg"><label>Agent Email</label><input type="email" id="agentEmail" placeholder="agent@example.com"></div>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:40px">
    <button class="btn btn-out" style="flex:1" onclick="submit(false)">Save as Draft</button>
    <button class="btn btn-o" style="flex:1" onclick="submit(true)">Publish Listing</button>
  </div>`;
}

function toggleAmen(a,el){
  if(amenities.includes(a)){amenities=amenities.filter(x=>x!==a);el.classList.remove('on');el.innerHTML='☐ '+a;}
  else{amenities.push(a);el.classList.add('on');el.innerHTML='☑ '+a;}
}

function addImg(){
  const url=document.getElementById('imgUrl').value.trim();
  if(!url)return;images.push(url);document.getElementById('imgUrl').value='';
  renderImgs();
}
function removeImg(idx){images.splice(idx,1);renderImgs();}
function renderImgs(){
  document.getElementById('imgList').innerHTML=images.map((url,i)=>`<div class="img-thumb"><img src="${esc(url)}" onerror="this.style.display='none'"><button class="img-rm" onclick="removeImg(${i})">×</button></div>`).join('');
}

async function submit(publish){
  if(!cu){toast('Sign in to create listings',false);return;}
  const title=document.getElementById('title').value.trim();
  const price=parseFloat(document.getElementById('price').value);
  const county=document.getElementById('county').value.trim();
  const desc=document.getElementById('desc').value.trim();
  if(!title||!price||!county||!desc){toast('Fill all required fields',false);return;}
  const btn=publish?document.querySelectorAll('.btn-o')[0]:document.querySelectorAll('.btn-out')[0];
  btn.textContent='Saving…';btn.disabled=true;
  const r=await call('createPropertyListing',{
    title,propertyType:document.getElementById('ptype').value,
    listingType:document.getElementById('ltype').value,
    price,priceType:document.getElementById('priceType').value,
    isNegotiable:document.getElementById('negotiable').checked,
    county,city:document.getElementById('city').value.trim(),
    neighborhood:document.getElementById('hood').value.trim(),
    address:document.getElementById('address').value.trim(),
    bedrooms:parseInt(document.getElementById('beds').value)||undefined,
    bathrooms:parseInt(document.getElementById('baths').value)||undefined,
    parkingSpaces:parseInt(document.getElementById('parking').value)||undefined,
    sizeM2:parseFloat(document.getElementById('size').value)||undefined,
    yearBuilt:parseInt(document.getElementById('yearBuilt').value)||undefined,
    furnished:document.getElementById('furnished').checked,
    amenities,images,description:desc,
    agentPhone:document.getElementById('agentPhone').value.trim(),
    agentEmail:document.getElementById('agentEmail').value.trim(),
  });
  btn.textContent=publish?'Publish Listing':'Save as Draft';btn.disabled=false;
  if(!r.ok){toast(r.err||'Failed to create listing',false);return;}
  if(publish){
    const pr=await call('publishPropertyListing',{listingId:r.data.listingId});
    if(pr.ok){
      document.getElementById('main').innerHTML=`<div class="success-box"><div style="font-size:48px;margin-bottom:12px">✅</div><h2 style="margin-bottom:8px">Listing Published!</h2><p style="color:#8b949e;margin-bottom:20px">Your property is now live on the marketplace.</p><div style="display:flex;gap:12px;justify-content:center"><a href="/property-hub" class="btn btn-o" style="text-decoration:none">View Marketplace</a><a href="/property-hub" class="btn btn-out" style="text-decoration:none">Agent Portal</a></div></div>`;
      return;
    }
  }
  toast(publish?'Listing created! Publish from the agent portal.':'Draft saved!');
  setTimeout(()=>history.back(),1500);
}
</script>
</body>
</html>
