<!DOCTYPE html>
<html lang="en" data-no-header="true">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script src="security.js"></script>
<!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
     through SokoniCart; without this tag the pip cannot render a count. -->
<script src="sokoni-cart.js"></script>
<script src="shared-header.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111118">
  <title>Manager Authorization — SOKONI SmartPOS</title>
  <script type="module" src="firebase.js"></script>
  <script src="pos-manager-auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* ── SOKONI Premium Dark Standard ─────────────────────────────── */
      --bg:#050505; --sur:#0d0d0d; --sur2:#141414;
      --g:#71ff00; --ga:rgba(113,255,0,.12); --ga2:rgba(113,255,0,.06);
      --bor:#1a1a1a; --bor2:#222; --txt:#e8e8e8; --sub:#888; --radius:12px;
      /* ── Legacy aliases (used throughout this file) ───────────────── */
      --card:   #0d0d0d;
      --card2:  #141414;
      --border: #1a1a1a;
      --txt2:   #888;
      --green:  #71ff00;
      --red:    #ef4444;
      --amber:  #f59e0b;
      --blue:   #60a5fa;
    }
    html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: 'Inter',-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Header ── */
    .hdr {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .hdr-back {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card2);
      color: var(--txt);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .hdr-title { font-size: 16px; font-weight: 800; flex: 1; }
    .hdr-badge {
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      background: rgba(113,255,0,.12); color: var(--green);
      padding: 3px 8px; border-radius: 5px;
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 56px;
      z-index: 9;
    }
    .tab {
      flex: 1; padding: 13px 8px; text-align: center;
      font-size: 12px; font-weight: 700; color: var(--txt2);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .18s; letter-spacing: .02em;
    }
    .tab.active { color: var(--green); border-color: var(--green); }

    /* ── Content ── */
    .page { display: none; padding: 16px; max-width: 560px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card-title { font-size: 11px; font-weight: 800; color: var(--txt2); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 10px; }

    /* ── Form inputs ── */
    .form-row { margin-bottom: 12px; }
    label.lbl { display: block; font-size: 11px; font-weight: 700; color: var(--txt2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 5px; }
    input.inp, select.inp {
      width: 100%; padding: 11px 14px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--txt); font-size: 15px;
      outline: none; transition: border-color .18s;
    }
    input.inp:focus, select.inp:focus { border-color: rgba(113,255,0,.4); }
    input.inp[type="number"] { font-size: 22px; font-weight: 700; text-align: center; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 13px; background: var(--green);
      border: none; border-radius: 11px; color: #111;
      font-size: 14px; font-weight: 800; cursor: pointer; transition: opacity .18s;
    }
    .btn-primary:active { opacity: .8; }
    .btn-ghost {
      padding: 10px 14px; background: var(--card2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--txt2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .18s;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,.2); color: var(--txt); }
    .btn-danger {
      padding: 8px 12px; background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25); border-radius: 9px;
      color: var(--red); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .18s;
    }
    .btn-danger:hover { background: var(--red); color: #fff; }

    /* ── Manager list ── */
    .mgr-card {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .mgr-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(113,255,0,.1); border: 1px solid rgba(113,255,0,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .mgr-info { flex: 1; min-width: 0; }
    .mgr-name { font-size: 14px; font-weight: 700; color: var(--txt); }
    .mgr-role { font-size: 11px; color: var(--txt2); text-transform: capitalize; margin-top: 2px; }
    .mgr-actions { display: flex; gap: 6px; }

    /* ── Role badge ── */
    .role-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      padding: 2px 7px; border-radius: 5px; text-transform: uppercase;
    }
    .role-badge.admin    { background: rgba(239,68,68,.12); color: var(--red); }
    .role-badge.manager  { background: rgba(113,255,0,.1);  color: var(--green); }
    .role-badge.supervisor { background: rgba(96,165,250,.1); color: var(--blue); }

    /* ── Pending requests ── */
    .req-card {
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
      background: var(--card2);
      animation: req-in .25s ease;
    }
    @keyframes req-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .req-card.urgent { border-color: rgba(245,158,11,.35); }
    .req-op { font-size: 15px; font-weight: 800; color: var(--txt); margin-bottom: 3px; }
    .req-meta { font-size: 12px; color: var(--txt2); margin-bottom: 10px; }
    .req-ctx { font-size: 12px; color: var(--amber); font-weight: 600; margin-bottom: 12px; }
    .req-btns { display: flex; gap: 8px; }
    .btn-approve {
      flex: 2; padding: 11px; background: var(--green); border: none;
      border-radius: 10px; color: #111; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .btn-deny {
      flex: 1; padding: 11px; background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25); border-radius: 10px;
      color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .req-countdown { font-size: 11px; color: var(--txt2); text-align: center; margin-top: 7px; }

    /* ── Audit log table ── */
    .audit-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .audit-row:last-child { border-bottom: none; }
    .audit-ico { font-size: 20px; flex-shrink: 0; }
    .audit-info { flex: 1; min-width: 0; }
    .audit-op { font-size: 13px; font-weight: 700; }
    .audit-meta { font-size: 11px; color: var(--txt2); margin-top: 2px; }
    .audit-status {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; letter-spacing: .04em;
    }
    .audit-status.approved { background: rgba(113,255,0,.12); color: var(--green); }
    .audit-status.denied   { background: rgba(239,68,68,.12);  color: var(--red); }
    .audit-status.cancelled{ background: rgba(255,255,255,.06); color: var(--txt2); }

    /* ── QR display ── */
    .qr-display {
      background: #fff; border-radius: 12px; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 12px 0;
    }
    #qr-canvas { border-radius: 6px; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--txt2); }
    .empty-ico { font-size: 40px; margin-bottom: 10px; }

    /* ── Toast ── */
    #mah-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e1e28; border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: var(--txt); z-index: 9999; opacity: 0; transition: opacity .2s;
      pointer-events: none; white-space: nowrap; max-width: 90vw;
    }
    #mah-toast.show { opacity: 1; }

    /* ── PIN modal (for manager to verify before approving) ── */
    .pin-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,.87); display: flex;
      align-items: flex-end; justify-content: center;
      animation: mauth-fi .2s ease;
    }
    @media (min-width: 600px) { .pin-overlay { align-items: center; } }
    .pin-sheet {
      background: #18181f; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 380px; padding: 18px 18px 36px;
      animation: mauth-su .25s ease;
    }
    @media (min-width: 600px) { .pin-sheet { border-radius: 20px; } }
    .pin-drag { width: 40px; height: 4px; background: rgba(255,255,255,.14); border-radius: 2px; margin: 0 auto 14px; }
    .pin-title { font-size: 16px; font-weight: 800; text-align: center; margin-bottom: 14px; }
    .pin-dots  { display: flex; justify-content: center; gap: 14px; margin-bottom: 18px; }
    .pin-dot   { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); transition: all .12s; }
    .pin-dot.f { background: var(--green); border-color: var(--green); transform: scale(1.1); }
    .pin-dot.x { background: var(--red); border-color: var(--red); }
    .pin-kp    { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 290px; margin: 0 auto; }
    .pin-key   { padding: 13px 0; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; background: #1e1e28; color: var(--txt); font-size: 21px; font-weight: 600; cursor: pointer; text-align: center; touch-action: manipulation; }
    .pin-key:active { background: rgba(113,255,0,.1); border-color: rgba(113,255,0,.25); color: var(--green); }
    .pin-key.del { font-size: 16px; color: var(--txt2); }
    .pin-err { text-align: center; font-size: 13px; font-weight: 600; color: var(--red); min-height: 20px; margin-top: 10px; }
    .pin-cancel-btn { width: 100%; margin-top: 12px; padding: 12px; background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.18); border-radius: 12px; color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer; }

    @keyframes mauth-fi { from { opacity: 0; } to { opacity: 1; } }
    @keyframes mauth-su { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="hdr">
    <button class="hdr-back" onclick="history.length > 1 ? history.back() : (window.location='pos.html')" aria-label="Back">←</button>
    <div class="hdr-title">Manager Authorization</div>
    <div class="hdr-badge" id="hdr-badge">OFFLINE</div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <div class="tab active" data-page="approvals">Approvals</div>
    <div class="tab" data-page="managers">Managers</div>
    <div class="tab" data-page="add">Add Manager</div>
    <div class="tab" data-page="audit">Audit Log</div>
  </div>

  <!-- ═══ PAGE: APPROVALS ═══ -->
  <div class="page active" id="page-approvals">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:13px;color:var(--txt2)" id="appr-info">Listening for requests…</div>
      <button class="btn-ghost" onclick="MAH.loadApprovals()">Refresh</button>
    </div>
    <div id="approvals-list">
      <div class="empty"><div class="empty-ico">✅</div><p>No pending approvals</p></div>
    </div>
  </div>

  <!-- ═══ PAGE: MANAGERS ═══ -->
  <div class="page" id="page-managers">
    <div id="managers-list">
      <div class="empty"><div class="empty-ico">👤</div><p>No managers registered yet</p></div>
    </div>
  </div>

  <!-- ═══ PAGE: ADD MANAGER ═══ -->
  <div class="page" id="page-add">
    <div class="card">
      <div class="card-title">Manager Details</div>
      <div class="form-row">
        <label class="lbl">Full Name</label>
        <input class="inp" id="add-name" type="text" placeholder="e.g. Jane Wanjiru" maxlength="60" autocomplete="off">
      </div>
      <div class="form-row">
        <label class="lbl">Role</label>
        <select class="inp" id="add-role">
          <option value="supervisor">Supervisor</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-row">
        <label class="lbl">PIN (4–8 digits)</label>
        <input class="inp" id="add-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••">
      </div>
      <div class="form-row">
        <label class="lbl">Confirm PIN</label>
        <input class="inp" id="add-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••">
      </div>
    </div>

    <div class="card">
      <div class="card-title">Authorized Operations</div>
      <div id="ops-checks"></div>
    </div>

    <button class="btn-primary" onclick="MAH.addManager()">Create Manager</button>
  </div>

  <!-- ═══ PAGE: AUDIT LOG ═══ -->
  <div class="page" id="page-audit">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <div style="flex:1;font-size:13px;color:var(--txt2)" id="audit-count"></div>
      <button class="btn-ghost" onclick="MAH.loadAudit()">Refresh</button>
    </div>
    <div id="audit-list">
      <div class="empty"><div class="empty-ico">📋</div><p>No audit entries yet</p></div>
    </div>
  </div>

  <!-- Manager detail modal (QR, NFC, Bio enroll) -->
  <div id="mgr-detail-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.87);align-items:center;justify-content:center">
    <div style="background:#18181f;border-radius:20px;width:calc(100% - 32px);max-width:400px;padding:20px;max-height:90dvh;overflow-y:auto">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-size:16px;font-weight:800" id="mdd-name"></div>
        <button style="background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer" onclick="MAH.closeMgrDetail()">✕</button>
      </div>
      <div id="mdd-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="mah-toast"></div>

  <script>
    'use strict';

    const MAH = (() => {

      /* ── Helpers ── */
      function _escH(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      }

      function _toast(msg, type = 'info') {
        const el = document.getElementById('mah-toast');
        el.textContent = msg;
        el.style.borderColor = type === 'error' ? 'rgba(239,68,68,.4)' : type === 'success' ? 'rgba(113,255,0,.3)' : 'rgba(255,255,255,.1)';
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
      }

      function _fdb() {
        try { if (window.firebase?.firestore) return firebase.firestore(); } catch (_) {}
        return null;
      }

      function _shopId() {
        return localStorage.getItem('sokoni_shop_id') || 'default';
      }

      /* ── Tab navigation ── */
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          const page = document.getElementById('page-' + tab.dataset.page);
          if (page) {
            page.classList.add('active');
            if (tab.dataset.page === 'managers') loadManagers();
            if (tab.dataset.page === 'approvals') loadApprovals();
            if (tab.dataset.page === 'add')       renderOpsChecks();
            if (tab.dataset.page === 'audit')     loadAudit();
          }
        });
      });

      /* ── Operations checkboxes ── */
      const OPS_META = {
        refund:               { label: 'Process Refunds',       icon: '↩' },
        void:                 { label: 'Void Transactions',     icon: '⊗' },
        price_override:       { label: 'Price Override',        icon: '✏' },
        large_discount:       { label: 'Large Discounts',       icon: '%' },
        stock_adjustment:     { label: 'Stock Adjustments',     icon: '📦' },
        cash_drawer:          { label: 'Cash Drawer Access',    icon: '💰' },
        shift_close:          { label: 'Shift Closing',         icon: '⏻' },
        inventory_correction: { label: 'Inventory Corrections', icon: '🗂' },
      };

      function renderOpsChecks() {
        const c = document.getElementById('ops-checks');
        c.innerHTML = Object.entries(OPS_META).map(([k, v]) => `
          <label style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer">
            <input type="checkbox" id="op-${k}" checked value="${_escH(k)}" style="width:16px;height:16px;accent-color:var(--green)">
            <span style="font-size:15px">${_escH(v.icon)}</span>
            <span style="font-size:13px;font-weight:600">${_escH(v.label)}</span>
          </label>`).join('');
      }

      /* ── Add Manager ── */
      async function addManager() {
        const name   = document.getElementById('add-name').value.trim();
        const role   = document.getElementById('add-role').value;
        const pin    = document.getElementById('add-pin').value;
        const pin2   = document.getElementById('add-pin2').value;

        if (!name)              { _toast('Name is required', 'error'); return; }
        if (!/^\d{4,8}$/.test(pin)) { _toast('PIN must be 4–8 digits', 'error'); return; }
        if (pin !== pin2)       { _toast('PINs do not match', 'error'); return; }

        const ops = Object.keys(OPS_META).filter(k => document.getElementById('op-' + k)?.checked);

        try {
          const result = await ManagerAuth.addManager({ name, role, pin, operations: ops });
          _toast('Manager created successfully', 'success');

          /* Clear form */
          ['add-name','add-pin','add-pin2'].forEach(id => document.getElementById(id).value = '');

          /* Offer to print QR badge */
          if (await SK.dialog.confirm(`Manager "${name}" created! Open QR Badge display for printing?`, null, null, { title: 'Manager created', confirmLabel: 'Open QR badge' })) {
            showMgrDetail(result.id);
          } else {
            /* Switch to managers tab */
            document.querySelector('[data-page="managers"]').click();
          }
        } catch (e) {
          _toast(e.message || 'Failed to create manager', 'error');
        }
      }

      /* ── Load managers list ── */
      async function loadManagers() {
        const list = document.getElementById('managers-list');
        list.innerHTML = '<div style="color:var(--txt2);text-align:center;padding:20px">Loading…</div>';
        try {
          const managers = await ManagerAuth.listManagers();
          if (!managers.length) {
            list.innerHTML = '<div class="empty"><div class="empty-ico">👤</div><p>No managers registered.<br>Go to "Add Manager" to create one.</p></div>';
            return;
          }
          list.innerHTML = managers.map(m => {
            const bio = m.webAuthnCredId ? '👁 Bio' : '';
            const nfc = m.nfcUidHash     ? '📡 NFC' : '';
            const qr  = m.qrToken        ? '📷 QR'  : '';
            const enrolled = [bio, nfc, qr].filter(Boolean).join(' · ') || '🔢 PIN only';
            return `<div class="mgr-card">
                <div class="mgr-avatar">👤</div>
                <div class="mgr-info">
                  <div class="mgr-name">${_escH(m.name)} <span class="role-badge ${_escH(m.role || 'supervisor')}">${_escH(m.role || 'supervisor')}</span></div>
                  <div class="mgr-role">${_escH(enrolled)}</div>
                </div>
                <div class="mgr-actions">
                  <button class="btn-ghost" onclick="MAH.showMgrDetail('${_escH(m.id)}')">Manage</button>
                  <button class="btn-danger" onclick="MAH.deleteManager('${_escH(m.id)}','${_escH(m.name)}')">Remove</button>
                </div>
              </div>`;
          }).join('');
        } catch (e) {
          list.innerHTML = `<div class="empty"><div class="empty-ico">⚠</div><p>${_escH(e.message)}</p></div>`;
        }
      }

      /* ── Delete manager ── */
      async function deleteManager(id, name) {
        if (!(await SK.dialog.confirm(`Remove manager "${name}"? They will no longer be able to approve operations.`, null, null, { title: 'Remove manager', variant: 'danger', confirmLabel: 'Remove' }))) return;
        try {
          await ManagerAuth.removeManager(id);
          _toast('Manager removed', 'success');
          loadManagers();
        } catch (e) {
          _toast(e.message, 'error');
        }
      }

      /* ── Manager detail / enroll modal ── */
      async function showMgrDetail(managerId) {
        const managers = await ManagerAuth.listManagers();
        const mgr = managers.find(m => m.id === managerId);
        if (!mgr) { _toast('Manager not found', 'error'); return; }

        document.getElementById('mdd-name').textContent = mgr.name;

        const qrInfo = await ManagerAuth.getManagerQRData(managerId);

        document.getElementById('mdd-content').innerHTML = `
          <div style="margin-bottom:14px">
            <div class="card-title" style="margin-bottom:8px">QR BADGE</div>
            <div class="qr-display"><canvas id="qr-canvas" width="200" height="200"></canvas></div>
            <div style="font-size:11px;color:var(--txt2);text-align:center;margin-top:4px">Print and laminate this badge for the manager</div>
            <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="MAH.printQR('${_escH(mgr.id)}','${_escH(mgr.name)}')">Print QR Badge</button>
          </div>

          <div style="margin-bottom:14px">
            <div class="card-title" style="margin-bottom:8px">BIOMETRIC</div>
            <div style="font-size:13px;color:var(--txt2);margin-bottom:8px">
              ${mgr.webAuthnCredId ? '✅ Biometric enrolled' : '❌ Not enrolled — requires Chrome on a device with fingerprint/face ID'}
            </div>
            <button class="btn-ghost" style="width:100%" onclick="MAH.enrollBiometric('${_escH(mgr.id)}')">
              ${mgr.webAuthnCredId ? 'Re-enroll Biometric' : 'Enroll Biometric'}
            </button>
          </div>

          <div style="margin-bottom:14px">
            <div class="card-title" style="margin-bottom:8px">NFC CARD</div>
            <div style="font-size:13px;color:var(--txt2);margin-bottom:8px">
              ${mgr.nfcUidHash ? '✅ NFC card enrolled' : '❌ Not enrolled — requires Chrome on Android with NFC'}
            </div>
            <button class="btn-ghost" style="width:100%" onclick="MAH.enrollNFC('${_escH(mgr.id)}')">
              ${mgr.nfcUidHash ? 'Re-enroll NFC Card' : 'Enroll NFC Card'}
            </button>
          </div>

          <div style="margin-bottom:4px">
            <div class="card-title" style="margin-bottom:8px">CHANGE PIN</div>
            <div style="display:flex;gap:8px">
              <input class="inp" id="mdd-newpin" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN" style="flex:1">
              <button class="btn-ghost" onclick="MAH.changePin('${_escH(mgr.id)}')">Update PIN</button>
            </div>
          </div>`;

        /* Draw QR code on canvas */
        document.getElementById('mgr-detail-overlay').style.display = 'flex';
        _drawQR(document.getElementById('qr-canvas'), qrInfo.qrData);
      }

      function closeMgrDetail() {
        document.getElementById('mgr-detail-overlay').style.display = 'none';
      }

      /* ── Simple QR renderer using canvas (no external lib needed for display) ── */
      function _drawQR(canvas, data) {
        /* Use qrcode.js if available (loaded externally), else show text */
        if (window.QRCode) {
          canvas.parentElement.innerHTML = `<div id="qr-canvas"></div>`;
          new QRCode(document.getElementById('qr-canvas'), {
            text: data, width: 200, height: 200,
            colorDark: '#000000', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M,
          });
          return;
        }
        /* Fallback: display raw data as text for manual generation */
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, 200, 200);
        ctx.fillStyle = '#000';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('QR Code:', 100, 80);
        ctx.fillText('(scan with QR generator app)', 100, 100);
        ctx.font = '7px monospace';
        const parts = data.match(/.{1,28}/g) || [];
        parts.forEach((p, i) => ctx.fillText(p, 100, 115 + i * 11));
      }

      /* ── Print QR badge ── */
      async function printQR(managerId, managerName) {
        const info = await ManagerAuth.getManagerQRData(managerId);
        const w = window.open('', '_blank', 'width=400,height=500');
        w.document.write(`<!DOCTYPE html><html data-no-header="true"><head><title>QR Badge — ${_escH(managerName)}</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
          <style>body{font-family:sans-serif;text-align:center;padding:30px;background:#fff}
            .badge{border:2px solid #000;border-radius:12px;padding:20px;display:inline-block;max-width:240px}
            h2{margin:0 0 6px;font-size:18px}
            p{margin:0;font-size:12px;color:#555}
            .role{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#777;margin-top:4px}
          </style></head><body>
          <div class="badge">
            <h2>${_escH(managerName)}</h2>
            <div class="role">${_escH(info.role || 'Manager')} — SOKONI SmartPOS</div>
            <div id="qr" style="margin:14px auto 0"></div>
            <p style="margin-top:8px;font-size:10px;color:#999">Manager Authorization Badge</p>
          </div>
          <script>
            new QRCode(document.getElementById("qr"),{text:"${info.qrData.replace(/"/g, '\\"')}",width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
            setTimeout(()=>window.print(),800);
          <\/script></body></html>`);
        w.document.close();
      }

      /* ── Enroll biometric ── */
      async function enrollBiometric(managerId) {
        try {
          _toast('Follow the device biometric prompt…', 'info');
          await ManagerAuth.enrollBiometric(managerId);
          _toast('Biometric enrolled successfully!', 'success');
          showMgrDetail(managerId);
        } catch (e) {
          _toast('Biometric enrollment failed: ' + e.message, 'error');
        }
      }

      /* ── Enroll NFC ── */
      async function enrollNFC(managerId) {
        _toast('Hold NFC card near the back of the device…', 'info');
        try {
          await ManagerAuth.enrollNFC(managerId);
          _toast('NFC card enrolled!', 'success');
          showMgrDetail(managerId);
        } catch (e) {
          _toast('NFC enrollment failed: ' + e.message, 'error');
        }
      }

      /* ── Change PIN ── */
      async function changePin(managerId) {
        const newPin = document.getElementById('mdd-newpin')?.value;
        if (!newPin || !/^\d{4,8}$/.test(newPin)) { _toast('PIN must be 4–8 digits', 'error'); return; }
        try {
          await ManagerAuth.updateManager(managerId, { pin: newPin });
          _toast('PIN updated', 'success');
          if (document.getElementById('mdd-newpin')) document.getElementById('mdd-newpin').value = '';
        } catch (e) {
          _toast(e.message, 'error');
        }
      }

      /* ── Pending approval requests ── */
      let _reqUnsub = null;
      let _reqTimers = {};

      async function loadApprovals() {
        const db = _fdb();
        const info = document.getElementById('appr-info');

        if (_reqUnsub) { _reqUnsub(); _reqUnsub = null; }

        if (!db) {
          info.textContent = 'Firebase unavailable — approvals require network';
          document.getElementById('approvals-list').innerHTML =
            '<div class="empty"><div class="empty-ico">📵</div><p>Mobile approvals require Firebase.<br>Use PIN or QR badge on the POS instead.</p></div>';
          return;
        }

        info.textContent = 'Live — listening for requests…';
        document.getElementById('hdr-badge').textContent = 'LIVE';
        document.getElementById('hdr-badge').style.background = 'rgba(113,255,0,.12)';

        _reqUnsub = db.collection('managerAuthRequests')
          .where('status', '==', 'pending')
          .orderBy('requestedAt', 'desc')
          .onSnapshot(snap => {
            const docs  = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const now   = Date.now();
            const valid = docs.filter(d => d.expiresAt > now);
            _renderApprovals(valid);
          });
      }

      function _renderApprovals(requests) {
        const list = document.getElementById('approvals-list');
        Object.values(_reqTimers).forEach(clearInterval);
        _reqTimers = {};

        if (!requests.length) {
          list.innerHTML = '<div class="empty"><div class="empty-ico">✅</div><p>No pending approvals</p></div>';
          return;
        }

        list.innerHTML = requests.map(r => {
          const ctxParts = [];
          if (r.context?.amount) ctxParts.push('KES ' + Number(r.context.amount).toLocaleString());
          if (r.context?.product) ctxParts.push(r.context.product);
          const ctxStr = ctxParts.join(' · ');
          const isUrgent = r.expiresAt - Date.now() < 60000;
          return `<div class="req-card ${isUrgent ? 'urgent' : ''}" id="reqcard-${_escH(r.id)}">
              <div class="req-op">${_escH(r.operationLabel || r.operation)}</div>
              <div class="req-meta">From: ${_escH(r.cashierName || 'Cashier')} · Terminal</div>
              ${ctxStr ? `<div class="req-ctx">${_escH(ctxStr)}</div>` : ''}
              <div class="req-btns">
                <button class="btn-approve" onclick="MAH.approveReq('${_escH(r.id)}','${_escH(r.managerId || '')}')">Approve</button>
                <button class="btn-deny"    onclick="MAH.denyReq('${_escH(r.id)}')">Deny</button>
              </div>
              <div class="req-countdown" id="reqs-${_escH(r.id)}"></div>
            </div>`;
        }).join('');

        /* Countdown timers */
        requests.forEach(r => {
          const tick = () => {
            const el = document.getElementById('reqs-' + r.id);
            if (!el) { clearInterval(_reqTimers[r.id]); delete _reqTimers[r.id]; return; }
            const sec = Math.max(0, Math.round((r.expiresAt - Date.now()) / 1000));
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            el.textContent = `Expires in ${m}:${String(s).padStart(2, '0')}`;
            if (sec <= 0) { clearInterval(_reqTimers[r.id]); delete _reqTimers[r.id]; }
          };
          tick();
          _reqTimers[r.id] = setInterval(tick, 1000);
        });
      }

      /* ── Approve / Deny ── */
      async function approveReq(reqId, preferredManagerId) {
        /* Show PIN keypad for manager to verify */
        _showPINConfirm(async (pin) => {
          try {
            const managers  = await ManagerAuth.listManagers();
            /* Find manager by PIN */
            let matchedMgr = null;
            for (const m of managers) {
              const h = await _sha256(m.pinSalt + ':' + pin);
              if (h === m.pinHash) { matchedMgr = m; break; }
            }
            if (!matchedMgr) return 'Incorrect PIN';

            await ManagerAuth.respondMobileRequest(reqId, true, pin);
            _toast('Approved ✅', 'success');
            return null; /* success */
          } catch (e) {
            return e.message;
          }
        });
      }

      async function denyReq(reqId) {
        if (!(await SK.dialog.confirm('Deny this authorization request?', null, null, { title: 'Deny request', variant: 'danger', confirmLabel: 'Deny' }))) return;
        try {
          const db = _fdb();
          if (!db) throw new Error('No network');
          await db.collection('managerAuthRequests').doc(reqId).update({
            status: 'denied',
            respondedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          _toast('Request denied', 'info');
        } catch (e) {
          _toast(e.message, 'error');
        }
      }

      /* ── PIN confirm overlay (for manager to verify their own identity) ── */
      async function _sha256(text) {
        const buf = new TextEncoder().encode(text);
        const h   = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function _showPINConfirm(onSubmit) {
        const ov = document.createElement('div');
        ov.className = 'pin-overlay';
        let digits = '';
        const dots = Array.from({ length: 6 }, (_, i) => `<div class="pin-dot" id="pind${i}"></div>`).join('');
        ov.innerHTML = `<div class="pin-sheet">
            <div class="pin-drag"></div>
            <div class="pin-title">Enter Your Manager PIN</div>
            <div class="pin-dots">${dots}</div>
            <div class="pin-kp" id="pin-confirm-kp">
              ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-k="${n}">${n}</button>`).join('')}
              <button class="pin-key" data-k="clr" style="font-size:12px;font-weight:700">CLR</button>
              <button class="pin-key" data-k="0">0</button>
              <button class="pin-key del" data-k="del">⌫</button>
            </div>
            <div class="pin-err" id="pin-err"></div>
            <button class="pin-cancel-btn" id="pin-cancel">Cancel</button>
          </div>`;
        document.body.appendChild(ov);

        function updateDots() {
          for (let i = 0; i < 6; i++) {
            const d = ov.querySelector('#pind' + i);
            if (d) { d.classList.toggle('f', i < digits.length); d.classList.remove('x'); }
          }
        }

        function flash() {
          ov.querySelectorAll('.pin-dot').forEach(d => d.classList.add('x'));
          setTimeout(() => ov.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('x', 'f')), 500);
        }

        ov.querySelector('#pin-confirm-kp').addEventListener('click', async e => {
          const btn = e.target.closest('[data-k]');
          if (!btn) return;
          const k = btn.dataset.k;
          if (k === 'del')      { digits = digits.slice(0, -1); updateDots(); }
          else if (k === 'clr') { digits = ''; updateDots(); }
          else if (digits.length < 6) {
            digits += k;
            updateDots();
            if (digits.length >= 4) {
              const errMsg = await onSubmit(digits);
              if (errMsg === null) { ov.remove(); }
              else { digits = ''; flash(); ov.querySelector('#pin-err').textContent = errMsg; }
            }
          }
        });
        ov.querySelector('#pin-cancel').onclick = () => ov.remove();
        ov.querySelector('#pin-confirm-kp').addEventListener('touchstart', e => e.preventDefault(), { passive: false });
      }

      /* ── Audit log ── */
      async function loadAudit() {
        const list   = document.getElementById('audit-list');
        const count  = document.getElementById('audit-count');
        list.innerHTML = '<div style="color:var(--txt2);text-align:center;padding:20px">Loading…</div>';
        try {
          const entries = await ManagerAuth.getAuditLog(100);
          count.textContent = entries.length + ' entries';
          if (!entries.length) {
            list.innerHTML = '<div class="empty"><div class="empty-ico">📋</div><p>No audit entries yet</p></div>';
            return;
          }
          list.innerHTML = `<div class="card" style="padding:0 14px">
              ${entries.map(e => {
                const opMeta = OPS_META[e.operation] || { icon: '🔐', label: e.operation };
                const d = new Date(e.requestedAt);
                const timeStr = d.toLocaleString('en-KE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
                const methods = { pin:'🔢', qr:'📷', nfc:'📡', mobile:'📱', biometric:'👁', unknown:'❓' };
                return `<div class="audit-row">
                    <div class="audit-ico">${_escH(opMeta.icon)}</div>
                    <div class="audit-info">
                      <div class="audit-op">${_escH(opMeta.label)}</div>
                      <div class="audit-meta">
                        ${methods[e.method] || '❓'} ${_escH(e.method)} · by ${_escH(e.cashierName || 'unknown')}
                        ${e.managerName ? ` · approved by ${_escH(e.managerName)}` : ''}
                        · ${_escH(timeStr)}
                      </div>
                    </div>
                    <div class="audit-status ${_escH(e.status)}">${_escH((e.status || 'unknown').toUpperCase())}</div>
                  </div>`;
              }).join('')}
            </div>`;
        } catch (err) {
          list.innerHTML = `<div class="empty"><div class="empty-ico">⚠</div><p>${_escH(err.message)}</p></div>`;
        }
      }

      /* ── Init ── */
      async function init() {
        renderOpsChecks();
        loadApprovals();

        /* Network status indicator */
        const badge = document.getElementById('hdr-badge');
        if (navigator.onLine) {
          badge.textContent = _fdb() ? 'LIVE' : 'ONLINE';
        } else {
          badge.textContent = 'OFFLINE';
          badge.style.background = 'rgba(239,68,68,.12)';
          badge.style.color = 'var(--red)';
        }
      }

      document.addEventListener('DOMContentLoaded', init);

      return {
        loadApprovals,
        loadManagers,
        loadAudit,
        addManager,
        deleteManager,
        showMgrDetail,
        closeMgrDetail,
        enrollBiometric,
        enrollNFC,
        changePin,
        approveReq,
        denyReq,
        printQR,
      };

    })();
  </script>

  <!-- Optional: qrcodejs for better QR rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" async></script>
