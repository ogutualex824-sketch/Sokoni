<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:white;min-height:100vh;padding-bottom:80px;}
.tn-nav{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(8,8,8,0.97);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);}
.tn-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:16px;flex-shrink:0;}
.tn-nav-title{font-size:14px;font-weight:800;flex:1;}
.tn-hero{padding:20px 16px 16px;background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(8,8,8,0));}
.tn-sport-icon{font-size:48px;margin-bottom:10px;}
.tn-name{font-size:22px;font-weight:900;line-height:1.2;margin-bottom:6px;}
.tn-meta{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.8;}
.tn-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.tn-badge{padding:4px 10px;border-radius:7px;font-size:10px;font-weight:900;}
.tn-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);}
.tn-stat{text-align:center;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 8px;}
.tn-stat-num{font-size:20px;font-weight:900;color:#f59e0b;}
.tn-stat-lbl{font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px;}
.tn-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);}
.tn-tabs::-webkit-scrollbar{display:none;}
.tn-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .2s;}
.tn-tab.active{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.35);color:#f59e0b;}
.tn-body{padding:16px;}
/* FIXTURE */
.fix-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;margin-bottom:10px;}
.fix-teams{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fix-team{flex:1;text-align:center;}
.fix-team-name{font-size:12px;font-weight:800;margin-bottom:3px;}
.fix-team-icon{font-size:28px;margin-bottom:4px;}
.fix-score{font-size:22px;font-weight:900;color:#f59e0b;text-align:center;min-width:60px;}
.fix-score-dash{font-size:18px;color:rgba(255,255,255,0.2);margin:0 4px;}
.fix-meta{text-align:center;margin-top:10px;font-size:10px;color:rgba(255,255,255,0.35);}
.fix-status{display:inline-block;padding:3px 8px;border-radius:5px;font-size:9px;font-weight:900;margin-top:4px;}
/* STANDINGS */
.std-table{width:100%;border-collapse:collapse;}
.std-table th{font-size:9px;color:rgba(255,255,255,0.3);font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);}
.std-table th:first-child{text-align:left;padding-left:8px;}
.std-table td{font-size:11px;padding:10px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);}
.std-table td:first-child{text-align:left;padding-left:8px;display:flex;align-items:center;gap:8px;}
.std-pos{font-size:12px;font-weight:900;color:#f59e0b;min-width:16px;}
.std-team-icon{font-size:16px;}
.std-team-name{font-size:11px;font-weight:700;}
.std-pts{font-size:13px;font-weight:900;color:#f59e0b;}
/* TEAMS REGISTERED */
.reg-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.reg-icon{font-size:28px;}
.reg-name{font-size:12px;font-weight:800;}
.reg-meta{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px;}
/* AWARDS */
.award-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;}
.award-icon{font-size:36px;flex-shrink:0;}
.award-name{font-size:13px;font-weight:800;}
.award-val{font-size:12px;color:#f59e0b;font-weight:700;margin-top:3px;}
.award-desc{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;}
/* REGISTER BUTTON */
.tn-register-bar{position:sticky;bottom:65px;left:0;right:0;padding:10px 16px;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.07);z-index:40;}
.tn-register-btn{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:#050505;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;}
.tn-register-btn:disabled{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);cursor:not-allowed;}
/* MODAL */
.tn-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.tn-modal-overlay.open{display:flex;}
.tn-modal{background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;}
.tn-modal-title{font-size:16px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.tn-modal-close{background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:30px;height:30px;color:white;font-size:16px;cursor:pointer;}
.tn-field{margin-bottom:14px;}
.tn-field label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.tn-field input,.tn-field select,.tn-field textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:16px;font-family:inherit;}
.tn-field input:focus,.tn-field select:focus,.tn-field textarea:focus{outline:none;border-color:rgba(245,158,11,0.4);}
.tn-field select option{background:#111;}
.tn-submit-btn{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:#050505;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:4px;}
.empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.3);}
</style>

<nav class="tn-nav">
  <a href="sports-hub.html" class="tn-back" aria-label="Back to Sports Hub">←</a>
  <span class="tn-nav-title" id="pageTitle">Tournament</span>
  <button onclick="openShareModal()" aria-label="Share" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:white;">📤</button>

<div id="mainContent"><div class="empty" role="status">Loading…</div></div>

<!-- REGISTER BAR (shown only while the server says registration is open) -->
<div class="tn-register-bar" id="registerBar" style="display:none;">
  <button class="tn-register-btn" id="registerBtn" onclick="openRegisterModal()">🏆 Register Your Team</button>
</div>

<!-- BOTTOM NAV -->
<nav style="position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0;z-index:50;backdrop-filter:blur(16px);">
  <a href="/" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-home" style="font-size:18px;"></i><span>Home</span></a>
  <a href="sports-hub.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#f59e0b;text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-trophy" style="font-size:18px;"></i><span>Sports</span></a>
  <a href="javascript:void(0)" role="button" onclick="openRegisterModal();" aria-label="Register for tournament" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-plus-circle" style="font-size:18px;" aria-hidden="true"></i><span>Register</span></a>
  <a href="merchant-v2.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-users" style="font-size:18px;"></i><span>My Team</span></a>
</nav>

<!-- REGISTER MODAL -->
<div class="tn-modal-overlay" id="registerModal">
  <div class="tn-modal" role="dialog" aria-modal="true" aria-label="Register for tournament">
    <div class="tn-modal-title">🏆 Register for Tournament<button class="tn-modal-close" aria-label="Close" onclick="closeModal('registerModal')">✕</button></div>
    <div id="registerModalBody"></div>
  </div>
</div>

<script>
const S = window.SokoniSports;
const esc = S.esc;
const params = new URLSearchParams(location.search);
const TN_ID = params.get('id') || '';
let tn = null;          /* tournament.view → tournament */
let fixtures = [];      /* tournament.view → fixtures */
let openInfo = null;    /* tournaments.open entry (capacity, fee, deadlines) — only while registration is open */
let names = {};         /* teamId → name from teams.directory */
let activeTab = 'overview';

function notFound(msg) {
  document.getElementById('mainContent').innerHTML = '<div class="empty"><div style="font-size:48px;margin-bottom:12px;">🏆</div><p>' + esc(msg) + '</p><a href="sports-hub.html" style="color:#f59e0b;">← Back to Sports Hub</a></div>';
}

async function init() {
  if (!TN_ID) { notFound('Tournament not found.'); return; }
  document.getElementById('mainContent').innerHTML = '<div class="empty" role="status">Loading…</div>';
  let view;
  try {
    [view, openInfo, names] = await Promise.all([
      S.getTournamentView(TN_ID),
      S.getOpenTournament(TN_ID).catch(() => null),
      S.teamNameMap(),
    ]);
  } catch (e) {
    const code = e && e.code ? String(e.code) : '';
    if (/not-found|failed-precondition/.test(code)) { notFound(S.serverMessage(e)); return; }
    document.getElementById('mainContent').innerHTML = '<div class="empty"><p>Couldn\'t load — <button onclick="init()" style="background:none;border:none;color:#f59e0b;font:inherit;font-weight:800;cursor:pointer;">try again</button></p></div>';
    return;
  }
  tn = view && view.tournament;
  fixtures = (view && view.fixtures) || [];
  if (!tn) { notFound('Tournament not found.'); return; }
  document.title = (tn.name || 'Tournament') + ' — SOKONI Sports';
  document.getElementById('pageTitle').textContent = tn.name || 'Tournament';
  document.getElementById('mainContent').innerHTML = '';
  renderHero();
  renderStats();
  renderTabs();
  renderContent(activeTab);
  document.getElementById('registerBar').style.display = isOpen() ? 'block' : 'none';
}

function isOpen() { return !!openInfo && tn && tn.status === 'registration_open'; }
function standingsRows() {
  const s = (tn && tn.standings) || {};
  return Object.keys(s).map(k => Object.assign({ teamId: k }, s[k]))
    .sort((a, b) => ((b.pts || 0) - (a.pts || 0)) || (((b.gf || 0) - (b.ga || 0)) - ((a.gf || 0) - (a.ga || 0))));
}
function feeLabel() {
  if (!openInfo || openInfo.entryFeeKES == null) return '—';
  return Number(openInfo.entryFeeKES) > 0 ? 'KES ' + S.fmt(openInfo.entryFeeKES) : 'Free';
}

function renderHero() {
  const sc = S.sportColor(tn.sport);
  const sb = S.statusBadge(tn.status);
  const el = document.getElementById('mainContent');
  const heroDiv = document.createElement('div');
  heroDiv.className = 'tn-hero';
  heroDiv.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
  heroDiv.innerHTML = `
    <div class="tn-sport-icon">${S.sportIcon(tn.sport)}</div>
    <div class="tn-name">${esc(tn.name)}</div>
    <div class="tn-meta">🗓 Starts ${esc(S.when(tn.startsAt))}</div>
    <div class="tn-badges">
      <span class="tn-badge" style="background:${sb.c}15;border:1px solid ${sb.c}30;color:${sb.c};">${esc(sb.l)}</span>
      <span class="tn-badge" style="background:${sc}15;border:1px solid ${sc}25;color:${sc};">${S.sportIcon(tn.sport)} ${esc(tn.sport || '—')}</span>
      ${isOpen() ? `<span class="tn-badge" style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);color:#f59e0b;">Entry: ${esc(feeLabel())}</span>` : ''}
    </div>`;
  el.appendChild(heroDiv);
  const statsDiv = document.createElement('div'); statsDiv.id = 'tnStats'; el.appendChild(statsDiv);
  const tabsDiv = document.createElement('div'); tabsDiv.id = 'tnTabs'; el.appendChild(tabsDiv);
  const bodyDiv = document.createElement('div'); bodyDiv.className = 'tn-body'; bodyDiv.id = 'tnBody'; el.appendChild(bodyDiv);
}

/* Every figure is a server fact; unknown is '—'. */
function renderStats() {
  const rows = standingsRows();
  document.getElementById('tnStats').innerHTML = `
    <div class="tn-stats">
      <div class="tn-stat"><div class="tn-stat-num">${rows.length ? rows.length : '—'}</div><div class="tn-stat-lbl">Teams in table</div></div>
      <div class="tn-stat"><div class="tn-stat-num">${openInfo ? esc(S.fmt(openInfo.capacity)) : '—'}</div><div class="tn-stat-lbl">Team capacity</div></div>
      <div class="tn-stat"><div class="tn-stat-num">${fixtures.length ? fixtures.length : '—'}</div><div class="tn-stat-lbl">Fixtures</div></div>
    </div>`;
}

const TAB_LIST = [
  {id:'overview',  label:'📋 Overview'},
  {id:'fixtures',  label:'📅 Fixtures'},
  {id:'standings', label:'📊 Standings'},
  {id:'teams',     label:'🤝 Teams'},
];

function renderTabs() {
  document.getElementById('tnTabs').innerHTML = `<div class="tn-tabs">${TAB_LIST.map(t=>
    `<button class="tn-tab${t.id===activeTab?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('')}</div>`;
}

function switchTab(tab) { activeTab = tab; renderTabs(); renderContent(tab); }

function renderContent(tab) {
  const el = document.getElementById('tnBody');
  if (tab === 'overview') renderOverview(el);
  else if (tab === 'fixtures') renderFixtures(el);
  else if (tab === 'standings') renderStandings(el);
  else if (tab === 'teams') renderTeams(el);
}

function renderOverview(el) {
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      ${infoBox('🏅 Status', S.statusBadge(tn.status).l)}
      ${infoBox('📅 Starts', S.when(tn.startsAt))}
      ${infoBox('💰 Entry', feeLabel())}
      ${infoBox('🤝 Team capacity', openInfo ? S.fmt(openInfo.capacity) : '—')}
      ${infoBox('🟢 Registration opens', openInfo ? S.when(openInfo.regOpensAt) : '—')}
      ${infoBox('🔴 Registration closes', openInfo ? S.when(openInfo.regClosesAt) : '—')}
    </div>
    ${isOpen() ? `
    <div style="background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.15);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;">
      <div style="font-size:14px;font-weight:900;color:#f59e0b;">Registration is open</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;">The captain or manager of an approved ${esc(tn.sport || '')} team can register it. The organiser confirms each entry.</div>
      <button onclick="openRegisterModal()" style="margin-top:10px;padding:10px 24px;background:#f59e0b;border:none;border-radius:10px;color:#050505;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;">🏆 Register Now</button>
    </div>` : tn.status === 'in_progress' ? `
    <div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.15);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;">
      <div style="font-size:14px;font-weight:900;color:#22c55e;">Tournament In Progress</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;">Check the Fixtures &amp; Standings tabs. Results appear once both sides (or the organiser) confirm them.</div>
    </div>` : ''}`;
}

function infoBox(label, value) {
  return `<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;">
    <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:3px;">${esc(label)}</div>
    <div style="font-size:12px;font-weight:800;">${esc(value == null || value === '' ? '—' : value)}</div>
  </div>`;
}

function renderFixtures(el) {
  if (!fixtures.length) {
    el.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:10px;">📅</div><p style="font-weight:700;">No data yet</p><p style="font-size:11px;margin-top:6px;">Fixtures appear once the organiser publishes them.</p></div>`;
    return;
  }
  const grouped = {};
  fixtures.slice().sort((a, b) => (Number(a.round) || 0) - (Number(b.round) || 0) || (Number(a.startsAt) || 0) - (Number(b.startsAt) || 0))
    .forEach(f => { const r = f.round != null ? 'Round ' + f.round : 'Fixtures'; (grouped[r] = grouped[r] || []).push(f); });
  el.innerHTML = Object.entries(grouped).map(([round, matches], gi) => `
    <div style="font-size:12px;font-weight:900;color:rgba(255,255,255,0.4);margin-bottom:8px;margin-top:${gi === 0 ? 0 : 16}px;">${esc(round)}</div>
    ${matches.map(f => {
      const hasResult = !!f.result;
      const live = f.status === 'live';
      const sb = S.statusBadge(f.status);
      const sc = live ? '#22c55e' : hasResult ? 'rgba(255,255,255,0.4)' : sb.c;
      const sl = live ? 'LIVE' : hasResult ? 'FT' : sb.l;
      return `<div class="fix-card">
        <div class="fix-teams">
          <div class="fix-team">
            <div class="fix-team-icon">${S.sportIcon(tn.sport)}</div>
            <div class="fix-team-name">${esc(S.teamLabel(names, f.homeTeamId))}</div>
          </div>
          <div style="text-align:center;">
            ${hasResult
              ? `<div class="fix-score">${esc(f.result.home)}<span class="fix-score-dash">:</span>${esc(f.result.away)}</div>`
              : `<div style="font-size:18px;color:rgba(255,255,255,0.2);font-weight:700;">VS</div>`}
            <div class="fix-status" style="background:${sc}15;border:1px solid ${sc}25;color:${sc};">${esc(sl)}</div>
          </div>
          <div class="fix-team">
            <div class="fix-team-icon">${S.sportIcon(tn.sport)}</div>
            <div class="fix-team-name">${esc(S.teamLabel(names, f.awayTeamId))}</div>
          </div>
        </div>
        <div class="fix-meta">🗓 ${esc(S.when(f.startsAt))}</div>
      </div>`;
    }).join('')}`).join('');
}

function renderStandings(el) {
  const rows = standingsRows();
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:10px;">📊</div><p style="font-weight:700;">No data yet</p><p style="font-size:11px;margin-top:6px;">Standings appear once fixtures are published and results confirmed.</p></div>`;
    return;
  }
  const n = v => (v == null || isNaN(Number(v))) ? '—' : Number(v);
  el.innerHTML = `
    <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;">
      <table class="std-table">
        <thead>
          <tr>
            <th style="text-align:left;padding-left:12px;">#  Team</th>
            <th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((row, i) => {
            const gd = (row.gf == null || row.ga == null) ? null : Number(row.gf) - Number(row.ga);
            return `<tr style="${i===0?'background:rgba(245,158,11,0.04)':''}">
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span class="std-pos" style="color:${i===0?'#f59e0b':i===1?'rgba(255,255,255,0.6)':i===2?'#f97316':'rgba(255,255,255,0.3)'}">${i+1}</span>
                  <span style="font-size:14px;">${S.sportIcon(tn.sport)}</span>
                  <span class="std-team-name">${esc(S.teamLabel(names, row.teamId))}</span>
                </div>
              </td>
              <td>${n(row.p)}</td>
              <td style="color:#22c55e;font-weight:700;">${n(row.w)}</td>
              <td>${n(row.d)}</td>
              <td style="color:#ef4444;font-weight:700;">${n(row.l)}</td>
              <td style="color:${(gd||0)>=0?'#22c55e':'#ef4444'};">${gd == null ? '—' : (gd > 0 ? '+' : '') + gd}</td>
              <td class="std-pts">${n(row.pts)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.25);margin-top:10px;text-align:center;">P=Played · W=Won · D=Draw · L=Lost · GD=Goal Difference · Pts=Points</div>`;
}

/* Teams = the teams the server places in this tournament (standings + fixtures). */
function renderTeams(el) {
  const ids = new Set(standingsRows().map(r => r.teamId));
  fixtures.forEach(f => { if (f.homeTeamId) ids.add(f.homeTeamId); if (f.awayTeamId) ids.add(f.awayTeamId); });
  if (!ids.size) {
    el.innerHTML = `<div class="empty"><div style="font-size:40px;margin-bottom:10px;">🤝</div><p style="font-weight:700;">No data yet</p><p style="font-size:11px;margin-top:6px;">Teams appear here once the organiser publishes fixtures.</p></div>
      ${isOpen()?`<div style="text-align:center;margin-top:14px;"><button onclick="openRegisterModal()" style="padding:12px 28px;background:#f59e0b;border:none;border-radius:10px;color:#050505;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;">🏆 Register Your Team</button></div>`:''}`;
    return;
  }
  el.innerHTML = [...ids].map(id => `<div class="reg-card">
      <div class="reg-icon">${S.sportIcon(tn.sport)}</div>
      <div><div class="reg-name">${esc(S.teamLabel(names, id))}</div><div class="reg-meta">${esc(tn.sport || '—')}</div></div>
    </div>`).join('');
}

/* registration.apply — the server decides eligibility; success is shown only after it accepts. */
async function openRegisterModal() {
  if (!tn) return;
  const body = document.getElementById('registerModalBody');
  document.getElementById('registerModal').classList.add('open');
  const head = `<div style="background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.15);border-radius:10px;padding:12px;margin-bottom:16px;text-align:center;">
      <div style="font-size:13px;font-weight:900;color:#f59e0b;">${esc(tn.name)}</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;">Entry: ${esc(feeLabel())} · Registration closes ${esc(openInfo ? S.when(openInfo.regClosesAt) : '—')}</div>
    </div>`;
  if (!isOpen()) { body.innerHTML = head + '<div class="empty"><p>Registration is not open for this tournament.</p></div>'; return; }
  body.innerHTML = head + '<div class="empty" role="status">Loading…</div>';
  const user = await S.currentUser();
  if (!user) {
    body.innerHTML = head + `<div class="empty"><p style="font-weight:700;">Sign in to register your team</p><p style="font-size:11px;margin-top:6px;">Only the captain or a manager of an approved team can register it.</p></div>
      <a href="login.html?redirect=${encodeURIComponent(location.pathname + location.search)}" class="tn-submit-btn" style="display:block;text-align:center;text-decoration:none;">Sign in</a>`;
    return;
  }
  let teams;
  try { teams = await S.getEligibleTeams(tn.sport); }
  catch (e) { body.innerHTML = head + '<div class="empty"><p>Couldn\'t load your teams — <button onclick="openRegisterModal()" style="background:none;border:none;color:#f59e0b;font:inherit;font-weight:800;cursor:pointer;">try again</button></p></div>'; return; }
  if (!teams || !teams.length) {
    body.innerHTML = head + `<div class="empty"><p style="font-weight:700;">No eligible team</p><p style="font-size:11px;margin-top:6px;line-height:1.6;">You need to captain or manage an <b>approved</b> ${esc(tn.sport || '')} team. Register one on the <a href="sports-hub.html" style="color:#f59e0b;">Sports Hub</a> — it can enter once SOKONI approves it.</p></div>`;
    return;
  }
  body.innerHTML = head + `
    <div class="tn-field"><label for="rg_team">Team</label>
      <select id="rg_team" style="font-size:16px;">${teams.map(t => `<option value="${esc(t.teamId)}">${esc(t.name)}</option>`).join('')}</select>
    </div>
    <button class="tn-submit-btn" id="rg_submit" onclick="submitRegistration()">🏆 Submit Registration</button>
    <div id="rg_msg" role="status" style="font-size:12px;color:rgba(255,255,255,0.55);text-align:center;margin-top:10px;line-height:1.5;">The organiser confirms each entry.${openInfo && Number(openInfo.entryFeeKES) > 0 ? ' Entry-fee payment is not live yet, so a paid entry stays pending until it is.' : ''}</div>`;
}

async function submitRegistration() {
  const sel = document.getElementById('rg_team');
  const btn = document.getElementById('rg_submit');
  const msg = document.getElementById('rg_msg');
  if (!sel || !sel.value) return;
  btn.disabled = true; msg.textContent = 'Submitting…';
  try {
    const r = await S.registerForTournament({ tournamentId: TN_ID, teamId: sel.value });
    msg.innerHTML = r && r.status === 'pending_payment'
      ? '✅ <b>Registration recorded</b> — awaiting entry-fee payment (not live yet). Track it in your <a href="merchant-v2.html" style="color:#f59e0b;">Sports workspace</a>.'
      : '✅ <b>Registration sent to the organiser</b> for confirmation. Track it in your <a href="merchant-v2.html" style="color:#f59e0b;">Sports workspace</a>.';
    btn.style.display = 'none';
  } catch (e) {
    msg.textContent = 'Not registered: ' + S.serverMessage(e);
    btn.disabled = false;
  }
}

function openShareModal() {
  const url = location.href;
  const text = `Check out ${tn ? tn.name : 'this tournament'} on SOKONI Sports Hub!`;
  if (navigator.share) {
    navigator.share({title: (tn && tn.name) || 'SOKONI Sports', text, url}).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(()=>(window._skToast||alert)('Tournament link copied!')).catch(()=>{});
  }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.addEventListener('click', e => {
  const modal = document.getElementById('registerModal');
  if (e.target === modal) modal.classList.remove('open');
});

init();
</script>
