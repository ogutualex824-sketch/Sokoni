<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="security.js"></script>
  <!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
       through SokoniCart; without this tag the pip cannot render a count. -->
  <script src="sokoni-cart.js"></script>
  <script src="shared-header.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Route Planner &mdash; SOKONI Logistics</title>
  <meta name="theme-color" content="#050505">
  <style>
    :root{--bg:#050505;--surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.1);--accent:#71ff00;--info:#00bcd4;--warn:#ffb300;
      --danger:#f44336;--txt:#fff;--muted:rgba(255,255,255,.45);--radius:14px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
    input,select,button{font-family:inherit}
    #hdr{position:sticky;top:0;z-index:200;background:rgba(5,5,5,.97);
      border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
    #hdrLogo{font-size:18px;font-weight:900;background:linear-gradient(135deg,#71ff00,#00bcd4);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
    .back-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
    .hdr-btn{background:var(--accent);color:#000;border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:900;cursor:pointer;flex-shrink:0}
    .tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:100;background:rgba(5,5,5,.97)}
    .tab{flex:1;text-align:center;padding:12px;font-size:11px;font-weight:800;cursor:pointer;
      color:var(--muted);border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.4px;transition:all .15s}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .pane{padding:16px;max-width:900px;margin:0 auto;display:none}
    .pane.active{display:block}
    .shop-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:12px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .shop-bar label{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
    .shop-bar input{flex:1;min-width:100px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:13px;min-height:40px}
    .shop-bar button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
    /* Route cards */
    .r-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
    .r-card-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
    .r-info{flex:1}
    .r-name{font-size:14px;font-weight:800;margin-bottom:4px}
    .r-meta{font-size:12px;color:var(--muted)}
    .status-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase}
    .status-draft{background:rgba(255,255,255,.08);color:var(--muted)}
    .status-assigned{background:rgba(0,188,212,.12);color:var(--info)}
    .status-active{background:rgba(113,255,0,.12);color:var(--accent)}
    .status-completed{background:rgba(113,255,0,.06);color:rgba(113,255,0,.5)}
    .r-progress{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:10px}
    .r-progress-fill{height:100%;border-radius:3px;background:var(--accent)}
    .stop-list{margin-bottom:10px}
    .stop-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .stop-row:last-child{border-bottom:none}
    .stop-num{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
    .stop-num.delivered{background:rgba(113,255,0,.2);color:var(--accent)}
    .stop-num.failed{background:rgba(244,67,54,.2);color:var(--danger)}
    .stop-addr{flex:1;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .stop-customer{font-size:11px;color:var(--muted)}
    .stop-btn{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;
      border:1px solid var(--border);background:var(--surface2);color:var(--txt)}
    .r-actions{display:flex;gap:8px;flex-wrap:wrap}
    .r-btn{padding:8px 12px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;
      border:1px solid var(--border);background:var(--surface2);color:var(--txt)}
    .r-btn:hover{border-color:var(--accent);color:var(--accent)}
    .r-btn.optimize{color:var(--info);border-color:rgba(0,188,212,.3)}
    .r-btn:disabled{opacity:.4;cursor:not-allowed}
    /* Create form */
    .form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .form-section h3{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
    .fg label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
    .fg input{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:14px;width:100%;outline:none;min-height:44px}
    .fg input:focus{border-color:var(--accent)}
    .stop-entry{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative}
    .stop-entry-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .stop-entry-num{font-size:12px;font-weight:800;color:var(--accent);flex:1}
    .rm-stop-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:18px}
    .stop-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stop-inputs input{background:var(--bg);border:1px solid var(--border);border-radius:8px;
      padding:9px 10px;color:var(--txt);font-size:13px;width:100%;outline:none;min-height:38px}
    .add-stop-btn{background:var(--surface2);border:1px solid var(--accent);color:var(--accent);
      border-radius:9px;padding:10px;font-size:12px;font-weight:800;cursor:pointer;width:100%;margin-bottom:12px}
    .submit-btn{background:var(--accent);color:#000;border:none;border-radius:10px;padding:13px;
      font-size:14px;font-weight:900;cursor:pointer;width:100%;min-height:48px}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed}
    #toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%) translateY(20px);background:#1a1a1a;border:1px solid var(--border);
      padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;
      pointer-events:none;z-index:9999;white-space:nowrap;max-width:90vw;text-align:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #toast.success{border-color:var(--accent);color:var(--accent)}
    #toast.error{border-color:var(--danger);color:var(--danger)}
    .empty{text-align:center;padding:50px 24px;color:var(--muted)}
    .empty-icon{font-size:52px;margin-bottom:12px}
    .skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
      background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
<div id="hdr">
  <button class="back-btn" onclick="history.back()">&#8592;</button>
  <div id="hdrLogo">SOKONI</div>
  <span style="flex:1;font-size:14px;font-weight:800">Route Planner</span>
  <button class="hdr-btn" onclick="_switchTab(null,'create')">+ Route</button>
</div>
<div class="tabs">
  <div class="tab active" data-pane="routes" onclick="_switchTab(this,'routes')">Active Routes</div>
  <div class="tab" data-pane="create"        onclick="_switchTab(this,'create')">Create Route</div>
</div>

<div class="pane active" id="routesPane">
  <div class="shop-bar">
    <label>Shop</label>
    <input type="text" id="routeShopId" placeholder="Shop ID">
    <button onclick="_loadRoutes()">Load</button>
  </div>
  <div id="routeList"><div class="empty"><div class="empty-icon">&#x1F5FA;</div><p>Enter shop ID above</p></div></div>
</div>

<div class="pane" id="createPane">
  <div class="form-section">
    <h3>Route Details</h3>
    <div class="fg"><label>Shop ID *</label><input type="text" id="cShopId"></div>
    <div class="fg"><label>Route Name</label><input type="text" id="cName" placeholder="e.g. Westlands AM Run"></div>
    <div class="fg"><label>Date</label><input type="date" id="cDate"></div>
  </div>
  <div class="form-section">
    <h3>Stops <span style="color:var(--muted);font-weight:400;font-size:11px">(minimum 2)</span></h3>
    <div id="stopEntries"></div>
    <button class="add-stop-btn" onclick="_addStop()">+ Add Stop</button>
  </div>
  <button class="submit-btn" id="createRouteBtn" onclick="_createRoute()">Create Route</button>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-check-compat.js"></script>
<script src="sokoni-appcheck.js"></script>
<script src="sokoni-config.js"></script>
<script>
'use strict';
(function(){
var _uid=null,_stopCount=0;
function _cf(n){return firebase.functions().httpsCallable(n);}
function _esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function _toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'');clearTimeout(el._t);el._t=setTimeout(function(){el.className='';},3500);}
firebase.auth().onAuthStateChanged(function(u){_uid=u?u.uid:null;});
document.getElementById('cDate').value=new Date().toISOString().split('T')[0];
/* _addStop is a function EXPRESSION assigned to window below, so it does not
   hoist — calling it here threw "_addStop is not defined". Deferred to a
   microtask, which runs after this script block has finished executing. */
queueMicrotask(function(){ _addStop(); _addStop(); });

window._switchTab=function(el,pane){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  (el||document.querySelector('[data-pane="'+pane+'"]')).classList.add('active');
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('active');});
  document.getElementById(pane+'Pane').classList.add('active');
};

window._addStop=function(){
  _stopCount++;
  var div=document.createElement('div');
  div.className='stop-entry';div.id='s'+_stopCount;
  div.innerHTML='<div class="stop-entry-hdr"><span class="stop-entry-num">Stop '+_stopCount+'</span><button class="rm-stop-btn" onclick="_rmStop(\'s'+_stopCount+'\')">&#x2715;</button></div>'+
    '<div class="stop-inputs">'+
    '<input type="text" placeholder="Address" class="sAddr">'+
    '<input type="text" placeholder="Customer name" class="sCust">'+
    '<input type="tel"  placeholder="Phone" class="sPhone">'+
    '<input type="text" placeholder="Order ID (optional)" class="sOrder">'+
    '<input type="number" placeholder="Lat (e.g. -1.286)" class="sLat" step="any">'+
    '<input type="number" placeholder="Lng (e.g. 36.817)" class="sLng" step="any">'+
    '</div>';
  document.getElementById('stopEntries').appendChild(div);
};
window._rmStop=function(id){var el=document.getElementById(id);if(el)el.remove();};

window._createRoute=function(){
  if(!_uid){_toast('Sign in','error');return;}
  var shopId=document.getElementById('cShopId').value.trim();
  var name=document.getElementById('cName').value.trim();
  var date=document.getElementById('cDate').value;
  if(!shopId){_toast('Shop ID required','error');return;}
  var stops=[];
  document.querySelectorAll('.stop-entry').forEach(function(el){
    var addr=el.querySelector('.sAddr').value.trim();
    var lat=parseFloat(el.querySelector('.sLat').value)||0;
    var lng=parseFloat(el.querySelector('.sLng').value)||0;
    if(addr){stops.push({address:addr,customerName:el.querySelector('.sCust').value.trim(),
      customerPhone:el.querySelector('.sPhone').value.trim(),
      orderId:el.querySelector('.sOrder').value.trim()||null,lat:lat,lng:lng});}
  });
  if(stops.length<2){_toast('Add at least 2 stops','error');return;}
  var btn=document.getElementById('createRouteBtn');btn.disabled=true;btn.textContent='Creating...';
  _cf('routeCreate')({shopId:shopId,name:name||null,date:date,stops:stops})
    .then(function(r){
      _toast('Route created!','success');
      document.getElementById('routeShopId').value=shopId;
      _switchTab(null,'routes');_loadRoutes();
    }).catch(function(e){_toast(e.message,'error');}).finally(function(){btn.disabled=false;btn.textContent='Create Route';});
};

window._loadRoutes=function(){
  var shopId=document.getElementById('routeShopId').value.trim();
  if(!shopId){_toast('Enter shop ID','error');return;}
  var list=document.getElementById('routeList');
  list.innerHTML='<div class="skeleton" style="height:150px;margin-bottom:10px"></div>'.repeat(2);
  _cf('routeGetActive')({shopId:shopId}).then(function(r){
    var routes=r.data.routes||[];
    if(!routes.length){list.innerHTML='<div class="empty"><div class="empty-icon">&#x1F5FA;</div><p>No active routes</p></div>';return;}
    list.innerHTML=routes.map(function(route){
      var pct=route.totalStops?Math.round((route.completedStops/route.totalStops)*100):0;
      var stopsHtml=(route.stops||[]).slice(0,5).map(function(s){
        var numClass=s.status==='delivered'?'delivered':s.status==='failed'?'failed':'';
        return '<div class="stop-row"><div class="stop-num '+numClass+'">'+(s.index+1)+'</div>'+
          '<div><div class="stop-addr">'+_esc(s.address)+'</div>'+
          (s.customerName?'<div class="stop-customer">'+_esc(s.customerName)+'</div>':'')+
          '</div>'+
          (s.status==='pending'?'<button class="stop-btn" onclick="_markDelivered(\''+_esc(route.id)+'\',\''+_esc(shopId)+'\','+s.index+',this)">Delivered</button>':'<span style="font-size:11px;color:var(--muted)">'+s.status+'</span>')+
          '</div>';
      }).join('');
      return '<div class="r-card"><div class="r-card-hdr"><div class="r-info">'+
        '<div class="r-name">'+_esc(route.name)+'</div>'+
        '<div class="r-meta">'+route.totalStops+' stops &bull; '+route.completedStops+' done'+
        (route.estimatedDistanceKm?' &bull; ~'+route.estimatedDistanceKm+'km':'')+
        (route.assignedDriverName?' &bull; '+_esc(route.assignedDriverName):'')+'</div>'+
        '</div><span class="status-badge status-'+route.status+'">'+route.status+'</span></div>'+
        '<div class="r-progress"><div class="r-progress-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="stop-list">'+stopsHtml+'</div>'+
        '<div class="r-actions">'+
        (route.status==='draft'?'<button class="r-btn optimize" onclick="_optimize(\''+_esc(route.id)+'\',\''+_esc(shopId)+'\',this)">&#x2728; Optimize</button>':'')+
        '</div></div>';
    }).join('');
  }).catch(function(e){_toast(e.message,'error');});
};

window._optimize=function(routeId,shopId,btn){
  btn.disabled=true;btn.textContent='Optimizing...';
  _cf('routeOptimize')({shopId:shopId,routeId:routeId,keepFirst:true})
    .then(function(r){_toast('Optimized! Est. '+r.data.estimatedDistanceKm+'km','success');_loadRoutes();})
    .catch(function(e){_toast(e.message,'error');btn.disabled=false;btn.textContent='&#x2728; Optimize';});
};

window._markDelivered=function(routeId,shopId,stopIndex,btn){
  btn.disabled=true;btn.textContent='...';
  _cf('routeUpdateStop')({shopId:shopId,routeId:routeId,stopIndex:stopIndex,status:'delivered'})
    .then(function(){_loadRoutes();}).catch(function(e){_toast(e.message,'error');btn.disabled=false;btn.textContent='Delivered';});
};
})();
</script>
</body>
</html>
