<!DOCTYPE html>
<html lang="en" data-require-auth="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOKONI Delivery Hub</title>
  <meta name="description" content="SOKONI Delivery Hub — go online, take deliveries, drive, and track your earnings in one workspace.">
  <meta property="og:title" content="SOKONI Delivery Hub">
  <meta property="og:description" content="Rider workspace: available deliveries, Rider Drive, earnings and your rider application.">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/logosokoni.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOKONI">
  <script src="security.js"></script>
  <script type="module" src="firebase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="sokoni-auth-state.js"></script>
  <script src="sokoni-user-bootstrap.js" defer></script>
  <script src="sokoni-permissions.js"></script>
  <!-- Claim-verified workspace authority (unchanged from the old portal): driver.html → rider workspace;
       an account that is not a rider is sent to the ONE rider application (onboarding-driver.html). -->
  <script src="sokoni-role-authority.js"></script>
  <link rel="stylesheet" href="sokoni-rider-hub.css">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Delivery Rider — SOKONI Kenya","description":"Deliver with SOKONI: take marketplace, food, pharmacy and parcel deliveries from the SOKONI Delivery Hub. Apply online; earnings are shown per delivery before you accept.","hiringOrganization":{"@type":"Organization","name":"SOKONI","sameAs":"https://mysokoni.co.ke"},"employmentType":"CONTRACTOR","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"Kenya"},"datePosted":"2026-10-03"}</script>
</head>
<body>
<a class="sr-only" href="#dhMain">Skip to content</a>
<div class="dh-app" id="dhApp">

  <header class="dh-hdr">
    <button class="dh-hbtn" id="dhMenuBtn" type="button" aria-label="Open menu" aria-controls="dhSide" aria-expanded="false">☰</button>
    <div class="dh-title" id="dhTitle">Overview</div>
    <button class="dh-pres" id="dhPresChip" type="button" aria-live="polite" data-go="overview"><span class="dh-dot" id="dhPresDot"></span><span id="dhPresTxt">—</span></button>
  </header>

  <aside class="dh-side" id="dhSide" aria-label="Delivery Hub navigation">
    <div class="dh-brand"><img src="/assets/logosokoni.png" alt=""><div><b>SOKONI</b><small>DELIVERY HUB</small></div></div>
    <nav class="dh-nav" id="dhNav">
      <button class="dh-item" data-go="overview" type="button"><span class="ic">◉</span><span class="lb">Overview</span></button>
      <div class="dh-grp" data-grp="ops"><button class="dh-grp-h" type="button" aria-expanded="true">Operations <span aria-hidden="true">▾</span></button><div class="dh-grp-body">
        <button class="dh-item" data-go="drive" data-rider type="button"><span class="ic">🛵</span><span class="lb">Rider Drive</span><span class="dh-badge" id="dhBadgeDrive"></span></button>
        <button class="dh-item" data-go="available" data-rider type="button"><span class="ic">📋</span><span class="lb">Available Deliveries</span><span class="dh-badge" id="dhBadgeAvail"></span></button>
        <button class="dh-item" data-go="deliveries" data-rider type="button"><span class="ic">📦</span><span class="lb">My Deliveries</span></button>
        <button class="dh-item" data-go="map" data-rider type="button"><span class="ic">🗺️</span><span class="lb">Live Map</span></button>
      </div></div>
      <div class="dh-grp" data-grp="biz"><button class="dh-grp-h" type="button" aria-expanded="true">Business <span aria-hidden="true">▾</span></button><div class="dh-grp-body">
        <button class="dh-item" data-go="earnings" data-rider type="button"><span class="ic">💰</span><span class="lb">Earnings</span></button>
        <button class="dh-item" data-go="wallet" data-rider type="button"><span class="ic">👛</span><span class="lb">Wallet &amp; Settlements</span></button>
        <button class="dh-item" data-go="performance" data-rider type="button"><span class="ic">📈</span><span class="lb">Performance</span></button>
        <button class="dh-item" data-go="fuel" type="button"><span class="ic">⛽</span><span class="lb">Fuel (EPRA)</span></button>
      </div></div>
      <div class="dh-grp" data-grp="rider"><button class="dh-grp-h" type="button" aria-expanded="true">Rider <span aria-hidden="true">▾</span></button><div class="dh-grp-body">
        <button class="dh-item" data-go="categories" type="button"><span class="ic">🧭</span><span class="lb">Delivery Categories</span></button>
        <button class="dh-item" data-go="application" type="button"><span class="ic">📝</span><span class="lb">Application</span></button>
        <button class="dh-item" data-go="documents" type="button"><span class="ic">🪪</span><span class="lb">Documents &amp; Verification</span></button>
      </div></div>
      <div class="dh-grp" data-grp="acct"><button class="dh-grp-h" type="button" aria-expanded="true">Account <span aria-hidden="true">▾</span></button><div class="dh-grp-body">
        <button class="dh-item" data-go="notifications" type="button"><span class="ic">🔔</span><span class="lb">Notifications</span></button>
        <button class="dh-item" data-go="messages" type="button"><span class="ic">💬</span><span class="lb">Messages</span></button>
        <button class="dh-item" data-go="support" type="button"><span class="ic">🛟</span><span class="lb">Support</span></button>
        <button class="dh-item" data-go="settings" type="button"><span class="ic">⚙️</span><span class="lb">Settings</span></button>
      </div></div>
    </nav>
    <div class="dh-side-foot">
      <div class="dh-chip"><span class="dh-dot" id="dhSideDot"></span><span id="dhSidePres">Status unknown</span></div>
      <div class="dh-chip"><span>👤</span><span id="dhSideWho">—</span></div>
    </div>
  </aside>
  <div class="dh-scrim" id="dhScrim"></div>

  <main class="dh-main" id="dhMain" tabindex="-1">
    <section class="dh-view" data-view="overview" aria-label="Overview"></section>
    <section class="dh-view" data-view="drive" aria-label="Rider Drive"></section>
    <section class="dh-view" data-view="available" aria-label="Available deliveries"></section>
    <section class="dh-view" data-view="deliveries" aria-label="My deliveries"></section>
    <section class="dh-view" data-view="map" aria-label="Live map"></section>
    <section class="dh-view" data-view="earnings" aria-label="Earnings"></section>
    <section class="dh-view" data-view="wallet" aria-label="Wallet and settlements"></section>
    <section class="dh-view" data-view="performance" aria-label="Performance"></section>
    <section class="dh-view" data-view="fuel" aria-label="Fuel prices"></section>
    <section class="dh-view" data-view="categories" aria-label="Delivery categories"></section>
    <section class="dh-view" data-view="application" aria-label="Rider application"></section>
    <section class="dh-view" data-view="documents" aria-label="Documents and verification"></section>
    <section class="dh-view" data-view="notifications" aria-label="Notifications"></section>
    <section class="dh-view" data-view="messages" aria-label="Messages"></section>
    <section class="dh-view" data-view="support" aria-label="Support"></section>
    <section class="dh-view" data-view="settings" aria-label="Settings"></section>
  </main>

  <nav class="dh-bnav" aria-label="Quick navigation">
    <button type="button" data-go="overview"><span class="ic">◉</span>Overview</button>
    <button type="button" data-go="drive"><span class="ic">🛵</span>Drive</button>
    <button type="button" data-go="available"><span class="ic">📋</span>Jobs</button>
    <button type="button" data-go="earnings"><span class="ic">💰</span>Earnings</button>
    <button type="button" id="dhBnavMore"><span class="ic">☰</span>More</button>
  </nav>
</div>

<div class="dh-toast" id="dhToast" role="status" aria-live="polite"></div>
<div class="dh-modal" id="dhModal" role="dialog" aria-modal="true" aria-labelledby="dhModalTitle"><div class="dh-modal-box"><button class="dh-modal-x" type="button" id="dhModalX" aria-label="Close">✕</button><div id="dhModalBody"></div></div></div>

<script src="sokoni-geo.js"></script>
<script type="module" src="sokoni-rider-hub.js"></script>
<script src="sw-register.js" defer></script>
</body>
</html>
