<!DOCTYPE html>
<html lang="en">
<head>
<!-- In-shell boundary. The CLASS must land before first paint, or a module flashes its own
     chrome inside the merchant panel before it is suppressed. Inline = no network request.
     The full boundary (requireAuth + generic chrome rules) is deferred; only the flag is
     time-critical. Detection avoids a regex on purpose: an escaped one silently became a
     line comment once and disabled this everywhere. -->
<script>(function(){try{if(!window.parent||window.parent===window)return;var p=window.parent.location.pathname||"";var i=p.lastIndexOf("/");var last=(i<0?p:p.slice(i+1)).toLowerCase();if(last==="merchant"||last==="merchant.html"||window.parent.SokoniShell){document.documentElement.className+=" sk-in-shell";document.documentElement.setAttribute("data-sk-shell","merchant");}}catch(e){}})();</script>

<style>
:root{
  --bg:#050505; --sur:#0d0d0d; --sur2:#141414; --sur3:#1a1a1a;
  --g:#71ff00; --ga:rgba(113,255,0,.12); --bor:#1c1c1c;
  --txt:#e8e8e8; --sub:#8a8a8a; --dim:#5a5a5a;
  --warn:#ffb020; --bad:#ff5c5c; --ok:#71ff00;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); min-height:100vh;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  padding:16px 12px calc(90px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:19px;font-weight:900;letter-spacing:-.02em}
.hd .sub{font-size:12px;color:var(--sub);margin-top:2px}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
  background:var(--sur2);border:1px solid var(--bor);font-size:12px;font-weight:700;color:var(--sub);
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.pill.on{background:var(--ga);border-color:rgba(113,255,0,.35);color:var(--g)}
.pill .n{background:var(--sur3);border-radius:99px;padding:1px 7px;font-size:11px;color:var(--txt)}

.diag{
  display:none;margin-bottom:12px;padding:11px 14px;border-radius:10px;
  background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.28);
  color:var(--warn);font-size:12.5px;line-height:1.5;
}
.diag.on{display:block}

.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.col{
  flex:0 0 268px;background:var(--sur);border:1px solid var(--bor);
  border-radius:14px;padding:12px;scroll-snap-align:start;min-height:120px;
}
.col h2{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);
        display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.col h2 .c{background:var(--sur3);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--txt)}
.col.exc{border-color:rgba(255,92,92,.3)}
.col.exc h2{color:var(--bad)}

.card{
  background:var(--sur2);border:1px solid var(--bor);border-radius:11px;
  padding:11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;
}
.card:hover{border-color:#2c2c2c}
.card.stall{border-color:rgba(255,176,32,.45)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .no{font-size:13px;font-weight:800;letter-spacing:-.01em}
.card .amt{font-size:13px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}
.card .meta{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.6}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:5px;
     background:var(--sur3);color:var(--sub);text-transform:uppercase}
.tag.age{background:rgba(255,176,32,.13);color:var(--warn)}
.tag.pri{background:rgba(113,255,0,.13);color:var(--g)}
.tag.unk{background:rgba(255,92,92,.13);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{
  flex:1 1 auto;min-height:34px;padding:7px 10px;border-radius:8px;border:1px solid var(--bor);
  background:var(--sur3);color:var(--txt);font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.btn.p{background:var(--g);color:#000;border-color:var(--g)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.empty{text-align:center;padding:26px 10px;color:var(--dim);font-size:12px}
.load{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--sur3);border:1px solid var(--bor);color:var(--txt);
  padding:11px 18px;border-radius:10px;font-size:13px;z-index:9999;
  max-width:88vw;text-align:center;display:none;
}
@media(max-width:520px){ .col{flex:0 0 84vw} }
</style>
</head>
<body>

<div class="hd">
  <div>
    <h1>Fulfilment Board</h1>
    <div class="sub" id="sub">Loading orders…</div>
  </div>
  <button class="pill" id="refresh" type="button">↻ Refresh</button>
</div>

<div class="diag" id="diag"></div>

<div class="filters" id="filters"></div>

<div class="board" id="board"><div class="load">⟳ Loading…</div></div>

<div class="toast" id="toast"></div>

<script type="module" src="/firebase.js"></script>
<script src="/sokoni-fulfilment-lifecycle.js"></script>
<script src="/sokoni-receipt-engine.js"></script>
<script src="/sokoni-pos-print.js"></script>
<script>
(function () {
  'use strict';
  const L = window.SokoniLifecycle;

  /* ── Canonical stage -> notify.js ORDER_TIMELINE key ──────────────────────
     orderAdvance (notify.js:637) is the canonical transition path: it validates
     progression, appends to the order timeline and fires the customer
     notification. Writing order.status directly from here would bypass all three
     and duplicate logic the server already owns.

     This is an ADAPTER to an existing engine, not a new vocabulary — it maps
     canonical stages onto the keys that engine already accepts. Only the three
     stages a seller may drive are listed; beyond ready_for_pickup the rider and
     dispatch engine own progression. */
  const TIMELINE_KEY = { accepted: 'accepted', packing: 'preparing', ready_for_pickup: 'ready' };

  const $  = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const kes = (n) => 'KES ' + Number(n || 0).toLocaleString('en-KE');

  let ORDERS = [], FILTER = null, UNKNOWNS = [], busy = false;

  /* ── Automatic diagnostics ───────────────────────────────────────────────
     The pilot directive is that merchants must never collect technical
     information by hand. Every failure path below calls this, which attaches
     device, viewport, version, connectivity and order context automatically and
     posts it to logClientDiagnostic (-> errorLog, which post-launch-monitor
     already reads).

     Deliberately fire-and-forget and fully swallowed: telemetry must never break
     the board it is observing, and a merchant must never see a diagnostics
     error on top of the problem they already have. */
  const APP_VERSION = 'board-1.0';
  async function diag(severity, code, message, extra) {
    try {
      const { getFunctions, httpsCallable } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js');
      const fn = httpsCallable(getFunctions(window.firebaseApp, 'us-central1'), 'logClientDiagnostic');
      await fn({
        severity, code, message,
        surface:    'seller-board',
        appVersion: APP_VERSION,
        userAgent:  navigator.userAgent,
        viewport:   innerWidth + 'x' + innerHeight,
        online:     navigator.onLine,
        url:        location.pathname,
        merchantId: (window.firebaseAuth && window.firebaseAuth.currentUser || {}).uid || null,
        orderId:    (extra && extra.orderId) || null,
        context:    extra || {},
      });
    } catch (_) { /* never surfaced */ }
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  function ms(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (v.seconds) return v.seconds * 1000;
    const t = Date.parse(v); return isNaN(t) ? 0 : t;
  }

  function ageLabel(t) {
    if (!t) return '';
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    return h < 24 ? h + 'h' : Math.floor(h / 24) + 'd';
  }

  /* ── Wait for the deferred Firebase module ── */
  async function firebaseReady() {
    for (let i = 0; i < 100; i++) {
      if (window.firebaseApp && window.firebaseDB && window.firebaseAuth) return true;
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  }

  /* Resolve the CURRENT auth user only AFTER Firebase has restored the persisted session.
     Reading firebaseAuth.currentUser synchronously races session restore (it reads IndexedDB
     async), so a logged-in seller would read null and get bounced to /login. onAuthStateChanged
     fires once with the restored user (or null if genuinely logged out) — the canonical signal
     used across the seller/analytics/payments pages. */
  function awaitAuthUser() {
    const auth = window.firebaseAuth;
    return new Promise(resolve => {
      if (!auth) { resolve(null); return; }
      let settled = false;
      const finish = u => { if (settled) return; settled = true; resolve(u || null); };
      if (auth.currentUser) { finish(auth.currentUser); return; }   /* already restored */
      try {
        const unsub = auth.onAuthStateChanged(u => { try { unsub && unsub(); } catch (_) {} finish(u); });
      } catch (_) { finish(auth.currentUser); }
      /* Backstop so we never hang if the listener never fires. */
      setTimeout(() => finish(auth.currentUser), 6000);
    });
  }

  async function load() {
    if (!(await firebaseReady())) {
      $('board').innerHTML = '<div class="load">Could not reach SOKONI. Check your connection and refresh.</div>';
      return;
    }
    const user = await awaitAuthUser();
    if (!user) {
      /* In-shell this would replace the merchant's CONTENT PANEL with a login form, under the
         previous module's title — the merchant sees "Fulfilment" in the header and a login
         screen below it. The shell owns authentication and escalates the whole tab when its
         own session is genuinely gone. Standalone behaviour is unchanged. */
      if (window.SokoniInShell && SokoniInShell.inShell) {
        SokoniInShell.requireAuth(user, { redirect: 'fulfilment', onBlocked: function () {
          const b = $('board');
          if (b) b.innerHTML = '<div class="load">Session not ready — reopen SOKONI Merchant to continue.</div>';
        } });
        return;
      }
      location.href = '/login.html?next=/seller-fulfilment';
      return;
    }

    /* ── RBAC ────────────────────────────────────────────────────────────────
       Firestore rules already guarantee a non-seller's query returns nothing,
       so no data can leak. But rendering an empty merchant workspace to a buyer
       or rider is wrong on its own terms: it implies they have a seller account.

       This is a UX boundary layered ON TOP of the rules, never instead of
       them — the authorisation of record stays server-side. Seller identity is
       read the way auth.js:600 writes it (registeredAs.seller), with roles[] as
       the fallback for accounts created before that shape existed. */
    const cached = (() => { try { return JSON.parse(localStorage.getItem('sokoniUser') || '{}'); } catch (_) { return {}; } })();
    const isSeller = !!(cached.registeredAs && cached.registeredAs.seller)
                  || (Array.isArray(cached.roles) && cached.roles.includes('seller'))
                  || cached.role === 'seller';
    if (!isSeller) {
      $('board').innerHTML =
        '<div class="load">This workspace is for sellers.<br>' +
        '<a href="/sell" style="color:var(--g);font-weight:700">Open a shop on SOKONI →</a></div>';
      $('sub').textContent = 'Seller account required';
      $('filters').innerHTML = '';
      console.warn('[board] non-seller opened the fulfilment board', { uid: user.uid });
      return;
    }

    try {
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      /* sellerUid, NOT sellerId. firestore.rules:264-270 grants order reads on
         sellerUid, and checkout.html:1848/:2402 writes sellerUid. A query on
         sellerId would be refused by rules AND match nothing. */
      const q = fs.query(
        fs.collection(window.firebaseDB, 'orders'),
        fs.where('sellerUid', '==', user.uid),
        fs.orderBy('createdAt', 'desc'),
        fs.limit(200)
      );
      const snap = await fs.getDocs(q);
      ORDERS = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      render();
    } catch (e) {
      /* Distinguish the failure modes — they need different actions, and a
         single "could not load" hides which one happened.

         permission-denied  authorization, not connectivity. Almost always a
                            query/rules mismatch (this is exactly how the
                            sellerId-vs-sellerUid defect would present).
         failed-precondition Firestore wants a composite index for
                            sellerUid + createdAt. The console carries a
                            create-index link; the merchant must not see it.
         unavailable        offline. Recoverable, so say so. */
      const code = String((e && e.code) || '');
      console.error('[board] load failed', { code, message: e && e.message, uid: user.uid, e });

      let msg, detail = '';
      if (/permission-denied/.test(code)) {
        msg = 'You do not have access to these orders.';
        detail = 'If you believe this is wrong, contact support — this has been logged.';
      } else if (/failed-precondition/.test(code)) {
        msg = 'Orders are still being indexed.';
        detail = 'Please try again shortly. Support has been notified.';
      } else if (/unavailable|network/i.test(code + ' ' + (e && e.message))) {
        msg = 'You appear to be offline.';
        detail = 'The board will load when your connection returns.';
      } else {
        msg = 'Could not load orders.';
        detail = 'Please refresh. If this continues, contact support.';
      }
      $('board').innerHTML = '<div class="load">' + esc(msg) +
        '<br><span style="font-size:11px;color:#5a5a5a">' + esc(detail) + '</span></div>';
      $('sub').textContent = 'Not loaded';
      diag(/permission-denied/.test(code) ? 'critical' : 'error',
           code || 'board_load_failed', (e && e.message) || 'load failed',
           { orderCount: ORDERS.length });
    }
  }

  /* ── Exception queues are not lifecycle stages ── */
  const EXCEPTIONS = [
    { key: 'returned',  label: 'Returned',           test: (o) => L.resolveStage(o) === 'returned' },
    { key: 'stalled',   label: 'Stalled',            test: (o) => L.isStalled(L.resolveStage(o), ms(o.updatedAt || o.createdAt)) },
    { key: 'unknown',   label: 'Requires attention', test: (o) => L.resolveStage(o) === L.UNKNOWN },
  ];

  function render() {
    const board = $('board');
    UNKNOWNS = ORDERS.filter(o => L.resolveStage(o) === L.UNKNOWN);

    /* Diagnostics: surface unknown values, never show the raw value to the
       merchant. The raw value goes to the console for support. */
    const d = $('diag');
    if (UNKNOWNS.length) {
      d.classList.add('on');
      d.innerHTML = '⚠ ' + UNKNOWNS.length + ' order' + (UNKNOWNS.length > 1 ? 's' : '') +
        ' could not be placed in the workflow and need review. Support has been given the details.';
      diag('warn', 'unknown_lifecycle_value',
           UNKNOWNS.length + ' order(s) with an unrecognised stage',
           { ids: UNKNOWNS.slice(0,10).map(o => o.id),
             raw: UNKNOWNS.slice(0,10).map(o => o.timelineStage || o.deliveryStatus || o.status) });
      console.warn('[board] unrecognised lifecycle values', UNKNOWNS.map(o => ({
        id: o.id, status: o.status, deliveryStatus: o.deliveryStatus, timelineStage: o.timelineStage,
      })));
    } else { d.classList.remove('on'); }

    $('sub').textContent = ORDERS.length + ' order' + (ORDERS.length === 1 ? '' : 's') + ' · live';

    /* Filters */
    $('filters').innerHTML = EXCEPTIONS.map(x => {
      const n = ORDERS.filter(x.test).length;
      return '<button type="button" class="pill' + (FILTER === x.key ? ' on' : '') + '" data-f="' + x.key + '">' +
             esc(x.label) + ' <span class="n">' + n + '</span></button>';
    }).join('') + (FILTER ? '<button type="button" class="pill" data-f="">Clear</button>' : '');

    let list = ORDERS;
    if (FILTER) {
      const ex = EXCEPTIONS.find(x => x.key === FILTER);
      list = ex ? ORDERS.filter(ex.test) : ORDERS;
    }

    const cols = L.boardColumns();
    board.innerHTML = cols.map(c => {
      const items = list.filter(o => L.resolveStage(o) === c.stage);
      return '<div class="col"><h2>' + esc(c.label) + ' <span class="c">' + items.length + '</span></h2>' +
        (items.length ? items.map(cardHTML).join('') : '<div class="empty">Nothing here</div>') + '</div>';
    }).join('') +
    /* Returned is a dedicated exception queue, not a workflow column. */
    (() => {
      const r = list.filter(o => L.resolveStage(o) === 'returned');
      return '<div class="col exc"><h2>Returned <span class="c">' + r.length + '</span></h2>' +
        (r.length ? r.map(cardHTML).join('') : '<div class="empty">None</div>') + '</div>';
    })();
  }

  function cardHTML(o) {
    const stage   = L.resolveStage(o);
    const t       = ms(o.updatedAt || o.createdAt);
    const stalled = L.isStalled(stage, t);
    const method  = String(o.fulfilment || o.deliveryMethod || 'walkin');

    const tags = [];
    if (stalled)                       tags.push('<span class="tag age">' + esc(ageLabel(t)) + ' waiting</span>');
    if (o.priority && o.priority !== 'normal') tags.push('<span class="tag pri">' + esc(o.priority) + '</span>');
    if (stage === L.UNKNOWN)           tags.push('<span class="tag unk">Needs review</span>');
    tags.push('<span class="tag">' + esc(method) + '</span>');
    if (o.paymentMethod)               tags.push('<span class="tag">' + esc(o.paymentMethod) + '</span>');

    /* label() is the ONLY path a stage takes to the DOM — raw values such as
       driver_assigned or preparing can never reach a merchant's screen. */
    const acts = L.sellerActions(stage).map(a =>
      '<button type="button" class="btn p" data-adv="' + esc(o.id) + '" data-to="' + esc(a.stage) + '">' +
      esc(a.label) + '</button>').join('');

    const canPrint = ['packing', 'ready_for_pickup', 'assigned'].includes(stage);

    return '<div class="card' + (stalled ? ' stall' : '') + '">' +
      '<div class="top"><span class="no">' + esc(o.orderNo || o.id) + '</span>' +
      '<span class="amt">' + esc(kes(o.total || o.grandTotal)) + '</span></div>' +
      '<div class="meta">' + esc(o.recipientName || o.customerName || 'Customer') +
      (t ? ' · ' + esc(ageLabel(t)) + ' ago' : '') +
      '<br>' + esc(L.label(stage)) + (o.riderName ? ' · ' + esc(o.riderName) : '') + '</div>' +
      '<div class="tags">' + tags.join('') + '</div>' +
      '<div class="acts">' + acts +
      (canPrint ? '<button type="button" class="btn" data-print="' + esc(o.id) + '">🖨 Documents</button>' : '') +
      '</div></div>';
  }

  /* ── Actions ── */
  document.addEventListener('click', async (e) => {
    const f = e.target.closest('[data-f]');
    if (f) { FILTER = f.getAttribute('data-f') || null; render(); return; }

    const p = e.target.closest('[data-print]');
    if (p) return doPrint(p.getAttribute('data-print'));

    const a = e.target.closest('[data-adv]');
    if (a) return doAdvance(a.getAttribute('data-adv'), a.getAttribute('data-to'), a);
  });

  async function doAdvance(orderId, toStage, btn) {
    if (busy) return;
    const order = ORDERS.find(o => o.id === orderId);
    if (!order) return;

    /* Client-side guard mirrors the server's. The button should never exist for
       an invalid transition, so reaching this is a bug worth surfacing. */
    const from = L.resolveStage(order);
    if (!L.canAdvance(from, toStage)) { toast('That step is not available.'); return; }

    const key = TIMELINE_KEY[toStage];
    if (!key) { toast('That step is handled by the rider.'); return; }

    busy = true; if (btn) btn.disabled = true;
    try {
      const { getFunctions, httpsCallable } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js');
      const fn = httpsCallable(getFunctions(window.firebaseApp, 'us-central1'), 'orderAdvance');
      await fn({ orderId, stage: key });

      /* Optimistic: reflect immediately, then reconcile from the server. */
      order.timelineStage = key;
      render();
      toast(L.label(toStage));
      load();
    } catch (err) {
      console.error('[board] advance failed', err);
      diag('error', (err && err.code) || 'order_advance_failed',
           (err && err.message) || 'orderAdvance failed',
           { orderId, from, toStage, timelineKey: key });
      toast('Could not update: ' + ((err && err.message) || 'unknown error'));
    } finally { busy = false; if (btn) btn.disabled = false; }
  }

  async function doPrint(orderId) {
    const order = ORDERS.find(o => o.id === orderId);
    if (!order) return;
    const P = window.SokoniPosprint;
    if (!P || typeof P.printFulfilment !== 'function') { toast('Printing is not available on this device.'); return; }
    try {
      const { printed, skipped } = await P.printFulfilment(order);
      const parts = [];
      if (printed.length) parts.push(printed.length + ' sent to printer');
      /* Paperless is a setting, not a failure — say so plainly. */
      const off = skipped.filter(s => s.reason === 'paperless' || s.reason === 'disabled').length;
      if (off) parts.push(off + ' kept digital');
      const errs = skipped.filter(s => s.reason === 'error').length;
      if (errs) parts.push(errs + ' failed');
      toast(parts.join(' · ') || 'Nothing to print');
    } catch (e) {
      console.error('[board] print failed', e);
      diag('error', 'print_failed', (e && e.message) || 'print failed', { orderId });
      toast('Could not print. Documents are queued.');
    }
  }

  $('refresh').addEventListener('click', load);
  if (window.firebaseAuth) window.firebaseAuth.onAuthStateChanged
    ? window.firebaseAuth.onAuthStateChanged(() => load())
    : load();
  load();
})();
</script>
