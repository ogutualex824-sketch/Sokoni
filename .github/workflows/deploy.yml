name: Deploy — Staging → Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options: ["staging", "production", "rollback"]
      skip_tests:
        description: "Skip smoke tests (emergency only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write      # git push --tags on production release
  deployments: write   # GitHub environment deployment status
  pull-requests: write # future: staging preview URL on PRs

env:
  FIREBASE_PROJECT: sokoni-aeb26

jobs:
  # ─────────────────────────────────────────────────────────────
  # PRE-DEPLOY SAFETY GATE
  # Runs before staging so secrets are NOT scoped to any environment.
  # GitHub Actions linter requires secrets used in env-scoped jobs
  # to be defined in that environment — running the gate here avoids that.
  # ─────────────────────────────────────────────────────────────
  safety-gate:
    name: Pre-Deploy Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'staging' ||
        github.event.inputs.target == 'production'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci && cd functions && npm ci
      - name: Run pre-deploy gate
        run: node scripts/deploy/gate.js
        env:
          FIREBASE_PROJECT:                    ${{ env.FIREBASE_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          GATE_TIMEOUT_MINUTES: "10"

  # ─────────────────────────────────────────────────────────────
  # STAGING — Auto-deploys on every push to main.
  # Also runs for workflow_dispatch target=staging or target=production.
  # Does NOT run for target=rollback (rollback job runs independently).
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    needs: [safety-gate]
    if: >-
      always() &&
      needs.safety-gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target == 'staging' ||
         github.event.inputs.target == 'production')))
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci && cd functions && npm ci

      - name: CF syntax check
        run: node --check functions/index.js

      - name: Dependency vulnerability audit
        # --audit-level=high blocks on high+critical CVEs; moderate/low are reported only
        run: |
          npm audit --audit-level=high || true
          cd functions && npm audit --audit-level=high

      - name: Lint Cloud Functions
        # Uses npx so eslint doesn't need to be in devDependencies
        run: npx -y eslint@8 functions/index.js --max-warnings=0 || echo "::warning::ESLint reported issues in functions/index.js — review before merge"

      - name: Bump service worker cache version
        run: node scripts/deploy/bump-sw-version.js

      - name: Deploy to staging channel
        run: |
          npx -y firebase-tools hosting:channel:deploy staging \
            --project $FIREBASE_PROJECT \
            --expires 7d
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Cloud Functions (staging)
        run: |
          npx -y firebase-tools deploy --only functions \
            --project $FIREBASE_PROJECT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules + indexes
        run: |
          npx -y firebase-tools deploy --only firestore \
            --project $FIREBASE_PROJECT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # SMOKE TESTS AGAINST STAGING
  # ─────────────────────────────────────────────────────────────
  smoke-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-staging
    if: "!github.event.inputs.skip_tests"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against staging
        run: node test-smoke.js
        env:
          SMOKE_BASE_URL: "https://sokoni-aeb26--staging.web.app"

      - name: Health check — systemHealthCheck endpoint
        run: |
          echo "Waiting 30s for functions to warm up..."
          sleep 30
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            https://us-central1-sokoni-aeb26.cloudfunctions.net/systemHealthCheck)
          echo "HTTP status: $STATUS"
          cat /tmp/health.json | python3 -m json.tool 2>/dev/null || cat /tmp/health.json
          if [ "$STATUS" = "503" ]; then
            echo "❌ Health check UNHEALTHY (503) — deployment may have broken Firestore"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $STATUS)"

  # ─────────────────────────────────────────────────────────────
  # PRODUCTION — Requires manual approval gate + passing smoke tests.
  # Proceeds when smoke tests pass OR when explicitly skipped
  # via skip_tests=true (emergency deploy).
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: [deploy-staging, smoke-staging]
    # always() overrides the default "skip if needed job was skipped" behaviour,
    # which is what blocks the emergency path when skip_tests=true.
    # We gate manually on needs results to preserve all safety invariants.
    if: >-
      always() &&
      needs.deploy-staging.result == 'success' &&
      (needs.smoke-staging.result == 'success' || needs.smoke-staging.result == 'skipped') &&
      (github.event.inputs.target == 'production' || github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://mysokoni.co.ke
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci && cd functions && npm ci

      - name: Final CF syntax check
        run: node --check functions/index.js

      - name: Deploy hosting to production
        run: |
          npx -y firebase-tools hosting:clone \
            $FIREBASE_PROJECT:staging \
            $FIREBASE_PROJECT:live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Cloud Functions (production)
        run: |
          npx -y firebase-tools deploy --only functions \
            --project $FIREBASE_PROJECT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules + indexes
        run: |
          npx -y firebase-tools deploy --only firestore,storage \
            --project $FIREBASE_PROJECT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Apply Cloud Monitoring alert policies
        # Idempotent — gcloud upserts policies by displayName.
        # Requires two GitHub Actions secrets:
        #   GCP_SA_KEY             — service account JSON (roles/monitoring.alertPolicyEditor)
        #   GCP_MONITORING_CHANNEL_ID — notification channel name
        # One-time setup: see monitoring/alerts.json _notification_channels section.
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NOTIFICATION_CHANNEL_ID: ${{ secrets.GCP_MONITORING_CHANNEL_ID }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::warning::GCP_SA_KEY secret not set — alert policies NOT applied. Add GCP_SA_KEY and GCP_MONITORING_CHANNEL_ID as repository secrets."
            exit 0
          fi
          if [ -z "$NOTIFICATION_CHANNEL_ID" ]; then
            echo "::warning::GCP_MONITORING_CHANNEL_ID secret not set — alert policies NOT applied. See monitoring/alerts.json for setup steps."
            exit 0
          fi
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --quiet
          gcloud config set project $FIREBASE_PROJECT --quiet
          node monitoring/apply-alerts.js
          rm -f /tmp/gcp-key.json

      - name: Tag release
        run: |
          git config user.email "ci@mysokoni.co.ke"
          git config user.name "SOKONI CI"
          git tag -a "release-$(date +%Y%m%d-%H%M)" -m "Production deploy $(date)"
          git push --tags

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ SOKONI deployed to production — commit $COMMIT_SHA\"}" \
            || true

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ SOKONI production deploy FAILED — $COMMIT_SHA — manual rollback required\"}" \
            || true

  # ─────────────────────────────────────────────────────────────
  # ROLLBACK (manual trigger only — workflow_dispatch target=rollback)
  # Runs independently — no staging deploy is triggered alongside it.
  # ─────────────────────────────────────────────────────────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'rollback'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to previous hosting release
        run: |
          echo "Rolling back Firebase Hosting to previous release..."
          npx -y firebase-tools hosting:releases:list \
            --project $FIREBASE_PROJECT --limit 2 | \
            tail -1 | awk '{print $1}' | \
            xargs -I{} npx -y firebase-tools hosting:rollback --version {} \
            --project $FIREBASE_PROJECT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
