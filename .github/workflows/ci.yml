name: CI — Lint · Scan · Test

on:
  push:
    branches: ["main", "develop", "staging", "rc/**"]
  pull_request:
    branches: ["main", "staging"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. STATIC ANALYSIS & SECURITY SCAN
  # ─────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint (root JS files)
        # Pin to ESLint v8 — project uses .eslintrc.json (legacy format
        # dropped in ESLint v9). Migrate to eslint.config.js to remove pin.
        run: npx eslint@8 "*.js" "sokoni-*.js" --no-eslintrc -c .eslintrc.json --max-warnings 50

      - name: Run ESLint (Cloud Functions)
        run: cd functions && npm ci && npx eslint@8 index.js --max-warnings 20

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          # DEV-4 (Phase 4 audit): broadened beyond IntaSend/Stripe live keys to also
          # catch SendGrid tokens, PEM private keys, and Slack tokens. Patterns require
          # a HIGH-ENTROPY suffix after the prefix so they match real keys but NOT the
          # prefix constants / doc placeholders (e.g. 'sk_live_', 'sk_live_your_key_here',
          # 'ISPrivKey_live_XXXX') that legitimately appear in code and docs. Deliberately
          # NOT matching AIza* (public Firebase web API keys are safe by design).
          if grep -rnE "ISPrivKey_live_[A-Za-z0-9]{16,}|sk_live_[A-Za-z0-9]{20,}|pk_live_[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9]{8,}-[A-Za-z0-9]{8,}" \
               --include="*.js" --include="*.html" --include="*.json" \
               --exclude-dir=node_modules --exclude-dir=Temp .; then
            echo "❌ HARDCODED SECRET DETECTED — failing build"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Verify production guard on demo-seed.js
        run: |
          if [ ! -f demo-seed.js ]; then
            echo "⚠️  demo-seed.js not found — skipping"
            exit 0
          fi
          if grep -q "removed localhost guard" demo-seed.js; then
            echo "❌ demo-seed.js is missing production guard"
            exit 1
          fi
          echo "✅ demo-seed.js production guard present"

      - name: Check Firebase rules syntax
        run: |
          npx -y firebase-tools firestore:rules --project sokoni-aeb26 \
            2>/dev/null && echo "✅ Firestore rules syntax OK" || \
          echo "⚠️ Firebase CLI check skipped (no FIREBASE_TOKEN in CI)"

      - name: Firestore index count guard (≤ 200)
        run: |
          COUNT=$(node -e "const f=require('./firestore.indexes.json');console.log((f.indexes||[]).length)")
          echo "Index count: $COUNT / 200"
          if [ "$COUNT" -gt "200" ]; then
            echo "❌ Firestore index limit EXCEEDED: $COUNT > 200 — deploy blocked"
            exit 1
          fi
          if [ "$COUNT" -gt "195" ]; then
            echo "::warning::Firestore index count is at $COUNT/200 — only $((200 - COUNT)) slots remain. Review before adding more."
          fi
          echo "✅ Index count OK: $COUNT/200"

      - name: Run pre-deploy check script
        run: node scripts/pre-deploy-check.js

  # ─────────────────────────────────────────────────────────────
  # 2. DEPENDENCY AUDIT  — blocks on HIGH/CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Audit root dependencies
        # Blocking: high-severity vulnerabilities fail the build.
        # Use "npm audit fix" locally to resolve before pushing.
        run: npm audit --audit-level=high

      - name: Audit Cloud Functions dependencies
        run: cd functions && npm ci && npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────
  # 3. CLOUD FUNCTIONS SYNTAX & UNIT TESTS
  # ─────────────────────────────────────────────────────────────
  functions-check:
    name: Cloud Functions — Syntax + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install CF dependencies
        run: cd functions && npm ci

      - name: Node syntax check
        run: node --check functions/index.js && echo "✅ Syntax OK"

      - name: Verify no duplicate CF exports
        # Blocking: duplicate exports cause silent runtime failures in Firebase.
        run: |
          EXPORTS=$(node -e "const m=require('./functions/index.js'); console.log(Object.keys(m).join('\n'))" 2>/dev/null | sort)
          DUPES=$(echo "$EXPORTS" | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate CF exports: $DUPES"
            exit 1
          fi
          echo "✅ No duplicate exports"

      - name: Run Cloud Function unit tests
        # Tests fully mock Firebase SDK — no live emulators required.
        run: cd functions && npm test

  # ─────────────────────────────────────────────────────────────
  # 4. SMOKE TESTS
  # ─────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static-analysis, functions-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: npx http-server . -p 3000 --cors -c-1 &

      - name: Wait for server to be ready
        run: npx -y wait-on http://localhost:3000 --timeout 15000

      - name: Run smoke tests
        run: node test-smoke.js

      - name: Run E2E critical flows
        # Blocking: E2E failures on critical flows must block deploys.
        # Use `--grep @smoke` to limit to tagged critical tests if needed.
        run: npx playwright test tests/e2e/ --reporter=list

  # ─────────────────────────────────────────────────────────────
  # 5. SCALE TEST (run only on rc/** branches)
  # ─────────────────────────────────────────────────────────────
  scale-test:
    name: Scale Test (1k)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ startsWith(github.ref, 'refs/heads/rc/') }}
    needs: [smoke-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install CF deps
        run: cd functions && npm ci

      - name: Write GCP credentials to temp file
        # "Context access might be invalid: GCP_SA_KEY" is a VS Code extension
        # false-positive — it fires on every secrets.* reference.
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "❌ GCP_SA_KEY not set — scale test requires service account"
            exit 1
          fi
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json

      - name: Run scale test at 1k
        run: node test-scale.js --users=1000
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          SOKONI_PROJECT_ID: sokoni-aeb26
