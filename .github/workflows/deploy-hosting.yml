# ─────────────────────────────────────────────────────────────────────────────
# Release B — HOSTING-ONLY deployment.
#
# Deploys ONLY Firebase Hosting. It CANNOT deploy Cloud Functions, Firestore
# rules, or indexes: the `--only hosting` scope makes that structurally
# impossible, and there are deliberately NO functions/firestore/storage steps in
# this workflow.
#
# The COMPLETE firebase.json hosting predeploy chain runs automatically as part
# of `firebase deploy --only hosting` — nothing here skips, weakens, or bypasses
# it:
#   guard-no-rollback · guard-deploy-cooldown · bump-sw-version · generate-version
#   · predeploy-syntax-gate · verify-commission-single-source · perf-guard
#   · audit-base64-writes · gate-inventory · gate-inventory-writers
#   · check-money-toast-safety
#
# Manual-dispatch only, guarded by an explicit confirmation input, so a hosting
# release to production never happens without a human deliberately triggering it.
# This workflow does NOT touch deploy.yml, gate.js, firebase.json, or any gate.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Hosting Only — Release B

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "hosting" to confirm a HOSTING-ONLY production deploy'
        required: true
        default: ""

# One hosting deploy at a time; never cancel an in-flight release mid-publish.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy-hosting:
    name: Deploy Hosting (production · --only hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Refuse to run unless the operator explicitly confirmed.
    if: ${{ github.event.inputs.confirm == 'hosting' }}

    # Required for GitHub OIDC. `id-token: write` is NEVER granted by default, so
    # without this block google-github-actions/auth cannot mint a token at all.
    # `contents: read` is all the checkout needs; nothing here can write to the repo.
    permissions:
      contents: read
      id-token: write

    # Binds this job to the pre-configured `hosting-production` environment, whose
    # deployment-branch policy permits ONLY release-b/live and which requires an explicit
    # reviewer approval. Both rules are evaluated by GitHub server-side. Note this key is
    # what OPTS THE JOB IN: a workflow copy on another ref that omits it gets no environment
    # protection at all, which is why the workflow was removed from the commission branch
    # rather than merely allow-listed against.
    environment: hosting-production
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the default shallow clone.
          #
          # guard-no-rollback.js compares this tree against the commit currently live
          # (git merge-base --is-ancestor <live> <HEAD>). With fetch-depth: 1 the live
          # commit is simply absent from the object store, and the guard says so
          # itself: "Also reached when the live commit is not in this object store.
          # Fetching is the caller's job; an unknown live commit is treated as
          # diverged" — so it REFUSES. The workflow could then only ever deploy the
          # commit already live, and never ship a release.
          #
          # This supplies the history the guard requires. It does not weaken, skip or
          # bypass any gate — it is what lets the gate run at all.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The hosting predeploy chain's inventory gates (gate-inventory*) spin the
      # Firestore emulator, which requires a JDK. Pinned so those gates can
      # always run — the gates themselves are never modified.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Root deps (perf-guard, generate-version, gate-inventory, …) AND functions
      # deps — both required by the existing hosting predeploy chain.
      - name: Install dependencies (root + functions)
        run: npm ci && cd functions && npm ci

      # Keyless auth via Workload Identity Federation. NO long-lived Firebase
      # credential is stored in this repository - there is no secret to leak or
      # rotate. The service account is scoped to Hosting only, so this credential
      # CANNOT deploy Functions, Firestore rules or Storage rules even if a future
      # edit asked it to. That is a stronger guarantee than `--only hosting`, which
      # is only a flag on a command line.
      #
      # Both values are ENVIRONMENT variables on hosting-production, not repository
      # variables: deploy.yml and canary-deploy.yml declare different environments,
      # so they cannot read them and stay structurally credential-less.
      #
      # Placed immediately before the deploy so the credential file exists for the
      # shortest window; npm ci above needs no GCP access.
      #
      # Deliberately NO `if: vars.X != ''` guard, unlike auth-certification.yml:
      # here a missing variable must FAIL the job, not skip a step and read green.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # HOSTING ONLY. Runs the full firebase.json hosting predeploy chain first.
      # No `--only functions`, no `--only firestore`, no `--only storage` — this
      # cannot deploy Functions, rules, or indexes.
      #
      # firebase-tools picks up GOOGLE_APPLICATION_CREDENTIALS, which the auth step
      # above exports - so this step needs no `env:` block at all.
      - name: Deploy hosting only (full predeploy chain runs automatically)
        run: npx -y firebase-tools deploy --only hosting --project sokoni-aeb26
