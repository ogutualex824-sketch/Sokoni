<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Services — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#e3b341}
.hero{background:linear-gradient(135deg,#0d1117,#131008);padding:40px 16px 28px;text-align:center}
.hero h1{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:8px}
.hero p{color:#8b949e;font-size:14px;max-width:480px;margin:0 auto 20px}
.srow{display:flex;gap:8px;max-width:540px;margin:0 auto}
.srow input{flex:1;padding:11px 16px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px}
.srow input:focus{outline:none;border-color:#e3b341}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22}
.tab{padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e;white-space:nowrap}
.tab.active{color:#e6edf3;border-color:#e3b341}
.specbar{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.sp.active,.sp:hover{background:#9e6c00;border-color:#e3b341;color:#fff}
.specbar input{padding:6px 10px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px;width:120px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;cursor:pointer;transition:.2s}
.card:hover{border-color:#e3b341;transform:translateY(-2px)}
.ctop{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#2d2a1a;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.cname{font-weight:600;font-size:15px}.cfirm{font-size:12px;color:#8b949e;margin-top:2px}
.cspecs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stag{padding:2px 7px;background:#21262d;border-radius:4px;font-size:11px;color:#8b949e}
.exp{font-size:12px;color:#8b949e;margin-bottom:8px}
.crow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #30363d;padding-top:10px}
.rating{font-size:13px;color:#f0883e}.fee{font-size:14px;font-weight:600;color:#e3b341}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#e3b341;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-y{background:#9e6c00;color:#fff}.btn-y:hover{background:#bb8000}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-out:hover{border-color:#8b949e}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:560px;margin:auto}
.mhdr{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.mhdr h2{font-size:16px;font-weight:600}.xbtn{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
.mbody{padding:20px}
.dr{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;color:#8b949e}
.dr strong{color:#e6edf3}
.divider{border:none;border-top:1px solid #30363d;margin:14px 0}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg textarea{resize:vertical;min-height:80px}
.tog-row{display:flex;gap:8px;margin-bottom:14px}
.tog{flex:1;padding:8px;border:1px solid #30363d;border-radius:8px;text-align:center;cursor:pointer;font-size:12px;transition:.2s}
.tog.sel{border-color:#e3b341;background:#2d2a1a;color:#e3b341}
.cs{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.s-pending{background:#2d2a1a;color:#e3b341}.s-confirmed{background:#1a3a2a;color:#3fb950}
.s-completed{background:#1a2a3a;color:#58a6ff}.s-cancelled{background:#2d1a1a;color:#f85149}
.c-card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:10px}
.empty{text-align:center;padding:60px;color:#8b949e}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">⚖️ Legal Services</div>
</div>
<div class="hero">
  <h1>Find Legal Help in Kenya</h1>
  <p>Connect with qualified advocates and legal professionals for consultations and representation.</p>
  <div class="srow">
    <input id="sq" type="text" placeholder="Search by name, firm or specialization…" oninput="debounce()">
    <button class="btn btn-y" onclick="doSearch()">Search</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('browse',this)">Find a Lawyer</div>
  <div class="tab" onclick="setTab('consults',this)">My Consultations</div>
</div>
<div class="specbar" id="specbar">
  <div id="specChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <input type="text" id="countyF" placeholder="County…" oninput="filter()">
  <div class="sp" id="onlineC" onclick="toggleOnline()">🌐 Online</div>
</div>
<div class="container">
  <div id="tBrowse"><div class="empty"><div class="spinner"></div></div></div>
  <div id="tConsults" style="display:none"><div id="consultArea" class="empty"><div class="spinner"></div></div></div>
</div>

<div class="overlay" id="lawyerModal">
  <div class="modal">
    <div class="mhdr"><h2 id="mName"></h2><button class="xbtn" onclick="close('lawyerModal')">×</button></div>
    <div class="mbody">
      <div id="mSpecs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
      <div class="dr">🏛️ <strong id="mFirm"></strong></div>
      <div class="dr">📍 <span id="mLoc"></span></div>
      <div class="dr">💰 <strong id="mFee"></strong></div>
      <div class="dr">⭐ <span id="mRating"></span></div>
      <div class="dr">📅 <span id="mExp"></span></div>
      <div class="dr" id="mLskRow">🪪 <span id="mLsk"></span></div>
      <div class="dr">🌐 <span id="mLangs"></span></div>
      <hr class="divider">
      <p id="mBio" style="font-size:14px;color:#8b949e;line-height:1.6;margin-bottom:14px"></p>
      <button class="btn btn-y" style="width:100%" onclick="openBook()">Book Consultation</button>
    </div>
  </div>
</div>

<div class="overlay" id="bookModal">
  <div class="modal">
    <div class="mhdr"><h2>Book Consultation</h2><button class="xbtn" onclick="close('bookModal')">×</button></div>
    <div class="mbody">
      <p style="font-size:13px;color:#8b949e;margin-bottom:14px">Booking with <strong id="bookLawyer" style="color:#e6edf3"></strong></p>
      <div class="tog-row">
        <div class="tog sel" id="tIn" onclick="selCT('in_person')">🏛️ In-Person</div>
        <div class="tog" id="tOnl" onclick="selCT('online_call')">🌐 Online</div>
        <div class="tog" id="tPh" onclick="selCT('phone_call')">📞 Phone</div>
      </div>
      <div class="fg"><label>Date & Time</label><input type="datetime-local" id="bookDT" min=""></div>
      <div class="fg"><label>Legal Matter</label><select id="bookM">
        <option value="">Select…</option>
        <option value="family_law">Family Law</option><option value="property">Property</option>
        <option value="criminal">Criminal</option><option value="employment">Employment</option>
        <option value="corporate">Corporate</option><option value="intellectual_property">IP</option>
        <option value="immigration">Immigration</option><option value="taxation">Taxation</option>
        <option value="debt_collection">Debt Collection</option><option value="succession">Succession</option>
        <option value="land_disputes">Land Disputes</option><option value="other">Other</option>
      </select></div>
      <div class="fg"><label>Describe your situation</label><textarea id="bookD" placeholder="Brief description (confidential)…"></textarea></div>
      <div id="feeNote" style="background:#2d2a1a;border:1px solid #e3b341;border-radius:8px;padding:10px 14px;font-size:13px;color:#e3b341;margin-bottom:14px"></div>
      <button class="btn btn-y" style="width:100%" onclick="bookConsult()">Confirm Booking</button>
    </div>
  </div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,all=[],sel=null,onlineOnly=false,specF='',cType='in_person',dbt;
const SPECS=['family_law','property','criminal','employment','corporate','intellectual_property','immigration','taxation','debt_collection','succession','land_disputes','insurance','banking','constitutional','other'];
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
function open(id){document.getElementById(id).classList.add('open');}
function close(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
try{app=firebase.initializeApp(firebaseConfig,'legal');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

function debounce(){clearTimeout(dbt);dbt=setTimeout(doSearch,400);}

function buildSpecs(){
  const c=document.getElementById('specChips');
  c.innerHTML=`<div class="sp active" onclick="setSpec('',this)">All</div>`+SPECS.map(s=>`<div class="sp" onclick="setSpec('${s}',this)">${s.replace(/_/g,' ')}</div>`).join('');
}
function setSpec(s,el){specF=s;document.querySelectorAll('#specChips .sp').forEach(x=>x.classList.remove('active'));el.classList.add('active');filter();}
function toggleOnline(){onlineOnly=!onlineOnly;document.getElementById('onlineC').classList.toggle('active',onlineOnly);filter();}

function filter(){
  const county=document.getElementById('countyF').value.toLowerCase();
  let list=[...all];
  if(specF) list=list.filter(l=>(l.specializations||[]).includes(specF));
  if(onlineOnly) list=list.filter(l=>l.availableOnline);
  if(county) list=list.filter(l=>(l.county||'').toLowerCase().includes(county));
  render(list);
}

async function load(){
  const r=await call('getLegalProviders',{limit:48});
  if(!r.ok){document.getElementById('tBrowse').innerHTML='<div class="empty">Could not load providers.</div>';return;}
  all=r.data.providers||[];render(all);
}
async function doSearch(){
  const q=document.getElementById('sq').value.trim();
  if(q.length>1){const r=await call('searchLegalProviders',{query:q,limit:40});if(r.ok)render(r.data.results);}
  else filter();
}

function render(list){
  if(!list.length){document.getElementById('tBrowse').innerHTML='<div class="empty">No lawyers found.</div>';return;}
  document.getElementById('tBrowse').innerHTML='<div class="grid">'+list.map(l=>`
    <div class="card" onclick="openL('${esc(l.lawyerId)}')">
      <div class="ctop">
        <div class="avatar">⚖️</div>
        <div>
          <div class="cname">${esc(l.name)}</div>
          <div class="cfirm">${esc(l.firmName||'')}</div>
          <div class="cspecs">${(l.specializations||[]).slice(0,3).map(s=>`<span class="stag">${s.replace(/_/g,' ')}</span>`).join('')}</div>
        </div>
      </div>
      <div class="exp">${l.yearsExperience||0} yrs · ${esc(l.county||'')} ${l.availableOnline?'· 🌐 Online':''}</div>
      <div class="crow">
        <span class="rating">★ ${l.rating||'—'} (${l.ratingCount||0})</span>
        <span class="fee">KES ${(l.hourlyRate||0).toLocaleString()}/hr</span>
      </div>
    </div>`).join('')+'</div>';
}

async function openL(id){
  sel=all.find(l=>l.lawyerId===id);
  if(!sel){const r=await call('getLegalProvider',{lawyerId:id});if(!r.ok){toast('Could not load profile',false);return;}sel=r.data;}
  const l=sel;
  document.getElementById('mName').textContent=l.name||'';
  document.getElementById('mSpecs').innerHTML=(l.specializations||[]).map(s=>`<span style="padding:3px 9px;background:#2d2a1a;border-radius:4px;font-size:12px;color:#e3b341">${s.replace(/_/g,' ')}</span>`).join('');
  document.getElementById('mFirm').textContent=l.firmName||'Independent';
  document.getElementById('mLoc').textContent=[l.city,l.county].filter(Boolean).join(', ')||'Kenya';
  document.getElementById('mFee').textContent=`KES ${(l.hourlyRate||0).toLocaleString()} per hour`;
  document.getElementById('mRating').textContent=`${l.rating||0}/5 (${l.ratingCount||0} reviews)`;
  document.getElementById('mExp').textContent=`${l.yearsExperience||0} years experience${l.availableOnline?' · Online consultations available':''}`;
  document.getElementById('mLskRow').style.display=l.lskNumber?'':'none';
  document.getElementById('mLsk').textContent=`LSK No: ${l.lskNumber||''}`;
  document.getElementById('mLangs').textContent=(l.languages||[]).join(', ');
  document.getElementById('mBio').textContent=l.bio||'';
  open('lawyerModal');
}

function openBook(){
  if(!cu){toast('Sign in to book a consultation',false);return;}
  const m=new Date();m.setHours(m.getHours()+2);
  document.getElementById('bookDT').min=m.toISOString().slice(0,16);
  document.getElementById('bookLawyer').textContent=sel?.name||'';
  document.getElementById('feeNote').textContent=`Fee: KES ${(sel?.hourlyRate||0).toLocaleString()} per hour. Payment is due before the session.`;
  close('lawyerModal');open('bookModal');
}
function selCT(t){
  cType=t;
  document.getElementById('tIn').classList.toggle('sel',t==='in_person');
  document.getElementById('tOnl').classList.toggle('sel',t==='online_call');
  document.getElementById('tPh').classList.toggle('sel',t==='phone_call');
}
async function bookConsult(){
  const dt=document.getElementById('bookDT').value;
  const matter=document.getElementById('bookM').value;
  const desc=document.getElementById('bookD').value.trim();
  if(!dt){toast('Select date and time',false);return;}
  if(!matter){toast('Select legal matter',false);return;}
  if(!desc){toast('Describe your situation',false);return;}
  const key=`lc_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const btn=document.querySelector('#bookModal .btn-y');btn.textContent='Booking…';btn.disabled=true;
  const r=await call('bookLegalConsultation',{lawyerId:sel.lawyerId,scheduledAt:new Date(dt).toISOString(),consultationType:cType,legalMatter:matter,briefDescription:desc,idempotencyKey:key});
  btn.textContent='Confirm Booking';btn.disabled=false;
  if(r.ok){toast('Consultation booked! Awaiting confirmation.');close('bookModal');document.getElementById('bookDT').value='';document.getElementById('bookD').value='';}
  else toast(r.err||'Booking failed',false);
}

async function loadConsults(){
  const a=document.getElementById('consultArea');
  if(!cu){a.innerHTML='<div class="empty">Sign in to view consultations.</div>';return;}
  a.innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('getMyLegalConsultations',{limit:30});
  if(!r.ok){a.innerHTML='<div class="empty">Could not load consultations.</div>';return;}
  const list=r.data.consultations||[];
  if(!list.length){a.innerHTML='<div class="empty">No consultations booked yet.</div>';return;}
  a.innerHTML=list.map(c=>`
    <div class="c-card">
      <div class="cs s-${c.status}" style="margin-bottom:6px">${(c.status||'').replace(/_/g,' ')}</div>
      <div style="font-weight:600">${esc(c.lawyerName||'')}</div>
      <div style="font-size:13px;color:#8b949e;margin-bottom:4px">${(c.legalMatter||'').replace(/_/g,' ')}</div>
      <div style="font-size:13px">📅 ${new Date(c.scheduledAt).toLocaleString()}</div>
      <div style="font-size:13px;margin-top:4px">${(c.consultationType||'').replace(/_/g,' ')} · KES ${(c.fee||0).toLocaleString()}</div>
    </div>`).join('');
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  document.getElementById('tBrowse').style.display=t==='browse'?'':'none';
  document.getElementById('tConsults').style.display=t==='consults'?'':'none';
  document.getElementById('specbar').style.display=t==='browse'?'':'none';
  if(t==='consults')loadConsults();
}
buildSpecs();load();
</script>
</body>
</html>
