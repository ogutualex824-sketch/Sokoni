<!DOCTYPE html>
<html lang="en" data-splash="1">
<head>
  <meta charset="UTF-8">
  <script src="security.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Store — SOKONI</title>
  <meta name="description" content="Browse SOKONI store — thousands of products from verified Kenyan sellers.">
  <meta property="og:title" content="Store — SOKONI">
  <meta property="og:description" content="Shop thousands of products from verified Kenyan sellers on SOKONI.">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/Sokonilogo2.png">
  <link rel="icon" type="image/png" href="assets/logosokoni.png">
  <link rel="apple-touch-icon" href="assets/logosokoni.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="sokoni-premium-v2.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: white; min-height: 100vh; }

    /* NAV */
    .st-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      background: rgba(10,10,10,0.96);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .st-nav-logo { height: 34px; }
    .st-nav-back {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.55); text-decoration: none;
      font-size: 13px; font-weight: 600;
      padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      transition: all .2s;
    }
    .st-nav-back:hover { color: white; border-color: rgba(255,255,255,0.25); }

    /* BANNER */
    .st-banner {
      width: 100%; height: 220px; position: relative; overflow: hidden;
      background: linear-gradient(135deg, #0d1f0d, #0a0a1a, #1a0d1f);
    }
    .st-banner-img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: brightness(0.65);
    }
    .st-banner-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(10,10,10,0.85) 100%);
    }
    @media(max-width: 600px){ .st-banner { height: 150px; } }

    /* HEADER */
    .st-header {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px 28px;
      display: flex; gap: 20px; align-items: flex-end;
      margin-top: -48px; position: relative; z-index: 2;
      flex-wrap: wrap;
    }
    .st-logo-wrap {
      width: 90px; height: 90px; border-radius: 50%;
      border: 3px solid rgba(113,255,0,0.4);
      overflow: hidden; flex-shrink: 0;
      background: linear-gradient(135deg, #1a2a1a, #1a1a2a);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 900; color: #71ff00;
    }
    .st-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .st-header-info { flex: 1; min-width: 200px; }
    .st-store-name {
      font-size: 26px; font-weight: 900; color: white;
      margin-bottom: 5px; line-height: 1.2;
    }
    .st-tagline { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
    .st-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .st-badge {
      font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
      background: rgba(113,255,0,0.1); border: 1px solid rgba(113,255,0,0.25); color: #71ff00;
    }
    .st-badge-blue { background: rgba(0,170,255,0.1); border-color: rgba(0,170,255,0.25); color: #00aaff; }
    .st-badge-yellow { background: rgba(255,193,7,0.1); border-color: rgba(255,193,7,0.25); color: #ffc107; }

    /* CONTACT BAR */
    .st-contact-bar {
      background: rgba(255,255,255,0.03);
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 24px;
    }
    .st-contact-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .st-contact-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700; font-family: inherit;
      text-decoration: none; transition: filter .2s;
    }
    .st-contact-btn:hover { filter: brightness(1.12); }
    .st-wa  { background: #25d366; color: black; }
    .st-call{ background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: white; }
    .st-mail{ background: rgba(0,170,255,0.1);  border: 1px solid rgba(0,170,255,0.2);   color: #00aaff; }
    .st-ig  { background: linear-gradient(135deg,rgba(225,48,108,0.15),rgba(88,81,219,0.15));
              border: 1px solid rgba(225,48,108,0.25); color: #e1306c; }
    .st-dm  { background: rgba(113,255,0,0.09); border: 1px solid rgba(113,255,0,0.2);  color: #71ff00; }
    .st-web { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }

    /* STATS */
    .st-stats {
      max-width: 1100px; margin: 20px auto 0;
      padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .st-stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 16px 14px; text-align: center;
    }
    .st-stat-val { font-size: 20px; font-weight: 900; color: #71ff00; margin-bottom: 4px; }
    .st-stat-label { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

    /* ABOUT */
    .st-about {
      max-width: 1100px; margin: 20px auto 0; padding: 0 24px;
    }
    .st-about-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 20px 22px;
    }
    .st-section-h {
      font-size: 14px; font-weight: 800; color: white; margin-bottom: 10px;
    }
    .st-about-text {
      font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.7;
    }

    /* RATING STRIP */
    .st-rating-strip {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;
    }
    .st-dim-chip {
      background: rgba(255,193,7,0.08); border: 1px solid rgba(255,193,7,0.18);
      border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 110px;
    }
    .st-dim-val { font-size: 18px; font-weight: 900; color: #ffc107; }
    .st-dim-label { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    /* TABS */
    .st-tabs {
      max-width: 1100px; margin: 24px auto 0; padding: 0 24px;
      display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .st-tab {
      padding: 10px 20px; font-size: 13px; font-weight: 700;
      border: none; cursor: pointer; font-family: inherit;
      background: transparent; color: rgba(255,255,255,0.4);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: all .2s;
    }
    .st-tab.active { color: #71ff00; border-bottom-color: #71ff00; }

    /* PRODUCTS GRID */
    .st-content { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
    .st-panel { display: none; }
    .st-panel.active { display: block; }

    .st-products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 16px;
    }
    .st-product-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden; cursor: pointer; text-decoration: none;
      transition: transform .2s, border-color .2s; display: block;
    }
    .st-product-card:hover { transform: translateY(-3px); border-color: rgba(113,255,0,0.25); }
    .st-product-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: rgba(255,255,255,0.04); }
    .st-product-info { padding: 11px 12px; }
    .st-product-name { font-size: 13px; font-weight: 700; color: white; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-product-price { font-size: 14px; font-weight: 900; color: #71ff00; }
    .st-wholesale-tag {
      display: inline-block; font-size: 10px; font-weight: 800;
      background: rgba(0,170,255,0.12); border: 1px solid rgba(0,170,255,0.2);
      color: #00aaff; padding: 2px 7px; border-radius: 5px; margin-top: 4px;
    }

    /* REVIEWS */
    .st-review-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    }
    .st-review-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; flex-wrap: wrap; gap: 6px;
    }
    .st-reviewer { display: flex; align-items: center; gap: 8px; }
    .st-reviewer-av {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(113,255,0,0.12); border: 1px solid rgba(113,255,0,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; color: #71ff00; flex-shrink: 0;
    }
    .st-reviewer-name { font-weight: 700; color: white; font-size: 13px; }
    .st-reviewer-meta { font-size: 10px; color: rgba(255,255,255,0.35); }
    .st-review-stars { color: #ffc107; font-size: 14px; }
    .st-review-dims {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .st-dim-badge {
      font-size: 11px; background: rgba(255,193,7,0.08); border: 1px solid rgba(255,193,7,0.15);
      color: #ffc107; padding: 2px 8px; border-radius: 6px;
    }
    .st-review-comment { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; font-style: italic; }
    .st-empty { color: rgba(255,255,255,0.25); font-size: 14px; padding: 32px 0; text-align: center; }

    @media(max-width: 600px){
      .st-stats { grid-template-columns: repeat(2,1fr); }
      .st-header { margin-top: -36px; gap: 14px; }
      .st-logo-wrap { width: 70px; height: 70px; font-size: 24px; }
      .st-store-name { font-size: 20px; }
    }

    /* ── INFO SECTIONS (hours + policies 2-col) ── */
    .st-info-sections {
      max-width: 1100px; margin: 20px auto 0; padding: 0 24px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media(max-width: 768px){ .st-info-sections { grid-template-columns: 1fr; } }
    .st-info-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 18px 20px;
    }

    /* ── BUSINESS HOURS ── */
    .st-hours-grid { margin-top: 10px; }
    .st-hour-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
    }
    .st-hour-row:last-child { border-bottom: none; }
    .st-hour-day { color: rgba(255,255,255,0.45); font-weight: 600; display: flex; align-items: center; gap: 7px; flex: 0 0 110px; }
    .st-hour-day.today { color: white; font-weight: 800; }
    .st-hour-time   { color: rgba(255,255,255,0.8); font-weight: 700; text-align: right; }
    .st-hour-closed { color: rgba(255,77,77,0.65);  font-weight: 700; text-align: right; }
    .st-today-pill {
      font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px;
      background: rgba(113,255,0,0.12); color: #71ff00; border: 1px solid rgba(113,255,0,0.25);
      text-transform: uppercase; letter-spacing: .3px;
    }
    .st-today-pill.closed-pill {
      background: rgba(255,77,77,0.08); color: #ff4d4d; border-color: rgba(255,77,77,0.2);
    }

    /* ── POLICIES ── */
    .st-policy-tabs-row { display: flex; gap: 6px; margin: 12px 0 10px; flex-wrap: wrap; }
    .st-policy-tab-btn {
      padding: 5px 13px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.4);
      font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .st-policy-tab-btn.active {
      background: rgba(113,255,0,0.1); border-color: rgba(113,255,0,0.3); color: #71ff00;
    }
    .st-policy-content {
      font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.75;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px; padding: 13px 15px;
    }

    /* ── COLLECTIONS ── */
    .st-collections-wrap { display: flex; flex-direction: column; gap: 32px; }
    .st-collection-hd {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .st-collection-dot {
      width: 4px; height: 18px; border-radius: 2px;
      background: linear-gradient(#71ff00, #4fc800); flex-shrink: 0;
    }
    .st-collection-name {
      font-size: 15px; font-weight: 800; color: white;
    }
    .st-collection-count {
      font-size: 12px; color: rgba(255,255,255,0.3); font-weight: 600;
    }
    .st-collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    @media(max-width: 480px){ .st-collection-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

    /* ── FOLLOW BUTTON ── */
    .st-follow-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:inherit;transition:all .25s;}
    .st-follow-btn.not-following{background:#71ff00;color:black;box-shadow:0 4px 18px rgba(113,255,0,0.3);}
    .st-follow-btn.not-following:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(113,255,0,0.4);}
    .st-follow-btn.following{background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.3);color:#71ff00;}
    /* ── ACHIEVEMENT BADGE ── */
    .st-ach-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid;}
  </style>

<!-- BANNER -->

<script>
(function(){
  const params    = new URLSearchParams(window.location.search);
  const storeId   = params.get("id") || "";           /* Firebase seller UID */
  const storeParm = params.get("store") || params.get("seller") || storeId || "";

  /* Load store config */
  let store = null;
  try { store = JSON.parse(localStorage.getItem("sokoniMiniStore")); } catch(e){}

  /* Fallback: find by sellerName in products */
  let allProducts = [];
  try { allProducts = JSON.parse(localStorage.getItem("sellerProducts"))||[]; } catch(e){}

  /* Match store by name, seller UID, or owner name */
  const products = allProducts.filter(p => {
    const sn = p.sellerName || "Sokoni Seller";
    const su = p.sellerUid  || p.sellerId || "";
    return sn === storeParm || su === storeParm || su === storeId ||
           (store && (store.name === storeParm || sn === store.ownerName));
  });

  /* Resolve display store */
  const displayName = store?.name || storeParm || "Sokoni Store";
  document.title = displayName + " — SOKONI";

  /* Banner */
  if(store?.banner){
    const img = document.getElementById("stBannerImg");
    img.src = store.banner; img.style.display = "block";
  }

  /* Logo */
  const logoWrap = document.getElementById("stLogoWrap");
  if(store?.logo){
    logoWrap.innerHTML = `<img loading="lazy" src="${store.logo}" alt="${displayName}">`;
  } else {
    logoWrap.textContent = displayName.substring(0,2).toUpperCase();
  }

  /* Store name + tagline */
  document.getElementById("stStoreName").textContent = displayName;
  const tagEl = document.getElementById("stTagline");
  if(store?.tagline){ tagEl.textContent = store.tagline; } else { tagEl.style.display="none"; }

  /* Badges */
  const badgesEl = document.getElementById("stBadges");
  let verifiedBadge = false;
  try {
    const v = JSON.parse(localStorage.getItem("sokoniSellerVerification")||"null");
    if(v && v.status==="verified") verifiedBadge = true;
  } catch(e){}
  if(verifiedBadge) badgesEl.innerHTML += `<span class="st-badge">✅ Verified Seller</span>`;

  const cityMap = { nairobi:"Nairobi", mombasa:"Mombasa", kisumu:"Kisumu", nakuru:"Nakuru", eldoret:"Eldoret", thika:"Thika" };
  const loc = products[0]?.location;
  if(loc && loc !== "worldwide") badgesEl.innerHTML += `<span class="st-badge st-badge-blue">📍 ${cityMap[loc]||loc}</span>`;
  badgesEl.innerHTML += `<span class="st-badge st-badge-yellow">📦 ${products.length} listing${products.length!==1?"s":""}</span>`;

  /* Contact */
  const ctInner = document.getElementById("stContactInner");
  const ctBar   = document.getElementById("stContactBar");
  const contacts = [];
  if(store?.phone){
    contacts.push(`<a href="https://wa.me/${store.phone.replace(/\D/g,'')}" target="_blank" class="st-contact-btn st-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>`);
    contacts.push(`<a href="tel:${store.phone}" class="st-contact-btn st-call">📞 Call</a>`);
  }
  if(store?.email)     contacts.push(`<a href="mailto:${store.email}" class="st-contact-btn st-mail">📧 Email</a>`);
  if(store?.instagram) contacts.push(`<a href="https://instagram.com/${store.instagram.replace('@','')}" target="_blank" class="st-contact-btn st-ig"><i class="fab fa-instagram"></i> ${store.instagram}</a>`);
  contacts.push(`<a href="messages.html" class="st-contact-btn st-dm">💬 Message Seller</a>`);
  if(store?.website)   contacts.push(`<a href="${store.website}" target="_blank" class="st-contact-btn st-web"><i class="fas fa-globe"></i> Website</a>`);

  if(contacts.length){ ctInner.innerHTML = contacts.join(""); ctBar.style.display = "block"; }

  /* Ratings */
  let allRatings = {};
  try { allRatings = JSON.parse(localStorage.getItem("sokoniSellerRatings"))||{}; } catch(e){}
  const ownerKey = store?.ownerName || storeParm;
  const ratings  = allRatings[ownerKey] || [];
  const avgRating = ratings.length ? (ratings.reduce((s,r)=>s+(r.avgScore||r.stars||0),0)/ratings.length) : 0;

  /* Orders */
  let allOrders = [];
  try { allOrders = JSON.parse(localStorage.getItem("sokoniOrders"))||[]; } catch(e){}
  const prodIds = new Set(products.map(p=>p.id));
  const sellerOrders = allOrders.filter(o=>(o.items||[]).some(i=>prodIds.has(i.id)));
  const deliveredCount = sellerOrders.filter(o=>o.status==="delivered").length;
  const deliveryRate   = sellerOrders.length ? Math.round(deliveredCount/sellerOrders.length*100) : null;

  /* Followers */
  let stAllFollowers = {};
  try { stAllFollowers = JSON.parse(localStorage.getItem("sokoniStoreFollowers"))||{}; } catch(e){}
  const stSellerKey = store?.ownerName || storeParm;
  const stFollowers = stAllFollowers[stSellerKey] || 0;

  /* Stats */
  const statsEl = document.getElementById("stStats");
  statsEl.innerHTML = [
    { val: products.length,                     label: "Products" },
    { val: deliveredCount,                      label: "Completed Orders" },
    { val: deliveryRate !== null ? deliveryRate+"%" : "—", label: "Delivery Rate" },
    { val: avgRating ? "⭐ "+avgRating.toFixed(1) : "—", label: "Rating" },
    { val: ratings.length,                      label: "Reviews" },
    { val: stFollowers,                         label: "Followers" },
  ].map(s=>`<div class="st-stat-card"><div class="st-stat-val">${s.val}</div><div class="st-stat-label">${s.label}</div></div>`).join("");

  /* About */
  if(store?.about){
    document.getElementById("stAboutWrap").style.display = "block";
    document.getElementById("stAboutText").textContent = store.about;
  }

  /* Rating dimensions */
  const catAvg = (key) => {
    const vals = ratings.map(r=>r[key]).filter(v=>v>0);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
  };
  const dimData = [
    { key:"delivery",     label:"🚚 Delivery" },
    { key:"responseTime", label:"⚡ Response" },
    { key:"returns",      label:"🔄 Returns"  },
    { key:"satisfaction", label:"😊 Satisfaction" },
  ];
  const stripEl = document.getElementById("stRatingStrip");
  const dimHtml = dimData.map(d=>{
    const v = catAvg(d.key);
    if(!v) return "";
    return `<div class="st-dim-chip"><div class="st-dim-val">${v}</div><div class="st-dim-label">${d.label}</div></div>`;
  }).join("");
  if(dimHtml){ stripEl.innerHTML = dimHtml; } else { stripEl.style.display="none"; }
  if(!store?.about && dimHtml){
    document.getElementById("stAboutWrap").style.display = "block";
    document.getElementById("stAboutText").style.display = "none";
  }

  /* Products tab */
  const gridEl = document.getElementById("stProductsGrid");
  if(!products.length){
    document.getElementById("stProductsEmpty").style.display = "block";
  } else {
    gridEl.innerHTML = products.map(p=>{
      const wsTag = p.wholesalePrice
        ? `<div class="st-wholesale-tag">🏷️ Bulk: KES ${Number(p.wholesalePrice).toLocaleString()} (min ${p.minWholesaleQty})</div>`
        : "";
      return `<a class="st-product-card" href="product.html?id=${p.id}">
        <img src="${p.image||'assets/default-product.png'}" alt="${p.name}" loading="lazy">
        <div class="st-product-info">
          <div class="st-product-name">${p.name}</div>
          <div class="st-product-price">KES ${Number(p.price).toLocaleString()}</div>
          ${wsTag}
        </div>
      </a>`;
    }).join("");
  }

  /* Reviews tab */
  const revEl = document.getElementById("stReviewsContent");
  if(!ratings.length){
    revEl.innerHTML = `<div class="st-empty">No reviews yet — be the first to buy and rate!</div>`;
  } else {
    const ravg = avgRating;
    const rstars = "★".repeat(Math.round(ravg)) + "☆".repeat(5-Math.round(ravg));
    revEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;">
          <div style="font-size:48px;font-weight:900;color:#ffc107;">${ravg.toFixed(1)}</div>
          <div style="color:#ffc107;font-size:18px;">${rstars}</div>
          <div style="color:rgba(255,255,255,0.35);font-size:12px;margin-top:4px;">${ratings.length} review${ratings.length!==1?"s":""}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${dimData.map(d=>{ const v=catAvg(d.key); return v?`<div class="st-dim-chip"><div class="st-dim-val">${v}</div><div class="st-dim-label">${d.label}</div></div>`:""; }).join("")}
        </div>
      </div>
      ${ratings.slice(0,20).map(r=>{
        const rAvg = r.avgScore||r.stars||0;
        const dims = [
          r.delivery     ? `🚚 ${r.delivery}`     : "",
          r.responseTime ? `⚡ ${r.responseTime}` : "",
          r.returns      ? `🔄 ${r.returns}`      : "",
          r.satisfaction ? `😊 ${r.satisfaction}` : "",
        ].filter(Boolean);
        return `<div class="st-review-card">
          <div class="st-review-top">
            <div class="st-reviewer">
              <div class="st-reviewer-av">${(r.buyerName||"A")[0].toUpperCase()}</div>
              <div>
                <div class="st-reviewer-name">${r.buyerName||"Anonymous"}</div>
                <div class="st-reviewer-meta">${r.date||""} · Order ${r.orderId||""}</div>
              </div>
            </div>
            <div class="st-review-stars">${"★".repeat(Math.round(rAvg))}${"☆".repeat(5-Math.round(rAvg))} <span style="font-size:12px;color:rgba(255,255,255,0.4);">${rAvg}</span></div>
          </div>
          ${dims.length ? `<div class="st-review-dims">${dims.map(d=>`<span class="st-dim-badge">${d}</span>`).join("")}</div>` : ""}
          ${r.comment ? `<div class="st-review-comment">"${r.comment}"</div>` : ""}
        </div>`;
      }).join("")}
    `;
  }

  /* ═══════════════════════════════════════════
     ACHIEVEMENT BADGE
  ═══════════════════════════════════════════ */
  (function(){
    const s = deliveredCount >= 500 ? 4 : deliveredCount >= 100 ? 3 : deliveredCount >= 20 ? 2 : deliveredCount >= 5 ? 1 : 0;
    const r = avgRating >= 4.8 ? 4 : avgRating >= 4.5 ? 3 : avgRating >= 4.0 ? 2 : avgRating >= 3.5 ? 1 : 0;
    const d = (deliveryRate||0) >= 95 ? 4 : (deliveryRate||0) >= 85 ? 3 : (deliveryRate||0) >= 70 ? 2 : (deliveryRate||0) >= 50 ? 1 : 0;
    const f = stFollowers >= 200 ? 4 : stFollowers >= 50 ? 3 : stFollowers >= 10 ? 2 : stFollowers >= 1 ? 1 : 0;
    const score = s + r + d + f;
    const TIERS = [
      { min:14, tier:'Legend',  icon:'👑', color:'#ff8c00', border:'rgba(255,140,0,0.4)',  bg:'rgba(255,140,0,0.08)'  },
      { min:10, tier:'Diamond', icon:'💎', color:'#00aaff', border:'rgba(0,170,255,0.4)',  bg:'rgba(0,170,255,0.08)'  },
      { min:7,  tier:'Gold',    icon:'🥇', color:'#ffc107', border:'rgba(255,193,7,0.4)',  bg:'rgba(255,193,7,0.07)'  },
      { min:4,  tier:'Silver',  icon:'🥈', color:'#c0c0c0', border:'rgba(192,192,192,0.35)',bg:'rgba(192,192,192,0.05)'},
      { min:1,  tier:'Bronze',  icon:'🥉', color:'#cd7f32', border:'rgba(205,127,50,0.4)', bg:'rgba(205,127,50,0.08)' },
      { min:0,  tier:'Newcomer',icon:'🌱', color:'rgba(255,255,255,0.45)', border:'rgba(255,255,255,0.12)', bg:'rgba(255,255,255,0.03)' },
    ];
    const ach = TIERS.find(t => score >= t.min) || TIERS[TIERS.length-1];
    document.getElementById("stBadges").innerHTML += `<span class="st-ach-badge" style="background:${ach.bg};border-color:${ach.border};color:${ach.color};">${ach.icon} ${ach.tier}</span>`;
  })();

  /* ═══════════════════════════════════════════
     FOLLOW STORE
  ═══════════════════════════════════════════ */
  (function(){
    const followBtn  = document.getElementById("stFollowBtn");
    const followIcon = document.getElementById("stFollowIcon");
    const followText = document.getElementById("stFollowText");
    const cntEl      = document.getElementById("stFollowerCount");

    let myF = {};
    try { myF = JSON.parse(localStorage.getItem("sokoniFollowing"))||{}; } catch(e){}
    const isFollowing = !!myF[stSellerKey];

    function setUI(f){
      if(f){
        followBtn.className="st-follow-btn following";
        followIcon.className="fas fa-check";
        followText.textContent="Following";
      } else {
        followBtn.className="st-follow-btn not-following";
        followIcon.className="fas fa-user-plus";
        followText.textContent="Follow Store";
      }
    }
    setUI(isFollowing);

    const cnt = stAllFollowers[stSellerKey] || 0;
    if(cntEl) cntEl.textContent = cnt.toLocaleString() + " follower" + (cnt!==1?"s":"");

    window.stToggleFollow = function(){
      let mF={};  try{mF=JSON.parse(localStorage.getItem("sokoniFollowing"))||{};}catch(e){}
      let aF={}; try{aF=JSON.parse(localStorage.getItem("sokoniStoreFollowers"))||{};}catch(e){}
      const was = !!mF[stSellerKey];
      if(was){
        delete mF[stSellerKey];
        aF[stSellerKey] = Math.max(0,(aF[stSellerKey]||1)-1);
        setUI(false);
      } else {
        mF[stSellerKey] = { followedAt: Date.now() };
        aF[stSellerKey] = (aF[stSellerKey]||0)+1;
        setUI(true);
      }
      localStorage.setItem("sokoniFollowing", JSON.stringify(mF));
      localStorage.setItem("sokoniStoreFollowers", JSON.stringify(aF));
      const newCnt = aF[stSellerKey]||0;
      if(cntEl) cntEl.textContent = newCnt.toLocaleString() + " follower"+(newCnt!==1?"s":"");
      /* refresh followers stat card */
      const statsEl2 = document.getElementById("stStats");
      if(statsEl2){
        const follCard = statsEl2.querySelector(".st-stat-card:last-child .st-stat-val");
        if(follCard) follCard.textContent = newCnt;
      }
    };
  })();

  /* Phase 3 — render hours, policies and collections from localStorage data,
     then overlay with Firestore data if a seller UID is available */
  stRenderHours(null);           /* show default hours immediately */
  stRenderPolicies(null);        /* show default policies immediately */
  stRenderCollections(products); /* group localStorage products by category */

  if (storeId) _stLoadFirestore(storeId);

  /* +20 pts for first visit to each unique store */
  if(storeParm){
    try{
      var visited = JSON.parse(localStorage.getItem("sokoniVisitedStores")||"{}");
      if(!visited[storeParm]){
        visited[storeParm] = Date.now();
        localStorage.setItem("sokoniVisitedStores", JSON.stringify(visited));
        var pd = JSON.parse(localStorage.getItem("sokoniPoints")||'{"total":0,"history":[]}');
        pd.total = (pd.total||0) + 20;
        var vDate = new Date().toLocaleDateString("en-KE",{day:"numeric",month:"short",year:"numeric"});
        pd.history.unshift({points:20, orderId:"", date:vDate, description:"🏪 First visit to "+displayName});
        localStorage.setItem("sokoniPoints", JSON.stringify(pd));
      }
    }catch(e){}
  }

})();

function stSwitchTab(name, btn){
  document.querySelectorAll(".st-tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".st-panel").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  const panel = document.getElementById("st-tab-"+name);
  if(panel) panel.classList.add("active");
}

/* ═══════════════════════════════════════════════════
   BUSINESS HOURS
═══════════════════════════════════════════════════ */
function stRenderHours(shopData) {
  const grid = document.getElementById("stHoursGrid");
  if (!grid) return;

  var hrs = (shopData && shopData.businessHours) || {
    mon:"8:00 AM – 7:00 PM", tue:"8:00 AM – 7:00 PM", wed:"8:00 AM – 7:00 PM",
    thu:"8:00 AM – 7:00 PM", fri:"8:00 AM – 7:00 PM",
    sat:"9:00 AM – 5:00 PM", sun:"Closed"
  };
  var dayKeys  = ["sun","mon","tue","wed","thu","fri","sat"];
  var dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var todayIdx = new Date().getDay();
  var todayKey = dayKeys[todayIdx];
  var todayHrs = hrs[todayKey] || "Closed";
  var isOpenNow = todayHrs !== "Closed";

  /* Add open/closed badge to header */
  var badgesEl = document.getElementById("stBadges");
  if (badgesEl) {
    if (isOpenNow) {
      badgesEl.innerHTML += '<span class="st-badge">🟢 Open Now</span>';
    } else {
      badgesEl.innerHTML += '<span class="st-badge" style="background:rgba(255,77,77,0.08);border-color:rgba(255,77,77,0.2);color:#ff4d4d;">🔴 Closed</span>';
    }
  }

  grid.innerHTML = dayKeys.map(function(dk, i) {
    var isToday  = i === todayIdx;
    var h        = hrs[dk] || "Closed";
    var isClosed = h === "Closed";
    var pill     = isToday
      ? '<span class="st-today-pill' + (isOpenNow ? "" : " closed-pill") + '">'
        + (isOpenNow ? "Open" : "Closed") + "</span>"
      : "";
    return '<div class="st-hour-row">'
      + '<span class="st-hour-day' + (isToday ? " today" : "") + '">'
      + dayNames[i].slice(0, 3) + pill
      + "</span>"
      + '<span class="' + (isClosed ? "st-hour-closed" : "st-hour-time") + '">' + h + "</span>"
      + "</div>";
  }).join("");
}

/* ═══════════════════════════════════════════════════
   STORE POLICIES
═══════════════════════════════════════════════════ */
function stRenderPolicies(shopData) {
  var tabsWrap = document.getElementById("stPolicyTabsWrap");
  var bodyEl   = document.getElementById("stPolicyBody");
  if (!tabsWrap || !bodyEl) return;

  var p = (shopData && shopData.policies) || {};
  var items = [
    { key:"shipping", label:"🚚 Shipping", text: p.shipping ||
      "Orders dispatched within 1–2 business days. Same-day delivery available in Nairobi for orders placed before 12 PM. Delivery tracked via SMS." },
    { key:"returns",  label:"🔄 Returns",  text: p.returns  ||
      "Returns accepted within 7 days of delivery. Items must be in original condition and packaging. Contact the seller to initiate a return." },
    { key:"payment",  label:"💳 Payment",  text: p.payment  ||
      "M-Pesa (STK Push), Cash on Delivery, and bank transfers accepted. All prices are in Kenya Shillings (KES). Receipts provided for every order." },
    { key:"warranty", label:"🛡️ Warranty",  text: p.warranty ||
      "Products include manufacturer warranty where applicable. Extended warranty available on electronics. Contact seller directly for warranty claims." },
  ];

  window._stPolicies = {};
  items.forEach(function(it) { window._stPolicies[it.key] = it.text; });

  tabsWrap.innerHTML = '<div class="st-policy-tabs-row">'
    + items.map(function(it, i) {
        return '<button class="st-policy-tab-btn' + (i === 0 ? " active" : "") + '" '
          + 'onclick="stSwitchPolicy(\'' + it.key + '\',this)">' + it.label + "</button>";
      }).join("") + "</div>";

  bodyEl.innerHTML = '<div class="st-policy-content">' + items[0].text + "</div>";
}

window.stSwitchPolicy = function(key, btn) {
  document.querySelectorAll(".st-policy-tab-btn").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  var bodyEl = document.getElementById("stPolicyBody");
  if (bodyEl && window._stPolicies) {
    bodyEl.innerHTML = '<div class="st-policy-content">' + (window._stPolicies[key] || "") + "</div>";
  }
};

/* ═══════════════════════════════════════════════════
   COLLECTIONS (auto-group by category)
═══════════════════════════════════════════════════ */
function stRenderCollections(prods) {
  var el = document.getElementById("stCollectionsContent");
  if (!el) return;

  var byCat = {};
  prods.forEach(function(p) {
    var cat = p.category || "Other";
    if (!byCat[cat]) byCat[cat] = [];
    byCat[cat].push(p);
  });

  var cats = Object.keys(byCat).sort(function(a, b) { return byCat[b].length - byCat[a].length; });

  if (!cats.length) {
    el.innerHTML = '<div class="st-empty">No collections yet.</div>';
    return;
  }

  el.innerHTML = '<div class="st-collections-wrap">'
    + cats.map(function(cat) {
        var items = byCat[cat].slice(0, 6);
        return '<div>'
          + '<div class="st-collection-hd">'
          + '<div class="st-collection-dot"></div>'
          + '<span class="st-collection-name">' + cat + '</span>'
          + '<span class="st-collection-count">' + byCat[cat].length + ' item' + (byCat[cat].length !== 1 ? 's' : '') + '</span>'
          + '</div>'
          + '<div class="st-collection-grid">'
          + items.map(function(p) {
              var img  = p.image || "assets/default-product.png";
              var name = (p.name || "").replace(/</g, "&lt;");
              return '<a class="st-product-card" href="product.html?id=' + p.id + '">'
                + '<img src="' + img + '" alt="' + name + '" loading="lazy" onerror="this.src=\'assets/default-product.png\'">'
                + '<div class="st-product-info">'
                + '<div class="st-product-name">' + name + '</div>'
                + '<div class="st-product-price">KES ' + Number(p.price || 0).toLocaleString() + '</div>'
                + '</div></a>';
            }).join("")
          + '</div></div>';
      }).join("")
    + "</div>";
}

/* ═══════════════════════════════════════════════════
   FIRESTORE LIVE LOADER
═══════════════════════════════════════════════════ */
async function _stLoadFirestore(uid) {
  try {
    var {initializeApp, getApps} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    var {getFirestore, doc, getDoc, collection, query, where, getDocs} =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    var cfg = {
      apiKey:"AIzaSyDt_FRoTdE5OpfPhLB0DApIm7p-I45hzVE",
      authDomain:"sokoni-aeb26.firebaseapp.com",
      projectId:"sokoni-aeb26",
      storageBucket:"sokoni-aeb26.firebasestorage.app",
      messagingSenderId:"24799054989",
      appId:"1:24799054989:web:e1cf6ca8c281bf1abf26c4"
    };
    var app = getApps().length ? getApps()[0] : initializeApp(cfg);
    var db  = getFirestore(app);

    /* Shop metadata */
    var shopSnap = await getDoc(doc(db, "shops", uid));
    if (!shopSnap.exists()) shopSnap = await getDoc(doc(db, "sellers", uid));
    var sd = shopSnap.exists() ? shopSnap.data() : {};

    if (sd.banner || sd.bannerUrl) {
      var bi = document.getElementById("stBannerImg");
      if (bi) { bi.src = sd.banner || sd.bannerUrl; bi.style.display = "block"; }
    }
    if (sd.logo || sd.logoUrl) {
      var lw = document.getElementById("stLogoWrap");
      if (lw) lw.innerHTML = '<img src="' + (sd.logo || sd.logoUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
    }
    if (sd.name || sd.storeName) {
      var dn = sd.name || sd.storeName;
      document.title = dn + " — SOKONI";
      var sn = document.getElementById("stStoreName"); if (sn) sn.textContent = dn;
    }
    if (sd.tagline || sd.bio) {
      var tl = document.getElementById("stTagline");
      if (tl) { tl.textContent = sd.tagline || sd.bio; tl.style.display = ""; }
    }
    if (sd.about || sd.description) {
      var aw = document.getElementById("stAboutWrap"); var at = document.getElementById("stAboutText");
      if (aw) aw.style.display = "block";
      if (at) at.textContent = sd.about || sd.description;
    }

    /* Render hours + policies from Firestore data (overrides defaults) */
    stRenderHours(sd);
    stRenderPolicies(sd);

    /* Verification badge */
    var vSnap = await getDoc(doc(db, "verifications", uid));
    if (vSnap.exists() && vSnap.data().status === "approved") {
      var be = document.getElementById("stBadges");
      if (be && !be.innerHTML.includes("Verified")) {
        be.innerHTML = '<span class="st-badge">✅ Verified Seller</span>' + be.innerHTML;
      }
    }

    /* Live products */
    var pQuery = query(collection(db, "products"), where("sellerUid", "==", uid));
    var pSnap  = await getDocs(pQuery);
    if (!pSnap.empty) {
      var fsProds = [];
      pSnap.forEach(function(d) { fsProds.push(Object.assign({ id: d.id }, d.data())); });

      /* Re-render products grid */
      var grid  = document.getElementById("stProductsGrid");
      var empty = document.getElementById("stProductsEmpty");
      if (grid) {
        if (fsProds.length) {
          if (empty) empty.style.display = "none";
          grid.innerHTML = fsProds.map(function(p) {
            var ws = p.wholesalePrice
              ? '<div class="st-wholesale-tag">🏷️ Bulk: KES ' + Number(p.wholesalePrice).toLocaleString()
                + ' (min ' + p.minWholesaleQty + ')</div>' : "";
            return '<a class="st-product-card" href="product.html?id=' + p.id + '">'
              + '<img src="' + (p.image || "assets/default-product.png") + '" alt="' + (p.name||"").replace(/</g,"&lt;") + '" loading="lazy">'
              + '<div class="st-product-info">'
              + '<div class="st-product-name">' + (p.name||"").replace(/</g,"&lt;") + '</div>'
              + '<div class="st-product-price">KES ' + Number(p.price||0).toLocaleString() + '</div>'
              + ws + '</div></a>';
          }).join("");
        }
      }

      /* Re-render collections with Firestore products */
      stRenderCollections(fsProds);

      /* Update products badge count */
      var be2 = document.getElementById("stBadges");
      if (be2) {
        be2.innerHTML = be2.innerHTML.replace(/\d+ listings?/, fsProds.length + " listing" + (fsProds.length !== 1 ? "s" : ""));
      }
    }

  } catch(e) { /* Firestore is enhancement-only; localStorage data already shown */ }
}
