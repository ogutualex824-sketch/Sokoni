<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property Agent Dashboard — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#f0883e}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22;overflow-x:auto}
.tab{padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e;white-space:nowrap}
.tab.active{color:#e6edf3;border-color:#f0883e}
.container{max-width:1100px;margin:0 auto;padding:20px 16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px}
.stat label{font-size:11px;color:#8b949e;display:block;margin-bottom:4px}
.stat .val{font-size:20px;font-weight:700;color:#f0883e}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-hdr h2{font-size:16px;font-weight:600}
.prop-item{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.pthumb{width:70px;height:56px;background:#21262d;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pbody{flex:1}
.ptitle{font-weight:600;font-size:14px;margin-bottom:3px}
.pmeta{font-size:13px;color:#8b949e;margin-bottom:4px}
.pstats{display:flex;gap:12px;font-size:12px;color:#8b949e;margin-bottom:6px}
.pactions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn-o{background:#f0883e;color:#fff}.btn-o:hover{background:#e0773d}
.btn-g{background:#238636;color:#fff}.btn-g:hover{background:#2ea043}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}
.stat-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.sa{background:#1a3a2a;color:#3fb950}.sd{background:#2d2a1a;color:#e3b341}.si{background:#21262d;color:#8b949e}
.enq-item{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:8px}
.view-item{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:8px}
.vtime{font-size:13px;margin-bottom:4px}
.vnotes{font-size:13px;color:#8b949e}
.empty{text-align:center;padding:60px;color:#8b949e}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#f0883e;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.prop-item{flex-wrap:wrap}.pactions{width:100%}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">🏠 Agent Dashboard</div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <a href="/property-listing" style="background:#f0883e;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none">+ New Listing</a>
    <a href="/property-hub" style="color:#8b949e;font-size:13px;padding:7px 14px;text-decoration:none">Marketplace →</a>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('overview',this)">Overview</div>
  <div class="tab" onclick="setTab('listings',this)">My Listings</div>
  <div class="tab" onclick="setTab('enquiries',this)">Enquiries</div>
  <div class="tab" onclick="setTab('viewings',this)">Viewings</div>
</div>
<div class="container" id="content">
  <div class="empty"><div class="spinner"></div></div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,analytics=null;
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
try{app=firebase.initializeApp(firebaseConfig,'pagent');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;if(u)loadData();else showSignIn();});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

function showSignIn(){document.getElementById('content').innerHTML='<div class="empty">Sign in to access your agent dashboard.</div>';}

async function loadData(){
  const r=await call('getPropertyAnalytics',{});
  if(!r.ok){document.getElementById('content').innerHTML=`<div class="empty">No listings yet.<br><a href="/property-listing" style="color:#f0883e;margin-top:16px;display:inline-block">Create your first listing →</a></div>`;return;}
  analytics=r.data;showOverview();
}

function showOverview(){
  const d=analytics;
  document.getElementById('content').innerHTML=`
    <div class="stats-grid">
      ${[['Total Listings',d.totalListings],['Active',d.activeListings],['Draft',d.draftListings||0],['Total Views',d.totalViews||0],['Enquiries',d.totalEnquiries||0],['Viewings',d.totalViewings||0],['Conversion','~'+(d.conversionRate||0)+'%']].map(([k,v])=>`
      <div class="stat"><label>${k}</label><div class="val">${v??0}</div></div>`).join('')}
    </div>
    <div class="section-hdr">
      <h2>Recent Activity</h2>
    </div>
    ${(d.recentActivity||[]).length?d.recentActivity.map(a=>`
    <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:20px">${a.type==='enquiry'?'📧':a.type==='viewing'?'📅':'👁'}</div>
      <div>
        <div style="font-size:14px;font-weight:600">${esc(a.summary||'')}</div>
        <div style="font-size:12px;color:#8b949e">${new Date(a.timestamp?.seconds?a.timestamp.seconds*1000:a.timestamp).toLocaleString()}</div>
      </div>
    </div>`).join(''):'<div style="color:#8b949e;font-size:14px">No recent activity.</div>'}`;
}

function showListings(){
  const listings=(analytics?.listings||[]);
  document.getElementById('content').innerHTML=`<div class="section-hdr"><h2>My Listings</h2><a href="/property-listing" class="btn btn-o" style="text-decoration:none">+ New Listing</a></div>`+
  (listings.length?listings.map(l=>`
    <div class="prop-item">
      <div class="pthumb">${l.images?.[0]?`<img src="${esc(l.images[0])}" loading="lazy">`:'🏠'}</div>
      <div class="pbody">
        <div class="ptitle">${esc(l.title)}</div>
        <div class="pmeta">KES ${(l.price||0).toLocaleString()} · ${l.propertyType?.replace(/_/g,' ')||''} · ${l.listingType?.replace(/_/g,' ')||''}</div>
        <div class="pstats"><span>👁 ${l.viewCount||0} views</span><span>📧 ${l.enquiryCount||0} enquiries</span><span>📅 ${l.viewingCount||0} viewings</span></div>
        <span class="stat-tag ${l.status==='active'?'sa':l.status==='draft'?'sd':'si'}">${l.status}</span>
      </div>
      <div class="pactions">
        ${l.status==='draft'?`<button class="btn btn-g" onclick="publish('${esc(l.listingId)}')">Publish</button>`:''}
        ${l.status==='active'?`<button class="btn btn-out" onclick="deactivate('${esc(l.listingId)}')">Deactivate</button>`:''}
      </div>
    </div>`).join(''):'<div class="empty">No listings yet. <a href="/property-listing" style="color:#f0883e">Create one →</a></div>');
}

async function publish(id){
  const r=await call('publishPropertyListing',{listingId:id});
  if(r.ok){toast('Listing published!');await loadData();showListings();}else toast(r.err||'Failed',false);
}
async function deactivate(id){
  const r=await call('deactivatePropertyListing',{listingId:id});
  if(r.ok){toast('Listing deactivated.');await loadData();showListings();}else toast(r.err||'Failed',false);
}

async function showEnquiries(){
  const r=await call('getPropertyEnquiries',{limit:30});
  const list=r.ok?(r.data.enquiries||[]):[];
  document.getElementById('content').innerHTML=`<div class="section-hdr"><h2>Enquiries (${list.length})</h2></div>`+
  (list.length?list.map(e=>`
    <div class="enq-item">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div style="font-weight:600">${esc(e.listingTitle||'')}</div>
        <div style="font-size:12px;color:#8b949e">${new Date(e.createdAt?.seconds?e.createdAt.seconds*1000:e.createdAt).toLocaleDateString()}</div>
      </div>
      <p style="font-size:14px;color:#8b949e;margin-bottom:8px">${esc(e.message||'')}</p>
      <div style="display:flex;gap:12px;font-size:13px">
        ${e.buyerPhone?`<a href="tel:${esc(e.buyerPhone)}" style="color:#3fb950">📞 Call</a>`:''}
        ${e.buyerEmail?`<a href="mailto:${esc(e.buyerEmail)}" style="color:#58a6ff">✉️ Email</a>`:''}
        ${e.budget?`<span style="color:#8b949e">Budget: KES ${e.budget.toLocaleString()}</span>`:''}
      </div>
    </div>`).join(''):'<div class="empty">No enquiries yet.</div>');
}

async function showViewings(){
  const r=await call('getPropertyViewings',{limit:30});
  const list=r.ok?(r.data.viewings||[]):[];
  document.getElementById('content').innerHTML=`<div class="section-hdr"><h2>Scheduled Viewings (${list.length})</h2></div>`+
  (list.length?list.map(v=>`
    <div class="view-item">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <div style="font-weight:600">${esc(v.listingTitle||'')}</div>
        <span style="padding:2px 8px;border-radius:4px;font-size:11px;background:${v.status==='confirmed'?'#1a3a2a':'#2d2a1a'};color:${v.status==='confirmed'?'#3fb950':'#e3b341'}">${v.status}</span>
      </div>
      <div class="vtime">📅 ${v.preferredDate} ${v.preferredTime?'at '+v.preferredTime:''}</div>
      ${v.notes?`<div class="vnotes">${esc(v.notes)}</div>`:''}
    </div>`).join(''):'<div class="empty">No viewings scheduled yet.</div>');
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  if(t==='overview') showOverview();
  else if(t==='listings') showListings();
  else if(t==='enquiries') showEnquiries();
  else if(t==='viewings') showViewings();
}
</script>
</body>
</html>
