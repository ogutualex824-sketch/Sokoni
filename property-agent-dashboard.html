<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:white;min-height:100vh;padding-bottom:80px;}
.fn{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(8,8,8,0.97);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);}
.ad-body{max-width:860px;margin:0 auto;padding:16px;}
/* STATS */
.ad-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.ad-stat{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;text-align:center;}
.ad-stat-num{font-size:22px;font-weight:900;color:#10b981;margin-bottom:2px;}
.ad-stat-lbl{font-size:10px;color:rgba(255,255,255,0.35);}
/* TABS */
.ad-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;}
.ad-tabs::-webkit-scrollbar{display:none;}
.ad-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);white-space:nowrap;font-family:inherit;transition:all .2s;flex-shrink:0;}
.ad-tab.active{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#10b981;}
/* ADD LISTING FORM */
.ad-form{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:18px;}
.ad-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:580px){.ad-form-grid{grid-template-columns:1fr;}}
.ad-input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px;}
.ad-input:focus{border-color:rgba(16,185,129,0.4);}
.ad-label{font-size:12px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:4px;display:block;}
.ad-submit{padding:12px 24px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:11px;color:white;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
.ad-section-h{font-size:13px;font-weight:800;color:rgba(255,255,255,0.6);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;}
/* LISTING CARD */
.ad-listing{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
.ad-listing-icon{width:50px;height:50px;border-radius:12px;background:rgba(16,185,129,0.06);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.ad-listing-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ad-btn{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;border:none;font-family:inherit;}
.ad-btn.green{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#10b981;}
.ad-btn.red{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#ef4444;}
.ad-btn.amber{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);color:#f59e0b;}
/* INQUIRY / VIEWING CARD */
.ad-lead{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px;margin-bottom:10px;}
/* ANALYTICS */
.ad-chart-bar{height:8px;border-radius:4px;background:rgba(16,185,129,0.2);margin-bottom:8px;position:relative;overflow:hidden;}
.ad-chart-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#10b981,#059669);}
</style>
</head>
<body>
<script src="splash.js"></script>
<script src="sokoni-property.js"></script>

<nav class="fn">
  <a href="property-hub.html" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:16px;flex-shrink:0;">←</a>
  <span style="font-size:14px;font-weight:800;flex:1;">Agent Dashboard</span>
  <a href="property-dashboard.html" style="padding:7px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:9px;color:rgba(255,255,255,0.6);font-size:12px;font-weight:800;text-decoration:none;">👤 My Acc</a>
  <a href="messages.html" style="position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;flex-shrink:0;">💬<span id="adInboxBadge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#ff3c3c;color:white;border-radius:999px;font-size:9px;font-weight:900;line-height:16px;text-align:center;padding:0 3px;"></span></a>
  <a href="notifications.html" style="position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;flex-shrink:0;">🔔<span id="adBellBadge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#ff3c3c;color:white;border-radius:999px;font-size:9px;font-weight:900;line-height:16px;text-align:center;padding:0 3px;"></span></a>
</nav>
<script>
(function(){var n=parseInt(localStorage.getItem('_sokoniUnread')||'0');if(n>0){var bb=document.getElementById('adBellBadge'),ib=document.getElementById('adInboxBadge');if(bb){bb.textContent=n>9?'9+':n;bb.style.display='block';}if(ib){ib.textContent=n>9?'9+':n;ib.style.display='block';}}window.addEventListener('sokoniInboxUnread',function(e){var c=e.detail?.count||0;var bb=document.getElementById('adBellBadge'),ib=document.getElementById('adInboxBadge');if(bb){bb.textContent=c>9?'9+':c;bb.style.display=c>0?'block':'none';}if(ib){ib.textContent=c>9?'9+':c;ib.style.display=c>0?'block':'none';}});})();
</script>

<div class="ad-body">
  <!-- STATS -->
  <div class="ad-stats">
    <div class="ad-stat"><div class="ad-stat-num" id="stListings">0</div><div class="ad-stat-lbl">My Listings</div></div>
    <div class="ad-stat"><div class="ad-stat-num" id="stInquiries">0</div><div class="ad-stat-lbl">Inquiries</div></div>
    <div class="ad-stat"><div class="ad-stat-num" id="stViewings">0</div><div class="ad-stat-lbl">Viewings</div></div>

  <!-- TABS -->

    <button class="ad-tab active" onclick="switchTab('listings',this)">🏠 My Listings</button>
    <button class="ad-tab" onclick="switchTab('add',this)">➕ Add Listing</button>
    <button class="ad-tab" onclick="switchTab('inquiries',this)">💬 Inquiries</button>

  </div>

  <div id="adContent"></div>
</div>

<nav style="position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0;z-index:50;backdrop-filter:blur(16px);">
  <a href="/" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-home" style="font-size:18px;"></i><span>Home</span></a>
  <a href="property-hub.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-building" style="font-size:18px;"></i><span>Property</span></a>
  <a href="property-agent-dashboard.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#10b981;text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-upload" style="font-size:18px;"></i><span>List</span></a>
  <a href="property-dashboard.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-user" style="font-size:18px;"></i><span>My Account</span></a>
</nav>

<script>
const P = window.SokoniProperty;
const AGENT_ID = new URLSearchParams(window.location.search).get('agentId') || 'agt001';
let _stats = {};

function init() {
  _stats = P.getAgentStats(AGENT_ID);
  document.getElementById('stListings').textContent = _stats.listings;
  document.getElementById('stInquiries').textContent = _stats.inquiries;
  document.getElementById('stViewings').textContent = _stats.viewings;
  document.getElementById('stConfirmed').textContent = _stats.confirmed;
  renderTab('listings');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.ad-tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderTab(tab);
}
window.switchTab = switchTab;

function renderTab(tab) {
  const el = document.getElementById('adContent');
  if (tab==='listings') {
    const listings = P.getListings({}).filter(p=>p.agentId===AGENT_ID);
    if (!listings.length) {
      el.innerHTML = `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);"><div style="font-size:48px;margin-bottom:14px;">🏠</div><p style="font-size:15px;font-weight:700;">No listings yet</p><p style="font-size:12px;margin-top:8px;">Add your first listing to get started.</p><button onclick="switchTab('add',null)" style="margin-top:16px;padding:10px 22px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:10px;color:#10b981;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">➕ Add Listing</button></div>`;
      return;
    }
    el.innerHTML = listings.map(p=>{
      const st = P.PROPERTY_STATUS[p.status]||{label:p.status,color:'white',icon:'🏠'};
      return `<div class="ad-listing">
        <div class="ad-listing-icon">${p.icon||'🏠'}</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:800;color:white;">${p.title}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">📍 ${p.location}</div>
          <div style="font-size:15px;font-weight:900;color:#10b981;margin-top:4px;">${P.fmtPrice(p.price,p.priceUnit)}</div>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap;">
            <span style="padding:3px 9px;border-radius:5px;font-size:10px;font-weight:900;background:${st.color}15;border:1px solid ${st.color}40;color:${st.color};">${st.icon} ${st.label}</span>
            <span style="font-size:10px;color:rgba(255,255,255,0.3);">👁️ ${p.views||0} views · 💬 ${p.inquiries||0} inquiries</span>
          </div>
          <div class="ad-listing-actions">
            <button class="ad-btn green" onclick="window.location.href='property-listing.html?id=${p.id}'">View</button>
            <button class="ad-btn amber" onclick="editListing('${p.id}')">✏️ Edit</button>
            <button class="ad-btn" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);" onclick="markSold('${p.id}')">✅ Mark Sold/Rented</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  else if (tab==='add') {
    el.innerHTML = `
      <div class="ad-form">
        <div style="font-size:16px;font-weight:900;margin-bottom:16px;">➕ Add New Listing</div>
        <div class="ad-section-h">Property Details</div>
        <div class="ad-form-grid">
          <div>
            <label class="ad-label">Listing Title *</label>
            <input class="ad-input" id="fTitle" placeholder="e.g. 3BR House for Sale in Karen">
          </div>
          <div>
            <label class="ad-label">Location *</label>
            <input class="ad-input" id="fLocation" placeholder="e.g. Karen, Nairobi">
          </div>
          <div>
            <label class="ad-label">Category *</label>
            <select class="ad-input" id="fCategory">
              <option value="house">House</option>
              <option value="apartment">Apartment</option>
              <option value="bedsitter">Bedsitter / Studio</option>
              <option value="commercial">Commercial Space</option>
              <option value="land">Land / Plot</option>
              <option value="warehouse">Warehouse</option>
              <option value="office">Office Space</option>
            </select>
          </div>
          <div>
            <label class="ad-label">Status *</label>
            <select class="ad-input" id="fStatus">
              <option value="for_sale">For Sale</option>
              <option value="for_rent">For Rent</option>
              <option value="sold">Sold</option>
              <option value="rented">Rented</option>
            </select>
          </div>
          <div>
            <label class="ad-label">Price (KES) *</label>
            <input class="ad-input" type="number" id="fPrice" placeholder="e.g. 15000000">
          </div>
          <div>
            <label class="ad-label">Price Unit</label>
            <select class="ad-input" id="fPriceUnit">
              <option value="KES">KES (for sale)</option>
              <option value="KES/month">KES/month (rent)</option>
              <option value="KES/sqm">KES/sqm</option>
            </select>
          </div>
        </div>
        <div class="ad-section-h">Property Specs</div>
        <div class="ad-form-grid">
          <div>
            <label class="ad-label">Bedrooms</label>
            <input class="ad-input" type="number" id="fBeds" placeholder="0" min="0">
          </div>
          <div>
            <label class="ad-label">Bathrooms</label>
            <input class="ad-input" type="number" id="fBaths" placeholder="0" min="0">
          </div>
          <div>
            <label class="ad-label">Size (sqm)</label>
            <input class="ad-input" type="number" id="fSize" placeholder="e.g. 200">
          </div>
          <div>
            <label class="ad-label">Parking Spaces</label>
            <input class="ad-input" type="number" id="fParking" placeholder="0" min="0">
          </div>
          <div>
            <label class="ad-label">County</label>
            <select class="ad-input" id="fCounty">
              <option value="nairobi">Nairobi</option>
              <option value="mombasa">Mombasa</option>
              <option value="kisumu">Kisumu</option>
              <option value="nakuru">Nakuru</option>
              <option value="kiambu">Kiambu</option>
              <option value="machakos">Machakos</option>
              <option value="kwale">Kwale</option>
              <option value="laikipia">Laikipia</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label class="ad-label">Furnished?</label>
            <select class="ad-input" id="fFurnished">
              <option value="false">Unfurnished</option>
              <option value="true">Furnished</option>
              <option value="part">Partially Furnished</option>
            </select>
          </div>
        </div>
        <div class="ad-section-h">Description & Features</div>
        <label class="ad-label">Description *</label>
        <textarea class="ad-input" id="fDesc" rows="4" placeholder="Describe the property — location, nearby amenities, condition, unique features..."></textarea>
        <label class="ad-label">Key Features (comma-separated)</label>
        <input class="ad-input" id="fFeatures" placeholder="Swimming pool, Garden, DSQ, Generator backup...">
        <label class="ad-label">Amenities (comma-separated)</label>
        <input class="ad-input" id="fAmenities" placeholder="parking, security, borehole, generator, wifi...">
        <div style="display:flex;gap:10px;margin-top:6px;">
          <button class="ad-submit" onclick="submitListing()">✅ Publish Listing</button>
          <button onclick="switchTab('listings',null)" style="padding:12px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:11px;color:rgba(255,255,255,0.5);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">Cancel</button>
        </div>
      </div>`;
  }
  else if (tab==='inquiries') {
    const inqs = P.getInquiries().filter(i=>i.agentId===AGENT_ID);
    if (!inqs.length) { el.innerHTML = empty('💬','No inquiries yet','Inquiries from potential buyers and renters will appear here.'); return; }
    el.innerHTML = inqs.map(i=>{
      const is = P.INQUIRY_STATUS[i.status]||{label:i.status,color:'white'};
      return `<div class="ad-lead">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
          <div style="font-size:13px;font-weight:800;color:white;">💬 ${i.name}</div>
          <span style="padding:3px 8px;border-radius:5px;font-size:10px;font-weight:900;background:${is.color}15;border:1px solid ${is.color}40;color:${is.color};">${is.label}</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);">📍 ${i.propertyTitle||'Property'} · ${P.timeSince(i.createdAt||Date.now())}</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.55);margin-top:6px;line-height:1.5;">"${(i.message||'').slice(0,120)}${(i.message||'').length>120?'...':''}"</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <a href="tel:${i.phone}" class="ad-btn green">📞 Call ${i.phone}</a>
          <a href="https://wa.me/254${(i.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'')}" target="_blank" class="ad-btn" style="background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.25);color:#25d366;">WhatsApp</a>
        </div>
      </div>`;
    }).join('');
  }
  else if (tab==='viewings') {
    const viewings = P.getViewings().filter(v=>v.agentId===AGENT_ID);
    if (!viewings.length) { el.innerHTML = empty('📅','No viewing requests yet','When buyers request viewings on your listings they appear here.'); return; }
    el.innerHTML = viewings.map(v=>{
      const vs = P.VIEWING_STATUS[v.status]||{label:v.status,color:'white'};
      return `<div class="ad-lead">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
          <div style="font-size:13px;font-weight:800;color:white;">📅 ${v.name}</div>
          <span style="padding:3px 8px;border-radius:5px;font-size:10px;font-weight:900;background:${vs.color}15;border:1px solid ${vs.color}40;color:${vs.color};">${vs.label}</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);">📍 ${v.propertyTitle||'Property'} · 🗓️ ${v.date||'Date TBC'} · ⏰ ${v.time||'Time TBC'}</div>
        ${v.notes?`<div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px;">"${v.notes}"</div>`:''}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <a href="tel:${v.phone}" class="ad-btn green">📞 ${v.phone}</a>
          <button class="ad-btn green" onclick="confirmViewing('${v.id}')">✅ Confirm</button>
          <button class="ad-btn red" onclick="cancelViewing('${v.id}')">✕ Cancel</button>
        </div>
      </div>`;
    }).join('');
  }
  else if (tab==='analytics') {
    const listings = P.getListings({}).filter(p=>p.agentId===AGENT_ID);
    const totalViews = listings.reduce((s,p)=>s+(p.views||0),0);
    const totalInq = listings.reduce((s,p)=>s+(p.inquiries||0),0);
    const byStatus = {};
    listings.forEach(p=>{ byStatus[p.status]=(byStatus[p.status]||0)+1; });
    const catCounts = {};
    listings.forEach(p=>{ catCounts[p.category]=(catCounts[p.category]||0)+1; });

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;text-align:center;">
          <div style="font-size:26px;font-weight:900;color:#10b981;">${totalViews}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.35);">Total Views</div>
        </div>
        <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;text-align:center;">
          <div style="font-size:26px;font-weight:900;color:#f59e0b;">${totalInq}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.35);">Total Inquiries</div>
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;margin-bottom:12px;">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px;">🏘️ Listings by Status</div>
        ${Object.entries(byStatus).map(([s,c])=>{
          const st=P.PROPERTY_STATUS[s]||{label:s,color:'#10b981'};
          const pct = listings.length ? Math.round(c/listings.length*100) : 0;
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span style="color:${st.color};">${st.label}</span><span style="color:rgba(255,255,255,0.4);">${c} (${pct}%)</span></div>
            <div class="ad-chart-bar"><div class="ad-chart-fill" style="width:${pct}%;background:${st.color};opacity:0.7;"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px;">📊 Top Performing Listings</div>
        ${listings.sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5).map(p=>{
          const pct = totalViews ? Math.round((p.views||0)/totalViews*100) : 0;
          return `<div style="margin-bottom:10px;cursor:pointer;" onclick="window.location.href='property-listing.html?id=${p.id}'">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span style="color:white;font-weight:700;">${p.title.slice(0,40)}...</span><span style="color:rgba(255,255,255,0.4);">${p.views||0} views</span></div>
            <div class="ad-chart-bar"><div class="ad-chart-fill" style="width:${pct}%;"></div></div>
          </div>`;
        }).join('')}
      </div>
    `;
  }
}

function submitListing() {
  const title=document.getElementById('fTitle').value.trim();
  const location=document.getElementById('fLocation').value.trim();
  const price=parseInt(document.getElementById('fPrice').value)||0;
  const desc=document.getElementById('fDesc').value.trim();
  if (!title||!location||!price||!desc){(window._skToast||alert)('Please fill all required fields (marked with *).');return;}
  const features=document.getElementById('fFeatures').value.split(',').map(f=>f.trim()).filter(Boolean);
  const amenities=document.getElementById('fAmenities').value.split(',').map(a=>a.trim()).filter(Boolean);
  const listing = P.createListing({
    title, location, price, description:desc, features, amenities,
    status: document.getElementById('fStatus').value,
    category: document.getElementById('fCategory').value,
    priceUnit: document.getElementById('fPriceUnit').value,
    bedrooms: parseInt(document.getElementById('fBeds').value)||0,
    bathrooms: parseInt(document.getElementById('fBaths').value)||0,
    size: parseInt(document.getElementById('fSize').value)||0,
    parking: parseInt(document.getElementById('fParking').value)||0,
    county: document.getElementById('fCounty').value,
    furnished: document.getElementById('fFurnished').value==='true',
    agentId: AGENT_ID,
    icon: categoryIcon(document.getElementById('fCategory').value),
  });
  (window._skToast||alert)(`✅ Listing published!\n\nTitle: ${listing.title}\nID: ${listing.id}\n\nIt is now live on the Property Hub.`);
  switchTab('listings',null);
  document.querySelectorAll('.ad-tab')[0].classList.add('active');
  init();
}
window.submitListing=submitListing;

function categoryIcon(cat){ const m={house:'🏡',apartment:'🏢',bedsitter:'🛏️',commercial:'🏪',land:'🌍',warehouse:'🏭',office:'💼'}; return m[cat]||'🏠'; }

function editListing(id){
  const p = P.getListings({}).find(l=>l.id===id);
  if(!p){ (window._skToast||alert)('Listing not found.'); return; }
  // Switch to add tab, then pre-fill fields
  switchTab('add', null);
  document.querySelectorAll('.ad-tab').forEach(t=>{ if(t.textContent.includes('Add')) t.classList.add('active'); });
  // Update heading
  const heading = document.querySelector('#adContent .ad-form > div:first-child');
  if(heading) heading.textContent = '✏️ Edit Listing';
  // Pre-fill all fields
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.value=val||''; };
  set('fTitle', p.title); set('fLocation', p.location); set('fCategory', p.category);
  set('fStatus', p.status); set('fPrice', p.price); set('fPriceUnit', p.priceUnit);
  set('fBeds', p.bedrooms); set('fBaths', p.bathrooms); set('fSize', p.size);
  set('fParking', p.parking); set('fCounty', p.county);
  set('fFeatures', (p.features||[]).join(', ')); set('fAmenities', (p.amenities||[]).join(', '));
  set('fDesc', p.description);
  const furnished = document.getElementById('fFurnished');
  if(furnished) furnished.value = p.furnished ? 'true' : 'false';
  // Override submit to UPDATE instead of create
  const submitBtn = document.querySelector('#adContent button[onclick="submitListing()"]');
  if(submitBtn){ submitBtn.textContent = '💾 Save Changes'; submitBtn.onclick = function(){ updateListing(id); }; }
  window._editingId = id;
}
window.editListing = editListing;

function updateListing(id){
  const title=document.getElementById('fTitle').value.trim();
  const location=document.getElementById('fLocation').value.trim();
  const price=parseInt(document.getElementById('fPrice').value)||0;
  const desc=document.getElementById('fDesc').value.trim();
  if(!title||!location||!price||!desc){ (window._skToast||alert)('Please fill all required fields.'); return; }
  P.updateListing(id, {
    title, location, price, description:desc,
    features: document.getElementById('fFeatures').value.split(',').map(f=>f.trim()).filter(Boolean),
    amenities: document.getElementById('fAmenities').value.split(',').map(a=>a.trim()).filter(Boolean),
    status: document.getElementById('fStatus').value,
    category: document.getElementById('fCategory').value,
    priceUnit: document.getElementById('fPriceUnit').value,
    bedrooms: parseInt(document.getElementById('fBeds').value)||0,
    bathrooms: parseInt(document.getElementById('fBaths').value)||0,
    size: parseInt(document.getElementById('fSize').value)||0,
    parking: parseInt(document.getElementById('fParking').value)||0,
    county: document.getElementById('fCounty').value,
    furnished: document.getElementById('fFurnished').value==='true',
    icon: categoryIcon(document.getElementById('fCategory').value),
  });
  (window._skToast||alert)('✅ Listing updated successfully!');
  window._editingId = null;
  switchTab('listings', null);
  document.querySelectorAll('.ad-tab')[0].classList.add('active');
  init();
}
window.updateListing = updateListing;

function markSold(id){
  /* The _skConfirm(...) call was never closed: the lone `}` below shut the
     callback but left both the call's paren and markSold's own brace open, so
     the block failed to parse ("missing ) after argument list") and NO script
     on this dashboard ran. */
  _skConfirm('Mark this listing as sold/rented?',function(){
    P.updateListing(id,{status:'sold'});
    renderTab('listings');
    (window._skToast||alert)('✅ Listing marked as sold/rented.');
  });
}
window.markSold=markSold;

function confirmViewing(id){ P.updateViewingStatus(id,'confirmed'); renderTab('viewings'); (window._skToast||alert)('✅ Viewing confirmed! The client will be notified.'); }
function cancelViewing(id){ P.updateViewingStatus(id,'cancelled'); renderTab('viewings'); }
window.confirmViewing=confirmViewing;
window.cancelViewing=cancelViewing;

function empty(icon,title,sub){return`<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);"><div style="font-size:48px;margin-bottom:14px;">${icon}</div><p style="font-size:15px;font-weight:700;color:rgba(255,255,255,0.4);">${title}</p><p style="font-size:12px;margin-top:8px;">${sub}</p></div>`;}

init();
