<style>
  :root { --green:#71ff00; --blue:#00aaff; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08); }
  *{box-sizing:border-box;}
  body { background:#050505; color:white; font-family:system-ui,-apple-system,sans-serif; margin:0; min-height:100vh; }

  /* ── page wrapper ── */
  .dt-wrap { max-width:520px; margin:0 auto; padding:20px 16px 100px; }

  /* ── header ── */
  .dt-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .dt-back { width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;text-decoration:none;color:white;flex-shrink:0; }
  .dt-title { font-size:18px; font-weight:900; color:white; }
  .dt-ref   { font-size:11px; color:rgba(255,255,255,0.35); font-weight:600; letter-spacing:.5px; margin-top:2px; }

  /* ── status banner ── */
  .dt-status { padding:14px 18px; border-radius:16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; }
  .dt-status-icon { font-size:28px; flex-shrink:0; }
  .dt-status-label { font-size:15px; font-weight:900; }
  .dt-status-sub   { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }

  /* ── live map ── */
  /* overflow:hidden + border-radius clips Leaflet 3D tile pane on iOS Safari — use clip-path instead */
  .dt-map-wrap { border-radius:18px; overflow:visible; clip-path:inset(0 round 18px); border:1px solid var(--border); margin-bottom:16px; position:relative; -webkit-transform:translateZ(0); transform:translateZ(0); }
  #dtMap { height:240px; width:100%; background:#111; }
  .dt-map-badge { position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px;z-index:400; }
  .dt-live-dot { width:6px;height:6px;border-radius:50%;background:var(--green);animation:dtPulse 1.3s ease-in-out infinite; }
  .dt-live-dot.stale { background:rgba(255,255,255,0.35);animation:none; }

  /* ── map placeholder states (never a blank map region) ── */
  .dt-map-state { border-radius:18px;border:1px solid var(--border);background:var(--card);margin-bottom:16px;padding:26px 20px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px; }
  .dt-ms-icon  { font-size:34px;line-height:1; }
  .dt-ms-tag   { font-size:10.5px;font-weight:800;letter-spacing:.9px;color:rgba(255,255,255,0.4); }
  .dt-ms-title { font-size:14px;font-weight:800;color:white; }
  .dt-ms-sub   { font-size:12px;color:rgba(255,255,255,0.45);line-height:1.55;max-width:300px; }
  .dt-ms-btn   { margin-top:6px;padding:10px 24px;background:rgba(113,255,0,0.12);border:1px solid rgba(113,255,0,0.3);border-radius:10px;color:var(--green);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit; }
  .dt-ms-dots  { display:inline-flex;gap:4px;vertical-align:middle;margin-left:2px; }
  .dt-ms-dots i{ width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dtPulse 1.4s ease-in-out infinite; }
  .dt-ms-dots i:nth-child(2){ animation-delay:.2s; } .dt-ms-dots i:nth-child(3){ animation-delay:.4s; }
  @keyframes dtPulse{ 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.6);} }

  /* ── timeline ── */
  .dt-timeline { margin-bottom:16px; }
  .dt-tl-step { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .dt-tl-step:last-child { border-bottom:none; }
  .dt-tl-dot  { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px; }
  .dt-tl-dot.done    { background:rgba(113,255,0,0.15);border:1.5px solid rgba(113,255,0,0.5); }
  .dt-tl-dot.current { background:rgba(0,170,255,0.15);border:2px solid var(--blue);animation:dtPulse 1.2s ease-in-out infinite; }
  .dt-tl-dot.pending { background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.1); }
  .dt-tl-label { font-size:13px; font-weight:700; color:white; }
  .dt-tl-label.pending { color:rgba(255,255,255,0.3); font-weight:600; }
  .dt-tl-time  { font-size:10px; color:rgba(255,255,255,0.3); margin-top:2px; }

  /* ── info card ── */
  .dt-card { background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-bottom:14px; }
  .dt-card-title { font-size:12px;font-weight:800;color:rgba(255,255,255,0.4);letter-spacing:.7px;margin-bottom:12px; }
  .dt-row { display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;margin-bottom:8px;gap:8px; }
  .dt-row-key { color:rgba(255,255,255,0.35);font-weight:600;white-space:nowrap; }
  .dt-row-val { color:rgba(255,255,255,0.85);font-weight:700;text-align:right; }

  /* ── PIN box ── */
  .dt-pin { background:rgba(113,255,0,0.06);border:2px solid rgba(113,255,0,0.3);border-radius:16px;padding:18px 20px;margin-bottom:14px;text-align:center; }
  .dt-pin-label { font-size:11px;font-weight:800;color:rgba(255,255,255,0.4);letter-spacing:.7px;margin-bottom:8px; }
  .dt-pin-code  { font-size:36px;font-weight:900;letter-spacing:12px;color:var(--green);margin-bottom:6px; }
  .dt-pin-hint  { font-size:11px;color:rgba(255,255,255,0.4); }

  /* ── action buttons ── */
  .dt-actions { display:flex;flex-direction:column;gap:10px;margin-bottom:14px; }
  .dt-btn-primary { padding:14px;background:linear-gradient(135deg,#71ff00,#4fc800);color:black;font-weight:900;border:none;border-radius:14px;cursor:pointer;font-size:14px;font-family:inherit;width:100%; }

  .dt-btn-success{ padding:14px;background:linear-gradient(135deg,#00aaff,#0077cc);color:white;font-weight:900;border:none;border-radius:14px;cursor:pointer;font-size:14px;font-family:inherit;width:100%; }

  /* ── share row ── */
  .dt-share { display:flex;gap:8px;margin-bottom:14px; }
  .dt-share-btn { flex:1;padding:11px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none; }

  /* ── skeleton ── */
  .dt-skeleton { animation:dtSkel 1.4s ease-in-out infinite; background:rgba(255,255,255,0.05);border-radius:10px; }
  @keyframes dtSkel{ 0%,100%{opacity:.5;}50%{opacity:1;} }

  /* ── toast ── */
  .dt-toast { position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:11px 22px;border-radius:12px;font-size:13px;font-weight:800;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center; }
  .dt-toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

<script type="module">
import SokoniDelivery from './sokoni-delivery.js';
import SokoniDB       from './sokoni-db.js';
import DeliveryHub    from './delivery-hub.js';

/* ── helpers ── */
function _uid() {
  try {
    const u = JSON.parse(localStorage.getItem('sokoniUser') || 'null');
    return window.firebaseAuth?.currentUser?.uid || u?.uid || null;
  } catch(e){ return null; }
}

function toast(msg, ok) {
  const t = document.getElementById('dtToast');
  if (!t) return;
  t.textContent = msg;
  t.style.background = ok === false ? '#ff4444' : ok === 'blue' ? '#00aaff' : '#71ff00';
  t.style.color = ok === false ? 'white' : 'black';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ── 9-Stage Timeline ── */
const STEPS = [
  { key:'order_placed',    icon:'🛒', label:'Order Confirmed'            },
  { key:'preparing',       icon:'👨‍🍳', label:'Preparing',   optional:true  },
  { key:'ready_for_pickup',icon:'✅', label:'Ready for Pickup'           },
  { key:'driver_assigned', icon:'🏍️', label:'Rider Assigned'             },
  { key:'driver_accepted', icon:'🛵', label:'Rider En Route to Seller'   },
  { key:'driver_at_seller',icon:'📍', label:'Parcel Picked Up'           },
  { key:'in_transit',      icon:'🚗', label:'Heading to You'             },
  { key:'arriving',        icon:'📲', label:'Arriving',    computed:true  },
  { key:'delivered',       icon:'📦', label:'Delivered'                  },
  { key:'buyer_confirmed', icon:'🎉', label:'Complete',  hideIfPending:true},
];

/* Hub-only timeline steps (deliveries collection) */
const STEPS_HUB = [
  { key:'pending',         icon:'⏳', label:'Delivery Created'          },
  { key:'rider_assigned',  icon:'🏍️', label:'Rider Assigned'            },
  { key:'rider_en_route',  icon:'🛵', label:'Rider Heading to Pickup'   },
  { key:'picked_up',       icon:'📍', label:'Package Picked Up'         },
  { key:'in_transit',      icon:'🚗', label:'In Transit to You'         },
  { key:'delivered',       icon:'📦', label:'Delivered'                 },
  { key:'completed',       icon:'🎉', label:'Receipt Confirmed'         },
];

const STATUS_BANNER = {
  order_placed:     { label:'Order Confirmed',          sub:'Waiting for seller to confirm the item is ready',     color:'rgba(251,191,36,0.12)', border:'rgba(251,191,36,0.3)',  icon:'🛒' },
  preparing:        { label:'Preparing Your Order',     sub:'Seller is preparing your item — rider search starts soon', color:'rgba(251,191,36,0.10)', border:'rgba(251,191,36,0.28)', icon:'👨‍🍳' },
  ready_for_pickup: { label:'Ready for Pickup',         sub:'Item is ready — searching for the nearest rider',    color:'rgba(113,255,0,0.08)',  border:'rgba(113,255,0,0.3)',   icon:'✅' },
  driver_assigned:  { label:'Rider Assigned',           sub:'Rider has been notified — waiting for acceptance',   color:'rgba(0,170,255,0.08)',  border:'rgba(0,170,255,0.3)',   icon:'🏍️' },
  driver_accepted:  { label:'Rider En Route to Seller', sub:'Your rider is on the way to pick up your item',      color:'rgba(0,170,255,0.08)',  border:'rgba(0,170,255,0.3)',   icon:'🛵' },
  driver_at_seller: { label:'Parcel Picked Up',         sub:'Rider has collected the item — heading to you!',     color:'rgba(255,165,0,0.08)',  border:'rgba(255,165,0,0.3)',   icon:'📍' },
  in_transit:       { label:'Heading to You',           sub:'Your item is on the way — live tracking active',     color:'rgba(0,170,255,0.1)',   border:'rgba(0,170,255,0.4)',   icon:'🚗' },
  arriving:         { label:'Arriving Now!',            sub:'Your rider is less than 200 m away — get ready!',    color:'rgba(113,255,0,0.12)',  border:'rgba(113,255,0,0.45)',  icon:'📲' },
  delivered:        { label:'Delivered!',               sub:'Item delivered — please confirm receipt below',      color:'rgba(113,255,0,0.10)',  border:'rgba(113,255,0,0.4)',   icon:'📦' },
  buyer_confirmed:  { label:'Delivery Complete',        sub:'Thank you for using SOKONI! See you next time.',     color:'rgba(113,255,0,0.10)',  border:'rgba(113,255,0,0.35)',  icon:'🎉' },
  cancelled:        { label:'Delivery Cancelled',       sub:'This delivery has been cancelled',                   color:'rgba(255,61,61,0.08)',  border:'rgba(255,61,61,0.2)',   icon:'❌' },
  /* Hub (deliveries collection) statuses */
  pending:          { label:'Delivery Created',         sub:'Looking for the nearest available rider',            color:'rgba(251,191,36,0.10)', border:'rgba(251,191,36,0.3)',  icon:'⏳' },
  rider_assigned:   { label:'Rider Assigned',           sub:'Your rider has been notified — awaiting acceptance', color:'rgba(0,170,255,0.08)',  border:'rgba(0,170,255,0.3)',   icon:'🏍️' },
  rider_en_route:   { label:'Rider En Route to Pickup', sub:'Your rider is heading to collect the package',       color:'rgba(0,170,255,0.08)',  border:'rgba(0,170,255,0.3)',   icon:'🛵' },
  picked_up:        { label:'Package Picked Up',        sub:'Rider has collected your package — heading to you!', color:'rgba(255,165,0,0.08)',  border:'rgba(255,165,0,0.3)',   icon:'📍' },
  completed:        { label:'Delivery Complete',        sub:'Receipt confirmed. Thank you for using SOKONI!',     color:'rgba(113,255,0,0.10)',  border:'rgba(113,255,0,0.35)',  icon:'🎉' },
};

/* ── Source flag — 'pkg' (packageRequests) or 'hub' (deliveries) ── */
let _delivSource = 'pkg';

/* Normalise a hub delivery doc so _onDelivery can render it unchanged */
function _normalizeHub(d) {
  return {
    ...d,
    deliveryAddress: d.dropoffAddress || d.deliveryAddress,
    deliveryCoords:  d.dropoffCoords  || d.deliveryCoords,
    buyerUid:        d.senderUid      || d.buyerUid,
    driverName:      d.riderName      || d.driverName,
    assignedDriverId:d.assignedRiderId|| d.assignedDriverId,
    /* keep _src so GPS handler knows which collection to use */
    _src: 'hub',
  };
}

/* ── Map state ── */
let _map = null, _riderMarker = null;
let _pickupMarker = null, _dropoffMarker = null;
/* Route layers */
let _completedLine = null, _remainingLine = null;
let _fullRouteCoords = []; /* [[lat,lng], ...] */
/* Smooth animation */
let _animFrame = null, _prevRiderLat = null, _prevRiderLng = null;
const _ANIM_MS = 3000; /* interpolation duration between GPS updates */

/* Returns TRUE only when a real Leaflet map is live. The caller must not latch
   "map ready" on anything else — a failed Leaflet load used to set the latch and
   permanently disable markers for the rest of the session. */
function _initMap(pickupLat, pickupLng) {
  const wrap = document.getElementById('dtMapWrap');
  if (!wrap) return false;
  if (_map) return true;
  /* Leaflet missing (blocked/offline/CDN-less) — leave the container intact so a
     later retry can still build the map, and report failure to the state machine. */
  if (typeof L === 'undefined') return false;
  wrap.style.display = 'block';
  let center = pickupLat ? [pickupLat, pickupLng] : null;
  if (!center && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => { if (_map) _map.setView([p.coords.latitude, p.coords.longitude], 14); },
      () => {},
      { timeout:5000, maximumAge:60000 }
    );
  }
  center = center || [-1.2864, 36.8172];
  _map = L.map('dtMap', { zoomControl:false, fadeAnimation:false, zoomAnimation:false }).setView(center, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'© OpenStreetMap', maxZoom:19, detectRetina:false }).addTo(_map);
  L.control.zoom({ position:'bottomright' }).addTo(_map);
  [100,300,700,1400,2600].forEach(ms=>setTimeout(()=>_map?.invalidateSize(true),ms));
  window.addEventListener('resize', ()=>_map?.invalidateSize(true));
  window.addEventListener('orientationchange', ()=>setTimeout(()=>_map?.invalidateSize(true),350));
  try { screen.orientation.addEventListener('change',()=>setTimeout(()=>_map?.invalidateSize(true),350)); } catch {}
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible') [0,100,400].forEach(ms=>setTimeout(()=>_map?.invalidateSize(true),ms));
  });
  return true;
}

function _placeMarker(lat, lng, htmlIcon, popup) {
  if (!_map) return null;
  const ic = L.divIcon({ className:'', html:htmlIcon, iconSize:[38,38], iconAnchor:[19,38] });
  const m  = L.marker([lat,lng], { icon:ic }).addTo(_map);
  if (popup) m.bindPopup(popup);
  return m;
}

/* Haversine (km) used for anti-teleport check and ETA */
function _hav(lat1,lng1,lat2,lng2){
  const R=6371, dL=(lat2-lat1)*Math.PI/180, dG=(lng2-lng1)*Math.PI/180,
    a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ── Update split route (completed=green / remaining=blue) ── */
function _updateSplitRoute(riderLat, riderLng) {
  if (!_map || _fullRouteCoords.length < 2) return;
  /* Find closest point on route */
  let minDist = Infinity, minIdx = 0;
  for (let i = 0; i < _fullRouteCoords.length; i++) {
    const d = _hav(riderLat, riderLng, _fullRouteCoords[i][0], _fullRouteCoords[i][1]);
    if (d < minDist) { minDist = d; minIdx = i; }
  }
  const completed = _fullRouteCoords.slice(0, minIdx + 1);
  const remaining = _fullRouteCoords.slice(minIdx);
  if (_completedLine) { _map.removeLayer(_completedLine); _completedLine = null; }
  if (_remainingLine) { _map.removeLayer(_remainingLine); _remainingLine = null; }
  if (completed.length > 1) {
    _completedLine = L.polyline(completed, { color:'#71ff00', weight:4, opacity:0.45 }).addTo(_map);
  }
  if (remaining.length > 1) {
    _remainingLine = L.polyline(remaining, { color:'#00aaff', weight:4, opacity:0.85, dashArray:'8 4' }).addTo(_map);
  }
}

/* ── Live ETA update ── */
function _updateLiveETA(riderLat, riderLng) {
  const d = _currentData;
  if (!d?.deliveryCoords?.lat) return;
  const remainKm = _hav(riderLat, riderLng, d.deliveryCoords.lat, d.deliveryCoords.lng) * 1.35;
  /* Nairobi moto avg ~25 km/h = 0.416 km/min */
  const etaMin = Math.max(1, Math.ceil(remainKm / 0.416));
  /* Update ETA in driver card. The map badge is owned solely by _updateBadge() —
     two authors used to fight over it and flip the text on every animation frame. */
  const etaEl = document.getElementById('dtLiveETA');
  if (etaEl) etaEl.textContent = etaMin <= 1 ? 'Arriving now' : '~' + etaMin + ' min';
  /* Auto-trigger "arriving" visual when within 200 m */
  if (remainKm < 0.20 && d.status === 'in_transit') {
    const lbl = document.getElementById('dtStatusLabel');
    const sub = document.getElementById('dtStatusSub');
    if (lbl) lbl.textContent = '📲 Arriving now!';
    if (sub) sub.textContent = 'Your rider is less than 200 m away — get ready!';
    /* Animate timeline to "arriving" step */
    _renderTimeline('arriving', d.timeline, d._src);
  }
}

/* ── Smooth rider marker animation along route ── */
function _animateRiderTo(fromLat, fromLng, toLat, toLng, name) {
  if (_animFrame) { cancelAnimationFrame(_animFrame); _animFrame = null; }
  /* Anti-teleport guard: ignore jumps > 2 km (GPS error / spoofing) */
  if (fromLat !== null && _hav(fromLat, fromLng, toLat, toLng) > 2.0) {
    /* Just snap to new position */
    if (_riderMarker) _riderMarker.setLatLng([toLat, toLng]);
    else _riderMarker = _placeMarker(toLat, toLng,
      '<div style="font-size:22px;filter:drop-shadow(0 0 8px rgba(0,170,255,0.9));">🏍️</div>',
      '🏍️ ' + (name || 'Your Rider'));
    _updateSplitRoute(toLat, toLng);
    _updateLiveETA(toLat, toLng);
    return;
  }
  const startLat = fromLat !== null ? fromLat : toLat;
  const startLng = fromLng !== null ? fromLng : toLng;
  const t0 = performance.now();
  function step(now) {
    const raw = Math.min((now - t0) / _ANIM_MS, 1);
    /* Ease-in-out cubic */
    const t = raw < 0.5 ? 4*raw*raw*raw : 1 - Math.pow(-2*raw+2,3)/2;
    const lat = startLat + (toLat - startLat) * t;
    const lng = startLng + (toLng - startLng) * t;
    if (!_riderMarker) {
      _riderMarker = _placeMarker(lat, lng,
        '<div style="font-size:22px;filter:drop-shadow(0 0 8px rgba(0,170,255,0.9));">🏍️</div>',
        '🏍️ ' + (name || 'Your Rider'));
    } else {
      _riderMarker.setLatLng([lat, lng]);
    }
    _updateSplitRoute(lat, lng);
    if (raw < 1) {
      _animFrame = requestAnimationFrame(step);
    } else {
      _animFrame = null;
      _updateLiveETA(toLat, toLng);
      _map.panTo([toLat, toLng], { animate:true, duration:1.2, easeLinearity:0.5 });
    }
  }
  _animFrame = requestAnimationFrame(step);
}

function _updateRiderMarker(lat, lng, name) {
  if (!_map) return;
  _animateRiderTo(_prevRiderLat, _prevRiderLng, lat, lng, name);
  _prevRiderLat = lat;
  _prevRiderLng = lng;
}

function _drawRoute(geom, fromLat, fromLng, toLat, toLng) {
  if (!_map) return;
  /* Clear old layers */
  if (_completedLine) { _map.removeLayer(_completedLine); _completedLine = null; }
  if (_remainingLine) { _map.removeLayer(_remainingLine); _remainingLine = null; }
  if (geom?.coordinates) {
    _fullRouteCoords = geom.coordinates.map(([lng, lat]) => [lat, lng]);
  } else if (fromLat && toLat) {
    _fullRouteCoords = [[fromLat, fromLng], [toLat, toLng]];
  }
  /* Render full route as remaining (blue) initially */
  if (_fullRouteCoords.length > 1) {
    _remainingLine = L.polyline(_fullRouteCoords, { color:'#00aaff', weight:4, opacity:0.75, dashArray:'8 4' }).addTo(_map);
    _map.fitBounds(_remainingLine.getBounds(), { padding:[30,30] });
  }
}

/* ── Timeline renderer ── */
function _renderTimeline(currentStatus, timelineData, src) {
  const el = document.getElementById('dtTimeline');
  if (!el) return;
  if (currentStatus === 'cancelled') {
    el.innerHTML = `
      <div class="dt-tl-step">
        <div class="dt-tl-dot current">❌</div>
        <div><div class="dt-tl-label">Delivery Cancelled</div><div class="dt-tl-time">${new Date().toLocaleTimeString()}</div></div>
      </div>`;
    return;
  }
  const stepList = src === 'hub' ? STEPS_HUB : STEPS;
  const tArr = timelineData || [];
  /* Determine which optional/computed steps to include */
  const hasStep = key => tArr.some(t => t.status === key);
  const inCurrentOrPast = (key, currentIdx, list) => {
    const idx = list.findIndex(s => s.key === key);
    return idx !== -1 && idx <= currentIdx;
  };
  const currentIdx = stepList.findIndex(s => s.key === currentStatus);
  const visibleSteps = stepList.filter(step => {
    if (step.optional)     return hasStep(step.key) || inCurrentOrPast(step.key, currentIdx, stepList);
    if (step.computed)     return inCurrentOrPast(step.key, currentIdx, stepList);
    if (step.hideIfPending) return inCurrentOrPast(step.key, currentIdx, stepList);
    return true;
  });
  const visibleIdx = visibleSteps.findIndex(s => s.key === currentStatus);
  el.innerHTML = visibleSteps.map((step, i) => {
    const done    = i < visibleIdx;
    const current = i === visibleIdx;
    const pending = i > visibleIdx;
    const ts = tArr.find(t => t.status === step.key)?.at;
    const timeStr = ts ? new Date(ts).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}) : '';
    const cls = done ? 'done' : current ? 'current' : 'pending';
    return `
      <div class="dt-tl-step">
        <div class="dt-tl-dot ${cls}">${done ? '✓' : step.icon}</div>
        <div>
          <div class="dt-tl-label ${pending ? 'pending' : ''}">${step.label}</div>
          ${timeStr ? `<div class="dt-tl-time">${timeStr}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

/* ── GPS driver tracking listener ── */
let _gpsUnsub = null;

/* Dedicated GPS collection — rider/admin-readable only. For a buyer this listener
   is expected to be denied, and that is NOT an error state: the buyer's canonical
   position comes from the delivery-doc mirror. Anything it does deliver is merged
   in as a fresher sample. */
function _attachGPS(driverId, driverName, src) {
  if (_gpsUnsub) { _gpsUnsub(); _gpsUnsub = null; }
  if (!driverId) return;
  const onLoc = loc => {
    if (!loc || !_isGeo(loc.lat, loc.lng)) return;
    _gpsPos = {
      lat: +loc.lat, lng: +loc.lng,
      at: loc.updatedAt?.toDate ? loc.updatedAt.toDate().toISOString()
        : (typeof loc.updatedAt === 'string' ? loc.updatedAt : new Date().toISOString()),
    };
    if (_currentData) _renderMapState(_currentData);
  };
  try {
    _gpsUnsub = (src === 'hub')
      ? window.DeliveryHub?.listenRiderLocation(driverId, onLoc)
      : window.SokoniDB?.listenDriverLocation(driverId, onLoc);
  } catch (e) {
    /* Enhancement only — never surfaced to the buyer. */
    console.warn('[dt] GPS enhancement unavailable:', e.message);
  }
}

/* ── Rider-side GPS push ────────────────────────────────────────────────────
   The packageRequests rider works this very page (role === 'rider' drives the
   accept / at-seller / picked-up actions below), so this is where their position
   must be published to the canonical delivery record. Without it the buyer's map
   has nothing readable to plot: driverLat/driverLng was previously written once
   at assignment and never refreshed.
   Publishes only while the trip is live, and only for the assigned rider. */
let _riderPushTimer = null;
const _RIDER_PUSH_MS = 15000;

function _startRiderPush(d) {
  if (_riderPushTimer) return;
  const ref = d.deliveryRef || d.ref || delivRef;
  const fsId = d._fsId;
  if (!ref && !fsId) return;

  const push = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      p => {
        const lat = p.coords.latitude, lng = p.coords.longitude;
        if (!_isGeo(lat, lng)) return;
        if (_currentData?._src === 'hub') {
          window.DeliveryHub?.updateDeliveryPosition(fsId, lat, lng).catch(()=>{});
        } else {
          window.SokoniDelivery?.updateDriverPosition(ref, lat, lng,
            { speed: p.coords.speed }).catch(()=>{});
        }
      },
      err => console.warn('[dt] rider GPS:', err.message),
      { enableHighAccuracy:true, timeout:10000, maximumAge:5000 }
    );
  };
  push();
  _riderPushTimer = setInterval(push, _RIDER_PUSH_MS);
}

function _stopRiderPush() {
  if (_riderPushTimer) { clearInterval(_riderPushTimer); _riderPushTimer = null; }
}

/* ══════════════════════════════════════════════════════════════════════════════
   MAP STATE MACHINE

   The map region previously rendered only for a 5-status whitelist and was
   `display:none` otherwise — so "rider assigned but not yet accepted" showed a
   driver card above a blank gap. Worse, the rider marker could never appear for
   a buyer at all: the rider's live GPS is written to deliveryLocations /
   driverLocations, whose rules require the reader to be listed in a `viewers`
   array that nothing in the codebase ever writes. The buyer's listener therefore
   failed with permission-denied into a console.warn and simply never fired.

   ONE LOCATION TRUTH: the rider's position that the buyer sees is the
   driverLat/driverLng mirror on the canonical delivery record (packageRequests /
   deliveries). The buyer is already authorised to read that document and already
   receives it over the existing onSnapshot, so no new collection, no new listener
   and no relaxed read rule is involved. The dedicated GPS collection remains the
   rider/fleet channel and is used here only as an opportunistic enhancement.

   Every branch renders an explicit state. The region is never left blank.
   ══════════════════════════════════════════════════════════════════════════════ */

const _TERMINAL_OK  = ['delivered','buyer_confirmed','completed'];
const _TERMINAL_BAD = ['cancelled','failed','returned'];
function _isTerminal(s){ return _TERMINAL_OK.includes(s) || _TERMINAL_BAD.includes(s); }

function _esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* A coordinate is usable only if it is a finite non-zero-island number in range.
   (0,0) is the classic "GPS not acquired" sentinel and must not plot a marker. */
function _isGeo(lat, lng){
  const a = Number(lat), b = Number(lng);
  return Number.isFinite(a) && Number.isFinite(b)
      && Math.abs(a) <= 90 && Math.abs(b) <= 180
      && !(a === 0 && b === 0);
}

function _riderIdOf(d){ return d.assignedDriverId || d.assignedRiderId || null; }
function _riderNameOf(d){ return d.driverName || d.riderName || 'Your rider'; }

/* Best-effort GPS-collection position, when the reader happens to be authorised. */
let _gpsPos = null;

/* Firestore hands back Timestamps, ISO strings or epoch numbers depending on the
   write path. Normalise before any freshness maths — Date.parse(Timestamp) is NaN,
   which silently made every mirrored position look infinitely stale. */
function _toIso(v){
  if (!v) return null;
  try {
    if (typeof v === 'string') return v;
    if (typeof v === 'number') return new Date(v).toISOString();
    if (typeof v.toDate === 'function') return v.toDate().toISOString();
    if (typeof v.seconds === 'number')  return new Date(v.seconds * 1000).toISOString();
    if (v instanceof Date)              return v.toISOString();
  } catch(e){}
  return null;
}

/* Canonical buyer-visible rider position, newest wins. */
function _riderPosOf(d){
  const mirror = _isGeo(d.driverLat, d.driverLng)
    ? { lat:+d.driverLat, lng:+d.driverLng,
        at:_toIso(d.driverLocUpdatedAt) || _toIso(d.updatedAt) }
    : null;
  if (mirror && _gpsPos) {
    const ma = Date.parse(mirror.at || 0) || 0, ga = Date.parse(_gpsPos.at || 0) || 0;
    return ga > ma ? _gpsPos : mirror;
  }
  return mirror || _gpsPos;
}

function _relTime(at){
  const t = Date.parse(at || 0);
  if (!t) return null;
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 15)   return 'just now';
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.round(s/60) + ' min ago';
  return Math.round(s/3600) + ' h ago';
}

/* Swap which of the two regions is visible — exactly one is ever shown. */
function _showMapRegion(showMap){
  const wrap = document.getElementById('dtMapWrap');
  const st   = document.getElementById('dtMapState');
  if (wrap) wrap.style.display = showMap ? 'block' : 'none';
  if (st)   st.style.display   = showMap ? 'none'  : 'flex';
  if (showMap) [0,120,400].forEach(ms => setTimeout(()=>_map?.invalidateSize(true), ms));
}

function _mapState(icon, tag, title, sub, btnHtml){
  const st = document.getElementById('dtMapState');
  if (!st) return;
  st.innerHTML =
    '<div class="dt-ms-icon">' + icon + '</div>' +
    '<div class="dt-ms-tag">' + _esc(tag) + '</div>' +
    '<div class="dt-ms-title">' + title + '</div>' +
    '<div class="dt-ms-sub">' + sub + '</div>' +
    (btnHtml || '');
  _showMapRegion(false);
}

/* Build the map + static geometry once, and only latch when it truly succeeded. */
function _ensureMap(d){
  if (_map) return true;
  const ok = _initMap(d.pickupCoords?.lat, d.pickupCoords?.lng);
  /* No latch on failure. The old code set `_mapReady = true` BEFORE calling
     _initMap, so a single failed Leaflet load disabled the map — and every
     marker — for the rest of the session with no way back. `_map` itself is now
     the only readiness signal, so the next snapshot simply retries. */
  if (!ok || !_map) return false;

  if (_isGeo(d.pickupCoords?.lat, d.pickupCoords?.lng)) {
    _pickupMarker = _placeMarker(d.pickupCoords.lat, d.pickupCoords.lng,
      '<div style="font-size:20px;">📍</div>', '📍 ' + _esc(d.pickupAddress || 'Pickup'));
  }
  if (_isGeo(d.deliveryCoords?.lat, d.deliveryCoords?.lng)) {
    _dropoffMarker = _placeMarker(d.deliveryCoords.lat, d.deliveryCoords.lng,
      '<div style="font-size:20px;">🎯</div>', '🎯 ' + _esc(d.deliveryAddress || 'Delivery'));
  }
  /* Route/progress line where the routing service supports it. */
  if (_isGeo(d.pickupCoords?.lat, d.pickupCoords?.lng) &&
      _isGeo(d.deliveryCoords?.lat, d.deliveryCoords?.lng)) {
    if (window.SokoniRouting) {
      SokoniRouting.getRoute(d.pickupCoords.lat, d.pickupCoords.lng,
                             d.deliveryCoords.lat, d.deliveryCoords.lng)
        .then(r => { if (r) _drawRoute(r.geometry, d.pickupCoords.lat, d.pickupCoords.lng,
                                       d.deliveryCoords.lat, d.deliveryCoords.lng); })
        .catch(()=>{});
    } else {
      _drawRoute(null, d.pickupCoords.lat, d.pickupCoords.lng,
                       d.deliveryCoords.lat, d.deliveryCoords.lng);
    }
  }
  return true;
}

/* Tracking-layer failure (permission denied, listener error). Set by the
   listeners below; an error must never be reported as "no delivery". */
let _trackingError = null;

function _renderMapState(d){
  /* 1 — tracking error: honest, recoverable, never a blank page. */
  if (_trackingError) {
    _mapState('⚠️', 'TRACKING TEMPORARILY UNAVAILABLE',
      'We can\'t show the live map right now',
      'Your order is still being processed.<br>We\'ll continue updating the delivery status.',
      '<button class="dt-ms-btn" onclick="dtRetryTracking()">Retry</button>');
    return;
  }

  const status  = d.status;
  const riderId = _riderIdOf(d);
  const pos     = _riderPosOf(d);

  /* 2 — cancelled: no map, plain explanation. */
  if (_TERMINAL_BAD.includes(status)) {
    _mapState('❌', 'DELIVERY ' + String(status || 'cancelled').toUpperCase(),
      'This delivery is no longer active',
      'Live tracking has ended. See the timeline below for the full history.');
    return;
  }

  /* 3 — delivered: keep the map (final positions) rather than yanking it away. */
  if (_TERMINAL_OK.includes(status)) {
    if (_ensureMap(d) && (pos || _dropoffMarker)) {
      if (pos) _updateRiderMarker(pos.lat, pos.lng, _riderNameOf(d));
      const badge = document.getElementById('dtMapBadge');
      const dot   = document.getElementById('dtLiveDot');
      if (badge) badge.textContent = 'Delivered';
      if (dot)   dot.classList.add('stale');
      _showMapRegion(true);
    } else {
      _mapState('✅', 'DELIVERED', 'Your order was delivered',
        'Thanks for shopping with SOKONI.');
    }
    return;
  }

  /* 4 — no rider assigned yet. */
  if (!riderId) {
    _mapState('🔍', 'WAITING FOR RIDER', 'We\'re finding a rider for your delivery',
      'You\'ll see the live map here the moment a rider accepts.' +
      '<span class="dt-ms-dots"><i></i><i></i><i></i></span>');
    return;
  }

  /* 5 — rider assigned, but no usable position yet. */
  if (!pos) {
    _mapState('🏍️', 'RIDER ASSIGNED',
      _esc(_riderNameOf(d)) + ' is handling your delivery',
      'Waiting for the rider\'s location…' +
      '<span class="dt-ms-dots"><i></i><i></i><i></i></span>');
    return;
  }

  /* 6 — LIVE. */
  if (!_ensureMap(d)) {
    _mapState('🗺️', 'MAP UNAVAILABLE', 'The map could not load',
      'Your delivery is still on its way and the status below stays live.',
      '<button class="dt-ms-btn" onclick="dtRetryTracking()">Retry</button>');
    return;
  }
  _showMapRegion(true);
  _updateRiderMarker(pos.lat, pos.lng, _riderNameOf(d));

  _updateBadge(pos, d);
}

/* Single author for the map badge — distance, ETA and freshness composed in one
   place so the live-ETA path and the state machine can't overwrite each other. */
function _updateBadge(pos, d){
  const badge = document.getElementById('dtMapBadge');
  const dot   = document.getElementById('dtLiveDot');
  if (!badge) return;
  const rel   = _relTime(pos?.at);
  /* Anything older than ~5 min is no longer "live" — say so instead of implying it. */
  const stale = !!(rel && (/h ago/.test(rel) || /^([5-9]|\d{2,}) min ago$/.test(rel)));
  if (dot) dot.classList.toggle('stale', stale);

  const parts = [];
  if (pos && _isGeo(d?.deliveryCoords?.lat, d?.deliveryCoords?.lng)) {
    const km = _hav(pos.lat, pos.lng, d.deliveryCoords.lat, d.deliveryCoords.lng);
    parts.push((km < 1 ? Math.round(km/0.05)*50 + ' m' : km.toFixed(1) + ' km') + ' away');
    if (!stale) {
      const etaMin = Math.max(1, Math.ceil((km * 1.35) / 0.416)); /* Nairobi moto ≈25 km/h */
      parts.push(etaMin <= 1 ? 'arriving now' : '~' + etaMin + ' min');
    }
  }
  if (rel) parts.push(rel);
  badge.textContent = parts.length ? parts.join(' · ') : (stale ? 'Location paused' : 'Live GPS');
}

/* Retry: clear the error, rebuild listeners from scratch. */
window.dtRetryTracking = function(){
  _trackingError = null;
  _mapState('⏳', 'RECONNECTING', 'Reconnecting to live tracking',
    'One moment…<span class="dt-ms-dots"><i></i><i></i><i></i></span>');
  try { _deliveryUnsub?.(); } catch(e){}
  try { _gpsUnsub?.(); } catch(e){}
  _deliveryUnsub = null; _gpsUnsub = null; _gpsPos = null;
  _startTracking();
};

/* ── Main delivery listener ── */
let _deliveryUnsub = null;
let _currentData   = null;

function _onDelivery(d) {
  if (!d) return;
  _currentData = d;
  const myUid = _uid();
  const role  = myUid === d.buyerUid        ? 'buyer'
              : myUid === d.sellerUid       ? 'seller'
              : myUid === (d.assignedDriverId || d.assignedRiderId) ? 'rider'
              : 'viewer';

  /* Header */
  const refEl = document.getElementById('dtHeaderRef');
  if (refEl) refEl.textContent = (d.deliveryRef || d.ref || '—') + (role !== 'viewer' ? ' · ' + role : '');

  /* Banner */
  _renderBanner(d.status);

  /* Timeline */
  _renderTimeline(d.status, d.timeline, d._src);

  /* Buyer PIN */
  const pinBox  = document.getElementById('dtPINBox');
  const pinCode = document.getElementById('dtPINCode');
  if (d.proofPIN && role === 'buyer' && !['delivered','buyer_confirmed','cancelled'].includes(d.status)) {
    if (pinBox)  pinBox.style.display  = 'block';
    if (pinCode) pinCode.textContent   = d.proofPIN;
  } else {
    if (pinBox) pinBox.style.display = 'none';
  }

  /* Details */
  _renderDetails(d);

  /* Proof photo (hub deliveries only, shown after delivered) */
  if (d._src === 'hub' && d.proofPhotoUrl && ['delivered','completed'].includes(d.status)) {
    let proofEl = document.getElementById('dtProofPhoto');
    if (!proofEl) {
      proofEl = document.createElement('div');
      proofEl.id = 'dtProofPhoto';
      proofEl.className = 'dt-card';
      document.getElementById('dtDetailsCard')?.after(proofEl);
    }
    proofEl.innerHTML = `
      <div class="dt-card-title">DELIVERY PROOF</div>
      <img src="${d.proofPhotoUrl}" alt="Proof photo" style="width:100%;border-radius:12px;object-fit:cover;max-height:220px;">
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:8px;text-align:center;">📸 Captured by rider at delivery</div>`;
    proofEl.style.display = 'block';
  }

  /* Driver */
  const hasDriver = d.driverName && (
    ['driver_assigned','driver_accepted','driver_at_seller','in_transit'].includes(d.status) ||
    (d._src === 'hub' && ['rider_assigned','rider_en_route','picked_up','in_transit'].includes(d.status))
  );
  if (hasDriver) _renderDriver(d);

  /* Map — one state machine, never a blank region */
  _renderMapState(d);

  /* Live GPS. The dedicated GPS collection is readable only by the rider and
     admins, so for a buyer this is a best-effort ENHANCEMENT — the authoritative
     buyer-visible position is the driverLat/driverLng mirror on this delivery
     doc, which arrives through the delivery listener above. */
  const _rid = _riderIdOf(d);
  if (_rid && !_gpsUnsub && !_isTerminal(d.status)) {
    _attachGPS(_rid, d.driverName, d._src);
  }

  /* If *we* are the assigned rider, publish our position to the canonical
     delivery doc so the buyer's map has a readable source. Stops at terminal. */
  if (role === 'rider' && !_isTerminal(d.status)) _startRiderPush(d);
  else if (_isTerminal(d.status)) _stopRiderPush();

  /* Actions */
  _renderActions(d, role);
}

/* ── URL → start listener ──
   Accepts either a delivery reference (?ref=) or an order id (?order=). The
   order form exists so My Orders has ONE tracking destination: an order whose
   deliveryRef hasn't been written yet used to be routed to a different page with
   a different map that read riderLocations — a collection buyers are not allowed
   to read at all, so that map could never render. Resolving the ref from the
   order here keeps a single canonical tracking surface. */
const params   = new URLSearchParams(location.search);
let   delivRef = params.get('ref') || params.get('deliveryRef');
const orderId  = params.get('order') || params.get('orderId');

let _pkgGotData = false;
let _fallbackTimer = null;

function _startTracking() {
  _pkgGotData = false;
  clearTimeout(_fallbackTimer);

  /* Paint an honest "connecting" state immediately — the map region is never
     blank, not even for the first few hundred milliseconds. */
  if (!_currentData) {
    _mapState('⏳', 'CONNECTING', 'Loading your delivery',
      'Fetching live tracking…<span class="dt-ms-dots"><i></i><i></i><i></i></span>');
  }

  try {
    _deliveryUnsub = SokoniDelivery.listenDelivery(delivRef, data => {
      if (data) { _pkgGotData = true; _delivSource = 'pkg'; _trackingError = null; _onDelivery(data); }
    });
  } catch (e) { _trackingError = e; }

  /* After 4 s, if packageRequests returned nothing, try the deliveries collection */
  _fallbackTimer = setTimeout(() => {
    if (_pkgGotData) return;
    try { _deliveryUnsub?.(); } catch(e){}
    _delivSource = 'hub';
    try {
      _deliveryUnsub = DeliveryHub.listenDeliveryByRef(delivRef, data => {
        if (data) { _trackingError = null; _onDelivery(_normalizeHub(data)); return; }
        if (_pkgGotData) return;
        /* Neither collection yielded the delivery. This is genuinely
           indeterminate from the client — a missing ref and a denied read look
           identical here — so say the recoverable thing, offer Retry, and keep
           the order status intact rather than asserting "no delivery". */
        _trackingError = new Error('unresolved');
        document.getElementById('dtStatusLabel').textContent = 'Tracking temporarily unavailable';
        document.getElementById('dtStatusSub').textContent   =
          'Your order is still being processed. We\'ll keep updating the status.';
        _renderMapState(_currentData || {});
      });
    } catch (e) {
      _trackingError = e;
      _renderMapState(_currentData || {});
    }
  }, 4000);
}

/* Resolve ?order= → deliveryRef off the canonical order doc. Kept as a LIVE
   listener, not a one-shot read: a buyer who opens tracking before dispatch has
   assigned the delivery will roll straight into the map the moment the ref is
   written, with no refresh. */
let _orderUnsub = null;
function _resolveFromOrder(id) {
  document.getElementById('dtHeaderRef').textContent = id;
  _mapState('📦', 'PREPARING YOUR DELIVERY', 'Your order is being prepared',
    'Live tracking starts as soon as the delivery is dispatched.' +
    '<span class="dt-ms-dots"><i></i><i></i><i></i></span>');
  try {
    _orderUnsub = SokoniDB.listenOrder(id, o => {
      if (!o) return;
      /* Keep the buyer informed from the order itself while we wait. */
      const lbl = document.getElementById('dtStatusLabel');
      const sub = document.getElementById('dtStatusSub');
      if (!delivRef) {
        if (lbl) lbl.textContent = 'Order ' + String(o.status || 'received').replace(/_/g, ' ');
        if (sub) sub.textContent = 'We\'ll show the live map once a rider is dispatched.';
      }
      const ref = o.deliveryRef;
      if (ref && !delivRef) {
        delivRef = ref;
        try { _orderUnsub?.(); } catch(e){}
        _orderUnsub = null;
        _startTracking();
      }
    });
  } catch (e) {
    _trackingError = e;
    _renderMapState({});
  }
}

if (delivRef) {
  _startTracking();
} else if (orderId) {
  _resolveFromOrder(orderId);
} else {
  document.getElementById('dtStatusLabel').textContent = 'No delivery reference';
  document.getElementById('dtStatusSub').textContent   = 'This tracking link is missing its delivery reference.';
  _mapState('🔗', 'TRACKING LINK INCOMPLETE', 'We couldn\'t identify this delivery',
    'Open the order from My Orders to track it.',
    '<a class="dt-ms-btn" style="text-decoration:none;display:inline-block;" href="my-orders.html">Go to My Orders</a>');
}

  const comment = document.getElementById('dtCsatComment')?.value?.trim() || '';
  const uid     = _uid();
  const btn     = document.getElementById('dtCsatSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  const data = (_currentData || {});
  firebase.firestore().collection('csatRatings').add({
    deliveryRef:  ref,
    buyerUid:     uid || null,
    riderId:      data.riderId || data.driverId || null,
    riderName:    data.driverName || null,
    rating:       _dtSelectedStar,
    comment:      comment || null,
    createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
  }).then(function() {
    /* Denormalise onto the delivery doc for quick dashboard queries */
    return firebase.firestore().collection('packageRequests').doc(ref).update({
      csatRating:    _dtSelectedStar,
      csatComment:   comment || null,
      csatAt:        firebase.firestore.FieldValue.serverTimestamp(),

    const el = document.getElementById('dtActions');

        <label style="font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;display:block;margin-bottom:6px;">DELIVERY PHOTO</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="dtPhotoInput" type="file" accept="image/*" capture="environment" style="display:none;" onchange="dtPhotoSelected(this,'${ref}')">
          <button type="button" onclick="document.getElementById('dtPhotoInput').click()" style="flex:1;padding:11px;background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.2);color:#00aaff;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;">Take Photo</button>
          <div id="dtPhotoThumb" style="width:40px;height:40px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;"><span style="font-size:18px;">📷</span></div>
        </div>
        <div id="dtPhotoStatus" style="font-size:11px;margin-top:4px;color:rgba(255,255,255,0.4);"></div>
      </div>

      <!-- Customer signature -->
      <div style="margin-bottom:14px;">
        <label style="font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;display:block;margin-bottom:6px;">CUSTOMER SIGNATURE <span style="color:rgba(255,255,255,0.3);font-weight:400;">(optional)</span></label>
        <canvas id="dtSigCanvas" width="320" height="110" style="width:100%;height:110px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;cursor:crosshair;touch-action:none;display:block;"></canvas>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <button type="button" onclick="dtClearSignature()" style="padding:7px 12px;background:rgba(255,100,100,0.08);border:1px solid rgba(255,100,100,0.2);color:#ff6b6b;border-radius:8px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;">Clear</button>
          <div id="dtSigStatus" style="font-size:11px;color:rgba(255,255,255,0.4);align-self:center;"></div>
        </div>
      </div>

      <!-- GPS stamp -->
      <div style="margin-bottom:16px;">
        <label style="font-size:11px;color:rgba(255,255,255,0.5);font-weight:700;display:block;margin-bottom:6px;">GPS LOCATION STAMP</label>
        <button type="button" onclick="dtCaptureGPS('${ref}')" style="width:100%;padding:10px;background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.2);color:#ff8c00;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;">Capture My Location</button>
        <div id="dtGpsStatus" style="font-size:11px;margin-top:4px;color:rgba(255,255,255,0.4);"></div>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" id="dtOtpVerified" value="0">
      <input type="hidden" id="dtQrVerified" value="0">
      <input type="hidden" id="dtPhotoUrl" value="">
      <input type="hidden" id="dtSigDataUrl" value="">
      <input type="hidden" id="dtGpsLat" value="">
      <input type="hidden" id="dtGpsLng" value="">
      <input type="hidden" id="dtGpsAccuracy" value="">

      <div style="display:flex;gap:8px;">
        <button class="dt-btn-primary" style="flex:1;" onclick="dtSubmitProof('${ref}')">Submit & Confirm Delivered</button>
        <button class="dt-btn-secondary" onclick="dtRiderShowCancel()">✕</button>
      </div>
    </div>`;

  /* Init signature canvas */
  _dtInitSignatureCanvas();
};

/* ── QR code scanning via BarcodeDetector API ── */
var _dtQrStream = null;
window.dtStartQRScan = function(ref) {
  const btn = document.getElementById('dtQrBtn');
  const box = document.getElementById('dtQrBox');
  const vid = document.getElementById('dtQrVideo');
  const st  = document.getElementById('dtQrStatus');

  if (_dtQrStream) { dtStopQRScan(); return; }

  if (!('BarcodeDetector' in window)) {
    if (st) st.textContent = 'QR scan not supported on this device — use OTP instead.';
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) {
      _dtQrStream = stream;
      if (vid) vid.srcObject = stream;
      if (box) box.style.display = 'block';
      if (btn) btn.textContent = 'Stop Scan';
      if (st) st.textContent = 'Point camera at customer QR code...';

      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      var scanInterval = setInterval(function() {
        if (!_dtQrStream) { clearInterval(scanInterval); return; }
        detector.detect(vid).then(function(codes) {
          if (codes.length === 0) return;
          const code = codes[0].rawValue;
          /* Validate: QR must contain deliveryRef or a known prefix */
          if (code.includes(ref) || code.startsWith('SK-') || code.startsWith('SOKONI-')) {
            clearInterval(scanInterval);
            dtStopQRScan();
            document.getElementById('dtQrVerified').value = '1';
            if (st) { st.textContent = 'QR verified!'; st.style.color = '#71ff00'; }
            if (btn) { btn.style.background = 'rgba(113,255,0,0.12)'; btn.style.borderColor = 'rgba(113,255,0,0.4)'; btn.textContent = 'QR Verified'; btn.onclick = null; }
            /* Auto-fill OTP from QR if it embeds the code (format: REF:OTP) */
            const parts = code.split(':');
            if (parts.length >= 2) {
              const otpEl = document.getElementById('dtOtpInput');
              if (otpEl && !otpEl.value) { otpEl.value = parts[parts.length - 1].slice(0, 6); }
            }
          }
        }).catch(function() {});
      }, 400);
    })
    .catch(function(e) {
      if (st) st.textContent = 'Camera access denied: ' + e.message;
    });
};

window.dtStopQRScan = function() {
  if (_dtQrStream) { _dtQrStream.getTracks().forEach(t => t.stop()); _dtQrStream = null; }
  const box = document.getElementById('dtQrBox');
  if (box) box.style.display = 'none';
  const btn = document.getElementById('dtQrBtn');
  if (btn && btn.textContent === 'Stop Scan') btn.textContent = 'Scan QR Code';
};

/* ── Canvas signature pad ── */
function _dtInitSignatureCanvas() {
  const canvas = document.getElementById('dtSigCanvas');
  if (!canvas) return;
  const ctx   = canvas.getContext('2d');
  var drawing = false;
  var hasSig  = false;

  function _pos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }

  ctx.strokeStyle = '#71ff00'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';

  canvas.addEventListener('pointerdown', function(e) { e.preventDefault(); drawing = true; const p = _pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  canvas.addEventListener('pointermove', function(e) { if (!drawing) return; e.preventDefault(); const p = _pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasSig = true; });
  canvas.addEventListener('pointerup',   function()  { if (drawing) { drawing = false; if (hasSig) _dtSaveSignature(); } });
  canvas.addEventListener('pointerleave',function()  { if (drawing) { drawing = false; if (hasSig) _dtSaveSignature(); } });
}

function _dtSaveSignature() {
  const canvas = document.getElementById('dtSigCanvas');
  if (!canvas) return;
  const dataUrl = canvas.toDataURL('image/png');
  const field   = document.getElementById('dtSigDataUrl');
  if (field) field.value = dataUrl;
  const st = document.getElementById('dtSigStatus');
  if (st) { st.textContent = 'Signature captured.'; st.style.color = '#71ff00'; }
}

window.dtClearSignature = function() {
  const canvas = document.getElementById('dtSigCanvas');
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  const field = document.getElementById('dtSigDataUrl');
  if (field) field.value = '';
  const st = document.getElementById('dtSigStatus');
  if (st) { st.textContent = ''; }
};

window.dtVerifyOTP = function (ref) {
  const input = document.getElementById('dtOtpInput');
  const statusEl = document.getElementById('dtOtpStatus');
  if (!input || !statusEl) return;
  const entered = input.value.trim();
  if (entered.length !== 6) { statusEl.textContent = 'Enter 6-digit code.'; statusEl.style.color = '#ff6b6b'; return; }
  /* Validate against Firestore deliveryOTP */
  firebase.firestore().collection('packageRequests').doc(ref).get().then(function (snap) {
    const data = snap.data() || {};
    const expected = String(data.deliveryOTP || '');
    if (!expected) { statusEl.textContent = 'OTP not set on this delivery.'; statusEl.style.color = '#ff8c00'; return; }
    if (entered === expected) {
      statusEl.textContent = 'OTP verified!'; statusEl.style.color = '#71ff00';
      if (input) { input.style.borderColor = '#71ff00'; input.disabled = true; }
      document.getElementById('dtOtpVerified').value = '1';
    } else {
      statusEl.textContent = 'Incorrect OTP. Ask customer to check their SMS.'; statusEl.style.color = '#ff6b6b';
    }
  }).catch(function (e) { statusEl.textContent = 'Error: ' + e.message; statusEl.style.color = '#ff6b6b'; });
};

window.dtPhotoSelected = function (input, ref) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('dtPhotoStatus');
  const thumb    = document.getElementById('dtPhotoThumb');
  if (statusEl) statusEl.textContent = 'Uploading...';
  /* Preview */
  const reader = new FileReader();
  reader.onload = function (e) {
    if (thumb) thumb.innerHTML = '<img src="'+e.target.result+'" style="width:100%;height:100%;object-fit:cover;">';
  };
  reader.readAsDataURL(file);
  /* Upload to Firebase Storage */
  const uid = firebase.auth().currentUser?.uid || 'unknown';
  const path = 'deliveryProofs/'+ref+'_'+uid+'_'+Date.now()+'.jpg';
  const storageRef = firebase.storage().ref().child(path);
  storageRef.put(file, { contentType: 'image/jpeg' })
    .then(function (snap) { return snap.ref.getDownloadURL(); })
    .then(function (url) {
      document.getElementById('dtPhotoUrl').value = url;
      if (statusEl) { statusEl.textContent = 'Photo uploaded.'; statusEl.style.color = '#71ff00'; }
    })
    .catch(function (e) {
      if (statusEl) { statusEl.textContent = 'Upload failed: '+e.message; statusEl.style.color = '#ff6b6b'; }
    });
};

window.dtCaptureGPS = function (ref) {
  const statusEl = document.getElementById('dtGpsStatus');
  if (!navigator.geolocation) { if (statusEl) statusEl.textContent = 'GPS not supported'; return; }
  if (statusEl) statusEl.textContent = 'Getting location...';
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = Math.round(pos.coords.accuracy);
      document.getElementById('dtGpsLat').value      = lat;
      document.getElementById('dtGpsLng').value      = lng;
      document.getElementById('dtGpsAccuracy').value = acc;
      if (statusEl) { statusEl.textContent = 'Location captured: '+lat.toFixed(5)+', '+lng.toFixed(5)+' (±'+acc+'m)'; statusEl.style.color = '#71ff00'; }
    },
    function (err) {
      if (statusEl) { statusEl.textContent = 'GPS error: '+err.message; statusEl.style.color = '#ff6b6b'; }
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
};

window.dtSubmitProof = function (ref) {
  const uid = _uid(); if (!uid) { toast('Sign in required', false); return; }
  const otp        = document.getElementById('dtOtpInput')?.value?.trim() || '';
  const otpVerified= document.getElementById('dtOtpVerified')?.value === '1';
  const qrVerified = document.getElementById('dtQrVerified')?.value  === '1';
  const photoUrl   = document.getElementById('dtPhotoUrl')?.value    || '';
  const sigDataUrl = document.getElementById('dtSigDataUrl')?.value  || '';
  const gpsLat     = parseFloat(document.getElementById('dtGpsLat')?.value)  || null;
  const gpsLng     = parseFloat(document.getElementById('dtGpsLng')?.value)  || null;
  const gpsAcc     = parseFloat(document.getElementById('dtGpsAccuracy')?.value) || null;

  /* At least one primary verification method required */
  if (!otpVerified && !qrVerified && !otp) { toast('Please verify OTP or scan QR code first', false); return; }

  const btn = document.querySelector('#dtActions .dt-btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

  /* Upload signature to Storage if captured */
  const _doSubmit = function(signatureUrl) {
    firebase.functions().httpsCallable('captureProofOfDelivery')({
      deliveryRef:      ref,
      otp,
      qrVerified,
      photoUrl:         photoUrl    || null,
      signatureDataUrl: signatureUrl || null,
      gpsLat,
      gpsLng,
      gpsAccuracyM:     gpsAcc,
    })
      .then(function () { toast('Delivery confirmed! Payment will be processed shortly.'); dtStopQRScan(); })
      .catch(function (e) {
        toast(e.message || 'Could not confirm delivery', false);
        if (btn) { btn.disabled = false; btn.textContent = 'Submit & Confirm Delivered'; }
      });
  };

  if (sigDataUrl) {
    /* Convert data URL to Blob and upload */
    fetch(sigDataUrl).then(r => r.blob()).then(function(blob) {
      const uid2 = uid || 'anon';
      const path = 'deliverySignatures/' + ref + '_' + uid2 + '_' + Date.now() + '.png';
      return firebase.storage().ref().child(path).put(blob, { contentType: 'image/png' });
    }).then(function(snap) { return snap.ref.getDownloadURL(); })
      .then(function(url)  { _doSubmit(url); })
      .catch(function()    { _doSubmit(null); }); /* non-fatal — proceed without sig URL */
  } else {
    _doSubmit(null);
  }
};

window.dtRiderShowCancel = function() {
  if (_currentData) _renderActions(_currentData, 'rider');
};

window.dtRiderDelivered = async function(ref) {
  const uid = _uid(); if (!uid) { toast('Sign in required', false); return; }
  /* Legacy path — now redirects to proof flow */
  window.dtRiderShowProof(ref);
};

/* ── Hub delivery actions ── */
window.dtHubConfirm = async function(fsId) {
  const uid = _uid();
  const btn = document.querySelector('#dtActions button');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Confirming…'; }
  try {
    await DeliveryHub.confirmReceipt(fsId, uid);
    toast('🎉 Receipt confirmed! Thank you for using SOKONI.');
  } catch(e) {
    toast(e.message || 'Could not confirm', false);
    if (btn) { btn.disabled = false; btn.textContent = '🎉 I Received My Package!'; }
  }
};

window.dtHubCancel = async function(fsId, _c) {
  if (!_c) { _skConfirm('Cancel this delivery?', ()=>window.dtHubCancel(fsId,true)); return; }
  const uid = _uid();
  try {
    await DeliveryHub.cancelDelivery(fsId, uid, 'Sender cancelled');
    toast('Delivery cancelled.');
  } catch(e) { toast(e.message || 'Could not cancel', false); }
};

/* ── Clean up on unload ── */
window.addEventListener('beforeunload', () => {
  _deliveryUnsub?.();
  _gpsUnsub?.();
  _stopRiderPush();
  clearTimeout(_fallbackTimer);
  if (_animFrame) { cancelAnimationFrame(_animFrame); _animFrame = null; }
});
