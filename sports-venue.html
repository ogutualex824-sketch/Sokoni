<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Venue — SOKONI Sports Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">

<!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
     through SokoniCart; without this tag the pip cannot render a count. -->

<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:white;min-height:100vh;padding-bottom:140px;}
.vn-nav{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(8,8,8,0.97);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);}
.vn-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:16px;flex-shrink:0;}
.vn-nav-title{font-size:14px;font-weight:800;flex:1;}
/* HERO */
.vn-hero-img{height:180px;background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(8,8,8,0.9));display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;}
.vn-hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,rgba(8,8,8,0.95),transparent);}
.vn-hero-name{font-size:20px;font-weight:900;line-height:1.2;}
.vn-hero-meta{font-size:12px;color:rgba(255,255,255,0.5);margin-top:3px;}
/* PILLS */
.vn-pills{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);}
.vn-pill{padding:4px 10px;border-radius:7px;font-size:10px;font-weight:900;}
/* SPECS */
.vn-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);}
.vn-spec{text-align:center;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 8px;}
.vn-spec-val{font-size:16px;font-weight:900;color:#f59e0b;}
.vn-spec-lbl{font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px;}
/* TABS */
.vn-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);}
.vn-tabs::-webkit-scrollbar{display:none;}
.vn-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .2s;}
.vn-tab.active{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.35);color:#f59e0b;}
.vn-body{padding:16px;}
/* TIME SLOTS */
.vn-date-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:4px;}
.vn-date-row::-webkit-scrollbar{display:none;}
.vn-date-chip{padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);white-space:nowrap;font-family:inherit;flex-shrink:0;text-align:center;transition:all .2s;}
.vn-date-chip.active{background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.35);color:#f59e0b;}
.vn-slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.vn-slot{padding:10px 6px;border-radius:10px;font-size:11px;font-weight:800;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.6);font-family:inherit;transition:all .2s;}
.vn-slot.selected{background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.4);color:#f59e0b;}
.vn-slot.booked{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.05);color:rgba(255,255,255,0.2);cursor:not-allowed;text-decoration:line-through;}
/* AMENITY */
.vn-amenity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.vn-amenity{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.6);}
.vn-amenity-icon{font-size:16px;flex-shrink:0;}
/* REVIEW */
.vn-review-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:8px;}
.vn-review-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.vn-reviewer{font-size:12px;font-weight:800;}
.vn-review-time{font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto;}
.vn-review-body{font-size:11px;color:rgba(255,255,255,0.55);line-height:1.6;}
/* BOOKING BAR */
.vn-book-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.08);z-index:50;backdrop-filter:blur(16px);}
.vn-book-price{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.vn-book-price span{font-size:20px;font-weight:900;color:#f59e0b;}
.vn-book-btn{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:#050505;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;}
/* MODAL */
.vn-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.vn-modal-overlay.open{display:flex;}
.vn-modal{background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;}
.vn-modal-title{font-size:16px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.vn-modal-close{background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:30px;height:30px;color:white;font-size:16px;cursor:pointer;}
.vn-field{margin-bottom:14px;}
.vn-field label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.vn-field input,.vn-field select,.vn-field textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:16px;font-family:inherit;}
.vn-field input:focus,.vn-field select:focus,.vn-field textarea:focus{outline:none;border-color:rgba(245,158,11,0.4);}
.vn-field select option{background:#111;}
.vn-field textarea{resize:vertical;min-height:70px;}
.vn-submit-btn{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:#050505;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:4px;}
.vn-cost-box{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.15);border-radius:10px;padding:12px;text-align:center;margin-bottom:14px;}
.vn-cost-total{font-size:22px;font-weight:900;color:#f59e0b;}
.vn-cost-breakdown{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}
.empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.3);}
</style>
  <script type="module" src="firebase.js"></script>
</head>
<body>
<script src="splash.js"></script>
<script src="sokoni-sports.js"></script>

<nav class="vn-nav">
  <a href="sports-hub.html" class="vn-back" aria-label="Back to Sports Hub">←</a>
  <span class="vn-nav-title" id="pageTitle">Venue</span>
  <button onclick="shareVenue()" aria-label="Share" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:white;">📤</button>
</nav>

<div id="mainContent"><div class="empty" role="status">Loading…</div></div>

<!-- BOOKING BAR — booking itself happens on SOKONI Venues (venue-booking.html), the real venue engine -->
<div class="vn-book-bar" id="bookBar" style="display:none;">
  <div class="vn-book-price">From <span id="priceDisplay">—</span>/hour</div>
  <a class="vn-book-btn" id="bookBtn" href="venue-booking.html" style="display:block;text-align:center;text-decoration:none;">🏟️ Book on SOKONI Venues</a>
</div>

<script>
const S = window.SokoniSports;
const esc = S.esc;
const params = new URLSearchParams(location.search);
const VN_ID = params.get('venueId') || params.get('id') || '';
let venue = null;        /* bookingDispatch venueGetPublic */
let activeTab = 'availability';
let selectedDate = '';

function venuesLink() {
  return `<a href="venue-booking.html" style="display:inline-block;margin-top:12px;padding:10px 20px;background:#f59e0b;border-radius:10px;color:#050505;font-weight:900;text-decoration:none;">🏟️ Browse venues on SOKONI Venues</a>`;
}

async function init() {
  if (!VN_ID) {
    document.getElementById('mainContent').innerHTML = `<div class="empty"><div style="font-size:48px;margin-bottom:12px;">🏟️</div><p style="font-weight:700;">Find a venue</p><p style="font-size:11px;margin-top:6px;">Pitches, courts and halls are listed and booked on SOKONI Venues.</p>${venuesLink()}</div>`;
    return;
  }
  document.getElementById('mainContent').innerHTML = '<div class="empty" role="status">Loading…</div>';
  try { venue = await S.getVenue(VN_ID); }
  catch (e) {
    const code = e && e.code ? String(e.code) : '';
    document.getElementById('mainContent').innerHTML = /not-found|invalid-argument/.test(code)
      ? `<div class="empty"><div style="font-size:48px;margin-bottom:12px;">🏟️</div><p>Venue not found.</p>${venuesLink()}</div>`
      : `<div class="empty"><p>Couldn't load — <button onclick="init()" style="background:none;border:none;color:#f59e0b;font:inherit;font-weight:800;cursor:pointer;">try again</button></p></div>`;
    return;
  }
  if (!venue) { document.getElementById('mainContent').innerHTML = `<div class="empty"><p>Venue not found.</p>${venuesLink()}</div>`; return; }
  document.title = (venue.name || 'Venue') + ' — SOKONI Sports';
  document.getElementById('pageTitle').textContent = venue.name || 'Venue';
  document.getElementById('priceDisplay').textContent = venue.pricePerHour ? 'KES ' + S.fmt(venue.pricePerHour) : '—';
  document.getElementById('bookBar').style.display = 'block';
  renderPage();
}

/* A rating is shown only when the venue record carries one; otherwise '—' (never an invented default). */
function ratingLabel() {
  const r = Number(venue.rating);
  return isFinite(r) && r > 0 ? r.toFixed(1) : '—';
}
function typeLabel(t) { return t ? String(t).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '—'; }

function renderPage() {
  const el = document.getElementById('mainContent');
  el.innerHTML = `
    <div class="vn-hero-img">
      🏟️
      <div class="vn-hero-overlay">
        <div class="vn-hero-name">${esc(venue.name || 'Venue')}</div>
        <div class="vn-hero-meta">📍 ${esc(venue.location || '—')} · ⭐ ${esc(ratingLabel())}</div>
      </div>
    </div>
    <div class="vn-pills">
      <span class="vn-pill" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);color:#f59e0b;">${esc(typeLabel(venue.type))}</span>
    </div>
    <div class="vn-specs">
      <div class="vn-spec"><div class="vn-spec-val">${venue.pricePerHour ? 'KES ' + esc(S.fmt(venue.pricePerHour)) : '—'}</div><div class="vn-spec-lbl">Per Hour</div></div>
      <div class="vn-spec"><div class="vn-spec-val">${venue.capacity ? esc(S.fmt(venue.capacity)) : '—'}</div><div class="vn-spec-lbl">Capacity</div></div>
      <div class="vn-spec"><div class="vn-spec-val">${esc(ratingLabel())}</div><div class="vn-spec-lbl">Rating</div></div>
    </div>
    <div class="vn-tabs" id="vnTabs"></div>
    <div class="vn-body" id="vnBody"></div>`;
  renderTabs();
  renderContent(activeTab);
}

const TABS = [
  {id:'availability', label:'📅 Availability'},
  {id:'about',        label:'ℹ️ About'},
  {id:'amenities',    label:'🛎 Amenities'},
];

function renderTabs() {
  document.getElementById('vnTabs').innerHTML = TABS.map(t=>
    `<button class="vn-tab${t.id===activeTab?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(tab) { activeTab = tab; renderTabs(); renderContent(tab); }

function renderContent(tab) {
  const el = document.getElementById('vnBody');
  if (tab === 'availability') renderAvailability(el);
  else if (tab === 'about') renderAbout(el);
  else if (tab === 'amenities') renderAmenities(el);
}

/* ── AVAILABILITY (read-only, the same server op the booking page uses) ── */
function isoDay(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function renderAvailability(el) {
  const today = new Date();
  const dates = Array.from({length:7},(_,i)=>{
    const d = new Date(today); d.setDate(today.getDate()+i);
    return { iso: isoDay(d), label: i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-KE',{weekday:'short',month:'short',day:'numeric'}) };
  });
  if (!selectedDate) selectedDate = dates[0].iso;
  const dateAtCall = selectedDate;
  const head = `
    <div style="font-size:12px;font-weight:800;margin-bottom:10px;color:rgba(255,255,255,0.6);">Select Date</div>
    <div class="vn-date-row">
      ${dates.map(d=>`<button class="vn-date-chip${d.iso===selectedDate?' active':''}" onclick="selectDate('${d.iso}')">${esc(d.label)}</button>`).join('')}
    </div>`;
  const foot = `<div style="font-size:11px;color:rgba(255,255,255,0.35);line-height:1.6;margin:10px 0;">Booking, pricing and payment happen on SOKONI Venues — open the venue there to reserve a slot.</div>
    <a href="venue-booking.html" style="display:block;width:100%;padding:13px;background:#f59e0b;border-radius:11px;color:#050505;font-size:14px;font-weight:900;text-align:center;text-decoration:none;">🏟️ Book on SOKONI Venues</a>`;
  el.innerHTML = head + '<div class="empty" role="status" style="padding:20px;">Loading…</div>' + foot;
  let res;
  try { res = await S.getVenueAvailability(VN_ID, dateAtCall); }
  catch (e) {
    if (dateAtCall !== selectedDate || activeTab !== 'availability') return;
    el.innerHTML = head + `<div class="empty" style="padding:20px;">Couldn't load — <button onclick="renderContent('availability')" style="background:none;border:none;color:#f59e0b;font:inherit;font-weight:800;cursor:pointer;">try again</button></div>` + foot;
    return;
  }
  if (dateAtCall !== selectedDate || activeTab !== 'availability') return;
  const slots = (res && Array.isArray(res.slots)) ? res.slots : [];
  let grid;
  if (res && res.status === 'closed') grid = '<div class="empty" style="padding:20px;">Closed on this day.</div>';
  else if (res && res.status === 'maintenance') grid = '<div class="empty" style="padding:20px;">Under maintenance on this day.</div>';
  else if (!slots.length) grid = '<div class="empty" style="padding:20px;">No slots for this date.</div>';
  else grid = `<div class="vn-slot-grid">${slots.map(s => `<div class="vn-slot${s.available ? '' : ' booked'}" aria-label="${esc(s.startTime)} ${s.available ? 'available' : 'unavailable'}">${esc(s.startTime)}${s.endTime ? '–' + esc(s.endTime) : ''}${s.available ? '' : '<br><span style="font-size:8px;">Taken</span>'}</div>`).join('')}</div>`;
  el.innerHTML = head + grid + foot;
}

function selectDate(d) { selectedDate = d; renderContent('availability'); }

/* ── ABOUT ── */
function renderAbout(el) {
  el.innerHTML = `
    <div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;margin-bottom:14px;">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;">About this Venue</div>
      <p style="font-size:12px;color:rgba(255,255,255,0.55);line-height:1.7;">${venue.description ? esc(venue.description) : 'No description yet.'}</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      ${infoBox('📍 Location', venue.location || '—')}
      ${infoBox('🏷️ Type', typeLabel(venue.type))}
      ${infoBox('💰 Per Hour', venue.pricePerHour ? 'KES ' + S.fmt(venue.pricePerHour) : '—')}
      ${infoBox('👥 Capacity', venue.capacity ? S.fmt(venue.capacity) : '—')}
    </div>
    ${venue.rules ? `<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;margin-bottom:14px;"><div style="font-size:13px;font-weight:800;margin-bottom:8px;">Rules &amp; Policies</div><p style="font-size:12px;color:rgba(255,255,255,0.55);line-height:1.7;">${esc(venue.rules)}</p></div>` : ''}
    ${venue.location ? `<a href="https://maps.google.com?q=${encodeURIComponent((venue.name || '') + ' ' + venue.location)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:10px;color:#3b82f6;font-size:12px;font-weight:800;text-decoration:none;">🗺️ Google Maps</a>` : ''}`;
}

function infoBox(label, val) {
  return `<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;">
    <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:3px;">${esc(label)}</div>
    <div style="font-size:12px;font-weight:800;">${esc(val)}</div>
  </div>`;
}

/* ── AMENITIES (as listed on the venue record) ── */
function renderAmenities(el) {
  const amenities = Array.isArray(venue.amenities) ? venue.amenities.filter(a => typeof a === 'string' && a) : [];
  if (!amenities.length) { el.innerHTML = '<div class="empty"><p>No amenities listed yet.</p></div>'; return; }
  el.innerHTML = `<div class="vn-amenity-grid">${amenities.map(a => `<div class="vn-amenity"><span class="vn-amenity-icon">✓</span>${esc(a.replace(/_/g,' '))}</div>`).join('')}</div>`;
}

function shareVenue() {
  const url = location.href;
  if (navigator.share) navigator.share({title: (venue && venue.name) || 'SOKONI Sports Venue', url}).catch(()=>{});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>(window._skToast||alert)('Venue link copied!')).catch(()=>{});
}

init();
</script>
