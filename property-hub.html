<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property Hub — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#f0883e}
.hero{background:linear-gradient(135deg,#0d1117,#1a0f00);padding:40px 16px 28px;text-align:center}
.hero h1{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:8px}
.hero p{color:#8b949e;font-size:14px;max-width:480px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22;overflow-x:auto}
.tab{padding:12px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e;white-space:nowrap}
.tab.active{color:#e6edf3;border-color:#f0883e}
.fbar{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.pill.active,.pill:hover{background:#f0883e;border-color:#f0883e;color:#fff}
.fbar select,.fbar input{padding:6px 10px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:#f0883e;transform:translateY(-2px)}
.cimg{height:175px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}
.ltag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.ts{background:#f0883e;color:#fff}.tr{background:#3fb950;color:#fff}.tl{background:#58a6ff;color:#fff}
.cbody{padding:14px}
.cprice{font-size:19px;font-weight:700;color:#f0883e;margin-bottom:3px}
.ctitle{font-size:14px;font-weight:600;margin-bottom:3px}
.cloc{font-size:12px;color:#8b949e;margin-bottom:8px}
.cspecs{display:flex;gap:10px;font-size:12px;color:#8b949e}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#f0883e;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-o{background:#f0883e;color:#fff}.btn-o:hover{background:#e0773d}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-out:hover{border-color:#8b949e}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:660px;margin:auto}
.mhdr{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.mhdr h2{font-size:16px;font-weight:600}.xbtn{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
.mbody{padding:20px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:14px;border-radius:8px;overflow:hidden}
.ph{height:110px;background:#21262d;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ii label{font-size:11px;color:#8b949e;display:block;margin-bottom:2px}.ii span{font-size:14px;font-weight:600}
.atags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.atag{padding:3px 9px;background:#21262d;border-radius:6px;font-size:12px;color:#8b949e}
.divider{border:none;border-top:1px solid #30363d;margin:14px 0}
.atabs{display:flex;border-bottom:1px solid #30363d;margin-bottom:16px}
.atab{padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;color:#8b949e}
.atab.active{color:#e6edf3;border-color:#f0883e}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px}
.fg input,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg textarea{resize:vertical;min-height:76px}
.empty{text-align:center;padding:60px;color:#8b949e}
.stat{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600}
.sa{background:#1a3a2a;color:#3fb950}.si{background:#2d2a1a;color:#e3b341}.sd{background:#21262d;color:#8b949e}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.igrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">🏠 Property Hub</div>
  <div style="margin-left:auto"><button class="btn btn-out" style="padding:7px 14px;font-size:13px" onclick="setTab('agent',document.querySelectorAll('.tab')[3])">Agent Portal</button></div>
</div>
<div class="hero">
  <h1>Find Your Perfect Property</h1>
  <p>Apartments, houses, land & commercial spaces for sale and rent across Kenya.</p>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('buy',this)">🏷️ For Sale</div>
  <div class="tab" onclick="setTab('rent',this)">🔑 For Rent</div>
  <div class="tab" onclick="setTab('let',this)">📅 Short Let</div>
  <div class="tab" onclick="setTab('agent',this)">📊 Agent Portal</div>
</div>
<div class="fbar">
  <div id="typeF" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <select id="bedsF" onchange="filter()"><option value="">Any Beds</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select>
  <input type="number" id="maxP" placeholder="Max KES" style="width:110px" oninput="filter()">
  <input type="text" id="cityF" placeholder="City…" style="width:110px" oninput="filter()">
</div>
<div class="container">
  <div id="tBuy"><div class="empty"><div class="spinner"></div></div></div>
  <div id="tRent" style="display:none"><div class="empty"><div class="spinner"></div></div></div>
  <div id="tLet" style="display:none"><div class="empty"><div class="spinner"></div></div></div>
  <div id="tAgent" style="display:none"><div id="agentArea" class="empty">Loading…</div></div>
  <div style="text-align:center;margin-top:20px;display:none" id="moreBtn">
    <button class="btn btn-out" onclick="loadMore()">Load More</button>
  </div>
</div>

<div class="overlay" id="propModal">
  <div class="modal">
    <div class="mhdr"><h2 id="mTitle"></h2><button class="xbtn" onclick="close('propModal')">×</button></div>
    <div class="mbody">
      <div class="photos" id="mPhotos"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <div style="font-size:22px;font-weight:700;color:#f0883e" id="mPrice"></div>
        <span id="mLtype" class="ltag"></span>
      </div>
      <div style="color:#8b949e;font-size:13px;margin-bottom:10px" id="mLoc"></div>
      <div class="igrid" id="mInfo"></div>
      <div class="atags" id="mAmen"></div>
      <p id="mDesc" style="font-size:14px;color:#8b949e;line-height:1.6;margin-bottom:14px"></p>
      <hr class="divider">
      <div class="atabs">
        <div class="atab active" onclick="selActionTab('enq',this)">📧 Enquiry</div>
        <div class="atab" onclick="selActionTab('view',this)">📅 Schedule Viewing</div>
      </div>
      <div id="fEnq">
        <div class="fg"><label>Message</label><textarea id="enqMsg" placeholder="I'm interested in this property…"></textarea></div>
        <div class="fg"><label>Phone (optional)</label><input type="tel" id="enqPh" placeholder="+254…"></div>
        <div class="fg"><label>Budget (optional, KES)</label><input type="number" id="enqBudget"></div>
        <button class="btn btn-o" style="width:100%" onclick="sendEnq()">Send Enquiry</button>
      </div>
      <div id="fView" style="display:none">
        <div class="fg"><label>Preferred Date</label><input type="date" id="vDate"></div>
        <div class="fg"><label>Preferred Time</label><input type="text" id="vTime" placeholder="e.g. 2:00 PM"></div>
        <div class="fg"><label>Notes</label><textarea id="vNotes" placeholder="Any questions or access notes…"></textarea></div>
        <button class="btn btn-o" style="width:100%" onclick="sendView()">Schedule Viewing</button>
      </div>
    </div>
  </div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,all=[],curType='for_sale',sel=null,cursor=null;
const PTYPES=['apartment','house','townhouse','villa','land','commercial','studio','other'];
const PEMO={apartment:'🏢',house:'🏠',townhouse:'🏘️',villa:'🏡',land:'🌿',commercial:'🏪',studio:'🛏️',other:'🏗️'};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
function open(id){document.getElementById(id).classList.add('open');}
function close(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
try{app=firebase.initializeApp(firebaseConfig,'prop');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

const tabMap={buy:'for_sale',rent:'for_rent',let:'short_let'};

function buildTypeFilters(){
  document.getElementById('typeF').innerHTML=PTYPES.map(t=>`<div class="pill" onclick="toggleType('${t}',this)">${PEMO[t]} ${t}</div>`).join('');
}
let activeT=new Set();
function toggleType(t,el){activeT.has(t)?(activeT.delete(t),el.classList.remove('active')):(activeT.add(t),el.classList.add('active'));filter();}

function filter(){
  const maxP=parseFloat(document.getElementById('maxP').value)||Infinity;
  const minB=parseInt(document.getElementById('bedsF').value)||0;
  const city=document.getElementById('cityF').value.toLowerCase();
  let list=[...all];
  if(activeT.size) list=list.filter(l=>activeT.has(l.propertyType));
  if(maxP<Infinity) list=list.filter(l=>l.price<=maxP);
  if(minB) list=list.filter(l=>l.bedrooms>=minB);
  if(city) list=list.filter(l=>(l.city||'').toLowerCase().includes(city));
  render(list);
}

function tabId(t){return{for_sale:'tBuy',for_rent:'tRent',short_let:'tLet'}[t]||'tBuy';}

async function loadListings(lt){
  curType=lt;cursor=null;
  const tid=tabId(lt);
  document.getElementById(tid).innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('listProperties',{listingType:lt,limit:24});
  if(!r.ok){document.getElementById(tid).innerHTML=`<div class="empty">Could not load listings.</div>`;return;}
  all=r.data.listings||[];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}
async function loadMore(){
  if(!cursor)return;
  const r=await call('listProperties',{listingType:curType,limit:24,cursor});
  if(!r.ok)return;
  all=[...all,...(r.data.listings||[])];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}

function render(list){
  const tid=tabId(curType);
  if(!list.length){document.getElementById(tid).innerHTML='<div class="empty">No listings found.</div>';return;}
  const bmap={for_sale:'ts',for_rent:'tr',short_let:'tl'};
  document.getElementById(tid).innerHTML='<div class="grid">'+list.map(l=>`
    <div class="card" onclick="openProp('${esc(l.listingId)}')">
      <div class="cimg">${l.images?.[0]?`<img src="${esc(l.images[0])}" loading="lazy" onerror="this.style.display='none'">`:PEMO[l.propertyType]||'🏠'}<span class="ltag ${bmap[l.listingType]||'ts'}">${(l.listingType||'').replace(/_/g,' ')}</span></div>
      <div class="cbody">
        <div class="cprice">KES ${(l.price||0).toLocaleString()}</div>
        <div class="ctitle">${esc(l.title)}</div>
        <div class="cloc">📍 ${esc([l.neighborhood,l.city,l.county].filter(Boolean).join(', '))}</div>
        <div class="cspecs">
          ${l.bedrooms?`<span>🛏 ${l.bedrooms}</span>`:''}${l.bathrooms?`<span>🚿 ${l.bathrooms}</span>`:''}
          ${l.sizeM2?`<span>📐 ${l.sizeM2}m²</span>`:''}${l.furnished?'<span>🪑 Furnished</span>':''}
        </div>
      </div>
    </div>`).join('')+'</div>';
}

async function openProp(id){
  const cached=all.find(l=>l.listingId===id);
  if(cached&&!cached.description){const r=await call('getProperty',{listingId:id});sel=r.ok?r.data:cached;}
  else sel=cached||{};
  const l=sel;
  document.getElementById('mTitle').textContent=l.title||'';
  document.getElementById('mPrice').textContent=`KES ${(l.price||0).toLocaleString()}${l.listingType==='for_rent'?'/mo':''}`;
  const bmap={for_sale:['ts','For Sale'],for_rent:['tr','For Rent'],short_let:['tl','Short Let']};
  const [cls,lbl]=bmap[l.listingType]||['ts',''];
  document.getElementById('mLtype').className=`ltag ${cls}`;document.getElementById('mLtype').textContent=lbl;
  document.getElementById('mLoc').textContent='📍 '+[l.address,l.neighborhood,l.city,l.county].filter(Boolean).join(', ');
  const imgs=(l.images||[]).slice(0,3);
  document.getElementById('mPhotos').innerHTML=imgs.length?imgs.map(i=>`<div class="ph"><img src="${esc(i)}" loading="lazy" onerror="this.textContent='${PEMO[l.propertyType]||'🏠'}'"></div>`).join(''):`<div class="ph" style="grid-column:1/-1;font-size:48px">${PEMO[l.propertyType]||'🏠'}</div>`;
  document.getElementById('mInfo').innerHTML=[['Type',l.propertyType?.replace(/_/g,' ')],['Beds',l.bedrooms],['Baths',l.bathrooms],['Size',l.sizeM2?l.sizeM2+'m²':null],['Built',l.yearBuilt],['Parking',l.parkingSpaces||null],['Furnished',l.furnished?'Yes':'No']].filter(([,v])=>v!=null).map(([k,v])=>`<div class="ii"><label>${k}</label><span>${esc(String(v))}</span></div>`).join('');
  document.getElementById('mAmen').innerHTML=(l.amenities||[]).map(a=>`<span class="atag">${esc(a)}</span>`).join('');
  document.getElementById('mDesc').textContent=l.description||'';
  document.getElementById('vDate').min=new Date().toISOString().split('T')[0];
  open('propModal');
}

function selActionTab(t,el){
  document.querySelectorAll('.atab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  document.getElementById('fEnq').style.display=t==='enq'?'':'none';
  document.getElementById('fView').style.display=t==='view'?'':'none';
}
async function sendEnq(){
  if(!cu){toast('Sign in to send enquiries',false);return;}
  const msg=document.getElementById('enqMsg').value.trim();
  if(!msg){toast('Write a message',false);return;}
  const r=await call('submitPropertyEnquiry',{listingId:sel.listingId,message:msg,phone:document.getElementById('enqPh').value.trim(),budget:parseFloat(document.getElementById('enqBudget').value)||undefined});
  if(r.ok){toast('Enquiry sent!');close('propModal');}else toast(r.err||'Failed',false);
}
async function sendView(){
  if(!cu){toast('Sign in to schedule viewings',false);return;}
  const d=document.getElementById('vDate').value;if(!d){toast('Select a date',false);return;}
  const r=await call('scheduleViewing',{listingId:sel.listingId,preferredDate:d,preferredTime:document.getElementById('vTime').value.trim(),notes:document.getElementById('vNotes').value.trim()});
  if(r.ok){toast('Viewing scheduled!');close('propModal');}else toast(r.err||'Failed',false);
}

async function loadAgent(){
  const a=document.getElementById('agentArea');
  if(!cu){a.innerHTML='<div class="empty">Sign in to access the agent portal.</div>';return;}
  const r=await call('getPropertyAnalytics',{});
  if(!r.ok){a.innerHTML='<div class="empty">No listings found. <a href="/property-listing" style="color:#f0883e">Create your first listing →</a></div>';return;}
  const d=r.data;
  a.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px">
    ${[['Listings',d.totalListings],['Active',d.activeListings],['Views',d.totalViews],['Enquiries',d.totalEnquiries],['Viewings',d.totalViewings],['Conversion',d.conversionRate+'%']].map(([k,v])=>`
    <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px"><div style="font-size:11px;color:#8b949e">${k}</div><div style="font-size:20px;font-weight:700;color:#f0883e">${v??0}</div></div>`).join('')}
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3>Your Listings</h3>
    <a href="/property-listing" style="background:#f0883e;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none">+ New Listing</a>
  </div>
  ${(d.listings||[]).map(l=>`<div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:600">${esc(l.title)}</div><div style="font-size:12px;color:#8b949e">KES ${(l.price||0).toLocaleString()} · 👁 ${l.viewCount||0} · 📧 ${l.enquiryCount||0}</div></div>
    <span class="stat ${l.status==='active'?'sa':l.status==='draft'?'si':'sd'}">${l.status}</span>
  </div>`).join('')}`;
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');
  ['tBuy','tRent','tLet','tAgent'].forEach(id=>document.getElementById(id).style.display='none');
  if(t==='buy'){document.getElementById('tBuy').style.display='';if(!all.length)loadListings('for_sale');}
  else if(t==='rent'){document.getElementById('tRent').style.display='';all=[];loadListings('for_rent');}
  else if(t==='let'){document.getElementById('tLet').style.display='';all=[];loadListings('short_let');}
  else if(t==='agent'){document.getElementById('tAgent').style.display='';loadAgent();}
  document.getElementById('moreBtn').style.display='none';
}

buildTypeFilters();loadListings('for_sale');
</script>
</body>
</html>
