<!DOCTYPE html>
<html lang="en">
<head>
<script src="security.js"></script>
<script src="shared-header.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Venue · SOKONI</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#71ff00" />
  <link rel="stylesheet" href="sokoni-tokens.css" />
  <style>
    :root{--bg:#050505;--sur:#0d0d0d;--sur2:#141414;--g:#71ff00;--ga:rgba(113,255,0,.12);--ga2:rgba(113,255,0,.06);--bor:#1a1a1a;--bor2:#222;--txt:#e8e8e8;--sub:#888;--radius:12px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:90px}

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .page{max-width:960px;margin:0 auto;padding:16px}
    .view{display:none}.view.active{display:block}

    /* ── Nav strip ──────────────────────────────────────────────────────── */
    .nav-strip{display:flex;background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);margin-bottom:22px;overflow:hidden}
    .nav-tab{flex:1;background:none;border:none;color:var(--sub);padding:11px 8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
    .nav-tab.active{background:var(--ga);color:var(--g)}

    /* ── Search bar ─────────────────────────────────────────────────────── */
    .search-bar{display:grid;grid-template-columns:1fr 155px 115px auto;gap:8px;background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:12px;margin-bottom:14px}
    @media(max-width:640px){.search-bar{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}}
    @media(max-width:400px){.search-bar{grid-template-columns:1fr}}
    .sb-input{background:var(--sur2);border:1px solid var(--bor2);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;width:100%;min-width:0;transition:border-color .15s}
    .sb-input:focus{border-color:var(--g)}
    .sb-input::placeholder{color:var(--sub)}
    input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(.45)}

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn-primary{background:var(--g);color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
    .btn-primary:hover{opacity:.88}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .btn-full{width:100%;padding:14px;font-size:15px}

    /* ── Filter chips ───────────────────────────────────────────────────── */
    .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:20px}
    .chips::-webkit-scrollbar{display:none}
    .chip{background:var(--sur);border:1px solid var(--bor2);color:var(--sub);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;user-select:none}
    .chip.active{background:var(--ga);border-color:var(--g);color:var(--g)}

    /* ── Results grid ───────────────────────────────────────────────────── */
    .results-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:580px){.results-grid{grid-template-columns:1fr}}

    /* ── Venue card ─────────────────────────────────────────────────────── */
    .venue-card{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:10px}
    .venue-card:hover{border-color:var(--g)}
    .vc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .vc-name{font-size:15px;font-weight:600;color:var(--txt);line-height:1.3}
    .avail-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .avail-dot.open{background:var(--g)}.avail-dot.closed{background:#ff4444}
    .badge{display:inline-block;background:var(--ga);color:var(--g);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
    .badge-gray{background:var(--sur2);color:var(--sub)}
    .vc-meta{font-size:13px;color:var(--sub)}
    .vc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
    .vc-price{font-size:16px;font-weight:700;color:var(--g)}

    /* ── Section heading ────────────────────────────────────────────────── */
    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .sec-head h2{font-size:18px;font-weight:700}

    /* ── Skeleton ───────────────────────────────────────────────────────── */
    .skeleton{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:16px;animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .sk-ln{background:var(--sur2);border-radius:4px;height:12px;margin-bottom:10px}
    .sk-ln.w80{width:80%}.sk-ln.w55{width:55%;height:10px}

    /* ── Back button ────────────────────────────────────────────────────── */
    .back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;padding:0 0 16px;transition:color .15s}
    .back-btn:hover{color:var(--g)}

    /* ── Venue hero ─────────────────────────────────────────────────────── */
    .venue-hero{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .vh-name{font-size:22px;font-weight:700;margin-bottom:10px}
    .vh-meta{display:flex;flex-wrap:wrap;gap:8px}

    /* ── Tabs ───────────────────────────────────────────────────────────── */
    .tabs{display:flex;border-bottom:1px solid var(--bor2);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{background:none;border:none;color:var(--sub);padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
    .tab.active{color:var(--g);border-bottom-color:var(--g)}
    .tab-panel{display:none}.tab-panel.active{display:block}

    /* ── Slot picker ────────────────────────────────────────────────────── */
    .slot-date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .slot-date-row label{font-size:13px;color:var(--sub)}
    .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
    .slot-btn{background:var(--sur);border:1px solid var(--bor2);border-radius:8px;padding:10px 6px;color:var(--txt);font-size:13px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
    .slot-btn:hover:not(:disabled){border-color:var(--g);color:var(--g)}
    .slot-btn.selected{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
    .slot-btn:disabled{opacity:.3;cursor:not-allowed}
    .slot-dur{font-size:11px;color:var(--sub);margin-top:3px}
    .slot-btn.selected .slot-dur{color:#000}

    /* ── About / Pricing ────────────────────────────────────────────────── */
    .about-sec{margin-bottom:22px}
    .about-sec h4{font-size:12px;color:var(--sub);margin-bottom:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
    .about-sec p{font-size:14px;line-height:1.65;color:var(--txt)}
    .amenities{display:flex;flex-wrap:wrap;gap:8px}
    .amenity-tag{background:var(--sur2);border:1px solid var(--bor2);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--txt)}
    .pricing-table{width:100%;border-collapse:collapse}
    .pricing-table td{padding:11px 0;border-bottom:1px solid var(--bor);font-size:14px;vertical-align:middle}
    .pricing-table tr:last-child td{border-bottom:none}
    .pricing-table td:last-child{text-align:right;color:var(--g);font-weight:600}
    .pricing-table td:first-child{color:var(--sub)}

    /* ── Sticky selection bar ───────────────────────────────────────────── */
    .sticky-bar{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bor2);padding:12px 20px;display:none;justify-content:space-between;align-items:center;gap:12px;z-index:90}
    .sticky-bar.show{display:flex}
    .sb-slot-info{font-size:13px;color:var(--sub);margin-bottom:2px}
    .sb-slot-price{font-size:17px;font-weight:700;color:var(--g)}

    /* ── Confirm view ───────────────────────────────────────────────────── */
    .confirm-card{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:18px;margin-bottom:14px}
    .confirm-card h3{font-size:12px;font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub)}
    .p-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px;border-bottom:1px solid var(--bor)}
    .p-row:last-child{border-bottom:none}
    .p-row span:first-child{color:var(--sub)}
    .p-row.total{font-weight:700;font-size:15px}
    .p-row.total span:last-child{color:var(--g)}
    .notes-area{background:var(--sur2);border:1px solid var(--bor2);color:var(--txt);border-radius:8px;padding:12px;width:100%;font-size:14px;resize:vertical;min-height:80px;outline:none;font-family:inherit;transition:border-color .15s}
    .notes-area:focus{border-color:var(--g)}
    .notes-area::placeholder{color:var(--sub)}

    /* ── Success screen ─────────────────────────────────────────────────── */
    .success-screen{text-align:center;padding:48px 24px;display:none}
    .success-screen.show{display:block}
    .success-icon{width:66px;height:66px;border-radius:50%;background:var(--ga);border:2px solid var(--g);display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:var(--g);margin-bottom:20px}
    .success-screen h2{font-size:22px;font-weight:700;color:var(--g);margin-bottom:8px}
    .success-screen .desc{color:var(--sub);font-size:14px;margin-bottom:6px}
    .booking-id-chip{background:var(--ga);color:var(--g);border-radius:8px;padding:8px 18px;font-size:13px;font-family:monospace;margin:14px 0 22px;display:inline-block;border:1px solid rgba(113,255,0,.3)}

    /* ── My Bookings ────────────────────────────────────────────────────── */
    .bk-list{display:flex;flex-direction:column;gap:12px}
    .bk-item{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .bk-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
    .bk-info p{font-size:13px;color:var(--sub);line-height:1.4}
    .bk-ref{font-size:11px;font-family:monospace;color:var(--sub);margin-top:3px;opacity:.7}
    .st-badge{border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
    .st-pending_payment{background:rgba(255,200,0,.12);color:#ffc800}
    .st-confirmed{background:var(--ga);color:var(--g)}
    .st-checked_in{background:rgba(0,150,255,.12);color:#0096ff}
    .st-completed{background:var(--sur2);color:var(--sub)}
    .st-cancelled{background:rgba(255,68,68,.1);color:#ff4444}

    /* ── Auth prompt ────────────────────────────────────────────────────── */
    .auth-prompt{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--radius);padding:40px 24px;text-align:center}
    .auth-prompt h3{font-size:17px;font-weight:700;margin-bottom:8px}
    .auth-prompt p{color:var(--sub);font-size:14px;margin-bottom:22px}

    /* ── Misc ───────────────────────────────────────────────────────────── */
    .empty-state{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px}
    .spinner{width:26px;height:26px;border:2px solid var(--bor2);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:32px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .full-col{grid-column:1/-1}

    /* ── Toast ──────────────────────────────────────────────────────────── */
    #toast-box{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
    .toast{background:var(--sur2);border:1px solid var(--bor2);color:var(--txt);border-radius:8px;padding:10px 20px;font-size:13px;animation:toastIn .2s ease;max-width:320px;text-align:center}
    .toast.ok{border-color:var(--g);color:var(--g)}.toast.err{border-color:#ff4444;color:#ff4444}
    @keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="page">

  <!-- Top nav strip -->
  <div class="nav-strip">
    <button class="nav-tab active" id="nt-browse" onclick="showSearch()">Browse Venues</button>
    <button class="nav-tab" id="nt-bookings" onclick="showMyBookings()">My Bookings</button>
  </div>

  <!-- ══ VIEW 1 · Search & Browse ══════════════════════════════════════════ -->
  <div id="v-search" class="view active">
    <div class="sec-head"><h2>Find a Venue</h2></div>
    <div class="search-bar">
      <input class="sb-input" id="q-input" type="text" placeholder="Venue name or type…" autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()" />
      <input class="sb-input" id="date-input" type="date" />
      <input class="sb-input" id="cap-input" type="number" placeholder="Capacity" min="1" max="9999" />
      <button class="btn-primary" onclick="doSearch()">Search</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-type="all">All</button>
      <button class="chip" data-type="sports">Sports Courts</button>
      <button class="chip" data-type="events">Event Venues</button>
      <button class="chip" data-type="conference">Conference Rooms</button>
      <button class="chip" data-type="studio">Studios</button>
      <button class="chip" data-type="coworking">Co-working</button>
      <button class="chip" data-type="other">Other</button>
    </div>
    <div class="results-grid" id="results"></div>
  </div>

  <!-- ══ VIEW 2 · Venue Detail ══════════════════════════════════════════════ -->
  <div id="v-detail" class="view">
    <button class="back-btn" onclick="backToSearch()">&#8592; Back to results</button>
    <div class="venue-hero" id="vh"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('slots',this)">Slots</button>
      <button class="tab" onclick="switchTab('about',this)">About</button>
      <button class="tab" onclick="switchTab('pricing',this)">Pricing</button>
    </div>
    <div id="tp-slots" class="tab-panel active">
      <div class="slot-date-row">
        <label for="slot-date">Date:</label>
        <input class="sb-input" id="slot-date" type="date" style="max-width:180px" onchange="loadSlots()" />
      </div>
      <div id="slot-grid" class="slot-grid"></div>
    </div>
    <div id="tp-about" class="tab-panel" style="padding-top:4px"></div>
    <div id="tp-pricing" class="tab-panel" style="padding-top:4px"></div>
  </div>

  <!-- ══ VIEW 3 · Booking Confirmation ═════════════════════════════════════ -->
  <div id="v-confirm" class="view">
    <button class="back-btn" id="confirm-back" onclick="backToDetail()">&#8592; Back to venue</button>
    <div id="confirm-summary" class="confirm-card"></div>
    <div id="confirm-price" class="confirm-card"></div>
    <div class="confirm-card">
      <h3>Notes (optional)</h3>
      <textarea class="notes-area" id="booking-notes" placeholder="Special requirements or setup instructions (max 500 chars)…" maxlength="500"></textarea>
    </div>
    <button class="btn-primary btn-full" id="confirm-btn" onclick="submitBooking()">Confirm Booking</button>
    <!-- Success state -->
    <div class="success-screen" id="success-screen">
      <div class="success-icon">&#10003;</div>
      <h2>Booking Confirmed!</h2>
      <p class="desc">Your venue is reserved.</p>
      <div class="booking-id-chip" id="success-ref"></div>
      <p class="desc" style="margin-bottom:28px">You will receive a confirmation notification shortly.</p>
      <button class="btn-primary" onclick="showMyBookings()">View My Bookings</button>
    </div>
  </div>

  <!-- ══ VIEW 4 · My Bookings ═══════════════════════════════════════════════ -->
  <div id="v-bookings" class="view">
    <button class="back-btn" onclick="showSearch()">&#8592; Back to Browse</button>
    <div class="sec-head"><h2>My Bookings</h2></div>
    <div class="bk-list" id="bk-list"></div>
  </div>

</div><!-- .page -->

<!-- Sticky slot selection bar -->
<div class="sticky-bar" id="sticky-bar">
  <div>
    <div class="sb-slot-info" id="sb-info">&#8212;</div>
    <div class="sb-slot-price" id="sb-price">&#8212;</div>
  </div>
  <button class="btn-primary" onclick="goToConfirm()">Continue</button>
</div>

<!-- Toast container -->
<div id="toast-box"></div>

<script src="sokoni-config.js"></script>
<script src="sokoni-availability.js"></script>
<script>
// Firebase compat SDK is loaded by shared-header.js
// db = firebase.firestore() available globally
// firebase.auth(), firebase.functions().httpsCallable(name) available

/* ── Booking dispatcher helper ───────────────────────────────────────── */
var _vbDispatch = null;
function _vb(op, data) {
  if (!_vbDispatch) _vbDispatch = firebase.functions().httpsCallable('bookingDispatch');
  return _vbDispatch(Object.assign({ op: op }, data || {}));
}

/* ── State ──────────────────────────────────────────────────────────────── */
var S = {
  filter: 'all',
  user: null,
  venue: null,
  slot: null,
  priceCalc: null,
  iKey: null
};

/* ── Auth ────────────────────────────────────────────────────────────────── */
firebase.auth().onAuthStateChanged(function(u) { S.user = u; });

function requireAuth(fn) {
  if (S.user) { fn(); return; }
  toast('Please sign in to continue', 'err');
  setTimeout(function() { window.location.href = 'auth.html'; }, 1300);
}

/* ── Toast ───────────────────────────────────────────────────────────────── */
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = String(msg);
  var box = document.getElementById('toast-box');
  box.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
}

/* ── Views ───────────────────────────────────────────────────────────────── */
var VIEWS = ['v-search', 'v-detail', 'v-confirm', 'v-bookings'];
function showView(id) {
  VIEWS.forEach(function(v) { document.getElementById(v).classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function setNavTab(id) {
  ['nt-browse', 'nt-bookings'].forEach(function(t) {
    document.getElementById(t).classList.toggle('active', t === id);
  });
}

function showSearch() {
  showView('v-search');
  hideStickyBar();
  setNavTab('nt-browse');
}

function backToSearch() { showSearch(); }

function backToDetail() {
  showView('v-detail');
  if (S.slot) renderStickyBar();
}

function showMyBookings() {
  showView('v-bookings');
  hideStickyBar();
  setNavTab('nt-bookings');
  loadMyBookings();
}

/* ── Filter chips ────────────────────────────────────────────────────────── */
document.getElementById('chips').addEventListener('click', function(e) {
  var chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  S.filter = chip.dataset.type || 'all';
  doSearch();
});

/* ── Default dates ───────────────────────────────────────────────────────── */
(function() {
  var today = new Date().toISOString().slice(0, 10);
  document.getElementById('date-input').value = today;
  document.getElementById('slot-date').value = today;
})();

/* ── Search & Browse ─────────────────────────────────────────────────────── */
function doSearch() {
  var grid = document.getElementById('results');
  renderSkeletons(grid, 4);

  var q = (document.getElementById('q-input').value || '').trim().toLowerCase();
  var cap = parseInt(document.getElementById('cap-input').value, 10) || 0;

  var ref = db.collection('venues').where('status', '==', 'active');
  if (S.filter !== 'all') ref = ref.where('type', '==', S.filter);
  ref = ref.limit(24);

  ref.get().then(function(snap) {
    var list = [];
    snap.forEach(function(doc) { list.push(Object.assign({ id: doc.id }, doc.data())); });
    if (q) {
      list = list.filter(function(v) {
        return (v.name || '').toLowerCase().includes(q) ||
               (v.type || '').toLowerCase().includes(q) ||
               (v.location || '').toLowerCase().includes(q);
      });
    }
    if (cap > 0) list = list.filter(function(v) { return (v.capacity || 0) >= cap; });
    renderVenues(grid, list);
  }).catch(function(err) {
    console.error('[venue-booking] search:', err);
    clearEl(grid);
    var p = document.createElement('p');
    p.className = 'full-col';
    p.style.cssText = 'color:#ff6666;text-align:center;padding:40px;font-size:14px';
    p.textContent = 'Could not load venues. Please try again.';
    grid.appendChild(p);
  });
}

function renderSkeletons(el, n) {
  clearEl(el);
  for (var i = 0; i < n; i++) {
    var sk = document.createElement('div');
    sk.className = 'skeleton';
    ['sk-ln w80', 'sk-ln w55', 'sk-ln'].forEach(function(cls) {
      var d = document.createElement('div'); d.className = cls; sk.appendChild(d);
    });
    el.appendChild(sk);
  }
}

function renderVenues(grid, list) {
  clearEl(grid);
  if (!list.length) {
    var p = document.createElement('p');
    p.className = 'full-col';
    p.style.cssText = 'color:var(--sub);text-align:center;padding:48px 16px;font-size:14px';
    p.textContent = 'No venues found. Try different filters or clear your search.';
    grid.appendChild(p);
    return;
  }
  list.forEach(function(v) {
    var card = document.createElement('div');
    card.className = 'venue-card';
    card.onclick = function() { openVenue(v); };

    // Header
    var hdr = document.createElement('div'); hdr.className = 'vc-header';
    var nm = document.createElement('div'); nm.className = 'vc-name';
    nm.textContent = v.name || 'Venue';
    var dot = document.createElement('div');
    dot.className = 'avail-dot ' + (v.isOpen ? 'open' : 'closed');
    hdr.appendChild(nm); hdr.appendChild(dot);

    // Badges
    var badges = document.createElement('div');
    badges.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    var tb = document.createElement('span'); tb.className = 'badge';
    tb.textContent = fmtType(v.type);
    var cb = document.createElement('span'); cb.className = 'badge badge-gray';
    cb.textContent = 'Up to ' + (v.capacity || '?') + ' people';
    badges.appendChild(tb); badges.appendChild(cb);

    // Location
    var meta = document.createElement('div'); meta.className = 'vc-meta';
    meta.textContent = v.location ? '📍 ' + v.location : 'No location listed';

    // Footer
    var footer = document.createElement('div'); footer.className = 'vc-footer';
    var price = document.createElement('div'); price.className = 'vc-price';
    price.textContent = v.pricePerHour ? 'KES ' + fmtN(v.pricePerHour) + '/hr' : 'Price on request';
    var btn = document.createElement('button'); btn.className = 'btn-primary';
    btn.textContent = 'Book';
    btn.onclick = function(e) { e.stopPropagation(); openVenue(v); };
    footer.appendChild(price); footer.appendChild(btn);

    card.appendChild(hdr);
    card.appendChild(badges);
    card.appendChild(meta);
    card.appendChild(footer);
    grid.appendChild(card);
  });
}

/* ── Venue Detail ─────────────────────────────────────────────────────────── */
function openVenue(v) {
  S.venue = v;
  S.slot = null;
  S.priceCalc = null;
  hideStickyBar();
  renderHero(v);
  renderAbout(v);
  renderPricing(v);
  // Reset to Slots tab
  document.querySelectorAll('.tab').forEach(function(t, i) { t.classList.toggle('active', i === 0); });
  document.querySelectorAll('.tab-panel').forEach(function(p, i) { p.classList.toggle('active', i === 0); });
  loadSlots();
  showView('v-detail');
}

function renderHero(v) {
  var el = document.getElementById('vh');
  clearEl(el);
  var nm = document.createElement('div'); nm.className = 'vh-name';
  nm.textContent = v.name || 'Venue';
  var meta = document.createElement('div'); meta.className = 'vh-meta';
  [fmtType(v.type), '📍 ' + (v.location || 'No location'), 'Capacity: ' + (v.capacity || '?') + ' people'].forEach(function(txt) {
    var b = document.createElement('span'); b.className = 'badge badge-gray'; b.textContent = txt; meta.appendChild(b);
  });
  el.appendChild(nm); el.appendChild(meta);
}

function renderAbout(v) {
  var el = document.getElementById('tp-about');
  clearEl(el);
  if (v.description) {
    addAboutSec(el, 'About', function(wrap) {
      var p = document.createElement('p'); p.textContent = v.description; wrap.appendChild(p);
    });
  }
  if (v.amenities && v.amenities.length) {
    addAboutSec(el, 'Amenities', function(wrap) {
      var grid = document.createElement('div'); grid.className = 'amenities';
      v.amenities.forEach(function(a) {
        var c = document.createElement('div'); c.className = 'amenity-tag'; c.textContent = a; grid.appendChild(c);
      });
      wrap.appendChild(grid);
    });
  }
  if (v.rules) {
    addAboutSec(el, 'Rules & Policies', function(wrap) {
      var p = document.createElement('p'); p.style.color = 'var(--sub)'; p.textContent = v.rules; wrap.appendChild(p);
    });
  }
  if (!el.children.length) {
    var p = document.createElement('p'); p.style.cssText = 'color:var(--sub);font-size:14px';
    p.textContent = 'No additional information available for this venue.'; el.appendChild(p);
  }
}

function addAboutSec(parent, title, fn) {
  var sec = document.createElement('div'); sec.className = 'about-sec';
  var h4 = document.createElement('h4'); h4.textContent = title; sec.appendChild(h4);
  fn(sec); parent.appendChild(sec);
}

function renderPricing(v) {
  var el = document.getElementById('tp-pricing');
  clearEl(el);
  var tbl = document.createElement('table'); tbl.className = 'pricing-table';
  [
    ['Base rate (per hour)', v.pricePerHour ? 'KES ' + fmtN(v.pricePerHour) : 'On request'],
    ['Weekend rate', v.weekendRate ? 'KES ' + fmtN(v.weekendRate) + '/hr' : 'Same as base'],
    ['Peak hours surcharge', v.peakSurcharge ? '+' + v.peakSurcharge + '%' : 'None'],
    ['Deposit policy', v.depositPolicy || 'None'],
    ['Cancellation policy', v.cancellationPolicy || 'Contact the venue directly'],
  ].forEach(function(r) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.textContent = r[0];
    var td2 = document.createElement('td'); td2.textContent = r[1];
    tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
  });
  el.appendChild(tbl);
}

/* ── Tabs ─────────────────────────────────────────────────────────────────── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tp-' + name).classList.add('active');
}

/* ── Slots ────────────────────────────────────────────────────────────────── */
function loadSlots() {
  if (!S.venue) return;
  var grid = document.getElementById('slot-grid');
  clearEl(grid); grid.appendChild(mkSpinner());
  var date = document.getElementById('slot-date').value;
  _vb('venueGetAvailability', { venueId: S.venue.id, startDate: date, days: 1 })
    .then(function(res) {
      var slots = (res.data && res.data.slots) || [];
      renderSlots(grid, slots, date);
    })
    .catch(function(err) {
      console.error('[venue-booking] availability:', err);
      clearEl(grid);
      var p = document.createElement('p');
      p.style.cssText = 'color:var(--sub);font-size:14px';
      p.textContent = 'Could not load availability. Please try again.';
      grid.appendChild(p);
    });
}

function renderSlots(grid, slots, date) {
  clearEl(grid);
  if (!slots.length) {
    var p = document.createElement('p');
    p.style.cssText = 'color:var(--sub);font-size:14px';
    p.textContent = 'No available slots for this date.';
    grid.appendChild(p); return;
  }
  slots.forEach(function(slot) {
    var btn = document.createElement('button'); btn.className = 'slot-btn';
    if (!slot.available) btn.disabled = true;
    var timeEl = document.createElement('div');
    timeEl.textContent = slot.startTime + (slot.endTime ? '–' + slot.endTime : '');
    var durEl = document.createElement('div'); durEl.className = 'slot-dur';
    durEl.textContent = slot.durationMins ? (slot.durationMins / 60) + 'h' : '';
    btn.appendChild(timeEl); btn.appendChild(durEl);
    btn.onclick = function() { if (!slot.available) return; selectSlot(slot, date, btn); };
    grid.appendChild(btn);
  });
}

function selectSlot(slot, date, btn) {
  document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  S.slot = Object.assign({ date: date }, slot);
  calcPrice(slot, date);
}

function calcPrice(slot, date) {
  _vb('venueCalculatePrice', {
    venueId: S.venue.id, date: date, startTime: slot.startTime, durationMins: slot.durationMins || 60
  }).then(function(res) {
    S.priceCalc = res.data || {};
    var total = S.priceCalc.total || S.venue.pricePerHour || 0;
    renderStickyBar(
      date + ' · ' + slot.startTime + (slot.endTime ? '–' + slot.endTime : ''),
      total ? 'KES ' + fmtN(total) : 'Price TBC'
    );
  }).catch(function() {
    var fallback = S.venue.pricePerHour || 0;
    renderStickyBar(date + ' · ' + slot.startTime, fallback ? 'KES ' + fmtN(fallback) : 'Price TBC');
  });
}

function renderStickyBar(info, price) {
  document.getElementById('sb-info').textContent = info || '';
  document.getElementById('sb-price').textContent = price || '';
  document.getElementById('sticky-bar').classList.add('show');
}
function hideStickyBar() { document.getElementById('sticky-bar').classList.remove('show'); }

/* ── Confirm Booking ──────────────────────────────────────────────────────── */
function goToConfirm() {
  requireAuth(function() {
    if (!S.slot || !S.venue) { toast('Please select a time slot first', 'err'); return; }
    buildSummary();
    buildPriceBreakdown();
    document.getElementById('booking-notes').value = '';
    document.getElementById('confirm-btn').style.display = '';
    document.getElementById('confirm-btn').disabled = false;
    document.getElementById('confirm-btn').textContent = 'Confirm Booking';
    document.getElementById('confirm-back').style.display = '';
    document.getElementById('success-screen').classList.remove('show');
    S.iKey = 'bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
    hideStickyBar();
    showView('v-confirm');
  });
}

function buildSummary() {
  var el = document.getElementById('confirm-summary');
  clearEl(el);
  var h3 = document.createElement('h3'); h3.textContent = 'Booking Summary'; el.appendChild(h3);
  [
    ['Venue', S.venue.name || '—'],
    ['Type', fmtType(S.venue.type)],
    ['Date', S.slot.date],
    ['Time', S.slot.startTime + (S.slot.endTime ? ' – ' + S.slot.endTime : '')],
    ['Location', S.venue.location || '—'],
    ['Capacity', 'Up to ' + (S.venue.capacity || '?') + ' people'],
  ].forEach(function(r) { el.appendChild(mkPRow(r[0], r[1], false)); });
}

function buildPriceBreakdown() {
  var el = document.getElementById('confirm-price');
  clearEl(el);
  var h3 = document.createElement('h3'); h3.textContent = 'Price Breakdown'; el.appendChild(h3);
  var c = S.priceCalc || {};
  var base = c.base || S.venue.pricePerHour || 0;
  var surge = c.peakSurcharge || 0;
  var total = c.total || base;
  var deposit = c.deposit || 0;
  el.appendChild(mkPRow('Base rate', 'KES ' + fmtN(base), false));
  el.appendChild(mkPRow('Peak surcharge', surge ? 'KES ' + fmtN(surge) : '—', false));
  el.appendChild(mkPRow('Total', 'KES ' + fmtN(total), true));
  el.appendChild(mkPRow('Deposit required', deposit ? 'KES ' + fmtN(deposit) : 'None', false));
}

function mkPRow(label, value, isTotal) {
  var row = document.createElement('div');
  row.className = 'p-row' + (isTotal ? ' total' : '');
  var k = document.createElement('span'); k.textContent = label;
  var v = document.createElement('span'); v.textContent = value;
  row.appendChild(k); row.appendChild(v); return row;
}

function submitBooking() {
  var btn = document.getElementById('confirm-btn');
  btn.disabled = true; btn.textContent = 'Processing…';
  var notes = (document.getElementById('booking-notes').value || '').trim().slice(0, 500);
  _vb('venueCreateBooking', {
    venueId: S.venue.id,
    date: S.slot.date,
    startTime: S.slot.startTime,
    durationMins: S.slot.durationMins || 60,
    bookingModel: 'hourly',
    notes: notes,
    idempotencyKey: S.iKey
  }).then(function(res) {
    var ref = (res.data && res.data.bookingId) || '—';
    document.getElementById('success-ref').textContent = 'Booking ID: ' + ref;
    document.getElementById('confirm-back').style.display = 'none';
    btn.style.display = 'none';
    document.getElementById('success-screen').classList.add('show');
    toast('Booking confirmed!', 'ok');
  }).catch(function(err) {
    console.error('[venue-booking] createBooking:', err);
    toast((err.message || 'Booking failed. Please try again.'), 'err');
    btn.disabled = false; btn.textContent = 'Confirm Booking';
  });
}

/* ── My Bookings ──────────────────────────────────────────────────────────── */
function loadMyBookings() {
  var list = document.getElementById('bk-list');
  clearEl(list); list.appendChild(mkSpinner());
  if (!S.user) { clearEl(list); list.appendChild(mkAuthPrompt()); return; }
  _vb('venueGetMyBookings', {})
    .then(function(res) {
      var bks = (res.data && res.data.bookings) || [];
      clearEl(list);
      if (!bks.length) {
        var p = document.createElement('div'); p.className = 'empty-state';
        p.textContent = 'No bookings yet. Browse venues to get started.';
        list.appendChild(p); return;
      }
      bks.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
      bks.forEach(function(bk) {
        var item = document.createElement('div'); item.className = 'bk-item';
        var info = document.createElement('div'); info.className = 'bk-info';
        var h4 = document.createElement('h4'); h4.textContent = bk.venueName || 'Venue';
        var p = document.createElement('p');
        p.textContent = (bk.date || '') + ' · ' + (bk.startTime || '') + (bk.endTime ? '–' + bk.endTime : '');
        info.appendChild(h4); info.appendChild(p);
        if (bk.bookingId) {
          var ref = document.createElement('div'); ref.className = 'bk-ref';
          ref.textContent = bk.bookingId; info.appendChild(ref);
        }
        var st = bk.status || 'pending_payment';
        var badge = document.createElement('span');
        badge.className = 'st-badge st-' + st;
        badge.textContent = st.replace(/_/g, ' ');
        item.appendChild(info); item.appendChild(badge); list.appendChild(item);
      });
    })
    .catch(function(err) {
      console.error('[venue-booking] myBookings:', err);
      clearEl(list);
      var p = document.createElement('p');
      p.style.cssText = 'color:var(--sub);text-align:center;padding:32px;font-size:14px';
      p.textContent = 'Could not load bookings. Please try again.';
      list.appendChild(p);
    });
}

function mkAuthPrompt() {
  var wrap = document.createElement('div'); wrap.className = 'auth-prompt';
  var h3 = document.createElement('h3'); h3.textContent = 'Sign in to view your bookings';
  var p = document.createElement('p'); p.textContent = 'Log in to see your upcoming and past venue bookings.';
  var btn = document.createElement('button'); btn.className = 'btn-primary'; btn.textContent = 'Sign In';
  btn.onclick = function() { window.location.href = 'auth.html'; };
  wrap.appendChild(h3); wrap.appendChild(p); wrap.appendChild(btn); return wrap;
}

/* ── Helpers ─────────────────────────────────────────────────────────────── */
var TYPE_MAP = { sports: 'Sports Court', events: 'Event Venue', conference: 'Conference Room', studio: 'Studio', coworking: 'Co-working', other: 'Other' };
function fmtType(t) { return TYPE_MAP[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Venue'); }
function fmtN(n) { return Number(n).toLocaleString('en-KE'); }
function clearEl(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function mkSpinner() { var d = document.createElement('div'); d.className = 'spinner'; return d; }

/* ── Boot ─────────────────────────────────────────────────────────────────── */
doSearch();
</script>
</body>
</html>
