    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    /* Nav */
    .iq-nav{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:rgba(8,8,8,0.97);border-bottom:1px solid rgba(113,255,0,0.1);position:sticky;top:0;z-index:200;backdrop-filter:blur(20px);}

    .iq-nav-link:hover{color:#71ff00;border-color:rgba(113,255,0,0.3);background:rgba(113,255,0,0.07);}
    .iq-nav-link:first-child{color:#71ff00;border-color:rgba(113,255,0,0.28);background:rgba(113,255,0,0.08);}

    /* Hero */
    .iq-hero{padding:28px 20px 20px;background:linear-gradient(135deg,rgba(113,255,0,0.05),rgba(0,170,255,0.03));border-bottom:1px solid rgba(113,255,0,0.08);}
    .iq-hero-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .iq-hero-badge{font-size:9px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.28);color:#71ff00;text-transform:uppercase;letter-spacing:.06em;}
    .iq-dot{width:7px;height:7px;border-radius:50%;background:#71ff00;box-shadow:0 0 6px #71ff00;animation:iq-pulse 2s ease-in-out infinite;flex-shrink:0;}
    @keyframes iq-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.8);}}
    .iq-hero h1{font-size:clamp(20px,5vw,28px);font-weight:900;color:white;line-height:1.15;}
    .iq-hero h1 span{background:linear-gradient(135deg,#71ff00,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .iq-hero p{font-size:12px;color:rgba(255,255,255,0.4);margin-top:5px;line-height:1.5;}

    /* Filter bar */
    .iq-filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none;}
    .iq-filters::-webkit-scrollbar{display:none;}
    .iq-filter-pill{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.09);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit;}
    .iq-filter-pill.active{background:rgba(113,255,0,0.12);border-color:rgba(113,255,0,0.35);color:#71ff00;}

    /* Stats */
    .iq-stats{display:flex;gap:0;background:rgba(113,255,0,0.03);border-bottom:1px solid rgba(113,255,0,0.07);}
    .iq-stat{flex:1;text-align:center;padding:10px 4px;border-right:1px solid rgba(113,255,0,0.06);}
    .iq-stat:last-child{border-right:none;}
    .iq-stat-val{font-size:16px;font-weight:900;color:#71ff00;}
    .iq-stat-lbl{font-size:9px;color:rgba(255,255,255,0.35);margin-top:1px;}

    /* Feed wrapper */
    .iq-body{max-width:1200px;margin:0 auto;padding:4px 0 20px;}

    /* Persona bar */

    .iq-persona-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(113,255,0,0.2);border-radius:12px;font-size:12px;font-weight:700;color:white;}

<script src="inspiq.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.InspIQ) return;

  /* Category filter pills */
  const CATS_ORDER = [
    ['','🌟 All'],['food','🍎 Food'],['electronics','📱 Tech'],['fashion','👗 Fashion'],
    ['beauty','💄 Beauty'],['furniture','🏠 Home'],['sports','⚽ Sports'],
    ['automotive','🚗 Auto'],['healthcare','🏥 Health'],['entertainment','🎬 Events'],
    ['luxury','💎 Luxury'],['books','📚 Learn'],['agriculture','🌾 Agri'],
    ['construction','🏗️ Build'],['property','🏘️ Property'],['travel','✈️ Travel'],
    ['baby','🍼 Baby'],['pets','🐾 Pets'],['finance','💰 Finance'],
  ];

  const filterEl = document.getElementById('iqFilters');
  let activeCat = '';
  if (filterEl) {
    filterEl.innerHTML = CATS_ORDER.map(([key, label]) =>
      `<button type="button" class="iq-filter-pill${key===''?' active':''}" data-cat="${key}"
         onclick="applyFilter('${key}', this)">${label}</button>`
    ).join('');
  }

  window.applyFilter = function (cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.iq-filter-pill').forEach(p => p.classList.remove('active'));
    if (btn) btn.classList.add('active');
    /* Re-score so selected category gets a big boost and re-render */
    if (cat) InspIQ.track(cat, 10);
    const feed = document.getElementById('inspiqFeed');
    if (feed) { feed.innerHTML = ''; InspIQ.renderForYou('inspiqFeed'); }
  };

  /* Persona chip */
  const persona = InspIQ.getPersona();
  const bar = document.getElementById('iqPersonaBar');
  if (persona && bar) {
    bar.style.display = 'block';
    bar.innerHTML = `<div class="iq-persona-chip">${persona.emoji} ${persona.name} <span style="color:rgba(255,255,255,0.4);font-weight:400;font-size:11px;">— ${persona.tip}</span></div>`;
  }
});
</script>
