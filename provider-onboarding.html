<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Become a Provider — SOKONI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="premium.css">
<script src="security.js"></script>
<script src="sokoni-otp.js"></script>
<script type="module" src="firebase.js"></script>
<script src="sokoni-legal-sign.js"></script>
<script src="sokoni-legal-gate.js" defer></script>

<style>
:root{--bg:#050505;--surf:#0d0d0d;--surf2:#141414;--border:#1a1a1a;--acc:#71ff00;--acc-dim:rgba(113,255,0,.12);--acc-glow:0 0 18px rgba(113,255,0,.28);--text:#e8e8e8;--sub:#888;--err:#ff4d4d;--warn:#ffb800;--r:10px;--t:.3s ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:16px}
a{color:var(--acc);text-decoration:none}
/* Top bar */
.top{position:sticky;top:0;z-index:100;background:rgba(5,5,5,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 18px;gap:12px}
.logo{font-weight:800;font-size:1.1rem;color:var(--acc);letter-spacing:-.4px}
.logo span{color:var(--sub);font-weight:400;font-size:.78rem;margin-left:6px}
.prog-area{flex:1;display:none;flex-direction:column;gap:2px}
.prog-area.vis{display:flex}
.plbl{font-size:.72rem;color:var(--sub)}
.plbl strong{color:var(--text);font-weight:600}
.pbar{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:var(--acc);border-radius:99px;transition:width .4s ease}
.uslot{display:none;align-items:center;gap:7px;font-size:.8rem;color:var(--sub)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.onb-exit-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t),border-color var(--t);line-height:1}
.onb-exit-btn:hover{background:rgba(255,59,59,.1);color:#ff6464;border-color:rgba(255,59,59,.3)}
.uslot.vis{display:flex}
.uava{width:26px;height:26px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.68rem;flex-shrink:0}
/* Phases */
.phase{display:none;padding:24px 16px 96px}
.phase.on{display:block}
/* Auth card */
.acard{max-width:400px;margin:0 auto;background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:28px 24px}
.ahero{text-align:center;margin-bottom:20px}
.ahero h1{font-size:1.5rem;font-weight:800}.ahero h1 .ac{color:var(--acc)}
.ahero p{color:var(--sub);font-size:.86rem;margin-top:4px}
.atabs{display:flex;background:var(--surf2);border-radius:var(--r);padding:3px;gap:3px;margin-bottom:18px}
.atab{flex:1;padding:8px;border:none;background:transparent;color:var(--sub);border-radius:8px;cursor:pointer;font-size:.86rem;font-weight:600;transition:all var(--t)}
.atab.on{background:var(--surf);color:var(--text)}
.aform{display:none;flex-direction:column;gap:12px}.aform.on{display:flex}
.sk-in,.sk-sel,.sk-ta{width:100%;padding:11px 12px;font-size:16px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);outline:none;transition:border-color var(--t)}
.sk-in:focus,.sk-sel:focus,.sk-ta:focus{border-color:var(--acc)}
.sk-lbl{font-size:.79rem;color:var(--sub);margin-bottom:4px;display:block}
.fg{display:flex;flex-direction:column}
.btn{padding:11px 17px;border-radius:var(--r);border:none;cursor:pointer;font-size:.87rem;font-weight:600;transition:all var(--t);line-height:1}
.btn-p{background:var(--acc);color:#000}.btn-p:hover{box-shadow:var(--acc-glow)}
.btn-s{background:var(--surf2);color:var(--text);border:1px solid var(--border)}
.btn-g{background:transparent;color:var(--sub)}
.btn-f{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dvl{text-align:center;color:var(--sub);font-size:.75rem;margin:10px 0;position:relative}
.dvl::before,.dvl::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border)}
.dvl::before{left:0}.dvl::after{right:0}
.goo-btn{width:100%;padding:11px;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:var(--r);cursor:pointer;font-size:.85rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;transition:border-color var(--t)}
.goo-btn:hover{border-color:var(--sub)}
.prow{display:flex;gap:8px}
.ppfx{padding:11px 10px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);color:var(--sub);font-size:.87rem;white-space:nowrap}
/* six-box OTP grid removed — single field lives in sokoni-otp.js */
/* Wizard */
.wbody{max-width:600px;margin:0 auto}
.sc{padding-bottom:10px}
.wnav{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(5,5,5,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:9px}
.sh{font-size:1.2rem;font-weight:800;margin-bottom:3px}
.ss{color:var(--sub);font-size:.84rem;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.ff{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border-radius:99px;font-size:.79rem;font-weight:600;border:1px solid var(--border);background:var(--surf2);color:var(--sub);cursor:pointer;transition:all var(--t);user-select:none}
.chip.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.infobox{background:var(--surf2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:11px 14px;font-size:.82rem;color:var(--sub);margin:11px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;transition:all var(--t);position:relative}
.pc:hover,.pc.sel{border-color:var(--acc);background:var(--surf2)}
.pc.sel::after{content:'✓';position:absolute;top:8px;right:8px;color:var(--acc);font-weight:800}
.ppop{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:99px;white-space:nowrap}
.pn{font-weight:800;font-size:.88rem;margin-bottom:2px}
.pp{font-size:1rem;font-weight:700;color:var(--acc);margin-bottom:1px}
.pcom{font-size:.68rem;background:var(--surf2);color:var(--sub);padding:2px 7px;border-radius:99px;display:inline-block;margin-bottom:6px}
.pft{list-style:none;padding:0}.pft li{font-size:.7rem;color:var(--sub);padding:1px 0}.pft li::before{content:'✓ ';color:var(--acc)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:12px}
.uc{background:var(--surf);border:2px dashed var(--border);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color var(--t)}
.uc:hover,.uc.done{border-color:var(--acc);border-style:solid}
.ui{font-size:1.4rem;margin-bottom:4px}
.ul{font-size:.76rem;font-weight:600;margin-bottom:1px}
.uh{font-size:.66rem;color:var(--sub)}
.us{font-size:.68rem;color:var(--acc);margin-top:2px;display:none}
.uc.done .us{display:block}
/* Preview card */
.prev-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:360px;margin:0 auto}
.prev-ava{width:72px;height:72px;border-radius:50%;background:var(--acc-dim);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 10px}
.prev-name{font-weight:800;font-size:1.1rem;text-align:center}
.prev-cat{font-size:.8rem;color:var(--sub);text-align:center;margin-bottom:10px}
.prev-badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px}
.pb-verified{background:rgba(0,120,255,.18);color:#60aaff}
.pb-online{background:var(--acc-dim);color:var(--acc)}
.prev-bio{font-size:.8rem;color:var(--sub);line-height:1.5;margin:10px 0;text-align:center}
.prev-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.ps{text-align:center;padding:8px 4px;background:var(--surf2);border-radius:9px}
.ps-v{font-weight:800;font-size:.95rem;color:var(--acc)}
.ps-l{font-size:.65rem;color:var(--sub)}
/* Success */
.sscreen{text-align:center;padding:30px 14px}
.scheck{width:80px;height:80px;border-radius:50%;background:var(--acc-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2.2rem;animation:pop .5s ease}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.stitle{font-size:1.7rem;font-weight:800;margin-bottom:6px}
.stitle .ac{color:var(--acc)}
.idcard{display:inline-block;background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px 24px;margin:16px auto}
.idcard .il{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:1px}
.idcard .id{font-size:1.3rem;font-weight:900;color:var(--acc);letter-spacing:2px;margin:3px 0}
.qr-mock{width:96px;height:96px;background:var(--surf2);border-radius:10px;margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.slinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
/* Billing toggle */
.btog{display:flex;gap:8px;margin-bottom:16px}
.btg{padding:6px 16px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:.79rem}
.btg.on{background:var(--acc);color:#000;border-color:var(--acc)}
/* Toast + Overlay */
.tc{position:fixed;top:68px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 15px;border-radius:9px;font-size:.82rem;font-weight:600;animation:tsIn .3s ease;max-width:280px}
.t-ok{background:var(--acc);color:#000}.t-err{background:var(--err);color:#fff}
@keyframes tsIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.lov{position:fixed;inset:0;z-index:9998;background:rgba(5,5,5,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.lov.vis{display:flex}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.slbl{font-size:.83rem;color:var(--sub)}
.nspc{flex:1}
/* Type cards */
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:400px;margin:0 auto}
.tcard{background:var(--surf);border:2px solid var(--border);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;transition:all var(--t)}
.tcard:hover,.tcard.sel{border-color:var(--acc);background:var(--surf2);transform:translateY(-2px)}
.tc-ico{font-size:2rem;margin-bottom:8px}
.tc-nm{font-weight:800;font-size:.95rem;margin-bottom:4px}
.tc-ds{font-size:.76rem;color:var(--sub);line-height:1.4}
</style>
</head>
<body>
<!-- Top bar -->
<div class="top">
  <div class="logo">SOKONI<span>Provider Onboarding</span></div>
  <div class="prog-area" id="progArea">
    <div class="plbl">Step <span id="sCur">1</span> of 14<strong> — <span id="sTitle"></span></strong></div>
    <div class="pbar"><div class="pfill" id="pFill"></div></div>
  </div>
  <div class="top-r">
    <div class="uslot" id="uSlot"></div>
    <button class="onb-exit-btn" onclick="SokoniFormNav.goBack()" aria-label="Exit registration" title="Exit form">&#10005;</button>
  </div>
</div>

<div class="lov" id="lov"><div class="spin"></div><div class="slbl" id="lmsg">Please wait…</div></div>
<div class="tc" id="tc"></div>

<!-- Phase A: Auth -->
<div class="phase on" id="phAuth">
  <div class="acard">
    <div class="ahero"><h1>Start Earning on <span class="ac">SOKONI</span></h1><p>Set up your provider profile in under 3 minutes.</p></div>
    <div class="atabs">
      <button class="atab on" onclick="AU.tab('si',this)">Sign In</button>
      <button class="atab" onclick="AU.tab('su',this)">Create Account</button>
    </div>
    <form class="aform on" id="fSi" onsubmit="AU.emailSI(event)">
      <div class="fg"><label class="sk-lbl">Email</label><input class="sk-in" type="email" id="siE" placeholder="you@example.com" required></div>
      <div class="fg"><label class="sk-lbl">Password</label><input class="sk-in" type="password" id="siP" placeholder="••••••••" required></div>
      <div style="text-align:right"><a href="forgot-password.html" style="font-size:.76rem">Forgot password?</a></div>
      <button type="submit" class="btn btn-p btn-f">Sign In</button>
    </form>
    <form class="aform" id="fSu" onsubmit="AU.emailSU(event)">
      <div class="fgrid">
        <div class="fg"><label class="sk-lbl">First name</label><input class="sk-in" type="text" id="suF" placeholder="Alex" required></div>
        <div class="fg"><label class="sk-lbl">Last name</label><input class="sk-in" type="text" id="suL" placeholder="Ogutu" required></div>
      </div>
      <div class="fg"><label class="sk-lbl">Email</label><input class="sk-in" type="email" id="suE" placeholder="you@example.com" required></div>
      <div class="fg"><label class="sk-lbl">Password</label><input class="sk-in" type="password" id="suP" placeholder="Min 8 characters" required minlength="8"></div>
      <button type="submit" class="btn btn-p btn-f">Create Account</button>
    </form>
    <div class="dvl" style="margin:13px 0"><span>or</span></div>
    <button class="goo-btn" onclick="AU.google()">
      <svg width="16" height="16" viewBox="0 0 18 18"><path d="M17.64 9.2a10.34 10.34 0 0 0-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="btn btn-s btn-f" style="margin-top:8px" onclick="AU.phoneTog()">📱 Continue with Phone</button>
    <div id="phoneSec" style="display:none;margin-top:13px">
      <div class="fg"><label class="sk-lbl">Phone number</label>
        <div class="prow"><span class="ppfx">🇰🇪 +254</span><input class="sk-in" type="tel" id="pNum" placeholder="7XXXXXXXX" maxlength="9"></div>
      </div>
      <button class="btn btn-p btn-f" style="margin-top:7px" onclick="AU.sendOTP()">Send OTP</button>
      <div id="otpSec" style="display:none;margin-top:12px">
        <label class="sk-lbl" style="text-align:center;display:block;margin-bottom:6px">Enter the 6-digit code</label>
        <!-- Single verification field (sokoni-otp.js). The six boxes it replaces had no
             autocomplete="one-time-code" at all, so SMS AutoFill never worked here. -->
        <div id="otpB"></div>
        <button class="btn btn-p btn-f" style="margin-top:7px" onclick="AU.verifyOTP()">Verify</button>
      </div>
    </div>
    <div id="rcap"></div>
  </div>
</div>

<!-- Phase B: 14-step wizard -->
<div class="phase" id="phWiz">
  <div class="wbody"><div class="sc" id="sContent"></div></div>
  <div class="wnav">
    <button class="btn btn-s" id="bBack" onclick="W.back()">← Back</button>
    <div class="nspc"></div>
    <button class="btn btn-g" id="bSkip" style="display:none" onclick="W.skip()">Skip</button>
    <button class="btn btn-p" id="bNext" onclick="W.next()">Save & Continue →</button>
  </div>
</div>

<script src="shared-header.js" defer></script>
<script src="sokoni-provider.js" defer></script>
<script>
/* ── Constants ─────────────────────────────────────────────────────── */
const COUNTIES=['Nairobi','Mombasa','Kwale','Kilifi','Tana River','Lamu','Taita-Taveta','Garissa','Wajir','Mandera','Marsabit','Isiolo','Meru','Tharaka-Nithi','Embu','Kitui','Machakos','Makueni','Nyandarua','Nyeri','Kirinyaga',"Murang'a",'Kiambu','Turkana','West Pokot','Samburu','Trans-Nzoia','Uasin Gishu','Elgeyo-Marakwet','Nandi','Baringo','Laikipia','Nakuru','Narok','Kajiado','Kericho','Bomet','Kakamega','Vihiga','Bungoma','Busia','Siaya','Kisumu','Homa Bay','Migori','Kisii','Nyamira'];
const PCATS={'Home Services':['Electrician','Plumber','Carpenter','Painter','Welder','Cleaner','Gardener','Pest Control','Appliance Repair','HVAC','Mover'],'Security':['Security Guard','CCTV Installation','Access Control'],'Education':['Tutor','Private Teacher','Skills Trainer','Music Teacher','Language Teacher'],'Creative & Media':['Photographer','Videographer','Graphic Designer','Content Creator','DJ','MC'],'Technology':['Software Developer','Web Designer','IT Support','Network Engineer','Data Analyst'],'Business Services':['Marketing Agency','PR Consultant','Business Consultant','Accountant','Bookkeeper'],'Legal':['Lawyer','Legal Consultant','Notary'],'Healthcare':['Doctor','Nurse','Clinical Officer','Dentist','Therapist','Physiotherapist','Nutritionist'],'Beauty & Wellness':['Salon','Barber','Makeup Artist','Nail Technician','Spa Therapist'],'Fashion & Textiles':['Tailor','Fashion Designer','Laundry Service','Dry Cleaner'],'Construction & Design':['Architect','Interior Designer','Structural Engineer','Quantity Surveyor'],'Events':['Event Planner','Caterer','Decorator','Sound Engineer','Lighting Technician'],'Logistics':['Delivery Service','Courier','Freight Agent'],'Freelance':['Virtual Assistant','Copywriter','Translator','Research Analyst','Data Entry']};
const PLANS=[
  {t:'free_trial',l:'Free Trial',p:'Free',py:'Free',c:'20%',pop:0,lim:'1 listing',ft:['5 Leads/month','Basic profile','Customer messaging']},
  {t:'starter',l:'Starter',p:'KSh 999',py:'KSh 9,590',c:'15%',pop:0,lim:'3 listings',ft:['20 Leads/month','Calendar','Verified badge','Invoices']},
  {t:'professional',l:'Professional',p:'KSh 2,499',py:'KSh 23,990',c:'10%',pop:1,lim:'10 listings',ft:['AI Matching','Portfolio showcase','Priority in search','Analytics dashboard','Staff seats: 3']},
  {t:'business',l:'Business',p:'KSh 4,999',py:'KSh 47,990',c:'7%',pop:0,lim:'25 listings',ft:['Featured placement','Unlimited leads','Custom packages','Priority support','Staff seats: 10']},
  {t:'enterprise',l:'Enterprise',p:'KSh 9,999',py:'KSh 95,990',c:'5%',pop:0,lim:'Unlimited',ft:['White-label option','API access','Dedicated manager','SLA guarantee','Staff seats: unlimited']}
];

/* ── Steps (14, auth handled separately) ──────────────────────────── */
/* `k` = the backend draft step name that providerSaveDraft accepts. Steps without
   a `k` are not persisted server-side (auth/type/uploads/preview/legal/publish).
   Provider "type" is folded into the `profile` step, which is what publish reads. */
const STEPS=[
  {t:'Verify Account',   f:'sVerify',    skip:1},
  {t:'Provider Type',    f:'sType'},
  {t:'Service Profile',  f:'sProfile',   k:'profile'},
  {t:'Coverage',         f:'sCoverage',  k:'coverage'},
  {t:'Availability',     f:'sAvail',     k:'availability'},
  {t:'Pricing',          f:'sPricing',   k:'pricing'},
  {t:'Choose Plan',      f:'sSub',       k:'subscription'},
  {t:'Verification',     f:'sVerif',     skip:1},
  {t:'Payments',         f:'sPayment',   k:'payment'},
  {t:'Portfolio',        f:'sPortfolio', skip:1, k:'portfolio'},
  {t:'Bookings',         f:'sBookings',  k:'bookings'},
  {t:'Notifications',    f:'sNotifs',    k:'notifications'},
  {t:'Preview',          f:'sPreview'},
  {t:'Legal Agreements', f:'sLegal'},
  {t:'Publish!',         f:'sPublish',   fin:1}
];

/* ══════════════════════════════════════════════════════════════════════
   FIELD MAPPING — the wizard collects DOM-id-keyed values; the backend
   stores named draft steps and providerPublish reads specific keys off
   draft.profile. These two functions are the contract between them.
   ══════════════════════════════════════════════════════════════════════ */
const _num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const _one = v => Array.isArray(v) ? (v[0] || '') : (v || '');   // single-select chips

/* Wizard form data ➜ backend draft shape. `all` is every step's raw form data. */
function _toBackend(key, d, all){
  switch(key){
    case 'profile': return {
      name: d.pNm||'', bio: d.pBio||'',
      type: ((all && all.s1 && all.s1.provType) || 'individual'),
      category: d.pCat||'', subcategory: d.pSub||'', experience: d.pExp||null,
      qualifications: d.pQual ? [d.pQual] : [],
      certifications: d.pCert ? [d.pCert] : [],
      languages: Array.isArray(d.pLng) ? d.pLng : [],
    };
    case 'coverage': return {
      serviceType: _one(d.covT) || 'On-site', county: d.covCo||'', city: d.covCi||'',
      neighbourhood: d.covNb||'', radiusKm: _num(d.covR), nationwide: !!d.covNat, remoteOnly: !!d.covRem,
    };
    case 'availability': return {
      days: Array.isArray(d.avD) ? d.avD : [], from: d.avF||'', to: d.avT||'',
      breakFrom: d.avBF||'', breakTo: d.avBT||'', leadTime: d.avLd||'',
      emergency: !!d.avEm, holidays: !!d.avHol,
    };
    case 'pricing': return {
      hourly: _num(d.prH), fixed: _num(d.prF), inspection: _num(d.prI),
      emergency: _num(d.prE), travelPerKm: _num(d.prTr),
      acceptsQuotes: !!d.prQ, packages: d.prPkg||'',
    };
    case 'subscription': return { plan: d.tier||'', billingCycle: d.billingCycle||'monthly' };
    case 'payment': return {
      mpesa: d.pmMp||'', bank: d.pmBk||'', accountNumber: d.pmAc||'', settlement: _one(d.pmSet),
    };
    case 'portfolio': return {
      website: d.ptWeb||'', linkedin: d.ptLI||'', instagram: d.ptIG||'', whatsapp: d.ptWA||'',
    };
    case 'bookings': return {
      mode: d.bkMode||'request', duration: d.bkDur||'60', maxPerDay: _num(d.bkMaxDay),
      buffer: _num(d.bkBuf), maxTravelKm: _num(d.bkTrav), maxAdvanceDays: _num(d.bkAdv),
      cancellation: d.bkCanc||'free24h', reschedule: d.bkRes||'free', requireDeposit: !!d.bkDep,
    };
    case 'notifications': return { sms: d.nSMS!==false, email: d.nEmail!==false, push: d.nPush!==false };
    default: return d || {};
  }
}

/* Backend draft shape ➜ wizard form data (so resume re-populates the fields). */
function _fromBackend(key, b){
  b = b || {};
  switch(key){
    case 'profile': return { pNm:b.name, pBio:b.bio, pCat:b.category, pSub:b.subcategory,
      pExp:b.experience, pQual:(b.qualifications||[])[0]||'', pCert:(b.certifications||[])[0]||'',
      pLng:b.languages||[] };
    case 'coverage': return { covT:b.serviceType, covCo:b.county, covCi:b.city, covNb:b.neighbourhood,
      covR:b.radiusKm, covNat:b.nationwide, covRem:b.remoteOnly };
    case 'availability': return { avD:b.days, avF:b.from, avT:b.to, avBF:b.breakFrom, avBT:b.breakTo,
      avLd:b.leadTime, avEm:b.emergency, avHol:b.holidays };
    case 'pricing': return { prH:b.hourly, prF:b.fixed, prI:b.inspection, prE:b.emergency,
      prTr:b.travelPerKm, prQ:b.acceptsQuotes, prPkg:b.packages };
    case 'subscription': return { tier:b.plan, billingCycle:b.billingCycle };
    case 'payment': return { pmMp:b.mpesa, pmBk:b.bank, pmAc:b.accountNumber, pmSet:b.settlement };
    case 'portfolio': return { ptWeb:b.website, ptLI:b.linkedin, ptIG:b.instagram, ptWA:b.whatsapp };
    case 'bookings': return { bkMode:b.mode, bkDur:b.duration, bkMaxDay:b.maxPerDay, bkBuf:b.buffer,
      bkTrav:b.maxTravelKm, bkAdv:b.maxAdvanceDays, bkCanc:b.cancellation, bkRes:b.reschedule,
      bkDep:b.requireDeposit };
    case 'notifications': return { nSMS:b.sms, nEmail:b.email, nPush:b.push };
    default: return b;
  }
}

function _sel(id,lbl,opts,v='',req=0,onch=''){const oh=opts.map(x=>{const a=typeof x==='string'?x:x.value,b=typeof x==='string'?x:x.label;return`<option value="${_esc(a)}"${a===v?' selected':''}>${_esc(b)}</option>`}).join('');return`<div class="fg"><label class="sk-lbl">${lbl}${req?'<span style="color:var(--acc)">*</span>':''}</label><select class="sk-in sk-sel" id="${id}"${req?' required':''}${onch?` onchange="${onch}"`:''}><option value="">Select…</option>${oh}</select></div>`}

function _ta(id,lbl,val,ph){return`<div class="fg ff"><label class="sk-lbl">${lbl}</label><textarea class="sk-in sk-ta" id="${id}" rows="3" placeholder="${ph||''}">${_esc(val||'')}</textarea></div>`}
function _chips(nm,items,sel,multi){sel=sel||[];multi=multi!==false;return`<div class="chips" id="chips_${nm}">${items.map(i=>`<span class="chip${sel.includes(i)?' on':''}" onclick="_tc(this,'${nm}',${multi})">${_esc(i)}</span>`).join('')}</div>`}

function _cv(nm){return[...document.querySelectorAll(`#chips_${nm} .chip.on`)].map(c=>c.textContent)}

const AU=(()=>{

  const ae=e=>{const m={'auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account found.','auth/email-already-in-use':'Email already in use.','auth/weak-password':'Min 8 characters.','auth/invalid-email':'Invalid email.','auth/too-many-requests':'Too many attempts.'};return m[e.code]||e.message};
  function tab(t,btn){document.querySelectorAll('.atab').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.aform').forEach(f=>f.classList.remove('on'));btn.classList.add('on');_q(t==='si'?'fSi':'fSu').classList.add('on')}
  async function emailSI(e){e.preventDefault();showLoad('Signing in…');try{await window.firebaseSDK.signInWithEmailAndPassword(_qv('siE'),_qv('siP'))}catch(err){hideLoad();toast(ae(err),'err')}}
  async function emailSU(e){e.preventDefault();showLoad('Creating account…');try{const c=await window.firebaseSDK.createUserWithEmailAndPassword(_qv('suE'),_qv('suP'));await window.firebaseSDK.updateProfile(c.user,{displayName:(_qv('suF')+' '+_qv('suL')).trim()})}catch(err){hideLoad();toast(ae(err),'err')}}
  async function google(){showLoad('Signing in…');try{await window.firebaseSDK.signInWithPopup(new window.firebaseSDK.GoogleAuthProvider())}catch(err){hideLoad();toast(ae(err),'err')}}
  function phoneTog(){const s=_q('phoneSec');s.style.display=s.style.display==='none'?'block':'none'}
  /* One verification field. Mounted lazily because #otpSec is display:none until the
     SMS is actually sent. Same Firebase confirm() call as before — backend untouched. */
  let _otp=null;
  function _mountOtp(){if(_otp||!window.SokoniOtp)return;_otp=window.SokoniOtp.mount('#otpB',{length:6,label:'Verification code',placeholder:'6-digit verification code',onComplete:verifyOTP});}
  async function sendOTP(){const n='+254'+_qv('pNum').replace(/\D/g,'');if(n.length<13)return toast('Enter a valid Kenyan number','err');showLoad('Sending OTP…');try{if(!window._rv)window._rv=new window.firebaseSDK.RecaptchaVerifier(window.firebaseSDK.auth,'rcap',{size:'invisible'});_conf=await window.firebaseSDK.signInWithPhoneNumber(n,window._rv);hideLoad();_q('otpSec').style.display='block';toast('OTP sent!');_mountOtp();_otp?.clear().focus()}catch(err){hideLoad();toast(ae(err),'err')}}
  async function verifyOTP(){const code=(_otp?_otp.value():'').trim();if(!/^\d{6}$/.test(code)){_otp?.error(true);return toast('Enter all 6 digits','err')}showLoad('Verifying…');try{await _conf.confirm(code)}catch(err){hideLoad();_otp?.error(true);_otp?.focus();toast('Invalid code.','err')}}
  return{tab,emailSI,emailSU,google,phoneTog,sendOTP,verifyOTP};
})();

/* ── Wizard ─────────────────────────────────────────────────────────── */
let _legalOk=false;
const W=(()=>{
  let _s=0,_draft={},_bill='monthly',_t=null,_pid=null;
  function init(){
    _s=0;_draft={};_t=null;_pid=null;_legalOk=false;
    _loadDraft();
    _q('progArea').classList.add('vis');
    showPh('phWiz');
    _rnd();
  }
  /* Resume. providerGetDraft returns { draft, completedSteps, status } — rehydrate
     the wizard's form state from the saved backend draft and resume at the first
     step that has not been saved yet. */
  async function _loadDraft(){
    try{
      const fn=window.sokoniCallable('providerDispatch');
      const r=await fn({op:'providerGetDraft'});
      const res=(r&&r.data)||{};
      if(res.status==='active')return;                       // already published
      const draft=res.draft||{}, done=res.completedSteps||{};
      STEPS.forEach((s,i)=>{ if(s.k&&draft[s.k]) _draft['s'+i]=_fromBackend(s.k,draft[s.k]); });
      if(draft.profile&&draft.profile.type) _draft.s1={provType:draft.profile.type};
      if(draft.subscription&&draft.subscription.plan){
        _t=draft.subscription.plan;
        _bill=draft.subscription.billingCycle||'monthly';
      }
      let resume=STEPS.findIndex(s=>s.k&&!done[s.k]);
      if(resume<0) resume=STEPS.findIndex(s=>s.f==='sPreview');
      if(resume<0) resume=0;
      _s=resume;
      _rnd();
    }catch(e){}
  }
  function _rnd(){
    const s=STEPS[_s];if(!s)return;
    _q('sCur').textContent=_s+1;
    _q('sTitle').textContent=s.t;
    _q('pFill').style.width=`${((_s+1)/STEPS.length)*100}%`;
    _q('bSkip').style.display=s.skip?'inline-block':'none';
    _q('bBack').style.display=_s===0?'none':'inline-block';
    _q('bNext').textContent=s.fin?'Publish My Profile →':'Save & Continue →';
    const fn=window[s.f];
    _q('sContent').innerHTML=fn?fn(_draft['s'+_s]||{}):'<div class="sh">'+_esc(s.t)+'</div>';
    document.documentElement.scrollTop=0;
  }
  async function next(){
    const s=STEPS[_s];if(!s)return;
    if(s.f==='sLegal'&&!_legalOk){toast('Please review and accept the legal agreements to continue.','err');return}
    const data=_collect();
    _draft['s'+_s]=data; if(_t)_draft.tier=_t;

    /* Publish hard-requires an ACTIVATED subscription — a chosen tier alone is not enough. */
    if(s.k==='subscription'&&!_t){toast('Please choose a plan to continue.','err');return}

    showLoad('Saving…');
    try{
      const fn=window.sokoniCallable('providerDispatch');

      /* Persist this step under its BACKEND step name, in the shape publish reads. */
      if(s.k){
        const payload=_toBackend(s.k, Object.assign({}, data, {tier:_t, billingCycle:_bill}), _draft);
        await fn({op:'providerSaveDraft', step:s.k, data:payload});
      }

      /* Actually activate the plan (sets providerProfiles.plan, which publish requires). */
      if(s.k==='subscription'){
        showLoad('Activating your plan…');
        await fn({op:'providerSelectPlan', plan:_t, billingCycle:_bill});
        await fn({op:'providerActivateSubscription', plan:_t, billingCycle:_bill});
      }

      if(s.fin){await _publish();return}
      _s++;hideLoad();_rnd();
    }catch(e){hideLoad();toast(e.message||'Could not save. Please try again.','err')}
  }
  function back(){if(_s===0){showPh('phAuth');_q('progArea').classList.remove('vis');return}_s--;_rnd()}
  function skip(){_draft['s'+_s]={};_s++;_rnd()}
  async function _publish(){
    showLoad('Publishing your profile…');
    try{
      /* providerPublish reads the SAVED draft from Firestore (draft.profile /
         draft.coverage / plan) — it ignores any payload, so send none. */
      const fn=window.sokoniCallable('providerDispatch');
      const r=await fn({op:'providerPublish'});
      _pid=r.data&&r.data.providerId?r.data.providerId:'';
      hideLoad();
      _q('bNext').style.display='none';_q('bBack').style.display='none';_q('bSkip').style.display='none';
      _q('sContent').innerHTML=sSuccess(_pid);
      _q('sTitle').textContent='You\'re Live!';_q('pFill').style.width='100%';
    }catch(e){hideLoad();toast('Publish failed: '+e.message,'err')}
  }
  function _collect(){
    const data={};
    _q('sContent').querySelectorAll('[id]').forEach(el=>{if(['INPUT','SELECT','TEXTAREA'].includes(el.tagName))data[el.id]=el.type==='checkbox'?el.checked:el.value});
    _q('sContent').querySelectorAll('.chips[id]').forEach(el=>{data[el.id.replace('chips_','')]=_cv(el.id.replace('chips_',''))});
    if(_t)data.tier=_t;
    return data;
  }
  function _setType(t,el){document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');document.getElementById('provType').value=t;}
  function plan(t,el){document.querySelectorAll('.pc').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');_t=t}
  function billing(b){_bill=b;_q('btMo').classList.toggle('on',b==='monthly');_q('btYr').classList.toggle('on',b==='yearly');document.querySelectorAll('.pyr').forEach((el,i)=>{const p=PLANS[i];el.textContent=b==='yearly'?p.py+'/year':p.p+'/month'})}
  return{init,next,back,skip,plan,billing,_setType,get _t(){return _t},get _draft(){return _draft}};
})();

  <div class="prev-card">

/* Legal Gate */
function sLegal(d){
  requestAnimationFrame(function(){
    var wrap=document.getElementById('slg-pro-wrap');
    if(!wrap)return;
    if(!window.SokoniLegalGate){_legalOk=true;return;}
    window.SokoniLegalGate.mount(wrap,{
      role:'provider',
      onComplete:function(ok){_legalOk=!!ok;}
    });
  });
  return`<div class="sh">Legal Agreements</div>`+
    `<p class="ss">Review and accept the platform agreements before publishing your provider profile.</p>`+
    `<div id="slg-pro-wrap" style="margin-top:4px"></div>`+
    `<p style="font-size:.75rem;color:var(--sub);margin-top:14px">Once accepted, click <strong style="color:var(--text)">Save &amp; Continue</strong> to proceed to publish.</p>`;
}

/* ── Init ───────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded',()=>{
  window.firebaseSDK.onAuthStateChanged(async u=>{
    hideLoad();
    if(!u){showPh('phAuth');return}
    // Show user avatar
    const ini=(u.displayName||u.email||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const sl=_q('uSlot');sl.classList.add('vis');sl.innerHTML=`<div class="uava">${_esc(ini)}</div><span>${_esc((u.displayName||u.email||'').split(' ')[0])}</span>`;
    // Check if already has a provider profile
    try{
      const fn=window.sokoniCallable('providerDispatch');
      const r=await fn({op:'providerGetProfile'});
      if(r.data&&r.data.providerId&&r.data.status==='active'){
        window.location.href='provider-dashboard.html';return;
      }
    }catch(e){}
    W.init();
  });
});
</script>

window.addEventListener('load', function() {
