<script>(function(){try{if(!window.parent||window.parent===window)return;var p=window.parent.location.pathname||"";var i=p.lastIndexOf("/");var last=(i<0?p:p.slice(i+1)).toLowerCase();if(last==="merchant"||last==="merchant.html"||last==="merchant-v2"||last==="merchant-v2.html"||window.parent.SokoniShell){document.documentElement.className+=" sk-in-shell";document.documentElement.setAttribute("data-sk-shell","merchant");}}catch(e){}})();</script>
<script src="sokoni-inshell.js" defer></script>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">

  <meta name="description" content="Manage your active deliveries, track riders, and view delivery analytics.">
  <script src="sokoni-permissions.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .sd-page { padding: 24px 4% 100px; min-height: 100vh; }

    /* ── Tab bar ── */
    .sd-tabs { display: flex; gap: 6px; margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
    .sd-tabs::-webkit-scrollbar { display: none; }
    .sd-tab { padding: 9px 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; transition: .2s; }
    .sd-tab.active { background: rgba(113,255,0,0.12); border-color: rgba(113,255,0,0.35); color: #71ff00; }

    /* ── Stats row ── */
    .sd-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 24px; }
    .sd-stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; text-align: center; }
    .sd-stat-val { font-size: 22px; font-weight: 900; color: #71ff00; }
    .sd-stat-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px; }

    /* ── Delivery cards ── */
    .sd-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
    .sd-card:hover { border-color: rgba(113,255,0,0.22); }

    /* ── RIDER ROSTER, IN TWO GROUPS ───────────────────────────────────────────
       Your team and the wider network are different relationships: you dispatch one
       and merely request the other, so they are not one undifferentiated list. */
    .sd-rgroup { margin-bottom: 20px; }
    .sd-rhead { display: flex; align-items: baseline; gap: 9px; padding: 2px 0 3px; }
    .sd-rtitle { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .09em; }
    .sd-rhead.store .sd-rtitle { color: #71ff00; }
    .sd-rhead.net   .sd-rtitle { color: #64b4ff; }
    .sd-rcount { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.45);
                 border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; padding: 1px 8px; }
    .sd-rsub { font-size: 11.5px; color: rgba(255,255,255,0.38); margin: 0 0 10px; line-height: 1.5; }
    .sd-rgroup .sd-card { margin-bottom: 8px; }
    .sd-rhead.store + .sd-rsub + .sd-card,
    .sd-rgroup:first-child .sd-card { border-color: rgba(113,255,0,0.16); }
    .sd-rnote { font-size: 12px; color: rgba(255,255,255,0.45); padding: 11px 13px;
                border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); line-height: 1.55; }
    .sd-card-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .sd-card-id { font-weight: 800; color: white; font-size: 14px; }
    .sd-card-time { font-size: 11px; color: rgba(255,255,255,0.35); }
    .sd-card-body { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 10px; }
    .sd-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .badge-green  { background: rgba(113,255,0,0.1); color: #71ff00; border: 1px solid rgba(113,255,0,0.2); }
    .badge-blue   { background: rgba(0,170,255,0.1); color: #00aaff; border: 1px solid rgba(0,170,255,0.2); }
    .badge-orange { background: rgba(255,140,0,0.1); color: #ff8c00; border: 1px solid rgba(255,140,0,0.2); }
    .badge-red    { background: rgba(255,61,61,0.1);  color: #ff6b6b; border: 1px solid rgba(255,61,61,0.2); }
    .badge-grey   { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.1); }

    /* ── Map container ── */
    .sd-map { width: 100%; height: 200px; border-radius: 14px; overflow: hidden; margin-top: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }

    /* ── MV2-3: responsive reflow (the page had no media rules) ── */
    .sd-page { padding: 18px 4% 110px; }
    .sd-tabs { position: sticky; top: 0; z-index: 5; background: #050505; padding: 8px 0; margin-bottom: 16px; }
    .sd-tab { min-height: 40px; white-space: nowrap; }
    .sd-card-actions a, .sd-card-actions button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .sd-stage { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
    .sd-stage.s-wait { background: rgba(251,191,36,.10); color: #fbbf24; border: 1px solid rgba(251,191,36,.25); }
    .sd-stage.s-prep { background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.14); }
    .sd-stage.s-move { background: rgba(0,170,255,.10); color: #00aaff; border: 1px solid rgba(0,170,255,.25); }
    .sd-stage.s-done { background: rgba(113,255,0,.10); color: #71ff00; border: 1px solid rgba(113,255,0,.25); }
    .sd-stage.s-exc  { background: rgba(255,61,61,.10); color: #ff6b6b; border: 1px solid rgba(255,61,61,.25); }
    .sd-ladder { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 2px; }
    .sd-ladder span { font-size: 10px; color: rgba(255,255,255,.28); padding: 2px 7px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); }
    .sd-ladder span.on { color: #71ff00; border-color: rgba(113,255,0,.35); background: rgba(113,255,0,.08); }
    .sd-ladder span.past { color: rgba(255,255,255,.5); }
    .sd-rbadge { font-size: 9.5px; font-weight: 900; letter-spacing: .08em; padding: 2px 7px; border-radius: 8px; }
    .sd-rbadge.shop { color: #71ff00; background: rgba(113,255,0,.10); border: 1px solid rgba(113,255,0,.3); }

    .sd-ractions .call { color: #71ff00; border-color: rgba(113,255,0,.3); }

      #activeList .sd-card, #pendingList .sd-card { margin-bottom: 0; }

    /* ── Rider info strip ── */
    .sd-rider { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(113,255,0,0.05); border: 1px solid rgba(113,255,0,0.12); border-radius: 12px; margin-top: 8px; }
    .sd-rider-icon { font-size: 20px; }
    .sd-rider-name { font-weight: 700; color: white; font-size: 13px; }

    .sd-metric-title { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .sd-metric-val { font-size: 22px; font-weight: 900; color: white; }

    .modal-input:focus { outline: none; border-color: rgba(113,255,0,0.4); }
    .modal-btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#71ff00,#4fc800); color: black; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-family: inherit; }
    .modal-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 22px; cursor: pointer; float: right; }

<div class="sd-page">
  <h1 style="font-size:20px;font-weight:900;color:white;margin-bottom:4px;">Delivery Hub</h1>
  <p style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:14px;">Live deliveries · orders · riders · map · exceptions — one operational view</p>

  <!-- Stats -->
  <div class="sd-stats" id="sdStats">
    <div class="sd-stat"><div class="sd-stat-val" id="statActive">—</div><div class="sd-stat-label">Active</div></div>
    <div class="sd-stat"><div class="sd-stat-val" id="statToday">—</div><div class="sd-stat-label">Today</div></div>
    <div class="sd-stat"><div class="sd-stat-val" id="statSuccessRate">—%</div><div class="sd-stat-label">Success Rate</div></div>
    <div class="sd-stat"><div class="sd-stat-val" id="statAvgTime">—</div><div class="sd-stat-label">Avg Time</div></div>
    <div class="sd-stat"><div class="sd-stat-val" id="statRevenue">—</div><div class="sd-stat-label">Revenue KES</div></div>
  </div>

  <!-- Tabs -->
  <div class="sd-tabs">
    <!-- MV2-3 order (owner): Live → Orders → Riders → Map → Exceptions. data-tab values are kept —
         they back the #riders / #active deep links the merchant route registry uses. -->
    <button class="sd-tab active" data-tab="active">🛵 Live</button>
    <button class="sd-tab" data-tab="pending">🧾 Orders</button>
    <button class="sd-tab" data-tab="riders">🏍️ Riders</button>
    <button class="sd-tab" data-tab="map">🗺️ Map</button>
    <button class="sd-tab" data-tab="failed">⚠️ Exceptions</button>
    <button class="sd-tab" data-tab="history">🕑 History</button>
    <button class="sd-tab" data-tab="analytics">📈 Analytics</button>
  </div>

  <!-- Tab panels -->
  <div id="tabActive">
    <div id="activeList"></div>
  </div>
  <!-- Rider availability. This is the seller's view of who can carry their orders —
       NOT a rider's own account, and not an admin roster: there is no suspend, no
       document review and no cross-shop rider administration here. -->
  <div id="tabRiders" style="display:none">
    <div id="ridersList"></div>
  </div>

  <div id="tabPending" style="display:none">
    <div id="pendingList"></div>
  </div>
  <!-- MV2-3: ONE map over every active delivery — pickup (F1 projection on the job) → rider
       (rideDrivers position the rider publishes) → drop-off (the order's destination). Where a
       point is unknown the list says "Location unavailable"; nothing is invented. -->
  <div id="tabMap" style="display:none">
    <div class="sd-legend"><span>🏪 Pickup</span><span>🏍️ Rider (live)</span><span>🎯 Drop-off</span></div>
    <div id="hubMap"></div>
    <div class="sd-maplist" id="hubMapList"></div>
  </div>
  <div id="tabHistory" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="histSearch" type="search" placeholder="Search by order ID or address..." style="flex:1;padding:11px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:white;font-size:16px;font-family:inherit;outline:none;">
    </div>
    <div id="historyList"></div>
  </div>
  <div id="tabFailed" style="display:none">
    <div id="failedList"></div>
  </div>
  <div id="tabAnalytics" style="display:none">
    <div class="sd-metrics-grid" id="analyticsGrid"></div>
    <div class="sd-chart-placeholder">Analytics charts available in the full analytics dashboard</div>
  </div>
</div>

<!-- Report failed delivery modal -->
<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('reportModal').classList.remove('open')">&#x2715;</button>
    <div class="modal-title">Report Delivery Issue</div>
    <input type="hidden" id="reportDeliveryRef">
    <select id="reportReason" class="modal-input">
      <option value="">Select reason...</option>
      <option value="customer_unavailable">Customer unavailable</option>
      <option value="wrong_address">Wrong address</option>
      <option value="rider_breakdown">Rider breakdown</option>
      <option value="seller_delay">Seller delay</option>
      <option value="rejected_order">Order rejected by customer</option>
    </select>
    <textarea id="reportNote" class="modal-input" rows="3" placeholder="Additional notes (optional)..."></textarea>
    <button class="modal-btn" onclick="_submitReport()">Submit Report</button>
  </div>
</div>

<!-- Scripts -->
<script type="module" src="firebase.js"></script>
<script src="sokoni-dispatch.js"></script>
<script src="sokoni-logistics.js"></script>
<!-- MV2-3: Chat enters the existing in-app inbox (conversations), never a second chat system -->
<script src="sokoni-inbox.js"></script>
<script>
(function () {
  'use strict';

  var _sellerUid = null;
  var _unsubActive = null;
  var _unsubPending = null;
  var _unsubHistory = null;
  var _unsubFailed = null;
  var _activeDeliveries = [];
  var _miniMaps = {};
  var _miniMapUnsubs = {};
  /* MV2-3: the server's presence freshness window (platformConfig/riderPresence.staleAfterSeconds default 300). Declared here — a var assigned after a render statement is undefined during that render. */
  var STALE_MS = 300000;
  /* MV2-3: declared with the rest of the state so a synchronously-delivered snapshot (cache, harness) can render before the renderer definitions further down. */
  var LADDER = ['Awaiting payment','Paid','Preparing','Ready','Assigned','Picked up','In transit','Arriving','Delivered'];
  window.addEventListener('beforeunload', function() { Object.values(_miniMapUnsubs).forEach(function(fn){ fn(); }); });

  /* ── Bootstrap ── */
  firebase.auth().onAuthStateChanged(function (user) {
    if (!user) return;
    _sellerUid = user.uid;
    _initTabs();
    _loadActive();
    _loadStats();
    _loadStoreRiders();   /* MV2-3: SHOP / SOKONI badges on Live cards need the classification early */
  });

  /* ── Tab switching ── */
  function _initTabs() {
    document.querySelectorAll('.sd-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tab = btn.dataset.tab;
        document.querySelectorAll('.sd-tab').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        ['active','riders','pending','map','history','failed','analytics'].forEach(function (t) {
          document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = t === tab ? '' : 'none';
        });
        if (tab === 'riders'    && !_unsubRiders)   { _loadRiders(); _loadStoreRiders(); }
        if (tab === 'pending'   && !_unsubPending)  _loadPending();
        if (tab === 'history'   && !_unsubHistory)  _loadHistory();
        if (tab === 'failed'    && !_unsubFailed)   _loadFailed();
        if (tab === 'analytics')                    _loadAnalytics();
        if (tab === 'map')                          _renderHubMap();
      });
    });
    document.getElementById('histSearch').addEventListener('input', _filterHistory);

    /* Deep link: the "Riders" nav entry opens seller-delivery.html#riders so the seller
       lands on the roster rather than on Active and having to hunt for it. */
    var hash = (location.hash || '').replace('#', '');
    if (hash) {
      var target = document.querySelector('.sd-tab[data-tab="' + hash.replace(/[^a-z]/gi, '') + '"]');
      if (target) target.click();
    }
  }

  /* ── Rider availability ──────────────────────────────────────────────────────
     Who can carry this seller's orders right now. `rideDrivers` is readable by any
     signed-in user per firestore.rules, so this needs no elevated access — and it
     deliberately shows only what the rider already publishes. Nothing is invented:
     a rider with no rating shows no rating rather than a default, and a rider whose
     current job is not this seller's is shown as busy WITHOUT naming the order,
     which belongs to another shop. */
  var _unsubRiders = null;
  var _riders = [];
  /* MV2-3 marker */

  /* ══ WHOSE RIDER IS THIS? ═══════════════════════════════════════════════════
     A rider is a STORE rider when this shop has classified them in shopEmployees, and
     a SOKONI rider otherwise. That is the same rule the server applies —
     delivery-marketplace derives riderType as shopIds.has(riderId) ? shop : sokoni — so
     the two agree by construction rather than by coincidence.

     THIS IS PRESENTATION ONLY. It grants nothing. Network eligibility lives in
     drivers/{uid}, which is CF-only (allow write: if false), and a shop owner cannot
     manufacture a network rider by classifying someone here. The roster below still
     shows only riders the pool already contains.

     The lookup FAILS CLOSED: on error the set stays empty and everyone is shown under
     SOKONI. A rider mislabelled as network is cosmetic; inventing a store rider would
     imply a relationship that does not exist. */
  var _storeRiderIds = null;      /* null = not answered yet */
  var _storeRidersFailed = false;

  function _loadStoreRiders () {
    if (!_sellerUid || _storeRiderIds) return;
    firebase.firestore()
      .collection('shopEmployees')
      .where('shopOwnerId', '==', _sellerUid)
      .limit(200).get()
      .then(function (snap) {
        var set = {};
        snap.docs.forEach(function (d) {
          var e = d.data() || {};
          var st = String(e.status || '').toLowerCase();
          /* An absent status predates the field and counts as active; anything
             explicitly not active does not. Mirrors the server predicate. */
          var live = st ? ['active','approved','enabled'].indexOf(st) > -1 : e.active !== false;
          if (live) set[d.id] = 1;
        });
        _storeRiderIds = set;
        if (_riders.length) _renderRiders();   /* regroup what is already on screen */
        if (_activeDeliveries.length) _renderActive();   /* MV2-3: badges on the Live cards */
      })
      .catch(function (err) {
        console.warn('[delivery-hub] store roster unavailable:', err && (err.code || err.message));
        _storeRiderIds = {};
        _storeRidersFailed = true;
        if (_riders.length) _renderRiders();
      });
  }

  function _loadRiders() {
    if (_unsubRiders) _unsubRiders();

  function _listLoading(elId, label) {

  /* MV2-3: the owner's stage ladder over the canonical statuses. One mapping, used by cards and the map. */
  function _stage(d) {

  /* ── Mini map per active delivery ── */
  function _initMiniMap(d) {

  /* ── MV2-3: one map over all active deliveries ── */
  var _hubMap = null, _hubLayer = null, _hubRiderUnsubs = {}, _hubRiderPos = {};

        '<div style="font-size:12px;color:rgba(255,255,255,.55);margin-top:4px;">' + _esc(_pickupText(d)) + ' → ' + _esc(d.deliveryAddress || d.dropoffAddress || '—') + '</div>' +
        (missing.length ? '<div class="sd-loc-note">Location unavailable: ' + missing.join(', ') + '</div>' : '') +
        '<div class="sd-ractions" style="margin-top:8px;"><a target="_blank" rel="noopener" href="delivery-tracking.html?ref=' + encodeURIComponent(d.id) + '">📍 Track</a></div></div>');
      /* live rider position from the record the rider publishes (rideDrivers) — subscribe once per rider */
      if (rid && !_hubRiderUnsubs[rid]) {
        _hubRiderUnsubs[rid] = function () {};   /* claimed; replaced by the real unsub below */
        _hubRiderUnsubs[rid] = firebase.firestore().collection('rideDrivers').doc(rid).onSnapshot(function (snap) {
          var r = snap.data() || {};
          if (r.lat && r.lng) _hubRiderPos[rid] = { lat: r.lat, lng: r.lng }; else delete _hubRiderPos[rid];
          if (document.getElementById('tabMap').style.display !== 'none') _renderHubMap();
        }, function () {});
      }
    });
    listEl.innerHTML = rows.length ? rows.join('') : '<div class="sd-empty"><div class="sd-empty-icon">🗺️</div><div class="sd-empty-text">No active deliveries to map right now</div></div>';
    if (pts.length) { try { _hubMap.fitBounds(pts, { padding: [24, 24], maxZoom: 15 }); } catch (_) {} }
    setTimeout(function () { try { _hubMap.invalidateSize(); } catch (_) {} }, 50);
  }
  window._sdChat = function (uid, name, deliveryRef) {
    if (!window.SokoniInbox) { location.href = 'messages.html'; return; }
    SokoniInbox.openChat({ otherUid: uid, otherName: name, type: (SokoniInbox.HUB_TYPES && SokoniInbox.HUB_TYPES.GENERAL) || 'general', context: 'Delivery ' + deliveryRef, contextId: deliveryRef });
  };

  /* ── Pending deliveries ── */
  function _loadPending() {
    if (_unsubPending) _unsubPending();
    _listLoading('pendingList', 'pending deliveries');
    _unsubPending = firebase.firestore()
      .collection('packageRequests')
      .where('sellerUid', '==', _sellerUid)
      .where('status', 'in', ['order_placed','ready_for_pickup','retry_scheduled'])
      .onSnapshot(function (snap) {
        var items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        var el = document.getElementById('pendingList');
        el.innerHTML = items.length ? items.map(_buildCard).join('') : '<div class="sd-empty"><div class="sd-empty-icon">✅</div><div class="sd-empty-text">No pending deliveries</div></div>';
      }, function (err) { _listError('pendingList', 'pending', err); });
  }

  /* ── History ── */
  var _historyAll = [];
  function _loadHistory() {
    if (_unsubHistory) _unsubHistory();
    _listLoading('historyList', 'history');
    _unsubHistory = firebase.firestore()
      .collection('packageRequests')
      .where('sellerUid', '==', _sellerUid)
      .where('status', 'in', ['delivered','buyer_confirmed'])
      .limit(80)
      .onSnapshot(function (snap) {
        _historyAll = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        _filterHistory();
      }, function (err) { _historyAll = []; _listError('historyList', 'history', err); });
  }

  function _filterHistory() {
    var q = (document.getElementById('histSearch').value || '').toLowerCase();
    var filtered = q ? _historyAll.filter(function (d) {
      return d.id.toLowerCase().includes(q) || (d.deliveryAddress||'').toLowerCase().includes(q) || (d.buyerName||'').toLowerCase().includes(q);
    }) : _historyAll;
    var el = document.getElementById('historyList');
    el.innerHTML = filtered.length ? filtered.map(_buildCard).join('') : '<div class="sd-empty"><div class="sd-empty-icon">📦</div><div class="sd-empty-text">No delivery history yet</div></div>';
  }

  /* ── Failed / returns ── */
  function _loadFailed() {
    if (_unsubFailed) _unsubFailed();
    _listLoading('failedList', 'issues');
    _unsubFailed = firebase.firestore()
      .collection('packageRequests')
      .where('sellerUid', '==', _sellerUid)
      .where('status', 'in', ['failed','returned','return_in_progress','refund_initiated','support_required'])
      .onSnapshot(function (snap) {
        var items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        var el = document.getElementById('failedList');
        el.innerHTML = items.length ? items.map(_buildCard).join('') : '<div class="sd-empty"><div class="sd-empty-icon">✅</div><div class="sd-empty-text">No failed deliveries</div></div>';
      }, function (err) { _listError('failedList', 'failed', err); });
  }

  /* ── Stats ── */
  function _updateStats() {
    document.getElementById('statActive').textContent = _activeDeliveries.length;
  }

  function _loadStats() {
    var todayStart = new Date(); todayStart.setHours(0,0,0,0);
    firebase.firestore().collection('packageRequests')
      .where('sellerUid', '==', _sellerUid)
      .where('createdAt', '>=', todayStart)
      .get()
      .then(function (snap) {
        var deliveries = snap.docs.map(function (d) { return d.data(); });
        var total    = deliveries.length;
        var success  = deliveries.filter(function (d) { return ['delivered','buyer_confirmed'].includes(d.status); }).length;
        var revenue  = deliveries.reduce(function (s,d) { return s + (d.deliveryFee||0); }, 0);
        var times    = deliveries.filter(function (d) { return d.createdAt && d.deliveredAt; })
                                 .map(function (d) {
                                   var c = d.createdAt.seconds ? d.createdAt.seconds*1000 : d.createdAt;
                                   var e = d.deliveredAt.seconds ? d.deliveredAt.seconds*1000 : d.deliveredAt;
                                   return (e-c)/60000;
                                 });
        var avgMin   = times.length ? Math.round(times.reduce(function(a,b){return a+b;},0)/times.length) : 0;
        document.getElementById('statToday').textContent       = total;
        document.getElementById('statSuccessRate').textContent = (total ? Math.round(success/total*100) : 0) + '%';
        document.getElementById('statAvgTime').textContent     = avgMin ? avgMin+'m' : '—';
        document.getElementById('statRevenue').textContent     = revenue.toLocaleString();
      }).catch(function() {});
  }

  /* ── Analytics tab ── */
  function _loadAnalytics() {
    var el = document.getElementById('analyticsGrid');
    /* 30-day rollup */
    var since = new Date(); since.setDate(since.getDate()-30);
    firebase.firestore().collection('packageRequests')
      .where('sellerUid', '==', _sellerUid)
      .where('createdAt', '>=', since)
      .get()
      .then(function (snap) {
        var deliveries = snap.docs.map(function (d) { return d.data(); });
        var total     = deliveries.length;
        var success   = deliveries.filter(function (d) { return ['delivered','buyer_confirmed'].includes(d.status); }).length;
        var failed    = deliveries.filter(function (d) { return ['failed','returned'].includes(d.status); }).length;
        var revenue   = deliveries.reduce(function (s,d) { return s + (d.deliveryFee||0); }, 0);
        var riderPay  = deliveries.reduce(function (s,d) { return s + (d.driverNet||0); }, 0);
        var vehicles  = {};
        deliveries.forEach(function (d) {
          var v = d.vehicleType||'moto';
          vehicles[v] = (vehicles[v]||0)+1;
        });
        var topVehicle = Object.entries(vehicles).sort(function(a,b){return b[1]-a[1];})[0];
        el.innerHTML = [
          _metric('Total Deliveries', total, '30 days'),
          _metric('Successful', success, total ? Math.round(success/total*100)+'% success' : '—'),
          _metric('Failed/Returned', failed, total ? Math.round(failed/total*100)+'% failure' : '—'),
          _metric('Revenue', 'KES '+revenue.toLocaleString(), 'Total delivery fees'),
          _metric('Rider Pay', 'KES '+riderPay.toLocaleString(), 'Total paid to riders'),
          _metric('Top Vehicle', topVehicle ? topVehicle[0] : '—', topVehicle ? topVehicle[1]+' deliveries' : '—'),
        ].join('');
      }).catch(function () { el.innerHTML = '<p style="color:rgba(255,255,255,0.4);font-size:13px;">Could not load analytics.</p>'; });
  }

  function _metric(title, val, sub) {
    return `<div class="sd-metric"><div class="sd-metric-title">${_esc(String(title))}</div><div class="sd-metric-val">${_esc(String(val))}</div><div class="sd-metric-sub">${_esc(String(sub))}</div></div>`;
  }

  /* ── Report issue modal ── */
  window._openReport = function (deliveryRef) {
    document.getElementById('reportDeliveryRef').value = deliveryRef;
    document.getElementById('reportReason').value = '';
    document.getElementById('reportNote').value = '';
    document.getElementById('reportModal').classList.add('open');
  };

  window._submitReport = function () {
    var deliveryRef = document.getElementById('reportDeliveryRef').value;
    var reason = document.getElementById('reportReason').value;
    var note   = document.getElementById('reportNote').value.trim();
    if (!reason) { SK.dialog.alert('Please select a reason'); return; }
    var handleFailed = firebase.functions().httpsCallable('handleFailedDelivery');
    handleFailed({ deliveryRef, reason, note })
      .then(function (result) {
        document.getElementById('reportModal').classList.remove('open');
        SK.dialog.alert('Report submitted. Action: ' + result.data.action);
      })
      .catch(function (err) { SK.dialog.alert('Error: ' + err.message); });
  };

  /* ── XSS escape ── */
  function _esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  }
})();
</script>

<script src="sokoni-cart.js"></script>
