  <style>
    /* ── WISHLIST PREMIUM STYLES ── */
    .wish-hero {
      background: linear-gradient(135deg, rgba(236,72,153,0.09) 0%, rgba(168,85,247,0.05) 50%, transparent 100%);
      border-bottom: 1px solid rgba(236,72,153,0.12);
      padding: 28px 20px 20px;
    }
    .wish-hero-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 16px;
    }
    .wish-hero-left { display: flex; align-items: center; gap: 14px; }
    .wish-hero-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.28);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      animation: wishPulse 3s ease-in-out infinite;
    }
    @keyframes wishPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,0.2); }
      50%      { box-shadow: 0 0 0 8px rgba(236,72,153,0); }
    }
    .wish-hero-title { font-size: 22px; font-weight: 900; color: #fff; margin: 0 0 3px; }
    .wish-hero-sub { font-size: 12px; color: rgba(255,255,255,0.45); margin: 0; }

    /* Search bar inside hero */
    .wish-search-wrap {
      position: relative;
    }
    .wish-search-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.3); font-size: 13px; pointer-events: none;
    }
    .wish-search-input {
      width: 100%; padding: 11px 14px 11px 38px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: white; font-size: 13px; font-family: inherit;
      outline: none; box-sizing: border-box; transition: border-color .2s;
    }
    .wish-search-input::placeholder { color: rgba(255,255,255,0.3); }
    .wish-search-input:focus { border-color: rgba(236,72,153,0.4); }

    /* Sort bar */
    .wish-sort-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none;
    }
    .wish-sort-bar::-webkit-scrollbar { display: none; }
    .wish-sort-label { font-size: 11px; color: rgba(255,255,255,0.35); white-space: nowrap; flex-shrink: 0; }
    .wish-filter-btn {
      padding: 6px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.55); font-size: 11px; font-weight: 700;
      cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
      transition: all .2s;
    }
    .wish-filter-btn:hover,
    .wish-filter-btn.active { background: rgba(236,72,153,0.12); border-color: rgba(236,72,153,0.3); color: #ec4899; }

    /* Grid */
    .wish-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 14px 12px 100px;
    }
    @media(min-width: 480px)  { .wish-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(min-width: 700px)  { .wish-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(min-width: 1000px) { .wish-grid { grid-template-columns: repeat(4, 1fr); } }
    @media(min-width: 1280px) { .wish-grid { grid-template-columns: repeat(5, 1fr); } }

    /* Wish card */
    .wish-card {
      background: rgba(16,16,16,0.96);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      animation: wishCardIn 0.3s ease;
      position: relative;
    }
    @keyframes wishCardIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .wish-card:hover {
      transform: translateY(-3px);
      border-color: rgba(236,72,153,0.3);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    /* Image */
    .wish-img-wrap {
      width: 100%; aspect-ratio: 1/1; overflow: hidden; position: relative;
    }
    .wish-img-wrap::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
      background: linear-gradient(to top, rgba(6,6,6,0.65) 0%, transparent 100%);
      pointer-events: none;
    }
    .wish-img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .3s;
    }
    .wish-card:hover .wish-img-wrap img { transform: scale(1.07); }

    /* Remove button */
    .wish-remove-btn {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); font-size: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); transition: all .2s;
    }
    .wish-remove-btn:hover { background: rgba(255,60,60,0.7); border-color: rgba(255,60,60,0.5); color: white; }

    /* Heart badge */
    .wish-heart-badge {
      position: absolute; top: 8px; left: 8px; z-index: 3;
      font-size: 14px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    /* Card body — typography matched to the cart (.cart-card-*) and checkout
       (.os-item-*) product rows so the same product reads identically wherever
       it appears. Previously this card ran 2px smaller on every line, which is
       what made the wishlist feel like a lesser surface than the cart. */
    .wish-card-body { padding: 10px 11px 12px; }
    .wish-card-name {
      font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.92);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin: 0 0 4px; line-height: 1.35;
    }
    .wish-card-cat {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: rgba(255,255,255,0.35); margin: 0 0 6px;
    }
    .wish-card-price {
      font-size: 15px; font-weight: 900; color: #71ff00; margin: 0 0 10px;
    }
    /* Share — was a 9-property inline style attribute repeated per card. */
    .wish-share-btn {
      background: none; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 7px 10px; cursor: pointer;
      font-size: 13px; color: rgba(255,255,255,0.6);
      font-family: inherit; transition: border-color .2s, color .2s;
    }
    .wish-share-btn:hover { border-color: rgba(113,255,0,0.35); color: #71ff00; }

    /* Action buttons */
    .wish-btns { display: flex; gap: 6px; }
    .wish-cart-btn {
      flex: 1; padding: 8px 0; text-align: center;
      background: linear-gradient(135deg, #71ff00, #4fc800);
      color: #000; font-size: 10px; font-weight: 900; border: none;
      border-radius: 8px; cursor: pointer; font-family: inherit;
      transition: opacity .2s;
    }
    .wish-cart-btn:hover { opacity: .88; }
    .wish-buynow-btn {
      padding: 8px 10px; text-align: center;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7); font-size: 10px; font-weight: 800; border-radius: 8px;
      cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .2s;
    }
    .wish-buynow-btn:hover { background: rgba(255,255,255,0.12); color: white; }

    /* Empty state */
    .wish-empty {
      grid-column: 1 / -1; text-align: center;
      padding: 80px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .wish-empty-icon { font-size: 72px; }
    .wish-empty h2 { color: white; font-size: 22px; font-weight: 900; margin: 0; }
    .wish-empty p { color: rgba(255,255,255,0.4); font-size: 14px; margin: 0; }
    .wish-empty-shop {
      margin-top: 8px; padding: 14px 32px;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: white; font-weight: 900; font-size: 14px; border-radius: 14px;
      text-decoration: none; display: inline-block;
    }

    /* Cart badge on navbar */
    .cart-badge-wrap { position: relative; display: inline-flex; }
    .cart-count-badge {
      position: absolute; top: -6px; right: -8px;
      background: #71ff00; color: #000; font-size: 9px; font-weight: 900;
      min-width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* Mobile: horizontal card layout for single-column */
    @media(max-width: 479px) {
      .wish-card {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        border-radius: 14px;
        overflow: hidden;
      }
      .wish-img-wrap {
        width: 88px;
        min-width: 88px;
        aspect-ratio: unset;
        height: auto;
        flex-shrink: 0;
      }
      .wish-img-wrap::after { height: 100%; width: 40%; top: 0; right: 0; left: auto;
        background: linear-gradient(to left, rgba(6,6,6,0.65) 0%, transparent 100%); }
      .wish-card-body {
        flex: 1;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
      }
      /* Mobile keeps the same scale as the cart's horizontal rows — the card is
         narrower here, not less important. */
      .wish-card-name { font-size: 13px; }
      .wish-card-price { font-size: 15px; margin-bottom: 8px; }
      .wish-btns { flex-wrap: wrap; gap: 5px; }
      .wish-cart-btn { flex: unset; width: 100%; padding: 8px 0; }
      .wish-buynow-btn { flex: 1; min-width: 0; padding: 8px 6px; text-align: center; }
    }
  </style>

<!-- Canonical wishlist authority. Must load before the render block below, which calls
     SokoniWishlist for load, list, remove and the legacy migration. -->
<script src="sokoni-wishlist.js"></script>
<!-- Canonical cart access path (Track 2.3.5). Move to Cart and Buy Now no longer
     touch localStorage['cart']; without this tag they fail closed and say so, rather
     than removing a wishlist item that never reached the cart. -->
<script src="sokoni-cart.js"></script>
<script>
/* ── WISHLIST PREMIUM RENDER ──────────────────────────────────────────────────
   Canonical authority: wishlistItems/{uid}_{productId}, reached only through
   SokoniWishlist → commerceDispatch.

   _wishData used to be seeded from localStorage['wishlist'] and written back on every
   mutation, with a two-way sync to the legacy wishlists/{uid} document. That made the
   page its own wishlist authority, per-DEVICE rather than per-USER, and disagreeing with
   product detail, category, marketplace and the market-actions cards once those moved to
   the canonical service.

   It is now a RENDER BUFFER only: filled from SokoniWishlist.list(), never from
   localStorage, and never written back. The index-based handlers below (share, remove,
   move-to-cart, buy-now) keep working because the buffer mirrors canonical order. */
var _wishData = [];
var _wishState = 'loading';   /* loading | ready | error — never "empty on failure" */

function showNotif(msg, type){
  var c = document.getElementById("notificationContainer");
  if(!c) return;
  var n = document.createElement("div");
  n.className = "notification " + type;
  n.textContent = msg;
  c.appendChild(n);
  setTimeout(function(){ n.remove(); }, 3000);
}

function updateWishCount(list){
  var el = document.getElementById("wishCount");
  if(el) el.textContent = list.length + " item" + (list.length !== 1 ? "s" : "") + " saved";
}

function updateCartBadge(){
  /* This badge ALREADY counted units — reduce((s,i)=>s+(i.qty||1),0) — so units() is a
     like-for-like swap, not a semantics change. With no service it shows an em dash: an
     unverifiable count must not be rendered as 0, which would assert an empty cart. */
  var el = document.getElementById("cartBadge");
  if(!el) return;
  var C = window.SokoniCart;
  el.textContent = C ? C.units() : "—";
}
updateCartBadge();
/* Refresh when any surface changes the cart, not only this page's own moves. */
try { window.addEventListener("sokoni:cart-changed", updateCartBadge); } catch(e){}

/* Product names, categories and image URLs are seller-supplied and were being
   interpolated RAW into this template — a stored-XSS hole: a product named
   `<img src=x onerror=...>` saved to a wishlist executed on render. cart.js has
   carried these two helpers all along; this page simply never adopted them.
   Escaping is a standing platform rule, not a per-page choice. */
function _esc(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}
/* Blocks javascript:/data: URIs while allowing http(s), root-relative and
   plain relative paths. */
function _safeImgSrc(url){
  if(!url) return 'assets/default-product.png';
  var u = String(url);
  return (/^https?:\/\//i.test(u) || /^\/[^/]/.test(u) || !/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(u))
    ? _esc(u) : 'assets/default-product.png';
}

function renderWishlist(list){
  var container = document.getElementById("wishlistContainer");
  if(!container) return;
  updateWishCount(list);

  /* A failed canonical read is NOT an empty wishlist. Rendering "Your wishlist is
     empty" when we simply could not ask is a claim we cannot support, and it invites
     the shopper to re-save things they already have. */
  if(_wishState === 'error'){
    container.innerHTML = `<div class="wish-empty">
      <div class="wish-empty-icon">⚠️</div>
      <h2>Couldn't load your wishlist</h2>
      <p>Your saved items are safe — we just can't show them right now.</p>
      <button class="wish-empty-shop" onclick="_wishReload()">Retry</button>
    </div>`;
    return;
  }
  if(_wishState === 'loading'){
    container.innerHTML = `<div class="wish-empty">
      <div class="wish-empty-icon">❤️</div>
      <h2>Loading your wishlist…</h2>
    </div>`;
    return;
  }

  if(list.length === 0){
    container.innerHTML = `<div class="wish-empty">
      <div class="wish-empty-icon">❤️</div>
      <h2>Your wishlist is empty</h2>
      <p>Save products you love to buy later</p>
      <a href="category.html?cat=all" class="wish-empty-shop">Browse Products</a>
    </div>`;
    return;
  }

  container.innerHTML = list.map(function(p, i){
    var idx = _wishData.indexOf(p);
    var currentPrice = Number(p.price) || 0;
    var savedPrice   = Number(p.savedPrice) || currentPrice;
    var origPrice    = Number(p.originalPrice) || 0;

    /* price badge logic */
    var priceBadge = '';
    if (origPrice > currentPrice && origPrice > 0) {
      var saved = origPrice - currentPrice;
      priceBadge = '<span style="display:inline-block;background:rgba(113,255,0,.15);color:#71ff00;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;margin-left:6px;">-KES ' + saved.toLocaleString() + '</span>';
    } else if (savedPrice > currentPrice && p.savedPrice) {
      var drop = savedPrice - currentPrice;
      priceBadge = '<span style="display:inline-block;background:rgba(113,255,0,.15);color:#71ff00;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;margin-left:6px;">↓ KES ' + drop.toLocaleString() + ' drop</span>';
    }

    var savedDate = p.savedAt ? new Date(p.savedAt).toLocaleDateString('en-KE', {day:'numeric',month:'short'}) : '';

    var safeName = _esc(p.name);
    var catRaw   = String(p.category || '');
    var safeCat  = catRaw ? _esc(catRaw.charAt(0).toUpperCase() + catRaw.slice(1)) : 'Product';

    return `<div class="wish-card">
      <div class="wish-img-wrap">
        <span class="wish-heart-badge">❤️</span>
        <button class="wish-remove-btn" onclick="removeWishlist(${idx})" title="Remove">✕</button>
        <img src="${_safeImgSrc(p.image)}" alt="${safeName}" loading="lazy" onerror="this.src='assets/default-product.png'">
      </div>
      <div class="wish-card-body">
        <h3 class="wish-card-name">${safeName}</h3>
        <p class="wish-card-cat">${safeCat}${savedDate ? ' · Saved ' + _esc(savedDate) : ''}</p>
        <p class="wish-card-price">KES ${currentPrice.toLocaleString()}${priceBadge}</p>
        <div class="wish-btns">
          <button class="wish-cart-btn" onclick="moveToCart(${idx})">🛒 Add to Cart</button>
          <button class="wish-buynow-btn" onclick="buyNowWish(${idx})">Buy Now</button>
          <button class="wish-share-btn" onclick="shareWish(${idx})" title="Share">↑</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* The "wl-fs" Firebase app and its hardcoded _wishFSCFG are gone.

   It existed only to read/write wishlists/{uid} directly from the client. Both halves
   are now removed: the write because that document is migration history rather than
   authority, and the read because `wishlists` has no rule in firestore.rules — locally
   or in the live ruleset ca9e8924 — so Firestore denied it by default and always had.

   Deleting it also removes a duplicated hardcoded config (whose appId was a digit wrong
   until this phase), a second Firebase app instance, and an App Check bypass, since this
   app was initialised without the shared App Check setup. The page now uses only the
   canonical service. */

/* _wishFSSave() and _wishFSLoad() removed.
   _wishFSSave wrote the page's local array straight into wishlists/{uid}.items[] — a
   direct client write to what is now migration history, not authority. _wishFSLoad
   merged that document INTO localStorage, which is how the two-way sync existed in the
   first place. Both are replaced by _wishReadLegacy() (read-only) feeding
   SokoniWishlist.migrateLegacy(). The legacy document is never written again.
   _wishFSCFG above is retained solely for that read until wl-fs is retired. */

/* ── Canonical load + one-time legacy migration ───────────────────────────────
   Order matters. Canonical state must resolve FIRST: migrateLegacy() refuses to run
   against an unknown wishlist, because treating "we could not read it" as "it is empty"
   would re-add everything the shopper already has.

   The legacy document is read through the existing wl-fs instance and its items[] are
   passed straight in — never localStorage, which on this page still holds the old
   two-way-sync cache. wl-fs stays until that read has a proven replacement.

   The legacy document is never written, mutated or deleted here. It is migration
   history, not ongoing authority. */
var _wishUidActive = null;

/* ── LEGACY MIGRATION SOURCE IS UNAVAILABLE FROM THE CLIENT ───────────────────
   There is deliberately no _wishReadLegacy() here, and no "wl-fs" Firebase app.

   `wishlists/{uid}` has NO rule in firestore.rules — not locally and not in the live
   ruleset ca9e8924 — and there is no catch-all, so Firestore denies the read by default.
   The old wl-fs instance was therefore never reading anything: its getDoc sat inside a
   catch(e){} and failed silently on every page load. Removing it loses no capability and
   removes a duplicated hardcoded config plus an App Check bypass.

   SokoniWishlist.migrateLegacy() remains implemented and proven (engine + safety
   properties, 52/52) but has no production input path. When one is wanted it belongs
   server-side, where the Admin SDK is not subject to rules:

       Firebase Auth → commerceDispatch → Admin SDK reads wishlists/{uid}
                     → validate items → SokoniWishlist canonical write semantics
                     → wishlistItems/{uid}_{productId}      (legacy document untouched)

   That is a separate, explicitly authorised decision. Nothing here fabricates a
   migration that cannot run, and no legacy data is touched meanwhile. */

function _wishRender(){
  _wishData = (window.SokoniWishlist ? window.SokoniWishlist.list() : []).slice();
  renderWishlist(_wishData);
}

function _wishReload(){
  var W = window.SokoniWishlist;
  var uid = (window.firebaseAuth && window.firebaseAuth.currentUser && window.firebaseAuth.currentUser.uid) || null;
  if(!W || !uid){ _wishState = 'ready'; _wishData = []; renderWishlist(_wishData); return; }
  _wishUidActive = uid;
  _wishState = 'loading'; renderWishlist([]);

  W.load(true).then(function(){
    _wishState = 'ready';
    _wishRender();
    /* No legacy migration call here — see the note above. The client cannot read
       wishlists/{uid}, so wiring one would only look like it migrates. */
  }).catch(function(e){
    /* Canonical unknown → error state. Never an empty wishlist. */
    _wishState = 'error';
    renderWishlist([]);
    console.warn('[wishlist] canonical load failed:', e && (e.code || e.message));
  });
}

document.addEventListener("sokoniAuthReady",function(e){
  var uid=e.detail&&e.detail.uid;
  if(uid) _wishReload();
});
if(window.firebaseAuth&&window.firebaseAuth.currentUser){
  _wishReload();
}

/* Account switch: SokoniWishlist clears its own cache, but this page must not keep
   painting the previous account's rows while the new state loads. */
(function(){
  var a = window.firebaseAuth;
  if(!a || typeof a.onAuthStateChanged !== 'function') return;
  a.onAuthStateChanged(function(u){
    var uid = (u && u.uid) || null;
    if(uid === _wishUidActive) return;
    _wishData = []; _wishState = uid ? 'loading' : 'ready';
    renderWishlist(_wishData);
    if(uid) _wishReload();
  });
})();

/* Canonical change anywhere — this page, product detail, category, marketplace. */
window.addEventListener('sokoni:wishlist-changed', function(){
  if(_wishState === 'ready') _wishRender();
});

/* Share by index. The old handler serialised the product NAME into an inline
   onclick string literal, escaping single quotes only — double quotes,
   backslashes and a literal closing-script sequence all still broke out of it.
   Looking the product up by index means no user-supplied text is ever parsed
   as code.
   (Note for future edits: never write a literal closing-script tag inside these
   template strings — the HTML parser ends the block there and orphans the rest
   of the file. That is exactly how this function's first draft broke the page.) */
function shareWish(index){
  var p = _wishData[index];
  if (!p || !window.SokoniShare) return;
  SokoniShare.open({
    name:  String(p.name || ''),
    price: Number(p.price) || 0,
    image: String(p.image || ''),
    url:   window.location.href
  });
}

/* Both mutations go through the canonical service and only report success once it
   resolves. Previously they spliced a local array, wrote localStorage and announced
   success immediately — a localStorage write cannot fail the way a server call can, so
   the shopper was always told it worked. */
function removeWishlist(index){
  var item = _wishData[index];
  var W = window.SokoniWishlist;
  if(!item || !W) return;
  W.remove(item.productId || item.id).then(function(){
    showNotif("Removed from wishlist", "error");
    _wishRender();
  }).catch(function(){
    showNotif("Couldn't remove — try again", "error");
  });
}

function moveToCart(index){
  var item = _wishData[index];
  var W = window.SokoniWishlist;
  var C = window.SokoniCart;
  if(!item || !W) return;
  if(!C){ showNotif("Cart is still loading — try again in a moment", "error"); return; }

  /* Move is add-then-remove, and the ADD MUST BE CONFIRMED before the remove.

     The ordering was already right and the error handling defeated it: the cart write was
     `try { localStorage.setItem(...) } catch(e){}` — a swallowed failure — and the code
     carried straight on to remove the item from the wishlist and report "Moved to cart".
     On a full quota that DESTROYED the item: gone from the wishlist, never in the cart,
     and the shopper told it had moved. The comment above it claimed the ordering made
     that impossible.

     Now the add is checked. If it fails, the wishlist entry is left exactly where it
     was — the shopper still has the item. */
  if(!C.add(item)){
    showNotif("Couldn't add to cart — the item is still in your wishlist", "error");
    return;
  }
  updateCartBadge();

  W.remove(item.productId || item.id).then(function(){
    showNotif("Moved to cart 🛒", "success");
    _wishRender();
  }).catch(function(){
    /* The cart half succeeded, so this is honest: the item IS in the cart and also still
       saved. Not a failure of the move, just an incomplete tidy-up. */
    showNotif("Added to cart, but couldn't clear it from your wishlist", "error");
  });
}

/* The FOURTH copy of the Buy Now navigate-on-failure pattern, after product.js,
   category.js and flashsale.html. It APPENDS — like script.js and flashsale, unlike
   Product Detail and Category which replace — and that is preserved. Only the
   unconditional navigation is corrected: a storage failure used to send the shopper to
   checkout with the previous cart, buying something they had not chosen.

   Note this deliberately does NOT remove the item from the wishlist. Buy Now is not a
   move; the shopper keeps the saved item. */
function buyNowWish(index){
  var item = _wishData[index];
  if(!item) return false;
  var C = window.SokoniCart;
  if(!C){ showNotif("Cart is still loading — try again in a moment", "error"); return false; }
  if(!C.add(item)){
    showNotif("Couldn't start checkout — please try again", "error");
    return false;
  }
  window.location.href = "checkout.html";
  return true;
}

function searchWishlist(){
  var el = document.getElementById("wishSearchHero") || document.getElementById("wishSearch");
  var val = el ? el.value.toLowerCase() : "";
  renderWishlist(val ? _wishData.filter(function(p){ return p.name.toLowerCase().includes(val); }) : _wishData);
}

function searchWishlistHero(val){
  renderWishlist(val ? _wishData.filter(function(p){ return p.name.toLowerCase().includes(val); }) : _wishData);
}

function sortWish(type, btn){
  document.querySelectorAll(".wish-filter-btn").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
  var sorted = _wishData.slice();
  if(type === "low")  sorted.sort(function(a,b){ return Number(a.price)-Number(b.price); });
  if(type === "high") sorted.sort(function(a,b){ return Number(b.price)-Number(a.price); });
  if(type === "name") sorted.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
  renderWishlist(sorted);
}

window.removeWishlist = removeWishlist;
window.moveToCart = moveToCart;
window.buyNowWish = buyNowWish;
window.searchWishlist = searchWishlist;
window.searchWishlistHero = searchWishlistHero;
window.sortWish = sortWish;

renderWishlist(_wishData);
</script>
