<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOKONI POS boot probe</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════
  SOKONI POS BOOT PROBE  —  /pos-boot-probe
  ══════════════════════════════════════════════════════════════════════════════
  /pos-debug proved the phone can reach the origin, receive HTML and run
  JavaScript. /pos still dies. So the killer is inside the POS boot chain, and the
  only way to name it is to add ONE dependency at a time until the device fails.

  THIS LOADS THE REAL SCRIPTS, IN THE REAL ORDER. It fetches /pos, reads its
  <script src> list exactly as the browser would, and then loads them one by one.
  It is not a simulation of the boot; it IS the boot, paused between every step.

  WHAT IT DOES NOT DO: it never runs pos.html's inline bootstrap, so nothing
  navigates, redirects or mounts the POS UI. It measures LOADING, which is what a
  memory kill acts on.

  IT SURVIVES THE TAB DYING. The name of each script is written to localStorage
  BEFORE that script is attached. If the tab is killed, reopening this page shows
  the last script it tried — that file is the killer, or the straw that broke it.

  NOTHING IS AUTOMATIC. The page always opens, because loading is what kills.
  ══════════════════════════════════════════════════════════════════════════════
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px 12px 40px; background:#07090c; color:#e8f2ff;
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         -webkit-text-size-adjust:100%; }
  h1 { font-size:16px; margin:0 0 3px; }
  .sub { color:#7f93ab; font-size:12px; margin-bottom:14px; }
  button { display:block; width:100%; margin:7px 0 0; padding:13px 14px; border-radius:11px;
           background:#12233a; color:#9fd0ff; border:1px solid #1e4470;
           font:600 14px/1 inherit; -webkit-appearance:none; cursor:pointer; }
  button:active { background:#17304f; }
  button[disabled] { opacity:.45; }
  .warn { background:#2a1c08; border-color:#6b4a12; color:#ffcf7a; }
  .go { background:#0d2a17; border-color:#1c6b3a; color:#8ef0b0; }
  #big { font-size:13px; font-weight:700; padding:10px; border-radius:9px;
         background:#0b1017; border:1px solid rgba(255,255,255,.1); margin:12px 0 0; }
  ol { margin:10px 0 0; padding-left:0; list-style:none; font-size:12px; }
  li { padding:5px 0; border-bottom:1px solid rgba(255,255,255,.06);
       display:flex; gap:8px; align-items:baseline; }
  li .i { flex:0 0 16px; }
  li .n { flex:1; min-width:0; word-break:break-all; }
  li .k { flex:0 0 auto; color:#7f93ab; font-size:11px; }
  .ok .i { color:#56d364; } .bad .i { color:#ff7b72; } .cur .i { color:#ffcf7a; }
  h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:#6e7f92;
       margin:20px 0 4px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0b1017; margin:6px 0 0;
        border:1px solid rgba(255,255,255,.09); border-radius:9px; padding:9px;
        font-size:11px; color:#a9c3dd; }
</style>
</head>
<body>

<h1>POS boot probe</h1>
<div class="sub">Loads the real POS scripts one at a time. Nothing runs automatically.</div>

<h2>Previous run</h2>
<div id="prev"></div>

<h2>Run</h2>
<button class="go" id="b-start">Start — load scripts one by one</button>
<button id="b-one">Load only the NEXT script</button>
<button id="b-half">Load the first half only</button>
<button class="warn" id="b-clear">Clear memory &amp; reset</button>

<div id="big">idle</div>
<ol id="list"></ol>

<script>
(function () {
  'use strict';

  var KEY  = 'sokoni_bootprobe';
  var PREV = 'sokoni_bootprobe_prev';

  var scripts = [];      /* {src, bytes} in document order */
  var idx = 0;
  var loadedBytes = 0;
  var running = false;

  var big  = document.getElementById('big');
  var list = document.getElementById('list');

  function save(extra) {
    var rec = {
      at: Date.now(),
      total: scripts.length,
      index: idx,
      lastTried: scripts[idx] ? scripts[idx].src : null,
      loadedKB: Math.round(loadedBytes / 1024),
      ua: navigator.userAgent.slice(0, 120),
      note: extra || ''
    };
    try { localStorage.setItem(PREV, JSON.stringify(rec)); } catch (e) {}
  }

  function say(t) { big.textContent = t; }

  function addRow(name, state, kb) {
    var li = document.createElement('li');
    li.className = state;
    var i = document.createElement('span'); i.className = 'i';
    i.textContent = state === 'ok' ? '✓' : state === 'bad' ? '✕' : '…';
    var n = document.createElement('span'); n.className = 'n'; n.textContent = name;
    var k = document.createElement('span'); k.className = 'k'; k.textContent = kb == null ? '' : kb + ' KB';
    li.appendChild(i); li.appendChild(n); li.appendChild(k);
    list.appendChild(li);
    return li;
  }

  /* ── previous run ─────────────────────────────────────────────────────── */
  (function () {
    var host = document.getElementById('prev');
    var raw = null;
    try { raw = localStorage.getItem(PREV); } catch (e) {}
    var pre = document.createElement('pre');
    if (!raw) {
      pre.textContent = 'No previous run recorded on this device.';
    } else {
      try {
        var r = JSON.parse(raw);
        pre.textContent =
          'reached      ' + r.index + ' of ' + r.total + ' scripts\n' +
          'loaded       ' + r.loadedKB + ' KB\n' +
          'LAST TRIED   ' + (r.lastTried || '(none)') + '\n' +
          (r.note ? 'note         ' + r.note + '\n' : '') +
          '\nIf the tab died, LAST TRIED is the script that killed it.';
      } catch (e) { pre.textContent = 'unreadable: ' + raw.slice(0, 200); }
    }
    host.appendChild(pre);
  })();

  /* ── read the REAL script list out of /pos ────────────────────────────── */
  function loadManifest() {
    say('reading the /pos script list…');
    return fetch('/pos?probe=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('/pos returned HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var re = /<script[^>]+src\s*=\s*["']([^"']+)["'][^>]*>/gi, m;
        var seen = {}, out = [];
        while ((m = re.exec(html)) !== null) {
          var s = m[1];
          if (/^https?:/i.test(s)) continue;          /* same-origin graph only */
          if (seen[s]) continue;
          seen[s] = 1;
          out.push({ src: s.charAt(0) === '/' ? s : '/' + s, bytes: 0 });
        }
        scripts = out;
        say(scripts.length + ' scripts found in /pos — tap Start');
        scripts.forEach(function (s) { addRow(s.src, 'pend', null); });
        return out;
      });
  }

  /* ── load exactly one, recording BEFORE it is attached ────────────────── */
  function loadNext() {
    if (idx >= scripts.length) {
      say('ALL ' + scripts.length + ' SCRIPTS LOADED — ' + Math.round(loadedBytes / 1024) +
          ' KB. The phone survived the whole graph.');
      save('completed');
      running = false;
      return Promise.resolve(false);
    }
    var s = scripts[idx];
    var li = list.children[idx];
    if (li) { li.className = 'cur'; li.querySelector('.i').textContent = '…'; }
    say((idx + 1) + ' / ' + scripts.length + '  ·  ' + Math.round(loadedBytes / 1024) +
        ' KB so far\n' + s.src);

    /* WRITTEN BEFORE THE LOAD. If the tab dies attaching this file, reopening
       the page names it. */
    save('loading');

    return new Promise(function (res) {
      var t0 = Date.now();
      /* Fetch first so the size is known even if evaluation kills the tab. */
      fetch(s.src, { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          s.bytes = txt.length;
          loadedBytes += txt.length;
          var el = document.createElement('script');
          el.src = s.src;
          el.onload = function () {
            if (li) { li.className = 'ok'; li.querySelector('.i').textContent = '✓';
                      li.querySelector('.k').textContent = Math.round(s.bytes / 1024) + ' KB · ' + (Date.now() - t0) + 'ms'; }
            idx++; save('ok'); res(true);
          };
          el.onerror = function () {
            if (li) { li.className = 'bad'; li.querySelector('.i').textContent = '✕';
                      li.querySelector('.k').textContent = 'failed'; }
            idx++; save('script error'); res(true);
          };
          document.head.appendChild(el);
        })
        .catch(function (e) {
          if (li) { li.className = 'bad'; li.querySelector('.i').textContent = '✕';
                    li.querySelector('.k').textContent = 'fetch failed'; }
          idx++; save('fetch failed: ' + (e && e.message)); res(true);
        });
    });
  }

  function runUntil(limit) {
    if (running) return;
    running = true;
    (function step() {
      if (!running) return;
      if (limit != null && idx >= limit) {
        running = false;
        say('stopped at ' + idx + ' of ' + scripts.length + ' · ' +
            Math.round(loadedBytes / 1024) + ' KB — the phone survived this far');
        save('paused at limit');
        return;
      }
      loadNext().then(function (more) {
        if (!more) { running = false; return; }
        /* A breath between scripts so the UI can paint and the device can
           reclaim — a tight loop would mask a gradual memory climb as a single
           sudden death. */
        setTimeout(step, 120);
      });
    })();
  }

  document.getElementById('b-start').addEventListener('click', function () {
    this.disabled = true;
    (scripts.length ? Promise.resolve() : loadManifest()).then(function () { runUntil(null); })
      .catch(function (e) { say('could not read /pos: ' + (e && e.message)); });
  });

  document.getElementById('b-one').addEventListener('click', function () {
    (scripts.length ? Promise.resolve() : loadManifest()).then(function () {
      if (!running) { running = true; loadNext().then(function () { running = false; }); }
    }).catch(function (e) { say('could not read /pos: ' + (e && e.message)); });
  });

  document.getElementById('b-half').addEventListener('click', function () {
    this.disabled = true;
    (scripts.length ? Promise.resolve() : loadManifest()).then(function () {
      runUntil(Math.ceil(scripts.length / 2));
    }).catch(function (e) { say('could not read /pos: ' + (e && e.message)); });
  });

  document.getElementById('b-clear').addEventListener('click', function () {
    try { localStorage.removeItem(PREV); localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });

  /* Manifest is read on load — a fetch is safe; only evaluation is dangerous. */
  loadManifest().catch(function (e) { say('could not read /pos: ' + (e && e.message)); });
}());
</script>
</body>
</html>
