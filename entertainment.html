<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entertainment Hub — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#f85149}
.hero{background:linear-gradient(135deg,#0d1117,#1a0008);padding:40px 16px 28px;text-align:center}
.hero h1{font-size:clamp(22px,5vw,36px);font-weight:700;margin-bottom:8px}
.hero p{color:#8b949e;font-size:14px;max-width:480px;margin:0 auto 20px}
.srow{display:flex;gap:8px;max-width:540px;margin:0 auto}
.srow input{flex:1;padding:11px 16px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px}
.srow input:focus{outline:none;border-color:#f85149}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22}
.tab{padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e;white-space:nowrap}
.tab.active{color:#e6edf3;border-color:#f85149}
.catbar{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.cat{padding:5px 11px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.cat.active,.cat:hover{background:#b22222;border-color:#f85149;color:#fff}
.tpill{padding:5px 11px;border-radius:16px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.tpill.active{background:#21262d;border-color:#8b949e;color:#e6edf3}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.card:hover{border-color:#f85149;transform:translateY(-2px)}
.cthumb{height:150px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
.cthumb img{width:100%;height:100%;object-fit:cover}
.cthumb::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;background:transparent;color:transparent;transition:.2s}
.card:hover .cthumb::after{background:rgba(0,0,0,.4);color:rgba(255,255,255,.9)}
.ttag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tf{background:#238636;color:#fff}.tp{background:#b22222;color:#fff}.ts{background:#1f6feb;color:#fff}
.dur{position:absolute;bottom:8px;right:8px;padding:2px 6px;background:rgba(0,0,0,.7);border-radius:4px;font-size:11px}
.cbody{padding:12px}
.ctitle{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:11px;color:#8b949e;margin-bottom:6px}
.crow{display:flex;justify-content:space-between;align-items:center}
.cprice{font-size:14px;font-weight:700;color:#f85149}
.crat{font-size:11px;color:#f0883e}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#f85149;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-r{background:#b22222;color:#fff}.btn-r:hover{background:#d42b2b}
.btn-g{background:#238636;color:#fff}.btn-g:hover{background:#2ea043}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-out:hover{border-color:#8b949e}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:600px;margin:auto}
.mhdr{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.mhdr h2{font-size:16px;font-weight:600}.xbtn{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
.mbody{padding:20px}
.trailer{height:210px;background:#000;border-radius:8px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.trailer img{width:100%;height:100%;object-fit:cover}
.playbtn{position:absolute;width:56px;height:56px;background:rgba(248,81,73,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.2s}
.playbtn:hover{transform:scale(1.1)}
.pc{position:relative;padding-bottom:56.25%;height:0;margin-bottom:14px;background:#000;border-radius:8px;overflow:hidden}
.pc iframe,.pc video{position:absolute;inset:0;width:100%;height:100%;border:none}
.mtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mtag{padding:3px 9px;background:#21262d;border-radius:6px;font-size:12px;color:#8b949e}
.buybox{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:10px;text-align:center}
.buyprice{font-size:24px;font-weight:700;color:#f85149;margin-bottom:4px}
.buynote{font-size:12px;color:#8b949e;margin-bottom:12px}
.lib-card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.lib-thumb{width:56px;height:42px;background:#21262d;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.lib-thumb img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;padding:60px;color:#8b949e}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">🎬 Entertainment</div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn btn-out" style="padding:7px 14px;font-size:13px" onclick="setTab('library',document.querySelectorAll('.tab')[1])">My Library</button>
    <button class="btn btn-out" style="padding:7px 14px;font-size:13px" onclick="setTab('creator',document.querySelectorAll('.tab')[2])">Creator</button>
  </div>
</div>
<div class="hero">
  <h1>Kenya's Entertainment Hub</h1>
  <p>Movies, shows, comedy, live performances, music videos and more.</p>
  <div class="srow">
    <input id="sq" type="text" placeholder="Search movies, shows, artists…" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn btn-r" onclick="doSearch()">Search</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('browse',this)">Browse</div>
  <div class="tab" onclick="setTab('library',this)">My Library</div>
  <div class="tab" onclick="setTab('creator',this)">Creator Dashboard</div>
</div>
<div class="catbar" id="catBar"></div>
<div class="container">
  <div id="tBrowse"><div class="empty"><div class="spinner"></div></div></div>
  <div id="tLibrary" style="display:none"><div id="libArea" class="empty"><div class="spinner"></div></div></div>
  <div id="tCreator" style="display:none"><div id="creatorArea" class="empty"><div class="spinner"></div></div></div>
  <div style="text-align:center;margin-top:16px;display:none" id="moreBtn"><button class="btn btn-out" onclick="loadMore()">Load More</button></div>
</div>

<div class="overlay" id="contentModal">
  <div class="modal">
    <div class="mhdr"><h2 id="mTitle"></h2><button class="xbtn" onclick="closeContent()">×</button></div>
    <div class="mbody">
      <div id="playerArea" style="display:none"></div>
      <div class="trailer" id="trailerBox">
        <img id="mThumb" src="" style="display:none">
        <div id="thumbEmoji" style="font-size:64px">🎬</div>
        <div class="playbtn" id="playBtn" onclick="playTrailer()" style="display:none">▶</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <div style="font-size:20px;font-weight:700;color:#f85149" id="mPrice"></div>
        <div style="font-size:12px;color:#8b949e" id="mViews"></div>
      </div>
      <div class="mtags" id="mMeta"></div>
      <p style="font-size:13px;color:#8b949e;margin-bottom:6px" id="mCast"></p>
      <p style="font-size:14px;color:#8b949e;line-height:1.6;margin-bottom:14px" id="mDesc"></p>
      <div id="buyBox">
        <div class="buybox">
          <div class="buyprice" id="buyPr"></div>
          <div class="buynote" id="buyNt"></div>
          <button class="btn" id="buyBtn" style="width:100%" onclick="watchOrBuy()">Watch Now</button>
        </div>
        <div style="font-size:12px;color:#8b949e;text-align:center;margin-top:8px">🔒 Secure · 📺 Unlimited replay after purchase</div>
      </div>
    </div>
  </div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,all=[],sel=null,cursor=null,catF='',typeF='';
const CATS=['movie','series','documentary','comedy_show','music_video','podcast','live_performance','sports_highlight','animation','short_film','other'];
const CEMO={movie:'🎬',series:'📺',documentary:'🎥',comedy_show:'😂',music_video:'🎵',podcast:'🎙️',live_performance:'🎭',sports_highlight:'⚽',animation:'🎨',short_film:'📽️',other:'🎬'};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
function open(id){document.getElementById(id).classList.add('open');}
function close(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
try{app=firebase.initializeApp(firebaseConfig,'ent');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

function buildCats(){
  const b=document.getElementById('catBar');
  b.innerHTML=`<div class="cat active" onclick="setCat('',this)">All</div>`+
  CATS.map(c=>`<div class="cat" onclick="setCat('${c}',this)">${CEMO[c]} ${c.replace(/_/g,' ')}</div>`).join('')+
  `<div class="tpill" onclick="setType('free',this)">🟢 Free</div>
   <div class="tpill" onclick="setType('ppv',this)">💰 PPV</div>`;
}
function setCat(c,el){catF=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');loadContent();}
function setType(t,el){typeF=typeF===t?'':t;document.querySelectorAll('.tpill').forEach(x=>x.classList.remove('active'));if(typeF)el.classList.add('active');loadContent();}

async function loadContent(){
  cursor=null;document.getElementById('tBrowse').innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('listEntertainmentContent',{category:catF||undefined,entType:typeF||undefined,limit:24});
  if(!r.ok){document.getElementById('tBrowse').innerHTML='<div class="empty">Could not load content.</div>';return;}
  all=r.data.listings||[];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}
async function loadMore(){
  if(!cursor)return;
  const r=await call('listEntertainmentContent',{category:catF||undefined,entType:typeF||undefined,limit:24,cursor});
  if(!r.ok)return;
  all=[...all,...(r.data.listings||[])];cursor=r.data.nextCursor;
  document.getElementById('moreBtn').style.display=cursor?'block':'none';
  render(all);
}

function fmtDur(m){if(!m)return'';const h=Math.floor(m/60),mn=m%60;return h?`${h}h ${mn}m`:`${mn}m`;}

function render(list){
  if(!list.length){document.getElementById('tBrowse').innerHTML='<div class="empty">No content found.</div>';return;}
  document.getElementById('tBrowse').innerHTML='<div class="grid">'+list.map(l=>{
    const tc={free:'tf',ppv:'tp',subscription:'ts'}[l.entType]||'tf';
    return`<div class="card" onclick="openC('${esc(l.listingId)}')">
      <div class="cthumb">${l.thumbnailUrl?`<img src="${esc(l.thumbnailUrl)}" loading="lazy">`:CEMO[l.category]||'🎬'}
        <span class="ttag ${tc}">${l.entType==='ppv'?'PPV':l.entType==='subscription'?'SUB':'FREE'}</span>
        ${l.duration?`<span class="dur">${fmtDur(l.duration)}</span>`:''}
      </div>
      <div class="cbody">
        <div class="ctitle">${esc(l.title)}</div>
        <div class="cmeta">${(l.category||'').replace(/_/g,' ')} · ${l.genre||''} · ${l.releaseYear||''}</div>
        <div class="crow"><span class="cprice">${l.entType==='free'?'Free':`KES ${(l.price||0).toLocaleString()}`}</span><span class="crat">★ ${l.contentRating||'—'}</span></div>
      </div>
    </div>`;
  }).join('')+'</div>';
}

async function openC(id){
  const cached=all.find(l=>l.listingId===id);
  if(cached&&!cached.description){const r=await call('getEntertainmentListing',{listingId:id});sel=r.ok?r.data:cached;}
  else sel=cached||{};
  const l=sel;
  document.getElementById('mTitle').textContent=l.title||'';
  document.getElementById('mPrice').textContent=l.entType==='free'?'Free':`KES ${(l.price||0).toLocaleString()}`;
  document.getElementById('mViews').textContent=`👁 ${(l.viewCount||0).toLocaleString()}`;
  const th=document.getElementById('mThumb'),te=document.getElementById('thumbEmoji');
  if(l.thumbnailUrl){th.src=l.thumbnailUrl;th.style.display='';te.style.display='none';}
  else{th.style.display='none';te.textContent=CEMO[l.category]||'🎬';te.style.display='';}
  document.getElementById('playBtn').style.display=l.trailerUrl?'':'none';
  document.getElementById('trailerBox').style.display='';
  document.getElementById('playerArea').style.display='none';
  document.getElementById('mMeta').innerHTML=[l.category&&`<span class="mtag">${(l.category||'').replace(/_/g,' ')}</span>`,l.genre&&`<span class="mtag">${l.genre}</span>`,l.releaseYear&&`<span class="mtag">${l.releaseYear}</span>`,l.duration&&`<span class="mtag">⏱ ${fmtDur(l.duration)}</span>`,l.language&&`<span class="mtag">🌐 ${l.language}</span>`,l.ageRating&&`<span class="mtag">${l.ageRating}</span>`].filter(Boolean).join('');
  const cast=l.cast||[];document.getElementById('mCast').innerHTML=cast.length?`🎭 ${cast.map(c=>esc(c)).join(', ')}`:'';
  document.getElementById('mDesc').textContent=l.description||'';
  const bb=document.getElementById('buyBox');
  if(l.entType==='free'){
    document.getElementById('buyPr').textContent='Free';
    document.getElementById('buyNt').textContent='Enjoy for free';
    document.getElementById('buyBtn').textContent='Watch Free';
    document.getElementById('buyBtn').className='btn btn-g';
  } else if(l.streamingUrl){
    bb.innerHTML=`<button class="btn btn-g" style="width:100%" onclick="playContent()">▶ Watch Now (Owned)</button>`;
  } else {
    document.getElementById('buyPr').textContent=`KES ${(l.price||0).toLocaleString()}`;
    document.getElementById('buyNt').textContent='One-time purchase · Watch anytime';
    document.getElementById('buyBtn').textContent='Buy & Watch';
    document.getElementById('buyBtn').className='btn btn-r';
  }
  open('contentModal');
}

function playTrailer(){
  if(!sel?.trailerUrl)return;
  document.getElementById('trailerBox').style.display='none';
  document.getElementById('playerArea').style.display='';
  document.getElementById('playerArea').innerHTML=`<div class="pc"><iframe src="${esc(sel.trailerUrl)}" allowfullscreen allow="autoplay"></iframe></div>`;
}
function playContent(){
  if(!sel?.streamingUrl)return;
  document.getElementById('trailerBox').style.display='none';
  document.getElementById('playerArea').style.display='';
  const url=sel.streamingUrl;
  if(url.includes('youtube')||url.includes('youtu.be')){
    document.getElementById('playerArea').innerHTML=`<div class="pc"><iframe src="${esc(url)}" allowfullscreen allow="autoplay"></iframe></div>`;
  } else {
    document.getElementById('playerArea').innerHTML=`<div class="pc"><video controls autoplay><source src="${esc(url)}"><p>Browser doesn't support video.</p></video></div>`;
  }
}
function closeContent(){document.getElementById('playerArea').innerHTML='';close('contentModal');}

async function watchOrBuy(){
  if(!sel)return;
  const key=`ep_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  if(sel.entType==='free'){
    const r=await call('purchaseEntertainment',{listingId:sel.listingId,idempotencyKey:key});
    if(r.ok&&r.data.streamingUrl){sel.streamingUrl=r.data.streamingUrl;playContent();}
    else if(sel.streamingUrl)playContent();
    else toast('Stream not yet available',false);
    return;
  }
  if(!cu){toast('Sign in to purchase content',false);return;}
  const btn=document.getElementById('buyBtn');btn.textContent='Processing…';btn.disabled=true;
  const r=await call('purchaseEntertainment',{listingId:sel.listingId,idempotencyKey:key});
  btn.textContent='Buy & Watch';btn.disabled=false;
  if(!r.ok){toast(r.err||'Purchase failed',false);return;}
  if(r.data.alreadyOwned){toast('Already owned!');location.reload();return;}
  if(r.data.status==='pending_payment'){toast('Redirecting to payment…');closeContent();return;}
  if(r.data.streamingUrl){sel.streamingUrl=r.data.streamingUrl;playContent();}
}

async function loadLibrary(){
  const a=document.getElementById('libArea');
  if(!cu){a.innerHTML='<div class="empty">Sign in to view your library.</div>';return;}
  a.innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('getMyEntertainmentPurchases',{});
  if(!r.ok){a.innerHTML='<div class="empty">Could not load library.</div>';return;}
  const list=r.data.purchases||[];
  if(!list.length){a.innerHTML='<div class="empty">No purchased content yet.</div>';return;}
  a.innerHTML=list.map(p=>`
    <div class="lib-card">
      <div class="lib-thumb">${CEMO[p.category]||'🎬'}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${esc(p.title||p.listingId)}</div>
        <div style="font-size:12px;color:#8b949e">KES ${(p.price||0).toLocaleString()}</div>
      </div>
      <button class="btn btn-g" style="padding:6px 12px;font-size:12px;flex-shrink:0" onclick="openC('${esc(p.listingId)}')">Watch</button>
    </div>`).join('');
}

async function loadCreator(){
  const a=document.getElementById('creatorArea');
  if(!cu){a.innerHTML='<div class="empty">Sign in to access the creator dashboard.</div>';return;}
  const r=await call('getCreatorDashboard',{});
  if(!r.ok){a.innerHTML='<div class="empty">No content published yet.</div>';return;}
  const d=r.data;
  a.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px">
    ${[['Total',d.totalListings],['Active',d.active],['Views',(d.totalViews||0).toLocaleString()],['Revenue','KES '+(d.totalRevenue||0).toLocaleString()]].map(([k,v])=>`
    <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px"><div style="font-size:11px;color:#8b949e">${k}</div><div style="font-size:18px;font-weight:700;color:#f85149">${v??0}</div></div>`).join('')}
  </div>
  ${(d.listings||[]).map(l=>`<div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-weight:600">${esc(l.title)}</div>
      <div style="font-size:12px;color:#8b949e">${l.category?.replace(/_/g,' ')||''} · ${l.entType} · 👁 ${l.viewCount||0} · 🛒 ${l.purchaseCount||0} · ★ ${l.contentRating||0}</div>
    </div>
    <span style="padding:3px 8px;border-radius:4px;font-size:12px;background:${l.status==='active'?'#1a3a2a':'#21262d'};color:${l.status==='active'?'#3fb950':'#8b949e'}">${l.status}</span>
  </div>`).join('')}`;
}

async function doSearch(){
  const q=document.getElementById('sq').value.trim();if(!q)return;
  const r=await call('searchEntertainment',{query:q,limit:40});
  if(!r.ok){toast('Search failed',false);return;}
  all=r.data.results||[];render(all);
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  ['tBrowse','tLibrary','tCreator'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('catBar').style.display=t==='browse'?'flex':'none';
  document.getElementById('moreBtn').style.display='none';
  if(t==='browse'){document.getElementById('tBrowse').style.display='';if(!all.length)loadContent();}
  else if(t==='library'){document.getElementById('tLibrary').style.display='';loadLibrary();}
  else if(t==='creator'){document.getElementById('tCreator').style.display='';loadCreator();}
}
buildCats();loadContent();
</script>
</body>
</html>
