  function normaliseOrder (id, d) {
    var t = d.createdAt && typeof d.createdAt.toDate === 'function' ? d.createdAt.toDate()
          : (d.createdAt instanceof Date ? d.createdAt : (d.date ? new Date(d.date) : null));
    var status = String(d.status || d.orderStatus || 'pending').toLowerCase();
    return {
      id: id,
      ref: d.orderNumber || d.orderId || d.ref || id,
      customer: d.customerName || (d.customer && d.customer.name) || d.buyerName || 'Walk-in',
      phone: d.customerPhone || (d.customer && d.customer.phone) || d.phoneNumber || '',
      total: Number(d.total != null ? d.total : (d.amount != null ? d.amount : 0)),
      currency: d.currency || 'KES',
      status: status,
      payment: String(d.paymentStatus || d.payment || (d.paid ? 'paid' : 'pending')).toLowerCase(),
      method: d.paymentMethod || d.method || '',
      fulfilment: String(d.fulfilmentStatus || d.deliveryStatus || d.fulfillment || '').toLowerCase(),
      channel: d.channel || d.orderType || '',
      items: Array.isArray(d.items) ? d.items : [],
      ts: t ? t.getTime() : 0,
      when: t,
    };
  }

  /* ── ONE SET OF PREDICATES ────────────────────────────────────────────────
     Orders, Analytics and Revenue all classify an order through THESE functions and
     nowhere else. That is the mechanism that stops the Orders tab counting 12
     completed while Analytics decides there are 14 — they are not "kept in sync",
     they are literally the same code. */
  var ST = {
    completed: function (o) { return /completed|delivered|fulfilled|done/.test(o.status); },
    cancelled: function (o) { return /cancel|refund|failed|returned/.test(o.status); },
    refunded:  function (o) { return /refund|returned/.test(o.status); },
    pending:   function (o) { return !ST.completed(o) && !ST.cancelled(o); },
    paid:      function (o) { return /paid|success|complete/.test(o.payment); },
    /* Cancelled money is not revenue. Every total below excludes it. */
    live:      function (o) { return !ST.cancelled(o); },
  };

  function money (n, cur) {
    var v = Number(n || 0);
    return (cur || 'KES') + ' ' + v.toLocaleString('en-KE', { maximumFractionDigits: 2 });
  }
  function ago (d) {
    if (!d) return '';
    var s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    var days = Math.floor(s / 86400);
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' });
  }
  function isToday (d) {
    if (!d) return false;
    var n = new Date();
    return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  }

  /* ── NATIVE VIEWS ─────────────────────────────────────────────────────────
     Dashboard and Orders are rebuilt here. Every other native route renders an
     honest placeholder that names itself rather than an empty panel — a blank
     screen is indistinguishable from a broken button. */
  function renderNative (id) {
    var p = nativePanel(id);
    if (id === 'orders') return renderOrders(p);
    if (id === 'payments') return renderPayments(p);
    if (id === 'devices') return renderDevices(p);
    if (id === 'availability') return renderAvailability(p);
    if (id === 'settings') return renderSettings(p);
    /* The nine ported surfaces — driven through their own mount(host, ctx) contract. */
    if (MODULES[id]) return renderModule(id, p);
    /* analytics | revenue | reports share ONE renderer and ONE engine, exactly as v1
       mapped them — two implementations would be two sets of numbers. */
    if (id === 'analytics' || id === 'revenue' || id === 'reports') {
      return renderAnalytics(p, id === 'revenue' ? 'revenue' : 'analytics');
    }
    if (p.dataset.rendered === '1' && id !== 'dashboard') return;
    p.dataset.rendered = '1';
    if (id === 'dashboard') return renderDashboard(p);
    var r = byId[id] || {};
    p.innerHTML =
      '<div class="greet"><b>' + esc(r.name || id) + '</b>' +
      '<small>This surface is not rebuilt in shell v2 yet.</small></div>' +
      '<div class="note"><b>Not yet ported.</b> The v1 shell renders this natively. ' +
      'It is listed here so the route is reachable and visibly accounted for, rather ' +
      'than opening a blank panel.</div>';
  }

  /* Figures are NEVER invented. Until a canonical source is wired, every metric shows
     a neutral em-dash and is styled as neutral — not a green zero, which would read as
     a real result (CLAUDE.md, UI Data Integrity). */
  var TILES = [
    { k: 'revenue',  label: 'Revenue' },
    { k: 'orders',   label: 'Orders' },
    { k: 'walkin',   label: 'Walk-in sales' },
    { k: 'online',   label: 'Online orders' },
    { k: 'aov',      label: 'Avg order' },
    { k: 'refunds',  label: 'Refunds' },
  ];
  function renderDashboard (p) {
    /* getHours() is the DEVICE's local time, which is the merchant's own — not UTC and
       not a server clock. A merchant in Nairobi at 09:00 must read "Good morning". */
    var hour = new Date().getHours();
    var part = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    /* Name it only when we actually have one. An unresolved name renders the greeting
       ALONE — never "Good afternoon, undefined", and never an email address, which is a
       login credential rather than a display name. */
    var who = merchantDisplayName();
    p.innerHTML =
      '<div class="greet"><b>' + part + (who ? ', ' + esc(who) : '') + '</b>' +
      '<small>Here’s what’s happening with your business today.</small></div>' +
      '<div class="sec-t">Today</div>' +
      '<div class="stats">' +
        TILES.map(function (t) {
          return '<div class="stat neutral"><b>—</b><small>' + esc(t.label) + '</small></div>';
        }).join('') +
      '</div>' +
      '<div class="sec-t">Quick actions</div>' +
      '<div class="actions">' +
        '<button class="act" data-route="sell">💳 New sale</button>' +
        '<button class="act ghost" data-route="orders">🧾 View orders</button>' +
        '<button class="act ghost" data-route="inventory">📦 Inventory</button>' +
        '<button class="act ghost" data-route="products">🏷️ Products</button>' +
      '</div>' +
      '<div class="note"><b>Figures show — until a canonical source is connected.</b> ' +
      'This shell does not compute revenue locally; an unknown is shown as a dash rather ' +
      'than as a zero, because a zero reads as a real result.</div>';
  }

  /* ══ MODULE ADAPTER ═══════════════════════════════════════════════════════
     What the nine ported surfaces are handed. Deliberately the SAME shape v1 builds
     (merchant.html:1783-1916) so the modules need no change at all.

     Two properties are load-bearing and must not be "simplified":
       · `db` is READ-ONLY. Every mutation in this workspace goes through a server
         callable; there is no client write path here, by construction.
       · `scope` comes from AUTH + the canonically resolved shop, never from the URL
         and never from localStorage alone. A missing shop resolves NOT-ok and the
         surfaces render their own "no shop yet" state instead of querying a guess. */
  function _callable (name) {
    return function (payload) {
      return sdk().then(function (m) {
        if (!window.firebaseApp) throw new Error('SOKONI is still starting up. Try again in a moment.');
        return import('https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js').then(function (fn) {
          return fn.httpsCallable(fn.getFunctions(window.firebaseApp), name)(payload);
        });
      });
    };
  }

  var _mdb = {
    queryProducts: function (spec) { return _q(spec, 'The product catalogue is not available yet.'); },
    queryProfiles: function (spec) { return _q(spec, 'Customers are not available yet.'); },
    queryMovements: function (spec) { return _q(spec, 'Adjustment history is not available yet.'); },
    /* The one subcollection read: a conversation's messages. `path` is an array so the
       caller never assembles a string and a conversation id cannot be spliced into the
       wrong one. */
    queryMessages: function (spec) {
      return sdk().then(function (m) {
        if (!window.firebaseDB) throw new Error('Messages are not available yet.');
        var parts = [m.fs.collection.apply(null, [window.firebaseDB].concat(spec.path))];
        if (spec.orderBy) parts.push(m.fs.orderBy(spec.orderBy[0], spec.orderBy[1]));
        if (spec.limit) parts.push(m.fs.limit(spec.limit));
        return m.fs.getDocs(m.fs.query.apply(null, parts));
      }).then(_rows);
    },
  };
  function _q (spec, msg) {
    return sdk().then(function (m) {
      if (!window.firebaseDB) throw new Error(msg);
      var parts = (spec.where || []).map(function (w) { return m.fs.where(w[0], w[1], w[2]); });
      if (spec.orderBy) parts.push(m.fs.orderBy(spec.orderBy[0], spec.orderBy[1]));
      if (spec.limit) parts.push(m.fs.limit(spec.limit));
      return m.fs.getDocs(m.fs.query.apply(null, [m.fs.collection(window.firebaseDB, spec.collection)].concat(parts)));
    }).then(_rows);
  }
  function _rows (snap) {
    return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
  }

  function _scope () {
    if (!window.SokoniMerchantData) return { ok: false, reason: 'data-module-missing' };
    /* THREE ANSWERS, NOT TWO. resolveScope knows "no uid" and "no shop"; it cannot
       know "signed in, but this account holds no merchant capability" — that is
       what the identity resolution above establishes.

       Collapsing that into no_active_shop is what put a buyer and a cashier in the
       same state, and told both of them to wait for a shop. Named separately so the
       till can say which is true. 'resolving' is deliberately not answered here:
       a session that is not yet known must not be reported as not permitted. */
    if (S.state === 'in' && S.activeShopId && !can('sell')) {
      return { ok: false, reason: 'no_sell_capability', sellerUid: S.uid, shopId: null };
    }
    if (S.state === 'in' && !S.activeShopId && S.shopError && /^identity-/.test(S.shopError)) {
      return { ok: false, reason: 'no_merchant_role', sellerUid: S.uid, shopId: null };
    }
    return window.SokoniMerchantData.resolveScope({ uid: S.uid, activeShopId: S.activeShopId });
  }
  function _scopeKey (s) { return (s && s.ok) ? s.shopId : ('!' + ((s && s.reason) || 'unknown')); }
  function _shopName () { return (S.shop && (S.shop.name || S.shop.shopName)) || null; }

  function _ctx () {
    return {
      scope: _scope(), db: _mdb, shopName: _shopName(),
      callSale: _callable('posCompleteCheckout'),
      callAdjust: _callable('merchantAdjustStock'),
      onToast: toast,
      onPrint: function (job) {
        /* Routed through the shell's device layer, so a receipt printed from Sell uses
           the SAME connection POS uses — that is the point of owning devices here. */
        return printerEngine().then(function (eng) {
          if (eng && eng.printReceipt) return eng.printReceipt(job);
          toast('No printer service is loaded.');
        });
      },
      openScanner: function () {
        /* Not wired in v2 yet. Say so rather than resolving with a fake code — a
           silent no-op here would look like a broken scan to a merchant at the till. */
        toast('Barcode scanning is not available in this workspace yet.');
        return Promise.resolve(null);
      },
      /* WHO MADE THE SALE — passed straight through, never constructed here.
         S.servedBy is whatever merchantIdentity resolved on the server; the shell
         does not build it, default it, or fall back to the shop owner. The receipt
         renderer already refuses to launder an unnamed employee sale into an
         owner sale, so a null here yields a receipt with no seller line rather
         than a false one, which is the correct failure.

         This closes a wire, not a feature: sokoni-merchant-sell.js already sends
         `servedBy: ctx.servedBy || null` and merchantIdentity already returns
         { uid, name, role, label }. Only this hand-off was missing, so receipts
         carried no seller at all. */
      servedBy: S.servedBy,
    };
  }

  /* ══ PORTED NATIVE SURFACES ═══════════════════════════════════════════════
     One table instead of nine near-identical render functions. Each entry names the
     global the module publishes and builds the context that module expects — taken
     from v1's call sites, not invented.

     A mounted surface is BOUND TO THE SHOP it was mounted for. The scope resolves
     asynchronously and can change when the merchant switches branch, so "already
     mounted" is not grounds to reuse: if the shop differs, tear down and rebuild
     rather than refreshing a surface that would query the previous shop's data. */
  var MODULES = {
    sell:       { global: 'SokoniMerchantSell',        ctx: _ctx },
    inventory:  { global: 'SokoniMerchantInventoryUI', ctx: _ctx },
    staff:      { global: 'SokoniMerchantTeam',        ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin,
                    callList: _callable('listShopEmployees'), callInvites: _callable('listShopInvites'),
                    callInvite: _callable('inviteShopEmployee'), callRevoke: _callable('revokeShopInvite'),
                    callRemove: _callable('removeShopEmployee'), onToast: toast }; } },
    marketing:  { global: 'SokoniMerchantMarketing',   ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin,
                    callList: _callable('getMinishopCampaigns'), callCreate: _callable('createMinishopCampaign'),
                    callPause: _callable('pauseMinishopCampaign'), callDelete: _callable('deleteMinishopCampaign'),
                    callPromos: _callable('miniShopGetPromotions'), callCreatePromo: _callable('miniShopCreatePromotion'),
                    callUpdatePromo: _callable('miniShopUpdatePromotion'), callCreateAd: _callable('createAdCampaign'),
                    onToast: toast }; } },
    disputes:   { global: 'SokoniMerchantDisputesUI',  ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin,
                    callList: _callable('getSellerDisputes'), callDetail: _callable('getDisputeDetail'),
                    callRespond: _callable('sellerRespondToDispute'), callEvidence: _callable('addDisputeEvidence'),
                    onToast: toast }; } },
    messages:   { global: 'SokoniMerchantMessagesUI',  ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin,
                    db: _mdb, onToast: toast }; } },
    customers:  { global: 'SokoniMerchantCustomersUI', ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin, db: _mdb,
                    callProfile: _callable('getCustomerProfile'), callDashboard: _callable('getCRMDashboard'),
                    onToast: toast }; } },
    shop:       { global: 'SokoniMerchantStoreUI',     ctx: function () { return {
                    scope: _scope(), origin: location.origin, shopName: _shopName(),
                    callIdentity: _callable('getMyMinishop'), callSave: _callable('saveMinishopConfig'),
                    callClaim: _callable('claimMinishopHandle'), callAnalytics: _callable('getMinishopAnalytics'),
                    callShare: _callable('generateMinishopShareCard'), onToast: toast }; } },
    'kra-tax':  { global: 'SokoniMerchantTaxUI',       ctx: function () { return {
                    scope: _scope(), shopName: _shopName(), origin: location.origin,
                    callProfile: _callable('etimsGetProfile'), callRegister: _callable('etimsRegisterSeller'),
                    callUpdate: _callable('etimsUpdateProfile'), callValidate: _callable('etimsValidatePin'),
                    callStats: _callable('etimsGetSellerStats'), callInvoice: _callable('etimsGenerateInvoice'),
                    callBulk: _callable('etimsBulkGenerate'), callResubmit: _callable('etimsResubmitInvoice'),
                    onToast: toast }; } },
  };
  var _mounted = {};   /* id -> { ui, shopKey } */

  function renderModule (id, p) {
    var def = MODULES[id];
    var G = window[def.global];
    if (!G || typeof G.mount !== 'function') {
      p.innerHTML = '<div class="state"><span class="ico">⚠️</span><b>' + esc(id) + ' could not load</b>' +
        '<small>The module script did not load, so this surface is unavailable. It is NOT empty — ' +
        'nothing was fetched. Reload, and report this if it persists.</small></div>';
      console.error('[merchant-v2] ' + def.global + ' missing — its script did not load');
      return;
    }
    /* A module owns its own scrolling, so its panel needs a definite height —
       otherwise the module's height:100% resolves against an auto-height panel,
       the column grows to its content, and anything the module pins to its own
       bottom edge (the Charge bar) ends up below the fold. */
    p.classList.add('panel-scroll');

    var key = _scopeKey(_scope());
    var cur = _mounted[id];
    if (cur && cur.shopKey === key) { try { cur.ui.refresh && cur.ui.refresh(); } catch (_) {} return; }
    if (cur) { try { cur.ui.destroy && cur.ui.destroy(); } catch (_) {} _mounted[id] = null; }
    p.innerHTML = '';
    var ui = G.mount(p, def.ctx());
    _mounted[id] = ui ? { ui: ui, shopKey: key } : null;
  }

  /* ══ ORDERS ═══════════════════════════════════════════════════════════════
     Click -> skeleton NOW -> cached rows if we have them -> fresh rows.
     The panel is never blank and never blocks on the network. */
  var ORD = { tab: 'all', q: '', rows: null, loading: false };
  var ORD_TABS = [
    { k: 'all',       label: 'All' },
    { k: 'today',     label: 'Today' },
    { k: 'pending',   label: 'Pending' },
    { k: 'completed', label: 'Completed' },
    { k: 'cancelled', label: 'Cancelled' },
  ];

  function renderOrders (p) {
    if (!p.dataset.built) {
      p.dataset.built = '1';
      p.innerHTML =
        '<div class="toolbar">' +
          '<div class="segs" id="ord-segs"></div>' +
          '<div class="search"><span>🔍</span>' +
            '<input id="ord-q" type="search" placeholder="Search order, customer or phone…" autocomplete="off">' +
          '</div>' +
        '</div>' +
        '<div id="ord-body"></div>';
      p.querySelector('#ord-q').addEventListener('input', function (e) {
        ORD.q = e.target.value.trim().toLowerCase();
        paintOrders();
      });
      p.querySelector('#ord-segs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-tab]'); if (!b) return;
        ORD.tab = b.dataset.tab; paintOrders();
      });
    }
    /* Instant response: skeleton first, on the same tick as the click. */
    if (!ORD.rows) skeleton(p.querySelector('#ord-body'), 5);
    paintSegs();
    if (ORD.rows) paintOrders();

    if (ORD.loading) return;
    ORD.loading = true;
    loadOrders().then(function (r) {
      ORD.loading = false;
      if (r.error) { ORD.rows = null; return paintError(r.error); }
      ORD.rows = r.rows;
      paintSegs(); paintOrders();
      if (r.cached) loadOrders(true).then(function (fresh) {   /* revalidate quietly */
        if (fresh && fresh.rows) { ORD.rows = fresh.rows; paintSegs(); paintOrders(); }
      });
    }).catch(function () { ORD.loading = false; paintError('read-failed'); });
  }

  function skeleton (host, n) {
    if (!host) return;
    var s = '';
    for (var i = 0; i < n; i++) {
      s += '<div class="sk" style="margin-bottom:9px">' +
             '<div class="sk-line" style="width:45%"></div>' +
             '<div class="sk-line" style="width:70%;height:9px"></div>' +
             '<div class="sk-line" style="width:30%;height:9px"></div>' +
           '</div>';
    }
    host.innerHTML = s;
  }

  function ordFiltered () {
    var rows = ORD.rows || [];
    return rows.filter(function (o) {
      /* Same predicates the analytics engine uses — see ST above. */
      if (ORD.tab === 'today' && !isToday(o.when)) return false;
      if (ORD.tab === 'pending' && !ST.pending(o)) return false;
      if (ORD.tab === 'completed' && !ST.completed(o)) return false;
      if (ORD.tab === 'cancelled' && !ST.cancelled(o)) return false;
      if (ORD.q) {
        var hay = (o.ref + ' ' + o.customer + ' ' + o.phone + ' ' + o.id).toLowerCase();
        if (hay.indexOf(ORD.q) < 0) return false;
      }
      return true;
    });
  }

  function paintSegs () {
    var el = document.getElementById('ord-segs'); if (!el) return;
    var rows = ORD.rows;
    el.innerHTML = ORD_TABS.map(function (t) {
      var n = '';
      if (rows) {
        var save = ORD.tab; ORD.tab = t.k;
        var c = ordFiltered().length; ORD.tab = save;
        n = '<span class="n">' + c + '</span>';
      }
      return '<button class="seg' + (ORD.tab === t.k ? ' on' : '') + '" data-tab="' + t.k + '">' +
             esc(t.label) + n + '</button>';
    }).join('');
  }

  function paintOrders () {
    var host = document.getElementById('ord-body'); if (!host) return;
    paintSegs();
    var rows = ordFiltered();
    if (!rows.length) {
      host.innerHTML = '<div class="state"><span class="ico">🧾</span>' +
        '<b>' + (ORD.q ? 'Nothing matches that search' : 'No orders here yet') + '</b>' +
        '<small>' + (ORD.q ? 'Try an order number, customer name or phone.'
                           : 'Orders placed with your shop will appear here as they come in.') +
        '</small></div>';
      return;
    }
    host.innerHTML = '<div class="ord-list">' + rows.map(ordCard).join('') + '</div>';
  }

  function ordCard (o) {
    var payCls = /paid|success|complete/.test(o.payment) ? 'paid'
               : /fail|declin/.test(o.payment) ? 'failed' : 'pending';
    var stCls  = /cancel|refund|failed/.test(o.status) ? 'cancelled'
               : /completed|delivered|fulfilled|done/.test(o.status) ? 'paid' : 'pending';
    return '<button class="ord" data-order="' + esc(o.id) + '">' +
      '<span class="ord-top">' +
        '<span class="ord-id">#' + esc(o.ref) + '</span>' +
        '<span class="ord-amt">' + esc(money(o.total, o.currency)) + '</span>' +
      '</span>' +
      '<span class="ord-sub">' +
        '<span class="who">' + esc(o.customer) + (o.phone ? ' · ' + esc(o.phone) : '') + '</span>' +
        '<span class="when">' + esc(ago(o.when)) + '</span>' +
      '</span>' +
      '<span class="badges">' +
        '<span class="badge ' + stCls + '">' + esc(o.status) + '</span>' +
        '<span class="badge ' + payCls + '">' + esc(o.payment) + (o.method ? ' · ' + esc(o.method) : '') + '</span>' +
        (o.fulfilment ? '<span class="badge">' + esc(o.fulfilment) + '</span>' : '') +
        (o.channel ? '<span class="badge">' + esc(o.channel) + '</span>' : '') +
      '</span>' +
    '</button>';
  }

  /* Honest failure states. None of these invent a figure or a row. */
  function paintError (code) {
    var host = document.getElementById('ord-body'); if (!host) return;
    var body;
    if (code === 'signed-out' || code === 'no-firebase') {
      body = '<b>Not signed in on this device</b><small>Orders are scoped to your seller account, ' +
             'so they load once you are signed in. Nothing is shown rather than showing someone ' +
             'else’s or a placeholder figure.</small>';
    } else if (code === 'permission-denied') {
      body = '<b>This account cannot read these orders</b><small>The request reached the server and ' +
             'was refused by the security rules. That is a permissions result, not an empty shop.</small>';
    } else {
      body = '<b>Orders could not be loaded</b><small>The request failed (<code>' + esc(code) + '</code>). ' +
             'Nothing is guessed here — retry, and if it persists this is a real fault worth reporting.</small>';
    }
    host.innerHTML = '<div class="state"><span class="ico">🔒</span>' + body +
      '<button class="act ghost" data-retry="orders">↻ Try again</button></div>';
  }

  /* ── ORDER DETAIL — an in-shell sheet. The shell never unmounts. ───────────*/
  var sheet, sheetScrim;
  function ensureSheet () {
    if (sheet) return;
    sheetScrim = document.createElement('div');
    sheetScrim.className = 'sheet-scrim';
    sheet = document.createElement('aside');
    sheet.className = 'sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.innerHTML = '<div class="sheet-head"><b id="sheet-t">Order</b>' +
                      '<button class="sheet-x" id="sheet-x" aria-label="Close">✕</button></div>' +
                      '<div class="sheet-body" id="sheet-b"></div>';
    document.body.appendChild(sheetScrim);
    document.body.appendChild(sheet);
    sheetScrim.addEventListener('click', closeSheet);
    sheet.querySelector('#sheet-x').addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  }
  function closeSheet () {
    if (!sheet) return;
    sheet.classList.remove('on'); sheetScrim.classList.remove('on');
  }
  function openOrder (id) {
    var o = (ORD.rows || []).filter(function (x) { return x.id === id; })[0];
    if (!o) return;
    ensureSheet();
    document.getElementById('sheet-t').textContent = '#' + o.ref;
    document.getElementById('sheet-b').innerHTML =
      '<dl class="kv">' +
        row('Customer', o.customer) +
        (o.phone ? row('Phone', o.phone) : '') +
        row('Placed', o.when ? o.when.toLocaleString('en-KE') : '—') +
        row('Status', o.status) +
        row('Payment', o.payment + (o.method ? ' · ' + o.method : '')) +
        (o.fulfilment ? row('Fulfilment', o.fulfilment) : '') +
        (o.channel ? row('Channel', o.channel) : '') +
        row('Total', money(o.total, o.currency)) +
      '</dl>' +
      (o.items.length
        ? '<div class="items">' + o.items.map(function (it) {
            return '<div class="item"><span class="q">' + esc(it.qty || it.quantity || 1) + '×</span>' +
                   '<span class="n">' + esc(it.name || it.title || 'Item') + '</span>' +
                   '<span class="p">' + esc(money((it.price || 0) * (it.qty || it.quantity || 1), o.currency)) + '</span></div>';
          }).join('') + '</div>'
        : '<div class="note" style="margin:0 0 16px">This order record carries no line items.</div>') +
      /* Print and Share sit together at the top of the action bar — the two things a
         merchant reaches for most on an order. Neither is buried under "More". */
      '<div class="sheet-actions">' +
        '<button class="act" data-print-order="' + esc(o.id) + '">🖨 Print</button>' +
        waButton(o) +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="act ghost" data-route="receipts">🧾 Receipts</button>' +
        '<button class="act ghost" data-route="deliveries">🛵 Delivery Hub</button>' +
      '</div>';
    sheet.classList.add('on'); sheetScrim.classList.add('on');
  }
  function row (k, v) { return '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>'; }

  /* ══ WHATSAPP THE BUYER ═══════════════════════════════════════════════════
     One tap beside Print, because chasing a customer about an order is one of the
     most frequent things a merchant does and it should not live under "More".

     THE DATA RULE, and it is the whole risk here: the number comes from the ORDER's
     own buyer contact and nowhere else. Not the merchant's profile, not
     localStorage, not the last customer served, not a guess from a name. Messaging
     the WRONG person about someone's order is a privacy breach, so when the order
     carries no usable number the honest answer is to say so.

     KENYAN NORMALISATION. wa.me needs digits only, in international form.
       0712 345 678   -> 254712345678
       +254 712 345678-> 254712345678
       712345678      -> 254712345678
     A number that does not resolve to a plausible Kenyan mobile returns null and
     the button explains itself rather than opening a chat with nobody. */
  function waPhone (raw) {
    var d = String(raw == null ? '' : raw).replace(/[^0-9+]/g, '');
    if (!d) return null;
    d = d.replace(/^\+/, '');
    if (/^0[17]\d{8}$/.test(d))   d = '254' + d.slice(1);   /* 07xx / 01xx local  */
    else if (/^[17]\d{8}$/.test(d)) d = '254' + d;          /* bare 7xx / 1xx     */
    else if (/^2540[17]\d{8}$/.test(d)) d = '254' + d.slice(4); /* 2540… mistake  */
    /* Only a well-formed Kenyan mobile is accepted. Anything else is not silently
       "fixed" into a number that might belong to someone else. */
    return /^254[17]\d{8}$/.test(d) ? d : null;
  }

  /* The delivery destination is READ, never authored. There is no canonical
     order-destination field yet (docs/DELIVERY_DESTINATION_BLOCKER.md — eight
     spellings, no authority), so this reads what the order already carries and
     includes NOTHING when it carries nothing. A pickup order never gets an
     invented address. */
  function orderDestination (o) {
    if (/pickup/i.test(String(o.fulfilment || ''))) return null;
    var d = o.deliveryAddress || o.dropoffAddress || o.address || '';
    d = String(d).trim();
    return d || null;
  }

  function waMessage (o, shopName) {
    var who = String(o.customer || '').trim();
    var lines = [
      'Hello' + (who && who !== 'Walk-in' ? ' ' + who : '') + ', this is ' + (shopName || 'our shop') +
      ' on SOKONI regarding your order #' + o.ref + '.',
    ];
    var dest = orderDestination(o);
    if (dest) lines.push('', 'Delivery location:', dest);
    lines.push('', 'Order total: ' + money(o.total, o.currency) + '.');
    lines.push('', 'We\'d like to confirm your order.');
    return lines.join('\n');
  }

  /* Rendered as a real ANCHOR, deliberately. The shell forbids window.open and
     target="_blank" — that containment rule is what stops a module throwing the
     merchant out of the app, and it is not something a Share button gets to evade.
     An <a href> the merchant taps is their own navigation, and on a phone wa.me
     hands off to the WhatsApp app while the browser keeps the shell where it was. */
  function waButton (o) {
    var num = waPhone(o.phone);
    if (!num) {
      /* No number is a real answer. Say it on the button itself rather than
         offering an action that cannot work, and never invent a recipient. */
      return '<button class="act ghost" data-wa-none="1" title="No buyer phone on this order">↗ Share</button>';
    }
    var url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(waMessage(o, merchantDisplayName()));
    return '<a class="act" rel="noopener" href="' + esc(url) + '">↗ Share</a>';
  }

  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-order]');
    if (o) { openOrder(o.dataset.order); return; }
    var pay = e.target.closest('[data-payment]');
    if (pay) { openPayment(pay.dataset.payment); return; }
    /* Share with no usable number: explain, never open a chat with nobody. */
    if (e.target.closest('[data-wa-none]')) {
      toast('WhatsApp unavailable — no buyer phone number is attached to this order.');
      return;
    }
    /* Print routes through the shell's OWN device layer, the same connection POS
       uses. No second printer authority. */
    var pr = e.target.closest('[data-print-order]');
    if (pr) {
      var po = (ORD.rows || []).filter(function (x) { return x.id === pr.dataset.printOrder; })[0];
      if (!po) return;
      printerEngine().then(function (eng) {
        if (eng && eng.printReceipt) return eng.printReceipt({ order: po, ref: po.ref, total: po.total, currency: po.currency, items: po.items });
        toast('No printer service is loaded.');
      });
      return;
    }
    var r = e.target.closest('[data-retry]');
    if (r) {
      if (r.dataset.retry === 'payments') { PAY.rows = null; CACHE.payments = null; renderPayments(nativePanel('payments')); }
      else { ORD.rows = null; CACHE.orders = null; renderOrders(nativePanel('orders')); }
    }
  });

  /* ══ ANALYTICS ENGINE ═════════════════════════════════════════════════════
     ONE aggregation over the SAME cached orders Orders renders. Analytics and
     Revenue are two views of this bundle, not two implementations.

     SOURCE COMPLETENESS — stated, not hidden. The only source here is the `orders`
     collection. POS retail sales are NOT included, because `posRetailSales` cannot
     currently be read by any merchant: the live rule authorises `sellerId`/
     `cashierUid`, its sole writer emits `merchantId`/`cashierId`, and the client
     filters on `merchantId`. Every read is denied and the denial is swallowed, so
     silently adding that source would understate revenue while looking complete.
     The surfaces therefore say "online orders only" rather than presenting a total
     they cannot stand behind. When the rules defect is fixed, this engine gains one
     more source and every view updates with it. */
  function aggregate (rows) {
    var a = {
      count: rows.length, revenue: 0, paidRevenue: 0, pendingAmount: 0, cancelledAmount: 0,
      units: 0, aov: 0,
      completed: 0, pending: 0, cancelled: 0, refunded: 0,
      byStatus: {}, byMethod: {}, byChannel: {}, products: {},
      days: {}, hasMethod: false, hasChannel: false,
    };
    rows.forEach(function (o) {
      var live = ST.live(o);
      if (live) a.revenue += o.total; else a.cancelledAmount += o.total;
      if (live && ST.paid(o)) a.paidRevenue += o.total;
      if (live && !ST.paid(o)) a.pendingAmount += o.total;

      if (ST.completed(o)) a.completed++;
      else if (ST.cancelled(o)) a.cancelled++;
      else a.pending++;
      if (ST.refunded(o)) a.refunded++;

      a.byStatus[o.status] = (a.byStatus[o.status] || 0) + 1;
      /* Revenue breakdowns count LIVE orders only — a bucket is created solely when it
         actually carries revenue. Recording a cancelled order's method produced a
         "Card · KES 0" row: a payment category the shop never took money through,
         presented alongside real ones. A zero row here is worse than a missing one. */
      if (live && o.method)  { a.hasMethod = true;  a.byMethod[o.method]   = (a.byMethod[o.method]   || 0) + o.total; }
      if (live && o.channel) { a.hasChannel = true; a.byChannel[o.channel] = (a.byChannel[o.channel] || 0) + o.total; }

      (o.items || []).forEach(function (it) {
        var q = Number(it.qty || it.quantity || 1) || 1;
        if (live) a.units += q;
        var k = it.name || it.title || 'Item';
        var p = a.products[k] || { qty: 0, revenue: 0 };
        p.qty += q; p.revenue += (Number(it.price) || 0) * q;
        a.products[k] = p;
      });

      if (o.when) {
        var key = o.when.getFullYear() + '-' + pad(o.when.getMonth() + 1) + '-' + pad(o.when.getDate());
        var d = a.days[key] || { revenue: 0, orders: 0 };
        d.orders++; if (live) d.revenue += o.total;
        a.days[key] = d;
      }
    });
    /* AOV over orders that actually count as revenue — dividing by cancelled ones too
       would quietly depress it. */
    var billable = a.count - a.cancelled;
    a.aov = billable > 0 ? a.revenue / billable : 0;
    return a;
  }
  function pad (n) { return n < 10 ? '0' + n : '' + n; }

  /* ── RANGE ────────────────────────────────────────────────────────────────*/
  var AN = { view: 'analytics', range: '7d', from: null, to: null };
  var RANGES = [
    { k: 'today', label: 'Today' }, { k: '7d', label: '7 days' },
    { k: '30d', label: '30 days' }, { k: 'custom', label: 'Custom' },
  ];
  function rangeStart () {
    var n = new Date(); n.setHours(0, 0, 0, 0);
    if (AN.range === 'today') return n.getTime();
    if (AN.range === '7d')  return n.getTime() - 6 * 864e5;
    if (AN.range === '30d') return n.getTime() - 29 * 864e5;
    if (AN.range === 'custom' && AN.from) return new Date(AN.from + 'T00:00:00').getTime();
    return 0;
  }
  function rangeEnd () {
    if (AN.range === 'custom' && AN.to) return new Date(AN.to + 'T23:59:59').getTime();
    return Date.now();
  }
  function inRange (rows) {
    var a = rangeStart(), b = rangeEnd();
    return (rows || []).filter(function (o) { return o.ts >= a && o.ts <= b; });
  }
  function rangeDays () {
    if (AN.range === 'today') return 1;
    if (AN.range === '7d') return 7;
    if (AN.range === '30d') return 30;
    return Math.max(1, Math.min(90, Math.round((rangeEnd() - rangeStart()) / 864e5) + 1));
  }

  /* ── ANALYTICS + REVENUE — one renderer, two views ────────────────────────*/
  function renderAnalytics (p, view) {
    AN.view = view;
    if (!p.dataset.built) {
      p.dataset.built = '1';
      p.innerHTML =
        '<div class="toolbar">' +
          '<div class="segs" id="an-segs"></div>' +
          '<div id="an-custom" hidden>' +
            '<input class="search" type="date" id="an-from" aria-label="From">' +
            '<input class="search" type="date" id="an-to" aria-label="To">' +
          '</div>' +
        '</div>' +
        '<div id="an-body"></div>';
      p.querySelector('#an-segs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-range]'); if (!b) return;
        AN.range = b.dataset.range;
        p.querySelector('#an-custom').hidden = AN.range !== 'custom';
        paintAnalytics();
      });
      ['an-from', 'an-to'].forEach(function (id) {
        p.querySelector('#' + id).addEventListener('change', function (e) {
          AN[id === 'an-from' ? 'from' : 'to'] = e.target.value; paintAnalytics();
        });
      });
    }
    if (!ORD.rows) skeleton(p.querySelector('#an-body'), 4);
    paintRangeSegs();
    if (ORD.rows) paintAnalytics();

    if (ORD.loading) return;
    ORD.loading = true;
    loadOrders().then(function (r) {
      ORD.loading = false;
      if (r.error) { return paintAnError(r.error); }
      ORD.rows = r.rows;                       /* the SAME cache Orders uses */
      paintAnalytics();
      if (r.cached) loadOrders(true).then(function (f) {
        if (f && f.rows) { ORD.rows = f.rows; paintAnalytics(); }
      });
    }).catch(function () { ORD.loading = false; paintAnError('read-failed'); });
  }

  function paintRangeSegs () {
    var el = document.getElementById('an-segs'); if (!el) return;
    el.innerHTML = RANGES.map(function (r) {
      return '<button class="seg' + (AN.range === r.k ? ' on' : '') + '" data-range="' + r.k + '">' +
             esc(r.label) + '</button>';
    }).join('');
  }

  function paintAnError (code) {
    var host = document.getElementById('an-body'); if (!host) return;
    host.innerHTML = '<div class="state"><span class="ico">🔒</span>' +
      '<b>' + (code === 'signed-out' ? 'Not signed in on this device' : 'Could not load the data') + '</b>' +
      '<small>' + (code === 'signed-out'
        ? 'These figures are computed from your own orders, so they load once you are signed in. Nothing is estimated in the meantime.'
        : 'The request failed (<code>' + esc(code) + '</code>). No figure is shown rather than a guessed one.') +
      '</small><button class="act ghost" data-retry="orders">↻ Try again</button></div>';
  }

  function paintAnalytics () {
    var host = document.getElementById('an-body'); if (!host) return;
    paintRangeSegs();
    var rows = inRange(ORD.rows);
    var a = aggregate(rows);
    host.innerHTML = (AN.view === 'revenue' ? revenueView(a, rows) : analyticsView(a, rows)) + sourceNote();
  }

  /* The source caveat travels WITH the numbers, not in a footnote nobody reads. */
  function sourceNote () {
    return '<div class="note" style="margin-top:20px"><b>Online order revenue only.</b> ' +
      'These figures come from your <code>orders</code> records. In-shop POS sales are <b>not</b> included: ' +
      'the POS sales collection cannot currently be read by a merchant account (its security rule authorises ' +
      'different fields than the writer records), so including it would understate your totals while looking ' +
      'complete. This surface will pick POS up automatically once that is fixed.</div>';
  }

  function tile (label, value, neutral) {
    return '<div class="stat' + (neutral ? ' neutral' : '') + '"><b>' + esc(value) + '</b>' +
           '<small>' + esc(label) + '</small></div>';
  }

  function analyticsView (a, rows) {
    var empty = !rows.length;
    return '' +
      '<div class="sec-t">Overview · ' + esc(rangeLabel()) + '</div>' +
      '<div class="stats">' +
        tile('Revenue', empty ? '—' : money(a.revenue), empty) +
        tile('Orders', empty ? '—' : a.count, empty) +
        tile('Units sold', empty ? '—' : a.units, empty) +
        tile('Avg order', empty ? '—' : money(a.aov), empty) +
        tile('Pending', empty ? '—' : a.pending, empty) +
        tile('Completed', empty ? '—' : a.completed, empty) +
      '</div>' +
      (empty ? emptyRange() :
        trendBlock(a) +
        breakdown('Order status', a.byStatus, false) +
        (a.hasMethod ? breakdown('Payment method', a.byMethod, true)
                     : missing('Payment method', 'None of these orders record a payment method.')) +
        topProducts(a));
  }

  function revenueView (a, rows) {
    var empty = !rows.length;
    return '' +
      '<div class="sec-t">Revenue · ' + esc(rangeLabel()) + '</div>' +
      '<div class="stats">' +
        tile('Gross revenue', empty ? '—' : money(a.revenue), empty) +
        tile('Paid', empty ? '—' : money(a.paidRevenue), empty) +
        tile('Awaiting payment', empty ? '—' : money(a.pendingAmount), empty) +
        tile('Cancelled / refunded', empty ? '—' : money(a.cancelledAmount), empty) +
        tile('Orders', empty ? '—' : a.count, empty) +
        tile('Avg order', empty ? '—' : money(a.aov), empty) +
      '</div>' +
      (empty ? emptyRange() :
        trendBlock(a) +
        (a.hasChannel ? breakdown('Channel', a.byChannel, true)
                      : missing('Channel', 'None of these orders record a sales channel.')) +
        (a.hasMethod ? breakdown('Payment method', a.byMethod, true)
                     : missing('Payment method', 'None of these orders record a payment method.')) +
        breakdown('Order status', a.byStatus, false));
  }

  function rangeLabel () {
    var r = RANGES.filter(function (x) { return x.k === AN.range; })[0];
    if (AN.range === 'custom') return (AN.from || 'start') + ' → ' + (AN.to || 'today');
    return r ? r.label : '';
  }
  function emptyRange () {
    return '<div class="state"><span class="ico">📊</span><b>No orders in this period</b>' +
           '<small>Nothing is estimated to fill the gap. Widen the range, or check back once orders come in.</small></div>';
  }
  function missing (title, why) {
    return '<div class="sec-t">' + esc(title) + '</div>' +
           '<div class="note" style="margin:0 0 20px">' + esc(why) +
           ' No chart is drawn rather than one implying a single unknown category.</div>';
  }

  /* Inline SVG bars — no chart library, no network, fast on a phone. */
  function trendBlock (a) {
    var days = rangeDays(), start = rangeStart(), out = [], max = 0;
    for (var i = 0; i < days; i++) {
      var d = new Date(start + i * 864e5);
      var k = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      var v = a.days[k] || { revenue: 0, orders: 0 };
      out.push({ d: d, revenue: v.revenue, orders: v.orders });
      if (v.revenue > max) max = v.revenue;
    }
    var w = 100 / out.length;
    var bars = out.map(function (p, i) {
      var h = max > 0 ? Math.max(1.5, (p.revenue / max) * 100) : 1.5;
      return '<div class="bar" style="left:' + (i * w) + '%;width:' + (w * 0.72) + '%;height:' + h + '%" ' +
             'title="' + esc(p.d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' }) +
             ' · ' + money(p.revenue) + ' · ' + p.orders + ' orders') + '"></div>';
    }).join('');
    return '<div class="sec-t">Revenue trend</div>' +
      '<div class="chart"><div class="bars">' + bars + '</div></div>' +
      '<div class="chart-x"><span>' + esc(out[0].d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' })) + '</span>' +
      '<span>' + esc(max > 0 ? 'peak ' + money(max) : 'no revenue in range') + '</span>' +
      '<span>' + esc(out[out.length - 1].d.toLocaleDateString('en-KE', { day: 'numeric', month: 'short' })) + '</span></div>';
  }

  function breakdown (title, obj, isMoney) {
    var keys = Object.keys(obj);
    if (!keys.length) return '';
    var total = keys.reduce(function (s, k) { return s + obj[k]; }, 0) || 1;
    keys.sort(function (x, y) { return obj[y] - obj[x]; });
    return '<div class="sec-t">' + esc(title) + '</div><div class="bd">' +
      keys.map(function (k) {
        var pct = Math.round((obj[k] / total) * 100);
        return '<div class="bd-row"><span class="bd-k">' + esc(k) + '</span>' +
               '<span class="bd-track"><span class="bd-fill" style="width:' + pct + '%"></span></span>' +
               '<span class="bd-v">' + esc(isMoney ? money(obj[k]) : obj[k]) + '</span></div>';
      }).join('') + '</div>';
  }

  function topProducts (a) {
    var keys = Object.keys(a.products);
    if (!keys.length) {
      return missing('Top products', 'These orders carry no line items, so there is nothing to rank.');
    }
    keys.sort(function (x, y) { return a.products[y].revenue - a.products[x].revenue; });
    return '<div class="sec-t">Top products</div><div class="items" style="margin-bottom:20px">' +
      keys.slice(0, 8).map(function (k) {
        var p = a.products[k];
        return '<div class="item"><span class="q">' + esc(p.qty) + '×</span>' +
               '<span class="n">' + esc(k) + '</span>' +
               '<span class="p">' + esc(money(p.revenue)) + '</span></div>';
      }).join('') + '</div>';
  }

  /* ══ PAYMENTS ═════════════════════════════════════════════════════════════
     Same shape as Orders: skeleton -> cache -> fresh, native, in-shell detail. */
  var PAY = { tab: 'all', q: '', rows: null, loading: false };
  var PAY_TABS = [
    { k: 'all',      label: 'All' },
    { k: 'paid',     label: 'Paid' },
    { k: 'pending',  label: 'Pending' },
    { k: 'failed',   label: 'Failed' },
    { k: 'refunded', label: 'Refunded' },
  ];

  function renderPayments (p) {
    if (!p.dataset.built) {
      p.dataset.built = '1';
      p.innerHTML =
        '<div class="toolbar">' +
          '<div class="segs" id="pay-segs"></div>' +
          '<div class="search"><span>🔍</span>' +
            '<input id="pay-q" type="search" placeholder="Search code, phone or order…" autocomplete="off">' +
          '</div>' +
        '</div>' +
        '<div id="pay-body"></div>';
      p.querySelector('#pay-q').addEventListener('input', function (e) {
        PAY.q = e.target.value.trim().toLowerCase(); paintPayments();
      });
      p.querySelector('#pay-segs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-paytab]'); if (!b) return;
        PAY.tab = b.dataset.paytab; paintPayments();
      });
    }
    if (!PAY.rows) skeleton(p.querySelector('#pay-body'), 5);
    paintPaySegs();
    if (PAY.rows) paintPayments();

    if (PAY.loading) return;
    PAY.loading = true;
    loadPayments().then(function (r) {
      PAY.loading = false;
      if (r.error) return paintPayError(r.error);
      PAY.rows = r.rows;
      paintPaySegs(); paintPayments();
      if (r.cached) loadPayments(true).then(function (f) {
        if (f && f.rows) { PAY.rows = f.rows; paintPaySegs(); paintPayments(); }
      });
    }).catch(function () { PAY.loading = false; paintPayError('read-failed'); });
  }

  function payFiltered () {
    return (PAY.rows || []).filter(function (p) {
      if (PAY.tab !== 'all' && !PAYST[PAY.tab](p)) return false;
      if (PAY.q) {
        var hay = (p.ref + ' ' + p.phone + ' ' + (p.orderId || '') + ' ' + p.method + ' ' + p.id).toLowerCase();
        if (hay.indexOf(PAY.q) < 0) return false;
      }
      return true;
    });
  }

  function paintPaySegs () {
    var el = document.getElementById('pay-segs'); if (!el) return;
    el.innerHTML = PAY_TABS.map(function (t) {
      var n = '';
      if (PAY.rows) {
        var save = PAY.tab; PAY.tab = t.k; var c = payFiltered().length; PAY.tab = save;
        n = '<span class="n">' + c + '</span>';
      }
      return '<button class="seg' + (PAY.tab === t.k ? ' on' : '') + '" data-paytab="' + t.k + '">' +
             esc(t.label) + n + '</button>';
    }).join('');
  }

  function paintPayments () {
    var host = document.getElementById('pay-body'); if (!host) return;
    paintPaySegs();
    var all = PAY.rows || [];
    var rows = payFiltered();

    /* Totals are over EVERY payment record, not the current filter — a merchant
       reading "Total amount" expects the ledger total, not the tab's subtotal. */
    var paid = all.filter(PAYST.paid), pend = all.filter(PAYST.pending);
    var fail = all.filter(PAYST.failed), refd = all.filter(PAYST.refunded);
    var sum = function (a) { return a.reduce(function (s, x) { return s + x.amount; }, 0); };
    var byMethod = {};
    paid.forEach(function (p) { if (p.method) byMethod[p.method] = (byMethod[p.method] || 0) + p.amount; });
    var empty = !all.length;

    host.innerHTML =
      '<div class="sec-t">Payments received</div>' +
      '<div class="stats">' +
        tile('Paid', empty ? '—' : money(sum(paid)), empty) +
        tile('Pending', empty ? '—' : money(sum(pend)), empty) +
        tile('Failed', empty ? '—' : money(sum(fail)), empty) +
        tile('Refunded', empty ? '—' : money(sum(refd)), empty) +
        tile('Transactions', empty ? '—' : all.length, empty) +
        tile('Total amount', empty ? '—' : money(sum(all)), empty) +
      '</div>' +
      /* Methods appear ONLY where the record carries one. No "Other" bucket is
         invented to make the chart look whole. */
      (Object.keys(byMethod).length
        ? breakdown('Payment method · received', byMethod, true)
        : (empty ? '' : missing('Payment method',
            'These payment records do not carry a method field.'))) +
      '<div class="sec-t">Transactions</div>' +
      (rows.length
        ? '<div class="ord-list">' + rows.map(payCard).join('') + '</div>'
        : '<div class="state"><span class="ico">💳</span><b>' +
            (PAY.q ? 'Nothing matches that search'
                   : empty ? 'No payments recorded yet' : 'Nothing in this tab') + '</b>' +
          '<small>' + (PAY.q ? 'Try an M-Pesa code, phone number or order id.'
                             : 'Payments confirmed for your shop appear here as they settle.') +
          '</small></div>') +
      paySourceNote();
  }

  function payCard (p) {
    var cls = PAYST.paid(p) ? 'paid' : PAYST.failed(p) ? 'failed'
            : PAYST.refunded(p) ? 'cancelled' : 'pending';
    return '<button class="ord" data-payment="' + esc(p.id) + '">' +
      '<span class="ord-top">' +
        '<span class="ord-id">' + esc(p.ref) + '</span>' +
        '<span class="ord-amt">' + esc(money(p.amount, p.currency)) + '</span>' +
      '</span>' +
      '<span class="ord-sub">' +
        '<span class="who">' + esc(p.method || 'Unspecified method') +
          (p.phone ? ' · ' + esc(p.phone) : '') + '</span>' +
        '<span class="when">' + esc(ago(p.when)) + '</span>' +
      '</span>' +
      '<span class="badges">' +
        '<span class="badge ' + cls + '">' + esc(p.status) + '</span>' +
        (p.orderId ? '<span class="badge">order ' + esc(String(p.orderId).slice(0, 12)) + '</span>' : '') +
        (p.hub ? '<span class="badge">' + esc(p.hub) + '</span>' : '') +
      '</span>' +
    '</button>';
  }

  /* The scope of this ledger, attached to it — same principle as the revenue note. */
  function paySourceNote () {
    return '<div class="note" style="margin-top:20px"><b>These are your confirmed payment records.</b> ' +
      'They come from <code>sellerPayments</code>, the only payment collection scoped to a seller. ' +
      'Two things are deliberately <b>not</b> merged in: the buyer-side <code>payments</code> ledger, ' +
      'which a merchant account is not authorised to read at all, and in-shop POS sales, which remain ' +
      'unreadable because of the field mismatch noted on Revenue. The payment status shown on an ' +
      'individual order is a separate record from these transactions.</div>';
  }

  function paintPayError (code) {
    var host = document.getElementById('pay-body'); if (!host) return;
    host.innerHTML = '<div class="state"><span class="ico">🔒</span><b>' +
      (code === 'signed-out' ? 'Not signed in on this device'
       : code === 'permission-denied' ? 'This account cannot read these payments'
       : 'Payments could not be loaded') + '</b><small>' +
      (code === 'signed-out'
        ? 'Payment records are scoped to your seller account and load once you are signed in.'
        : code === 'permission-denied'
        ? 'The request reached the server and was refused by the security rules — a permissions result, not an empty ledger.'
        : 'The request failed (<code>' + esc(code) + '</code>). Nothing is estimated in its place.') +
      '</small><button class="act ghost" data-retry="payments">↻ Try again</button></div>';
  }

  function openPayment (id) {
    var p = (PAY.rows || []).filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    ensureSheet();
    document.getElementById('sheet-t').textContent = p.ref;
    document.getElementById('sheet-b').innerHTML =
      '<dl class="kv">' +
        row('Amount', money(p.amount, p.currency)) +
        row('Status', p.status) +
        row('Method', p.method || 'Unspecified') +
        (p.phone ? row('Phone', p.phone) : '') +
        (p.ref ? row('Reference', p.ref) : '') +
        (p.orderId ? row('Order', p.orderId) : '') +
        (p.hub ? row('Hub', p.hub) : '') +
        row('Received', p.when ? p.when.toLocaleString('en-KE') : '—') +
        (p.description ? row('Note', p.description) : '') +
      '</dl>' +
      (p.orderId
        ? '<div class="sheet-actions"><button class="act ghost" data-route="orders">🧾 Open Orders</button></div>'
        : '<div class="note" style="margin:0">This payment is not linked to an order record.</div>');
    sheet.classList.add('on'); sheetScrim.classList.add('on');
  }

  /* ══ DEVICES ══════════════════════════════════════════════════════════════
     A control centre over the registry the SHELL already owns — not a status page,
     and not another discovery implementation. */
  function renderDevices (p) {
    var d = DEV.printer;
    var bt = !!(navigator.bluetooth);
    var silent = !!(navigator.bluetooth && navigator.bluetooth.getDevices);
    var saved = d.saved;

    var stateLabel = { connected: 'Connected', connecting: 'Connecting…', saved: 'Saved · not connected',
                       unsupported: 'Not supported by this browser', unknown: 'No printer saved' }[d.state] || d.state;
    var dotCls = d.state === 'connected' ? 'ok' : d.state === 'connecting' ? 'warn' : '';

    p.innerHTML =
      '<div class="sec-t">Receipt printer</div>' +
      '<div class="dev">' +
        '<div class="dev-head">' +
          '<span class="dev-ico">🖨️</span>' +
          '<span class="dev-id"><b>' + esc(saved ? (saved.name || 'Saved printer') : 'No printer saved') + '</b>' +
            '<small><span class="dot ' + dotCls + '"></span>' + esc(stateLabel) + '</small></span>' +
        '</span></div>' +
        '<dl class="kv" style="margin:14px 0 0">' +
          row('Type', saved ? (saved.type || 'printer') : '—') +
          row('Last saved', saved && saved.at ? new Date(saved.at).toLocaleString('en-KE') : '—') +
          row('Silent reconnect', silent ? 'Supported — no pairing prompt needed'
                                         : 'Not supported by this browser') +
          row('Bluetooth', bt ? 'Available' : 'Unavailable in this browser') +
        '</dl>' +
        '<div class="sheet-actions" style="margin-top:14px">' +
          (d.state === 'connected'
            ? '<button class="act ghost" data-dev="disconnect">⏹ Disconnect</button>' +
              '<button class="act" data-dev="test">🧾 Test print</button>'
            : '<button class="act" data-dev="connect">' + (saved ? '↻ Reconnect' : '＋ Connect a printer') + '</button>') +
          (saved ? '<button class="act ghost" data-dev="forget">🗑 Forget device</button>' : '') +
        '</div>' +
      '</div>' +
      (!bt ? '<div class="note" style="margin-top:14px"><b>This browser cannot reach Bluetooth printers.</b> ' +
             'Web Bluetooth is unavailable here (Safari and iOS do not implement it). The saved device is kept, ' +
             'and will reconnect on a browser that supports it — nothing is lost.</div>' : '') +
      '<div class="sec-t" style="margin-top:22px">Other devices</div>' +
      (DEV.list.filter(function (x) { return x.type !== 'printer'; }).length
        ? '<div class="items">' + DEV.list.filter(function (x) { return x.type !== 'printer'; }).map(function (x) {
            return '<div class="item"><span class="q">' + esc(x.type) + '</span>' +
                   '<span class="n">' + esc(x.name || x.id) + '</span>' +
                   '<span class="p">' + esc(x.at ? ago(new Date(x.at)) : '') + '</span></div>';
          }).join('') + '</div>'
        : '<div class="note" style="margin:0">No other devices are registered on this browser profile.</div>') +
      '<div class="note" style="margin-top:20px"><b>The connection stays alive across the whole workspace.</b> ' +
      'The shell owns this connection, not the screen you happen to be on, so moving Devices → POS → Orders → ' +
      'Analytics keeps the printer connected. In the old multi-page merchant every navigation dropped it and ' +
      'POS had to pair again.</div>' +
      '<div class="note" style="margin-top:12px">Devices are remembered per signed-in account on this browser, ' +
      'so a shared till never shows the previous merchant’s hardware.</div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-dev]'); if (!b) return;
    var act = b.dataset.dev;
    if (act === 'forget') {
      DEV.list = DEV.list.filter(function (x) { return x.type !== 'printer'; });
      try { localStorage.setItem(devKey(), JSON.stringify(DEV.list)); } catch (_) {}
      DEV.printer = { state: 'unknown', name: null, saved: null };
      emit('devices'); paintStatus(); renderDevices(nativePanel('devices')); return;
    }
    if (act === 'connect') { deviceConnect(b); return; }
    if (act === 'disconnect') { deviceDisconnect(b); return; }
    if (act === 'test') { deviceTest(b); return; }
  });

  function busy (btn, txt) { btn.disabled = true; btn.dataset.old = btn.textContent; btn.textContent = txt; }
  function done (btn) { btn.disabled = false; if (btn.dataset.old) btn.textContent = btn.dataset.old; }

  async function deviceConnect (btn) {
    busy(btn, 'Connecting…');
    DEV.printer.state = 'connecting'; paintStatus();
    var eng = await printerEngine();
    if (!eng) { DEV.printer.state = DEV.printer.saved ? 'saved' : 'unknown'; done(btn); paintStatus();
                return toast('The printer service could not be loaded.'); }
    try {
      /* A SAVED device reconnects silently — no chooser. Only a first-time pairing
         opens the browser prompt, and that needs the user gesture we are inside. */
      var ok = DEV.printer.saved && eng.autoReconnect ? await eng.autoReconnect() : false;
      if (!ok && eng.connect) ok = await eng.connect();
      DEV.printer.state = ok ? 'connected' : (DEV.printer.saved ? 'saved' : 'unknown');
      if (ok) {
        DEV.printer.name = DEV.printer.name || 'Printer';
        saveDevice({ type: 'printer', id: DEV.printer.name, name: DEV.printer.name, at: Date.now() });
      } else { toast('No printer connected.'); }
    } catch (e) { DEV.printer.state = DEV.printer.saved ? 'saved' : 'unknown'; toast('Could not connect: ' + (e.message || e)); }
    done(btn); paintStatus(); broadcastDevices(); renderDevices(nativePanel('devices'));
  }
  async function deviceDisconnect (btn) {
    busy(btn, 'Disconnecting…');
    var eng = await printerEngine();
    try { if (eng && eng.disconnect) await eng.disconnect(); } catch (_) {}
    DEV.printer.state = DEV.printer.saved ? 'saved' : 'unknown';
    done(btn); paintStatus(); broadcastDevices(); renderDevices(nativePanel('devices'));
  }
  async function deviceTest (btn) {
    busy(btn, 'Printing…');
    var eng = await printerEngine();
    try {
      if (eng && eng.testPrint) await eng.testPrint();
      else if (eng && eng.printTest) await eng.printTest();
      else toast('This printer service exposes no test-print method.');
    } catch (e) { toast('Test print failed: ' + (e.message || e)); }
    done(btn);
  }
  function toast (msg) {
    var t = document.getElementById('sk-toast');
    if (!t) { t = document.createElement('div'); t.id = 'sk-toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._x); t._x = setTimeout(function () { t.classList.remove('on'); }, 3600);
  }

  /* ══ AVAILABILITY ═════════════════════════════════════════════════════════
     TRACED BEFORE BUILT, and the trace changed what this screen can be.

       Authority: shops/{sellerUid} { acceptingOrders, online, delivery, pickup },
       ABSENT = available. Enforced server-side at checkout by
       functions/availability-enforce.js -> reason 'shop-closed'.

       Can a merchant TOGGLE it?  No — twice over:
         · the live rule limits an owner's shops/{uid} update to an allowlist of 28
           fields (hasOnly([...])), and acceptingOrders / online / delivery / pickup
           are NOT in it. A client write is refused.
         · the callable that would do it server-side, setLiveStatus, is defined in
           functions/availability.js but never re-exported in functions/index.js and
           has no dispatcher — so it is not deployed.

     A switch here would therefore fail every time. It is not built. What IS writable
     is `hours`/`openingHours`, which the allowlist does permit, so the schedule is a
     real editor. */
  function renderAvailability (p) {
    if (S.state !== 'in') {
      p.innerHTML = '<div class="state"><span class="ico">🔒</span><b>Not signed in on this device</b>' +
        '<small>Your shop’s availability loads once you are signed in.</small></div>';
      return;
    }
    var shop = S.shop || {};
    var accepting = shop.acceptingOrders !== false;   /* absent = open, per the enforcer */
    p.innerHTML =
      '<div class="sec-t">Current status</div>' +
      '<div class="dev"><div class="dev-head">' +
        '<span class="dev-ico">' + (accepting ? '🟢' : '🔴') + '</span>' +
        '<span class="dev-id"><b>' + (accepting ? 'Accepting orders' : 'Not accepting orders') + '</b>' +
        '<small>' + (accepting
          ? 'Customers can place orders with your shop.'
          : 'Checkout refuses new orders with “shop-closed”.') + '</small></span>' +
      '</div>' +
      '<dl class="kv" style="margin:14px 0 0">' +
        row('Accepting orders', accepting ? 'Yes' : 'No') +
        row('Online', shop.online === false ? 'Off' : 'On') +
        row('Delivery', shop.delivery === false ? 'Off' : 'On') +
        row('Pickup', shop.pickup === false ? 'Off' : 'On') +
      '</dl></div>' +
      '<div class="note" style="margin-top:14px"><b>This status is read-only from here, and that is a platform ' +
      'limitation rather than a design choice.</b> The open/closed flag lives on your shop record, but the ' +
      'security rules do not let a shop owner change that particular field from the app, and the server function ' +
      'that would change it (<code>setLiveStatus</code>) is not currently deployed. Rather than show a switch ' +
      'that silently fails, the state is shown as it is. This is on the release list to fix.</div>' +
      '<div class="sec-t" style="margin-top:22px">Opening hours</div>' +
      '<div class="note" style="margin:0 0 12px">Hours <b>are</b> editable — they are on the permitted list for a ' +
      'shop owner. They describe your shop to customers; they do not open or close checkout by themselves.</div>' +
      '<div class="dev">' +
        '<textarea id="av-hours" class="ta" rows="6" placeholder="e.g. Mon–Sat 8:00–18:00, Sun closed">' +
        esc(shop.openingHours || shop.hours || '') + '</textarea>' +
        '<div class="sheet-actions" style="margin-top:12px">' +
          '<button class="act" data-av="save">💾 Save hours</button>' +
        '</div>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-av]'); if (!b) return;
    saveHours(b);
  });
  async function saveHours (btn) {
    var ta = document.getElementById('av-hours'); if (!ta) return;
    busy(btn, 'Saving…');
    try {
      var f = await firestore();
      /* Only allowlisted keys are sent. Anything else would be refused wholesale —
         the rule uses hasOnly(), so ONE stray field fails the entire write. */
      await f.m.updateDoc(f.m.doc(f.db, 'shops', S.uid), {
        openingHours: ta.value, hours: ta.value, updatedAt: new Date(),
      });
      if (S.shop) { S.shop.openingHours = ta.value; S.shop.hours = ta.value; }
      toast('Opening hours saved.');
    } catch (e) {
      toast(e && e.code === 'permission-denied'
        ? 'The server refused that change.'
        : 'Could not save: ' + ((e && e.code) || e.message || 'unknown'));
    }
    done(btn);
  }

  /* ══ SETTINGS ═════════════════════════════════════════════════════════════
     A hub of real sections. A section is listed ONLY where the underlying capability
     exists; where it does not, it says so plainly instead of offering a control that
     does not persist. */
  function renderSettings (p) {
    var shop = S.shop || {};
    var signedIn = S.state === 'in';
    p.innerHTML =
      '<div class="sec-t">Shop</div>' +
      '<div class="setgrid">' +
        setCard('🏪', 'Business profile', 'Name, contact, address, socials, policies', 'profile', signedIn) +
        setCard('🟢', 'Availability', 'Opening hours and current order status', 'route:availability', true) +
        setCard('🖨️', 'Devices', 'Printer and saved hardware', 'route:devices', true) +
        setCard('💳', 'Payments', 'Your confirmed payment records', 'route:payments', true) +
        setCard('🛵', 'Delivery', 'Methods, times and zones', 'profile', signedIn) +
        setCard('📄', 'Plan', 'Subscription and billing', 'route:plan', true) +
      '</div>' +
      '<div class="sec-t" style="margin-top:22px">Account</div>' +
      '<dl class="kv">' +
        row('Signed in as', signedIn ? (S.email || S.uid) : 'Not signed in') +
        row('Seller id', signedIn ? S.uid : '—') +
        row('Active shop', S.activeShopId || '—') +
        row('Shop name', shop.name || shop.storeName || '—') +
      '</dl>' +
      (signedIn ? '<div class="sheet-actions"><button class="act ghost" data-set="signout">↩ Sign out</button></div>' : '') +
      '<div class="sec-t" style="margin-top:22px">Not built yet</div>' +
      '<div class="note" style="margin:0">Notifications and security settings (session management, two-factor) ' +
      'are <b>not</b> offered here. The underlying controls do not exist yet, and a switch that does not persist ' +
      'is worse than an honest gap.</div>';
  }
  function setCard (ico, title, sub, action, enabled) {
    return '<button class="setcard" data-set="' + esc(action) + '"' + (enabled ? '' : ' disabled') + '>' +
      '<span class="sc-ico">' + ico + '</span>' +
      '<span class="sc-t"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span>' +
      '<span class="sc-go">›</span></button>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set]'); if (!b) return;
    var a = b.dataset.set;
    if (a.indexOf('route:') === 0) return go(a.slice(6));
    if (a === 'signout') return doSignOut();
    if (a === 'profile') return toast('The shop profile editor is not built yet — Availability covers hours today.');
  });
  async function doSignOut () {
    try {
      var m = await sdk();
      await m.auth.signOut(m.authI);
      try { localStorage.removeItem('loggedIn'); } catch (_) {}
      /* Sign-out has COMPLETED — only now may the shell leave, and only through the
         contract's declared exit. The destination lives in the route, not here. */
      leaveShell('signout', true);
    } catch (e) { toast('Could not sign out: ' + ((e && e.code) || 'unknown')); }
  }

  /* ══ COMMAND PALETTE ══════════════════════════════════════════════════════
     Built ON the registry and ON go(). There is no second navigation table to drift
     from the sidebar: sidebar, bottom nav, palette and header all call the same
     resolver, so a route added to the contract appears in all four at once. */
  var PAL = { open: false, q: '', sel: 0, items: [] };
  function palItems () {
    var out = CONTRACT.ROUTES.filter(function (r) { return r.kind !== 'exit'; }).map(function (r) {
      return { label: 'Go to ' + (r.name || r.id), icon: r.icon || '•', route: r.id };
    });
    var exit = CONTRACT.ROUTES.filter(function (r) { return r.kind === 'exit'; })[0];
    if (exit) out.push({ label: 'Leave for ' + (exit.name || 'the marketplace'), icon: '←', route: exit.id });
    return out;
  }
  function openPalette () {
    ensurePalette();
    PAL.open = true; PAL.q = ''; PAL.sel = 0;
    document.getElementById('pal-i').value = '';
    paintPalette();
    document.getElementById('pal-wrap').classList.add('on');
    setTimeout(function () { document.getElementById('pal-i').focus(); }, 30);
  }
  function closePalette () { PAL.open = false; var w = document.getElementById('pal-wrap'); if (w) w.classList.remove('on'); }
  function ensurePalette () {
    if (document.getElementById('pal-wrap')) return;
    var w = document.createElement('div');
    w.id = 'pal-wrap'; w.className = 'pal-wrap';
    w.innerHTML = '<div class="pal">' +
      '<div class="pal-in"><span>🔍</span><input id="pal-i" placeholder="Search Merchant…" autocomplete="off"></div>' +
      '<div class="pal-list" id="pal-l"></div>' +
      '<div class="pal-foot">↑↓ to move · ↵ to open · Esc to close</div></div>';
    document.body.appendChild(w);
    w.addEventListener('click', function (e) { if (e.target === w) closePalette(); });
    var input = w.querySelector('#pal-i');
    input.addEventListener('input', function (e) { PAL.q = e.target.value.toLowerCase(); PAL.sel = 0; paintPalette(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.sel + 1, PAL.items.length - 1); paintPalette(); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); PAL.sel = Math.max(PAL.sel - 1, 0); paintPalette(); }
      if (e.key === 'Enter')     { e.preventDefault(); runPalette(PAL.sel); }
      if (e.key === 'Escape')    { closePalette(); }
    });
    w.querySelector('#pal-l').addEventListener('click', function (e) {
      var r = e.target.closest('[data-pal]'); if (r) runPalette(+r.dataset.pal);
    });
  }
  function paintPalette () {
    PAL.items = palItems().filter(function (i) { return !PAL.q || i.label.toLowerCase().indexOf(PAL.q) >= 0; });
    var l = document.getElementById('pal-l');
    l.innerHTML = PAL.items.length
      ? PAL.items.map(function (i, n) {
          return '<button class="pal-row' + (n === PAL.sel ? ' on' : '') + '" data-pal="' + n + '">' +
                 '<span class="pal-ico">' + i.icon + '</span><span>' + esc(i.label) + '</span></button>';
        }).join('')
      : '<div class="pal-empty">Nothing matches “' + esc(PAL.q) + '”.</div>';
  }
  function runPalette (n) {
    var i = PAL.items[n]; if (!i) return;
    closePalette();
    go(i.route);          /* the SAME controller the sidebar uses */
  }
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); PAL.open ? closePalette() : openPalette(); }
  });
  document.getElementById('search-btn').addEventListener('click', openPalette);

  function esc (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── BOOT ─────────────────────────────────────────────────────────────────*/
  buildSidebar();
  buildBottomNav();
  loadDevices();
  paintStatus();

  /* Session resolves in the background — the chrome is already interactive. When it
     lands, re-key the device registry to the real uid (devices are stored per account)
     and silently reconnect a saved printer. */
  initSession();
  /* ── A PANEL RENDERED BEFORE AUTH RESOLVED MUST BE RE-RENDERED ───────────
     `emit('session')` was fired in four places and NOTHING subscribed to
     re-render the visible surface. So a native panel opened while the session
     was still resolving kept the scope it mounted with — which is why Sell said
     "sign in to open the till" to a merchant who was signed in, and kept saying
     it after auth arrived.

     renderModule() already does the right thing: it compares _scopeKey(_scope())
     against the mounted key and remounts when the shop changes. It simply was
     never called a second time. This calls it.

     Cheap and idempotent: when the key is unchanged renderModule refreshes in
     place rather than remounting, so a settled session does not churn the
     surface the merchant is using. */
  _listeners.session.push(function () {
    try {
      if (!current) return;
      var m = byId[current];
      if (!m || m.kind !== 'native') return;
      renderNative(current);
    } catch (_) {}
  });

  _listeners.session.push(function () {
    loadDevices(); paintStatus(); broadcastSession();
    if (S.state === 'in') autoConnectPrinter();
    /* A surface rendered while auth was still resolving must refresh once it lands,
       or a signed-in merchant keeps staring at "not signed in". */
    if (current === 'orders' && S.state === 'in') { ORD.rows = null; renderOrders(nativePanel('orders')); }
    /* Same reason for the Dashboard: it is the FIRST surface a merchant sees, so it is
       routinely painted before shops/{uid} has resolved. Without this the greeting would
       stay permanently nameless for the whole session even once the name is known. */
    if (current === 'dashboard' && S.state === 'in') renderDashboard(nativePanel('dashboard'));
  });

  /* Public surface for modules and for the certification harness. */
  window.SokoniShell.session = S;
  window.SokoniShell.devices = DEV;
  window.SokoniShell.ready = _ready;
  window.SokoniShell.on = function (evt, fn) { (_listeners[evt] || (_listeners[evt] = [])).push(fn); };
  Object.defineProperty(window.SokoniShell, 'activeShopId', { get: function () { return S.activeShopId; } });

  window.addEventListener('hashchange', function () {
    var id = CONTRACT.resolve(location.hash.replace('#', ''));
    if (id && id !== current) go(id);
  });

  var boot = CONTRACT.resolve(location.hash.replace('#', '')) || 'dashboard';
  /* Never boot straight into the exit: a stale "#home" would bounce the merchant out
     of the application before it had finished opening. */
  if ((byId[boot] || {}).kind === 'exit') boot = 'dashboard';
  go(boot);
})();
</script>
<!-- Self-update. A page that loads neither shared-header.js nor sw-register.js serves
     STALE content after every deploy — the merchant keeps the build they first opened
     and never sees a fix. merchant.html has carried /sw-register.js for exactly this
     reason; this shell shipped without it, which a production smoke test caught before
     the cutover rather than after. shared-header.js is deliberately NOT used here: it
     injects a marketplace header this shell replaces with its own chrome. -->
<script src="/sw-register.js" defer></script>
</body>
</html>
