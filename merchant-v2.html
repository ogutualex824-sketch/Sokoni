<!doctype html>
<!-- ══════════════════════════════════════════════════════════════════════════════
     SOKONI MERCHANT — shell v2

     A NEW shell, not a new application. The chrome (header, sidebar, bottom nav,
     content host, layout) is rebuilt from scratch phone-first; everything that
     actually does the work is reused unchanged:

       sokoni-merchant-routes.js   the route contract — 32 routes, still the single
                                   authority. Sidebar and bottom nav are PROJECTIONS
                                   of it, so a button can never drift from a route.
       existing modules            Products / POS / Orders / Plan / MiniShop … mount
                                   exactly as before (iframe for page|seller|pos).

     WHAT v1 GOT WRONG, and what this file does instead — all four measured in a
     browser at 390x844 and 1440x900 before this was written:

       1. Sidebar clipped a row. A flex column with no `min-height:0` cannot shrink,
          so its scroll container overflowed instead of scrolling. Fixed with an
          explicit `min-height:0` + `overflow-y:auto` on the scrolling region.
       2. The MOBILE bottom nav rendered on DESKTOP, duplicating the sidebar. It is
          now inside `@media (max-width: 899px)` and cannot appear beside a sidebar.
       3. The stat row overflowed the phone viewport — the third card was sliced off.
          Fixed cards are gone; the grid is `auto-fit`/`minmax` and wraps.
       4. A large dead area under Quick Actions. The content host is now a normal
          document flow with bounded max-width, so short content sits at the top
          rather than being stretched by a full-height grid row.

     Phone-first by decision: the sidebar is an off-canvas drawer below 900px and a
     fixed rail at or above it. No layout is written desktop-first and then undone.
     ══════════════════════════════════════════════════════════════════════════════ -->
<html lang="en" data-require-auth="true">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the safe-area insets below actually resolve on a notched
     iPhone; without it env(safe-area-inset-*) is always 0. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>SOKONI Merchant</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#050505;
  --surface:#0d0d0d;
  --surface-2:#141414;
  --line:rgba(255,255,255,.09);
  --txt:#f4f4f4;
  --txt2:#a8a8a8;
  --txt3:#6d6d6d;
  --acc:#71ff00;
  --acc-dim:rgba(113,255,0,.12);
  --acc-line:rgba(113,255,0,.32);
  --danger:#ff5252;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --header-h:56px;
  --bnav-h:60px;
  --rail-w:232px;
  --rail-collapsed:64px;   /* icon-only rail — matches v1 */
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Never let a module or a wide table scroll the whole application sideways.
     Wide content scrolls inside its own container instead. */
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;   /* dvh so the mobile URL bar cannot crop the bottom nav */
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ── APP FRAME ───────────────────────────────────────────────────────────────
   Phone: one column, header fixed on top, bottom nav fixed underneath.
   Desktop (>=900px): a two-column grid, sidebar rail + content. */
.app{
  min-height:100vh;min-height:100dvh;
  padding-top:calc(var(--header-h) + var(--safe-top));
  padding-bottom:calc(var(--bnav-h) + var(--safe-bot));
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}

/* ── HEADER ──────────────────────────────────────────────────────────────────*/
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(var(--header-h) + var(--safe-top));
  padding:var(--safe-top) 12px 0;
  display:flex;align-items:center;gap:10px;
  background:rgba(5,5,5,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hdr-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--surface);font-size:16px;
}
.hdr-btn:active{transform:scale(.94)}
.hdr-title{
  font-size:16px;font-weight:800;letter-spacing:-.01em;
  /* The title is the flexible element: it truncates so the actions never get
     pushed off-screen on a narrow phone. */
  flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdr-shop{
  display:none;align-items:center;gap:8px;height:38px;padding:0 12px;
  border-radius:11px;background:var(--acc-dim);border:1px solid var(--acc-line);
  color:var(--acc);font-size:12.5px;font-weight:800;max-width:190px;
}
.hdr-shop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:560px){ .hdr-shop{display:flex} }

/* HEADER PRINTER CHIP — the shell owns the printer, so its state is global and
   belongs in the top bar. Hidden on the narrowest phones where the title and the
   two icon buttons already fill the row; the sidebar chip still carries it there. */
.hdr-chip{
  display:none;align-items:center;gap:6px;height:38px;padding:0 11px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:700;color:var(--txt2);white-space:nowrap;
}
@media (min-width:420px){ .hdr-chip{display:flex} }

/* ── SIDEBAR ─────────────────────────────────────────────────────────────────
   Phone: off-canvas drawer. Desktop: static rail. ONE markup tree either way. */
.side{
  position:fixed;top:0;bottom:0;left:0;z-index:60;
  width:min(84vw,var(--rail-w));
  background:var(--surface);border-right:1px solid var(--line);
  transform:translateX(-100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  /* THE FIX for v1's clipped row: a flex column whose scrolling child is allowed to
     shrink. Without min-height:0 the child refuses to shrink below its content and
     the overflow is clipped by the parent instead of scrolled. */
  display:flex;flex-direction:column;min-height:0;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bot);
}
.side.open{transform:translateX(0)}
/* BRAND — the real SOKONI mark, and the entry point to the shop/branch switcher.
   A button, not a div: it is the same control v1 exposes as "Switch shop / branch". */
.side-head{
  flex:0 0 auto;width:100%;display:flex;align-items:center;gap:10px;
  padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;
}
.side-head:hover{background:rgba(255,255,255,.04)}
.side-logo{
  width:36px;height:36px;border-radius:10px;flex:0 0 auto;object-fit:contain;
  background:var(--acc-dim);border:1px solid var(--acc-line);padding:3px;
  transition:width .18s,height .18s;
}
.side-shop{min-width:0;flex:1 1 auto;transition:opacity .18s}
.side-shop b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-shop small{display:block;font-size:11px;color:var(--txt3)}
.side-caret{flex:0 0 auto;color:var(--txt3);font-size:11px;transition:opacity .18s}

/* STATUS CHIPS — printer / sync / identity. Live state, never decorative:
   the dot colour is driven by paintStatus() below, so a dead printer reads as dead. */
.side-status{
  flex:0 0 auto;border-top:1px solid var(--line);
  padding:10px 14px;display:flex;flex-direction:column;gap:8px;
}
.chip{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
.dot.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.dot.bad{background:var(--danger)}
.dot.warn{background:#ffb400;box-shadow:0 0 7px rgba(255,180,0,.7)}
.chip .ctxt{min-width:0;overflow:hidden;text-overflow:ellipsis;transition:opacity .18s}

/* The scrolling region. min-height:0 is what makes it scroll instead of clip. */
.side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 4px}
.side-group{margin:10px 6px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.nav-item{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:10px 11px;border-radius:11px;margin-bottom:2px;
  font-size:14px;font-weight:600;color:var(--txt2);text-align:left;
}
.nav-item .ico{flex:0 0 auto;width:20px;text-align:center;font-size:15px}
.nav-item .lbl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.nav-item.on{background:var(--acc-dim);color:var(--acc);border:1px solid var(--acc-line);padding:9px 10px}

/* The exit sits in the footer so it can never be mistaken for an in-shell route. */
.side-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px}
.side-foot .nav-item{color:var(--txt3)}
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.on{opacity:1;pointer-events:auto}

/* ── CONTENT ─────────────────────────────────────────────────────────────────*/
.main{ padding:14px 14px 24px; max-width:1180px; }
.panel{display:none}
.panel.show{display:block}

/* A NATIVE module that hosts its own scroller needs a definite height for the
   same reason .frame-wrap below does. Without one, `.panel.show` is display:block
   with auto height, so a module's `height:100%` resolves against an auto-height
   ancestor and becomes auto: the module's column grows to its content, its
   internal `overflow-y:auto` body never engages, the whole document scrolls
   instead, and anything the module pins to its own bottom edge — the Quick Sell
   charge bar — ends up below the fold.

   Measured before this rule, at 390x844 AND 412x915: .msl was 2282px tall against
   an 844px viewport, bodyScrollable=false, docScrolls=true, and the charge bar sat
   at y=2908 — about 2000px past the fold. That is the "hunt for Charge after
   scrolling" report, and it is why the module certified green in isolation: a
   height-constrained test host recreates the fix and hides the defect.

   Scoped to hosts that opt in, so panels which legitimately scroll with the page
   are untouched. */
/* The panel ITSELF is the host: renderModule() mounts a module straight into
   #panel-<id>, so there is no inner wrapper to size. An earlier version of this
   rule targeted `.panel.show > #native-sell` — an element the shell never
   creates — so it matched nothing in production while a test harness that built
   that wrapper itself passed. The class is added by renderModule, so only module
   surfaces are constrained and panels that legitimately scroll with the page are
   untouched. */
.panel.show.panel-scroll{
  display:flex; flex-direction:column;
  height:calc(100vh - var(--header-h) - var(--safe-top) - var(--bnav-h) - var(--safe-bot));
  height:calc(100dvh - var(--header-h) - var(--safe-top) - var(--bnav-h) - var(--safe-bot));
  min-height:0;
}
/* An iframe module fills the viewport minus the chrome. It is the ONLY thing that
   gets a fixed height, because it hosts its own scrolling document. */
.frame-wrap{
  position:relative;
  height:calc(100vh - var(--header-h) - var(--safe-top) - var(--bnav-h) - var(--safe-bot));
  height:calc(100dvh - var(--header-h) - var(--safe-top) - var(--bnav-h) - var(--safe-bot));
  margin:-14px -14px -24px;
}
.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.frame-load{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--txt3);font-size:13px;background:var(--bg);
}
.frame-wrap.loaded .frame-load{display:none}

/* ── DASHBOARD ───────────────────────────────────────────────────────────────*/
.greet{margin:2px 2px 18px}
.greet b{display:block;font-size:21px;font-weight:900;letter-spacing:-.015em}
.greet small{display:block;font-size:12.5px;color:var(--txt2);margin-top:4px}
.sec-t{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);margin:0 2px 10px}

/* THE FIX for v1's phone overflow: auto-fit + minmax means cards WRAP to the next
   row instead of running off the right edge. No fixed widths anywhere. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.stat{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 13px 12px;
}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);opacity:.5}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--acc);letter-spacing:-.02em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-top:5px}
/* A neutral figure is NOT an accent figure — an unknown must never look like a
   result (CLAUDE.md, UI Data Integrity). */
.stat.neutral b{color:var(--txt3)}
.stat.neutral::before{background:var(--line);opacity:1}

.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.act{
  display:flex;align-items:center;gap:9px;padding:13px 14px;border-radius:13px;
  background:var(--acc-dim);border:1px solid var(--acc-line);color:var(--acc);
  font-size:13.5px;font-weight:800;
}
.act.ghost{background:var(--surface-2);border-color:var(--line);color:var(--txt)}
.act:active{transform:scale(.98)}

.note{
  margin-top:22px;padding:13px 14px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--txt2);font-size:12.5px;line-height:1.5;
}
.note b{color:var(--txt);font-weight:800}

/* ── SURFACE TOOLBAR — segmented filter + search ─────────────────────────────
   Sticky to the top of the SCROLLER (not the viewport), so filters stay reachable
   while a long order list scrolls under them. */
.toolbar{
  position:sticky;top:-14px;z-index:5;margin:-14px -14px 12px;padding:12px 14px 10px;
  background:linear-gradient(var(--bg) 78%,rgba(5,5,5,0));
}
.segs{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
.seg{
  flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--txt2);white-space:nowrap;
}
.seg.on{background:var(--acc-dim);border-color:var(--acc-line);color:var(--acc)}
.seg .n{opacity:.7;margin-left:5px;font-weight:800}
.search{
  margin-top:9px;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 11px;height:40px;
}
.search input{
  flex:1 1 auto;min-width:0;background:none;border:none;outline:none;color:var(--txt);
  font:inherit;font-size:13.5px;
}
.search input::placeholder{color:var(--txt3)}

/* ── ORDER LIST ──────────────────────────────────────────────────────────────*/
.ord-group{margin-bottom:18px}
.ord-list{display:grid;gap:9px}
.ord{
  width:100%;text-align:left;display:grid;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
}
.ord:hover{border-color:rgba(255,255,255,.16)}
.ord:active{transform:scale(.995)}
.ord-top{display:flex;align-items:baseline;gap:10px;min-width:0}
.ord-id{font-size:13px;font-weight:800;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-amt{margin-left:auto;flex:0 0 auto;font-size:14.5px;font-weight:900;color:var(--acc)}
.ord-sub{display:flex;align-items:center;gap:8px;min-width:0;color:var(--txt2);font-size:12px}
.ord-sub .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-sub .when{margin-left:auto;flex:0 0 auto;color:var(--txt3);font-size:11.5px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--txt2);background:var(--surface-2);
}
.badge.paid{color:var(--acc);border-color:var(--acc-line);background:var(--acc-dim)}
.badge.pending{color:#ffb400;border-color:rgba(255,180,0,.3);background:rgba(255,180,0,.1)}
.badge.failed,.badge.cancelled{color:var(--danger);border-color:rgba(255,82,82,.3);background:rgba(255,82,82,.1)}

/* ── SKELETON — shown INSTANTLY on click, before any data ────────────────────*/
.sk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:9px}
.sk-line{height:11px;border-radius:6px;background:linear-gradient(90deg,#161616 25%,#1f1f1f 37%,#161616 63%);
         background-size:400% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){ .sk-line{animation:none} }

/* ── EMPTY / ERROR — honest states, never a fake figure ──────────────────────*/
.state{text-align:center;padding:44px 20px;color:var(--txt2)}
.state .ico{font-size:30px;display:block;margin-bottom:10px;opacity:.75}
.state b{display:block;font-size:14.5px;font-weight:800;color:var(--txt);margin-bottom:5px}
.state small{display:block;font-size:12.5px;line-height:1.5;max-width:340px;margin:0 auto}
.state .act{display:inline-flex;margin-top:14px}

/* ── CHARTS — CSS bars, no library, no network ───────────────────────────────*/
.chart{
  position:relative;height:132px;margin-bottom:6px;padding:8px 10px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
}
.bars{position:absolute;inset:8px 10px}
.bar{position:absolute;bottom:0;background:var(--acc);opacity:.85;border-radius:3px 3px 0 0;min-height:2px}
.bar:hover{opacity:1}
.chart-x{display:flex;justify-content:space-between;gap:8px;margin:0 2px 20px;
         font-size:10.5px;color:var(--txt3);font-weight:700}
.chart-x span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bd{display:grid;gap:8px;margin-bottom:20px}
.bd-row{display:flex;align-items:center;gap:10px;font-size:12.5px;min-width:0}
.bd-k{flex:0 0 34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      color:var(--txt2);font-weight:700;text-transform:capitalize}
.bd-track{flex:1 1 auto;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:0}
.bd-fill{display:block;height:100%;background:var(--acc);opacity:.8;border-radius:99px}
.bd-v{flex:0 0 auto;font-weight:800;font-size:12px;white-space:nowrap}
@media (max-width:420px){ .bd-k{flex-basis:42%} }

/* Custom range row. The display rule lives HERE, not inline: an inline `display:flex`
   beats the [hidden] attribute's display:none, so the date pickers stayed on screen
   for every range. `hidden` must always win. */
#an-custom{margin-top:9px;display:flex;gap:8px}
#an-custom[hidden]{display:none}
input[type=date].search{color:var(--txt);font:inherit;font-size:13px;min-width:0;flex:1 1 0}

/* ── DEVICE / SETTINGS CARDS ─────────────────────────────────────────────────*/
.dev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.dev-head{display:flex;align-items:center;gap:12px;min-width:0}
.dev-ico{font-size:24px;flex:0 0 auto}
.dev-id{min-width:0}
.dev-id b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev-id small{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);margin-top:3px}
.ta{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;color:var(--txt);font:inherit;font-size:13.5px;resize:vertical;min-height:96px}
.ta:focus{outline:none;border-color:var(--acc-line)}

.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.setcard{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
}
.setcard:hover:not([disabled]){border-color:rgba(255,255,255,.18)}
.setcard[disabled]{opacity:.45;cursor:not-allowed}
.sc-ico{font-size:20px;flex:0 0 auto}
.sc-t{min-width:0;flex:1 1 auto}
.sc-t b{display:block;font-size:13.5px;font-weight:800}
.sc-t small{display:block;font-size:11.5px;color:var(--txt3);margin-top:2px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-go{color:var(--txt3);font-size:18px;flex:0 0 auto}

/* ── TOAST ───────────────────────────────────────────────────────────────────*/
.toast{
  position:fixed;left:50%;transform:translate(-50%,20px);z-index:90;
  bottom:calc(var(--bnav-h) + var(--safe-bot) + 14px);
  max-width:min(92vw,420px);padding:12px 16px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){ .toast{bottom:22px} }

/* ── COMMAND PALETTE ─────────────────────────────────────────────────────────*/
.pal-wrap{
  position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;
  opacity:0;pointer-events:none;transition:opacity .16s;
}
.pal-wrap.on{opacity:1;pointer-events:auto}
.pal{
  width:min(560px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:70vh;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.pal-in input{flex:1 1 auto;min-width:0;background:none;border:none;outline:none;color:var(--txt);font:inherit;font-size:15px}
.pal-in input::placeholder{color:var(--txt3)}
.pal-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px}
.pal-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
         padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--txt2)}
.pal-row.on,.pal-row:hover{background:var(--acc-dim);color:var(--acc)}
.pal-ico{width:20px;text-align:center;flex:0 0 auto}
.pal-empty{padding:22px 16px;text-align:center;color:var(--txt3);font-size:13px}
.pal-foot{flex:0 0 auto;padding:9px 16px;border-top:1px solid var(--line);color:var(--txt3);font-size:11px;font-weight:700}

/* ── DETAIL SHEET — opens IN-SHELL, never a page ─────────────────────────────
   Bottom sheet on phone, right-hand panel on desktop. The shell stays mounted
   underneath: the sidebar and header never move. */
.sheet-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:71;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  left:0;right:0;bottom:0;max-height:88dvh;border-radius:18px 18px 0 0;
  transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
  padding-bottom:var(--safe-bot);
}
.sheet.on{transform:none}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:15px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-x{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
         display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--txt3);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;color:var(--txt);min-width:0;overflow-wrap:anywhere}
.items{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.item{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}
.item:last-child{border-bottom:none}
.item .q{color:var(--txt3);flex:0 0 auto}
.item .n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .p{margin-left:auto;flex:0 0 auto;font-weight:800}
.sheet-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
@media (min-width:900px){
  .sheet{
    left:auto;top:0;right:0;bottom:0;width:min(460px,42vw);max-height:none;
    border-radius:0;border-right:none;transform:translateX(101%);
  }
  .sheet.on{transform:none}
}

/* ── BOTTOM NAV — PHONE ONLY ─────────────────────────────────────────────────
   THE FIX for v1's desktop duplication: this lives inside a max-width query, so it
   is not merely hidden on desktop — it cannot be rendered beside a sidebar at all. */
.bnav{display:none}
@media (max-width:899px){
  .bnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(4,1fr);
    height:calc(var(--bnav-h) + var(--safe-bot));
    padding-bottom:var(--safe-bot);
    background:rgba(5,5,5,.94);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
  }
  .bnav button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--txt3);min-width:0;
  }
  .bnav button .ico{font-size:17px;line-height:1}
  .bnav button.on{color:var(--acc)}
  .bnav button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}

/* ── DESKTOP ─────────────────────────────────────────────────────────────────*/
@media (min-width:900px){
  /* ── DESKTOP SCROLL ARCHITECTURE ───────────────────────────────────────────
     The page itself does NOT scroll. The frame is exactly one viewport tall and
     only the content column scrolls, so the sidebar and header never move and
     never fight the document for the scrollbar.

       .app      100vh, overflow hidden        <- the page cannot scroll
       .side     own column, own internal scroll
       .col      flex column, 100vh
         .hdr    flex:0 0 auto                 <- fixed by layout, not by position
         .main   flex:1 1 auto; min-height:0; overflow-y:auto   <- the ONLY scroller

     min-height:0 on .main is load-bearing: a flex child defaults to min-height:auto
     and refuses to shrink below its content, which makes the column grow and hands
     the scrollbar back to the page. */
  .app{
    display:grid;
    grid-template-columns:var(--rail-w) minmax(0,1fr);   /* minmax(0,1fr) or a wide
                                                            child would stretch the
                                                            column and reintroduce a
                                                            horizontal scrollbar */
    height:100vh;height:100dvh;overflow:hidden;
    padding:0;
    transition:grid-template-columns .18s cubic-bezier(.4,0,.2,1);
  }
  .side{position:relative;height:100vh;height:100dvh;transform:none;width:var(--rail-w);z-index:10;
        transition:width .18s cubic-bezier(.4,0,.2,1)}
  .scrim{display:none}
  .col{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
  .hdr{position:static;height:var(--header-h);padding:0 16px;flex:0 0 auto;left:auto;right:auto}
  .main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 32px}
  /* An iframe module fills the scroller exactly and scrolls its own document —
     no nested scrollbar, no double scroll trap. */
  .frame-wrap{height:100%;margin:-20px -24px -32px}
  .greet b{font-size:24px}

  /* ── COLLAPSED RAIL ────────────────────────────────────────────────────────
     Icon-only. Labels collapse to zero width rather than `display:none` so the
     transition animates and the icons stay put instead of jumping. The rail is
     never collapsed on phone — there it is a drawer, and a 64px permanent strip
     would eat the content area. */
  .app.collapsed{grid-template-columns:var(--rail-collapsed) minmax(0,1fr)}
  .app.collapsed .side{width:var(--rail-collapsed)}
  .app.collapsed .hdr{left:var(--rail-collapsed)}
  .app.collapsed .side-head{justify-content:center;padding:13px 6px}
  .app.collapsed .side-logo{width:34px;height:34px}
  .app.collapsed .side-shop,
  .app.collapsed .side-caret{opacity:0;width:0;overflow:hidden;flex:0 0 0}
  .app.collapsed .nav-item{justify-content:center;padding:10px 0}
  .app.collapsed .nav-item.on{padding:9px 0}
  .app.collapsed .nav-item .lbl{opacity:0;width:0;overflow:hidden}
  .app.collapsed .side-group{opacity:0;height:6px;padding:0;margin:4px 0;overflow:hidden}
  .app.collapsed .side-status{align-items:center;padding:10px 6px}
  .app.collapsed .chip .ctxt{opacity:0;width:0;overflow:hidden}
}

@media (prefers-reduced-motion:reduce){
  .side{transition:none}
  .scrim{transition:none}
}
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR — rendered from the registry, never hand-listed -->
  <aside class="side" id="side" aria-label="Merchant navigation">
    <button class="side-head" id="brand" type="button"
            title="Switch shop / branch" aria-label="Switch shop or branch">
      <img class="side-logo" src="assets/logosokoni.png" alt="SOKONI">
      <span class="side-shop">
        <b id="shop-name">SOKONI</b>
        <small id="shop-sub">Main Branch</small>
      </span>
      <span class="side-caret" aria-hidden="true">▾</span>
    </button>
    <nav class="side-scroll" id="side-nav"></nav>
    <div class="side-foot" id="side-foot"></div>
    <!-- Live shell state. Driven by paintStatus(); the dot colour is never decorative. -->
    <div class="side-status">
      <div class="chip"><span class="dot" id="st-print"></span><span class="ctxt" id="st-print-t">Printer</span></div>
      <div class="chip"><span class="dot ok" id="st-sync"></span><span class="ctxt" id="st-sync-t">Online</span></div>
      <div class="chip"><span class="dot ok" id="st-role"></span><span class="ctxt" id="st-user">Merchant</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="col">
    <header class="hdr">
      <button class="hdr-btn hdr-menu" id="menu" aria-label="Open menu">☰</button>
      <div class="hdr-title" id="title">Dashboard</div>
      <div class="hdr-actions">
        <button class="hdr-shop" id="minishop-btn"><span>🏬 My MiniShop</span></button>
        <button class="hdr-btn" id="search-btn" aria-label="Search">🔍</button>
        <div class="hdr-chip" title="Receipt printer status">
          <span class="dot" id="top-print"></span><span id="top-print-t">Printer</span>
        </div>
      </div>
    </header>

    <main class="main" id="content"></main>
  </div>
</div>

<!-- BOTTOM NAV — phone only, rendered from CONTRACT.BOTTOM_NAV -->
<nav class="bnav" id="bnav" aria-label="Primary"></nav>

<!-- The SHELL owns authentication and data.

     v1 deliberately did NOT load firebase.js here — it imported Firestore lazily,
     per module — which is why nothing in that shell could ever answer "who is signed
     in?". Every hosted module had to resolve identity for itself, and the shell's own
     auth-guard had no bootstrap to wait for. Loading it once, here, is what lets a
     single query path and a single cache serve every surface.

     type="module" so it is deferred: the shell renders its chrome without waiting for
     the SDK, and the data layer awaits it only when a surface actually needs data. -->
<script type="module" src="firebase.js"></script>
<script src="sokoni-merchant-routes.js"></script>

<!-- The NINE native surfaces v1 already implements, as modules. Nothing here is
     rewritten: each exposes the same mount(host, ctx) / destroy() contract that
     merchant.html:1936-2105 calls, so v2 loads the identical files and drives them
     through the identical API. Porting these was wiring, not reimplementation.

     Order matters where a UI module depends on its data module (stock before sell,
     campaigns before marketing, disputes/messages/customers/store/tax before their
     -ui counterparts), so this list mirrors v1's load order exactly. -->
<script src="sokoni-merchant-data.js"></script>
<script src="sokoni-merchant-stock.js"></script>
<!-- ADR-009 canonical receipt-identifier accessor. Must precede sokoni-merchant-sell.js,
     which reads receipt ids through receiptIdOf(). Production loads that module STATICALLY
     here, unlike the work branch where it is loaded on demand — hence a different anchor. -->
<script src="sokoni-receipt-id.js"></script>
<!-- The cash authority. sokoni-merchant-sell.js resolves it as a GLOBAL
     (window.SokoniCash) and owns no arithmetic of its own: without this file the
     module cannot compute change and, correctly, refuses to guess one — the pay
     screen simply shows no change figure. That is not a Sell defect; it is the
     shell failing to supply an authority the module depends on. Loaded before the
     module for the same reason sokoni-receipt-id.js is. -->
<script src="sokoni-cash.js"></script>
<!-- The canonical receipt renderer. sokoni-merchant-sell.js composes through
     global SokoniReceiptDoc — NOT SokoniReceipt, which POS owns — and
     composedReceipt() returns null when it is absent, so the shell silently fell
     back to unbranded text with no seller line no matter what servedBy carried.
     Wiring servedBy without this would have produced a receipt that still showed
     nobody. ONE renderer, per the receipt contract; this shell was simply not
     loading it. -->
<script src="sokoni-receipt.js"></script>
<script src="sokoni-merchant-sell.js"></script>
<script src="sokoni-merchant-inventory-ui.js"></script>
<script src="sokoni-merchant-staff.js"></script>
<script src="sokoni-merchant-team.js"></script>
<script src="sokoni-merchant-campaigns.js"></script>
<script src="sokoni-merchant-marketing.js"></script>
<script src="sokoni-merchant-disputes.js"></script>
<script src="sokoni-merchant-disputes-ui.js"></script>
<script src="sokoni-merchant-messages.js"></script>
<script src="sokoni-merchant-messages-ui.js"></script>
<script src="sokoni-merchant-customers.js"></script>
<script src="sokoni-merchant-customers-ui.js"></script>
<script src="sokoni-merchant-store.js"></script>
<script src="sokoni-merchant-store-ui.js"></script>
<script src="sokoni-merchant-tax.js"></script>
<script src="sokoni-merchant-tax-ui.js"></script>
<script>
(function () {
  'use strict';

  var CONTRACT = window.SokoniMerchantRoutes;
  if (!CONTRACT) { document.getElementById('content').textContent = 'Route contract failed to load.'; return; }

  var byId = {};
  CONTRACT.ROUTES.forEach(function (r) { byId[r.id] = r; });

  var content = document.getElementById('content');
  var titleEl = document.getElementById('title');
  var side    = document.getElementById('side');
  var scrim   = document.getElementById('scrim');
  var panels  = {};
  var current = null;

  /* ── NAV IS A PROJECTION OF THE REGISTRY ──────────────────────────────────
     Nothing here lists a route by hand. Add a route to the contract and it appears;
     remove one and its button disappears with it. That is what makes "every button
     has a destination" structural rather than a thing to remember. */
  function buildSidebar () {
    var nav = document.getElementById('side-nav');
    var frag = document.createDocumentFragment();

    CONTRACT.primary().forEach(function (r) { frag.appendChild(navItem(r)); });

    (typeof CONTRACT.moreGroups === 'function' ? CONTRACT.moreGroups() : []).forEach(function (g) {
      var h = document.createElement('div');
      h.className = 'side-group';
      h.textContent = g.label || g.key || 'More';
      frag.appendChild(h);
      (g.routes || g.items || []).forEach(function (r) { frag.appendChild(navItem(r)); });
    });
    nav.appendChild(frag);

    /* The exit lives in the footer, visually separated, because it is the ONE control
       that leaves the application. */
    var exit = CONTRACT.ROUTES.filter(function (r) { return r.kind === 'exit'; })[0];
    if (exit) {
      var f = document.getElementById('side-foot');
      var h2 = document.createElement('div');
      h2.className = 'side-group';
      h2.style.margin = '2px 6px 6px';
      h2.textContent = 'Marketplace';
      f.appendChild(h2);
      f.appendChild(navItem(exit, '← '));
    }
  }

  function navItem (r, prefix) {
    var b = document.createElement('button');
    b.className = 'nav-item';
    b.type = 'button';
    b.dataset.route = r.id;
    b.innerHTML = '<span class="ico">' + (r.icon || '•') + '</span>' +
                  '<span class="lbl">' + (prefix || '') + (r.name || r.id) + '</span>';
    return b;
  }

  function buildBottomNav () {
    var el = document.getElementById('bnav');
    CONTRACT.BOTTOM_NAV.forEach(function (b) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.route = b.id;
      btn.innerHTML = '<span class="ico">' + b.icon + '</span><span>' + b.label + '</span>';
      el.appendChild(btn);
    });
  }

  /* ── DRAWER + COLLAPSE ────────────────────────────────────────────────────
     ONE button, two behaviours, decided by viewport — the same contract as v1:
       phone   (<900px)  toggles the off-canvas drawer
       desktop (>=900px) toggles the icon-only rail, and REMEMBERS the choice
     The preference is only applied on desktop; restoring "collapsed" on a phone
     would leave a 64px strip permanently eating the content area. */
  var app = document.querySelector('.app');
  var COLLAPSE_KEY = 'sk_merchant_rail_collapsed';
  function isPhone () { return window.matchMedia('(max-width:899px)').matches; }

  function openDrawer (on) {
    side.classList.toggle('open', on);
    scrim.classList.toggle('on', on);
  }
  function setCollapsed (on) {
    app.classList.toggle('collapsed', on);
    try { localStorage.setItem(COLLAPSE_KEY, on ? '1' : '0'); } catch (_) {}
  }
  document.getElementById('menu').addEventListener('click', function () {
    if (isPhone()) openDrawer(!side.classList.contains('open'));
    else setCollapsed(!app.classList.contains('collapsed'));
  });
  scrim.addEventListener('click', function () { openDrawer(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openDrawer(false); });
  try { if (localStorage.getItem(COLLAPSE_KEY) === '1' && !isPhone()) app.classList.add('collapsed'); } catch (_) {}
  /* Crossing the breakpoint must clear the other mode's state, or a drawer left open
     on a phone reappears as a stuck overlay once the window is widened. */
  window.matchMedia('(max-width:899px)').addEventListener('change', function (e) {
    if (e.matches) app.classList.remove('collapsed');
    else { openDrawer(false); try { if (localStorage.getItem(COLLAPSE_KEY) === '1') app.classList.add('collapsed'); } catch (_) {} }
  });

  /* The brand button is the shop/branch switcher's entry point, exactly as in v1.
     SokoniBranch is not loaded in this shell yet, so it says so rather than doing
     nothing — a control that silently no-ops is the defect this project keeps finding. */
  document.getElementById('brand').addEventListener('click', function () {
    if (window.SokoniBranch && typeof window.SokoniBranch.open === 'function') { window.SokoniBranch.open(); return; }
    console.warn('[merchant-v2] branch switcher not loaded in this shell yet');
  });

  /* ── LIVE SHELL STATUS ────────────────────────────────────────────────────
     Printer, connectivity and identity. Online/offline is real (browser events).
     The printer is owned by the shell in v1 and reports up from the POS module by
     postMessage; until that is wired here the dot stays neutral grey and the label
     reads "Printer" — it must never show a confident "connected" it cannot know. */
  function paintStatus () {
    var online = navigator.onLine !== false;
    setDot('st-sync', online ? 'ok' : 'bad');
    text('st-sync-t', online ? 'Online' : 'Offline');

    /* Printer — five honest states. "saved" is not "connected", and an unsupported
       browser says so rather than sitting on a hopeful grey dot forever. */
    var p = DEV.printer, pc = '', pt = 'Printer';
    if (p.state === 'connected')        { pc = 'ok';   pt = p.name || 'Printer ready'; }
    else if (p.state === 'connecting')  { pc = 'warn'; pt = 'Connecting…'; }
    else if (p.state === 'saved')       { pc = '';     pt = 'Printer saved'; }
    else if (p.state === 'unsupported') { pc = '';     pt = 'Printer (unsupported)'; }
    setDot('st-print', pc); setDot('top-print', pc);
    text('st-print-t', pt);
    text('top-print-t', p.state === 'connected' ? (p.name || 'Ready') : 'Printer');

    /* Identity — the third chip now reports the REAL session, not a fixed label. */
    if (S.state === 'in') {
      setDot('st-role', 'ok');
      text('st-user', merchantDisplayName() || S.email || 'Merchant');
      text('shop-name', (S.shop && (S.shop.name || S.shop.shopName)) || 'SOKONI');
      text('shop-sub', S.activeShopId ? 'Shop · ' + S.activeShopId.slice(0, 10) : (S.email || 'Merchant'));
    } else if (S.state === 'out') {
      setDot('st-role', 'bad'); text('st-user', 'Signed out');
    } else {
      setDot('st-role', 'warn'); text('st-user', 'Checking…');
    }
  }
  function setDot (id, cls) { var el = document.getElementById(id); if (el) el.className = 'dot' + (cls ? ' ' + cls : ''); }
  function text (id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }
  window.addEventListener('online',  paintStatus);
  window.addEventListener('offline', paintStatus);

  /* A hosted module (POS) reports printer state up to the shell. Same message shape
     v1 uses, so the existing POS app needs no change to drive this. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (!d.__sokoniPos) return;
    /* A module reports the printer it just connected — the shell RECORDS it, so the
       next module (and the next session) gets it without pairing again. */
    if (d.type === 'printerStatus') {
      DEV.printer.state = d.connected ? 'connected' : (DEV.printer.saved ? 'saved' : 'unknown');
      DEV.printer.name = d.name || DEV.printer.name;
      if (d.connected && d.deviceId) {
        saveDevice({ type: 'printer', id: d.deviceId, name: d.name || 'Printer', at: Date.now() });
      } else { emit('devices'); paintStatus(); }
    }
    /* A module asking what the shell already knows, instead of rediscovering. */
    if (d.type === 'requestShellState') { broadcastSession(); broadcastDevices(); }
  });

  /* ── PANELS ───────────────────────────────────────────────────────────────
     Cached by key and reused, so returning to a route never mounts it twice. */
  function nativePanel (id) {
    var k = 'native:' + id;
    if (!panels[k]) {
      var p = document.createElement('div');
      p.className = 'panel';
      p.id = 'panel-' + id;
      content.appendChild(p);
      panels[k] = p;
    }
    return panels[k];
  }
  function framePanel (key, src, label) {
    if (!panels[key]) {
      var p = document.createElement('div');
      p.className = 'panel';
      var w = document.createElement('div');
      w.className = 'frame-wrap';
      var load = document.createElement('div');
      load.className = 'frame-load';
      load.textContent = 'Opening ' + label + '…';
      var f = document.createElement('iframe');
      f.setAttribute('title', label);
      f.setAttribute('loading', 'lazy');
      /* Hand the module everything the shell already knows the moment it boots, so it
         never repeats auth resolution or device discovery. */
      f.addEventListener('load', function () {
        w.classList.add('loaded');
        try {
          f.contentWindow.postMessage({ __sokoniShell: true, type: 'session', state: S.state,
            uid: S.uid, sellerUid: S.sellerUid, activeShopId: S.activeShopId }, location.origin);
          f.contentWindow.postMessage({ __sokoniShell: true, type: 'devices',
            printer: { state: DEV.printer.state, name: DEV.printer.name, saved: !!DEV.printer.saved },
            devices: DEV.list }, location.origin);
        } catch (_) {}
      });
      f.src = src;
      w.appendChild(f); w.appendChild(load); p.appendChild(w);
      content.appendChild(p);
      panels[key] = p;
    }
    return panels[key];
  }
  function showOnly (panel) {
    Object.keys(panels).forEach(function (k) {
      panels[k].classList.toggle('show', panels[k] === panel);
    });
  }

  /* ── ROUTER ───────────────────────────────────────────────────────────────
     Same semantics as the verified v1 router, deliberately:
       · resolve through the contract; an unknown id is REFUSED, not silently
         redirected to Dashboard (a silent fallback is how a dead button looks alive)
       · an EXIT returns before any state is written, or "#home" lands in the history
         of a page we are leaving and Back bounces forever
       · each user navigation PUSHES history so Back/Forward walk real routes */
