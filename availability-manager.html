<!DOCTYPE html>
<html lang="en" data-no-header="true">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script src="security.js"></script>
<!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
     through SokoniCart; without this tag the pip cannot render a count. -->
<script src="sokoni-cart.js"></script>
<script src="shared-header.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availability · SOKONI</title>
  <!--
    availability-manager.html — a ROUTER since 2026-09-29 (availability completion A2).

    This page used to be a third availability editor. At runtime it was broken: it called `new SokoniAvailability`,
    `setLiveStatus` and `saveProviderAvailability`, none of which exist in any file, so Save and the status chips
    threw. It also wrote the legacy `schedule` shape, which the storefront never read.

    Availability now has ONE authority (docs/SHOP_AVAILABILITY_AUTHORITY.md). This page sends each person to the
    editor that works:
      · a shop owner          → merchant-v2.html#availability  (the control centre; kasshop.setShopAvailability)
      · a service provider    → provider-dashboard.html#availability
      · signed out            → login, then back here
    The decision is the SERVER's: getShopAvailability({settings:true}) answers only for the caller's own shop.
  -->
  <style>
    :root{--bg:#050505;--card:#0d0d0d;--txt:#f4f4f4;--txt2:#a8a8a8;--acc:#71ff00;--line:rgba(255,255,255,.09)}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;box-sizing:border-box}
    .card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
    .ico{font-size:40px}
    h1{font-size:20px;margin:10px 0 6px}
    p{color:var(--txt2);margin:0 0 16px}
    .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);margin:8px auto 0;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
    .links{display:grid;gap:10px;margin-top:14px}
    a.btn{display:block;min-height:44px;line-height:44px;border-radius:12px;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:700;background:rgba(255,255,255,.04)}
    a.btn.solid{background:var(--acc);color:#050505;border-color:var(--acc)}
    a.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="ico" aria-hidden="true">🕘</div>
    <h1>Opening hours &amp; availability</h1>
    <p id="msg" role="status" aria-live="polite">Taking you to your availability settings…</p>
    <div class="spin" id="spin" aria-hidden="true"></div>
    <div class="links" id="links" hidden>
      <a class="btn solid" href="merchant-v2.html#availability">My shop (merchant workspace)</a>
      <a class="btn" href="provider-dashboard.html#availability">My services (provider dashboard)</a>
      <a class="btn" href="index.html">Back to SOKONI</a>
    </div>
  </main>
  <script src="/firebase.js" type="module"></script>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      function manual(text) {
        msg.textContent = text;
        document.getElementById('spin').hidden = true;
        document.getElementById('links').hidden = false;
      }
      function go(url) { location.replace(url); }
      var tries = 0;
      function start() {
        if (typeof window.waitForSokoniAuthReady !== 'function' || typeof window.sokoniCallable !== 'function') {
          if (++tries > 100) return manual('Choose where your hours live:');
          return setTimeout(start, 50);
        }
        window.waitForSokoniAuthReady(function () {
          var user = window.firebaseAuth && window.firebaseAuth.currentUser;
          if (!user) return go('login.html?next=' + encodeURIComponent('availability-manager.html'));
          window.sokoniCallable('getShopAvailability')({ settings: true }).then(function () {
            go('merchant-v2.html#availability');          /* the server found the caller's own shop */
          }).catch(function (e) {
            var code = e && (e.code || '');
            if (/not-found/.test(code)) return go('provider-dashboard.html#availability');
            manual('We could not check your account just now. Choose where your hours live:');
          });
        });
      }
      start();
    })();
  </script>
  <script src="/sw-register.js" defer></script>
</body>
</html>
