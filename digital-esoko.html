<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital eSoko — Seller Dashboard</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#bc8cff}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22}
.tab{padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e;white-space:nowrap}
.tab.active{color:#e6edf3;border-color:#bc8cff}
.container{max-width:1000px;margin:0 auto;padding:24px 16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px}
.stat label{font-size:11px;color:#8b949e;display:block;margin-bottom:4px}
.stat .val{font-size:22px;font-weight:700;color:#bc8cff}
.prod-list{display:flex;flex-direction:column;gap:10px}
.pitem{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;display:flex;gap:14px;align-items:center}
.pthumb{width:52px;height:52px;background:#21262d;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pbody{flex:1}
.ptitle{font-weight:600;font-size:14px;margin-bottom:3px}
.pmeta{font-size:12px;color:#8b949e;margin-bottom:4px}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.sa{background:#1a3a2a;color:#3fb950}.sd{background:#2d2a1a;color:#e3b341}.si{background:#2d1a1a;color:#f85149}
.pactions{display:flex;gap:6px;flex-shrink:0}
.btn{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-p{background:#6e40c9;color:#fff}.btn-p:hover{background:#8957e5}
.btn-g{background:#238636;color:#fff}.btn-g:hover{background:#2ea043}
.btn-out{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-out:hover{border-color:#8b949e}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-hdr h2{font-size:17px;font-weight:600}
.form-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg textarea{resize:vertical;min-height:90px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#bc8cff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.inc-tag{padding:4px 10px;background:#21262d;border-radius:20px;font-size:12px;color:#8b949e;display:flex;align-items:center;gap:6px}
.inc-tag span{cursor:pointer;color:#f85149}
.sales-row{display:flex;gap:12px;align-items:center;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin-bottom:8px}
.empty{text-align:center;padding:60px;color:#8b949e}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#bc8cff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.row2{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}.pitem{flex-wrap:wrap}.pactions{width:100%}}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:#8b949e;font-size:14px;cursor:pointer" onclick="history.back()">← Back</span>
  <div class="logo">💾 eSoko Seller</div>
  <div style="margin-left:auto"><a href="/digital" style="color:#8b949e;font-size:13px">Marketplace →</a></div>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('dash',this)">Dashboard</div>
  <div class="tab" onclick="setTab('create',this)">+ New Product</div>
  <div class="tab" onclick="setTab('sales',this)">Sales</div>
</div>
<div class="container" id="mainContent">
  <div class="empty"><div class="spinner"></div></div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,myProds=[],includes=[];
const CATS=['ebook','software','course','template','music','video','photo','font','plugin','game','other'];
const CEMO={ebook:'📚',software:'💿',course:'🎓',template:'📋',music:'🎵',video:'🎬',photo:'📷',font:'🔤',plugin:'🔌',game:'🎮',other:'💾'};
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
try{app=firebase.initializeApp(firebaseConfig,'desoko');fns=app.functions('us-central1');auth=app.auth();auth.onAuthStateChanged(u=>{cu=u;if(u)loadDash();else showSignIn();});}catch(e){}
async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

function showSignIn(){document.getElementById('mainContent').innerHTML='<div class="empty">Sign in to access the seller dashboard.</div>';}

async function loadDash(){
  document.getElementById('mainContent').innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('getMyDigitalProducts',{limit:100});
  if(!r.ok){document.getElementById('mainContent').innerHTML=`<div class="empty">Could not load dashboard.<br><small>${esc(r.err)}</small><br><button class="btn btn-p" style="margin-top:16px" onclick="setTab('create',document.querySelectorAll('.tab')[1])">Create Your First Product</button></div>`;return;}
  myProds=r.data.products||[];
  const totalRev=myProds.reduce((s,p)=>s+(p.price||0)*(p.downloadCount||0),0);
  const totalDl=myProds.reduce((s,p)=>s+(p.downloadCount||0),0);
  const active=myProds.filter(p=>p.status==='active').length;
  document.getElementById('mainContent').innerHTML=`
    <div class="stats-grid">
      <div class="stat"><label>Products</label><div class="val">${myProds.length}</div></div>
      <div class="stat"><label>Active</label><div class="val">${active}</div></div>
      <div class="stat"><label>Downloads</label><div class="val">${totalDl}</div></div>
      <div class="stat"><label>Est. Revenue</label><div class="val" style="font-size:16px">KES ${totalRev.toLocaleString()}</div></div>
    </div>
    <div class="section-hdr">
      <h2>Your Products</h2>
      <button class="btn btn-p" onclick="setTab('create',document.querySelectorAll('.tab')[1])">+ New Product</button>
    </div>
    ${myProds.length?'<div class="prod-list">'+myProds.map(p=>`
      <div class="pitem">
        <div class="pthumb">${p.thumbnailUrl?`<img src="${esc(p.thumbnailUrl)}">`:CEMO[p.category]||'💾'}</div>
        <div class="pbody">
          <div class="ptitle">${esc(p.title)}</div>
          <div class="pmeta">${p.category||''} · ${p.price===0?'Free':`KES ${(p.price||0).toLocaleString()}`} · ⬇ ${p.downloadCount||0}</div>
          <span class="status ${p.status==='active'?'sa':p.status==='draft'?'sd':'si'}">${p.status}</span>
        </div>
        <div class="pactions">
          ${p.status==='draft'?`<button class="btn btn-g" onclick="publish('${esc(p.productId)}')">Publish</button>`:''}
          ${p.status==='active'?`<button class="btn btn-out" onclick="unpublish('${esc(p.productId)}')">Unpublish</button>`:''}
        </div>
      </div>`).join('')+'</div>':'<div class="empty">No products yet. Create your first one!</div>'}`;
}

async function publish(id){
  const r=await call('publishDigitalProduct',{productId:id});
  if(r.ok){toast('Product published!');loadDash();}else toast(r.err||'Failed',false);
}
async function unpublish(id){
  const r=await call('unpublishDigitalProduct',{productId:id});
  if(r.ok){toast('Product unpublished.');loadDash();}else toast(r.err||'Failed',false);
}

function createForm(){
  includes=[];
  return`<div class="form-card">
    <h2 style="margin-bottom:20px">Create Digital Product</h2>
    <div class="fg"><label>Title *</label><input id="ptitle" placeholder="e.g. Complete Kenya Business Templates Pack"></div>
    <div class="row2">
      <div class="fg"><label>Category *</label><select id="pcat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="fg"><label>License Type</label><select id="plicense"><option value="personal">Personal</option><option value="commercial">Commercial</option><option value="extended">Extended</option></select></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Price (KES) — 0 for free</label><input type="number" id="pprice" value="0" min="0"></div>
      <div class="fg"><label>Max Downloads per buyer</label><input type="number" id="pdl" value="5" min="1" max="100"></div>
    </div>
    <div class="fg"><label>Description *</label><textarea id="pdesc" placeholder="What does this product include? Who is it for?"></textarea></div>
    <div class="fg">
      <label>What's Included (press Enter to add)</label>
      <input id="pincInput" placeholder="e.g. 50+ Excel templates" onkeydown="if(event.key==='Enter'){event.preventDefault();addInc()}">
      <div class="inc-tags" id="incTags"></div>
    </div>
    <div class="fg"><label>File Type</label><input id="pfileType" placeholder="e.g. PDF, ZIP, MP3, PNG"></div>
    <div class="fg"><label>File Size (MB)</label><input type="number" id="psize" min="0" step="0.1"></div>
    <div class="fg"><label>Version</label><input id="pver" placeholder="1.0"></div>
    <div class="fg"><label>Thumbnail URL (optional)</label><input id="pthumb" placeholder="https://…"></div>
    <div class="fg" style="background:#21262d;border:1px dashed #30363d;border-radius:8px;padding:16px;text-align:center">
      <label style="color:#8b949e;font-size:14px">File Storage Path (GCS path where your file is uploaded)</label>
      <input id="pfile" placeholder="products/uid/filename.zip" style="margin-top:8px">
      <p style="font-size:12px;color:#8b949e;margin-top:6px">Upload your file to Firebase Storage and paste the path here. Files are never exposed publicly.</p>
    </div>
    <div style="display:flex;gap:12px;margin-top:4px">
      <button class="btn btn-p" style="flex:1" onclick="submitProduct(false)">Save as Draft</button>
      <button class="btn btn-g" style="flex:1" onclick="submitProduct(true)">Publish Now</button>
    </div>
  </div>`;
}

function addInc(){
  const inp=document.getElementById('pincInput');
  const val=inp.value.trim();if(!val)return;
  includes.push(val);inp.value='';
  document.getElementById('incTags').innerHTML=includes.map((i,idx)=>`<div class="inc-tag">${esc(i)}<span onclick="rmInc(${idx})">×</span></div>`).join('');
}
function rmInc(idx){includes.splice(idx,1);document.getElementById('incTags').innerHTML=includes.map((i,id)=>`<div class="inc-tag">${esc(i)}<span onclick="rmInc(${id})">×</span></div>`).join('');}

async function submitProduct(publish){
  if(!cu){toast('Sign in to create products',false);return;}
  const title=document.getElementById('ptitle').value.trim();
  const desc=document.getElementById('pdesc').value.trim();
  const filePath=document.getElementById('pfile').value.trim();
  if(!title||!desc){toast('Title and description are required',false);return;}
  const r=await call('createDigitalProduct',{
    title,description:desc,
    category:document.getElementById('pcat').value,
    licenseType:document.getElementById('plicense').value,
    price:parseFloat(document.getElementById('pprice').value)||0,
    allowedDownloads:parseInt(document.getElementById('pdl').value)||5,
    includes,fileType:document.getElementById('pfileType').value.trim(),
    fileSizeMb:parseFloat(document.getElementById('psize').value)||undefined,
    version:document.getElementById('pver').value.trim(),
    thumbnailUrl:document.getElementById('pthumb').value.trim(),
    fileStoragePath:filePath,
  });
  if(!r.ok){toast(r.err||'Failed to create product',false);return;}
  if(publish&&r.data.productId){
    const pr=await call('publishDigitalProduct',{productId:r.data.productId});
    if(pr.ok){toast('Product published!');setTab('dash',document.querySelectorAll('.tab')[0]);}
    else toast('Created as draft. Publish from the dashboard.',false);
  } else {
    toast('Product saved as draft!');setTab('dash',document.querySelectorAll('.tab')[0]);
  }
}

async function loadSales(){
  document.getElementById('mainContent').innerHTML='<div class="empty"><div class="spinner"></div></div>';
  const r=await call('getDigitalProductSales',{limit:50});
  if(!r.ok){document.getElementById('mainContent').innerHTML='<div class="empty">No sales yet.</div>';return;}
  const list=r.data.sales||[];
  if(!list.length){document.getElementById('mainContent').innerHTML='<div class="empty">No sales yet.</div>';return;}
  document.getElementById('mainContent').innerHTML=`<div class="section-hdr"><h2>Sales (${list.length})</h2></div>`+
  list.map(s=>`<div class="sales-row">
    <div style="font-size:18px">${CEMO[s.category]||'💾'}</div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:14px">${esc(s.productTitle||s.productId)}</div>
      <div style="font-size:12px;color:#8b949e">${new Date(s.createdAt?.seconds?s.createdAt.seconds*1000:s.createdAt).toLocaleDateString()} · ${s.status}</div>
    </div>
    <div style="font-weight:700;color:#bc8cff">KES ${(s.sellerAmount||s.purchasePrice||0).toLocaleString()}</div>
  </div>`).join('');
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');
  if(t==='dash'){if(cu)loadDash();else showSignIn();}
  else if(t==='create'){document.getElementById('mainContent').innerHTML=cu?createForm():'<div class="empty">Sign in to create products.</div>';}
  else if(t==='sales'){if(cu)loadSales();else showSignIn();}
}
</script>
</body>
</html>
