<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOKONI Merchant OS</title>
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --bg:#050505; --panel:#0a0a0a; --card:#0d0d0d; --line:rgba(255,255,255,.08);
    --txt:#fff; --txt2:rgba(255,255,255,.55); --txt3:rgba(255,255,255,.35); --acc:#71ff00;
    --rail:224px; --rail-collapsed:64px; --top:56px;
    /* ── Mobile shell geometry contract (v496) ──────────────────────────────
       ONE definition of the fixed chrome, so no module has to guess. The page
       is rendered with viewport-fit=cover, so both insets are real on iPhone.
         --safe-top    status bar / notch
         --safe-bot    home indicator
         --top-h       header incl. its safe inset (what content must clear)
         --bnav-h      bottom nav incl. its safe inset (what content must clear)
       --bnav-h must match .mbnav's box: 1px border + 6px + 52px item + 6px. */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --top-h: calc(var(--top) + var(--safe-top));
    --bnav-h: calc(65px + var(--safe-bot));
    /* Desktop bar is its own, shorter box: 1px border + 4px + 36px item + 4px. */
    --bnav-h-desk: calc(45px + var(--safe-bot));
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;overflow:hidden}

  .mshell{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:100vh;
    transition:grid-template-columns .22s cubic-bezier(.2,.7,.3,1)}
  /* iOS Safari's 100vh is the LARGE viewport (as if the toolbar were retracted), so with
     body{overflow:hidden} the bottom of the shell is pushed permanently off-screen while the
     toolbar is showing. dvh tracks the visible viewport. Declared second = progressive
     enhancement; browsers without dvh keep the 100vh line above. */
  @supports (height:100dvh){ .mshell{grid-template-rows:100dvh} }
  .mshell.collapsed{grid-template-columns:var(--rail-collapsed) 1fr}

  /* ── Sidebar ── */
  .mrail{background:linear-gradient(180deg,#0b0b0b,#070707);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  /* Brand button = canonical shop/branch switcher */
  .mbrand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;min-height:var(--top);
    border-bottom:1px solid var(--line);width:100%;background:none;color:inherit;font-family:inherit;
    cursor:pointer;text-align:left}
  .mbrand:hover{background:rgba(255,255,255,.03)}
  /* Brand logo — transparent PNG, no background box */
  .mbrand .logo{height:30px;width:auto;max-width:120px;object-fit:contain;background:none;
    border-radius:0;flex:0 0 auto;display:block}
  .mshell.collapsed .mbrand .logo{max-width:40px}
  .mbrand .name{font-weight:900;letter-spacing:.02em;white-space:nowrap;font-size:15px;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mbrand-caret{margin-left:auto;color:var(--txt3);font-size:12px;flex:0 0 auto}
  .mshell.collapsed .mbrand .name,.mshell.collapsed .mbrand-caret{opacity:0;width:0}
  .mnav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    cursor:pointer;color:var(--txt2);font-size:13.5px;font-weight:700;white-space:nowrap;
    transition:background .14s,color .14s;user-select:none}
  .mnav-item .ico{font-size:18px;flex:0 0 22px;text-align:center}
  .mnav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .mnav-item.active{background:rgba(113,255,0,.12);color:var(--acc)}
  .mshell.collapsed .mnav-item .lbl{opacity:0;width:0;overflow:hidden}
  .mnav-sep{height:1px;background:var(--line);margin:8px 12px}
  .mnav-head{padding:14px 14px 6px;font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--txt3);white-space:nowrap}
  .mshell.collapsed .mnav-head{opacity:0;height:6px;padding:3px 0;overflow:hidden}

  /* Exit to the marketplace. The merchant shell suppresses the customer header and bottom
     nav for everything it hosts (shared-header.js, ?shell=merchant), which is correct — but
     it left /merchant with NO link out of itself at all: measured, zero anchors to any
     external destination. A merchant who opened their shop could reach the marketplace only
     by editing the URL. That is the dead-end Navigation Contract rule 2 forbids.
     It sits after .mnav (which is flex:1) so it pins to the rail footer in the desktop
     sidebar AND in the mobile drawer, where the four-up bottom bar has no room for it. */
  .mexit{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;
    border:none;border-top:1px solid var(--line);background:none;color:var(--txt2);
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .mexit:hover{background:rgba(255,255,255,.04);color:var(--txt)}
  .mexit .mexit-ico{font-size:15px;flex:0 0 auto;line-height:1}
  .mshell.collapsed .mexit .mexit-txt{opacity:0;width:0;overflow:hidden}
  /* The exit sits under its own "Marketplace" heading, matching the grouped rail above.
     The heading takes the divider so there is ONE rule between the nav and the exit,
     not two stacked lines. */
  .mexit-head{border-top:1px solid var(--line);margin-top:4px}
  .mexit-head + .mexit{border-top:none}
  .mshell.collapsed .mexit-head{opacity:0;height:6px;padding:3px 0;overflow:hidden}
  .mstatus{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px}
  .mchip{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap}
  .mdot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
  .mdot.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
  .mdot.bad{background:#ff6464}
  .mdot.warn{background:#ffb400;box-shadow:0 0 7px rgba(255,180,0,.7)}
  .mshell.collapsed .mchip .ctxt{opacity:0;width:0;overflow:hidden}

  /* ── Main ── */
  .mmain{display:flex;flex-direction:column;min-width:0;min-height:0;grid-column:2;grid-row:1}
  /* The header owns the top safe inset: it grows by the notch and pads its controls down out
     of it, so the burger / title / MiniShop / ⌘K are never under the iOS status bar. This is
     the ONE header in the shell — hosted modules must not create competing fixed headers. */
  .mtop{height:var(--top-h);flex:0 0 var(--top-h);display:flex;align-items:center;gap:12px;
    padding:var(--safe-top) 14px 0;border-bottom:1px solid var(--line);background:var(--panel)}
  .mtop .burger{background:none;border:1px solid var(--line);color:var(--txt2);width:34px;height:34px;
    border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mtop .burger:hover{color:var(--txt);border-color:rgba(113,255,0,.4)}
  /* The title must never wrap: "POS / Cashier" broke onto a second line at 375px, growing the
     header and shoving the whole shell down. It is a flex child, so it also needs min-width:0
     before ellipsis can apply. It yields space to the action buttons rather than pushing them. */
  .mtitle{font-weight:800;font-size:15px;min-width:0;flex:0 1 auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .spacer{flex:1}
  .mtop .tchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt2);
    padding:6px 11px;border:1px solid var(--line);border-radius:20px}
  .mtop .tchip .mdot{width:7px;height:7px}

  /* Integrated update bar — full width, below the top bar, pushes content (never overlaps).
     Singleton by construction (one #mupdate element in the shell). */
  .mupdate{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 16px;
    background:linear-gradient(90deg,rgba(113,255,0,.14),rgba(113,255,0,.06));
    border-bottom:1px solid rgba(113,255,0,.28);color:var(--txt);font-size:13px;font-weight:700}
  .mupdate[hidden]{display:none}
  .mu-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-actions{display:flex;gap:8px;flex:0 0 auto}
  .mupdate button{border-radius:9px;padding:7px 14px;font-weight:800;font-size:12.5px;cursor:pointer;border:1px solid}
  .mu-now{background:var(--acc);color:#000;border-color:var(--acc)}
  .mu-later{background:transparent;color:var(--txt2);border-color:var(--line)}
  .mu-later:hover{color:var(--txt)}

  .mcontent{flex:1;position:relative;min-height:0;background:var(--bg)}
  .mpanel{position:absolute;inset:0;display:none}
  .mpanel.show{display:block}
  /* iframe is absolutely positioned so it stacks ABOVE the loading overlay (which is also
     absolute). Without this the transparent "Loading…" layer sat on top of every module and
     swallowed all clicks + scroll — the reported "buttons unresponsive / pages don't scroll". */
  .mpanel iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:var(--bg);z-index:1}
  /* Smooth, no-flash module transition when a panel becomes active. */
  .mpanel.show{animation:mPanelIn .24s cubic-bezier(.2,.7,.3,1) both}
  @keyframes mPanelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Premium skeleton loader — shimmer placeholders instead of "Loading…" text. Never blocks
     interaction; hides once the iframe reports loaded. */
  .dloading{position:absolute;inset:0;padding:22px;pointer-events:none;z-index:0;overflow:hidden}
  .mpanel.loaded .dloading{display:none}
  .sk-line{height:14px;border-radius:7px;margin-bottom:12px;
    background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 37%,rgba(255,255,255,.05) 63%);
    background-size:400% 100%;animation:skShim 1.25s ease-in-out infinite}
  .sk-cardrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:18px 0}
  .sk-card{height:88px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.10) 37%,rgba(255,255,255,.04) 63%);
    background-size:400% 100%;animation:skShim 1.25s ease-in-out infinite}
  @keyframes skShim{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk-label{position:absolute;bottom:22px;left:22px;font-size:11.5px;color:var(--txt3);font-weight:700;letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){.mpanel.show{animation:none}.sk-line,.sk-card{animation:none}}
  .mpanel .native{position:absolute;inset:0;overflow-y:auto;padding:22px;z-index:2}

  /* Native dashboard */
  .dwrap{max-width:1100px;margin:0 auto}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .dcard{background:linear-gradient(158deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--card);
    border:1px solid var(--line);border-radius:18px;padding:18px 16px;position:relative;overflow:hidden}
  .dcard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(113,255,0,.7),transparent)}
  .dcard .n{font-size:26px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
  .dcard .l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  /* Phone: swipeable KPI cards — a horizontal scroll-snap rail, large-but-compact,
     next card peeking to signal there's more. Desktop keeps the responsive grid. */
  @media (max-width:560px){
    .dgrid{display:flex;grid-template-columns:none;overflow-x:auto;gap:12px;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin:0 -16px 20px;padding:2px 16px 6px}
    .dgrid::-webkit-scrollbar{display:none}
    .dcard{flex:0 0 46%;scroll-snap-align:start;padding:16px 14px}
    .dcard .n{font-size:23px}
  }
  .dsec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:0 2px 12px}
  /* Workspace identity — the merchant's own name on their own dashboard. The name is
     READ from the canonically resolved shop (SokoniShell.activeShopName, assigned by
     _applyShop below); this surface never writes it. Until a shop resolves the greeting
     stands alone. No placeholder name, no "there", no uid. */
  .dgreet{margin:0 2px 20px}
  .dgreet-hi{display:block;font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
  .dgreet-sub{display:block;font-size:12.5px;color:var(--txt2);margin-top:5px}
  @media (max-width:560px){ .dgreet{margin-bottom:16px} .dgreet-hi{font-size:19px} }
  .dbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(113,255,0,.12);border:1px solid rgba(113,255,0,.3);
    color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none}
  .dbtn.ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--txt2)}
  /* Devices page */
  .dev-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .dev-row{display:flex;align-items:center;gap:14px}
  .dev-ico{font-size:30px;flex:0 0 auto}
  .dev-name{font-weight:800;font-size:15px}
  .dev-sub{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2);margin-top:3px}
  .dev-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .dev-note{font-size:11.5px;color:var(--txt3);line-height:1.55;margin-top:12px}
  .dev-soon{opacity:.6}
  /* Native Orders module */
  .ord2-wrap{max-width:900px;margin:0 auto}
  .ord2-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:14px}
  .ord2-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
  .ord2-stat-n{font-size:17px;font-weight:900;color:var(--acc);line-height:1.1}
  .ord2-stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .ord2-rangebar,.ord2-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .ord2-rangebar::-webkit-scrollbar,.ord2-tabs::-webkit-scrollbar{display:none}
  .ord2-chip,.ord2-tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt2);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .ord2-chip.active,.ord2-tab.active{background:rgba(113,255,0,.12);border-color:rgba(113,255,0,.4);color:var(--acc)}
  .ord2-search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 14px;font-size:14px;outline:none;margin:4px 0 10px;font-family:inherit}
  .ord2-list{display:flex;flex-direction:column;gap:10px}
  .ord2-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .14s,transform .12s}
  .ord2-card:hover{border-color:rgba(113,255,0,.35);transform:translateY(-1px)}
  .ord2-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .ord2-card-id{font-weight:800;font-size:14px}
  .ord2-card-sub{font-size:11.5px;color:var(--txt2);margin-top:2px}
  .ord2-card-amt{font-weight:900;font-size:15px}
  .ord2-card-when{font-size:10.5px;color:var(--txt3);margin-top:2px;white-space:nowrap}
  .ord2-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ord2-pay{font-size:11px;color:var(--txt2)}
  .ord2-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px}
  .ord2-ok{background:rgba(113,255,0,.13);color:var(--acc)} .ord2-warn{background:rgba(255,180,0,.14);color:#ffb400} .ord2-bad{background:rgba(255,80,80,.14);color:#ff6464}
  .ord2-empty{text-align:center;color:var(--txt2);padding:40px 20px}
  .ord2-note{font-size:12px;color:var(--txt3);margin-top:8px}
  .ord2-diag{font-size:11px;color:var(--txt3);margin-top:10px;font-family:ui-monospace,Menlo,monospace;opacity:.75}
  .ord2-drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;justify-content:flex-end}
  .ord2-drawer{width:100%;max-width:420px;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:ord2In .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes ord2In{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  /* Phone: order detail as a bottom-sheet (slides up, rounded top, partial height)
     instead of a full-screen side drawer — premium mobile pattern. */
  @media (max-width:560px){
    .ord2-drawer-ov{justify-content:stretch;align-items:flex-end}
    .ord2-drawer{max-width:none;height:auto;max-height:88vh;border-left:none;
      border-top:1px solid var(--line);border-radius:20px 20px 0 0;animation:ord2Up .26s cubic-bezier(.2,.7,.3,1);
      padding-bottom:env(safe-area-inset-bottom,0px)}
    .ord2-dhead{position:relative}
    /* grab handle */
    .ord2-dhead::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
      width:38px;height:4px;border-radius:3px;background:var(--line)}
  }
  @keyframes ord2Up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
  .ord2-dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
  .ord2-dtitle{font-weight:900;font-size:16px} .ord2-dsub{font-size:12px;color:var(--txt2);margin-top:4px;display:flex;gap:7px;align-items:center}
  .ord2-dclose{background:none;border:none;color:var(--txt2);font-size:16px;cursor:pointer}
  .ord2-dbody{padding:16px;overflow-y:auto;flex:1}
  .ord2-drow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;color:var(--txt)}
  .ord2-drow span:first-child{color:var(--txt2)}
  .ord2-dtotal{font-weight:900;font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
  .ord2-dbody hr{border:none;border-top:1px solid var(--line);margin:10px 0}
  .ord2-dsec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:16px 0 10px}
  .ord2-tl{position:relative}
  .ord2-tl-row{display:flex;gap:12px;padding-bottom:14px;position:relative}
  .ord2-tl-row:not(:last-child)::before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
  .ord2-tl-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);flex:0 0 auto;margin-top:2px}
  .ord2-tl-dot.now{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .ord2-tl-t{font-size:13px;font-weight:700} .ord2-tl-at{font-size:11px;color:var(--txt3);margin-top:1px}
  .ord2-dfoot{padding:14px 16px;border-top:1px solid var(--line)}
  .ord2-dfoot .dbtn{width:100%;justify-content:center}
  /* ── Availability module ── */
  .av-wrap{max-width:820px}
  .av-shopcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
  .av-shopcard.open{border-color:rgba(113,255,0,.35)} .av-shopcard.closed{border-color:rgba(255,90,90,.35)}
  .av-shophead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .av-shopdot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .av-shopdot.on{background:var(--acc);box-shadow:0 0 10px var(--acc)} .av-shopdot.off{background:#ff5a5a;box-shadow:0 0 10px rgba(255,90,90,.6)}
  .av-shoptitle{font-size:18px;font-weight:900}
  .av-chiprow{display:flex;flex-wrap:wrap;gap:10px}
  .av-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--txt);font-family:inherit;cursor:pointer;min-height:40px}
  .av-chip:active{background:rgba(255,255,255,.09)} .av-chip[disabled]{opacity:.5;cursor:default}
  .av-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto} .av-dot.on{background:var(--acc)} .av-dot.off{background:#ff5a5a}
  .av-openbtn{margin-left:auto;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;min-height:38px}
  .av-openbtn.open{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.5);color:#ff6b6b}
  .av-openbtn.close{background:rgba(113,255,0,.12);border:1px solid rgba(113,255,0,.5);color:var(--acc)}
  .av-openbtn[disabled]{opacity:.5;cursor:default}
  .av-rowright{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .av-ptoggle{border-radius:20px;padding:5px 12px;font-family:inherit;font-weight:800;font-size:11px;cursor:pointer;min-height:32px;border:1px solid var(--line)}
  .av-ptoggle.on{background:rgba(113,255,0,.12);border-color:rgba(113,255,0,.4);color:var(--acc)}
  .av-ptoggle.off{background:rgba(255,255,255,.05);color:var(--txt3)}

  .av-state{color:var(--txt3);font-size:11px;font-weight:800;margin-left:2px}
  .av-note{font-size:11px;color:var(--txt3);margin-top:12px;opacity:.8}
  .av-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
  .av-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
  .av-stat .av-n{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .av-stat .av-l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:5px}
  .av-stat.ok .av-n{color:var(--acc)} .av-stat.warn .av-n{color:#ffb400} .av-stat.bad .av-n{color:#ff6464} .av-stat.muted .av-n{color:var(--txt3)}
  .av-sec{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin:0 2px 12px;display:flex;align-items:center;gap:8px}
  .av-count{background:rgba(255,255,255,.08);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--txt2)}
  .av-list{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .av-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--card)}
  .av-pname{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av-badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .av-badge.ok{background:rgba(113,255,0,.13);color:var(--acc)} .av-badge.warn{background:rgba(255,180,0,.14);color:#ffb400}
  .av-badge.bad{background:rgba(255,80,80,.14);color:#ff6464} .av-badge.muted{background:rgba(255,255,255,.06);color:var(--txt3)}
  .av-empty{text-align:center;color:var(--txt2);padding:30px 20px}
  /* Native Reports / Finance / Analytics */
  .an-wrap{max-width:820px;margin:0 auto}
  .an-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .an-title{font-size:18px;font-weight:900}
  .an-range{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .an-range::-webkit-scrollbar{display:none}
  .an-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:8px}
  .an-stat{background:linear-gradient(158deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center}
  .an-stat-n{font-size:19px;font-weight:900;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
  .an-stat-l{font-size:10.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:5px}
  .an-sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:20px 2px 10px}
  .an-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
  .an-row span:first-child{color:var(--txt2)}
  .an-empty{color:var(--txt3);font-size:12.5px;padding:10px 2px}
  .an-note{font-size:11.5px;color:var(--txt3);margin-top:14px;line-height:1.5}
  .an-trace{font-size:10.5px;color:var(--txt3);margin-top:22px;padding-top:12px;border-top:1px solid var(--line);opacity:.7}

  /* Drawer scrim — tap outside the open rail to dismiss it (mobile only). */
  .mscrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49;opacity:0;
    pointer-events:none;transition:opacity .22s}
  /* Top-bar command trigger — opens the ⌘K palette (search + quick actions). */
  .mcmd-open{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);color:var(--txt2);border-radius:10px;height:34px;padding:0 11px;
    font-family:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s}
  .mcmd-open:hover{color:var(--txt);border-color:rgba(113,255,0,.4)}
  /* My MiniShop — the merchant's storefront identity in the header. Premium, compact, mobile-first. */
  .mshop-btn{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,rgba(113,255,0,.14),rgba(113,255,0,.05));
    border:1px solid rgba(113,255,0,.32);color:var(--txt);border-radius:11px;height:36px;padding:0 12px;
    font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
  .mshop-btn:hover{border-color:rgba(113,255,0,.6);background:linear-gradient(135deg,rgba(113,255,0,.2),rgba(113,255,0,.07))}
  .mshop-btn:active{transform:scale(.97)}
  .mshop-ico{font-size:16px;line-height:1}
  .mshop-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
  .mshop-l1{font-size:12.5px;font-weight:800}
  .mshop-l2{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.02em}
  .mshop-btn.notclaimed .mshop-l2{color:#ffd24a}
  @media (max-width:560px){ .mshop-txt{display:none} .mshop-btn{padding:0 10px;gap:0} }
  .mcmd-open .kbd{font-size:10px;font-weight:800;color:var(--txt3);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;letter-spacing:.03em}
  /* Command palette */
  .mcmd-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100050;display:none;
    justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
  .mcmd-ov.open{display:flex}
  .mcmd{width:100%;max-width:560px;max-height:70vh;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;
    animation:mcmdIn .18s ease}
  @keyframes mcmdIn{from{transform:translateY(-10px);opacity:.6}to{transform:none;opacity:1}}
  .mcmd-input{background:none;border:none;border-bottom:1px solid var(--line);color:var(--txt);
    font-family:inherit;font-size:16px;padding:16px 18px;outline:none}
  .mcmd-list{overflow-y:auto;padding:8px}
  .mcmd-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;cursor:pointer;color:var(--txt2)}
  .mcmd-item .ci{font-size:18px;flex:0 0 22px;text-align:center}
  .mcmd-item .cl{flex:1;font-size:14px;color:var(--txt)}
  .mcmd-item .ck{font-size:10px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em}
  .mcmd-item.sel,.mcmd-item:hover{background:rgba(113,255,0,.12);color:var(--acc)}
  .mcmd-item.sel .cl{color:var(--acc)}
  .mcmd-empty{padding:24px;text-align:center;color:var(--txt3);font-size:13px}
  @media (max-width:560px){ .mcmd-open .kbd{display:none} .mcmd-open{padding:0 9px} }
  /* Mobile bottom navigation — primary destinations one tap away (desktop: hidden). */
  .mbnav{display:none}
  @media (max-width:820px){
    :root{--rail:200px}
    .mshell{grid-template-columns:0 1fr}
    .mshell.mobile-open{grid-template-columns:var(--rail) 1fr}
    /* The drawer is a fixed overlay ABOVE the bottom nav (z 50 > 48) and owns both safe
       insets itself, so the brand button clears the notch and the status chips clear the
       home indicator. .mnav already scrolls (flex:1;overflow-y:auto) — with the insets
       accounted for, every sidebar row stays reachable however long the list grows. */
    .mrail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:50;
      transform:translateX(-100%);transition:transform .22s;
      padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
    .mshell.mobile-open .mrail{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.6)}
    .mshell.mobile-open .mscrim{opacity:1;pointer-events:auto}
    /* ── Bottom-nav clearance ────────────────────────────────────────────────
       This padding MUST live on .mmain, not on .mcontent. Every module panel is
       `.mpanel{position:absolute;inset:0}`, and an absolutely-positioned box resolves
       inset:0 against its containing block's PADDING box — so padding on .mcontent (the
       positioned ancestor) was a complete no-op and left 65px of every module, native and
       iframe alike, buried under the fixed bottom nav (POS charge bar, form submit buttons,
       last list row). Padding .mmain instead shortens the flex content box, so .mcontent
       (flex:1) genuinely ends above the nav and inset:0 lands where it should. */
    .mmain{padding-bottom:var(--bnav-h)}
    .mbnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:48;
      background:linear-gradient(180deg,#0b0b0b,#070707);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + var(--safe-bot));}
    .mbnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      background:none;border:0;color:var(--txt2);font-family:inherit;cursor:pointer;
      padding:6px 2px;min-height:52px;border-radius:12px;transition:color .15s,background .15s}
    .mbnav-item .bi{font-size:20px;line-height:1}
    .mbnav-item .bl{font-size:10px;font-weight:700;letter-spacing:.02em}
    .mbnav-item.active{color:var(--acc);background:rgba(113,255,0,.10)}
    .mbnav-item:active{background:rgba(255,255,255,.06)}
  }

  /* ── Desktop bottom nav ────────────────────────────────────────────────────
     The same four CONTRACT destinations stay in the same place on every screen, but
     subdued: the rail is the primary navigation on a desktop, so this is a quiet
     shortcut strip, not a second menu. It starts at the rail edge rather than spanning
     the viewport, so it never covers the sidebar or its status chips, and it follows
     the rail when it collapses.

     "More" is hidden here deliberately. It opens the mobile drawer by adding
     .mobile-open, and every rule that reads that class lives inside the max-width:820px
     block above — on a desktop the button would do nothing at all, and a dead control is
     worse than an absent one. The full route list is already on screen in the rail.

     The padding-bottom is NOT optional. .mpanel is position:absolute;inset:0, which
     resolves against .mcontent's PADDING box — so, exactly as the mobile block documents,
     clearance has to shorten .mmain's content box or the bar buries the last 45px of
     every module, native and iframe alike. */
  @media (min-width:821px){
    .mmain{padding-bottom:var(--bnav-h-desk)}
    .mbnav{display:flex;position:fixed;left:var(--rail);right:0;bottom:0;z-index:48;
      background:var(--panel);border-top:1px solid var(--line);gap:4px;
      padding:4px 10px calc(4px + var(--safe-bot));
      transition:left .22s cubic-bezier(.2,.7,.3,1)}
    .mshell.collapsed .mbnav{left:var(--rail-collapsed)}
    .mbnav-item{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:7px;
      background:none;border:0;color:var(--txt3);font-family:inherit;cursor:pointer;
      padding:0 12px;min-height:36px;border-radius:9px;
      transition:color .15s,background .15s}
    .mbnav-item .bi{font-size:14px;line-height:1}
    .mbnav-item .bl{font-size:12px;font-weight:700;letter-spacing:.01em}
    .mbnav-item:hover{color:var(--txt);background:rgba(255,255,255,.05)}
    .mbnav-item.active{color:var(--acc);background:rgba(113,255,0,.10)}
    .mbnav-item[data-id="__more"]{display:none}
  }
</style>
</head>
<body>
<div class="mshell" id="mshell">
  <aside class="mrail">
    <button class="mbrand" id="mbrand" title="Switch shop / branch" aria-label="Switch shop or branch">
      <img class="logo" src="assets/logosokoni.png" alt="SOKONI">

      <span class="mbrand-caret" aria-hidden="true">▾</span>
    </button>
    <nav class="mnav" id="mnav"></nav>
    <!-- The one way out of the shell. A real full-page navigation, NOT a route panel:
         mounting index.html in an iframe here would boot the whole customer application
         inside /merchant — the double-shell defect e0dbdca fixed. Targets "/" rather than
         "index.html" because firebase.json sets cleanUrls:true, so /index.html 301s. -->
    <div class="mnav-head mexit-head"><span class="lbl">Marketplace</span></div>
    <a class="mexit" id="mexit" href="/" title="Leave the merchant workspace and shop on SOKONI">
      <span class="mexit-ico" aria-hidden="true">←</span>
      <span class="mexit-txt">SOKONI Marketplace</span>
    </a>
    <div class="mstatus">
      <div class="mchip"><span class="mdot" id="st-print"></span><span class="ctxt" id="st-print-t">Printer</span></div>
      <div class="mchip"><span class="mdot ok" id="st-sync"></span><span class="ctxt" id="st-sync-t">Online</span></div>
      <div class="mchip"><span class="mdot ok"></span><span class="ctxt" id="st-user">Merchant</span></div>
    </div>
  </aside>
  <div class="mscrim" id="mscrim" aria-hidden="true"></div>
  <div class="mmain">
    <header class="mtop">
      <button class="burger" id="burger" title="Toggle menu" aria-label="Toggle menu">☰</button>
      <div class="mtitle" id="mtitle">Dashboard</div>
      <div class="spacer"></div>
      <button class="mshop-btn" id="mshop-btn" onclick="__openMiniShop()" title="My MiniShop — your SOKONI storefront" aria-label="My MiniShop">
        <span class="mshop-ico">🏪</span>
        <span class="mshop-txt"><span class="mshop-l1">My MiniShop</span><span class="mshop-l2" id="mshop-state">Storefront</span></span>
      </button>
      <button class="mcmd-open" id="mcmd-open" title="Search & actions (Ctrl/⌘K)" aria-label="Search and actions">🔍<span class="kbd">⌘K</span></button>
      <div class="tchip"><span class="mdot" id="top-print"></span><span id="top-print-t">Printer</span></div>
    </header>
    <div class="mupdate" id="mupdate" hidden>
      <span class="mu-txt">🔄 A new version of SOKONI is available</span>
      <span class="mu-actions">
        <button class="mu-now" onclick="__mUpdateNow()">Update Now</button>
        <button class="mu-later" onclick="__mUpdateLater()">Later</button>
      </span>
    </div>
    <div class="mcontent" id="mcontent"></div>
  </div>
  <nav class="mbnav" id="mbnav" aria-label="Primary"></nav>
</div>

<!-- ⌘K command palette — search modules + quick actions; one launcher for the whole shell. -->
<div class="mcmd-ov" id="mcmd-ov" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="mcmd">
    <input class="mcmd-input" id="mcmd-input" type="text" placeholder="Search or jump to… (orders, finance, new sale)" autocomplete="off" spellcheck="false">
    <div class="mcmd-list" id="mcmd-list"></div>
  </div>
</div>

<!-- Printer engine loaded IN THE SHELL — the connection lives in this never-unloading context,
     so it is owned by the shell (not a module) and survives all navigation. -->
<script src="sokoni-universal-printer.js"></script>
<!-- Canonical "active product" predicate (archived excluded) — shared by reconcile + count tiles. -->
<script src="sokoni-product-visibility.js"></script>
<!-- Unified OrderService — one source of truth for orders (POS + marketplace + delivery). -->
<script src="sokoni-receipt-id.js"></script>
<script src="sokoni-order-service.js"></script>
<!-- AnalyticsEngine — one aggregation layer over OrderService (Dashboard=Reports=Finance=Analytics). -->
<script src="sokoni-analytics-engine.js"></script>
<!-- Sync backbone — the existing event bus + the merchant domain facade. One change
     (product/stock/availability/shop/order/payment/refund/customer) propagates to every
     module through the bus's same-origin BroadcastChannel; no per-page refresh calls. -->
<script src="sokoni-event-bus.js"></script>
<script src="sokoni-sync.js"></script>
<!-- AvailabilityService — canonical shop/product availability (reads shops/{uid} + products). -->
<script src="sokoni-availability.js"></script>
<!-- SokoniAnalytics — event ingestion + live shared analytics state (subscribes to SokoniSync,
     idempotent, drives Dashboard/Reports/Finance/Analytics without navigation). -->
<script src="sokoni-analytics.js"></script>
<!-- SokoniReconcile — commerce data-convergence status + idempotent reconciliation (canonical
     products vs POS/inventory caches; order sources vs unified view). -->
<script src="sokoni-reconcile.js"></script>
<!-- SokoniBranch — the canonical shop/branch switcher (reused, not rebuilt). The header
     brand button is its entry point; the active shop drives SokoniShell.activeShopId. -->
<script src="sokoni-branch.js"></script>
<!-- AUTH GUARD — the shell owns authentication for every module it hosts.
     merchant.html previously loaded NO guard while seller.html loaded one, so the only
     component enforcing a session was a hosted module — and its location.replace() swapped
     the CONTENT PANEL for a login form instead of navigating the tab. Guarding here fixes
     that inversion: an unauthenticated visitor goes to the real login flow before any module
     mounts, and hosted modules escalate to this frame rather than replacing themselves. -->
<script src="auth-guard.js"></script>
<!-- MERCHANT ROUTE CONTRACT (Phase 2A) — the ONE registry of merchant destinations.
     The sidebar, the mobile drawer, the bottom nav and the ⌘K palette are all
     projections of this file; none of them may hold a private list. Must load
     BEFORE the shell script, which reads it at definition time. -->
<script src="sokoni-merchant-routes.js"></script>
<script src="sokoni-merchant-capability.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   SOKONI Merchant Application Shell (R1.1)
   One page that loads ONCE. The sidebar/topbar/status never reload; clicking a
   module only swaps the content panel. Heavy legacy apps (POS, Seller Dashboard)
   are hosted in PERSISTENT panels created once and never destroyed — so the
   printer connection, auth, and Firestore listeners inside them survive every
   navigation (the whole point). Native modules replace these panels over time.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* Tell sw-register the shell owns the update UI, so it renders our integrated bar (below)
     instead of its own floating toast. Must be set before sw-register.js runs (it's deferred). */
  window.__sokoniShellHandlesUpdate = true;

  /* ── ROUTING (Phase 2A/2C) ──────────────────────────────────────────────────────
     The shell no longer declares its own module list. sokoni-merchant-routes.js is the
     single source of navigation; everything below is a PROJECTION of it. To add or
     retarget a destination, edit the contract — there is nowhere else to edit.

     kind: native (shell-rendered panel) | pos (persistent POS panel, `tab`)
           seller (persistent Seller panel, `sec`) | page (own persistent panel, `src`)

     Legacy field note: contract rows use `name`; this shell historically read `label`.
     We normalise once here rather than sprinkle `m.name || m.label` through the file. */
  var CONTRACT = window.SokoniMerchantRoutes;
  if (!CONTRACT) throw new Error('[merchant] route contract missing — sokoni-merchant-routes.js failed to load');
  /* Sidebar rows = contract order: primary tier, then a MORE divider, then the rest.
     Every row carries its canonical route id; nothing here invents a destination. */
  /* Sidebar rows = primary tier, then the `more` tier under its CONTRACT-DECLARED group
     headings (Main / Growth / Operations). The headings come from the contract's
     MORE_GROUPS, never from a list held here — this file stays a projection.
     The fallback keeps the old single-"More" divider if an older cached copy of the
     contract is served without moreGroups(), so a stale script degrades to the previous
     sidebar rather than to a sidebar missing 13 destinations. */
  /* ── CAPABILITY NEGOTIATION ──────────────────────────────────────────────────
     ONE registry, TWO shells. The contract states the PREFERRED way a destination
     mounts; it does NOT know what THIS shell can render. The certified registry
     prefers kind:'native' for eighteen routes and this shell has renderers for
     nine, so taken as an instruction it would open nine panels that mount and stay
     empty — renderNative()'s final `else` is a console.error with no render, which
     is a blank screen plus a line no merchant will ever read.

     So every route is resolved against what this shell can actually do:
       native     we have a renderer
       downgrade  we do not, but the destination exists as a legacy seller.js
                  section — mount that; the merchant gets there by the older road
       withhold   we do not, and there is no legacy equivalent (Sell and Inventory
                  are genuinely new). The route leaves navigation entirely so no
                  button can promise it, and a deep-link gets a NAMED panel — never
                  a blank, and never a silent bounce to Dashboard.

     This list MUST match renderNative() below. It is declared rather than derived
     because a running shell cannot read its own source — and it does not drift,
     because scripts/test-merchant-capability.js measures renderNative() by parsing
     it and asserts the two are equal. A renderer deleted without updating this line
     fails the gate. */
  var NATIVE_CAPABILITY = ['analytics','availability','dashboard','devices','orders',
                           'payments','reports','revenue','settings'];

  var CAP  = window.SokoniMerchantCapability;
  var CAPS = { native: {} };
  NATIVE_CAPABILITY.forEach(function (id) { CAPS.native[id] = true; });

  /* Resolve once. NEG[id] is the descriptor to MOUNT, not the descriptor declared. */
  var NEG = {};
  CONTRACT.ROUTES.forEach(function (r) {
    if (CAP) { NEG[r.id] = CAP.negotiate(r, CAPS); return; }
    /* Degraded path: a stale cache served the contract without the capability layer.
       Fail toward WITHHOLD, never toward blank — an absent destination is honest, an
       empty panel is not. No downgrade here: the legacy mapping lives in the layer
       and guessing it from the route id gets `tax`, `store` and `team` wrong. */
    NEG[r.id] = (r.kind === 'native' && !CAPS.native[r.id])
      ? { id: r.id, outcome: 'withhold', kind: null, name: r.name }
      : { id: r.id, outcome: 'native', kind: r.kind, sec: r.sec, src: r.src, tab: r.tab, name: r.name };
  });
  var withheld   = function (r)  { return NEG[r.id] && NEG[r.id].outcome === 'withhold'; };
  var withheldId = function (id) { return !!(NEG[id] && NEG[id].outcome === 'withhold'); };
  var offered  = function (list) { return (list || []).filter(function (r) { return !withheld(r); }); };

  var MODULES = offered(CONTRACT.primary());
  if (typeof CONTRACT.moreGroups === 'function') {
    CONTRACT.moreGroups().forEach(function (g) {
      var rows = offered(g.routes);
      if (!rows.length) return;
      MODULES.push({ head: g.label });
      rows.forEach(function (r) { MODULES.push(r); });
    });
  } else {
    MODULES.push({ head: 'More' });
    offered(CONTRACT.more()).forEach(function (r) { MODULES.push(r); });
  }
  MODULES = MODULES.map(function (r) { return r.head ? r : Object.assign({}, r, { label: r.name }); });
  /* byId must cover EVERY contract route, not just the ones rendered as sidebar rows.
     MODULES is the sidebar projection (primary + More). Building byId from it meant a
     tier:'hidden' route — My MiniShop, which is reached from the header button rather than a
     duplicated sidebar row — was absent, so go('minishop') found no module and crashed the
     shell on `m.label`. Render from MODULES; resolve from the whole contract. */
  var byId = {};
  CONTRACT.ROUTES.forEach(function (r) { if (r.id) byId[r.id] = Object.assign({}, r, { label: r.name }); });

     route keeps its identity (name/icon) so its panel can name itself instead of 404-ing. */
  CONTRACT.ROUTES.forEach(function (r) {
    var n = NEG[r.id]; if (!n || !byId[r.id]) return;
    if (n.outcome === 'downgrade')     byId[r.id] = Object.assign({}, byId[r.id], { kind: 'seller', sec: n.sec });
    else if (n.outcome === 'withhold') byId[r.id] = Object.assign({}, byId[r.id], { kind: 'unavailable' });

  var navEl   = document.getElementById('mnav');
  var content = document.getElementById('mcontent');

        primary sidebar destination and must not crowd the four-up bar. ── */
  /* The bottom nav is four slots, and each slot names its PREFERRED destination. If this
     shell withholds that destination the slot uses the contract's declared `fallback` —
     never a substitution invented here, and never a button left pointing at something that
     cannot mount, which would be the blank defect in the most prominent control in the app.
     A slot whose preferred route is withheld with NO usable fallback keeps its declared id
     so the failure is loud (the route gate asserts four working slots) rather than a
     silently missing button. */
  /* ── A FALLBACK MAY CHANGE THE DESTINATION. IT MAY NOT CHANGE THE IDENTITY ──
     This used to substitute the id alone:

         Object.assign({}, b, { id: b.fallback, preferred: b.id })

     Two lines below, the button is drawn from b.icon and b.label — which were
     still the PREFERRED route's. So when `sell` is withheld here (v1 has no Sell
     renderer) the till slot rendered a button reading "💳 Sell" that navigated to
     `pos`. The merchant pressed Sell and got POS, with nothing on screen able to
     tell them why.

     The contract already records the till-slot decision deliberately, "so it is
     visible and auditable rather than a substitution buried in a shell". The
     substitution was not buried — the LABEL was, and the label is what a person
     actually reads.

     When a shell can render Sell, the same slot says Sell and opens Sell; nothing
     here has to change for that to happen. */
  var BOTTOM_NAV = CONTRACT.BOTTOM_NAV.map(function (b) {

    if (b.fallback && !withheldId(b.fallback)) {
      var target = byId[b.fallback] || {};
      return Object.assign({}, b, {

        /* Present the DESTINATION's own identity, falling back to the slot's only
           if the registry somehow lacks one — a nameless button is worse than a
           slightly generic one. */
        label: target.label || target.name || b.label,
        icon:  target.icon || b.icon,

    el.innerHTML = '<span class="bi">' + b.icon + '</span><span class="bl">' + b.label + '</span>';

    Array.prototype.forEach.call(bnavEl.querySelectorAll('.mbnav-item'), function (n) {

  /* ── Persistent panel factory. Each POS/Seller app is created ONCE and kept. ── */
  var IFRAME_ALLOW = 'clipboard-write; payment; bluetooth; usb; serial; camera';

         the postMessage races the iframe boot. */

  }
  function sellerPanel (sec, label) {
    if (!panels.seller) {

         'overview' when Dashboard loads its feed. seller.js's DOMContentLoaded resets to overview
         AFTER the shell's one-shot showSection — so a seller route could show the overview body
         under the wrong title. Re-assert the requested section on the iframe's load event (which
         fires AFTER that reset), so the correct section wins. Belt-and-suspenders settle re-post. */

  /* Standalone-page modules (Dispatch, Riders) — each gets its own persistent panel, kept alive
     so it never reloads once opened. Per-module loader text. */
  function pagePanel (id, src, label, dynamic) {
    var key = 'page:' + id;
    if (!panels[key]) panels[key] = _mkFramePanel(label || 'module', src, null, label || '');
    else if (dynamic) {
      /* A dynamic module (My MiniShop) resolves its src at click time — update the cached
         iframe if it changed (e.g. after a branch switch) so it never shows a stale shop. */
      var f = panels[key].querySelector('iframe');
      if (f && src && f.getAttribute('src') !== src) { panels[key].classList.remove('loaded'); f.setAttribute('src', src); }
    }
    return panels[key];
  }
  /* Build a persistent iframe panel with a non-blocking loader that hides on iframe load.
     Attaching onload in JS (not inline) keeps the app JS quoting clean. */
  function _mkFramePanel (loaderText, src, frameId, title) {
    var p = document.createElement('div'); p.className = 'mpanel';
    var load = document.createElement('div'); load.className = 'dloading';
    /* Premium skeleton: a header line, a KPI card row, and a few body lines — shimmering — with
       the module name subtly labelled. Feels far better than a spinner while a heavy app loads. */
    load.innerHTML =
      '<div class="sk-line" style="width:32%;height:20px;margin-bottom:20px"></div>' +
      '<div class="sk-cardrow"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>' +
      '<div class="sk-line" style="width:88%"></div>' +
      '<div class="sk-line" style="width:76%"></div>' +
      '<div class="sk-line" style="width:82%"></div>' +
      '<div class="sk-line" style="width:64%"></div>' +
      '<div class="sk-label">Loading ' + loaderText + '…</div>';

      content.appendChild(p); panels['native:' + id] = p;

  function showOnly (panel) {
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('show', panels[k] === panel); });
  }

  /* ── postMessage deep-switch into the persistent apps ── */
  /* ── Verified deep-switch ────────────────────────────────────────────────────
     The POS and Seller panels are PERSISTENT and SHARED by several routes, and the Seller
     panel is pre-created at 'overview' when the Dashboard loads its feed. A single
     fire-and-forget postMessage therefore loses races it cannot detect: if the hosted app has
     not finished booting, or is mid-reset, the message is dropped and the merchant is left
     looking at whatever the panel showed before.

     That is exactly the reported "Products opens the Home/Dashboard page" — Products posts
     showSection('products'), the message lands before seller.js is ready, seller.js then
     resets to overview, and overview IS the seller home page. The previous fix re-asserted on
     the iframe's `load` event, which never fires again once the panel is already loaded — so
     it only helped the very first navigation.

     state actually applied, and re-post until it does (bounded). `verify` reads the iframe's

  var _dsGen = {};
  function _deepSwitch (frameId, msg, verify, label) {
    /* ~10s at 250ms. "Longer than any observed boot" was measured on an idle machine; under a
       four-viewport acceptance run — and, more to the point, on a mid-range phone on mobile
       data — a hosted module can still be booting at 5s. The retry then gave up and logged
       "the panel may be showing the wrong section" while the section was in fact fine, which is
       a false alarm reported to the seller's console as a defect. The ASSERTION is unchanged:
       the switch must still be confirmed from the hosted DOM, and the loop still gives up and
       says so rather than assuming success. It simply waits as long as a slow device needs. */
    /* ONE LIVE SWITCH PER FRAME. A newer navigation supersedes an older one.
       Without this every navigation started its own retry loop and none of them ever
       stopped: each loop re-posts its OWN section every 250ms for up to 10s, so walking
       four routes in quick succession left four loops fighting over the same panel.
       Captured in the gate — four loops, one module, cycling every ~260ms:

         t=18944 -> messages   t=19202 -> messages   t=19463 -> messages
         t=18946 -> receipts   t=19202 -> receipts   t=19463 -> receipts
         t=18992 -> stories    t=19248 -> stories    t=19509 -> stories
         t=19054 -> customers  t=19310 -> customers  t=19575 -> customers

       and the module obeying each in turn, its visible section flipping every ~60ms:
         19509 [receipts-section] 19570 [stories-section] 19632 [customers-section] ...

       Every loop's verify() then failed — because a rival loop had just overwritten its
       section — so none could confirm, all retried to MAX, and the panel never settled.
       The merchant saw a section that would not stay put; the suite saw whichever route
       was on screen when its 20s cap expired, which is why the failing route moved.
       It needs the previous loop to still be inside its 10s window when the next click
       lands, which is why it surfaced under load and not standalone. */
    var gen = (_dsGen[frameId] = (_dsGen[frameId] || 0) + 1);
    var tries = 0, MAX = 40, STEP = 250;
    function attempt () {
      if (_dsGen[frameId] !== gen) return;      /* superseded — a newer switch owns this frame */
      var f = document.getElementById(frameId);
      if (!f || !f.contentWindow) return;
      try { f.contentWindow.postMessage(msg, location.origin); } catch (_) {}
      tries++;
      setTimeout(function () {
        if (_dsGen[frameId] !== gen) return;   /* superseded mid-flight — stay silent */
        var applied = false;
        try { applied = verify(f); } catch (_) { applied = false; }   /* not readable yet */
        if (!applied) {
          if (tries >= MAX) {
            console.error('[merchant] deep-switch to "' + label + '" was never confirmed by the module ' +
                          'after ' + tries + ' attempts — the panel may be showing the wrong section.');
            return;
          }
          return attempt();
        }
        /* CONFIRM IT STUCK. Observing the right state once is not enough on a booting module:
           seller.js resets to 'overview' as part of its own start-up, so a switch could verify
           during the gap and then be silently overwritten a moment later — which is exactly the
           first-navigation case where Products briefly appeared and then showed the home page.
           Re-check after a settle delay and resume retrying if it regressed. */
        setTimeout(function () {
          if (_dsGen[frameId] !== gen) return; /* superseded mid-flight — stay silent */
          var still = false;
          try { still = verify(f); } catch (_) { still = false; }
          if (still || tries >= MAX) {
            if (!still) {
              console.error('[merchant] deep-switch to "' + label + '" was overwritten by the module ' +
                            'after being applied, and could not be re-established.');
            }
            return;
          }
          attempt();
        }, 700);
      }, STEP);
    }
    attempt();
  }

  /* Cashier is the checkout ALONE; every other POS-backed route keeps the app's tab bar.
     Set on the hosted document so the CSS applies before the tab switch paints, and cleared
     again for the other routes since the panel is shared and persistent. */
  function posChrome (mode) {
    var f = document.getElementById('mfx-pos');
    try {
      var d = f && f.contentDocument; if (!d || !d.documentElement) return;
      if (mode) d.documentElement.setAttribute('data-pos-chrome', mode);
      else      d.documentElement.removeAttribute('data-pos-chrome');
    } catch (_) { /* not readable yet — reapplied on the next switch */ }
  }

  function posSwitch (tab) {
    /* Confirmed when the POS marks that tab active. pos.html renders tabs with
       data-tab + aria-selected, so this reads the app's own state, not our expectation. */
    _deepSwitch('mfx-pos', { __sokoniShell: true, action: 'switchTab', tab: tab }, function (f) {
      var d = f.contentDocument; if (!d) return false;
      var el = d.querySelector('[data-tab="' + tab + '"]');
      if (!el) return false;

    var f = document.getElementById('mfx-pos');

    try { setTimeout(function () { f && f.contentWindow && f.contentWindow.postMessage({ __sokoniShell: true, action: act }, location.origin); }, 250); } catch (_) {}
  }
  function sellerSwitch (sec) {
    /* Confirmed by reading seller.html's OWN section visibility. seller.js's showDashPage
       reveals the sections listed in DASH_PAGES[sec] and hides the rest, so if the first
       section for this page is visible the switch genuinely landed. Verifying the sidebar's
       active class instead would only prove we asked, not that the body changed. */
    /* show: a section that belongs to THIS page and is NOT in overview.
       hide: a section overview shows but this page does not.
       Both are required, because several pages overlap overview — verifying only
       'upload-section' for products would report success while overview was on screen,
       which is precisely the bug being fixed. Pages whose sections are a subset of
       overview's (flash) rely on the hide half to tell them apart. Ids verified present
       in seller.html; sets taken from seller.js DASH_PAGES. */
    var MARK = {
      products:  { show: 'bulk-upload-section', hide: 'seller-stats' },
      receipts:  { show: 'receipts-section',    hide: 'seller-stats' },
      team:      { show: 'team-section',        hide: 'seller-stats' },
      messages:  { show: 'seller-dms',          hide: 'seller-stats' },
      marketing: { show: 'marketing-section',   hide: 'seller-stats' },
      stories:   { show: 'stories-section',     hide: 'seller-stats' },
      disputes:  { show: 'disputes-section',    hide: 'seller-stats' },
      customers: { show: 'customers-section',   hide: 'seller-stats' },
      store:     { show: 'store-section',       hide: 'seller-stats' },
      tax:       { show: 'tax-section',         hide: 'seller-stats' },
      flash:     { show: 'flash-section',       hide: 'seller-stats' },

  var _lastModule = 'dashboard';
  var _booted = false;   /* first go() replaces the history entry; every later one pushes */

    /* Resolve through the contract: canonical id, or a legacy alias (#finance -> revenue).

       worked. Fail loudly, stay put, and leave the current module untouched. */

       after `current` is set, the title is swapped and the route hash is pushed — leaves
       "#home" in the history of a page we are navigating away from. The merchant then presses

       no integration layer to build one on — so it hands the merchant to the
       shell that already hosts the certified module, rather than substituting
       POS into the slot. Sell reaches Sell.

       Deliberately placed with the exit branch and returning BEFORE any state
       below runs, for the same reason exits do: setting `current`, swapping the
       title and pushing the hash would leave "#sell" in the history of a page we
       are navigating away from, and Back would resolve it and bounce again.

       here; this is not a redirect for anything that works locally. */
    if (m.crossShell && withheldId(id)) {

         Tapping Sell from another route is safe: this returns before the hash
         is pushed, so the URL still reads (say) #dashboard, and Back from v2
         lands there and mounts normally.

         ARRIVING at /merchant#sell is not safe. A bookmark, a shared link, or
         Back from v2 itself would boot the router on that hash, assign again,
         and Back could never re-enter this shell — the exact bounce loop the
         exit branch above documents.

       PUSHES an entry, so back/forward walk the routes the merchant actually visited; only
       the initial boot (and hash normalisation of an alias) replaces, so we never leave a

       hashchange listener below resolves and mounts the route. */

         and must not fall through to the static src. It did — and the static src for MiniShop

  function renderNative (id) {

    else if (id === 'devices') renderDevices();
    else if (id === 'orders') renderOrders();
    else if (id === 'settings') renderSettingsHub();
    else if (id === 'payments') renderPayments();
    else if (id === 'reports' || id === 'revenue' || id === 'analytics') renderAnalytics(id);

       an empty panel would be exactly the "button silently fails" defect. Never invent
       figures to fill the space (CLAUDE.md: UI Data Integrity). */

  /* ── Payments — the merchant's money-out surface ─────────────────────────────

  var _payTab = 'payouts';
  window.__payTab = function (t) { _payTab = t; renderPayments(); };
  function renderPayments () {

    Promise.all([

      fns.httpsCallable('getPayoutHistory')({ limit: 20 }).catch(function (e) { return { __err: e }; })

      if (Array.isArray(list) && list.length) {

          var when = p.createdAt || p.requestedAt || p.updatedAt || '';

          return '<div class="an-row"><span>' + _ordEsc(String(when || '—')) + ' · ' +

  var _anRange = { reports: 'week', revenue: 'month', analytics: 'all' };

  /* KASS Shop Sync trace (source → sync → OrderService → Analytics). Reads the live feed
     counts + the unified OrderService + the ingestion diagnostics — proof, not assumption. */
  window.__anSyncTrace = function () {
    var host = document.getElementById('an-trace'); if (!host) return;
    if (!window.SokoniOrderService || !SokoniOrderService.diagnose) { host.innerHTML = '<div class="an-empty">OrderService not loaded on this device.</div>'; return; }
    host.innerHTML = '<div class="sk-line" style="width:60%"></div>';
    var branch = (window.SokoniShell && SokoniShell.activeShopId) || null;
    Promise.resolve(SokoniOrderService.diagnose({ range: 'all', tab: 'all', branchId: branch })).then(function (r) {
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
      /* found → accepted, with a ✓ only when NONE were dropped for that source. */
      function srcRow (label, sec) {
        var okk = sec.fetched > 0 && sec.accepted === sec.fetched;
        var mark = sec.fetched === 0 ? '' : (okk ? ' <span style="color:var(--acc)">✓</span>' : ' <span style="color:#ff5c5c">✗ ' + (sec.fetched - sec.accepted) + ' dropped</span>');
        return '<div class="an-row"><span>' + label + '</span><span>' + sec.fetched + ' → ' + sec.accepted + mark + '</span></div>';
      }
      /* Expose EVERY rejection with its reason — never a bare found→0. */
      var rejects = [].concat(r.marketplace.rejected, r.posBackend.rejected, r.pos.rejected);
      var rejHtml = '';
      if (rejects.length) {
        rejHtml = '<div class="an-sec" style="color:#ff5c5c">Rejected (' + rejects.length + ') — reason exposed, not dropped silently</div>' +
          rejects.slice(0, 30).map(function (x) {
            return '<div class="an-row" style="align-items:flex-start"><span style="font-family:monospace;font-size:11px">' + esc(x.id) + '</span>' +
              '<span style="text-align:right;max-width:62%;font-size:11px;color:#ffb4b4">' + esc(x.reason) + (x.branchId ? '<br>branch=' + esc(x.branchId) : '') + '</span></div>';
          }).join('') + (rejects.length > 30 ? '<div class="an-note">…' + (rejects.length - 30) + ' more</div>' : '');
      }
      var b = r.boundaries;

    window.__miniShopDiag = function () { try { return _diagText(); } catch (e) { return String(e); } };

    function _diag () {
      /* A previously rendered strip can survive a soft navigation within the shell, so
         retire any node this build inherited instead of leaving it stranded on screen. */
      try {
        var stale = document.getElementById('mshop-diag');
        if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
      } catch (_) {}
    }

    /* IN-SHELL navigation — routes to the 'minishop' page module (same /merchant document,
       same tab, no window.open, no full-page leave, shell panel transition not a splash).
       Claimed → storefront /shop/<handle>; unclaimed → claim flow. Resolves first if needed so
       the panel loads the right src immediately. */
    function _go () {
      var router = window.__mgo || (window.SokoniShell && window.SokoniShell.go);
      /* No location.href fallback: leaving /merchant is a contract violation, and the old
         escape hatch turned a router bug into a full-page navigation that silently dropped
         the merchant out of the shell. If the router is genuinely missing the shell is
         broken — say so, and stay put. */
      if (!router) { console.error('[merchant] MiniShop: router unavailable — staying in shell'); return; }
      try { router('minishop'); } catch (e) { console.error('[merchant] MiniShop navigation failed', e); }
    }
    window.__openMiniShop = function () {
      if (_mshop.resolved) { _go(); return; }
      _resolve().then(function () { _paint(); _go(); });
    };
    window.__refreshMiniShop = function () { _resolve().then(function () { _paint(); _diag(); if (current === 'minishop') { try { window.__mgo('minishop'); } catch (_) {} } }); };
    /* NO TIMER DECIDES THE ANSWER — but the answer need not compete for the boot.
       The old `setTimeout(refresh, 700)` raced Auth and lost, and losing meant "unclaimed": the
       reload bug. _resolve now waits on the Auth EVENT, so correctness no longer depends on
       when this starts. Starting it synchronously, however, put a module import and four
       Firestore round-trips on the critical path, competing with the panel the merchant is
       actually waiting for — deep-switch confirmations started missing their window.

       So: kick it off when the shell is idle. Ownership is header chrome, not the route. The
       fallback timer is a ceiling, not the mechanism — browsers without requestIdleCallback
       still resolve, and the Auth event still decides the answer whenever it arrives. */
    (function () {
      var started = false;
      var start = function () { if (started) return; started = true; window.__refreshMiniShop(); };
      if (typeof requestIdleCallback === 'function') requestIdleCallback(start, { timeout: 2500 });
      else setTimeout(start, 300);
    })();
    document.addEventListener('soBranchChanged', function () { _mshop.resolved = false; window.__refreshMiniShop(); });
  })();

  window.__mgo = go;
  /* Hash is the route. Resolve through the contract (not byId) so a LEGACY alias in the
     URL — a bookmark on #finance, an old deep link on #team — still lands on its canonical
     module. Gating on byId alone silently ignored every alias, because aliases are not
     route keys. An id that resolves to nothing is left to go() to refuse loudly. */
  window.addEventListener('hashchange', function () {
    var raw = location.hash.replace('#', '');
    if (!raw) return;
    var id = CONTRACT.resolve(raw);
    if (id && id !== current) go(id);
    else if (id && id !== raw) {
      /* Already on the route this alias resolves to, so there is nothing to mount — but the URL
         still says `#inventory`, a name the contract no longer has. go() normalises the hash as
         part of navigating; when no navigation happens nothing did, so a legacy hash could
         survive indefinitely and be refreshed, shared or bookmarked. Normalise in place. */
      try { history.replaceState({ sokoniRoute: id }, '', '#' + id); } catch (_) {}
    }
    else if (!id) console.error('[merchant] unknown route in URL hash: "' + raw + '"');
  });

  /* Boot */
  paintStatus();
  /* go() already rewrites the hash to the canonical route id, so a boot on the legacy
     `#inventory` / `#cashier` alias lands on POS and the URL says `#pos`. Verified by probe,
     not assumed. The only gap was an alias arriving when its target route is ALREADY current —
     no navigation, so nothing normalised it; the hashchange listener above now handles that. */
  var boot = CONTRACT.resolve(location.hash.replace('#', ''));

  /* Never BOOT an exit. Landing on /merchant#home means "open the shell", not "leave it
     again immediately" — obeying it would send the merchant straight back out, and pressing
     Back from there would re-enter the same hash and bounce forever. An exit is a thing the
     merchant taps, never a state the shell restores itself into. */
  if (boot && byId[boot] && byId[boot].kind === 'exit') boot = null;

  /* Back must be deterministic, and it was not. go() replaces on the first navigation, so a
     merchant arriving DIRECTLY on a deep link — /merchant#shop from a notification, a
     bookmark, a shared link — got a single history entry. Back from there left SOKONI
     entirely. The same route reached from inside the shell (Home -> Shop) has a pushed entry
     and Back returns to Home. Identical screen, opposite behaviour, decided by how the
     merchant happened to arrive: the definition of non-deterministic.

     Seeding Merchant Home UNDERNEATH a direct deep link makes the two arrivals converge —
     Back is "up to Merchant Home" in both. It deliberately relaxes the "never leave a first
     entry the merchant did not choose" rule in go(): the seeded entry is Home, the one
     destination every merchant workspace is entitled to fall back to, which is a better
     answer than dropping them out of the application.

     _booted is set so go() PUSHES the deep-linked route on top of the seed instead of
     replacing it — without that, go() would overwrite the entry we just created and nothing
     would change. */
  if (boot && boot !== 'dashboard') {
    try {
      history.replaceState({ sokoniRoute: 'dashboard' }, '', '#dashboard');
      _booted = true;
    } catch (_) { /* history unavailable — boot normally, Back stays as it was */ }
  }
  go(boot || 'dashboard');

  /* (Printer auto-reconnect on app open is now owned by the shell's own engine above — no need
     to warm the POS host for the printer.) */
})();
</script>
<script src="/sw-register.js" defer></script>
</body>
</html>
