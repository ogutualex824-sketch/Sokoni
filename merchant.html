<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOKONI Merchant OS</title>
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --bg:#050505; --panel:#0a0a0a; --card:#0d0d0d; --line:rgba(255,255,255,.08);
    --txt:#fff; --txt2:rgba(255,255,255,.55); --txt3:rgba(255,255,255,.35); --acc:#71ff00;
    --rail:224px; --rail-collapsed:64px; --top:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;overflow:hidden}

  .mshell{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:100vh;
    transition:grid-template-columns .22s cubic-bezier(.2,.7,.3,1)}
  .mshell.collapsed{grid-template-columns:var(--rail-collapsed) 1fr}

  /* ── Sidebar ── */
  .mrail{background:linear-gradient(180deg,#0b0b0b,#070707);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .mbrand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;min-height:var(--top);
    border-bottom:1px solid var(--line)}
  /* Brand logo — transparent PNG, no background box */
  .mbrand .logo{height:30px;width:auto;max-width:120px;object-fit:contain;background:none;
    border-radius:0;flex:0 0 auto;display:block}
  .mshell.collapsed .mbrand .logo{max-width:40px}
  .mbrand .name{font-weight:900;letter-spacing:.02em;white-space:nowrap;font-size:15px}
  .mshell.collapsed .mbrand .name{opacity:0;width:0}
  .mnav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    cursor:pointer;color:var(--txt2);font-size:13.5px;font-weight:700;white-space:nowrap;
    transition:background .14s,color .14s;user-select:none}
  .mnav-item .ico{font-size:18px;flex:0 0 22px;text-align:center}
  .mnav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .mnav-item.active{background:rgba(113,255,0,.12);color:var(--acc)}
  .mshell.collapsed .mnav-item .lbl{opacity:0;width:0;overflow:hidden}
  .mnav-sep{height:1px;background:var(--line);margin:8px 12px}
  .mnav-head{padding:14px 14px 6px;font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--txt3);white-space:nowrap}
  .mshell.collapsed .mnav-head{opacity:0;height:6px;padding:3px 0;overflow:hidden}

  .mstatus{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px}
  .mchip{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap}
  .mdot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
  .mdot.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
  .mdot.bad{background:#ff6464}
  .mshell.collapsed .mchip .ctxt{opacity:0;width:0;overflow:hidden}

  /* ── Main ── */
  .mmain{display:flex;flex-direction:column;min-width:0;min-height:0}
  .mtop{height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;gap:12px;
    padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .mtop .burger{background:none;border:1px solid var(--line);color:var(--txt2);width:34px;height:34px;
    border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mtop .burger:hover{color:var(--txt);border-color:rgba(113,255,0,.4)}
  .mtitle{font-weight:800;font-size:15px}
  .mtop .spacer{flex:1}
  .mtop .tchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt2);
    padding:6px 11px;border:1px solid var(--line);border-radius:20px}
  .mtop .tchip .mdot{width:7px;height:7px}

  /* Integrated update bar — full width, below the top bar, pushes content (never overlaps).
     Singleton by construction (one #mupdate element in the shell). */
  .mupdate{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 16px;
    background:linear-gradient(90deg,rgba(113,255,0,.14),rgba(113,255,0,.06));
    border-bottom:1px solid rgba(113,255,0,.28);color:var(--txt);font-size:13px;font-weight:700}
  .mupdate[hidden]{display:none}
  .mu-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-actions{display:flex;gap:8px;flex:0 0 auto}
  .mupdate button{border-radius:9px;padding:7px 14px;font-weight:800;font-size:12.5px;cursor:pointer;border:1px solid}
  .mu-now{background:var(--acc);color:#000;border-color:var(--acc)}
  .mu-later{background:transparent;color:var(--txt2);border-color:var(--line)}
  .mu-later:hover{color:var(--txt)}

  .mcontent{flex:1;position:relative;min-height:0;background:var(--bg)}
  .mpanel{position:absolute;inset:0;display:none}
  .mpanel.show{display:block}
  /* iframe is absolutely positioned so it stacks ABOVE the loading overlay (which is also
     absolute). Without this the transparent "Loading…" layer sat on top of every module and
     swallowed all clicks + scroll — the reported "buttons unresponsive / pages don't scroll". */
  .mpanel iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:var(--bg);z-index:1}
  /* Smooth, no-flash module transition when a panel becomes active. */
  .mpanel.show{animation:mPanelIn .24s cubic-bezier(.2,.7,.3,1) both}
  @keyframes mPanelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Premium skeleton loader — shimmer placeholders instead of "Loading…" text. Never blocks
     interaction; hides once the iframe reports loaded. */
  .dloading{position:absolute;inset:0;padding:22px;pointer-events:none;z-index:0;overflow:hidden}
  .mpanel.loaded .dloading{display:none}
  .sk-line{height:14px;border-radius:7px;margin-bottom:12px;
    background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 37%,rgba(255,255,255,.05) 63%);
    background-size:400% 100%;animation:skShim 1.25s ease-in-out infinite}
  .sk-cardrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:18px 0}
  .sk-card{height:88px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.10) 37%,rgba(255,255,255,.04) 63%);
    background-size:400% 100%;animation:skShim 1.25s ease-in-out infinite}
  @keyframes skShim{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk-label{position:absolute;bottom:22px;left:22px;font-size:11.5px;color:var(--txt3);font-weight:700;letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){.mpanel.show{animation:none}.sk-line,.sk-card{animation:none}}
  .mpanel .native{position:absolute;inset:0;overflow-y:auto;padding:22px;z-index:2}

  /* Native dashboard */
  .dwrap{max-width:1100px;margin:0 auto}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .dcard{background:linear-gradient(158deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--card);
    border:1px solid var(--line);border-radius:18px;padding:18px 16px;position:relative;overflow:hidden}
  .dcard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(113,255,0,.7),transparent)}
  .dcard .n{font-size:26px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
  .dcard .l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  /* Phone: swipeable KPI cards — a horizontal scroll-snap rail, large-but-compact,
     next card peeking to signal there's more. Desktop keeps the responsive grid. */
  @media (max-width:560px){
    .dgrid{display:flex;grid-template-columns:none;overflow-x:auto;gap:12px;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin:0 -16px 20px;padding:2px 16px 6px}
    .dgrid::-webkit-scrollbar{display:none}
    .dcard{flex:0 0 46%;scroll-snap-align:start;padding:16px 14px}
    .dcard .n{font-size:23px}
  }
  .dsec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:0 2px 12px}
  .dbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(113,255,0,.12);border:1px solid rgba(113,255,0,.3);
    color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none}
  .dbtn.ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--txt2)}
  /* Devices page */
  .dev-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .dev-row{display:flex;align-items:center;gap:14px}
  .dev-ico{font-size:30px;flex:0 0 auto}
  .dev-name{font-weight:800;font-size:15px}
  .dev-sub{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2);margin-top:3px}
  .dev-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .dev-note{font-size:11.5px;color:var(--txt3);line-height:1.55;margin-top:12px}
  .dev-soon{opacity:.6}
  /* Native Orders module */
  .ord2-wrap{max-width:900px;margin:0 auto}
  .ord2-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:14px}
  .ord2-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
  .ord2-stat-n{font-size:17px;font-weight:900;color:var(--acc);line-height:1.1}
  .ord2-stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .ord2-rangebar,.ord2-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .ord2-rangebar::-webkit-scrollbar,.ord2-tabs::-webkit-scrollbar{display:none}
  .ord2-chip,.ord2-tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt2);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .ord2-chip.active,.ord2-tab.active{background:rgba(113,255,0,.12);border-color:rgba(113,255,0,.4);color:var(--acc)}
  .ord2-search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 14px;font-size:14px;outline:none;margin:4px 0 10px;font-family:inherit}
  .ord2-list{display:flex;flex-direction:column;gap:10px}
  .ord2-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .14s,transform .12s}
  .ord2-card:hover{border-color:rgba(113,255,0,.35);transform:translateY(-1px)}
  .ord2-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .ord2-card-id{font-weight:800;font-size:14px}
  .ord2-card-sub{font-size:11.5px;color:var(--txt2);margin-top:2px}
  .ord2-card-amt{font-weight:900;font-size:15px}
  .ord2-card-when{font-size:10.5px;color:var(--txt3);margin-top:2px;white-space:nowrap}
  .ord2-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ord2-pay{font-size:11px;color:var(--txt2)}
  .ord2-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px}
  .ord2-ok{background:rgba(113,255,0,.13);color:var(--acc)} .ord2-warn{background:rgba(255,180,0,.14);color:#ffb400} .ord2-bad{background:rgba(255,80,80,.14);color:#ff6464}
  .ord2-empty{text-align:center;color:var(--txt2);padding:40px 20px}
  .ord2-note{font-size:12px;color:var(--txt3);margin-top:8px}
  .ord2-drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;justify-content:flex-end}
  .ord2-drawer{width:100%;max-width:420px;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:ord2In .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes ord2In{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  .ord2-dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
  .ord2-dtitle{font-weight:900;font-size:16px} .ord2-dsub{font-size:12px;color:var(--txt2);margin-top:4px;display:flex;gap:7px;align-items:center}
  .ord2-dclose{background:none;border:none;color:var(--txt2);font-size:16px;cursor:pointer}
  .ord2-dbody{padding:16px;overflow-y:auto;flex:1}
  .ord2-drow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;color:var(--txt)}
  .ord2-drow span:first-child{color:var(--txt2)}
  .ord2-dtotal{font-weight:900;font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
  .ord2-dbody hr{border:none;border-top:1px solid var(--line);margin:10px 0}
  .ord2-dsec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:16px 0 10px}
  .ord2-tl{position:relative}
  .ord2-tl-row{display:flex;gap:12px;padding-bottom:14px;position:relative}
  .ord2-tl-row:not(:last-child)::before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
  .ord2-tl-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);flex:0 0 auto;margin-top:2px}
  .ord2-tl-dot.now{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .ord2-tl-t{font-size:13px;font-weight:700} .ord2-tl-at{font-size:11px;color:var(--txt3);margin-top:1px}
  .ord2-dfoot{padding:14px 16px;border-top:1px solid var(--line)}
  .ord2-dfoot .dbtn{width:100%;justify-content:center}
  /* Native Reports / Finance / Analytics */
  .an-wrap{max-width:820px;margin:0 auto}
  .an-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .an-title{font-size:18px;font-weight:900}
  .an-range{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .an-range::-webkit-scrollbar{display:none}
  .an-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:8px}
  .an-stat{background:linear-gradient(158deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center}
  .an-stat-n{font-size:19px;font-weight:900;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums}
  .an-stat-l{font-size:10.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:5px}
  .an-sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:20px 2px 10px}
  .an-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
  .an-row span:first-child{color:var(--txt2)}
  .an-empty{color:var(--txt3);font-size:12.5px;padding:10px 2px}
  .an-note{font-size:11.5px;color:var(--txt3);margin-top:14px;line-height:1.5}
  .an-trace{font-size:10.5px;color:var(--txt3);margin-top:22px;padding-top:12px;border-top:1px solid var(--line);opacity:.7}

  /* Drawer scrim — tap outside the open rail to dismiss it (mobile only). */
  .mscrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49;opacity:0;
    pointer-events:none;transition:opacity .22s}
  /* Mobile bottom navigation — primary destinations one tap away (desktop: hidden). */
  .mbnav{display:none}
  @media (max-width:820px){
    :root{--rail:200px}
    .mshell{grid-template-columns:0 1fr}
    .mshell.mobile-open{grid-template-columns:var(--rail) 1fr}
    .mrail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:50;
      transform:translateX(-100%);transition:transform .22s}
    .mshell.mobile-open .mrail{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.6)}
    .mshell.mobile-open .mscrim{opacity:1;pointer-events:auto}
    /* leave room so fixed bottom-nav never covers content or the last action */
    .mcontent{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
    .mbnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:48;
      background:linear-gradient(180deg,#0b0b0b,#070707);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
    .mbnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      background:none;border:0;color:var(--txt2);font-family:inherit;cursor:pointer;
      padding:6px 2px;min-height:52px;border-radius:12px;transition:color .15s,background .15s}
    .mbnav-item .bi{font-size:20px;line-height:1}
    .mbnav-item .bl{font-size:10px;font-weight:700;letter-spacing:.02em}
    .mbnav-item.active{color:var(--acc);background:rgba(113,255,0,.10)}
    .mbnav-item:active{background:rgba(255,255,255,.06)}
  }
</style>
</head>
<body>
<div class="mshell" id="mshell">
  <aside class="mrail">
    <div class="mbrand"><img class="logo" src="assets/logosokoni.png" alt="SOKONI"><div class="name">SOKONI</div></div>
    <nav class="mnav" id="mnav"></nav>
    <div class="mstatus">
      <div class="mchip"><span class="mdot" id="st-print"></span><span class="ctxt" id="st-print-t">Printer</span></div>
      <div class="mchip"><span class="mdot ok" id="st-sync"></span><span class="ctxt" id="st-sync-t">Online</span></div>
      <div class="mchip"><span class="mdot ok"></span><span class="ctxt" id="st-user">Merchant</span></div>
    </div>
  </aside>
  <div class="mscrim" id="mscrim" aria-hidden="true"></div>
  <div class="mmain">
    <header class="mtop">
      <button class="burger" id="burger" title="Toggle menu" aria-label="Toggle menu">☰</button>
      <div class="mtitle" id="mtitle">Dashboard</div>
      <div class="spacer"></div>
      <div class="tchip"><span class="mdot" id="top-print"></span><span id="top-print-t">Printer</span></div>
    </header>
    <div class="mupdate" id="mupdate" hidden>
      <span class="mu-txt">🔄 A new version of SOKONI is available</span>
      <span class="mu-actions">
        <button class="mu-now" onclick="__mUpdateNow()">Update Now</button>
        <button class="mu-later" onclick="__mUpdateLater()">Later</button>
      </span>
    </div>
    <div class="mcontent" id="mcontent"></div>
  </div>
  <nav class="mbnav" id="mbnav" aria-label="Primary"></nav>
</div>

<!-- Printer engine loaded IN THE SHELL — the connection lives in this never-unloading context,
     so it is owned by the shell (not a module) and survives all navigation. -->
<script src="sokoni-universal-printer.js"></script>
<!-- Unified OrderService — one source of truth for orders (POS + marketplace + delivery). -->
<script src="sokoni-order-service.js"></script>
<!-- AnalyticsEngine — one aggregation layer over OrderService (Dashboard=Reports=Finance=Analytics). -->
<script src="sokoni-analytics-engine.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   SOKONI Merchant Application Shell (R1.1)
   One page that loads ONCE. The sidebar/topbar/status never reload; clicking a
   module only swaps the content panel. Heavy legacy apps (POS, Seller Dashboard)
   are hosted in PERSISTENT panels created once and never destroyed — so the
   printer connection, auth, and Firestore listeners inside them survive every
   navigation (the whole point). Native modules replace these panels over time.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* Tell sw-register the shell owns the update UI, so it renders our integrated bar (below)
     instead of its own floating toast. Must be set before sw-register.js runs (it's deferred). */
  window.__sokoniShellHandlesUpdate = true;

  /* Module registry. kind:
       'native' — rendered by a JS function into the panel (instant, no reload)
       'pos'    — the single persistent POS app panel; `tab` deep-switches its tab
       'seller' — the single persistent Seller Dashboard panel; `sec` deep-switches its section */
  /* MODULE REGISTRY — the union of the old Seller Dashboard + the Merchant OS. One destination
     per button. kind: native | pos (Checkout app) | seller (Seller app section) | page (its own
     page). Only genuinely-POS surfaces load the POS bundle. Seller `sec` keys MUST match
     seller.js DASH_PAGES exactly; page `src` must be a real file. No dead links. */
  var MODULES = [
    { id:'dashboard', label:'Dashboard', icon:'🏠', kind:'native' },

    { head:'Commerce' },
    { id:'cashier',   label:'Cashier',   icon:'💳', kind:'pos',    tab:'pos' },
    { id:'orders',    label:'Orders',    icon:'🧾', kind:'native' },
    { id:'products',  label:'Products',  icon:'🏷️', kind:'seller', sec:'products' },
    { id:'inventory', label:'Inventory', icon:'📦', kind:'pos',    tab:'inventory' },
    { id:'customers', label:'Customers', icon:'👥', kind:'seller', sec:'customers' },
    { id:'shop',      label:'Shop Dashboard', icon:'🏪', kind:'seller', sec:'overview' },

    { head:'Fulfillment' },

    var timeline = (o.events || []).map(function (e, idx, arr) {
      var last = idx === arr.length - 1;
      return '<div class="ord2-tl-row"><div class="ord2-tl-dot ' + (last ? 'now' : '') + '"></div><div class="ord2-tl-body"><div class="ord2-tl-t">' + (LBL[e.type] || e.type) + '</div><div class="ord2-tl-at">' + (e.at ? _ordWhen(e.at) : '') + '</div></div></div>';
    }).join('');
    var ov = document.createElement('div'); ov.className = 'ord2-drawer-ov';
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
    ov.innerHTML =
      '<div class="ord2-drawer">' +
        '<div class="ord2-dhead"><div><div class="ord2-dtitle">' + _ordEsc(o.id) + '</div>' +
          '<div class="ord2-dsub">' + (_ORD_CH[o.channel] || o.channel) + ' · <span class="ord2-badge ' + (_ORD_BADGE[o.status] || 'ord2-ok') + '">' + o.status + '</span></div></div>' +
          '<button class="ord2-dclose" onclick="this.closest(\'.ord2-drawer-ov\').remove()">✕</button></div>' +
        '<div class="ord2-dbody">' +
          '<div class="ord2-drow"><span>Customer</span><span>' + _ordEsc(o.customer) + '</span></div>' +
          (o.phone ? '<div class="ord2-drow"><span>Phone</span><span>' + _ordEsc(o.phone) + '</span></div>' : '') +
          (o.rider ? '<div class="ord2-drow"><span>Rider</span><span>' + _ordEsc(o.rider) + '</span></div>' : '') +
          '<div class="ord2-drow"><span>Date</span><span>' + new Date(o.ts).toLocaleString('en-KE') + '</span></div>' +
          '<hr>' + items + '<hr>' +
          '<div class="ord2-drow"><span>Subtotal</span><span>KES ' + _ordFmt(o.subtotal) + '</span></div>' +
          (o.discount ? '<div class="ord2-drow"><span>Discount</span><span>-KES ' + _ordFmt(o.discount) + '</span></div>' : '') +
          (o.deliveryFee ? '<div class="ord2-drow"><span>Delivery</span><span>KES ' + _ordFmt(o.deliveryFee) + '</span></div>' : '') +
          (o.tax ? '<div class="ord2-drow"><span>Tax</span><span>KES ' + _ordFmt(o.tax) + '</span></div>' : '') +
          '<div class="ord2-drow ord2-dtotal"><span>Total</span><span>KES ' + _ordFmt(o.total) + '</span></div>' +
          '<div class="ord2-drow"><span>Payment</span><span>' + _ordEsc((o.paymentMethod || '').toUpperCase()) + ' · ' + _ordEsc(o.paymentStatus) + '</span></div>' +
          '<div class="ord2-dsec">Timeline</div><div class="ord2-tl">' + timeline + '</div>' +
        '</div>' +
        '<div class="ord2-dfoot"><button class="dbtn" onclick="__ordPrint(\'' + _ordEsc(o.source + '|' + o.canonicalId) + '\')">🖨 Print / Reprint</button></div>' +
      '</div>';
    document.body.appendChild(ov);
  }
  window.__ordPrint = function (key) {
    var parts = key.split('|'); var o = _ordState.rows.filter(function (x) { return x.source === parts[0] && x.canonicalId === parts[1]; })[0];
    if (!o) return;
    try { window.SokoniShell.Printer.print(o.raw || o); } catch (_) {}
  };

  /* ── Native Devices page (shell-level DeviceManager UI) ── */
  function renderDevices () {
    var host = document.getElementById('native-devices');
    if (!host) return;
    var up = PrinterState.connected;
    host.innerHTML =
      '<div class="dwrap">' +
        '<div class="dsec-t">Devices</div>' +
        '<div class="dev-card">' +
          '<div class="dev-row">' +
            '<div class="dev-ico">🖨️</div>' +
            '<div class="dev-meta"><div class="dev-name">' + (up ? (PrinterState.name || 'P58E') : 'Receipt Printer') + '</div>' +
              '<div class="dev-sub"><span class="mdot ' + (up ? 'ok' : '') + '"></span>' + (up ? 'Connected' : 'Not connected') + '</div></div>' +
          '</div>' +
          '<div class="dev-actions">' +
            (up
              ? '<button class="dbtn" id="dv-test">🧪 Test Print</button><button class="dbtn ghost" id="dv-forget">Forget</button><button class="dbtn ghost" id="dv-done">Done ↩</button>'
              : '<button class="dbtn" id="dv-connect">🔗 Connect Printer</button><button class="dbtn ghost" id="dv-reconnect">↻ Reconnect</button>') +
          '</div>' +
          '<div class="dev-note">The printer is a shell-level device: connect once and it stays connected as you move between modules. If your browser drops it, it reconnects silently; only if it can\'t will you need to tap Reconnect.</div>' +
        '</div>' +
        '<div class="dev-card dev-soon"><div class="dev-row"><div class="dev-ico">📷</div><div class="dev-meta"><div class="dev-name">Barcode Scanner</div><div class="dev-sub">Camera / USB — available in Cashier</div></div></div></div>' +
        '<div class="dev-card dev-soon"><div class="dev-row"><div class="dev-ico">💵</div><div class="dev-meta"><div class="dev-name">Cash Drawer</div><div class="dev-sub">Opens via the printer after a cash sale</div></div></div></div>' +
      '</div>';
    var q = function (i) { return document.getElementById(i); };
    if (q('dv-connect'))   q('dv-connect').onclick   = function () { window.SokoniShell.Printer.connect(); };
    if (q('dv-reconnect')) q('dv-reconnect').onclick = function () { window.SokoniShell.Printer.reconnect(); setTimeout(renderDevices, 1500); };
    if (q('dv-test'))      q('dv-test').onclick      = function () { window.SokoniShell.Printer.test(); };
    if (q('dv-forget'))    q('dv-forget').onclick    = function () { window.SokoniShell.Printer.forget(); setTimeout(renderDevices, 800); };
    if (q('dv-done'))      q('dv-done').onclick      = function () { go(_lastModule || 'dashboard'); };  /* return to previous module, no reload */
  }
  function renderDashboard () {
    var host = document.getElementById('native-dashboard');
    if (!host || host.dataset.done) { if (host) refreshDashboardLive(); return; }
    host.dataset.done = '1';
    host.innerHTML =
      '<div class="dwrap">' +
        '<div class="dsec-t">Today</div>' +
        '<div class="dgrid" id="d-kpis">' +
          kpi('d-revenue','—','Revenue') + kpi('d-orders','—','Orders') +
          kpi('d-sales','—','Walk-in Sales') + kpi('d-online','—','Online Orders') +
          kpi('d-aov','—','Avg Order') + kpi('d-refunds','—','Refunds') +
          kpi('d-print','—','Printer') + kpi('d-sync','—','Sync') +
        '</div>' +
        '<div class="dsec-t">Quick actions</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<a class="dbtn" onclick="__mgo(\'cashier\')">💳 New Sale</a>' +
          '<a class="dbtn" onclick="__mgo(\'orders\')">🧾 View Orders</a>' +
          '<a class="dbtn" onclick="__mgo(\'inventory\')">📦 Inventory</a>' +
          '<a class="dbtn" onclick="__mgo(\'devices\')">🖨️ Devices</a>' +
        '</div>' +
      '</div>';
    _startOnlineFeed();   /* so Online numbers are real, from the same source as Orders */
    refreshDashboardLive();
  }
  function kpi (id, v, l) { return '<div class="dcard"><div class="n" id="' + id + '">' + v + '</div><div class="l">' + l + '</div></div>'; }

  /* Live connectivity + printer chips are read directly; business KPIs come from the ONE
     AnalyticsEngine (same source as Orders/Reports/Finance) — never independently calculated. */
  function refreshDashboardLive () {
    var online = (typeof navigator !== 'undefined') ? navigator.onLine !== false : true;
    setTxt('d-sync', online ? '🟢' : '🔴');
    setTxt('d-print', shellPrinterUp ? '🟢' : '⚪');
    _dashLoadAnalytics();
  }
  var _dashBusy = false;
  function _dashLoadAnalytics () {
    if (_dashBusy || !window.SokoniAnalyticsEngine) return;
    _dashBusy = true;
    Promise.resolve(SokoniAnalyticsEngine.compute({ range: 'today' })).then(function (a) {
      _dashBusy = false;
      if (!a || current !== 'dashboard') return;
      setTxt('d-revenue', 'KES ' + Number(a.revenue || 0).toLocaleString('en-KE', { maximumFractionDigits: 0 }));
      setTxt('d-orders', String(a.orders));
      setTxt('d-sales', String(a.pos.count));
      setTxt('d-online', SokoniOrderService && SokoniOrderService.hasOnlineProvider() ? String(a.online.count) : '—');
      setTxt('d-aov', a.aov ? 'KES ' + Number(a.aov).toLocaleString('en-KE') : '—');
      setTxt('d-refunds', String(a.refunded));
    }).catch(function () { _dashBusy = false; });
  }
  function setTxt (id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }

  /* ── Status chips (shell-level) ── */
  var shellPrinterUp = false;
  function paintStatus () {
    var online = (typeof navigator !== 'undefined') ? navigator.onLine !== false : true;
    document.getElementById('st-sync').className   = 'mdot ' + (online ? 'ok' : 'bad');
    document.getElementById('st-sync-t').textContent = online ? 'Online' : 'Offline';
    var pc = shellPrinterUp ? 'mdot ok' : 'mdot';
    document.getElementById('st-print').className = pc;
    document.getElementById('top-print').className = pc;
    var pt = shellPrinterUp ? 'Printer connected' : 'Printer';
    document.getElementById('st-print-t').textContent = pt;
    document.getElementById('top-print-t').textContent = shellPrinterUp ? 'P58E' : 'Printer';
    if (current === 'dashboard') refreshDashboardLive();
    else if (current === 'devices') { try { renderDevices(); } catch (_) {} }
  }
  window.addEventListener('online',  paintStatus);
  window.addEventListener('offline', paintStatus);

  /* The POS app posts its printer status up to the shell so the top bar reflects it globally. */
  /* ── One integrated, singleton update bar (shell-level) ── */
  function showUpdateBar () { var b = document.getElementById('mupdate'); if (b) b.hidden = false; }
  window.addEventListener('sokoni:update-available', showUpdateBar);
  window.__mUpdateNow   = function () { try { if (window._sokoniApplyUpdate) window._sokoniApplyUpdate(); else location.reload(); } catch (_) { location.reload(); } };
  window.__mUpdateLater = function () { var b = document.getElementById('mupdate'); if (b) b.hidden = true; };

  /* ── SHELL-OWNED PRINTER (Phase 2) ─────────────────────────────────────────
     ONE printer for the whole app. The persistent POS panel is the printer HOST —
     its Bluetooth/GATT connection survives every navigation because that iframe is
     never destroyed. The shell exposes a single API that routes every module's job
     to that host, so any screen calls SokoniShell.Printer.print(receipt) and it
     prints — no per-module printer, no reconnect-on-navigation. Connecting needs a
     user gesture in the POS context, so connect() takes the user to Cashier and
     opens the printer menu once; after that, print-from-anywhere works. */
  /* ── ONE observable PrinterState (shell-owned) ─────────────────────────────
     The shell's own SokoniPrinter holds the connection; this single state object is the only
     source of truth. Every UI element (chip, Devices page, and any subscriber) reacts to it —
     nobody keeps their own "connected" boolean. */
  var PrinterState = { connected: false, name: null, deviceId: null, transport: null, lastSeen: 0, printing: false };
  var _psSubs = [];
  function _broadcastPrinter () {
    /* Push the shell's printer state DOWN into every hosted iframe so their status surfaces
       (e.g. POS Settings) mirror the ONE shell-owned connection. */
    var msg = { __sokoniPrinterState: true, state: { connected: PrinterState.connected, name: PrinterState.name } };
    Object.keys(panels).forEach(function (k) {
      try { var f = panels[k].querySelector && panels[k].querySelector('iframe'); if (f && f.contentWindow) f.contentWindow.postMessage(msg, location.origin); } catch (_) {}
    });
  }
  function _psNotify () { paintStatus(); if (current === 'devices') { try { renderDevices(); } catch (_) {} } _broadcastPrinter(); _psSubs.forEach(function (fn) { try { fn(PrinterState); } catch (_) {} }); }
  function _psSet (patch) { for (var k in patch) PrinterState[k] = patch[k]; if (patch.connected) PrinterState.lastSeen = Date.now(); shellPrinterUp = PrinterState.connected; _psNotify(); }
  window.SokoniPrinterState = { get: function () { return PrinterState; }, subscribe: function (fn) { _psSubs.push(fn); try { fn(PrinterState); } catch (_) {} } };

  var _eng = window.SokoniPrinter || null;
  function _engName (d) { try { var s = _eng && _eng.getStatus && _eng.getStatus(); return (d && d.name) || (s && s.name) || 'Printer'; } catch (_) { return 'Printer'; } }
  if (_eng && _eng.on) {
    _eng.on('connected',    function (d) { _psSet({ connected: true,  name: _engName(d) }); });
    _eng.on('disconnected', function ()  { _psSet({ connected: false }); });
    _eng.on('forgotten',    function ()  { _psSet({ connected: false, name: null }); });
  }
  function _remembered () { try { return !!(JSON.parse(localStorage.getItem('spp_profile') || '{}').lastDevice) || !!localStorage.getItem('p58e_paired_device'); } catch (_) { return false; } }

  window.SokoniShell = window.SokoniShell || {};
  window.SokoniShell.Printer = {
    status:      function () { return { connected: PrinterState.connected, name: PrinterState.name }; },
    isConnected: function () { return !!PrinterState.connected; },
    /* Connect happens IN THE SHELL — the Bluetooth chooser opens here from a real user gesture
       (Devices button / chip). No separate wizard page, so the connection is never destroyed. */
    connect: async function () {
      if (!_eng) return false;
      try {
        var list = await _eng.discoverBy('bluetooth');
        if (list && list[0]) { await _eng.connect(list[0]); _psSet({ connected: true, name: list[0].name || 'Printer' }); return true; }
      } catch (e) { _psSet({ connected: !!_eng.connected }); }
      return false;
    },
    reconnect: async function () {
      if (!_eng) return false;
      try { var ok = await _eng.autoReconnect(); if (ok || _eng.connected) { _psSet({ connected: true }); return true; } } catch (_) {}
      return this.connect();
    },
    forget: async function () {
      try { if (_eng && _eng.forget) await _eng.forget(); } catch (_) {}
      ['spp_profile','pps_store_profile','sokoni_printer_last_print','p58e_paired_device','pps_remember'].forEach(function (k) { try { localStorage.removeItem(k); } catch (_) {} });
      _psSet({ connected: false, name: null });
    },
    test:  function () { try { if (_eng && _eng.testPrint) _eng.testPrint(); } catch (_) {} },
    print: function (receipt) { try { if (_eng && _eng.print) _eng.print('receipt', receipt); } catch (_) {} },
  };
  /* Top-bar printer chip → connect if disconnected, else open the Devices page. */
  (function () { var c = document.getElementById('top-print'); var w = c && c.closest('.tchip');
    if (w) { w.style.cursor = 'pointer'; w.title = 'Printer — connect / manage';
      w.onclick = function () { if (PrinterState.connected) go('devices'); else window.SokoniShell.Printer.connect(); }; } })();

  /* ── Startup auto-connect — ONE controlled reconnect scheduler ──────────────
     On app open the shell restores the remembered P58E and tries getDevices()→GATT on a fixed
     schedule (0/600/1800/3500/6000ms). The FIRST success cancels all remaining startup attempts.
     After startup, an 8s health monitor acts ONLY on a genuinely-disconnected state, and the
     first user interaction triggers ONE more silent attempt (never a repeated Bluetooth hammer).
     If Chrome discarded the grant, it stays 🔴 with a one-tap Reconnect — the honest browser
     boundary, not a faked green. */
  if (_eng) {
    var _arBusy = false, _startupDone = false, _wakeTried = false, _arTimers = [];
    function _arCancelStartup () { _startupDone = true; _arTimers.forEach(function (t) { clearTimeout(t); }); _arTimers = []; }
    function _arAttempt () {
      if (_arBusy) return;
      if (_eng.connected) { _arCancelStartup(); _psSet({ connected: true }); return; }
      if (!_remembered()) return;
      _arBusy = true;
      Promise.resolve(_eng.autoReconnect())
        .then(function (ok) { if (ok || _eng.connected) { _arCancelStartup(); _wakeTried = false; _psSet({ connected: true }); } })
        .catch(function () {})
        .then(function () { _arBusy = false; });
    }
    [0, 600, 1800, 3500, 6000].forEach(function (ms) { _arTimers.push(setTimeout(function () { if (!_startupDone) _arAttempt(); }, ms)); });
    /* Health monitor — only for an ACTUAL disconnected state. */
    setInterval(function () {
      if (_eng.connected) { _wakeTried = false; _psSet({ connected: true }); }
      else if (_remembered()) _arAttempt();
    }, 8000);
    /* First interaction: exactly ONE silent attempt while disconnected — no hammering. Reset
       once a connection is (re)established. Reconnect (Devices/chip) remains the gesture fallback
       that can open the chooser. */
    var _onWake = function () { if (_eng.connected || _wakeTried || !_remembered()) return; _wakeTried = true; _arAttempt(); };
    window.addEventListener('pointerdown', _onWake, { passive: true });
    window.addEventListener('focus', _onWake);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) _onWake(); });
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.__sokoniUpdate) { showUpdateBar(); return; }   /* a hosted iframe found an update */
    if (d.__sokoniModulePrint) { window.SokoniShell.Printer.print(d.receipt); return; }  /* any module → shell printer */
    if (d.__sokoniGoModule && byId[d.__sokoniGoModule]) { go(d.__sokoniGoModule); return; }  /* a module asked to route in-shell (e.g. Advanced → Devices) */
    if (d.__sokoniOrders) {                                        /* LIVE marketplace-order feed from the Seller module */
      _shellOnlineOrders = d.orders || [];
      try { if (window.SokoniOrderService) SokoniOrderService.setOnlineProvider(function () { return _shellOnlineOrders; }); } catch (_) {}
      /* Live re-render whichever data screen is open — all from the same source, no reload. */
      try {
        if (current === 'orders') _ordLoad();
        else if (current === 'dashboard') _dashLoadAnalytics();
        else if (current === 'reports' || current === 'finance' || current === 'analytics') _anLoad(current);
      } catch (_) {}
      return;
    }
    if (!d.__sokoniPos) return;
    /* NOTE: the shell now owns the printer + its state, so a hosted app's printerStatus is
       ignored here (it must not clobber the shell's observable state). */
    if (d.type === 'userInfo' && d.name) document.getElementById('st-user').textContent = d.name;
    else if (d.type === 'ready') {
      /* POS finished booting — (re)send the tab the user is currently on, so a switch that
         raced the boot still lands on the right tab (fixes "every button shows Checkout"). */
      var m = byId[current];
      if (m && m.kind === 'pos') { posSwitch(m.tab || 'pos'); if (m.action) posAction(m.action); }
      _broadcastPrinter();   /* give the freshly-loaded POS the current printer state */
    }
  });

  /* ── Sidebar collapse ── */
  function isMobile () { return window.matchMedia('(max-width:820px)').matches; }
  var _mscrim = document.getElementById('mscrim');
  if (_mscrim) _mscrim.onclick = function () { shell.classList.remove('mobile-open'); };
  document.getElementById('burger').onclick = function () {
    if (isMobile()) shell.classList.toggle('mobile-open');
    else {
      shell.classList.toggle('collapsed');
      try { localStorage.setItem('mshell_collapsed', shell.classList.contains('collapsed') ? '1' : '0'); } catch (_) {}
    }
  };
  try { if (localStorage.getItem('mshell_collapsed') === '1' && !isMobile()) shell.classList.add('collapsed'); } catch (_) {}

  window.__mgo = go;
  window.addEventListener('hashchange', function () { var id = location.hash.replace('#', ''); if (byId[id] && id !== current) go(id); });

  /* Boot */
  paintStatus();
  var boot = location.hash.replace('#', '');
  go(byId[boot] ? boot : 'dashboard');

  /* (Printer auto-reconnect on app open is now owned by the shell's own engine above — no need
     to warm the POS host for the printer.) */
})();
</script>
<script src="/sw-register.js" defer></script>
</body>
