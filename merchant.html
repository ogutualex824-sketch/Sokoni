<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOKONI Merchant OS</title>
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --bg:#050505; --panel:#0a0a0a; --card:#0d0d0d; --line:rgba(255,255,255,.08);
    --txt:#fff; --txt2:rgba(255,255,255,.55); --txt3:rgba(255,255,255,.35); --acc:#71ff00;
    --rail:224px; --rail-collapsed:64px; --top:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;overflow:hidden}

  .mshell{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:100vh;
    transition:grid-template-columns .22s cubic-bezier(.2,.7,.3,1)}
  .mshell.collapsed{grid-template-columns:var(--rail-collapsed) 1fr}

  /* ── Sidebar ── */
  .mrail{background:linear-gradient(180deg,#0b0b0b,#070707);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .mbrand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;min-height:var(--top);
    border-bottom:1px solid var(--line)}
  .mbrand .logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#000;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex:0 0 auto}
  .mbrand .name{font-weight:900;letter-spacing:.02em;white-space:nowrap;font-size:15px}
  .mshell.collapsed .mbrand .name{opacity:0;width:0}
  .mnav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    cursor:pointer;color:var(--txt2);font-size:13.5px;font-weight:700;white-space:nowrap;
    transition:background .14s,color .14s;user-select:none}
  .mnav-item .ico{font-size:18px;flex:0 0 22px;text-align:center}
  .mnav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .mnav-item.active{background:rgba(113,255,0,.12);color:var(--acc)}
  .mshell.collapsed .mnav-item .lbl{opacity:0;width:0;overflow:hidden}
  .mnav-sep{height:1px;background:var(--line);margin:8px 12px}

  .mstatus{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px}
  .mchip{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap}
  .mdot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
  .mdot.ok{background:var(--acc);box-shadow:0 0 7px var(--acc)}
  .mdot.bad{background:#ff6464}
  .mshell.collapsed .mchip .ctxt{opacity:0;width:0;overflow:hidden}

  /* ── Main ── */
  .mmain{display:flex;flex-direction:column;min-width:0;min-height:0}
  .mtop{height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;gap:12px;
    padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .mtop .burger{background:none;border:1px solid var(--line);color:var(--txt2);width:34px;height:34px;
    border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mtop .burger:hover{color:var(--txt);border-color:rgba(113,255,0,.4)}
  .mtitle{font-weight:800;font-size:15px}
  .mtop .spacer{flex:1}
  .mtop .tchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt2);
    padding:6px 11px;border:1px solid var(--line);border-radius:20px}
  .mtop .tchip .mdot{width:7px;height:7px}

  .mcontent{flex:1;position:relative;min-height:0;background:var(--bg)}
  .mpanel{position:absolute;inset:0;display:none}
  .mpanel.show{display:block}
  .mpanel iframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}
  .mpanel .native{position:absolute;inset:0;overflow-y:auto;padding:22px}

  /* Native dashboard */
  .dwrap{max-width:1100px;margin:0 auto}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .dcard{background:linear-gradient(158deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--card);
    border:1px solid var(--line);border-radius:18px;padding:18px 16px;position:relative;overflow:hidden}
  .dcard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(113,255,0,.7),transparent)}
  .dcard .n{font-size:26px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
  .dcard .l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  .dsec-t{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:0 2px 12px}
  .dbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(113,255,0,.12);border:1px solid rgba(113,255,0,.3);
    color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none}
  .dloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:13px}

  @media (max-width:820px){
    :root{--rail:200px}
    .mshell{grid-template-columns:0 1fr}
    .mshell.mobile-open{grid-template-columns:var(--rail) 1fr}
    .mrail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:50;
      transform:translateX(-100%);transition:transform .22s}
    .mshell.mobile-open .mrail{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.6)}
  }
</style>
</head>
<body>
<div class="mshell" id="mshell">
  <aside class="mrail">
    <div class="mbrand"><div class="logo">S</div><div class="name">SOKONI</div></div>
    <nav class="mnav" id="mnav"></nav>
    <div class="mstatus">
      <div class="mchip"><span class="mdot" id="st-print"></span><span class="ctxt" id="st-print-t">Printer</span></div>
      <div class="mchip"><span class="mdot ok" id="st-sync"></span><span class="ctxt" id="st-sync-t">Online</span></div>
      <div class="mchip"><span class="mdot ok"></span><span class="ctxt" id="st-user">Merchant</span></div>
    </div>
  </aside>
  <div class="mmain">
    <header class="mtop">
      <button class="burger" id="burger" title="Toggle menu" aria-label="Toggle menu">☰</button>
      <div class="mtitle" id="mtitle">Dashboard</div>
      <div class="spacer"></div>
      <div class="tchip"><span class="mdot" id="top-print"></span><span id="top-print-t">Printer</span></div>
    </header>
    <div class="mcontent" id="mcontent"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   SOKONI Merchant Application Shell (R1.1)
   One page that loads ONCE. The sidebar/topbar/status never reload; clicking a
   module only swaps the content panel. Heavy legacy apps (POS, Seller Dashboard)
   are hosted in PERSISTENT panels created once and never destroyed — so the
   printer connection, auth, and Firestore listeners inside them survive every
   navigation (the whole point). Native modules replace these panels over time.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* Module registry. kind:
       'native' — rendered by a JS function into the panel (instant, no reload)
       'pos'    — the single persistent POS app panel; `tab` deep-switches its tab
       'seller' — the single persistent Seller Dashboard panel; `sec` deep-switches its section */
  var MODULES = [
    { id:'dashboard', label:'Dashboard', icon:'🏠', kind:'native' },
    { id:'cashier',   label:'Cashier',   icon:'💳', kind:'pos', tab:'pos' },
    { id:'orders',    label:'Orders',    icon:'🧾', kind:'pos', tab:'orders' },
    { id:'inventory', label:'Inventory', icon:'📦', kind:'pos', tab:'inventory' },
    { id:'customers', label:'Customers', icon:'👥', kind:'pos', tab:'customers' },
    { id:'reports',   label:'Reports',   icon:'📊', kind:'pos', tab:'reports' },
    { sep:true },
    { id:'shop',      label:'Shop Dashboard', icon:'🏪', kind:'seller', sec:'home' },
    { id:'finance',   label:'Finance',   icon:'💰', kind:'seller', sec:'tax' },
    { id:'analytics', label:'Analytics', icon:'📈', kind:'seller', sec:'analyse' },
    { id:'marketing', label:'Marketing', icon:'📣', kind:'seller', sec:'market' },
    { id:'team',      label:'Staff',     icon:'👨‍🔧', kind:'seller', sec:'team' },
    { sep:true },
    { id:'devices',   label:'Devices',   icon:'🖨️', kind:'pos', tab:'settings' },
    { id:'settings',  label:'Settings',  icon:'⚙️', kind:'pos', tab:'settings' },
  ];
  var byId = {};
  MODULES.forEach(function (m) { if (m.id) byId[m.id] = m; });

  var shell   = document.getElementById('mshell');
  var navEl   = document.getElementById('mnav');
  var content = document.getElementById('mcontent');
  var titleEl = document.getElementById('mtitle');
  var panels  = {};          /* id/kind → panel element (persistent) */
  var current = null;

  /* ── Sidebar render ── */
  MODULES.forEach(function (m) {
    if (m.sep) { var s = document.createElement('div'); s.className = 'mnav-sep'; navEl.appendChild(s); return; }
    var el = document.createElement('div');
    el.className = 'mnav-item'; el.dataset.id = m.id;
    el.innerHTML = '<span class="ico">' + m.icon + '</span><span class="lbl">' + m.label + '</span>';
    el.onclick = function () { go(m.id); };
    navEl.appendChild(el);
  });

  function setActive (id) {
    Array.prototype.forEach.call(navEl.querySelectorAll('.mnav-item'), function (n) {
      n.classList.toggle('active', n.dataset.id === id);
    });
  }

  /* ── Persistent panel factory. Each POS/Seller app is created ONCE and kept. ── */
  function posPanel () {
    if (!panels.pos) {
      var p = document.createElement('div'); p.className = 'mpanel';
      p.innerHTML = '<div class="dloading">Loading POS…</div>' +
        '<iframe id="mfx-pos" title="SOKONI POS" src="pos.html" ' +
        'allow="clipboard-write; payment; bluetooth; usb; serial; camera"></iframe>';
      content.appendChild(p); panels.pos = p;
    }
    return panels.pos;
  }
  function sellerPanel () {
    if (!panels.seller) {
      var p = document.createElement('div'); p.className = 'mpanel';
      p.innerHTML = '<div class="dloading">Loading Shop…</div>' +
        '<iframe id="mfx-seller" title="SOKONI Shop" src="seller.html" ' +
        'allow="clipboard-write; payment; bluetooth; usb; serial; camera"></iframe>';
      content.appendChild(p); panels.seller = p;
    }
    return panels.seller;
  }
  function nativePanel (id) {
    if (!panels['native:' + id]) {
      var p = document.createElement('div'); p.className = 'mpanel';
      p.innerHTML = '<div class="native" id="native-' + id + '"></div>';
      content.appendChild(p); panels['native:' + id] = p;
    }
    return panels['native:' + id];
  }

  function showOnly (panel) {
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('show', panels[k] === panel); });
  }

  /* ── postMessage deep-switch into the persistent apps ── */
  function posSwitch (tab) {
    var f = document.getElementById('mfx-pos');
    try { f && f.contentWindow && f.contentWindow.postMessage({ __sokoniShell: true, action: 'switchTab', tab: tab }, location.origin); } catch (_) {}
  }
  function sellerSwitch (sec) {
    var f = document.getElementById('mfx-seller');
    try { f && f.contentWindow && f.contentWindow.postMessage({ __sokoniShell: true, action: 'showSection', section: sec }, location.origin); } catch (_) {}
  }

  /* ── Router ── */
  function go (id) {
    var m = byId[id]; if (!m) { id = 'dashboard'; m = byId.dashboard; }
    current = id;
    setActive(id);
    titleEl.textContent = m.label;
    if (location.hash.replace('#', '') !== id) history.replaceState(null, '', '#' + id);
    if (shell.classList.contains('mobile-open')) shell.classList.remove('mobile-open');

    if (m.kind === 'native') { showOnly(nativePanel(id)); renderNative(id); return; }
    if (m.kind === 'pos')    { var p = posPanel(); showOnly(p); posSwitch(m.tab || 'pos'); return; }
    if (m.kind === 'seller') { var s = sellerPanel(); showOnly(s); sellerSwitch(m.sec || 'home'); return; }
  }

  /* ── Native modules ── */
  function renderNative (id) {
    if (id === 'dashboard') renderDashboard();
  }
  function renderDashboard () {
    var host = document.getElementById('native-dashboard');
    if (!host || host.dataset.done) { if (host) refreshDashboardLive(); return; }
    host.dataset.done = '1';
    host.innerHTML =
      '<div class="dwrap">' +
        '<div class="dsec-t">Today</div>' +
        '<div class="dgrid" id="d-kpis">' +
          kpi('d-revenue','—','Revenue') + kpi('d-sales','—','Walk-in Sales') +
          kpi('d-online','—','Online Orders') + kpi('d-low','—','Low Stock') +
          kpi('d-print','—','Printer') + kpi('d-sync','—','Sync') +
        '</div>' +
        '<div class="dsec-t">Quick actions</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<a class="dbtn" onclick="__mgo(\'cashier\')">💳 New Sale</a>' +
          '<a class="dbtn" onclick="__mgo(\'orders\')">🧾 View Orders</a>' +
          '<a class="dbtn" onclick="__mgo(\'inventory\')">📦 Inventory</a>' +
          '<a class="dbtn" onclick="__mgo(\'devices\')">🖨️ Devices</a>' +
        '</div>' +
      '</div>';
    refreshDashboardLive();
  }
  function kpi (id, v, l) { return '<div class="dcard"><div class="n" id="' + id + '">' + v + '</div><div class="l">' + l + '</div></div>'; }

  /* Live status the shell CAN read without the heavy apps: connectivity. Business KPIs stay
     "—" here (no fabricated numbers) until the Orders engine feeds the shell canonical data. */
  function refreshDashboardLive () {
    var online = (typeof navigator !== 'undefined') ? navigator.onLine !== false : true;
    setTxt('d-sync', online ? '🟢' : '🔴');
    setTxt('d-print', shellPrinterUp ? '🟢' : '⚪');
  }
  function setTxt (id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }

  /* ── Status chips (shell-level) ── */
  var shellPrinterUp = false;
  function paintStatus () {
    var online = (typeof navigator !== 'undefined') ? navigator.onLine !== false : true;
    document.getElementById('st-sync').className   = 'mdot ' + (online ? 'ok' : 'bad');
    document.getElementById('st-sync-t').textContent = online ? 'Online' : 'Offline';
    var pc = shellPrinterUp ? 'mdot ok' : 'mdot';
    document.getElementById('st-print').className = pc;
    document.getElementById('top-print').className = pc;
    var pt = shellPrinterUp ? 'Printer connected' : 'Printer';
    document.getElementById('st-print-t').textContent = pt;
    document.getElementById('top-print-t').textContent = shellPrinterUp ? 'P58E' : 'Printer';
    if (current === 'dashboard') refreshDashboardLive();
  }
  window.addEventListener('online',  paintStatus);
  window.addEventListener('offline', paintStatus);

  /* The POS app posts its printer status up to the shell so the top bar reflects it globally. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.__sokoniPos && d.type === 'printerStatus') { shellPrinterUp = !!d.connected; paintStatus(); }
    if (d.__sokoniPos && d.type === 'userInfo' && d.name) document.getElementById('st-user').textContent = d.name;
  });

  /* ── Sidebar collapse ── */
  function isMobile () { return window.matchMedia('(max-width:820px)').matches; }
  document.getElementById('burger').onclick = function () {
    if (isMobile()) shell.classList.toggle('mobile-open');
    else {
      shell.classList.toggle('collapsed');
      try { localStorage.setItem('mshell_collapsed', shell.classList.contains('collapsed') ? '1' : '0'); } catch (_) {}
    }
  };
  try { if (localStorage.getItem('mshell_collapsed') === '1' && !isMobile()) shell.classList.add('collapsed'); } catch (_) {}

  window.__mgo = go;
  window.addEventListener('hashchange', function () { var id = location.hash.replace('#', ''); if (byId[id] && id !== current) go(id); });

  /* Boot */
  paintStatus();
  var boot = location.hash.replace('#', '');
  go(byId[boot] ? boot : 'dashboard');
})();
</script>
<script src="/sw-register.js" defer></script>
</body>
</html>
