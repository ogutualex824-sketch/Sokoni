<!DOCTYPE html>
<html lang="en" data-require-auth="true">
<head>
  <script src="sokoni-crash-sentinel.js"></script>
  <script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>My Bookings — SOKONI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- My Bookings — the buyer's SERVICE bookings (providerBookings, customerUid == uid).
       Owner 2026-10-03: a booking is not an order. The buyer-protection booking PIN lives HERE, not in
       My Orders, and is RE-VIEWABLE until the booking completes (signed in only). Money authority is
       entirely server-side (booking engine + serviceBookingPin + settlement on PIN release); this page
       reads, and asks the server — it never decides a payment state or computes an amount. -->
  <style>
    :root{--bg:#050505;--card:#0e0e0e;--line:#1c1c1c;--txt:#f2f2f2;--dim:#8a8a8a;--acc:#71ff00;--amb:#fbbf24;--red:#ff6b6b;--blue:#00aaff;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;padding-bottom:90px;}
    .bk-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(5,5,5,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
    .bk-top a.back{color:var(--txt);text-decoration:none;font-size:22px;line-height:1;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
    .bk-top h1{font-size:18px;margin:0;font-weight:800;flex:1;}
    .bk-top a.alt{color:var(--dim);font-size:13px;text-decoration:none;font-weight:700;}
    .bk-wrap{padding:16px;max-width:640px;margin:0 auto;}
    .bk-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
    .bk-tab{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
    .bk-tab[aria-selected="true"]{color:#000;background:var(--acc);border-color:var(--acc);}
    .bk-tab:focus-visible,.bk-btn:focus-visible,.bk-top a:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
    .bk-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
    .bk-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
    .bk-svc{font-weight:800;font-size:15px;word-break:break-word;}
    .bk-sub{color:var(--dim);font-size:12.5px;margin-top:3px;}
    .bk-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;}
    .bk-rows{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
    .bk-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;}
    .bk-row .k{color:var(--dim);} .bk-row .v{text-align:right;font-weight:600;}
    .bk-box{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#0a0a0a;}
    .bk-box h3{margin:0 0 4px;font-size:13px;font-weight:800;}
    .bk-box p{margin:0;color:var(--dim);font-size:12.5px;}
    .bk-pin{font:800 30px/1.1 ui-monospace,Consolas,monospace;letter-spacing:10px;margin:8px 0 4px;color:var(--acc);}
    .bk-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .bk-btn{flex:1 1 140px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:#141414;color:var(--txt);font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;padding:0 12px;}
    .bk-btn.pri{background:var(--acc);color:#000;border-color:var(--acc);}
    .bk-btn[disabled]{opacity:.5;cursor:not-allowed;}
    .bk-empty{text-align:center;padding:56px 20px;color:var(--dim);}
    .bk-empty .ic{font-size:48px;margin-bottom:12px;}
    .bk-empty a{color:var(--acc);text-decoration:none;font-weight:800;}
    .bk-err{border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.08);color:#ffb3b3;border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;}
    .bk-skel{height:120px;border-radius:14px;background:linear-gradient(90deg,#0e0e0e,#141414,#0e0e0e);background-size:200% 100%;animation:bk-sh 1.2s infinite;margin-bottom:12px;}
    @keyframes bk-sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @media (prefers-reduced-motion: reduce){.bk-skel{animation:none;}}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  </style>
  <link rel="stylesheet" href="/sokoni-tokens.css">
  <link rel="stylesheet" href="/sokoni-toast.css">
</head>
<body>
  <div class="bk-top">
    <a href="profile.html" class="back" aria-label="Back to profile">&#8592;</a>
    <h1>My Bookings</h1>
    <a class="alt" href="my-orders.html">My Orders &rsaquo;</a>
  </div>

  <main class="bk-wrap">
    <div class="bk-tabs" role="tablist" aria-label="Booking groups" id="bkTabs">
      <button class="bk-tab" role="tab" data-g="upcoming" aria-selected="true">Upcoming</button>
      <button class="bk-tab" role="tab" data-g="active" aria-selected="false">In progress</button>
      <button class="bk-tab" role="tab" data-g="completed" aria-selected="false">Completed</button>
      <button class="bk-tab" role="tab" data-g="closed" aria-selected="false">Cancelled</button>
    </div>
    <div class="bk-err" id="bkMsg" role="status" hidden></div>
    <div id="bkList" aria-live="polite"><div class="bk-skel"></div><div class="bk-skel"></div></div>
  </main>

  <script>
  (function () {
    'use strict';
    var list = document.getElementById('bkList');
    var S = { uid: null, bookings: null, err: null, group: 'upcoming', providers: {}, pins: {}, busy: {} };

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
    function ms(t){ if (!t) return null; if (typeof t === 'number') return t; if (t.toMillis) return t.toMillis(); var s = t.seconds != null ? t.seconds : t._seconds; return s != null ? s * 1000 : null; }
    /* Amounts are integer CENTS on the booking (server-authoritative). Shown as stored; unknown → —. */
    function kes(c){ var n = Number(c); return (c == null || !isFinite(n)) ? '—' : 'KES ' + (n / 100).toLocaleString('en-KE', { maximumFractionDigits: 2 }); }
    function when(b){
      var t = ms(b.startTs) || ms(b.scheduledAt);
      if (!t) return esc(b.date || '—') + (b.startTime ? ' · ' + esc(b.startTime) : '');
      try { return new Date(t).toLocaleString('en-KE', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); } catch (e) { return '—'; }
    }

    var STATUS = {
      pending:     { l:'Awaiting provider', c:'#fbbf24' },
      requested:   { l:'Requested',         c:'#fbbf24' },
      confirmed:   { l:'Confirmed',         c:'#71ff00' },
      in_progress: { l:'In progress',       c:'#00aaff' },
      completed:   { l:'Completed',         c:'#71ff00' },
      cancelled:   { l:'Cancelled',         c:'#ff6b6b' },
      declined:    { l:'Declined',          c:'#ff6b6b' },
      no_show:     { l:'No-show',           c:'#f97316' },
      expired:     { l:'Expired',           c:'#9aa0a6' }
    };
    var PAY = {
      pending:   'Not paid yet',
      paid_held: 'Paid — held by SOKONI until you confirm with your PIN',
      settled:   'Paid — released to the provider',
      refunded:  'Refunded'
    };
    var CLOSED = { cancelled:1, declined:1, no_show:1, expired:1 };

    function groupOf(b){
      var st = b.status || '';
      if (CLOSED[st]) return 'closed';
      if (st === 'completed') return 'completed';
      if (st === 'in_progress') return 'active';
      var t = ms(b.startTs) || ms(b.scheduledAt);
      if (st === 'confirmed' && t && t <= Date.now()) return 'active';
      return 'upcoming';
    }

    /* ── PIN — asked from the server on demand; held in memory for this page view only, never stored,
          never logged. Only a booking whose money SOKONI is holding has one. ── */
    function pinBox(b){
      if (b.paymentStatus !== 'paid_held' || b.status === 'completed' || CLOSED[b.status]) return '';
      var p = S.pins[b.id];
      var head = '<h3>&#128274; Booking PIN</h3><p>Give this PIN to the provider only when the job is done. It releases your payment to them — SOKONI holds it until then.</p>';
      if (!p) return '<div class="bk-box">' + head + '<div class="bk-acts"><button class="bk-btn pri" data-act="pin" data-id="' + esc(b.id) + '"' + (S.busy[b.id] ? ' disabled' : '') + '>' + (S.busy[b.id] ? 'Loading…' : 'Show my PIN') + '</button></div></div>';
      if (p.unavailable) return '<div class="bk-box">' + head + '<p style="margin-top:8px;color:#ffd27a">' + esc(p.unavailable) + '</p></div>';
      var body = '';
      if (p.pin) {
        body = '<div class="bk-pin" aria-label="Booking PIN ' + esc(String(p.pin).split('').join(' ')) + '">' + esc(p.pin) + '</div>' +
               (p.expiresAtMs ? '<p>Valid until ' + esc(new Date(p.expiresAtMs).toLocaleString('en-KE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })) + '</p>' : '');
      } else if (p.issued === false && p.reason === 'not_yet_issued') {
        body = '<p style="margin-top:8px">Your PIN is being prepared. Check again in a moment.</p>';
      } else if (p.expired) {
        body = '<p style="margin-top:8px;color:#ffd27a">This PIN has expired.</p>';
      } else {
        body = '<p style="margin-top:8px">No PIN to show right now.</p>';
      }
      var acts = '<button class="bk-btn" data-act="pin-hide" data-id="' + esc(b.id) + '">Hide</button>';
      if (p.canRenew) acts += '<button class="bk-btn pri" data-act="pin-renew" data-id="' + esc(b.id) + '"' + (S.busy[b.id] ? ' disabled' : '') + '>Get a new PIN' + (p.renewalsLeft != null ? ' (' + Number(p.renewalsLeft) + ' left)' : '') + '</button>';
      else if (p.issued === false) acts += '<button class="bk-btn" data-act="pin" data-id="' + esc(b.id) + '">Check again</button>';
      return '<div class="bk-box">' + head + body + '<div class="bk-acts">' + acts + '</div></div>';
    }

    /* ── After-service balance (owner 2026-10-03: the provider proposes, the buyer accepts, then IntaSend).
          The server side (serviceBookingBalance + purpose service_booking_balance) is not shipped yet, so
          this step is shown, and honestly NOT actionable. Never a working-looking button. ── */
    function balanceBox(b){
      var bp = b.balanceProposal;
      if (!bp || typeof bp !== 'object') return '';
      var amt = Number(bp.amountKES);
      var amtTxt = isFinite(amt) && amt > 0 ? 'KES ' + amt.toLocaleString('en-KE') : '—';
      var st = String(bp.status || '').toUpperCase();
      var msg = st === 'PROPOSED' ? 'The provider has proposed a final balance of ' + esc(amtTxt) + '. Accepting and paying it in SOKONI is not available yet.'
              : st === 'ACCEPTED' ? 'You accepted a final balance of ' + esc(amtTxt) + '. Paying it in SOKONI is not available yet.'
              : st === 'PAID'     ? 'Final balance of ' + esc(amtTxt) + ' paid.'
              : st === 'DECLINED' ? 'You declined the proposed balance of ' + esc(amtTxt) + '.'
              : 'Final balance: ' + esc(amtTxt) + '.';
      return '<div class="bk-box"><h3>&#129534; Final balance</h3><p>' + msg + '</p></div>';
    }

    function card(b){
      var st = STATUS[b.status] || { l: b.status || 'Booking', c:'#9aa0a6' };
      var prov = S.providers[b.providerId];
      var provName = prov && prov.name ? prov.name : (prov === null ? 'Provider' : '…');
      var pay = PAY[b.paymentStatus] || (b.paymentStatus ? String(b.paymentStatus) : '—');
      var hold = '';
      if (b.paymentStatus === 'pending' && !CLOSED[b.status]) {
        var exp = ms(b.expiresAt);
        hold = exp ? (exp > Date.now() ? 'Slot held until ' + new Date(exp).toLocaleTimeString('en-KE', { hour:'2-digit', minute:'2-digit' }) : 'Hold expired — the slot was released') : '';
      }
      var acts = '';
      if (!CLOSED[b.status]) acts += '<a class="bk-btn" href="chat.html?tx=service_booking&amp;txId=' + encodeURIComponent(b.id) + '">&#128172; Message provider</a>';
      if (b.status === 'completed') acts += '<button class="bk-btn pri" data-act="review" data-id="' + esc(b.id) + '">&#11088; Review</button>';
      if (b.providerId) acts += '<a class="bk-btn" href="provider-profile.html?id=' + encodeURIComponent(b.providerId) + '">View provider</a>';
      return '<article class="bk-card" data-booking="' + esc(b.id) + '">' +
        '<div class="bk-head"><div><div class="bk-svc">' + esc(b.service || 'Service booking') + '</div>' +
        '<div class="bk-sub">' + esc(provName) + ' · ' + when(b) + '</div></div>' +
        '<span class="bk-badge" style="background:' + st.c + '22;color:' + st.c + ';border:1px solid ' + st.c + '55">' + esc(st.l) + '</span></div>' +
        '<div class="bk-rows">' +
          '<div class="bk-row"><span class="k">Booking total</span><span class="v">' + kes(b.price) + '</span></div>' +
          (b.deposit ? '<div class="bk-row"><span class="k">Booking fee / deposit</span><span class="v">' + kes(b.deposit) + '</span></div>' : '') +
          '<div class="bk-row"><span class="k">Payment</span><span class="v">' + esc(pay) + '</span></div>' +
          (hold ? '<div class="bk-row"><span class="k">Hold</span><span class="v">' + esc(hold) + '</span></div>' : '') +
          '<div class="bk-row"><span class="k">Reference</span><span class="v">' + esc(b.id) + '</span></div>' +
        '</div>' + pinBox(b) + balanceBox(b) +
        (acts ? '<div class="bk-acts">' + acts + '</div>' : '') + '</article>';
    }

    var EMPTY = { upcoming:'No upcoming bookings.', active:'Nothing in progress.', completed:'No completed bookings yet.', closed:'No cancelled bookings.' };
    function render(){
      if (S.err) { list.innerHTML = '<div class="bk-err" role="alert">' + esc(S.err) + '</div>'; return; }
      if (S.bookings === null) return;   /* still loading — keep the skeleton */
      var rows = S.bookings.filter(function (b) { return groupOf(b) === S.group; });
      if (!rows.length) {
        list.innerHTML = '<div class="bk-empty"><div class="ic">&#128197;</div>' + esc(EMPTY[S.group]) + (S.bookings.length ? '' : '<br><a href="services.html">Find a service</a>') + '</div>';
        return;
      }
      list.innerHTML = rows.map(card).join('');
    }

    document.getElementById('bkTabs').addEventListener('click', function (e) {
      var t = e.target.closest('.bk-tab'); if (!t) return;
      S.group = t.getAttribute('data-g');
      [].forEach.call(this.querySelectorAll('.bk-tab'), function (x) { x.setAttribute('aria-selected', x === t ? 'true' : 'false'); });
      render();
    });

    function call(name, data){ return window.firebase.functions().httpsCallable(name)(data).then(function (r) { return r && r.data; }); }
    /* A callable that is not deployed (or this page cannot reach) reads as "not available yet" —
       never as a fake PIN and never as "you have no PIN". Server refusals show the server's message. */
    function pinErr(e){
      var code = String((e && e.code) || '').replace(/^functions\//, '');
      if (code === 'not-found' || code === 'unavailable' || code === 'internal' || code === 'unimplemented') return 'The booking PIN is not available yet. Your payment stays held by SOKONI — try again later.';
      if (code === 'permission-denied') return 'This booking is not yours.';
      return (e && e.message && code === 'failed-precondition') ? e.message : 'Could not load your PIN. Try again.';
    }
    function askPin(id, op){
      if (S.busy[id]) return;
      S.busy[id] = true; render();
      call('serviceBookingPin', { op: op, bookingId: id }).then(function (r) {
        S.pins[id] = r && typeof r === 'object' ? r : { issued: false };
      }).catch(function (e) {
        if (op === 'renewBookingPin' && S.pins[id]) { S.pins[id] = Object.assign({}, S.pins[id], { canRenew: false }); toast(pinErr(e)); }
        else S.pins[id] = { unavailable: pinErr(e) };
      }).then(function () { S.busy[id] = false; render(); });
    }
    function toast(m){ var t = document.getElementById('bkMsg'); if (!t) return; t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 5000); }

    list.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
      if (!/^[A-Za-z0-9_-]{1,128}$/.test(id || '')) return;
      if (act === 'pin') askPin(id, 'getMyBookingPin');
      else if (act === 'pin-renew') askPin(id, 'renewBookingPin');
      else if (act === 'pin-hide') { delete S.pins[id]; render(); }
      else if (act === 'review') {
        if (window.SokoniBookService && typeof window.SokoniBookService.review === 'function') window.SokoniBookService.review({ bookingId: id });
        else toast('Reviews are loading — try again in a moment.');
      }
    });
    /* Leaving the page (or backgrounding it) drops any PIN shown — it is re-fetched on demand. */
    document.addEventListener('visibilitychange', function () { if (document.hidden && Object.keys(S.pins).length) { S.pins = {}; render(); } });

    /* Provider names: providers/{id} is publicly readable only while active/approved. A denied or
       missing doc renders "Provider" — never an invented name. One read per distinct provider. */
    function loadProviders(){
      var ids = {};
      (S.bookings || []).forEach(function (b) { if (b.providerId && !(b.providerId in S.providers)) ids[b.providerId] = 1; });
      Object.keys(ids).slice(0, 30).forEach(function (pid) {
        S.providers[pid] = undefined;
        window.firebase.firestore().collection('providers').doc(pid).get().then(function (d) {
          var x = d && d.exists ? (typeof d.data === 'function' ? d.data() : d.data) : null;
          S.providers[pid] = x ? { name: x.businessName || x.displayName || x.name || null } : null;
          if (S.providers[pid] && !S.providers[pid].name) S.providers[pid] = null;
        }).catch(function () { S.providers[pid] = null; }).then(render);
      });
    }

    var unsub = null;
    function goLive(uid){
      if (S.uid === uid) return; S.uid = uid;
      if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
      try {
        /* One equality filter (auto-indexed) + limit; sorted here → no composite index needed.
           The providerBookings read rule admits exactly customerUid == auth.uid for a buyer. */
        var q = window.firebase.firestore().collection('providerBookings').where('customerUid', '==', uid).limit(100);
        unsub = q.onSnapshot(function (snap) {
          var docs = (snap && snap.docs) || [];
          S.err = null;
          S.bookings = docs.map(function (d) { return Object.assign({}, typeof d.data === 'function' ? d.data() : d.data, { id: d.id }); })
            .sort(function (a, b) { return (ms(b.startTs) || ms(b.scheduledAt) || 0) - (ms(a.startTs) || ms(a.scheduledAt) || 0); });
          loadProviders(); render();
        }, function () { S.err = 'Could not load your bookings. Check your connection and try again.'; render(); });
      } catch (e) { S.err = 'Could not load your bookings. Try again.'; render(); }
    }

    function boot(){
      if (typeof window.waitForFirebaseReady !== 'function') { setTimeout(boot, 200); return; }
      window.waitForFirebaseReady(function () {
        var u = window.firebaseAuth && window.firebaseAuth.currentUser;
        if (u && u.uid) { goLive(u.uid); return; }
        if (window.firebaseSDK && window.firebaseSDK.onAuthStateChanged) {
          window.firebaseSDK.onAuthStateChanged(function (x) { if (x && x.uid) goLive(x.uid); });
        }
      });
    }
    /* Deep link from a notification / payment receipt: bookings.html?b=<id> opens the right tab. */
    try { var want = new URLSearchParams(location.search).get('b'); if (want) S.focus = want; } catch (e) {}
    var _render = render;
    render = function () {
      _render();
      if (S.focus && S.bookings) {
        var hit = S.bookings.find(function (b) { return b.id === S.focus; });
        if (hit && groupOf(hit) !== S.group) {
          S.group = groupOf(hit);
          [].forEach.call(document.querySelectorAll('.bk-tab'), function (x) { x.setAttribute('aria-selected', x.getAttribute('data-g') === S.group ? 'true' : 'false'); });
          _render();
        }
        var el = hit && document.querySelector('[data-booking="' + (window.CSS && CSS.escape ? CSS.escape(hit.id) : hit.id) + '"]');
        if (el) { el.scrollIntoView({ block: 'start' }); el.style.borderColor = 'var(--acc)'; }
        S.focus = null;
      }
    };
    window.__SokoniBookings = { state: S, render: function () { render(); }, groupOf: groupOf };
    boot();
  })();
  </script>

  <script src="firebase.js" type="module"></script>
  <script src="sokoni-auth-state.js"></script>
  <script src="sokoni-identity-guard.js"></script>
  <script src="sokoni-user-bootstrap.js" defer></script>
  <!-- The ONE review UI (bookingSubmitReview server gate) — opened on a completed booking. -->
  <script src="sokoni-book-service.js" defer></script>
  <script src="sw-register.js" defer></script>
</body>
</html>
