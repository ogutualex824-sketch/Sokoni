<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — SOKONI</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="sokoni-tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c-bg:#f7f8fa;--c-surface:#fff;--c-border:#e5e7eb;--c-primary:#1a56db;--c-primary-light:#eff6ff;--c-text:#111827;--c-sub:#6b7280;--c-red:#dc2626;--c-green:#16a34a;--c-sent:#1a56db;--c-sent-text:#fff;--c-recv:#fff;--c-recv-text:#111827;--radius:12px}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--c-bg);color:var(--c-text);display:flex;flex-direction:column}

/* ── Top bar ── */
.topbar{flex-shrink:0;background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:0 8px 0 4px;height:60px;display:flex;align-items:center;gap:4px;z-index:50}
.icon-btn{width:40px;height:40px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-sub);flex-shrink:0}
.icon-btn:hover{background:var(--c-bg)}
.peer-avatar{width:38px;height:38px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;overflow:hidden;flex-shrink:0}
.peer-avatar img{width:100%;height:100%;object-fit:cover}
.peer-info{flex:1;min-width:0}
.peer-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer-context{font-size:12px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Context header (collapsible) ── */
.ctx-header{background:var(--c-surface);border-bottom:1px solid var(--c-border);overflow:hidden;transition:max-height .25s ease}
.ctx-header.collapsed{max-height:0}
.ctx-inner{padding:14px 16px}
.ctx-title{font-size:13px;font-weight:600;color:var(--c-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ctx-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.ctx-field{background:var(--c-bg);border-radius:8px;padding:8px 10px}
.ctx-field-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--c-sub);margin-bottom:2px}
.ctx-field-value{font-size:13px;font-weight:600}
.ctx-actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ctx-actions::-webkit-scrollbar{display:none}
.ctx-action{white-space:nowrap;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;border:1.5px solid var(--c-primary);background:var(--c-primary-light);color:var(--c-primary);font-size:13px;font-weight:500;cursor:pointer;flex-shrink:0}
.ctx-action .material-icons{font-size:16px}
.ctx-action:hover{background:var(--c-primary);color:#fff}
.ctx-toggle{width:100%;border:none;background:none;border-top:1px solid var(--c-border);padding:6px;color:var(--c-sub);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}

/* ── Message list ── */
.msg-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:4px;background:var(--c-bg)}
.msg-list::-webkit-scrollbar{width:4px}
.msg-list::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.load-more-btn{align-self:center;border:1.5px solid var(--c-border);background:var(--c-surface);padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;color:var(--c-sub);margin-bottom:8px}
.load-more-btn:hover{background:var(--c-bg)}

/* ── Date divider ── */
.date-div{align-self:center;font-size:11px;color:var(--c-sub);background:rgba(255,255,255,.85);border:1px solid var(--c-border);border-radius:20px;padding:3px 12px;margin:8px 0}

/* ── Message bubbles ── */
.msg-row{display:flex;gap:8px;max-width:80%;margin-bottom:2px}
.msg-row.sent{align-self:flex-end;flex-direction:row-reverse}
.msg-row.recv{align-self:flex-start}
.msg-row.system-row{align-self:center;max-width:90%}
.msg-mini-avatar{width:28px;height:28px;border-radius:50%;background:var(--c-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0;align-self:flex-end;overflow:hidden}
.msg-mini-avatar img{width:100%;height:100%;object-fit:cover}
.msg-bubble{padding:10px 13px;border-radius:16px;max-width:100%;word-break:break-word;position:relative;cursor:pointer}
.msg-row.sent .msg-bubble{background:var(--c-sent);color:var(--c-sent-text);border-bottom-right-radius:4px}
.msg-row.recv .msg-bubble{background:var(--c-recv);color:var(--c-recv-text);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg-row.system-row .msg-bubble{background:#f3f4f6;color:var(--c-sub);font-size:12px;text-align:center;border-radius:10px;padding:7px 14px}
.msg-text{font-size:14px;line-height:1.45;white-space:pre-wrap}
.msg-deleted{font-size:13px;font-style:italic;opacity:.6}
.msg-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px}
.msg-time{font-size:10px;opacity:.7}
.msg-status{font-size:12px;opacity:.7}
.msg-row.recv .msg-time,.msg-row.recv .msg-status{color:var(--c-sub)}

/* ── Reply preview inside bubble ── */
.reply-preview{background:rgba(0,0,0,.08);border-left:3px solid rgba(255,255,255,.5);border-radius:4px;padding:5px 8px;margin-bottom:6px;font-size:12px;opacity:.9}
.msg-row.recv .reply-preview{background:rgba(0,0,0,.05);border-left-color:var(--c-primary)}

/* ── Image message ── */
.msg-img{max-width:220px;max-height:220px;border-radius:10px;object-fit:cover;display:block;cursor:pointer}
/* ── PDF attachment ── */
.msg-pdf{display:flex;align-items:center;gap:8px;padding:4px 0}
.msg-pdf .material-icons{font-size:28px;color:var(--c-red)}
.msg-pdf-info{flex:1;min-width:0}
.msg-pdf-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-pdf-size{font-size:11px;opacity:.7}
/* ── Voice note ── */
.msg-voice{display:flex;align-items:center;gap:8px;min-width:160px}
.voice-play{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.msg-row.recv .voice-play{background:var(--c-primary);color:#fff}
.voice-dur{font-size:12px;opacity:.8}

/* ── Reply bar (above composer) ── */
.reply-bar{display:none;align-items:center;gap:8px;padding:8px 12px;background:#f0f4ff;border-top:1px solid var(--c-border)}
.reply-bar.show{display:flex}
.reply-bar-text{flex:1;font-size:13px;color:var(--c-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar-close{border:none;background:none;color:var(--c-sub);cursor:pointer;padding:2px}

/* ── Typing indicator ── */
.typing-wrap{padding:4px 16px;min-height:22px;font-size:12px;color:var(--c-sub);display:flex;align-items:center;gap:6px}
.typing-dots{display:flex;gap:3px}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--c-sub);animation:tdot .9s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── Composer ── */
.composer{flex-shrink:0;background:var(--c-surface);border-top:1px solid var(--c-border);padding:8px 8px 8px 8px;display:flex;align-items:flex-end;gap:6px}
.composer-input-wrap{flex:1;background:var(--c-bg);border:1.5px solid var(--c-border);border-radius:22px;display:flex;align-items:flex-end;padding:4px 6px 4px 12px;gap:4px;min-height:44px}
.composer-input{flex:1;border:none;background:none;font-size:15px;color:var(--c-text);outline:none;resize:none;line-height:1.4;max-height:120px;overflow-y:auto;padding:6px 0;font-family:inherit}
.composer-attach{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--c-sub);display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;margin-bottom:4px}
.composer-attach:hover{background:var(--c-border)}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send-btn:disabled{background:#d1d5db;cursor:default}
.send-btn .material-icons{font-size:22px}
.voice-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--c-bg);border:1.5px solid var(--c-border);color:var(--c-sub);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.voice-btn.recording{background:var(--c-red);border-color:var(--c-red);color:#fff;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ── Attach menu ── */
.attach-menu{position:absolute;bottom:70px;left:16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none;flex-direction:column;overflow:hidden;z-index:200}
.attach-menu.show{display:flex}
.attach-option{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:14px;border:none;background:none;width:100%;text-align:left}
.attach-option:hover{background:var(--c-bg)}
.attach-option .material-icons{color:var(--c-primary)}

/* ── Message context menu ── */
.msg-ctx-menu{position:fixed;background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);display:none;flex-direction:column;overflow:hidden;z-index:300;min-width:160px}
.msg-ctx-menu.show{display:flex}
.ctx-option{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:14px;border:none;background:none;width:100%;text-align:left}
.ctx-option:hover{background:var(--c-bg)}
.ctx-option.danger{color:var(--c-red)}
.ctx-option .material-icons{font-size:18px;color:var(--c-sub)}
.ctx-option.danger .material-icons{color:var(--c-red)}

/* ── Image lightbox ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:500}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;object-fit:contain}
.lb-close{position:absolute;top:16px;right:16px;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── Upload progress ── */
.upload-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:8px;z-index:400}
.upload-toast.show{display:flex}

/* ── Report dialog ── */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:600;padding:16px}
.dialog-overlay.show{display:flex}
.dialog{background:var(--c-surface);border-radius:16px 16px 16px 16px;width:100%;max-width:480px;padding:20px}
.dialog h3{font-size:16px;font-weight:600;margin-bottom:12px}
.dialog select,.dialog textarea{width:100%;border:1.5px solid var(--c-border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none}
.dialog-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none}
.btn-ghost{background:var(--c-bg);color:var(--c-text)}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-danger{background:var(--c-red);color:#fff}

/* Hidden file inputs */
input[type=file]{display:none}

@media(min-width:769px){
  body{max-width:720px;margin:0 auto;border-left:1px solid var(--c-border);border-right:1px solid var(--c-border)}
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <button class="icon-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
  <div class="peer-avatar" id="peerAvatar"><span class="material-icons" id="peerAvatarIcon">person</span></div>
  <div class="peer-info">
    <div class="peer-name" id="peerName">Loading…</div>
    <div class="peer-context" id="peerContext"></div>
  </div>
  <button class="icon-btn" id="ctxToggleBtn" onclick="_toggleCtx()"><span class="material-icons">info_outline</span></button>
  <button class="icon-btn" id="moreBtn" onclick="_toggleMore()"><span class="material-icons">more_vert</span></button>
</div>

<!-- Context header -->
<div class="ctx-header collapsed" id="ctxHeader">
  <div class="ctx-inner">
    <div class="ctx-title" id="ctxTitle">Transaction Details</div>
    <div class="ctx-fields" id="ctxFields"></div>
    <div class="ctx-actions" id="ctxActions"></div>
  </div>
  <button class="ctx-toggle" onclick="_toggleCtx()">
    <span class="material-icons" style="font-size:16px">expand_less</span>
    <span>Hide details</span>
  </button>
</div>

<!-- Message list -->
<div class="msg-list" id="msgList">
  <div style="text-align:center;padding:32px;color:#9ca3af;font-size:14px">Loading messages…</div>
</div>

<!-- Typing indicator -->
<div class="typing-wrap" id="typingWrap" style="display:none">
  <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
  <span id="typingText"></span>
</div>

<!-- Reply bar -->
<div class="reply-bar" id="replyBar">
  <span class="material-icons" style="font-size:18px;color:var(--c-primary)">reply</span>
  <span class="reply-bar-text" id="replyBarText"></span>
  <button class="reply-bar-close" onclick="_clearReply()"><span class="material-icons">close</span></button>
</div>

<!-- Composer -->
<div class="composer" id="composer">
  <div class="composer-input-wrap">
    <textarea class="composer-input" id="msgInput" placeholder="Type a message…" rows="1"></textarea>
    <button class="composer-attach" id="attachBtn" onclick="_toggleAttach()"><span class="material-icons">attach_file</span></button>
  </div>
  <button class="voice-btn" id="voiceBtn" onmousedown="_startVoice()" onmouseup="_stopVoice()" ontouchstart="_startVoice(event)" ontouchend="_stopVoice(event)">
    <span class="material-icons">mic</span>
  </button>
  <button class="send-btn" id="sendBtn" onclick="_send()" disabled>
    <span class="material-icons">send</span>
  </button>
</div>

<!-- Attach menu -->
<div class="attach-menu" id="attachMenu">
  <button class="attach-option" onclick="_pickImage()"><span class="material-icons">photo</span>Photo / Image</button>
  <button class="attach-option" onclick="_pickCamera()"><span class="material-icons">photo_camera</span>Camera</button>
  <button class="attach-option" onclick="_pickPDF()"><span class="material-icons">picture_as_pdf</span>Document (PDF)</button>
</div>

<!-- Message context menu -->
<div class="msg-ctx-menu" id="msgCtxMenu">
  <button class="ctx-option" onclick="_ctxReply()"><span class="material-icons">reply</span>Reply</button>
  <button class="ctx-option danger" id="ctxDelete" onclick="_ctxDelete()"><span class="material-icons">delete</span>Delete</button>
  <button class="ctx-option" onclick="_ctxReport()"><span class="material-icons">flag</span>Report</button>
</div>

<!-- Image lightbox -->
<div class="lightbox" id="lightbox" onclick="_closeLightbox()">
  <button class="lb-close"><span class="material-icons">close</span></button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Upload progress toast -->
<div class="upload-toast" id="uploadToast">
  <span class="material-icons" style="font-size:16px">upload</span>
  <span id="uploadPct">Uploading 0%</span>
</div>

<!-- Report dialog -->
<div class="dialog-overlay" id="reportOverlay">
  <div class="dialog">
    <h3>Report Conversation</h3>
    <select id="reportReason">
      <option value="">Select a reason…</option>
      <option value="spam">Spam or unsolicited messages</option>
      <option value="fraud">Fraud or scam attempt</option>
      <option value="payment_redirect">Attempting to redirect payment outside SOKONI</option>
      <option value="abuse">Abusive or threatening language</option>
      <option value="harassment">Harassment</option>
      <option value="other">Other</option>
    </select>
    <textarea id="reportDetails" placeholder="Additional details (optional)" rows="3"></textarea>
    <div class="dialog-btns">
      <button class="btn btn-ghost" onclick="_closeReport()">Cancel</button>
      <button class="btn btn-danger" onclick="_submitReport()">Submit Report</button>
    </div>
  </div>
</div>

<!-- More menu overlay -->
<div class="msg-ctx-menu" id="moreMenu" style="top:60px;right:8px;left:auto">
  <button class="ctx-option" onclick="_toggleCtx();_closeMore()"><span class="material-icons">info</span>Transaction Details</button>
  <button class="ctx-option" onclick="_showReport();_closeMore()"><span class="material-icons">flag</span>Report Conversation</button>
</div>

<!-- Hidden file inputs -->
<input type="file" id="imgPicker" accept="image/*" onchange="_onFileChosen(this,'image')">
<input type="file" id="camPicker" accept="image/*" capture="environment" onchange="_onFileChosen(this,'image')">
<input type="file" id="pdfPicker" accept="application/pdf" onchange="_onFileChosen(this,'pdf')">

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-check-compat.js"></script>
<script src="sokoni-appcheck.js"></script>
<script src="firebase.js"></script>
<script src="sokoni-chat-engine.js"></script>
<script>
(function(){
'use strict';

var _convId   = new URLSearchParams(location.search).get('id');
var _conv     = null;
var _myUid    = null;
var _messages = [];
var _unsubMsg = null;
var _unsubTyp = null;
var _reply    = null;  /* { id, text, senderId } */
var _ctxOpen  = false;
var _ctxMsg   = null;  /* message tapped for context menu */
var _oldestTs = null;
var _hasMore  = true;

if(!_convId){ location.href='messages.html'; }

/* ── Auth ── */
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.href='login.html?redirect='+encodeURIComponent(location.href); return; }
  _myUid=user.uid;
  _init();
});

/* ── Init ── */
function _init(){
  SokoniChat.getConversation(_convId).then(function(conv){
    if(!conv){ alert('Conversation not found.'); history.back(); return; }
    _conv=conv;
    _renderHeader();
    _renderCtxHeader();
    _subscribeMessages();
    _subscribeTyping();
    SokoniChat.markRead(_convId);
  });
}

/* ── Render top bar ── */
function _renderHeader(){
  var peer=_peerData();
  document.getElementById('peerName').textContent=peer.name;
  document.getElementById('peerContext').textContent=_conv.transactionTitle||'';
  if(peer.avatar){
    document.getElementById('peerAvatar').innerHTML='<img src="'+SokoniChat.esc(peer.avatar)+'" alt="">';
  } else {
    var ctx=SokoniChat.getContext(_conv.transactionType);
    document.getElementById('peerAvatarIcon').textContent=ctx.icon;
  }
  document.title=peer.name+' — SOKONI';
}

function _peerData(){
  var others=(_conv.participants||[]).filter(function(p){return p!==_myUid;});
  var uid=others[0]||'';
  return {
    name:   (_conv.participantNames||{})[uid] || 'Unknown',
    avatar: (_conv.participantAvatars||{})[uid] || null,
    uid:    uid,
  };
}

/* ── Context header ── */
function _renderCtxHeader(){
  var ctx=SokoniChat.getContext(_conv.transactionType);
  var meta=_conv.metadata||{};
  document.getElementById('ctxTitle').textContent=ctx.label+' Details';

  /* Fields */
  var fieldsHtml='';
  ctx.fields.forEach(function(f){
    var val=meta[f];
    if(!val)return;
    var label=f.replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase();});
    fieldsHtml+='<div class="ctx-field"><div class="ctx-field-label">'+SokoniChat.esc(label)+'</div><div class="ctx-field-value">'+SokoniChat.esc(String(val))+'</div></div>';
  });
  document.getElementById('ctxFields').innerHTML=fieldsHtml;

  /* Actions */
  var actHtml=ctx.actions.map(function(a){
    return '<button class="ctx-action" onclick="_ctxAction(\''+a.id+'\')"><span class="material-icons">'+a.icon+'</span>'+SokoniChat.esc(a.label)+'</button>';
  }).join('');
  document.getElementById('ctxActions').innerHTML=actHtml;
}

function _toggleCtx(){
  _ctxOpen=!_ctxOpen;
  document.getElementById('ctxHeader').classList.toggle('collapsed',!_ctxOpen);
  document.getElementById('ctxToggleBtn').querySelector('.material-icons').textContent=
    _ctxOpen?'info':'info_outline';
}

function _ctxAction(id){
  var meta=_conv.metadata||{};
  var txId=_conv.transactionId;
  var routes={
    track_order:     'delivery-tracking.html?orderId='+txId,
    cancel_order:    'orders.html?cancel='+txId,
    return_item:     'orders.html?return='+txId,
    view_invoice:    'invoice.html?txId='+txId,
    schedule_viewing:'properties.html?view='+txId,
    book_inspection: 'car-hub.html?inspect='+txId,
    schedule_interview:'jobs.html?interview='+txId,
    book_followup:   'healthcare.html?followup='+txId,
  };
  if(routes[id]){location.href=routes[id];return;}
  alert('Action: '+id+' — coming soon');
}

/* ── Message subscription ── */
function _subscribeMessages(){
  if(_unsubMsg)_unsubMsg();
  _unsubMsg=SokoniChat.onMessagesChanged(_convId,function(err,msgs){
    if(err){console.error('[chat] msg listener error',err);return;}
    var wasAtBottom=_isAtBottom();
    _messages=msgs;
    if(msgs.length>0)_oldestTs=msgs[0].timestamp;
    _renderMessages();
    if(wasAtBottom)_scrollToBottom();
    SokoniChat.markRead(_convId);
  });
}

/* ── Typing subscription ── */
function _subscribeTyping(){
  if(_unsubTyp)_unsubTyp();
  _unsubTyp=SokoniChat.onTypingChanged(_convId,function(uids){
    var wrap=document.getElementById('typingWrap');
    if(!uids.length){wrap.style.display='none';return;}
    var names=uids.map(function(uid){
      return ((_conv.participantNames||{})[uid]||'Someone').split(' ')[0];
    });
    document.getElementById('typingText').textContent=
      names.join(', ')+(names.length===1?' is typing…':' are typing…');
    wrap.style.display='flex';
  });
}

/* ── Render messages ── */
function _renderMessages(){
  var list=document.getElementById('msgList');
  if(!_messages.length){
    list.innerHTML='<div style="text-align:center;padding:32px 16px;color:#9ca3af;font-size:14px">No messages yet. Say hello!</div>';
    return;
  }
  var html='';
  if(_hasMore&&_messages.length>=20){
    html+='<button class="load-more-btn" onclick="_loadMore()">Load older messages</button>';
  }
  var lastDate='';
  _messages.forEach(function(msg){
    var d=msg.timestamp&&msg.timestamp.toDate?msg.timestamp.toDate():new Date();
    var dateStr=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
    if(dateStr!==lastDate){
      html+='<div class="date-div">'+SokoniChat.esc(dateStr)+'</div>';
      lastDate=dateStr;
    }
    html+=_msgHtml(msg);
  });
  list.innerHTML=html;
}

function _msgHtml(msg){
  if(msg.type==='system'){
    return '<div class="msg-row system-row"><div class="msg-bubble"><span class="msg-text">'+SokoniChat.esc(msg.text||'')+'</span></div></div>';
  }
  var isSent=msg.senderId===_myUid;
  var rowCls='msg-row '+(isSent?'sent':'recv');
  var avatar='';
  if(!isSent){
    var peer=_peerData();
    avatar='<div class="msg-mini-avatar">'+(peer.avatar?'<img src="'+SokoniChat.esc(peer.avatar)+'" alt="">':SokoniChat.esc((peer.name||'?')[0].toUpperCase()))+'</div>';
  }
  var replyHtml='';
  if(msg.replyToText&&!msg.deleted){
    replyHtml='<div class="reply-preview">'+SokoniChat.esc(msg.replyToText)+'</div>';
  }
  var bodyHtml='';
  if(msg.deleted){
    bodyHtml='<span class="msg-deleted">Message deleted</span>';
  } else if(msg.type==='text'){
    bodyHtml='<span class="msg-text">'+SokoniChat.esc(msg.text||'')+'</span>';
  } else if(msg.type==='image'){
    bodyHtml='<img class="msg-img" src="" data-ref="'+SokoniChat.esc(msg.storageRef||'')+'" alt="Image" onclick="_openLightbox(this)" loading="lazy">';
  } else if(msg.type==='pdf'){
    bodyHtml='<div class="msg-pdf"><span class="material-icons">picture_as_pdf</span><div class="msg-pdf-info"><div class="msg-pdf-name">'+SokoniChat.esc(msg.fileName||'Document')+'</div><div class="msg-pdf-size">'+SokoniChat.esc(SokoniChat.fmtSize(msg.fileSize))+'</div></div></div>';
  } else if(msg.type==='voice'){
    bodyHtml='<div class="msg-voice"><button class="voice-play" onclick="_playVoice(this,\''+SokoniChat.esc(msg.storageRef||'')+'\')"><span class="material-icons">play_arrow</span></button><span class="voice-dur">'+(msg.duration?_fmtDur(msg.duration):'0:00')+'</span></div>';
  }
  var statusHtml='';
  if(isSent){
    var st=msg.status==='read'?'done_all':msg.status==='delivered'?'done_all':'check';
    var stStyle=msg.status==='read'?'color:#a5f3fc':'';
    statusHtml='<span class="material-icons msg-status" style="'+stStyle+'">'+st+'</span>';
  }
  var timeHtml='<span class="msg-time">'+SokoniChat.esc(SokoniChat.msgTime(msg.timestamp))+'</span>';
  return '<div class="'+rowCls+'" data-msgid="'+SokoniChat.esc(msg.id)+'" data-senderid="'+SokoniChat.esc(msg.senderId||'')+'" data-text="'+SokoniChat.esc((msg.text||'').slice(0,80))+'" oncontextmenu="_onCtxMenu(event,this)" onclick="_onMsgClick(event,this)">'+
    avatar+
    '<div class="msg-bubble">'+
      replyHtml+
      bodyHtml+
      '<div class="msg-footer">'+timeHtml+statusHtml+'</div>'+
    '</div>'+
  '</div>';
}

/* Load images lazily */
function _loadImages(){
  document.querySelectorAll('.msg-img[data-ref]').forEach(function(img){
    if(img.src&&img.src!==window.location.href)return;
    var ref=img.dataset.ref;
    if(!ref)return;
    SokoniChat.getAttachmentUrl(ref).then(function(url){if(url)img.src=url;});
  });
}

/* ── Load older messages ── */
function _loadMore(){
  if(!_oldestTs)return;
  var btn=document.querySelector('.load-more-btn');
  if(btn)btn.textContent='Loading…';
  SokoniChat.loadOlderMessages(_convId,_oldestTs).then(function(older){
    _hasMore=older.length>=20;
    if(older.length)_oldestTs=older[0].timestamp;
    _messages=older.concat(_messages);
    var list=document.getElementById('msgList');
    var prevH=list.scrollHeight;
    _renderMessages();
    list.scrollTop=list.scrollHeight-prevH;
    _loadImages();
  });
}

/* ── Scroll helpers ── */
function _scrollToBottom(){
  var list=document.getElementById('msgList');
  list.scrollTop=list.scrollHeight;
  setTimeout(_loadImages,200);
}
function _isAtBottom(){
  var list=document.getElementById('msgList');
  return list.scrollHeight-list.scrollTop-list.clientHeight<80;
}

/* ── Composer ── */
var _msgInput=document.getElementById('msgInput');
_msgInput.addEventListener('input',function(){
  _msgInput.style.height='auto';
  _msgInput.style.height=Math.min(_msgInput.scrollHeight,120)+'px';
  document.getElementById('sendBtn').disabled=!_msgInput.value.trim();
  SokoniChat.handleTyping(_convId);
});
_msgInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();_send();}
});

function _send(){
  var text=_msgInput.value.trim();
  if(!text||!_conv)return;
  var payload={type:'text',text:text};
  if(_reply){payload.replyToId=_reply.id;payload.replyToText=_reply.text;payload.replyToSenderId=_reply.senderId;}
  _msgInput.value='';_msgInput.style.height='auto';
  document.getElementById('sendBtn').disabled=true;
  _clearReply();
  SokoniChat.sendMessage(_convId,payload).catch(function(e){alert(e.message);});
}

/* ── Attach ── */
function _toggleAttach(){
  var m=document.getElementById('attachMenu');
  m.classList.toggle('show');
}
function _pickImage() { document.getElementById('imgPicker').click();_closeAttach(); }
function _pickCamera(){ document.getElementById('camPicker').click();_closeAttach(); }
function _pickPDF()   { document.getElementById('pdfPicker').click();_closeAttach(); }
function _closeAttach(){ document.getElementById('attachMenu').classList.remove('show'); }

function _onFileChosen(input,type){
  var file=input.files[0]; input.value='';
  if(!file)return;
  var toast=document.getElementById('uploadToast');
  toast.classList.add('show');
  var payload={type:type,file:file,onProgress:function(pct){
    document.getElementById('uploadPct').textContent='Uploading '+pct+'%';
  }};
  SokoniChat.sendMessage(_convId,payload)
    .then(function(){ toast.classList.remove('show'); })
    .catch(function(e){ toast.classList.remove('show'); alert(e.message); });
}

/* ── Voice ── */
var _isRecording=false;
function _startVoice(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(_isRecording)return;
  _isRecording=true;
  var btn=document.getElementById('voiceBtn');
  btn.classList.add('recording');
  btn.querySelector('.material-icons').textContent='stop';
  SokoniChat.startRecording().catch(function(e){
    _isRecording=false;btn.classList.remove('recording');
    btn.querySelector('.material-icons').textContent='mic';
    alert('Microphone access denied');
  });
}
function _stopVoice(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(!_isRecording)return;
  _isRecording=false;
  var btn=document.getElementById('voiceBtn');
  btn.classList.remove('recording');
  btn.querySelector('.material-icons').textContent='mic';
  SokoniChat.stopRecording().then(function(result){
    if(!result||!result.blob)return;
    var file=new File([result.blob],'voice.webm',{type:result.blob.type});
    var toast=document.getElementById('uploadToast');
    toast.classList.add('show');
    SokoniChat.sendMessage(_convId,{type:'voice',file:file,duration:result.duration})
      .then(function(){toast.classList.remove('show');})
      .catch(function(e){toast.classList.remove('show');alert(e.message);});
  });
}

/* ── Voice playback ── */
var _audioEl=null;
function _playVoice(btn,storageRef){
  if(!storageRef)return;
  if(_audioEl){_audioEl.pause();_audioEl=null;}
  SokoniChat.getAttachmentUrl(storageRef).then(function(url){
    if(!url)return;
    _audioEl=new Audio(url);
    btn.querySelector('.material-icons').textContent='pause';
    _audioEl.play();
    _audioEl.onended=function(){btn.querySelector('.material-icons').textContent='play_arrow';_audioEl=null;};
    _audioEl.onerror=function(){alert('Could not play voice note.');};
  });
}

function _fmtDur(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}

/* ── Image lightbox ── */
function _openLightbox(img){
  var url=img.src;if(!url)return;
  document.getElementById('lightboxImg').src=url;
  document.getElementById('lightbox').classList.add('show');
}
function _closeLightbox(){document.getElementById('lightbox').classList.remove('show');}

/* ── Reply ── */
function _setReply(msgEl){
  var id=msgEl.dataset.msgid;
  var text=msgEl.dataset.text;
  var senderId=msgEl.dataset.senderid;
  _reply={id:id,text:text,senderId:senderId};
  document.getElementById('replyBarText').textContent=text||'[Attachment]';
  document.getElementById('replyBar').classList.add('show');
  _msgInput.focus();
}
function _clearReply(){
  _reply=null;
  document.getElementById('replyBar').classList.remove('show');
}

/* ── Message context menu ── */
function _onMsgClick(e,el){
  if(e.target.closest('.msg-img,.voice-play,.ctx-action'))return;
  _closeMenus();
}
function _onCtxMenu(e,el){
  e.preventDefault();
  _ctxMsg=el;
  var menu=document.getElementById('msgCtxMenu');
  document.getElementById('ctxDelete').style.display=
    el.dataset.senderid===_myUid?'flex':'none';
  menu.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';
  menu.style.top=Math.min(e.clientY,window.innerHeight-150)+'px';
  menu.classList.add('show');
}
function _ctxReply(){
  if(_ctxMsg)_setReply(_ctxMsg);
  _closeMenus();
}
function _ctxDelete(){
  if(!_ctxMsg)return;
  var id=_ctxMsg.dataset.msgid;
  if(!confirm('Delete this message?'))return;
  SokoniChat.deleteMessage(_convId,id).catch(function(e){alert(e.message);});
  _closeMenus();
}
function _ctxReport(){_closeMenus();_showReport();}
function _closeMenus(){
  document.getElementById('msgCtxMenu').classList.remove('show');
  document.getElementById('attachMenu').classList.remove('show');
  document.getElementById('moreMenu').classList.remove('show');
}

/* ── Report ── */
function _showReport(){document.getElementById('reportOverlay').classList.add('show');}
function _closeReport(){
  document.getElementById('reportOverlay').classList.remove('show');
  document.getElementById('reportReason').value='';
  document.getElementById('reportDetails').value='';
}
function _submitReport(){
  var reason=document.getElementById('reportReason').value;
  if(!reason){alert('Please select a reason.');return;}
  var details=document.getElementById('reportDetails').value.trim();
  SokoniChat.reportConversation(_convId,reason,details)
    .then(function(){_closeReport();alert('Report submitted. Our team will review it.');})
    .catch(function(e){alert('Could not submit report: '+e.message);});
}

/* ── More menu ── */
function _toggleMore(){document.getElementById('moreMenu').classList.toggle('show');}
function _closeMore(){document.getElementById('moreMenu').classList.remove('show');}

/* ── Close menus on outside click ── */
document.addEventListener('click',function(e){
  if(!e.target.closest('#attachMenu')&&!e.target.closest('#attachBtn'))_closeAttach();
  if(!e.target.closest('#msgCtxMenu'))document.getElementById('msgCtxMenu').classList.remove('show');
  if(!e.target.closest('#moreMenu')&&!e.target.closest('#moreBtn'))_closeMore();
});

/* ── Cleanup ── */
window.addEventListener('beforeunload',function(){
  if(_unsubMsg)_unsubMsg();
  if(_unsubTyp)_unsubTyp();
  SokoniChat.setTyping(_convId,false);
});
})();
</script>
</body>
</html>
