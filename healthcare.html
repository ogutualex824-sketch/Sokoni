<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Healthcare — SOKONI</title>
<link rel="icon" href="/assets/logosokoni.png">
<script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.12.0/firebase-functions-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:18px;color:#3fb950}.hdr-back{color:#8b949e;font-size:14px;cursor:pointer}
.hero{background:linear-gradient(135deg,#0d1117 0%,#0a1a10 100%);padding:44px 16px 32px;text-align:center}
.hero h1{font-size:clamp(24px,5vw,38px);font-weight:700;margin-bottom:8px}
.hero p{color:#8b949e;font-size:14px;max-width:480px;margin:0 auto 24px}
.search-row{display:flex;gap:8px;max-width:580px;margin:0 auto}
.search-row input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px}
.search-row input:focus{outline:none;border-color:#3fb950}
.tabs{display:flex;border-bottom:1px solid #30363d;padding:0 16px;background:#161b22}
.tab{padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:#8b949e}
.tab.active{color:#e6edf3;border-color:#3fb950}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.chip{padding:6px 13px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#8b949e;transition:.2s;white-space:nowrap}
.chip.active,.chip:hover{background:#238636;border-color:#238636;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;cursor:pointer;transition:.2s}
.card:hover{border-color:#3fb950;transform:translateY(-2px)}
.card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#1a3a2a;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.card-name{font-weight:600;font-size:15px}.card-spec{font-size:12px;color:#3fb950;text-transform:capitalize;margin-top:2px}
.card-sub{font-size:13px;color:#8b949e;margin-top:3px}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #30363d}
.rating{font-size:13px;color:#f0883e}.fee{font-size:14px;font-weight:600;color:#58a6ff}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.b-green{background:#1a3a2a;color:#3fb950}.b-blue{background:#1a2a3a;color:#58a6ff}
.empty{text-align:center;padding:60px;color:#8b949e}.spinner{display:inline-block;width:24px;height:24px;border:2px solid #30363d;border-top-color:#3fb950;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{padding:11px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn-green{background:#238636;color:#fff}.btn-green:hover{background:#2ea043}
.btn-outline{background:transparent;border:1px solid #30363d;color:#e6edf3}.btn-outline:hover{border-color:#8b949e}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.mhdr{padding:18px 22px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.mhdr h2{font-size:16px;font-weight:600}.xbtn{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
.mbody{padding:22px}
.detail-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;color:#8b949e}
.detail-row strong{color:#e6edf3}
.divider{border:none;border-top:1px solid #30363d;margin:14px 0}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:#8b949e;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px}
.fg textarea{resize:vertical;min-height:80px}
.tog-row{display:flex;gap:8px;margin-bottom:14px}
.tog{flex:1;padding:9px;border:1px solid #30363d;border-radius:8px;text-align:center;cursor:pointer;font-size:13px;transition:.2s}
.tog.sel{border-color:#3fb950;background:#1a3a2a;color:#3fb950}
.appt-card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:10px}
.s{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:6px}
.s-pending{background:#2d2a1a;color:#e3b341}.s-confirmed{background:#1a3a2a;color:#3fb950}
.s-completed{background:#1a2a3a;color:#58a6ff}.s-cancelled{background:#2d1a1a;color:#f85149}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:999;animation:fi .3s;max-width:300px}
.tok{background:#238636;color:#fff}.terr{background:#da3633;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-back" onclick="history.back()">← Back</span>
  <div class="logo">🏥 Healthcare</div>
</div>
<div class="hero">
  <h1>Find Healthcare Providers</h1>
  <p>Book appointments with doctors, dentists, specialists and other health professionals across Kenya.</p>
  <div class="search-row">
    <input id="sq" type="text" placeholder="Search by name, specialization or city…" oninput="debounce()">
    <button class="btn btn-green" onclick="doSearch()">Search</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="setTab('browse',this)">Browse Providers</div>
  <div class="tab" onclick="setTab('appointments',this)">My Appointments</div>
</div>
<div class="container">
  <div id="pBrowse">
    <div class="filters" id="specChips"></div>
    <div class="filters">
      <input id="cityF" type="text" placeholder="City…" style="padding:6px 12px;border-radius:20px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:13px;width:130px" oninput="filter()">
      <div class="chip" id="onlineChip" onclick="toggleOnline()">Online Only</div>
    </div>
    <div id="provArea" style="text-align:center;padding:40px"><div class="spinner"></div></div>
  </div>
  <div id="pAppts" style="display:none">
    <div id="apptArea" style="text-align:center;padding:40px"><div class="spinner"></div></div>
  </div>
</div>

<div class="overlay" id="provModal">
  <div class="modal">
    <div class="mhdr"><h2 id="mName"></h2><button class="xbtn" onclick="close('provModal')">×</button></div>
    <div class="mbody">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <span id="mSpec" class="badge b-green"></span><span id="mOnline" class="badge"></span>
      </div>
      <div class="detail-row">🏥 <strong id="mClinic"></strong></div>
      <div class="detail-row">📍 <span id="mLoc"></span></div>
      <div class="detail-row">💰 <strong id="mFee"></strong></div>
      <div class="detail-row">⭐ <span id="mRating"></span></div>
      <div class="detail-row">🌐 <span id="mLangs"></span></div>
      <div class="detail-row" id="mInsRow">🛡️ <span id="mIns"></span></div>
      <hr class="divider">
      <p id="mBio" style="font-size:14px;color:#8b949e;line-height:1.6;margin-bottom:16px"></p>
      <button class="btn btn-green" style="width:100%" onclick="openBook()">Book Appointment</button>
    </div>
  </div>
</div>

<div class="overlay" id="bookModal">
  <div class="modal">
    <div class="mhdr"><h2>Book Appointment</h2><button class="xbtn" onclick="close('bookModal')">×</button></div>
    <div class="mbody">
      <div class="tog-row">
        <div class="tog sel" id="tIn" onclick="selConsult('in')">🏥 In-Person</div>
        <div class="tog" id="tOnl" onclick="selConsult('online')">🌐 Online</div>
      </div>
      <div class="fg"><label>Appointment Date & Time</label><input type="datetime-local" id="apptDT" min=""></div>
      <div class="fg"><label>Reason for visit</label><textarea id="apptR" placeholder="Describe your concern…"></textarea></div>
      <button class="btn btn-green" style="width:100%;margin-top:4px" onclick="book()">Confirm Booking</button>
    </div>
  </div>
</div>

<script src="/sokoni-config.js"></script>
<script>
let app,fns,auth,cu=null,allP=[],selP=null,onlineOnly=false,isOnline=false,dt;

const SPECS=['general_practice','pediatrics','obstetrics','cardiology','dermatology',
  'dentistry','ophthalmology','orthopedics','psychiatry','physiotherapy',
  'nutrition','pharmacy','laboratory','radiology','other'];
const EMO={general_practice:'👨‍⚕️',pediatrics:'👶',obstetrics:'🤰',cardiology:'❤️',
  dermatology:'🧴',dentistry:'🦷',ophthalmology:'👁️',orthopedics:'🦴',psychiatry:'🧠',
  physiotherapy:'💪',nutrition:'🥗',pharmacy:'💊',laboratory:'🔬',radiology:'📡',other:'🏥'};

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m,ok=true){const t=document.createElement('div');t.className='toast '+(ok?'tok':'terr');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
function open(id){document.getElementById(id).classList.add('open');}
function close(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

try{
  app=firebase.initializeApp(firebaseConfig,'hc');
  fns=app.functions('us-central1');auth=app.auth();
  auth.onAuthStateChanged(u=>{cu=u;});
}catch(e){}

async function call(n,d){try{const r=await fns.httpsCallable(n)(d);return{ok:true,data:r.data};}catch(e){return{ok:false,err:e.message};}}

let specF='',dbt;
function debounce(){clearTimeout(dbt);dbt=setTimeout(doSearch,400);}

function buildChips(){
  const c=document.getElementById('specChips');
  c.innerHTML=`<div class="chip ${specF===''?'active':''}" onclick="setSpec('',this)">All</div>`+
  SPECS.map(s=>`<div class="chip ${specF===s?'active':''}" onclick="setSpec('${s}',this)">${EMO[s]||'🏥'} ${s.replace(/_/g,' ')}</div>`).join('');
}

function setSpec(s,el){
  specF=s;
  document.querySelectorAll('#specChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');filter();
}
function toggleOnline(){onlineOnly=!onlineOnly;document.getElementById('onlineChip').classList.toggle('active',onlineOnly);filter();}

function filter(){
  const city=document.getElementById('cityF').value.toLowerCase();
  let list=[...allP];
  if(specF) list=list.filter(p=>p.specialization===specF);
  if(onlineOnly) list=list.filter(p=>p.isOnline);
  if(city) list=list.filter(p=>(p.city||'').toLowerCase().includes(city));
  render(list);
}

async function doSearch(){
  const q=document.getElementById('sq').value.trim();
  if(q.length>1){const r=await call('searchHealthProviders',{query:q,limit:40});if(r.ok)render(r.data.results);}
  else filter();
}

async function load(){
  const r=await call('getHealthProviders',{limit:48});
  if(!r.ok){document.getElementById('provArea').innerHTML=`<div class="empty">Could not load providers.<br><small>${esc(r.err)}</small></div>`;return;}
  allP=r.data.providers||[];render(allP);
}

function render(list){
  const a=document.getElementById('provArea');
  if(!list.length){a.innerHTML='<div class="empty">No providers found.</div>';return;}
  a.innerHTML='<div class="grid">'+list.map(p=>`
    <div class="card" onclick="openP('${esc(p.providerId)}')">
      <div class="card-top">
        <div class="avatar">${EMO[p.specialization]||'🏥'}</div>
        <div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="card-spec">${(p.specialization||'').replace(/_/g,' ')}</div>
          <div class="card-sub">${esc(p.clinic||p.city||'')}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        ${p.isOnline?'<span class="badge b-green">Online</span>':''}
        ${p.isAvailable?'<span class="badge b-blue">Available</span>':''}
      </div>
      <div class="card-row">
        <span class="rating">★ ${p.rating||'—'} (${p.ratingCount||0})</span>
        <span class="fee">KES ${(p.consultationFee||0).toLocaleString()}</span>
      </div>
    </div>`).join('')+'</div>';
}

async function openP(id){
  selP=allP.find(p=>p.providerId===id);
  if(!selP){const r=await call('getHealthProvider',{providerId:id});if(!r.ok){toast('Could not load provider',false);return;}selP=r.data;}
  const p=selP;
  document.getElementById('mName').textContent=p.name||'';
  document.getElementById('mSpec').textContent=(p.specialization||'').replace(/_/g,' ');
  document.getElementById('mOnline').textContent=p.isOnline?'Online':'In-Person';
  document.getElementById('mOnline').className='badge '+(p.isOnline?'b-green':'b-blue');
  document.getElementById('mClinic').textContent=p.clinic||'';
  document.getElementById('mLoc').textContent=[p.city,p.county].filter(Boolean).join(', ')||'Kenya';
  document.getElementById('mFee').textContent=`KES ${(p.consultationFee||0).toLocaleString()} / consultation`;
  document.getElementById('mRating').textContent=`${p.rating||0}/5 (${p.ratingCount||0} reviews)`;
  document.getElementById('mLangs').textContent=(p.languages||[]).join(', ');
  const ins=p.insuranceAccepted||[];
  document.getElementById('mInsRow').style.display=ins.length?'':'none';
  document.getElementById('mIns').textContent=ins.join(', ');
  document.getElementById('mBio').textContent=p.bio||'';
  open('provModal');
}

function openBook(){
  if(!cu){toast('Sign in to book appointments',false);return;}
  const m=new Date();m.setHours(m.getHours()+1);
  document.getElementById('apptDT').min=m.toISOString().slice(0,16);
  close('provModal');open('bookModal');
}
function selConsult(t){
  isOnline=t==='online';
  document.getElementById('tIn').classList.toggle('sel',!isOnline);
  document.getElementById('tOnl').classList.toggle('sel',isOnline);
}
async function book(){
  const dt=document.getElementById('apptDT').value;
  const reason=document.getElementById('apptR').value.trim();
  if(!dt){toast('Select date and time',false);return;}
  if(!reason){toast('Describe your reason for visit',false);return;}
  const key=`appt_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const b=document.querySelector('#bookModal .btn-green');b.textContent='Booking…';b.disabled=true;
  const r=await call('bookAppointment',{providerId:selP.providerId,dateTime:new Date(dt).toISOString(),reason,isOnline,idempotencyKey:key});
  b.textContent='Confirm Booking';b.disabled=false;
  if(r.ok){toast('Appointment booked! Awaiting confirmation.');close('bookModal');document.getElementById('apptDT').value='';document.getElementById('apptR').value='';}
  else toast(r.err||'Booking failed',false);
}

async function loadAppts(){
  const a=document.getElementById('apptArea');
  if(!cu){a.innerHTML='<div class="empty">Sign in to view appointments.</div>';return;}
  a.innerHTML='<div style="text-align:center;padding:40px"><div class="spinner"></div></div>';
  const r=await call('getMyAppointments',{limit:30});
  if(!r.ok){a.innerHTML='<div class="empty">Could not load appointments.</div>';return;}
  const list=r.data.appointments||[];
  if(!list.length){a.innerHTML='<div class="empty">No appointments yet.</div>';return;}
  a.innerHTML=list.map(a=>`
    <div class="appt-card">
      <div class="s s-${a.status}">${(a.status||'').replace(/_/g,' ')}</div>
      <div style="font-weight:600">${esc(a.providerName||'')}</div>
      <div style="font-size:13px;color:#8b949e">${(a.specialization||'').replace(/_/g,' ')}</div>
      <div style="font-size:13px;margin:4px 0">📅 ${new Date(a.dateTime).toLocaleString()}</div>
      <div style="font-size:13px;color:#8b949e">${esc(a.reason||'')}</div>
      <div style="font-size:13px;margin-top:6px">${a.isOnline?'🌐 Online':'🏥 In-person'} · KES ${(a.consultationFee||0).toLocaleString()}</div>
    </div>`).join('');
}

function setTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  document.getElementById('pBrowse').style.display=t==='browse'?'':'none';
  document.getElementById('pAppts').style.display=t==='appointments'?'':'none';
  if(t==='appointments')loadAppts();
}

buildChips();load();
</script>
</body>
</html>
