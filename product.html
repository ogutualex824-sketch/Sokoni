     The logo, cart, cart badge, login button and profile avatar were removed —
     they duplicated the global nav (which this page no longer injects) and the
     absolutely-centred title rendered ON TOP of the logo. All of those controls
     remain reachable from the bottom nav. -->

<!-- The header auth script was removed with the elements it drove (#authButtons,
     #pnpProfileAvatar, #pnpProfileInitial). It was already null-guarded, so it
     would have become a silent no-op; deleting it avoids leaving dead code that
     implies those controls still exist. Sign-in state is unaffected — nothing
     else on this page read it, and auth remains handled globally. -->

<style>
.product-nav-premium {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(5,5,5,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(113,255,0,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 1000;
}
/* Three-column header: fixed-width control, flexible centred title, fixed-width
   control. The title was `position:absolute; left:50%`, which floated it over
   the logo and collided on narrow screens. Giving the title flex:1 and centring
   its text keeps it optically centred between two equal-width controls without
   overlapping anything, at any width. */
.pnp-title {
  flex: 1;
  text-align: center;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pnp-back {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 14px;
  transition: all .15s;
}
.pnp-back:hover { background: rgba(113,255,0,0.1); border-color: rgba(113,255,0,0.3); color: #71ff00; }
/* .pnp-logo / .pnp-logo-link / .pnp-center removed with their markup.
   .pnp-title keeps its typography here; its LAYOUT is set above. */
.pnp-title { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.72); letter-spacing: .04em; text-transform: uppercase; }
.pnp-icon-btn {
  position: relative;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 10px;
  color: rgba(255,255,255,0.65);
  text-decoration: none;
  font-size: 14px;
  transition: all .15s;
}
.pnp-icon-btn:hover { background: rgba(113,255,0,0.1); border-color: rgba(113,255,0,0.3); color: #71ff00; }
.pnp-cart-badge {
  position: absolute;
  top: -5px; right: -5px;
  min-width: 17px; height: 17px;
  background: #71ff00;
  color: #070707;
  font-size: 9px;
  font-weight: 900;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
  line-height: 1;
}
.pnp-login-btn {
  padding: 7px 16px;
  background: rgba(113,255,0,0.1);
  border: 1px solid rgba(113,255,0,0.25);
  border-radius: 10px;
  color: #71ff00;
  font-size: 12px;
  font-weight: 800;
  text-decoration: none;
  transition: all .15s;
}
.pnp-login-btn:hover { background: rgba(113,255,0,0.2); }
.pnp-avatar {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(113,255,0,0.1);
  border: 1px solid rgba(113,255,0,0.3);
  border-radius: 50%;
  color: #71ff00;
  font-size: 14px;
  font-weight: 900;
  text-decoration: none;
  transition: background .15s;
}
.pnp-avatar:active { background: rgba(113,255,0,0.22); }
/* Push content below fixed nav */
/* Matches the 60px header. Was 72px, which assumed the global site header sat
   above this one; that header is no longer injected here (data-no-header). */
.product-page { padding-top: 60px; }
/* Mobile tweaks */
@media (max-width: 600px) {
  .product-nav-premium { height: 56px; padding: 0 10px; }
  .pnp-title { font-size: 12px; }
  /* 44px keeps both controls at the iOS/Android minimum tap target. */
  .pnp-back { width: 44px; height: 44px; min-width: 44px; font-size: 15px; }
  .pnp-icon-btn { width: 44px; height: 44px; min-width: 44px; font-size: 16px; }
  /* Matches the 56px header exactly — no gap, no content hidden beneath it. */
  .product-page { padding-top: 56px; }
}
</style>

<script>
/* Poll until product.js sets window._productSellerUid, then badge the seller name */
(function() {
  var _tries = 0;
  var _t = setInterval(function() {
    _tries++;
    if (!window.SokoniVerifications || !window._productSellerUid) {
      if (_tries >= 30) clearInterval(_t);
      return;
    }
    clearInterval(_t);
    var nameEl = document.getElementById('sellerName') || document.querySelector('.product-seller-name');
    if (nameEl) SokoniVerifications.badge(window._productSellerUid, nameEl, { size: 'sm' });
    SokoniVerifications.wireAll({ size: 'sm' });
  }, 400);
})();
</script>

<script>
/* QR button — injected after product ID is resolved */
document.addEventListener('DOMContentLoaded', () => {
  const _injectQR = () => {
    const id = new URLSearchParams(location.search).get('id') || window._currentProductId;
    if (!id || document.getElementById('_prd_qr_btn')) return;
    /* Anchor to the PAGE, not the header. This used to insert itself beside the
       wishlist link, whose parent was the header's right-hand group — so the QR
       button became a fourth header control. The header is now strictly
       back · title · wishlist, so it lands in the content instead. The QR
       feature itself is unchanged; only where the trigger lives moved. */
    const host = document.getElementById('productPageContainer')
              || document.querySelector('.product-page');
    if (!host) return;
    const btn = document.createElement('button');
    btn.id = '_prd_qr_btn';
    btn.title = 'Show QR Code';
    btn.setAttribute('aria-label', 'Show QR code for this product');
    btn.textContent = '📱';
    /* Deliberately NOT absolutely positioned. An earlier attempt pinned this to
       the container's top-right and it landed squarely on the product photo —
       obscuring the very content the page exists to show. In normal flow it
       cannot overlap anything, at any viewport size. */
    btn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;'
      + 'gap:6px;margin:10px 0 0;padding:8px 14px;min-height:40px;border-radius:12px;'
      + 'background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);'
      + 'color:rgba(255,255,255,0.75);cursor:pointer;font-size:13px;font-family:inherit;';
    btn.onclick = () => window.SokoniQR?.showModal('product', id, document.title.split('—')[0].trim());
    /* Sits directly beneath the gallery when there is one, so it reads as a
       product action rather than floating chrome. */
    const gal = host.querySelector('.prd-gallery-wrap');
    if (gal && gal.parentNode) gal.parentNode.insertBefore(btn, gal.nextSibling);
    else host.appendChild(btn);
  };
  setTimeout(_injectQR, 600);
  window.addEventListener('productLoaded', _injectQR);
});
</script>

<div id="reportListingBar" style="text-align:center;padding:8px 16px 4px;display:none;">
  <button onclick="openReportListing()" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;">⚑ Report this listing</button>
</div>
<div id="reportModal" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:16px;">
  <div style="background:#111;border:1px solid rgba(113,255,0,0.2);border-radius:20px;padding:24px;width:100%;max-width:400px;">
    <h3 style="margin:0 0 16px;color:white;font-size:16px;">⚑ Report Listing</h3>
    <select id="reportListingReason" style="width:100%;padding:12px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:white;font-size:16px;margin-bottom:12px;font-family:inherit;">
      <option value="">Select a reason...</option>
      <option>Counterfeit / fake item</option>
      <option>Misleading description</option>
      <option>Prohibited item</option>
      <option>Wrong price / scam</option>
      <option>Duplicate listing</option>
      <option>Other</option>
    </select>
    <textarea id="reportListingDetails" placeholder="Additional details (optional)" style="width:100%;padding:12px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:white;font-size:16px;resize:vertical;min-height:80px;font-family:inherit;margin-bottom:12px;"></textarea>
    <div style="display:flex;gap:10px;">
      <button onclick="submitListingReport()" style="flex:1;padding:12px;background:#71ff00;border:none;border-radius:10px;color:#000;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;">Submit Report</button>
      <button onclick="document.getElementById('reportModal').style.display='none'" style="padding:12px 16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:14px;cursor:pointer;font-family:inherit;">Cancel</button>
    </div>
  </div>
</div>
<script>
function openReportListing(){
  var u = window.firebaseAuth && window.firebaseAuth.currentUser;
  if(!u){ (window._skToast||alert)('Please sign in to report a listing.'); window.location.href='login.html?next='+encodeURIComponent(location.pathname+location.search); return; }
  document.getElementById('reportModal').style.display='flex';
}
function submitListingReport(){
  var reason=document.getElementById('reportListingReason').value;
  var details=document.getElementById('reportListingDetails').value;
  if(!reason){(window._skToast||alert)('Please select a reason.');return;}
  var pid=new URLSearchParams(location.search).get('id')||'unknown';
  if(window.SokoniReport){
    SokoniReport.submit('listing',pid,reason,details).then(function(){
      document.getElementById('reportModal').style.display='none';
      document.getElementById('reportListingReason').value='';
      document.getElementById('reportListingDetails').value='';
    });
  } else {
    document.getElementById('reportModal').style.display='none';
    (window._skToast||alert)('Report submitted. Thank you.');
  }
}
// Show report bar after page loads
window.addEventListener('DOMContentLoaded',function(){
  var bar=document.getElementById('reportListingBar');
  if(bar)bar.style.display='block';
});
</script>

  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var productId = params.get("id") || params.get("product");
    if (!productId) return;
    var section   = document.getElementById("productReviewsSection");
    var container = document.getElementById("productReviewsContainer");
    if (!section || !container) return;
    section.style.display = "block";
    function _initReviews() {
      if (window.SokoniReviews) {
        var rv = new SokoniReviews("product_" + productId, "product", { targetName: document.title });
        rv.render(container);
      } else {
        setTimeout(_initReviews, 200);
      }
    }
    document.addEventListener("DOMContentLoaded", _initReviews);
    if (document.readyState !== "loading") _initReviews();
  })();
  </script>
