<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Triage — SOKONI Admin</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="sokoni-tokens.css">
  <style>
    :root{
      --bg:#050505;--sur:#0d0d0d;--sur2:#141414;
      --g:#71ff00;--ga:rgba(113,255,0,.12);--ga2:rgba(113,255,0,.06);
      --bor:#1a1a1a;--bor2:#222;--txt:#e8e8e8;--sub:#888;--radius:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
    .af-wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
    .af-sub{color:var(--sub);font-size:.875rem;margin-bottom:24px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
    select{padding:8px 12px;border:1.5px solid var(--bor);border-radius:8px;font-size:.875rem;background:var(--sur2);color:var(--txt);cursor:pointer;min-width:130px}
    select:focus{outline:none;border-color:var(--g)}
    .btn-load{padding:8px 18px;border:none;border-radius:8px;background:var(--g);color:#000;font-size:.875rem;font-weight:600;cursor:pointer}
    .btn-load:hover{opacity:.88}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .badge-bug{background:rgba(153,27,27,.25);color:#fca5a5;border:1px solid rgba(153,27,27,.4)}
    .badge-feature{background:rgba(3,105,161,.25);color:#7dd3fc;border:1px solid rgba(3,105,161,.4)}
    .badge-page_rating{background:rgba(113,63,18,.25);color:#fde68a;border:1px solid rgba(113,63,18,.4)}
    .badge-incorrect_listing{background:rgba(159,18,57,.25);color:#fda4af;border:1px solid rgba(159,18,57,.4)}
    .badge-other{background:rgba(55,65,81,.25);color:#9ca3af;border:1px solid rgba(55,65,81,.4)}
    .badge-new{background:rgba(146,64,14,.25);color:#fde68a;border:1px solid rgba(146,64,14,.4)}
    .badge-reviewing{background:rgba(3,105,161,.25);color:#7dd3fc;border:1px solid rgba(3,105,161,.4)}
    .badge-resolved{background:rgba(6,95,70,.25);color:#6ee7b7;border:1px solid rgba(6,95,70,.4)}
    .badge-wontfix{background:rgba(75,85,99,.25);color:#9ca3af;border:1px solid rgba(75,85,99,.4)}
    .fb-list{display:flex;flex-direction:column;gap:12px}
    .fb-card{background:var(--sur);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.4);border-left:4px solid var(--bor);transition:border-color .2s}
    .fb-card.status-new{border-left-color:#f59e0b}
    .fb-card.status-reviewing{border-left-color:#3b82f6}
    .fb-card.status-resolved{border-left-color:#10b981}
    .fb-card.status-wontfix{border-left-color:#6b7280}
    .fb-header{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .fb-meta{flex:1;min-width:0}
    .fb-type-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
    .fb-ts{font-size:.7rem;color:var(--sub)}
    .fb-msg{font-size:.875rem;color:var(--txt);line-height:1.5;margin-bottom:10px;white-space:pre-line;word-break:break-word}
    .fb-url{font-size:.7rem;color:var(--sub);margin-bottom:10px;word-break:break-all}
    .fb-note{font-size:.8rem;color:var(--txt);background:var(--sur2);padding:8px 12px;border-radius:6px;margin-bottom:10px;font-style:italic;border:1px solid var(--bor)}
    .stars{color:#f59e0b;font-size:1rem;letter-spacing:-.05em}
    .triage-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .triage-row select{padding:6px 10px;font-size:.8rem;min-width:110px}
    .triage-row textarea{flex:1;min-width:180px;padding:6px 10px;border:1.5px solid var(--bor);border-radius:8px;font-size:.8rem;resize:none;height:36px;font-family:inherit;background:var(--sur2);color:var(--txt)}
    .triage-row textarea:focus{outline:none;border-color:var(--g)}
    .btn-save{padding:6px 16px;border:none;border-radius:8px;background:#10b981;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
    .btn-save:hover{background:#059669}
    .btn-save:disabled{background:#374151;color:var(--sub);cursor:not-allowed}
    .empty-state{text-align:center;padding:64px 24px;color:var(--sub);font-size:.875rem}
    .skeleton{background:linear-gradient(90deg,var(--sur) 25%,var(--sur2) 50%,var(--sur) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:100px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .count-tag{margin-left:auto;font-size:.75rem;color:var(--sub);font-weight:600}
    .badge-priority-low{background:rgba(75,85,99,.25);color:#9ca3af;border:1px solid rgba(75,85,99,.4)}
    .badge-priority-medium{background:rgba(3,105,161,.25);color:#7dd3fc;border:1px solid rgba(3,105,161,.4)}
    .badge-priority-high{background:rgba(146,64,14,.25);color:#fde68a;border:1px solid rgba(146,64,14,.4)}
    .badge-priority-critical{background:rgba(153,27,27,.25);color:#fca5a5;border:1px solid rgba(153,27,27,.4)}
  </style>
</head>
<body>
<div class="af-wrap">
  <h1>Feedback Triage</h1>
  <div class="af-sub">Review and action user-submitted feedback</div>

  <div class="toolbar">
    <select id="filterType">
      <option value="">All types</option>
      <option value="bug">Bug Reports</option>
      <option value="feature">Feature Requests</option>
      <option value="page_rating">Page Ratings</option>
      <option value="incorrect_listing">Incorrect Listings</option>
      <option value="other">Other</option>
    </select>
    <select id="filterStatus">
      <option value="new">New</option>
      <option value="reviewing">Reviewing</option>
      <option value="">All statuses</option>
      <option value="resolved">Resolved</option>
      <option value="wontfix">Won't Fix</option>
    </select>
    <select id="filterPriority">
      <option value="">All priorities</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <button class="btn-load" id="btnLoad">Load</button>
    <span class="count-tag" id="countTag"></span>
  </div>

  <div id="fbList" class="fb-list">
    <div class="skeleton"></div>
    <div class="skeleton" style="margin-top:12px;height:80px"></div>
  </div>
</div>

<script src="firebase.js"></script>
<script type="module">
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  const fns              = getFunctions(undefined, "us-central1");
  const getFeedbackItems = httpsCallable(fns, "getFeedbackItems");
  const updateStatus     = httpsCallable(fns, "updateFeedbackStatus");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function badge(cls, text) { return `<span class="badge badge-${esc(cls)}">${esc(text)}</span>`; }

  function stars(n) {
    if (!n) return "";
    return '<span class="stars">' + "★".repeat(n) + "☆".repeat(5 - n) + "</span>";
  }

  function ts(ms) {
    if (!ms) return "";
    return new Date(ms).toLocaleString();
  }

  function renderCard(item) {
    const typeLabel = { bug:"Bug", feature:"Feature", page_rating:"Rating",
                        incorrect_listing:"Listing", other:"Other" }[item.type] || item.type;
    const pri    = item.priority || "medium";
    const safeId = esc(item.id);
    return `
    <div class="fb-card status-${esc(item.status)}" id="card-${safeId}">
      <div class="fb-header">
        <div class="fb-meta">
          <div class="fb-type-row">
            ${badge(item.type, typeLabel)}
            ${badge(item.status, item.status)}
            ${badge("priority-" + pri, pri.toUpperCase())}
            ${item.rating ? stars(item.rating) : ""}
          </div>
          <div class="fb-ts">${ts(item.createdAt)}${item.uid ? " &middot; uid: " + esc(item.uid.substring(0,8)) + "&hellip;" : " &middot; anonymous"}</div>
        </div>
      </div>
      <div class="fb-msg">${esc(item.message)}</div>
      ${item.pageUrl ? `<div class="fb-url">Page: ${esc(item.pageUrl)}</div>` : ""}
      ${item.adminNote ? `<div class="fb-note">Admin note: ${esc(item.adminNote)}</div>` : ""}
      <div class="triage-row">
        <select id="sel-${safeId}" aria-label="Change status">
          <option value="new"       ${item.status==="new"       ?"selected":""}>New</option>
          <option value="reviewing" ${item.status==="reviewing" ?"selected":""}>Reviewing</option>
          <option value="resolved"  ${item.status==="resolved"  ?"selected":""}>Resolved</option>
          <option value="wontfix"   ${item.status==="wontfix"   ?"selected":""}>Won't Fix</option>
        </select>
        <select id="pri-${safeId}" aria-label="Priority">
          <option value="low"      ${pri==="low"      ?"selected":""}>Low</option>
          <option value="medium"   ${pri==="medium"   ?"selected":""}>Medium</option>
          <option value="high"     ${pri==="high"     ?"selected":""}>High</option>
          <option value="critical" ${pri==="critical" ?"selected":""}>Critical</option>
        </select>
        <textarea id="note-${safeId}" placeholder="Add admin note (optional)">${esc(item.adminNote || "")}</textarea>
        <button class="btn-save" data-id="${safeId}" aria-label="Save triage">Save</button>
      </div>
    </div>`;
  }

  async function load() {
    const type   = document.getElementById("filterType").value;
    const status = document.getElementById("filterStatus").value;
    document.getElementById("fbList").innerHTML =
      '<div class="skeleton"></div><div class="skeleton" style="margin-top:12px;height:80px"></div>';
    document.getElementById("countTag").textContent = "";

    try {
      const { data } = await getFeedbackItems({ type: type || undefined, status: status || undefined, limit: 50 });
      if (!data || data.length === 0) {
        document.getElementById("fbList").innerHTML =
          '<div class="empty-state">No feedback items match the current filters.</div>';
        return;
      }
      document.getElementById("fbList").innerHTML = data.map(renderCard).join("");
      document.getElementById("countTag").textContent = data.length + " item" + (data.length !== 1 ? "s" : "");

      /* Wire save buttons */
      document.querySelectorAll(".btn-save[data-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id      = btn.dataset.id;
          const newStat = document.getElementById("sel-"  + id).value;
          const newPri  = document.getElementById("pri-"  + id)?.value;
          const note    = document.getElementById("note-" + id).value.trim();
          btn.disabled = true;
          btn.textContent = "…";
          try {
            await updateStatus({ id, status: newStat, priority: newPri || undefined, adminNote: note || null });
            const card = document.getElementById("card-" + id);
            card.className = "fb-card status-" + newStat;
            btn.textContent = "✓ Saved";
            setTimeout(() => { btn.disabled = false; btn.textContent = "Save"; }, 2000);
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Error";
            alert(e.message);
          }
        });
      });
    } catch (e) {
      document.getElementById("fbList").innerHTML =
        `<div class="empty-state" style="color:#dc2626">${e.message}</div>`;
    }
  }

  document.getElementById("btnLoad").addEventListener("click", load);

  onAuthStateChanged(getAuth(), user => {
    if (!user) {
      document.getElementById("fbList").innerHTML =
        '<div class="empty-state">Admin sign-in required</div>';
    } else {
      load();
    }
  });
</script>
<script src="shared-header.js" defer></script>
</body>
</html>
