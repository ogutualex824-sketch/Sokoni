<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="/security.js"></script>
  <script src="/shared-header.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="SOKONI Creator — films, series, documentaries and music videos from independent creators.">
  <title>Creator — Films &amp; Media | SOKONI</title>
  <!--
    Creator Hub viewer (docs/CREATOR_HUB.md). Everything here is a VIEW of
    server truth from creatorDispatch:
      - the catalogue is catalog.list / catalog.get (published films only)
      - access is catalog.get → viewer.access, read from the server ledger; this
        page NEVER grants playback from a redirect, a popup, a URL or storage
      - playback is a 10-minute signed URL from playback.authorize, bound to a
        session; the watermark payload comes from the server, masked
      - royalties are royalty.mine; withdrawal is the existing wallet rail
  -->
  <script src="/sokoni-creator-rules.js" defer></script>
  <script src="/sokoni-reputation.js" defer></script>
  <script src="/sokoni-watermark.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --g:#71ff00; --bg:#050505; --card:#141414; --line:rgba(255,255,255,.09); --tx:#f4f4f4; --mu:#a8a8a8; --r:16px; --safe-b:env(safe-area-inset-bottom,0px); }
    body { background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100dvh; -webkit-font-smoothing:antialiased; }
    a { color:var(--g); }
    .wrap { max-width:1100px; margin:0 auto; padding:88px 16px calc(32px + var(--safe-b)); }
    h1 { font-size:clamp(22px,4vw,32px); font-weight:900; letter-spacing:-.02em; }
    .sub { color:var(--mu); font-size:14px; margin-top:6px; }
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:14px 0; scrollbar-width:none; }
    .tab { flex:none; background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; }
    .tab[aria-pressed="true"] { background:var(--g); color:#000; border-color:var(--g); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; cursor:pointer; text-align:left; color:inherit; font:inherit; padding:0; }
    .card:focus-visible, .btn:focus-visible, .tab:focus-visible { outline:2px solid var(--g); outline-offset:2px; }
    .poster { aspect-ratio:2/3; width:100%; object-fit:cover; background:#222; display:block; }
    .card .meta { padding:10px 12px 12px; }
    .card .t { font-weight:800; font-size:14px; line-height:1.25; }
    .card .p { color:var(--g); font-weight:800; font-size:13px; margin-top:4px; }
    .muted { color:var(--mu); font-size:13px; }
    .state { padding:48px 16px; text-align:center; color:var(--mu); }
    .btn { background:var(--g); color:#000; border:0; border-radius:12px; padding:12px 18px; font-weight:900; font-size:15px; cursor:pointer; }
    .btn[disabled] { opacity:.45; cursor:not-allowed; }
    .btn.ghost { background:transparent; color:var(--tx); border:1px solid var(--line); }
    .film { display:grid; grid-template-columns:minmax(0,300px) 1fr; gap:24px; margin-top:16px; }
    @media (max-width:720px){ .film { grid-template-columns:1fr; } .film .poster { max-width:260px; } }
    .film .poster { border-radius:var(--r); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
    .chip { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--mu); }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:16px; }
    .price { font-size:24px; font-weight:900; color:var(--g); }
    input[type=tel] { width:100%; background:#0b0b0b; border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:12px; font-size:16px; margin:10px 0; }
    .msg { font-size:13px; margin-top:8px; min-height:18px; }
    .msg.bad { color:#ff6b6b; } .msg.ok { color:var(--g); }
    .player { position:relative; background:#000; border-radius:var(--r); overflow:hidden; margin-top:16px; aspect-ratio:16/9; user-select:none; }
    .player video { width:100%; height:100%; display:block; background:#000; }
    .player canvas.wm { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
    .player .fs { position:absolute; right:10px; top:10px; z-index:3; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:6px 10px; font-weight:700; cursor:pointer; }
    .notice { font-size:12px; color:var(--mu); margin-top:8px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--mu); font-weight:700; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .kpi { background:#0b0b0b; border:1px solid var(--line); border-radius:12px; padding:12px; }
    .kpi b { display:block; font-size:18px; margin-top:4px; }
    .scroll { overflow-x:auto; }
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <div class="state" id="boot">Loading…</div>
  </main>

  <script type="module">
  'use strict';
  import { app, auth } from '/firebase.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';
  import { onAuthStateChanged, signInAnonymously, linkWithCredential, EmailAuthProvider, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const fn = getFunctions(app, 'us-central1');
  const cd = (op, data = {}) => httpsCallable(fn, 'creatorDispatch')({ op, ...data }).then((r) => r.data);
  const $app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  let USER = null;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* Unknown money renders "—", never 0. */
  const kes = (cents) => (cents == null || !Number.isFinite(Number(cents))) ? '—' : 'KES ' + (Number(cents) / 100).toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const errText = (e) => String((e && e.message) || 'Something went wrong.').replace(/^[a-z_]+:\s*/, '');
  const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch (_) { return ''; } };
  const deviceId = (() => { try { let d = localStorage.getItem('sokoniCreatorDevice'); if (!d) { d = crypto.randomUUID(); localStorage.setItem('sokoniCreatorDevice', d); } return d; } catch (_) { return 'nostore'; } })();

  function rules() { return window.SokoniCreatorRules; }

  /* ═══ DISCOVER ═══ */
  let cursor = null, sub = params.get('sub') || '';
  async function discover(append) {
    if (!append) {
      const S = rules() ? rules().SUBCATEGORIES : {};
      $app.innerHTML = `
        <h1>🎬 Creator</h1>
        <p class="sub">Films, series, documentaries and music from independent creators. <a href="/creator-studio.html">Publish your work →</a>${USER ? ' · <a href="?view=library">My films</a> · <a href="?view=royalties">My royalties</a>' : ''}</p>
        <div class="tabs" role="toolbar" aria-label="Subcategories">
          <button class="tab" data-sub="" aria-pressed="${!sub}">All</button>
          ${Object.entries(S).map(([k, v]) => `<button class="tab" data-sub="${esc(k)}" aria-pressed="${sub === k}">${esc(v)}</button>`).join('')}
        </div>
        <div class="grid" id="grid"></div>
        <div class="state" id="gstate">Loading films…</div>
        <div style="text-align:center"><button class="btn ghost" id="more" hidden>Load more</button></div>`;
      $app.querySelectorAll('.tab').forEach((b) => b.onclick = () => { sub = b.dataset.sub; cursor = null; history.replaceState(null, '', sub ? '?sub=' + sub : location.pathname); discover(false); });
      document.getElementById('more').onclick = () => discover(true);
    }
    const gs = document.getElementById('gstate');
    try {
      const r = await cd('catalog.list', { subcategory: sub || undefined, cursor: append ? cursor : undefined, limit: 24 });
      cursor = r.nextCursor;
      const grid = document.getElementById('grid');
      grid.insertAdjacentHTML('beforeend', r.films.map((f) => `
        <button class="card" data-film="${esc(f.filmId)}">
          <img class="poster" loading="lazy" alt="" src="${esc(safeUrl(f.posterUrl))}">
          <div class="meta"><div class="t">${esc(f.title)}</div>
          <div class="muted">${esc(f.subcategoryLabel || '')}${f.runtimeMinutes ? ' · ' + f.runtimeMinutes + ' min' : ''}</div>
          <div class="p">${kes(f.priceCents)}${f.accessType === 'rental' ? ' · ' + f.rentalDays + '-day rental' : ''}</div></div>
        </button>`).join(''));
      grid.querySelectorAll('[data-film]').forEach((c) => c.onclick = () => { location.search = '?film=' + encodeURIComponent(c.dataset.film); });
      gs.hidden = grid.children.length > 0;
      gs.textContent = 'No films here yet.';
      document.getElementById('more').hidden = !cursor;
    } catch (e) { gs.hidden = false; gs.textContent = 'Could not load films: ' + errText(e); }
  }

  /* ═══ FILM PAGE ═══ */
  async function filmPage(filmId) {
    $app.innerHTML = '<div class="state">Loading…</div>';
    let d;
    try { d = await cd('catalog.get', { filmId }); }
    catch (e) { $app.innerHTML = `<div class="state">This film is not available. <a href="/creator.html">Browse Creator</a></div>`; return; }
    const f = d.film, v = d.viewer, co = d.checkout;
    document.title = f.title + ' — SOKONI Creator';
    const access = v && v.access;
    const hasAccess = access && access.status === 'ACTIVE';
    const avail = v ? v.availability : null;
    const avText = f.availability && f.availability.mode !== 'worldwide'
      ? (f.availability.mode === 'allow' ? 'Licensed for: ' : 'Not licensed in: ') + f.availability.countries.join(', ')
      : 'Available wherever SOKONI operates';
    $app.innerHTML = `
      <p><a href="/creator.html">← Creator</a></p>
      <div class="film">
        <img class="poster" alt="Poster for ${esc(f.title)}" src="${esc(safeUrl(f.posterUrl))}">
        <div>
          <h1>${esc(f.title)}</h1>
          <div class="chips">
            <span class="chip">${esc(f.subcategoryLabel || '')}</span>
            ${f.genre ? `<span class="chip">${esc(f.genre)}</span>` : ''}${f.language ? `<span class="chip">${esc(f.language)}</span>` : ''}
            ${f.runtimeMinutes ? `<span class="chip">${f.runtimeMinutes} min</span>` : ''}${f.ageRating ? `<span class="chip">Rated ${esc(f.ageRating)}</span>` : ''}
            ${f.releaseDate ? `<span class="chip">${esc(f.releaseDate)}</span>` : ''}
          </div>
          ${d.creator ? `<p class="muted">By <a href="?creator=${encodeURIComponent(d.creator.creatorId)}"><b>${esc(d.creator.displayName)}</b></a>${d.creator.verification === 'VERIFIED' ? ' ✓ Verified' : ''}</p>` : ''}
          <p style="margin-top:10px;white-space:pre-line">${esc(f.description)}</p>
          <p class="notice">${esc(avText)}</p>
          ${f.trailerUrl ? `<div class="panel"><b>Trailer</b><video controls preload="none" playsinline style="width:100%;margin-top:8px;border-radius:12px" src="${esc(safeUrl(f.trailerUrl))}"></video></div>` : ''}
          <div class="panel" id="buyPanel"></div>
        </div>
      </div>
      <div id="watch"></div>`;
    const bp = document.getElementById('buyPanel');
    if (hasAccess && USER && USER.isAnonymous) {
      bp.innerHTML = `<b>You have access ✓</b>
        <p style="margin-top:10px"><button class="btn" id="watchBtn">▶ Watch now</button></p>
        <div class="panel"><b>Create your SOKONI account</b>
          <p class="muted">Keep this film and watch it on any device. Until you do, access lives only in this browser.</p>
          <form id="claimForm"><input type="email" name="email" required autocomplete="email" placeholder="Email" style="width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;margin:8px 0">
          <input type="password" name="pw" required minlength="8" autocomplete="new-password" placeholder="Password (8+ characters)" style="width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;margin:8px 0">
          <button class="btn">Create account</button></form><div class="msg" id="claimMsg" role="status"></div></div>`;
      document.getElementById('watchBtn').onclick = () => watch(f.filmId);
      document.getElementById('claimForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target), m = document.getElementById('claimMsg');
        try {
          /* LINK, never create: the same uid keeps the same entitlement — nothing is copied. */
          const cred = EmailAuthProvider.credential(String(fd.get('email')).trim(), String(fd.get('pw')));
          const r = await linkWithCredential(USER, cred);
          await sendEmailVerification(r.user).catch(() => {});
          m.className = 'msg ok'; m.textContent = 'Account created. Check your email to verify it — your films are in My films on every device.';
        } catch (err) {
          m.className = 'msg bad';
          m.textContent = /email-already-in-use|credential-already-in-use/.test(err.code || '') ? 'That email already has a SOKONI account. Sign in with it — contact support to move this purchase.' : errText(err);
        }
      };
      return;
    }
    if (hasAccess) {
      bp.innerHTML = `<b>You have access</b>${access.expiresAtMs ? `<p class="muted">Rental ends ${new Date(access.expiresAtMs).toLocaleString('en-KE')}</p>` : ''}
        <p style="margin-top:10px"><button class="btn" id="watchBtn">▶ Watch now</button></p>
        <p class="notice">This stream is watermarked to your account.</p>`;
      document.getElementById('watchBtn').onclick = () => watch(f.filmId);
      return;
    }
    const priceLine = `<div class="price">${kes(f.priceCents)}</div><p class="muted">${f.accessType === 'rental' ? `${f.rentalDays}-day rental` : 'Buy — watch any time'} · ${esc(f.currency)}</p>`;
    if (!USER) {
      /* Guest checkout only when the SERVER says it is on. The guest session is
         an anonymous Firebase account: the payment, the entitlement and — after
         "Create your account" — the permanent account all share ONE uid. */
      bp.innerHTML = priceLine + `<p style="margin-top:10px"><a class="btn" href="/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}">Sign in to watch</a>
        ${co.guestCheckout ? ' <button class="btn ghost" id="guestBtn">Buy without an account</button>' : ''}</p>`;
      const gb = document.getElementById('guestBtn');
      if (gb) gb.onclick = async () => { gb.disabled = true; try { await signInAnonymously(auth); } catch (e) { gb.disabled = false; bp.insertAdjacentHTML('beforeend', '<p class="msg bad">Guest checkout is not available right now — please sign in.</p>'); } };
      return;
    }
    if (v.isCreator) { bp.innerHTML = priceLine + '<p class="muted">This is your film. Manage it in <a href="/creator-studio.html">Creator Studio</a>.</p>'; return; }
    /* Free preview: server-granted, separate rendition, limited to f.previewSeconds. */
    if (f.previewAvailable) {
      bp.insertAdjacentHTML('beforebegin', `<div class="panel" id="pvPanel"><button class="btn ghost" id="pvBtn">▶ Watch the free preview (${Number(f.previewSeconds)} s)</button></div>`);
      document.getElementById('pvBtn').onclick = () => previewPlay(f);
    }
    if (avail && !avail.available) {
      bp.innerHTML = priceLine + `<p class="msg bad">${avail.reason === 'country_unknown' ? 'This film is licensed for specific countries. Set your country in your profile to continue.' : 'This film is not licensed in your country.'}</p>`;
      return;
    }
    if (!co.enabled) { bp.innerHTML = priceLine + '<p class="msg">Purchases for this title are not open yet.</p>'; return; }
    /* Back from hosted checkout: a HINT to wait, never a grant — access appears
       only when catalog.get reports the server entitlement. */
    if (params.get('checkout') === 'returned') {
      bp.innerHTML = priceLine + '<p class="msg" id="retMsg">Checking your payment with the provider…</p>';
      const until = Date.now() + 180000;
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, 4000));
        const g = await cd('catalog.get', { filmId: f.filmId }).catch(() => null);
        if (g && g.viewer && g.viewer.access && g.viewer.access.status === 'ACTIVE') { history.replaceState(null, '', '?film=' + encodeURIComponent(f.filmId)); return filmPage(f.filmId); }
      }
      document.getElementById('retMsg').textContent = 'We have not received confirmation yet. If you paid, access appears here automatically — refresh in a minute. Do not pay again.';
      return;
    }
    const methods = (co.verifiedMethods || []).length ? co.verifiedMethods.join(' · ') : '—';
    /* The hosted button names ONLY methods the server says are proven on the live
       IntaSend account (config/intasendCapability) — never a list from this page. */
    const hostedNames = (co.methods || []).filter((x) => x.rail === 'hosted_checkout' && x.method !== 'M-PESA').map((x) => x.label);
    const hostedLabel = hostedNames.length ? 'Pay with ' + hostedNames.join(' · ') : 'Other payment methods';
    bp.innerHTML = priceLine + `
      <p class="muted" style="margin-top:8px">${esc(co.notice)}: <b>${esc(methods)}</b></p>
      <label class="muted" for="phone" style="display:block;margin-top:10px">M-PESA number</label>
      <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="07XX XXX XXX">
      <button class="btn" id="payBtn">Pay ${kes(f.priceCents)} with M-PESA</button>
      ${co.hostedCheckout ? `<button class="btn ghost" id="hostedBtn" style="margin-left:6px">${esc(hostedLabel)}</button>` : ''}
      <div class="msg" id="payMsg" role="status" aria-live="polite"></div>`;
    document.getElementById('payBtn').onclick = () => pay(f);
    const hb = document.getElementById('hostedBtn');
    if (hb) hb.onclick = () => payHosted(f);
  }

  function validPhone(raw) {
    const d = String(raw || '').replace(/[\s-]/g, '').replace(/^\+/, '');
    if (/^254[17]\d{8}$/.test(d)) return d;
    if (/^0[17]\d{8}$/.test(d)) return '254' + d.slice(1);
    return null;
  }

  /* Hosted checkout: the server opens an IntaSend page showing every method the
     SOKONI account has enabled. We only ever redirect to an https intasend.com
     URL, and on return we wait for the SERVER entitlement — the redirect itself
     grants nothing. */
  async function payHosted(f) {
    const m = document.getElementById('payMsg');
    try {
      m.className = 'msg'; m.textContent = 'Opening secure checkout…';
      const intent = (await httpsCallable(fn, 'createPaymentIntent')({ purpose: 'film_access', filmId: f.filmId })).data;
      const r = (await httpsCallable(fn, 'initiateHostedCheckout')({ ref: intent.ref, returnPath: '/creator.html?film=' + encodeURIComponent(f.filmId) + '&checkout=returned' })).data;
      const u = new URL(r.url);
      if (u.protocol !== 'https:' || !/(^|\.)intasend\.com$/.test(u.hostname)) throw new Error('Unexpected checkout address.');
      location.href = u.href;
    } catch (e) { m.className = 'msg bad'; m.textContent = errText(e); }
  }

  async function pay(f) {
    const btn = document.getElementById('payBtn'), m = document.getElementById('payMsg');
    const phone = validPhone(document.getElementById('phone').value);
    if (!phone) { m.className = 'msg bad'; m.textContent = 'Enter a valid Safaricom number.'; return; }
    btn.disabled = true; m.className = 'msg'; m.textContent = 'Creating payment…';
    try {
      /* The server prices the film (film_access); the amount below is the
         server's, never the page's. */
      const intent = (await httpsCallable(fn, 'createPaymentIntent')({ purpose: 'film_access', filmId: f.filmId, phone })).data;
      m.textContent = 'Sending the M-PESA prompt…';
      await httpsCallable(fn, 'initiateSTKPush')({ phone, ref: intent.ref, amount: intent.amount, meta: { type: 'film_access' } });
      m.textContent = '📲 Enter your M-PESA PIN on your phone. Access appears here once the payment is confirmed.';
      /* Wait for SERVER truth (entitlement), not for the prompt or a redirect. */
      const until = Date.now() + 180000;
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, 4000));
        const g = await cd('catalog.get', { filmId: f.filmId }).catch(() => null);
        if (g && g.viewer && g.viewer.access && g.viewer.access.status === 'ACTIVE') { m.className = 'msg ok'; m.textContent = 'Payment confirmed.'; return filmPage(f.filmId); }
      }
      m.textContent = 'We have not received confirmation yet. If you paid, access appears on this page automatically — refresh in a minute.';
      btn.disabled = false;
    } catch (e) { m.className = 'msg bad'; m.textContent = errText(e); btn.disabled = false; }
  }

  /* ═══ PREVIEW PLAYER ═══
     The URL is for the PREVIEW rendition only (never the film). The server keeps
     how much of the preview this viewer has watched, so a reload resumes — it
     does not restart the allowance. The guard below is the player boundary. */
  async function previewPlay(f) {
    const box = document.getElementById('watch');
    box.innerHTML = '<div class="panel">Preparing the preview…</div>';
    let g;
    try { g = await cd('playback.preview', { filmId: f.filmId }); }
    catch (e) { box.innerHTML = `<div class="panel msg bad">${esc(/preview_used/.test(e.message || '') ? 'You have watched this preview. Buy the film to keep watching.' : errText(e))}</div>`; return; }
    if (g.mode === 'ENTITLED') return watch(f.filmId);
    box.innerHTML = `<div class="player"><video id="pvid" playsinline controls disablepictureinpicture controlslist="nodownload noremoteplayback" preload="metadata"></video></div>
      <p class="notice">Free preview — the first ${Number(g.limitSec)} seconds.</p><div id="pvEnd"></div>`;
    const pv = document.getElementById('pvid');
    let lastReport = -1;
    const report = (force) => {
      const t = pv.currentTime || 0;
      if (force || t - lastReport >= 5) { lastReport = t; cd('playback.previewProgress', { filmId: f.filmId, positionSec: t }).catch(() => {}); }
    };
    rules().attachPreviewGuard(pv, g.limitSec, () => {
      report(true);
      document.getElementById('pvEnd').innerHTML = '<div class="panel"><b>The preview has ended.</b> Buy the film to keep watching.</div>';
      const b = document.getElementById('buyPanel'); if (b) b.scrollIntoView({ behavior: 'smooth' });
    });
    pv.addEventListener('timeupdate', () => report(false));
    pv.addEventListener('pause', () => report(true));
    pv.addEventListener('contextmenu', (e) => e.preventDefault());
    pv.addEventListener('loadedmetadata', () => { if (Number(g.resumeAtSec) > 0) pv.currentTime = Number(g.resumeAtSec); }, { once: true });
    pv.src = g.url;
  }

  /* ═══ PLAYER ═══ */
  let session = null, hbTimer = null, drawTimer = null;
  async function watch(filmId) {
    const box = document.getElementById('watch');
    box.innerHTML = '<div class="panel">Authorising playback…</div>';
    let g;
    try { g = await cd('playback.authorize', { filmId, deviceId }); }
    catch (e) { box.innerHTML = `<div class="panel msg bad">${esc(errText(e))}</div>`; return; }
    session = { ...g, filmId };
    box.innerHTML = `<div class="player" id="player">
        <video id="vid" playsinline controls disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" preload="metadata"></video>
        <canvas class="wm" id="wm" aria-hidden="true"></canvas>
        <button class="fs" id="fsBtn" type="button">⛶ Fullscreen</button>
      </div>
      <p class="notice">Watermarked to your session (${esc(g.watermark.sessionCode)}). Sharing a recording identifies the account it came from.${g.flagged ? ' This account is showing unusual playback activity.' : ''}</p>`;
    const vid = document.getElementById('vid');
    vid.src = g.url;
    vid.addEventListener('contextmenu', (e) => e.preventDefault());
    /* Fullscreen the CONTAINER so the watermark goes fullscreen with the video. */
    document.getElementById('fsBtn').onclick = () => { const p = document.getElementById('player'); (document.fullscreenElement ? document.exitFullscreen() : p.requestFullscreen && p.requestFullscreen()).catch(() => {}); };
    /* The signed URL lives 10 minutes; when a range request fails after it
       expires, re-authorise the SAME session and resume where we were. */
    vid.addEventListener('error', async () => {
      if (!session) return;
      const at = vid.currentTime;
      try { const r = await cd('playback.authorize', { filmId, deviceId, sessionId: session.sessionId }); session.url = r.url; vid.src = r.url; vid.currentTime = at; vid.play().catch(() => {}); }
      catch (e) { stop(errText(e)); }
    });
    startWatermark();
    clearInterval(hbTimer);
    hbTimer = setInterval(async () => {
      const v = document.getElementById('vid');
      const beat = { sessionId: session.sessionId };
      if (v && Number.isFinite(v.duration)) { beat.positionSec = Math.floor(v.currentTime); beat.durationSec = Math.floor(v.duration); beat.playing = !v.paused; }
      try { const h = await cd('playback.heartbeat', beat); if (!h.ok) stop(h.revoked ? 'Your access to this film has ended.' : 'Playback session ended.'); }
      catch (_) { /* transient: the next beat or the URL expiry settles it */ }
    }, g.heartbeatMs || 30000);
  }

  function stop(text) {
    const vid = document.getElementById('vid');
    if (vid) { vid.pause(); vid.removeAttribute('src'); vid.load(); }
    clearInterval(hbTimer); clearInterval(drawTimer);
    const box = document.getElementById('watch');
    if (box) box.insertAdjacentHTML('afterbegin', `<div class="panel msg bad">${esc(text)}</div>`);
    session = null;
  }

  function report(event) { if (session) cd('playback.report', { sessionId: session.sessionId, event }).catch(() => {}); }

  /* Visible, moving, session-bound watermark drawn OVER the video, plus a faint
     forensic tile grid. Integrity check: if the overlay is removed or hidden,
     playback pauses, the tamper is reported, and the overlay is restored. It
     deters and identifies; it does not make recording impossible. */
  function startWatermark() {
    const W = window.SokoniWatermark;
    const wm = session.watermark;
    const player = document.getElementById('player');
    const draw = () => {
      let c = document.getElementById('wm');
      const vid = document.getElementById('vid');
      if (!c || !c.isConnected) {
        report('overlay_removed'); if (vid) vid.pause();
        c = document.createElement('canvas'); c.id = 'wm'; c.className = 'wm'; c.setAttribute('aria-hidden', 'true'); player.appendChild(c);
      }
      const cs = getComputedStyle(c);
      if (cs.display === 'none' || cs.visibility === 'hidden' || Number(cs.opacity) < 0.9) {
        report('overlay_hidden'); if (vid) vid.pause(); c.removeAttribute('style');
      }
      const r = player.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
      const x = c.getContext('2d');
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.clearRect(0, 0, r.width, r.height);
      const tick = W.tickAt(wm.issuedAtMs, Date.now());
      x.font = '600 11px system-ui, sans-serif'; x.fillStyle = 'rgba(255,255,255,0.07)';
      for (const cell of W.forensicGrid(wm.sessionCode, tick)) x.fillText(wm.sessionCode, cell.x * r.width, cell.y * r.height + 12);
      const p = W.positionAt(wm.sessionCode, tick);
      x.save(); x.translate(p.x * r.width, p.y * r.height); x.rotate(p.rotateDeg * Math.PI / 180);
      x.font = `700 ${Math.max(12, Math.round(r.width / 48))}px system-ui, sans-serif`;
      x.shadowColor = 'rgba(0,0,0,0.7)'; x.shadowBlur = 3; x.fillStyle = 'rgba(255,255,255,0.42)';
      x.fillText(wm.label, 0, 0);
      x.fillText(`${wm.sessionCode} · ${wm.entitlementTag || ''} · ${new Date().toISOString().slice(0, 16).replace('T', ' ')}Z`, 0, Math.max(14, Math.round(r.width / 44)));
      x.restore();
    };
    clearInterval(drawTimer);
    draw(); drawTimer = setInterval(draw, 1000);
    new MutationObserver(() => draw()).observe(player, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'hidden'] });
  }
  addEventListener('pagehide', () => { if (session) cd('playback.end', { sessionId: session.sessionId }).catch(() => {}); });

  /* ═══ PUBLIC CREATOR PROFILE ═══ */
  async function creatorProfile(id) {
    $app.innerHTML = '<div class="state">Loading…</div>';
    let d;
    try { d = await cd('catalog.creator', { creatorId: id }); } catch (e) { $app.innerHTML = '<div class="state">Creator not found. <a href="/creator.html">Browse Creator</a></div>'; return; }
    const c = d.creator;
    $app.innerHTML = `<p><a href="/creator.html">← Creator</a></p>
      <div style="display:flex;gap:16px;align-items:center;margin-top:10px">
        ${c.avatarUrl ? `<img src="${esc(safeUrl(c.avatarUrl))}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover">` : ''}
        <div><h1>${esc(c.displayName)}${c.verification === 'VERIFIED' ? ' <span style="color:var(--g);font-size:.6em">✓ Verified</span>' : ''}</h1>
        <p class="muted">${esc(c.country || '')}${c.supportEmail ? ' · Support: ' + esc(c.supportEmail) : ''}</p></div></div>
      <div id="creatorRep" style="margin-top:10px"></div>
      <p style="margin-top:12px;white-space:pre-line">${esc(c.bio)}</p>
      <h2 style="margin-top:16px">Films</h2>
      <div class="grid">${d.films.map((f) => `<button class="card" data-film="${esc(f.filmId)}"><img class="poster" loading="lazy" alt="" src="${esc(safeUrl(f.posterUrl))}"><div class="meta"><div class="t">${esc(f.title)}</div><div class="p">${kes(f.priceCents)}</div></div></button>`).join('') || '<p class="muted">No published films yet.</p>'}</div>`;
    $app.querySelectorAll('[data-film]').forEach((b) => b.onclick = () => { location.search = '?film=' + encodeURIComponent(b.dataset.film); });
    /* followers · Follow · Share for the creator (functions/reputation.js). Film ratings stay with the film. */
    if (window.SokoniRep) {
      window.SokoniRep.configure({ callable: (name, data) => httpsCallable(fn, name)(data).then((r) => r.data), user: () => auth.currentUser });
      window.SokoniRep.identity(document.getElementById('creatorRep'), { type: 'creator', id: c.creatorId || id, name: c.displayName });
    }
  }

  /* ═══ MY FILMS (viewer dashboard) — own records only ═══ */
  const mmss = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + 'h ' : '') + m + 'm'; };
  async function library() {
    if (!USER) { location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
    $app.innerHTML = '<div class="state">Loading your films…</div>';
    let L;
    try { L = await cd('viewer.library'); } catch (e) { $app.innerHTML = `<div class="state">Could not load your films: ${esc(errText(e))}</div>`; return; }
    const card = (m, extra) => `<button class="card" data-film="${esc(m.filmId)}"><img class="poster" loading="lazy" alt="" src="${esc(safeUrl(m.posterUrl))}"><div class="meta"><div class="t">${esc(m.title || 'Film')}</div><div class="muted">${extra}</div></div></button>`;
    $app.innerHTML = `
      <p><a href="/creator.html">← Creator</a></p>
      <h1>My films</h1>
      ${L.continueWatching.length ? `<h2 style="margin-top:14px">Continue watching</h2><div class="grid">${L.continueWatching.map((c) => card(c, 'At ' + mmss(c.positionSec) + ' of ' + mmss(c.durationSec))).join('')}</div>` : ''}
      <h2 style="margin-top:14px">Library</h2>
      <div class="grid">${L.myFilms.length ? L.myFilms.map((m) => card(m, m.type === 'rental' && m.expiresAtMs ? 'Rental ends ' + new Date(m.expiresAtMs).toLocaleDateString('en-KE') : 'Owned')).join('') : '<p class="muted">No films yet. <a href="/creator.html">Browse Creator</a></p>'}</div>
      <div class="panel"><b>Purchase history</b><div class="scroll"><table><thead><tr><th>Film</th><th>Type</th><th>Paid</th><th>Date</th><th>Status</th></tr></thead><tbody>
        ${L.purchases.map((p) => `<tr><td>${esc(p.title || p.filmId)}</td><td>${esc(p.type)}</td><td>${kes(p.amountCents)}</td><td>${p.acquiredAtMs ? new Date(p.acquiredAtMs).toLocaleDateString('en-KE') : '—'}</td><td>${esc(p.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No purchases yet.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel"><b>Devices watching now</b><p class="muted">Up to 2 devices can play at the same time. Sign a device out to free a slot.</p><div class="scroll"><table><tbody>
        ${L.sessions.map((x) => `<tr><td>Device ${esc(x.device)}</td><td>${esc(x.title || '')}</td><td>${x.live ? 'playing' : 'idle'}</td><td><button class="btn ghost" data-end="${esc(x.sessionId)}">Sign out device</button></td></tr>`).join('') || '<tr><td class="muted">No active devices.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel"><b>Account</b><p class="muted"><a href="${esc(L.account.page)}">Account settings</a> · <a href="${esc(L.account.recovery)}">Reset password</a></p></div>`;
    $app.querySelectorAll('[data-film]').forEach((c) => c.onclick = () => { location.search = '?film=' + encodeURIComponent(c.dataset.film); });
    $app.querySelectorAll('[data-end]').forEach((b) => b.onclick = async () => { b.disabled = true; await cd('viewer.endSession', { sessionId: b.dataset.end }).catch(() => {}); library(); });
  }

  /* ═══ ROYALTIES (participant dashboard) ═══ */
  async function royalties() {
    if (!USER) { location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
    $app.innerHTML = '<div class="state">Loading royalties…</div>';
    let r;
    try { r = await cd('royalty.mine'); } catch (e) { $app.innerHTML = `<div class="state">Could not load royalties: ${esc(errText(e))}</div>`; return; }
    const s = r.summary;
    $app.innerHTML = `
      <p><a href="/creator.html">← Creator</a></p>
      <h1>My royalties</h1>
      <p class="sub">Earnings accrue with every sale, are settled each quarter, and are then released to your SOKONI wallet, where you withdraw them. Next settlement closes ${new Date(r.nextSettlement.periodEndsAtMs).toLocaleDateString('en-KE')} (${esc(r.nextSettlement.periodId)}).</p>
      <div class="kpis" style="margin-top:14px">
        <div class="kpi"><span class="muted">Accrued (this quarter)</span><b>${kes(s.accruedCents)}</b></div>
        <div class="kpi"><span class="muted">Pending settlement</span><b>${kes(s.pendingSettlementCents)}</b></div>
        <div class="kpi"><span class="muted">Released to your wallet (royalties)</span><b>${kes(s.releasedCents)}</b></div>
        <div class="kpi"><span class="muted">Available for withdrawal*</span><b>${r.wallet.availableForWithdrawalKes == null ? '—' : 'KES ' + Number(r.wallet.availableForWithdrawalKes).toLocaleString('en-KE')}</b></div>
        <div class="kpi"><span class="muted">Withdrawn*</span><b>KES ${Number(r.wallet.withdrawnKes).toLocaleString('en-KE')}</b></div>
        <div class="kpi"><span class="muted">Pending withdrawal*</span><b>KES ${Number(r.wallet.pendingWithdrawalKes || 0).toLocaleString('en-KE')}</b></div>
        ${r.wallet.beingConfirmedKes ? `<div class="kpi"><span class="muted">Being confirmed with M-PESA*</span><b>KES ${Number(r.wallet.beingConfirmedKes).toLocaleString('en-KE')}</b></div>` : ''}
        <div class="kpi"><span class="muted">Total earned (all quarters)</span><b>${r.figures && r.figures.totalEarnedCents != null ? kes(r.figures.totalEarnedCents) : '—'}</b></div>
        <div class="kpi"><span class="muted">Reversed (refunds)</span><b>${kes(s.reversedCents)}</b></div>
      </div>
      <p class="notice">* Wallet figures: released royalties join your one SOKONI wallet, so these include any other SOKONI earnings. Only settled quarters are ever withdrawable — accrued and pending amounts are not.${r.wallet.reservedForPayoutKes ? ' KES ' + Number(r.wallet.reservedForPayoutKes).toLocaleString('en-KE') + ' is reserved for a payout in progress.' : ''}</p>
      ${r.figures ? `<details class="panel"><summary>What these figures mean</summary><ul>${Object.entries(r.figures.definitions).map(([k, v]) => `<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul></details>` : ''}
      <p style="margin-top:12px"><a class="btn ghost" href="${esc(r.withdrawal.page)}">Withdraw from wallet · withdrawal history</a></p>
      <div class="panel"><b>My films</b><div class="scroll"><table><thead><tr><th>Film</th><th>Role</th><th>Share</th><th>Agreement</th><th>Status</th></tr></thead><tbody>
        ${r.participations.length ? r.participations.map((p) => `<tr><td>${esc(p.title)}</td><td>${esc(p.participantType)}</td><td>${(p.bps / 100).toFixed(2).replace(/\.00$/, '')}%</td><td>v${esc(p.version)}</td><td>${esc(p.status)}</td></tr>`).join('') : '<tr><td colspan="5" class="muted">You are not a rights holder on any film yet.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel"><b>Withdrawal history</b><div class="scroll"><table><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead><tbody>
        ${r.wallet.history.map((p) => `<tr><td>${p.createdAtMs ? new Date(p.createdAtMs).toLocaleDateString('en-KE') : '—'}</td><td>KES ${esc(p.amountKes)}</td><td>${esc(p.method || '')}</td><td>${esc(p.status)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No withdrawals yet.</td></tr>'}
      </tbody></table></div></div>
      <div class="panel"><b>Quarterly statements</b><div class="scroll"><table><thead><tr><th>Quarter</th><th>Earned</th><th>Reversed</th><th>Carried in</th><th>Released</th><th>Carried out</th><th></th></tr></thead><tbody>
        ${r.statements.length ? r.statements.map((st) => `<tr><td>${esc(st.periodId)}</td><td>${kes(st.earnedCents)}</td><td>${kes(st.reversedCents)}</td><td>${kes(st.carryInCents)}</td><td>KES ${esc(st.releaseKes)}</td><td>${kes(st.carryOutCents)}</td><td>${st.released ? 'Released' : st.held ? 'On hold' : 'Pending'}</td></tr>`).join('') : '<tr><td colspan="7" class="muted">No quarter has been settled yet.</td></tr>'}
      </tbody></table></div>
      <p class="notice">Amounts under KES 1 and any refund adjustments carry into the next quarter.</p></div>`;
  }

  onAuthStateChanged(auth, (u) => {
    USER = u;
    const film = params.get('film');
    if (film && /^[A-Za-z0-9_-]{1,128}$/.test(film)) filmPage(film);
    else if (params.get('view') === 'royalties') royalties();
    else if (params.get('view') === 'library') library();
    else if (params.get('creator') && /^[A-Za-z0-9_-]{1,128}$/.test(params.get('creator'))) creatorProfile(params.get('creator'));
    else discover(false);
  });
  </script>
  <script src="/sw-register.js" defer></script>
</body>
</html>
