<!DOCTYPE html>
<html lang="en" data-require-auth="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Property Account — SOKONI Property Hub</title>
<link rel="icon" type="image/png" href="assets/logosokoni.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<script src="security.js"></script>
<script src="auth-guard.js"></script>
<script src="shared-header.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:white;min-height:100vh;padding-bottom:80px;}
.fn{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(8,8,8,0.97);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);}
.pd-body{max-width:800px;margin:0 auto;padding:16px;}
/* STATS */
.pd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.pd-stat{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;text-align:center;}
.pd-stat-num{font-size:22px;font-weight:900;color:#10b981;margin-bottom:2px;}
.pd-stat-lbl{font-size:10px;color:rgba(255,255,255,0.35);}
/* TABS */
.pd-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;}
.pd-tabs::-webkit-scrollbar{display:none;}
.pd-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);white-space:nowrap;font-family:inherit;transition:all .2s;flex-shrink:0;}
.pd-tab.active{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#10b981;}
/* CARD */
.pd-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
.pd-card-icon{width:46px;height:46px;border-radius:12px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.pd-card-title{font-size:13px;font-weight:800;color:white;margin-bottom:3px;}
.pd-card-sub{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.5;}
.pd-status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:900;margin-top:6px;}
.pd-card-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.pd-action-btn{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-family:inherit;}
.pd-action-btn.green{border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.08);color:#10b981;}
.pd-empty{text-align:center;padding:48px;color:rgba(255,255,255,0.3);}
</style>
</head>
<body>
<script src="splash.js"></script>
<script src="sokoni-property.js"></script>

<nav class="fn">
  <a href="property-hub.html" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:16px;flex-shrink:0;">←</a>
  <span style="font-size:14px;font-weight:800;flex:1;">My Property Account</span>
  <a href="property-agent-dashboard.html" style="padding:7px 14px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:9px;color:#10b981;font-size:12px;font-weight:800;text-decoration:none;">📤 List Property</a>
</nav>

<div class="pd-body">
  <!-- STATS -->
  <div class="pd-stats">
    <div class="pd-stat"><div class="pd-stat-num" id="stSaved">0</div><div class="pd-stat-lbl">Saved</div></div>
    <div class="pd-stat"><div class="pd-stat-num" id="stViewings">0</div><div class="pd-stat-lbl">Viewings</div></div>
    <div class="pd-stat"><div class="pd-stat-num" id="stInquiries">0</div><div class="pd-stat-lbl">Inquiries</div></div>
    <div class="pd-stat"><div class="pd-stat-num" id="stNotifs">0</div><div class="pd-stat-lbl">Alerts</div></div>
  </div>

  <!-- TABS -->
  <div class="pd-tabs">
    <button class="pd-tab active" onclick="switchTab('saved',this)">❤️ Saved</button>
    <button class="pd-tab" onclick="switchTab('viewings',this)">📅 Viewings</button>
    <button class="pd-tab" onclick="switchTab('inquiries',this)">💬 Inquiries</button>
    <button class="pd-tab" onclick="switchTab('notifications',this)">🔔 Alerts</button>
  </div>

  <div id="pdContent"></div>
</div>

<nav style="position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0;z-index:50;backdrop-filter:blur(16px);">
  <a href="index.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-home" style="font-size:18px;"></i><span>Home</span></a>
  <a href="property-hub.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-building" style="font-size:18px;"></i><span>Property</span></a>
  <a href="property-agent-dashboard.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-upload" style="font-size:18px;"></i><span>List</span></a>
  <a href="property-dashboard.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#10b981;text-decoration:none;font-size:10px;font-weight:600;min-width:52px;"><i class="fas fa-user" style="font-size:18px;"></i><span>My Account</span></a>
</nav>

<script>
const P = window.SokoniProperty;

function init() {
  const stats = P.getUserStats();
  document.getElementById('stSaved').textContent = stats.saved;
  document.getElementById('stViewings').textContent = stats.viewings;
  document.getElementById('stInquiries').textContent = stats.inquiries;
  document.getElementById('stNotifs').textContent = P.getUnreadCount();
  renderTab('saved');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.pd-tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderTab(tab);
}
window.switchTab = switchTab;

function renderTab(tab) {
  const el = document.getElementById('pdContent');
  if (tab==='saved') {
    const props = P.getSavedProperties();
    if (!props.length) { el.innerHTML=empty('❤️','No saved properties yet','Browse properties and tap the heart icon to save them here.'); return; }
    el.innerHTML = props.map(p=>propCard(p)).join('');
  }
  else if (tab==='viewings') {
    const viewings = P.getViewings();
    if (!viewings.length) { el.innerHTML=empty('📅','No viewing requests yet','Request a property viewing from any listing page.'); return; }
    el.innerHTML = viewings.map(v=>{
      const vs = P.VIEWING_STATUS[v.status]||{label:v.status,color:'white'};
      return `<div class="pd-card">
        <div class="pd-card-icon">📅</div>
        <div style="flex:1;">
          <div class="pd-card-title">${v.propertyTitle||'Property Viewing'}</div>
          <div class="pd-card-sub">Date: ${v.date||'—'} · Time: ${v.time||'—'}</div>
          <div class="pd-card-sub">Agent: ${v.agentName||'—'}</div>
          <div class="pd-status-pill" style="background:${vs.color}15;border:1px solid ${vs.color}40;color:${vs.color};">${vs.label}</div>
          <div class="pd-card-actions">
            <button class="pd-action-btn green" onclick="window.location.href='property-hub.html'">🏠 Browse More</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  else if (tab==='inquiries') {
    const inqs = P.getInquiries();
    if (!inqs.length) { el.innerHTML=empty('💬','No inquiries sent yet','Send an inquiry from any property listing page.'); return; }
    el.innerHTML = inqs.map(i=>{
      const is = P.INQUIRY_STATUS[i.status]||{label:i.status,color:'white'};
      return `<div class="pd-card">
        <div class="pd-card-icon">💬</div>
        <div style="flex:1;">
          <div class="pd-card-title">${i.propertyTitle||'Property Inquiry'}</div>
          <div class="pd-card-sub" style="margin-top:4px;">"${(i.message||'').slice(0,80)}${(i.message||'').length>80?'...':''}"</div>
          <div class="pd-status-pill" style="background:${is.color}15;border:1px solid ${is.color}40;color:${is.color};">${is.label}</div>
          <div class="pd-card-sub" style="margin-top:6px;">${P.timeSince(i.createdAt||Date.now())}</div>
        </div>
      </div>`;
    }).join('');
  }
  else if (tab==='notifications') {
    const notifs = P.getNotifications();
    if (!notifs.length) { el.innerHTML=empty('🔔','No notifications yet','Alerts for inquiries, viewings and updates will appear here.'); return; }
    el.innerHTML = notifs.map(n=>`
      <div class="pd-card" onclick="P.markNotifRead('${n.id}');renderTab('notifications');" style="cursor:pointer;${n.read?'opacity:0.5':''}">
        <div class="pd-card-icon">${n.type==='viewing'?'📅':n.type==='inquiry'?'💬':n.type==='finance'?'💰':'🔔'}</div>
        <div style="flex:1;">
          <div class="pd-card-title">${n.title}</div>
          <div class="pd-card-sub">${n.body}</div>
          <div class="pd-card-sub" style="margin-top:4px;">${P.timeSince(n.ts)}</div>
        </div>
        ${!n.read?'<div style="width:8px;height:8px;border-radius:50%;background:#10b981;margin-top:4px;flex-shrink:0;"></div>':''}
      </div>`).join('');
    document.getElementById('stNotifs').textContent = P.getUnreadCount();
  }
}

function propCard(p) {
  const st = P.PROPERTY_STATUS[p.status]||{label:p.status,color:'white',icon:'🏠'};
  const saved = P.isSaved(p.id);
  return `<div class="pd-card">
    <div class="pd-card-icon" style="font-size:28px;">${p.icon||'🏠'}</div>
    <div style="flex:1;">
      <div class="pd-card-title">${p.title}</div>
      <div class="pd-card-sub">📍 ${p.location}</div>
      <div style="font-size:15px;font-weight:900;color:#10b981;margin-top:4px;">${P.fmtPrice(p.price,p.priceUnit)}</div>
      <div class="pd-status-pill" style="background:${st.color}15;border:1px solid ${st.color}40;color:${st.color};">${st.icon} ${st.label}</div>
      <div class="pd-card-actions">
        <button class="pd-action-btn green" onclick="window.location.href='property-listing.html?id=${p.id}'">View</button>
        <button class="pd-action-btn" onclick="P.saveProperty('${p.id}');renderTab('saved');">💔 Unsave</button>
      </div>
    </div>
  </div>`;
}

function empty(icon, title, sub) {
  return `<div class="pd-empty"><div style="font-size:48px;margin-bottom:14px;">${icon}</div><p style="font-size:15px;font-weight:700;color:rgba(255,255,255,0.4);">${title}</p><p style="font-size:12px;margin-top:8px;line-height:1.5;">${sub}</p><a href="property-hub.html" style="display:inline-block;margin-top:16px;padding:10px 22px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:10px;color:#10b981;font-size:12px;font-weight:800;text-decoration:none;">🏠 Browse Properties</a></div>`;
}

init();
</script>
<script src="analytics.js" defer></script>
<script src="sw-register.js" defer></script>
  <script defer src="kass-widget.js"></script>
  <!-- Enterprise v2.0: dashboard stack -->
  <script defer src="sokoni-event-bus.js"></script>
  <script defer src="sokoni-observability.js"></script>
  <script defer src="sokoni-gateway.js"></script>
  <script defer src="sokoni-service-mesh.js"></script>
</body>
</html>
