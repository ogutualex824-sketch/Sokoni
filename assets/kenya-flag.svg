<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">

  <!-- Official Kenya flag proportions: black=158, white=22, red=240, white=22, green=158 -->

  <!-- BLACK band (top) -->
  <rect x="0" y="0"   width="900" height="158" fill="#000000"/>
  <!-- White separator -->
  <rect x="0" y="158" width="900" height="22"  fill="#FFFFFF"/>
  <!-- RED band (center, widest) -->
  <rect x="0" y="180" width="900" height="240" fill="#BB0000"/>
  <!-- White separator -->
  <rect x="0" y="420" width="900" height="22"  fill="#FFFFFF"/>
  <!-- GREEN band (bottom) -->
  <rect x="0" y="442" width="900" height="158" fill="#006600"/>

  <!-- SPEARS — drawn behind the shield -->
  <!-- Left spear shaft: upper-left → lower-right -->
  <line x1="408" y1="0" x2="492" y2="600" stroke="#8B5E3C" stroke-width="18"/>
  <!-- Right spear shaft: upper-right → lower-left -->
  <line x1="492" y1="0" x2="408" y2="600" stroke="#8B5E3C" stroke-width="18"/>

  <!-- Spear metal blades (top) -->
  <!-- Left spear top blade -->
  <polygon points="408,0  396,0  416,46  426,36" fill="#CCCCCC"/>
  <!-- Right spear top blade -->
  <polygon points="492,0  504,0  484,46  474,36" fill="#CCCCCC"/>
  <!-- Spear butt caps (bottom) -->
  <polygon points="408,600  396,600  416,554  426,564" fill="#CCCCCC"/>
  <polygon points="492,600  504,600  484,554  474,564" fill="#CCCCCC"/>

  <!-- MAASAI SHIELD — clipPath for clean interior -->
  <defs>
    <clipPath id="sc">
      <!-- Pointed oval: top=(450,72) bottom=(450,528) widest=(320/580,300) -->
      <path d="M450,72
               C530,76,582,180,582,300
               C582,420,530,524,450,528
               C370,524,318,420,318,300
               C318,180,370,76,450,72 Z"/>
    </clipPath>
  </defs>

  <!-- Shield base: red body -->
  <path d="M450,72
           C530,76,582,180,582,300
           C582,420,530,524,450,528
           C370,524,318,420,318,300
           C318,180,370,76,450,72 Z"
        fill="#BB0000"/>

  <!-- Shield interior stripes — all clipped to shield shape -->
  <g clip-path="url(#sc)">

    <!-- Left black side strip -->
    <rect x="318" y="72" width="38" height="456" fill="#000000"/>
    <!-- Right black side strip -->
    <rect x="544" y="72" width="38" height="456" fill="#000000"/>

    <!-- Upper black horizontal band -->
    <rect x="318" y="210" width="264" height="44" fill="#000000"/>
    <!-- White center band -->
    <rect x="318" y="254" width="264" height="92" fill="#FFFFFF"/>
    <!-- Black center divider inside white band -->
    <rect x="318" y="296" width="264" height="10" fill="#000000"/>
    <!-- Lower black horizontal band -->
    <rect x="318" y="346" width="264" height="44" fill="#000000"/>

  </g>

  <!-- Shield outline -->
  <path d="M450,72
           C530,76,582,180,582,300
           C582,420,530,524,450,528
           C370,524,318,420,318,300
           C318,180,370,76,450,72 Z"
        fill="none" stroke="#000000" stroke-width="6"/>

</svg>
