<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img">
  <title>SOKONI</title>
  <defs>
    <linearGradient id="sk-bag-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71ff00"/>
      <stop offset="100%" stop-color="#237000"/>
    </linearGradient>
    <clipPath id="sk-bag-clip">
      <rect x="10" y="29" width="60" height="43" rx="7" fill="white"/>
    </clipPath>
  </defs>

  <!-- Bag body -->
  <rect x="10" y="29" width="60" height="43" rx="7" fill="url(#sk-bag-grad)"/>

  <!-- Grid lines (clipped inside bag) -->
  <g clip-path="url(#sk-bag-clip)" stroke="white" stroke-opacity=".2" stroke-width="1.2">
    <line x1="30" y1="29" x2="30" y2="72"/>
    <line x1="50" y1="29" x2="50" y2="72"/>
    <line x1="10" y1="43" x2="70" y2="43"/>
    <line x1="10" y1="57" x2="70" y2="57"/>
  </g>

  <!-- Shine highlight at top of bag -->
  <rect x="10" y="29" width="60" height="15" fill="white" fill-opacity=".1" clip-path="url(#sk-bag-clip)"/>

  <!-- Handle arch -->
  <path d="M22,30 C22,10 58,10 58,30" stroke="#184d00" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Handle joint dots -->
  <circle cx="22" cy="30" r="3.5" fill="#fbbf24"/>
  <circle cx="58" cy="30" r="3.5" fill="#fbbf24"/>

  <!-- Orange swoosh accent -->
  <path d="M14,67 Q40,78 66,67" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
</svg>
