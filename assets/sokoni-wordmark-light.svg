<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 56" fill="none" role="img" aria-label="SOKONI">
  <title>SOKONI</title>
  <defs>
    <linearGradient id="sk-wml-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71ff00"/>
      <stop offset="100%" stop-color="#237000"/>
    </linearGradient>
  </defs>

  <!-- Bag icon (light-background variant — same as dark, bag is already high-contrast) -->
