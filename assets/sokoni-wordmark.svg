<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 56" fill="none" role="img" aria-label="SOKONI">
  <title>SOKONI</title>
  <defs>
    <linearGradient id="sk-wm-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71ff00"/>
      <stop offset="100%" stop-color="#237000"/>
    </linearGradient>
  </defs>

  <!--
    Shopping bag icon — adapted from sokoni-icon.svg.
    translate(0,8) scale(0.5) maps the original 80×80 viewBox into a
    ~36×40 pixel zone at the left of this 56px-tall SVG.
    Grid lines omitted at this scale — too small to read, add visual noise.
  -->
  <g transform="translate(0,8) scale(0.5)">
    <!-- Bag body -->
    <rect x="10" y="29" width="60" height="43" rx="7" fill="url(#sk-wm-g)"/>
    <!-- Shine highlight -->
    <rect x="10" y="29" width="60" height="15" fill="white" fill-opacity=".12"/>
    <!-- Handle arch -->
    <path d="M22,30 C22,10 58,10 58,30" stroke="#184d00" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Handle joint dots -->
    <circle cx="22" cy="30" r="3.5" fill="#fbbf24"/>
    <circle cx="58" cy="30" r="3.5" fill="#fbbf24"/>
    <!-- Orange swoosh accent -->
    <path d="M14,67 Q40,78 66,67" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
    SOKONI wordmark — pure SVG text fill="#ffffff".
    Unlike any PNG, SVG text is always 100% opaque: no alpha-channel fading,
    no colour-inversion artefacts, perfectly crisp at every display density.
  -->
  <text
    x="46" y="39"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="24" font-weight="900" fill="#ffffff" letter-spacing="4">SOKONI</text>
</svg>
