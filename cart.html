  <style>
    /* ── CART PAGE PREMIUM STYLES ── */
    .cart-hero {
      background: linear-gradient(135deg, rgba(113,255,0,0.08) 0%, rgba(79,200,0,0.04) 50%, transparent 100%);
      border-bottom: 1px solid rgba(113,255,0,0.1);
      padding: 28px 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .cart-hero-left { display: flex; align-items: center; gap: 14px; }
    .cart-hero-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: rgba(113,255,0,0.12); border: 1px solid rgba(113,255,0,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .cart-hero-title { font-size: 22px; font-weight: 900; color: #fff; margin: 0 0 3px; }
    .cart-hero-sub { font-size: 12px; color: rgba(255,255,255,0.45); margin: 0; }
    .cart-hero-clear {
      padding: 8px 16px; background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.25);
      color: #ff6b6b; border-radius: 10px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all .2s; flex-shrink: 0;
    }
    .cart-hero-clear:hover { background: rgba(255,60,60,0.2); border-color: rgba(255,60,60,0.4); }

    /* Layout */
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 16px 100px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media(max-width: 820px) {
      .cart-layout { grid-template-columns: 1fr; }
    }

    /* Cart items */
    .cart-items-col { display: flex; flex-direction: column; gap: 10px; }

    .cart-item-card {
      background: rgba(16,16,16,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      transition: border-color .2s, transform .15s;
      animation: cartItemIn 0.3s ease;
    }
    @keyframes cartItemIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .cart-item-card:hover { border-color: rgba(113,255,0,0.2); transform: translateY(-1px); }

    .cart-item-img {
      width: 80px; height: 80px; border-radius: 12px;
      object-fit: cover; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.07);
      background: #111;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.92);
      margin: 0 0 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item-cat {
      font-size: 10px; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 6px;
    }
    .cart-item-price {
      font-size: 15px; font-weight: 900; color: #71ff00; margin: 0;
    }
    .cart-item-actions {
      display: flex; flex-direction: column; gap: 7px; align-items: flex-end; flex-shrink: 0;
    }
    .cart-save-btn {
      width: 44px; height: 44px; min-width: 44px; border-radius: 12px;
      background: rgba(236,72,153,0.1); border: 1px solid rgba(236,72,153,0.2);
      color: #ec4899; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .cart-save-btn:hover { background: rgba(236,72,153,0.2); border-color: rgba(236,72,153,0.4); }
    .cart-del-btn {
      width: 44px; height: 44px; min-width: 44px; border-radius: 12px;
      background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.18);
      color: rgba(255,100,100,0.7); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .cart-del-btn:hover { background: rgba(255,60,60,0.18); border-color: rgba(255,60,60,0.35); color: #ff6b6b; }

    /* Empty state */
    .cart-empty {
      grid-column: 1 / -1;
      text-align: center; padding: 80px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .cart-empty-icon { font-size: 72px; }
    .cart-empty h2 { color: white; font-size: 22px; font-weight: 900; margin: 0; }
    .cart-empty p { color: rgba(255,255,255,0.4); font-size: 14px; margin: 0; }
    .cart-empty-shop {
      margin-top: 8px; padding: 14px 32px;
      background: linear-gradient(135deg, #71ff00, #4fc800);
      color: #000; font-weight: 900; font-size: 14px; border-radius: 14px;
      text-decoration: none; display: inline-block;
    }

    /* Summary box */
    .cart-summary-col { position: relative; }
    .cart-summary-box {
      background: rgba(16,16,16,0.96);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 22px 20px;
      position: sticky; top: 80px;
    }
    .summary-title {
      font-size: 16px; font-weight: 900; color: white; margin: 0 0 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px; color: rgba(255,255,255,0.6);
    }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-row-total {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0 0; font-size: 16px; font-weight: 900; color: white;
    }
    .summary-total-val { color: #71ff00; font-size: 20px; }
    .summary-free { color: #71ff00; font-weight: 800; font-size: 12px; }

    .checkout-btn {
      display: block; width: 100%; margin-top: 18px;
      padding: 15px; text-align: center; text-decoration: none;
      background: linear-gradient(135deg, #71ff00, #4fc800);
      color: #000; font-weight: 900; font-size: 15px;
      border-radius: 14px; letter-spacing: 0.3px;
      transition: opacity .2s, transform .15s;
    }
    .checkout-btn:hover { opacity: .92; transform: translateY(-1px); }
    .continue-btn {
      display: block; width: 100%; margin-top: 10px;
      padding: 12px; text-align: center; text-decoration: none;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6); font-weight: 700; font-size: 13px;
      border-radius: 12px; transition: all .2s;
    }
    .continue-btn:hover { background: rgba(255,255,255,0.09); color: white; }

    /* Trust row */
    .trust-row {
      display: flex; justify-content: space-around;
      margin-top: 18px; padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .trust-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      font-size: 10px; color: rgba(255,255,255,0.35); text-align: center;
    }
    .trust-item i { font-size: 16px; color: rgba(113,255,0,0.6); }

    /* Promo code */
    .promo-row {
      display: flex; gap: 8px; margin-top: 16px;
    }
    .promo-input {
      flex: 1; padding: 10px 14px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      color: white; font-size: 12px; font-family: inherit; outline: none;
    }
    .promo-input::placeholder { color: rgba(255,255,255,0.3); }
    .promo-input:focus { border-color: rgba(113,255,0,0.3); }
    .promo-apply {
      padding: 10px 14px; background: rgba(113,255,0,0.1); border: 1px solid rgba(113,255,0,0.25);
      color: #71ff00; font-size: 12px; font-weight: 800; border-radius: 10px;
      cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .2s;
    }
    .promo-apply:hover { background: rgba(113,255,0,0.2); }
  </style>

<script src="cart.js"></script>
<script>
/* Override renderCart to use new premium card markup */
(function(){
  var _origRender = window.renderCart || null;

  function premiumRenderCart(){
    var cartData = [];
    try { cartData = JSON.parse(localStorage.getItem("cart")) || []; } catch(e){}

    var container = document.getElementById("cartContainer");
    var heroCount = document.getElementById("cartHeroCount");
    if(heroCount) heroCount.textContent = cartData.length + " item" + (cartData.length !== 1 ? "s" : "") + " in cart";

    if(!container) return;

    if(cartData.length === 0){
      container.parentElement.innerHTML = `
        <div class="cart-empty" style="grid-column:1/-1">
          <div class="cart-empty-icon">🛒</div>
          <h2>Your cart is empty</h2>
          <p>Add some products to get started</p>
          <a href="category.html?cat=all" class="cart-empty-shop" style="display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#71ff00,#4fc800);color:#000;font-weight:900;font-size:15px;border-radius:14px;text-decoration:none;margin-top:8px;">Start Shopping</a>
        </div>`;
      var s = document.getElementById("summarySubtotal"); if(s) s.textContent="KES 0";
      var t = document.getElementById("summaryTotal");    if(t) t.textContent="KES 0";
      return;
    }

    container.innerHTML = cartData.map(function(p, i){
      return `<div class="cart-item-card">
        <img loading="lazy" src="${p.image || 'assets/default-product.png'}" alt="${p.name}" class="cart-item-img" onerror="this.src='assets/default-product.png'">
        <div class="cart-item-info">
          <h3 class="cart-item-name">${p.name}</h3>
          <p class="cart-item-cat">${p.category ? p.category.charAt(0).toUpperCase()+p.category.slice(1) : 'Product'}</p>
          <p class="cart-item-price">KES ${Number(p.price).toLocaleString()}</p>
        </div>
        <div class="cart-item-actions">
          <button class="cart-save-btn" onclick="moveToWishlist(${i})" title="Save for later">❤️</button>
          <button class="cart-del-btn" onclick="removeFromCart(${i})" title="Remove">🗑️</button>
        </div>
      </div>`;
    }).join("");

    /* Update summary */
    var total = cartData.reduce(function(s,p){ return s + Number(p.price||0); }, 0);
    var sub = document.getElementById("summarySubtotal"); if(sub) sub.textContent = "KES "+total.toLocaleString();
    if(heroCount) heroCount.textContent = cartData.length + " item" + (cartData.length !== 1 ? "s" : "") + " in cart";
    /* Reapply saved promo so discount survives item removal */
    var savedPromo = null;
    try{ savedPromo = JSON.parse(localStorage.getItem("sokoniAppliedPromo")||"null"); }catch(e){}
    if(savedPromo && savedPromo.discount >= 0){
      var saving = savedPromo.discount > 0 ? Math.round(total * savedPromo.discount / 100) : 0;
      var discEl = document.getElementById("summaryDiscount");
      var tot    = document.getElementById("summaryTotal");
      if(discEl){ discEl.textContent = saving > 0 ? "-KES "+saving.toLocaleString() : "Free delivery"; discEl.style.color="#71ff00"; }
      if(tot)    tot.textContent = "KES "+(total-saving).toLocaleString();
    } else {
      var tot = document.getElementById("summaryTotal"); if(tot) tot.textContent = "KES "+total.toLocaleString();
    }
  }

  /* Wait for cart.js to define its globals then override render */
  window.addEventListener("DOMContentLoaded", function(){
    premiumRenderCart();
    if(typeof window.renderCart === "function") window.renderCart = premiumRenderCart;

    /* Auto-restore any promo already applied */
    try {
      var saved = JSON.parse(localStorage.getItem('sokoniAppliedPromo') || 'null');
      if(saved && saved.code){
        var inp = document.getElementById('cartPromoInput');
        if(inp) inp.value = saved.code;
        _applyPromoToSummary(saved.discount, saved.code);
      }
    } catch(e){}
  });
})();

/* ── Promo code logic ── */
function applyCartPromo(){
  var inp  = document.getElementById('cartPromoInput');
  var msg  = document.getElementById('cartPromoMsg');
  var code = (inp ? inp.value : '').trim().toUpperCase();
  if(!code){ if(msg){msg.textContent='Enter a promo code.';msg.style.color='#ff6b6b';} return; }

  var codes = [];
  try{ codes = JSON.parse(localStorage.getItem('sokoniPromoCodes')||'[]'); }catch(e){}
  var now = Date.now();
  var found = codes.find(function(c){ return c.code===code && c.expiresAt>now && (c.maxUses==null||c.uses<c.maxUses); });

  /* Also check built-in loyalty codes */
  var loyalty = {SAVE5:5, SAVE10:10, MEGA20:20, SAVE25:25, FREEDEL:0};
  if(!found && loyalty[code]!==undefined){
    found = {code:code, discount:loyalty[code], uses:0, expiresAt:now+9999999999};
  }

  if(!found){
    if(msg){msg.textContent='❌ Invalid or expired code.';msg.style.color='#ff4444';}
    return;
  }

  /* Increment uses */
  var idx = codes.findIndex(function(c){return c.code===code;});
  if(idx>=0){ codes[idx].uses=(codes[idx].uses||0)+1; localStorage.setItem('sokoniPromoCodes',JSON.stringify(codes)); }

  /* Save so checkout auto-picks it up */
  localStorage.setItem('sokoniAppliedPromo', JSON.stringify({code:found.code, discount:found.discount}));

  _applyPromoToSummary(found.discount, found.code);
  if(msg){
    msg.innerHTML='✅ <strong>'+found.code+'</strong> — '+(found.discount>0?found.discount+'% off, saving KES '+Math.round(_cartSubtotal()*found.discount/100).toLocaleString():'Free delivery applied!');
    msg.style.color='#71ff00';
  }
}

function _cartSubtotal(){
  var cart=[];
  try{cart=JSON.parse(localStorage.getItem('cart')||'[]');}catch(e){}
  return cart.reduce(function(s,p){return s+Number(p.price||0);},0);
}

function _applyPromoToSummary(pct, code){
  var sub     = _cartSubtotal();
  var saving  = pct>0 ? Math.round(sub*pct/100) : 0;
  var discEl  = document.getElementById('summaryDiscount');
  var subEl   = document.getElementById('summarySubtotal');
  var totEl   = document.getElementById('summaryTotal');
  if(discEl){ discEl.textContent = saving>0 ? '-KES '+saving.toLocaleString() : 'Free delivery'; discEl.style.color='#71ff00'; }
  if(subEl)  subEl.textContent  = 'KES '+sub.toLocaleString();
  if(totEl)  totEl.textContent  = 'KES '+(sub-saving).toLocaleString();
}
</script>
