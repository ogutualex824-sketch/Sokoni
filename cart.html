<!DOCTYPE html>
<html lang="en" data-splash="1" data-require-auth="true">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
<script src="security.js"></script>
<script type="module" src="sokoni-init.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOKONI — Your Cart</title>
<meta name="description" content="Review items in your SOKONI cart and proceed to checkout.">
<meta property="og:title" content="SOKONI — Your Cart">
<meta property="og:description" content="Review items in your SOKONI cart and proceed to checkout securely with M-Pesa.">
<meta property="og:image" content="https://mysokoni.co.ke/assets/logosokoni.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#71ff00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOKONI">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="premium.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="sokoni-desktop.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="shared-header.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:white;min-height:100vh;padding-bottom:80px;}

/* NAV */
.cn{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(8,8,8,0.96);border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);}
.cn-logo{height:32px;}
.cn-right{display:flex;align-items:center;gap:10px;}
.cn-wish{padding:8px 14px;background:rgba(236,72,153,0.08);border:1px solid rgba(236,72,153,0.2);border-radius:10px;color:#ec4899;font-size:12px;font-weight:700;text-decoration:none;}
.cn-home{padding:8px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.7);font-size:12px;font-weight:700;text-decoration:none;}

/* HERO */
.cart-hero{background:linear-gradient(135deg,rgba(113,255,0,0.08),rgba(79,200,0,0.04),transparent);border-bottom:1px solid rgba(113,255,0,0.1);padding:28px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cart-hero-left{display:flex;align-items:center;gap:14px;}
.cart-hero-icon{width:52px;height:52px;border-radius:16px;background:rgba(113,255,0,0.12);border:1px solid rgba(113,255,0,0.25);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.cart-hero-title{font-size:22px;font-weight:900;color:#fff;margin:0 0 3px;}
.cart-hero-sub{font-size:12px;color:rgba(255,255,255,0.45);margin:0;}
.cart-hero-clear{padding:8px 16px;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.25);color:#ff6b6b;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;flex-shrink:0;}
.cart-hero-clear:hover{background:rgba(255,60,60,0.2);}

/* LAYOUT */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px 16px 40px;max-width:1100px;margin:0 auto;}
@media(max-width:820px){.cart-layout{grid-template-columns:1fr;}}
/* `1fr` is minmax(AUTO,1fr), and that auto minimum is the grid ITEM's min-content —
   so the track cannot shrink below the widest cart card, however narrow the screen.
   With real rows (long product names) the column measured 852px inside a 320px
   viewport and 960px inside 412px; on desktop it took 795px of a 712px slot. The
   media query above was working correctly the whole time — the column simply refused
   to shrink, and an ancestor's overflow:hidden clipped the excess instead of
   producing a scrollbar, which is why the standard scrollWidth check reported clean
   and the defect stayed invisible to automated checks.

   min-width:0 releases that floor so the track takes its 1fr share and the content
   wraps. This is the structural fix; overflow-x:hidden would only re-hide it. */
.cart-items-col,.cart-summary-col{min-width:0;}

/* ITEMS COL */
.cart-items-col{display:flex;flex-direction:column;gap:10px;}

/* ── PRODUCT CARDS (rendered by cart.js as .cart-page-card) ── */
.cart-page-card{background:rgba(16,16,16,0.96);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center;transition:border-color .2s,transform .15s;animation:cartIn .3s ease;}
@keyframes cartIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.cart-page-card:hover{border-color:rgba(113,255,0,0.2);transform:translateY(-1px);}
/* Dimensions are !important on purpose. A global rule in mobile.css —
   `img, video, canvas { max-width:100% !important; height:auto !important }` —
   overrides an un-!important height, so .cart-card-img's height:64px was being
   replaced with height:auto and a tall/portrait product photo stretched far
   past its 64px box: the "cart images cover the whole phone screen" report.
   Locking width AND height (plus min/max) makes the thumbnail immune to that
   override on every device. */
.cart-card-img{width:64px!important;height:64px!important;min-width:64px;max-width:64px;max-height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.07);background:#111;}
.cart-card-info{flex:1;min-width:0;}
.cart-card-info h3{font-size:13px;font-weight:800;color:rgba(255,255,255,0.92);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-card-cat{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px;}
.cart-card-price{font-size:15px;font-weight:900;color:#71ff00;margin:0;}
.cart-card-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end;flex-shrink:0;}
.cart-card-actions .cart-food-qty{margin:0;}.cart-card-actions .cart-qty-btn{border-color:rgba(113,255,0,0.3);background:rgba(113,255,0,0.08);color:#71ff00;}.cart-card-actions .cart-qty-btn:hover{background:rgba(113,255,0,0.18);}
.cart-move-wish{width:44px;height:44px;min-width:44px;border-radius:12px;background:rgba(236,72,153,0.1);border:1px solid rgba(236,72,153,0.2);color:#ec4899;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.cart-move-wish:hover{background:rgba(236,72,153,0.2);}
.cart-remove-btn{display:flex;align-items:center;gap:5px;padding:8px 12px;background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.18);color:rgba(255,100,100,0.7);font-size:11px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap;}
.cart-remove-btn:hover{background:rgba(255,60,60,0.18);color:#ff6b6b;}

/* ── FOOD ITEMS (vendor-grouped) ── */
.cart-vendor-group{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.cart-vendor-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(34,197,94,0.04);border-bottom:1px solid rgba(255,255,255,0.05);}
.cart-vendor-emoji{font-size:20px;}
.cart-vendor-name{flex:1;font-size:13px;font-weight:800;}
.cart-vendor-sub{font-size:13px;font-weight:900;color:#22c55e;}
.cart-food-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);}
.cart-food-item:last-child{border-bottom:none;}
.cart-food-info{flex:1;min-width:0;}
.cart-food-info h3{font-size:13px;font-weight:800;color:rgba(255,255,255,0.9);margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-food-qty{display:flex;align-items:center;gap:0;margin:0 12px;}
.cart-qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);color:#22c55e;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .18s;}
.cart-qty-btn:hover{background:rgba(34,197,94,0.18);}
.cart-qty-num{min-width:28px;text-align:center;font-size:13px;font-weight:900;}

/* SECTION HEADERS */
.cart-section-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.4);padding:18px 0 8px;margin-top:8px;}
.cart-section-header:first-child{margin-top:0;}
.cart-section-cta{padding:12px 0 4px;}
.cart-checkout-food,.cart-checkout-products{display:block;width:100%;padding:14px;border-radius:14px;text-align:center;font-size:14px;font-weight:900;text-decoration:none;transition:all .18s;}
.cart-checkout-food{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#22c55e;}
.cart-checkout-food:hover{background:rgba(34,197,94,0.22);}
/* Food checkout is per-restaurant (each vendor is paid separately), so the CTA
   lives inside each vendor group rather than once for the whole food section. */
.cart-vendor-cta{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,0.05);}
.cart-track-orders{display:block;width:100%;padding:12px;border-radius:12px;text-align:center;font-size:12px;font-weight:700;text-decoration:none;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.55);transition:all .2s;}
.cart-track-orders:hover{border-color:rgba(34,197,94,0.3);color:#22c55e;}
.cart-checkout-products{background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.28);color:#71ff00;}
.cart-checkout-products:hover{background:rgba(113,255,0,0.2);}

/* EMPTY STATE */
.cart-empty-state{text-align:center;padding:80px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cart-shop-now-btn{padding:12px 28px;background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.28);color:#71ff00;font-weight:900;font-size:13px;border-radius:12px;text-decoration:none;transition:all .18s;}
.cart-shop-now-btn:hover{background:rgba(113,255,0,0.2);}

/* SUMMARY BOX */
.cart-summary-col{position:relative;}
.cart-summary-box{background:rgba(16,16,16,0.96);border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:22px 20px;position:sticky;top:80px;}
.summary-title{font-size:16px;font-weight:900;color:white;margin:0 0 18px;display:flex;align-items:center;gap:8px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;color:rgba(255,255,255,0.6);}
.summary-row:last-of-type{border-bottom:none;}
.summary-row-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;font-size:16px;font-weight:900;color:white;}
.summary-total-val{color:#71ff00;font-size:20px;}
.summary-free{color:#71ff00;font-weight:800;font-size:12px;}
.checkout-btn{display:block;width:100%;margin-top:18px;padding:15px;text-align:center;text-decoration:none;background:linear-gradient(135deg,#71ff00,#4fc800);color:#000;font-weight:900;font-size:15px;border-radius:14px;letter-spacing:.3px;transition:opacity .2s,transform .15s;}
.checkout-btn:hover{opacity:.92;transform:translateY(-1px);}
.continue-btn{display:block;width:100%;margin-top:10px;padding:12px;text-align:center;text-decoration:none;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-weight:700;font-size:13px;border-radius:12px;transition:all .2s;}
.continue-btn:hover{background:rgba(255,255,255,0.09);color:white;}

/* PROMO */
.promo-row{display:flex;gap:8px;margin-top:16px;}
.promo-input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:12px;font-family:inherit;outline:none;}
.promo-input::placeholder{color:rgba(255,255,255,0.3);}
.promo-input:focus{border-color:rgba(113,255,0,0.3);}
.promo-apply{padding:10px 14px;background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.25);color:#71ff00;font-size:12px;font-weight:800;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s;}
.promo-apply:hover{background:rgba(113,255,0,0.2);}

/* TRUST ROW */
.trust-row{display:flex;justify-content:space-around;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.07);}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.35);text-align:center;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,8,0.98);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,0);z-index:50;backdrop-filter:blur(16px);}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:10px;font-weight:700;min-width:52px;transition:color .18s;padding:2px 0;}
.bnav-emoji{font-size:20px;line-height:1.2;}
.bnav-item:hover,.bnav-item.active{color:#71ff00;}
.bnav-item.active .bnav-emoji{filter:drop-shadow(0 0 6px rgba(113,255,0,0.5));}
/* ── Mobile persistent checkout bar — total + Checkout always reachable with one thumb.
   Only shows on mobile (≤820px, where the side summary collapses below the item list);
   docks above the bottom-nav, respects the safe area. Hidden when the cart is empty. ── */
.cart-mobile-bar{display:none;}
@media(max-width:820px){
  .cart-mobile-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));
    z-index:60;padding:9px 14px;background:rgba(8,8,8,0.98);
    border-top:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(16px);
  }
  .cart-mobile-bar.cmb-hidden{display:none;}
  .cmb-total{display:flex;flex-direction:column;line-height:1.15;flex-shrink:0;}
  .cmb-label{font-size:10px;color:rgba(255,255,255,0.45);font-weight:700;}
  #cartBarTotal{font-size:18px;font-weight:900;color:#71ff00;letter-spacing:-0.3px;}
  .cmb-checkout{flex:1;max-width:220px;text-align:center;padding:13px;border-radius:12px;
    background:linear-gradient(135deg,#71ff00,#4fc800);color:#000;font-weight:900;font-size:15px;
    text-decoration:none;box-shadow:0 2px 12px rgba(113,255,0,0.28);}
  /* Reserve space so the last cart item isn't hidden behind the bar + nav */
  body{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px)) !important;}
}

/* ── PREMIUM MULTI-SHOP PRODUCT GROUPS ─────────────────────────────────────
   Products are partitioned by shop (cart.js → renderProductSection). Each shop is a
   self-contained premium card so a multi-shop basket reads shop-by-shop. Every amount
   shown is presentation-only; the server remains the pricing/settlement authority. */
.cart-multishop-hint{display:flex;align-items:center;gap:8px;background:rgba(113,255,0,0.06);border:1px solid rgba(113,255,0,0.22);border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,0.75);margin-bottom:12px;}
.cart-multishop-hint strong{color:#71ff00;font-weight:900;}

.cart-shop-group{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:18px;margin-bottom:14px;overflow:hidden;animation:cartIn .3s ease;transition:border-color .2s;}
.cart-shop-group:hover{border-color:rgba(113,255,0,0.18);}
.cart-shop-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,rgba(113,255,0,0.07),rgba(113,255,0,0.02));border-bottom:1px solid rgba(255,255,255,0.06);}
.cart-shop-avatar{width:40px;height:40px;min-width:40px;max-width:40px;height:40px!important;max-height:40px;border-radius:12px;object-fit:cover;border:1px solid rgba(113,255,0,0.28);background:#0d0d0d;flex-shrink:0;}
.cart-shop-avatar--letter{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#71ff00;background:rgba(113,255,0,0.12);}
.cart-shop-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.cart-shop-name{font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-shop-count{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.05em;}
.cart-shop-sub{font-size:14px;font-weight:900;color:#71ff00;flex-shrink:0;white-space:nowrap;}
.cart-shop-items{display:flex;flex-direction:column;}
/* Rows inside a shop card drop their own outer chrome — the shop card is the frame. */
.cart-shop-group .cart-shop-item{background:transparent;border:none;border-radius:0;border-bottom:1px solid rgba(255,255,255,0.05);animation:none;padding:13px 16px;}
.cart-shop-group .cart-shop-item:last-child{border-bottom:none;}
.cart-shop-group .cart-shop-item:hover{transform:none;border-color:transparent;background:rgba(255,255,255,0.015);}
.cart-shop-cta{padding:12px 16px 15px;border-top:1px solid rgba(255,255,255,0.05);}
.cart-shop-checkout{display:block;width:100%;padding:12px;border-radius:12px;text-align:center;font-size:13px;font-weight:900;text-decoration:none;background:rgba(113,255,0,0.1);border:1px solid rgba(113,255,0,0.28);color:#71ff00;transition:background .18s,transform .15s;}
.cart-shop-checkout:hover{background:rgba(113,255,0,0.2);transform:translateY(-1px);}
.cart-shop-checkout:focus-visible{outline:2px solid #71ff00;outline-offset:2px;}

/* Skeleton — for any loading state shown before the cart hydrates */
.cart-skeleton{background:rgba(16,16,16,0.96);border:1px solid rgba(255,255,255,0.06);border-radius:18px;height:96px;margin-bottom:14px;position:relative;overflow:hidden;}
.cart-skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);transform:translateX(-100%);animation:cartShimmer 1.3s infinite;}
@keyframes cartShimmer{100%{transform:translateX(100%);}}

@media(max-width:520px){
  .cart-shop-header{padding:12px 13px;gap:10px;}
  .cart-shop-avatar{width:36px;height:36px;min-width:36px;max-width:36px;height:36px!important;max-height:36px;}
  .cart-shop-group .cart-shop-item{padding:12px 13px;gap:11px;}
  .cart-shop-item .cart-card-actions{gap:6px;}
}
@media(prefers-reduced-motion:reduce){
  .cart-shop-group{animation:none;}
  .cart-shop-checkout:hover,.cart-shop-group:hover{transform:none;}
  .cart-skeleton::after{animation:none;}
}
</style>
</head>
<body>
<script src="splash.js"></script>
<script src="sokoni-security.js" defer></script>
<script src="sokoni-guards.js" defer></script>

<nav class="cn">
  <a href="/"><img loading="lazy" src="assets/sokoni-logo-dark.png" class="cn-logo" alt="SOKONI"></a>
  <div class="cn-right">
    <a href="wishlist.html" class="cn-wish">❤️ Wishlist</a>
    <a href="/" class="cn-home">🏠 Home</a>
  </div>
</nav>

<section class="cart-hero">
  <div class="cart-hero-left">
    <div class="cart-hero-icon">🛒</div>
    <div>
      <h1 class="cart-hero-title">Your Cart</h1>
      <p class="cart-hero-sub" id="cartHeroCount">Loading…</p>
    </div>
  </div>
  <button type="button" class="cart-hero-clear" onclick="clearCart()">🗑 Clear All</button>
</section>

<div class="cart-layout">
  <div class="cart-items-col" id="cartContainer"></div>

  <div class="cart-summary-col">
    <div class="cart-summary-box">
      <div class="summary-title">🧾 Order Summary</div>

      <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">KES 0</span></div>
      <div class="summary-row"><span>Delivery</span><span class="summary-free">FREE</span></div>
      <div class="summary-row"><span>Discount</span><span id="summaryDiscount" style="color:rgba(255,255,255,0.4);">—</span></div>
      <div class="summary-row-total"><span>Total</span><span class="summary-total-val" id="summaryTotal">KES 0</span></div>

      <div class="promo-row">
        <input type="text" id="cartPromoInput" class="promo-input" placeholder="Promo / Voucher code" oninput="this.value=this.value.toUpperCase()">
        <button type="button" class="promo-apply" onclick="applyCartPromo()">Apply</button>
      </div>
      <div id="cartPromoMsg" style="font-size:12px;margin-top:6px;min-height:16px;"></div>

      <a href="checkout.html" class="checkout-btn">Proceed to Checkout →</a>
      <a href="category.html?cat=all" class="continue-btn">← Continue Shopping</a>

      <div class="trust-row">
        <div class="trust-item">🔒<span>Secure</span></div>

<!-- cart.js handles all rendering — no override -->
<!-- Canonical wishlist authority. Must load before cart.js, whose moveToWishlist()
     calls SokoniWishlist instead of writing localStorage['wishlist']. -->
<script src="sokoni-wishlist.js"></script>
<!-- Canonical cart access path (Track 2.3.6). cart.js no longer reads or writes
     localStorage['cart'] — every row removal, quantity change and Clear Cart goes
     through the service. Without this tag the page renders an empty cart and every
     control fails closed, so load order is asserted by the suite. -->
<script src="sokoni-cart.js"></script>
<script src="cart.js"></script>
<script>
/* Keep the mobile checkout bar's total in sync with the order summary (single source),
   and hide the bar when the cart is empty. Decoupled via observer — no cart.js edits. */
(function(){
  var s=document.getElementById('summaryTotal'), t=document.getElementById('cartBarTotal'), bar=document.getElementById('cartMobileBar');
  if(!s||!t||!bar) return;
  function sync(){
    var txt=(s.textContent||'KES 0').trim(); t.textContent=txt;
    var n=parseInt(((txt.match(/[\d,]+/)||['0'])[0]).replace(/,/g,''),10)||0;
    bar.classList.toggle('cmb-hidden', n<=0);
  }
  sync();
  try{ new MutationObserver(sync).observe(s,{childList:true,characterData:true,subtree:true}); }catch(_){ }
})();
</script>
<script>
/* _esc comes from cart.js (loaded above). Re-declaring it here as a `const`
   collided with cart.js's `function _esc` in the same global scope — a hard
   SyntaxError that killed THIS ENTIRE inline block, so the promo-code handler
   and the updateSummary wrapper below never ran. */
/* ── Hero count — updated after cart.js renders ── */
function _updateHeroCount(){
  /* Canonical (Track 2.3.7). This already summed (qty||1), so units() is a like-for-like
     swap. Without the service there is no count to state — "0 items in cart" would assert
     an empty cart the page cannot verify, which is precisely the reading a shopper would
     act on. */
  var C=window.SokoniCart;
  var el=document.getElementById('cartHeroCount');
  if(!el) return;
  if(!C){ el.textContent='Loading your cart…'; return; }
  var total=C.units();
  el.textContent=total+' item'+(total!==1?'s':'')+' in cart';
}

/* ── Wrap cart.js updateSummary to preserve applied promo ── */
window.addEventListener('DOMContentLoaded',function(){
  var origUpdate=window.updateSummary;
  window.updateSummary=function(){
    if(origUpdate) origUpdate();
    _updateHeroCount();
    /* U7c2: after every cart mutation, the SERVER's shop-offer figure for this cart (never a client percentage) */
    _cartShopOffers();
  };
  _updateHeroCount();
  /* Auto-restore promo */
  try{
    var saved=JSON.parse(localStorage.getItem('sokoniAppliedPromo')||'null');
    if(saved&&saved.code){
      var inp=document.getElementById('cartPromoInput'); if(inp) inp.value=saved.code;
      var msg=document.getElementById('cartPromoMsg');
      /* a remembered code is REMEMBERED — the saving is decided and shown at checkout, by the server */
      if(msg){msg.textContent='🔒 Code '+saved.code+' will be checked at checkout';msg.style.color='rgba(255,255,255,0.7)';}
    }
  }catch(e){}
  _cartShopOffers();
});

/* ── Promo codes: NAMED here, DECIDED by the server (U7c2, 2026-09-29) ──
   This used to accept codes from a hard-coded list (SAVE5, MEGA20, WELCOME50 …) or localStorage, subtract a percentage
   from the summary and count "uses" in the browser. Checkout never applied any of it — createCheckoutSession validates
   the code server-side — so the cart showed savings the buyer was never given. A code is now only remembered and handed
   to checkout, where the server validates it and reports the real saving. (A promo code does not stack on a shop's own
   offer — the server says so at payment.) */
function applyCartPromo(){
  var inp=document.getElementById('cartPromoInput');
  var msg=document.getElementById('cartPromoMsg');
  var code=(inp?inp.value:'').trim().toUpperCase();
  if(!code){if(msg){msg.textContent='Enter a promo code.';msg.style.color='#ff6b6b';}return;}
  if(!/^[A-Z0-9_-]{2,32}$/.test(code)){if(msg){msg.textContent='That does not look like a promo code.';msg.style.color='#ff6b6b';}return;}
  try{localStorage.setItem('sokoniAppliedPromo',JSON.stringify({code:code}));}catch(e){}
  if(msg){msg.innerHTML='🔒 <strong>'+_esc(code)+'</strong> will be checked and applied at checkout.';msg.style.color='rgba(255,255,255,0.7)';}
}

/* ── THE SHOP'S OFFERS, AS THE SERVER PRICES THIS CART (U7c2) ──
   shopOfferQuote runs the same resolver checkout charges with, over the same server lines. The Discount row shows its
   answer — or a dash while it is unknown, never a guessed 0. */
var _cartOfferKey=null, _cartOfferSeq=0;
function _cartShopOffers(){
  var C=window.SokoniCart; if(!C) return;
  var lines=C.list();
  var key=lines.map(function(p){return String(p.productId||p.id||'')+'x'+(p.qty||1)+(p.offerId?'@'+p.offerId:'');}).join('|');
  var discEl=document.getElementById('summaryDiscount'), totEl=document.getElementById('summaryTotal');
  if(!lines.length){ if(discEl){discEl.textContent='—';discEl.style.color='rgba(255,255,255,0.4)';} _cartOfferKey=null; return; }
  if(key===_cartOfferKey) return _paintCartOffer();
  _cartOfferKey=key; window.__cartOffer=null; _paintCartOffer();
  var seq=++_cartOfferSeq;
  var items=lines.map(function(p){var o={productId:String(p.productId||p.id||''),qty:Math.max(1,Math.round(Number(p.qty)||1))}; if(p.offerId)o.offerId=String(p.offerId); return o;}).filter(function(i){return i.productId;});
  if(!window.firebaseApp){ window.__cartOffer={state:'unknown'}; return _paintCartOffer(); }
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js').then(function(fn){
    return fn.httpsCallable(fn.getFunctions(window.firebaseApp),'shopOfferQuote')({items:items});
  }).then(function(r){
    if(seq!==_cartOfferSeq) return;
    var d=(r&&r.data)||{};
    window.__cartOffer={state:'ok',subtotal:Number(d.subtotal)||0,discount:Math.max(0,Number(d.discount)||0),
      labels:(d.shops||[]).reduce(function(a,sh){return a.concat((sh.applied||[]).map(function(x){return x.label;}));},[])};
    _paintCartOffer();
  }).catch(function(){ if(seq!==_cartOfferSeq) return; window.__cartOffer={state:'unknown'}; _paintCartOffer(); });
}
function _paintCartOffer(){
  var o=window.__cartOffer, discEl=document.getElementById('summaryDiscount'), totEl=document.getElementById('summaryTotal');
  if(!discEl) return;
  if(!o){ discEl.textContent='Checking offers…'; discEl.style.color='rgba(255,255,255,0.4)'; return; }
  if(o.state!=='ok'){ discEl.textContent='Checked at checkout'; discEl.style.color='rgba(255,255,255,0.4)'; return; }
  if(o.discount>0){
    discEl.textContent='-KES '+o.discount.toLocaleString()+(o.labels.length?' · '+o.labels.join(' + '):'');
    discEl.style.color='#71ff00';
    if(totEl) totEl.textContent='KES '+Math.max(0,o.subtotal-o.discount).toLocaleString();
  } else { discEl.textContent='—'; discEl.style.color='rgba(255,255,255,0.4)'; }
}
</script>
