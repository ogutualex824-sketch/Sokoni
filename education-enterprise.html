<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="security.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Company Training — SOKONI Education</title>
  <meta name="description" content="Arrange and track staff training on SOKONI Education.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  <!-- The company's OWN Education shell (owner 2026-10-03: "like merchant-v2.html with the side bar"). Same frame as
       merchant-v2: phone = off-canvas drawer + header; desktop (>=900px) = static sidebar rail + header + one scroller.
       A company BUYS training: no courses, teachers, storefront or provider wallet live here. -->
  <style>
    :root{
      --bg:#050505;--surface:#0d0d0d;--surface-2:#141414;--line:rgba(255,255,255,.09);
      --txt:#f4f4f4;--txt2:#a8a8a8;--txt3:#6d6d6d;--acc:#71ff00;--acc-dim:rgba(113,255,0,.12);--acc-line:rgba(113,255,0,.32);--danger:#ff5252;
      --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
      --header-h:56px;--rail-w:232px;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    html{background:var(--bg);-webkit-text-size-adjust:100%}
    body{background:var(--bg);color:var(--txt);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;min-height:100vh;min-height:100dvh}
    button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
    a{color:inherit;text-decoration:none}
    .app{min-height:100vh;min-height:100dvh;padding-top:calc(var(--header-h) + var(--safe-top))}
    .hdr{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--header-h) + var(--safe-top));padding:var(--safe-top) 12px 0;display:flex;align-items:center;gap:10px;
      background:rgba(5,5,5,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .hdr-btn{width:38px;height:38px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);font-size:16px}
    .hdr-title{font-size:16px;font-weight:800;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(84vw,var(--rail-w));background:var(--surface);border-right:1px solid var(--line);
      transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;min-height:0;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
    .side.open{transform:translateX(0)}
    .side-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:13px 12px;border-bottom:1px solid var(--line)}
    .side-logo{width:36px;height:36px;border-radius:10px;object-fit:contain;background:var(--acc-dim);border:1px solid var(--acc-line);padding:3px}
    .side-co{min-width:0}
    .side-co b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-co small{display:block;font-size:11px;color:var(--txt3)}
    .side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 4px}
    .side-group{margin:10px 6px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
    .nav-item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;margin-bottom:2px;font-size:14px;font-weight:600;color:var(--txt2);text-align:left}
    .nav-item .ico{flex:0 0 auto;width:20px;text-align:center;font-size:15px}
    .nav-item .lbl{min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-item .tag{font-size:10px;font-weight:800;color:var(--txt3);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
    .nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
    .nav-item.on{background:var(--acc-dim);color:var(--acc);border:1px solid var(--acc-line);padding:9px 10px}
    .nav-item[aria-disabled="true"]{opacity:.55;cursor:default}
    .side-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:8px}
    .side-foot .nav-item{color:var(--txt3)}
    .scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s}
    .scrim.on{opacity:1;pointer-events:auto}
    .main{padding:14px 14px 24px;max-width:1180px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .muted{color:var(--txt2);font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
    .stat b{display:block;font-size:22px}
    .btn{background:var(--acc);color:#000;border-radius:10px;padding:9px 14px;font-weight:800}
    .btn2{background:var(--surface-2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
    .input{width:100%;background:#1a1a1a;border:1px solid #333;color:var(--txt);border-radius:8px;padding:9px;margin:6px 0}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0;flex-wrap:wrap}
    .code{font-weight:800;letter-spacing:1px}
    @media (min-width:900px){
      .app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;padding:0}
      .side{position:relative;height:100vh;height:100dvh;transform:none;width:var(--rail-w);z-index:10}
      .scrim{display:none}
      .hdr-menu{display:none}
      .col{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
      .hdr{position:static;height:var(--header-h);padding:0 16px;flex:0 0 auto}
      .main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 32px}
    }
    @media (prefers-reduced-motion:reduce){ .side,.scrim{transition:none} }
  </style>
</head>
<body>
<div class="app">
  <aside class="side" id="entSide" aria-label="Company training navigation">
    <div class="side-head">
      <img class="side-logo" src="assets/logosokoni.png" alt="SOKONI">
      <span class="side-co"><b id="entCoName">—</b><small>Company training</small></span>
    </div>
    <nav class="side-scroll" id="entNav"></nav>
    <div class="side-foot">
      <a class="nav-item" href="education.html#learn"><span class="ico">🎓</span><span class="lbl">Education home</span></a>
    </div>
  </aside>
  <div class="scrim" id="entScrim"></div>
  <div class="col">
    <header class="hdr">
      <button class="hdr-btn hdr-menu" id="entMenu" type="button" aria-label="Open menu" aria-controls="entSide" aria-expanded="false">☰</button>
      <div class="hdr-title" id="entTitle">Company training</div>
    </header>
    <main class="main" id="entRoot" aria-live="polite"><p class="muted">Loading…</p></main>
  </div>
</div>
<script type="module" src="firebase.js"></script>
<script src="hub-register.js" defer></script>
<script src="sokoni-education-enterprise.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () { if (window.SokoniEducationEnterprise) SokoniEducationEnterprise.init(); });
</script>
<!-- Self-update (every new page must): this shell does not load shared-header.js (like merchant-v2), so it loads
     sw-register.js directly — otherwise it would serve stale after a deploy. -->
<script src="/sw-register.js" defer></script>
</body>
</html>
