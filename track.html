<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="security.js"></script>
  <!-- Canonical cart access path (Track 2.6). shared-header.js reads the cart badge
       through SokoniCart; without this tag the pip cannot render a count. -->
  <script src="sokoni-cart.js"></script>
  <script src="shared-header.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Track your order — SOKONI</title>
  <meta name="description" content="Track your SOKONI delivery in real time. See live rider location and estimated arrival.">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="leaflet.min.css">
  <style>
    :root{--bg:#050505;--surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.09);--border:rgba(255,255,255,.1);--accent:#71ff00;--info:#00bcd4;--warn:#ff9800;--danger:#f44336;--txt:#fff;--muted:rgba(255,255,255,.5)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
    #map{position:fixed;inset:0;z-index:0}
    /* ── Header ── */
    #hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(180deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.7) 80%,transparent 100%);padding:max(14px,env(safe-area-inset-top)) 16px 24px;display:flex;align-items:center;gap:10px}
    #hdrLogo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#71ff00,#00bcd4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
    #hdrInfo{flex:1;min-width:0}
    #hdrStatus{font-size:14px;font-weight:800}
    #hdrOrder{font-size:11px;color:var(--muted);font-family:monospace}
    #shareBtn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--txt);font-size:12px;cursor:pointer;flex-shrink:0}
    /* ── Panel ── */
    #panel{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,10,10,.97);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:14px 16px max(20px,env(safe-area-inset-bottom))}
    #panelHandle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 14px}
    /* ── ETA ── */
    #etaRow{display:flex;gap:10px;margin-bottom:14px}
    .eta-card{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
    .eta-val{font-size:22px;font-weight:900;margin-bottom:2px}
    .eta-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    #etaArrival .eta-val{color:var(--accent)}
    #etaDist .eta-val{color:var(--info)}
    /* ── Rider card ── */
    #riderCard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px}
    #riderAvatar{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
    #riderAvatar img{width:100%;height:100%;object-fit:cover}
    #riderName{font-size:15px;font-weight:800}
    #riderRating{font-size:12px;color:var(--warn)}
    #riderVehicle{font-size:11px;color:var(--muted);margin-top:2px}
    /* ── Timeline ── */
    #timeline{display:flex;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    #timeline::-webkit-scrollbar{display:none}
    .tl-step{display:flex;flex-direction:column;align-items:center;min-width:70px;flex:1;position:relative}
    .tl-step:not(:last-child)::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
    .tl-step.done::after{background:var(--accent)}
    .tl-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1;position:relative}
    .tl-step.done .tl-dot{background:var(--accent);border-color:var(--accent);color:#000}
    .tl-step.active .tl-dot{border-color:var(--accent);animation:pls 1.4s ease infinite}
    @keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(113,255,0,.4)}50%{box-shadow:0 0 0 6px rgba(113,255,0,0)}}
    .tl-lbl{font-size:9px;color:var(--muted);text-align:center;margin-top:5px;line-height:1.3;max-width:62px}
    .tl-step.done .tl-lbl,.tl-step.active .tl-lbl{color:var(--accent)}
    /* "Picked up 14:32" — a time is the difference between a status and an answer. */
    .tl-at{font-size:8px;color:var(--muted);margin-top:2px;min-height:10px;font-variant-numeric:tabular-nums}
    .tl-step.done .tl-at,.tl-step.active .tl-at{color:rgba(255,255,255,.45)}
    /* ── Bearing rotation ── */
    .rider-marker-inner{transform:rotate(var(--bearing,0deg));transition:transform .5s ease}
    /* ── LIVE badge ── */
    #liveBadge{display:none;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    #liveBadge.active{display:flex}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pls 1.4s ease infinite}
    /* ── Loading ── */
    #loadScreen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loadScreen p{color:var(--muted);font-size:14px}
    /* ── Delivered overlay ── */
    #doneOverlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px}
    #doneOverlay.show{display:flex}
  </style>
</head>
<body>

<div id="loadScreen"><div class="spin"></div><p>Loading tracking…</p></div>
<div id="map"></div>

<div id="doneOverlay">
  <div style="font-size:72px">🎉</div>
  <h2 style="font-size:24px;font-weight:900">Delivered!</h2>
  <p style="color:var(--muted);font-size:14px;max-width:280px;line-height:1.6">Your order has been delivered successfully. Thank you for choosing SOKONI!</p>
  <a href="/" style="background:var(--accent);color:#000;padding:14px 28px;border-radius:12px;font-weight:800;font-size:15px;text-decoration:none;margin-top:8px">Back to Home</a>
</div>

<div id="hdr">
  <div id="hdrLogo">SOKONI</div>
  <div id="hdrInfo">
    <div id="hdrStatus">Loading…</div>
    <div id="hdrOrder"></div>
  </div>
  <button id="shareBtn" onclick="_share()">📤 Share</button>
</div>

<div id="panel">
  <div id="panelHandle"></div>
  <div id="liveBadge"><div class="live-dot"></div>LIVE</div>
  <div id="etaRow">
    <div class="eta-card" id="etaArrival"><div class="eta-val" id="etaArrVal">—</div><div class="eta-lbl">Arrives at</div></div>
    <div class="eta-card" id="etaDist"><div class="eta-val" id="etaDistVal">—</div><div class="eta-lbl">Distance away</div></div>
  </div>
  <div id="riderCard">
    <div id="riderAvatar">🏍</div>
    <div>
      <div id="riderName">Finding your rider…</div>
      <div id="riderRating"></div>
      <div id="riderVehicle"></div>
    </div>
  </div>
  <!-- Rendered by JS from STAGES so the page cannot drift from the engine's stage list. -->
  <div id="timeline"></div>
  <!-- Secure Delivery Authorization (Phase 0) — buyer's delivery PIN. -->
  <div id="pinBox" style="display:none;margin:16px 0 4px;padding:16px;border:1px solid rgba(113,255,0,.35);border-radius:14px;background:rgba(113,255,0,.06);text-align:center">
    <div style="font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.6);text-transform:uppercase">🔐 Delivery PIN</div>
    <div id="pinCode" style="font-size:34px;font-weight:900;letter-spacing:.24em;color:#71ff00;margin:6px 0 2px">— — — — — —</div>
    <div style="font-size:12px;color:rgba(255,255,255,.55);line-height:1.5">Give this PIN to your rider <strong>only after</strong> you've received your package.</div>
    <!-- Forgotten-PIN fallback. The rider CANNOT complete a delivery on their own word, so
         a buyer who cannot read out the PIN would otherwise be stuck. The escape hatch is
         deliberately the BUYER's, not the rider's: the party owed the goods is the party who
         confirms receipt. buyerConfirmDelivery verifies server-side that the caller is the
         order's buyer (and refuses if they are also the assigned rider), so this is an
         authorisation, not a bypass. -->
    <button id="buyerConfirmBtn" type="button"
            style="margin-top:14px;width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
                   background:rgba(255,255,255,.06);color:#fff;font-weight:700;font-size:13px;cursor:pointer">
      Can't read the PIN? Confirm you received it
    </button>
    <div id="buyerConfirmMsg" style="font-size:12px;margin-top:8px;color:rgba(255,255,255,.6)"></div>
  </div>
</div>

<script src="leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-check-compat.js"></script>
<script src="sokoni-appcheck.js"></script>
<script src="sokoni-config.js"></script>
<script>
'use strict';

var _map=null,_riderM=null,_destM=null,_code=null,_orderId=null,_lastStatus=null,_realtimeSetup=false;
var _unsubs=[];
window.addEventListener('beforeunload',function(){_unsubs.forEach(function(u){if(u)u();});});
var HAV=function(a,b,c,d){var R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};

function _cf(n){return firebase.functions().httpsCallable(n);}

/* ── Map ── */
(function(){
  var _mapEl = document.getElementById('map');
  if (typeof L === 'undefined') {
    if (_mapEl) _mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:10px;color:rgba(255,255,255,0.45);font-size:13px;text-align:center;padding:20px;background:rgba(8,8,8,0.7)"><span style="font-size:32px">🗺️</span><div>Map could not load.<br><small style="color:rgba(255,255,255,0.25)">Check your connection and retry.</small></div><button onclick="location.reload()" style="margin-top:6px;padding:9px 22px;background:rgba(113,255,0,0.12);border:1px solid rgba(113,255,0,0.3);border-radius:10px;color:#71ff00;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit">Retry</button></div>';
    return;
  }
  _map=L.map('map',{zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(_map);
  L.control.zoom({position:'bottomright'}).addTo(_map);
  _map.setView([1.2921,36.8219],13);
}());

function _riderMarker(){
  if(_riderM) return _riderM;
  _riderM=L.marker([1.2921,36.8219],{
    icon:L.divIcon({className:'',html:'<div style="width:44px;height:44px;background:#71ff00;border:3px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.4)">🏍</div>',iconSize:[44,44],iconAnchor:[22,22]}),
    zIndexOffset:1000
  }).addTo(_map);
  return _riderM;
}

/* ── Poll ── */
function _poll(){
  _cf('navGetCustomerTracking')({trackingCode:_code}).then(function(r){
    _render(r.data);
    document.getElementById('loadScreen').style.display='none';
  }).catch(function(e){
    document.getElementById('loadScreen').innerHTML='<div style="text-align:center;padding:24px"><p style="font-size:18px;margin-bottom:8px">⚠ '+e.message+'</p><a href="profile.html" style="color:var(--accent);font-size:13px">My Orders</a></div>';
  });
}

var STATUS_LABELS={pending:'🕐 Finding a rider',assigned:'🏍 Rider assigned',en_route_pickup:'🏍 Heading to pickup',arrived_pickup:'📦 Collecting your order',en_route_delivery:'🏍 On the way to you!',arrived_delivery:'📍 Rider at your door',completed:'✅ Delivered!',cancelled:'❌ Cancelled'};

/* ── The order journey ────────────────────────────────────────────────────
   These 11 stages MIRROR functions/notify.js ORDER_TIMELINE — same keys, same
   order. The server owns the truth (orders/{id}.timelineIndex); this list only
   supplies the icon and the short label. If the two ever disagree on a key, the
   step simply renders as not-yet-reached rather than throwing.               */
var STAGES=[
  {k:'received', i:'🧾', l:'Order received'},
  {k:'paid',     i:'✓',  l:'Payment confirmed'},
  {k:'accepted', i:'🏪', l:'Seller accepted'},
  {k:'preparing',i:'👨‍🍳', l:'Preparing'},
  {k:'ready',    i:'📦', l:'Package ready'},
  {k:'assigned', i:'🏍', l:'Rider assigned'},
  {k:'picked_up',i:'🛵', l:'Picked up'},
  {k:'halfway',  i:'🚦', l:'On the way'},
  {k:'near',     i:'📍', l:'Near you'},
  {k:'delivered',i:'🎉', l:'Delivered'},
  {k:'completed',i:'⭐', l:'Completed'}
];
var STAGE_IDX={}; STAGES.forEach(function(s,i){STAGE_IDX[s.k]=i;});

/* A delivery TRIP only covers the tail of the journey. When we are tracking by
   trip (a shared link with no order id) this is the best we can say about where
   the order as a whole has got to. */
var TRIP_TO_STAGE={pending:'ready',assigned:'assigned',en_route_pickup:'assigned',arrived_pickup:'ready',
                   en_route_delivery:'halfway',arrived_delivery:'near',completed:'delivered',cancelled:'accepted'};

/* Timeline is built once, then only classes change — no innerHTML churn on every
   snapshot, which would otherwise restart the pulse animation each tick. */
function _buildTimeline(){
  var el=document.getElementById('timeline');
  if(el.childElementCount) return;
  el.innerHTML=STAGES.map(function(s){
    return '<div class="tl-step" data-s="'+s.k+'"><div class="tl-dot">'+s.i+'</div>'+
           '<div class="tl-lbl">'+s.l+'</div><div class="tl-at"></div></div>';
  }).join('');
}

/* stampsByKey: optional {stageKey: epochMs} so each reached step can show WHEN it
   happened. "Picked up 14:32" is the difference between a status and an answer. */
function _renderTimeline(stageKey,stampsByKey){
  _buildTimeline();
  var curr=STAGE_IDX[stageKey];
  if(curr===undefined) curr=0;
  document.querySelectorAll('.tl-step').forEach(function(el){
    var i=STAGE_IDX[el.dataset.s];
    el.classList.toggle('done',   i<curr);
    el.classList.toggle('active', i===curr);
    var at=el.querySelector('.tl-at');
    var ts=stampsByKey&&stampsByKey[el.dataset.s];
    if(at) at.textContent=(ts&&i<=curr)?new Date(ts).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}):'';
  });
  var active=document.querySelector('.tl-step.active');
  if(active&&active.scrollIntoView) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function _render(d){
  var status=d.status||'assigned';
  document.getElementById('hdrStatus').textContent=STATUS_LABELS[status]||status;
  document.getElementById('hdrOrder').textContent='Code: '+_code;

  var rider=d.riderInfo;
  if(rider){
    document.getElementById('riderName').textContent=(rider.firstName||'Rider')+' (your rider)';
    document.getElementById('riderRating').textContent=rider.rating?'★ '+parseFloat(rider.rating).toFixed(1):'';
    document.getElementById('riderVehicle').textContent=rider.vehicle||'';
    if(rider.photo) document.getElementById('riderAvatar').innerHTML='<img src="'+rider.photo+'" alt="Rider">';
  }

  var loc=d.riderLocation;
  if(loc&&loc.lat&&loc.lng){
    var ll=[loc.lat,loc.lng];
    _riderMarker().setLatLng(ll);
    if(!_destM) _map.panTo(ll,{animate:true});
    if(_destM){
      var dl=_destM.getLatLng();
      var km=HAV(loc.lat,loc.lng,dl.lat,dl.lng);
      var mins=Math.max(1,Math.round(km/0.45)); // ~27 km/h city average
      var arr=new Date(Date.now()+mins*60000);
      document.getElementById('etaArrVal').textContent=arr.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('etaDistVal').textContent=km.toFixed(1)+' km';
    }
  }

  // Timeline — only when the order doc is not already driving it (it is richer).
  if(!_orderId) _renderTimeline(TRIP_TO_STAGE[status]||'ready',null);

  if(status==='completed'){
    _unsubs.forEach(function(u){if(u)u();});_unsubs.length=0;
    document.getElementById('doneOverlay').classList.add('show');
  }
  // On first render hand off to real-time Firestore listeners
  if(!_realtimeSetup&&(d.riderId||d.tripId)){_realtimeSetup=true;_setupRealtime(d);}
}

function _share(){
  var url=location.href;
  if(navigator.share) navigator.share({title:'Track my SOKONI delivery',url:url}).catch(function(){});
  else if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){SK.dialog.alert('Link copied!');});
  else prompt('Copy tracking link:',url);
}

/* ── Real-time engine ── */
function _setupRealtime(d){
  var db=firebase.firestore();
  if(d.riderId){
    var locUnsub=db.collection('riderLocations').doc(d.riderId)
      .onSnapshot(function(snap){
        if(!snap.exists) return;
        var loc=snap.data();
        if(loc.lat&&loc.lng) _updateRiderPos(loc.lat,loc.lng,loc.bearing||null);
      },function(err){console.warn('[Track] loc listener:',err.message);});
    _unsubs.push(locUnsub);
  }
  if(d.tripId){
    var tripUnsub=db.collection('trips').doc(d.tripId)
      .onSnapshot(function(snap){
        if(!snap.exists) return;
        var trip=snap.data();
        _updateStatus(trip.status||'assigned',trip);
      },function(err){console.warn('[Track] trip listener:',err.message);});
    _unsubs.push(tripUnsub);
  }
  // Activate LIVE badge once listeners are open
  document.getElementById('liveBadge').classList.add('active');
}

function _animateMarker(marker,toLat,toLng){
  var from=marker.getLatLng();
  var steps=10,step=0;
  var dLat=(toLat-from.lat)/steps,dLng=(toLng-from.lng)/steps;
  var iv=setInterval(function(){
    step++;
    marker.setLatLng([from.lat+dLat*step,from.lng+dLng*step]);
    if(step>=steps) clearInterval(iv);
  },80);
}

function _updateRiderPos(lat,lng,bearing){
  var ll=[lat,lng];
  if(!_riderM){_riderMarker().setLatLng(ll);}
  else{_animateMarker(_riderM,lat,lng);}
  // Update bearing indicator
  if(bearing!=null){
    var el=_riderM&&_riderM.getElement?_riderM.getElement():null;
    if(el){var inner=el.querySelector('.rider-marker-inner');if(inner)inner.style.setProperty('--bearing',bearing+'deg');}
  }
  if(!_destM) _map.panTo(ll,{animate:true});
  if(_destM){
    var dl=_destM.getLatLng();
    var km=HAV(lat,lng,dl.lat,dl.lng);
    var mins=Math.max(1,Math.round(km/0.45));
    var arr=new Date(Date.now()+mins*60000);
    document.getElementById('etaArrVal').textContent=arr.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('etaDistVal').textContent=km.toFixed(1)+' km';
  }
}

function _updateStatus(status,trip){
  if(status===_lastStatus) return;
  _lastStatus=status;
  document.getElementById('hdrStatus').textContent=STATUS_LABELS[status]||status;
  // Update destination marker from trip if available
  if(!_destM&&trip&&trip.dropoffLat&&trip.dropoffLng){
    _destM=L.circleMarker([trip.dropoffLat,trip.dropoffLng],{radius:10,fillColor:'#71ff00',color:'#000',weight:2,fillOpacity:.9}).addTo(_map);
  }
  if(!_orderId) _renderTimeline(TRIP_TO_STAGE[status]||'ready',null);
  if(status==='completed'){
    _unsubs.forEach(function(u){if(u)u();});_unsubs.length=0;
    document.getElementById('doneOverlay').classList.add('show');
  }
}

/* ── Order journey (?order=) ──────────────────────────────────────────────
   The notification deep-link is /track?order=<id>. This is the buyer's own
   order, so it is read directly and in real time — no callable, no polling.
   Firestore rules decide whether the reader owns it; an unauthorised read
   surfaces as an explicit "can't show this order" rather than a blank page.

   If the order carries a trackingCode we ALSO start the trip/map flow, so the
   map and the journey are the same screen. If it does not (not dispatched yet)
   the timeline stands on its own — which is exactly the early half of an order,
   where the customer has the least information and asks the most questions. */
function _watchOrder(orderId){
  var ref=firebase.firestore().collection('orders').doc(orderId);
  var unsub=ref.onSnapshot(function(snap){
    document.getElementById('loadScreen').style.display='none';
    if(!snap.exists){ _fatal('Order not found','Check the link in your confirmation message.'); return; }
    var o=snap.data()||{};

    var stage=o.timelineStage||'received';
    var stamps={};
    (o.timeline||[]).forEach(function(e){ if(e&&e.key) stamps[e.key]=e.at; });
    _renderTimeline(stage,stamps);

    /* Secure Delivery Authorization — show the buyer's delivery PIN until the order
       is delivered.

       The plaintext used to sit on this order document, and the comment here used to
       say "the rider never sees it". That was wrong: firestore.rules grants the
       assigned rider a full-document read on orders, so the rider read it too. The
       value now lives in `deliveryPins`, which no client can read, and this screen
       asks the server for it — getMyDeliveryPin proves buyer identity and refuses the
       assigned rider. Fetched once per order, never cached to storage. */
    var _pinBox=document.getElementById('pinBox');
    if(_pinBox){
      var _delivered=(stage==='delivered'||stage==='completed');
      if(o.deliveryPinIssued && !_delivered){
        _pinBox.style.display='';
        if(_pinBox.__forOrder!==_orderId){
          _pinBox.__forOrder=_orderId;
          document.getElementById('pinCode').textContent='· · · · · ·';
          (async function(){
            try{
              var r=await _cf('getMyDeliveryPin')({orderId:_orderId});
              var p=r&&r.data&&r.data.pin;
              /* No PIN is a real answer (none issued yet) — say nothing rather than
                 render an empty box that looks like a loading failure. */
              if(p){ document.getElementById('pinCode').textContent=String(p).split('').join(' '); }
              else { _pinBox.style.display='none'; }
            }catch(e){
              document.getElementById('pinCode').textContent='—';
              console.warn('[track] delivery PIN unavailable:',e&&e.message);
            }
          })();
        }
      } else {
        _pinBox.style.display='none';
        _pinBox.__forOrder=null;
      }
      /* Wire the fallback once. It calls the server, which re-checks that this caller is
         the buyer — the button is a convenience, never the authorisation. */
      var _bcBtn=document.getElementById('buyerConfirmBtn');
      if(_bcBtn && !_bcBtn.__wired){
        _bcBtn.__wired=true;
        _bcBtn.onclick=async function(){
          var _msg=document.getElementById('buyerConfirmMsg');
          _bcBtn.disabled=true; _msg.textContent='Confirming…';
          try{
            var _fn=(window.firebaseFunctions&&window.firebaseFunctions.httpsCallable)
              ? window.firebaseFunctions.httpsCallable('buyerConfirmDelivery') : null;
            if(!_fn){ _msg.textContent='Cannot reach the server. Check your connection.'; _bcBtn.disabled=false; return; }
            var _r=await _fn({orderId:orderId});
            if(_r&&_r.data&&_r.data.ok){ _msg.textContent='✅ Thank you — delivery confirmed.'; }
            else { _msg.textContent='Could not confirm. Please try again.'; _bcBtn.disabled=false; }
          }catch(e){
            _msg.textContent=(e&&(e.message||e.code))||'Could not confirm. Please try again.';
            _bcBtn.disabled=false;
          }
        };
      }
    }

    var st=STAGES[STAGE_IDX[stage]];
    document.getElementById('hdrStatus').textContent=st?st.i+' '+st.l:stage;
    document.getElementById('hdrOrder').textContent='Order '+orderId;

    document.getElementById('liveBadge').classList.add('active');

    if(stage==='delivered'||stage==='completed'){
      document.getElementById('doneOverlay').classList.add('show');
    }

    /* Hand off to the map once a rider actually exists. Once only. */
    if(!_realtimeSetup&&o.trackingCode&&!_code){
      _code=String(o.trackingCode).toUpperCase().trim();
      _poll();
    }
  },function(err){
    _fatal('Can’t show this order', err.code==='permission-denied'
      ? 'Sign in with the account that placed it.' : err.message);
  });
  _unsubs.push(unsub);
}

function _fatal(title,detail){
  document.getElementById('loadScreen').style.display='flex';
  document.getElementById('loadScreen').innerHTML=
    '<div style="text-align:center;padding:24px"><p style="font-size:18px;margin-bottom:8px">⚠ '+title+'</p>'+
    '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:14px">'+detail+'</p>'+
    '<a href="profile.html" style="display:inline-block;padding:12px 24px;background:#71ff00;color:#000;border-radius:10px;font-weight:700;text-decoration:none">My Orders</a></div>';
}

/* ── Bootstrap ── */
(function(){
  var p=new URLSearchParams(location.search);
  _orderId=(p.get('order')||'').trim();
  _code=(p.get('code')||p.get('t')||'').toUpperCase().trim();

  _buildTimeline();

  /* An order id is the richer signal — the full 11-stage journey. A tracking code
     alone still works: it is the shareable link, and it needs no sign-in. */
  if(_orderId){ _watchOrder(_orderId); return; }

  if(!_code||_code.length!==8){
    _fatal('Invalid tracking link','Check the link in your confirmation message.');
    return;
  }
  _poll(); // single initial load; real-time takes over via _setupRealtime()
})();
</script>
</body>
</html>
