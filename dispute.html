<!DOCTYPE html>
<html lang="en" data-no-header="true">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <script src="security.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SOKONI — Dispute Resolution</title>
  <meta name="description" content="Raise and resolve order disputes on SOKONI. Our team helps protect buyers and sellers.">
  <meta property="og:title" content="SOKONI — Dispute Resolution">
  <meta property="og:description" content="Raise a dispute and get fair resolution from the SOKONI team.">
  <meta property="og:image" content="https://mysokoni.co.ke/assets/logosokoni.png">
  <!--
    dispute.html — a ROUTER since 2026-09-29.

    This page used to be a second, client-only dispute form: it listed orders from localStorage (`sokoniOrders`),
    invented a "DSP…" reference, showed "submitted" whatever happened, kept its history in localStorage
    (`sokoniDisputes`) and wrote a raw `disputes` document with no buyerId / sellerId — so the seller's
    getSellerDisputes never returned it, and AdminOS could not name either party.

    Disputes have ONE path: dispute-portal.html → createDispute (functions/disputes.js: the order must be the
    caller's, one dispute per order, the seller derived from the order). Every link here (index, help, legal,
    emails: dispute.html?order=…) keeps working; the order id is carried across.
  -->
  <meta http-equiv="refresh" content="3;url=dispute-portal.html">
  <style>
    :root{--bg:#050505;--card:#0d0d0d;--txt:#f4f4f4;--txt2:#a8a8a8;--acc:#71ff00;--line:rgba(255,255,255,.09)}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;box-sizing:border-box}
    .card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
    .ico{font-size:40px}
    h1{font-size:20px;margin:10px 0 6px}
    p{color:var(--txt2);margin:0 0 16px}
    a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--acc);color:#000;font-weight:800;text-decoration:none}
    a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <div class="ico" aria-hidden="true">⚖️</div>
    <h1>SOKONI Buyer Protection</h1>
    <p>Taking you to the dispute centre, where you raise a dispute on your order and follow it to a decision.</p>
    <a class="btn" id="go" href="dispute-portal.html">Open the dispute centre</a>
  </main>
  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var oid = (q.get('order') || q.get('orderId') || '').trim().slice(0, 128);
    var url = 'dispute-portal.html' + (oid && /^[A-Za-z0-9_-]+$/.test(oid) ? '?orderId=' + encodeURIComponent(oid) : '');
    document.getElementById('go').setAttribute('href', url);
    location.replace(url);
  })();
  </script>
  <script src="sw-register.js" defer></script>
</body>
</html>
